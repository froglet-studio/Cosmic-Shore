body{margin:0;background:#00010A}
.sl{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.slf{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.sls{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.oct{clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%)}
.hex{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.lab{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#747BAD}
.btn{appearance:none;border:0;padding:1px;cursor:pointer;background:var(--bc);font-family:'Chakra Petch',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.08em;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn>span{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--bf);color:var(--bt);padding:9px 16px;font-size:14px;white-space:nowrap;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn.big>span{padding:14px 28px;font-size:18px}
.btn:focus,.card:focus,.tile:focus{outline:none}
.btn:disabled{cursor:default}
.card,.tile{appearance:none;cursor:pointer;font:inherit;color:inherit;border:0;text-align:left;padding:0}
.tab{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:18px;letter-spacing:.08em}
.num{font-variant-numeric:tabular-nums}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#434C89 transparent}
@keyframes csRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes csDrop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes csFade{from{opacity:0}to{opacity:1}}
@keyframes csGrowX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes csGrowY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes csSparkX{from{left:-48px}to{left:100%}}
@keyframes csSparkY{from{top:-36px}to{top:100%}}
@keyframes csFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes csSweep{0%{left:-80px}55%,100%{left:110%}}
@keyframes csPan{from{transform:scale(1.04) translate(-1%,0)}to{transform:scale(1.09) translate(1.2%,-1%)}}
@keyframes csBlink{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes csPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes csGlow{0%,100%{box-shadow:0 0 18px rgba(153,255,128,.22)}50%{box-shadow:0 0 34px rgba(153,255,128,.5)}}

@keyframes csSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes csSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes csDrain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes csCeremony{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.tile,.card{transition:filter 120ms ease-out}
.tile:hover,.card:hover{filter:brightness(1.18)}
.grid{background-color:#00041F;background-image:linear-gradient(#0A0F33 1px,transparent 1px),linear-gradient(90deg,#0A0F33 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.slx{clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
@keyframes csCount{0%{opacity:0;transform:scale(1)}3%{opacity:1}18%{opacity:1;transform:scale(1.25)}25%{opacity:0;transform:scale(1.5)}100%{opacity:0;transform:scale(1.5)}}
@keyframes csPunchA{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes csPunchB{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes csSlideIn{from{opacity:0;transform:translateX(-120px)}to{opacity:1;transform:none}}
@keyframes csBanner{0%{opacity:0;transform:scaleX(.3)}60%{opacity:1;transform:scaleX(1.03)}100%{opacity:1;transform:scaleX(1)}}
@keyframes csReveal{0%{opacity:0;transform:scale(.85)}45%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes csTextSweep{0%{left:-30%}100%{left:130%}}
@keyframes csTick{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}

@keyframes lvA{0%,100%{transform:translate(-18px,-10px) scale(1)}33%{transform:translate(22px,14px) scale(1.25)}66%{transform:translate(-6px,22px) scale(.85)}}
@keyframes lvB{0%,100%{transform:translate(20px,18px) scale(1.1)}40%{transform:translate(-24px,-8px) scale(.8)}75%{transform:translate(10px,-20px) scale(1.3)}}
@keyframes lvC{0%,100%{transform:translate(0,24px) scale(.9)}50%{transform:translate(0,-22px) scale(1.2)}}
@keyframes lvEdge{0%,100%{filter:drop-shadow(0 0 2px var(--g)) drop-shadow(0 0 6px var(--g))}50%{filter:drop-shadow(0 0 5px var(--g)) drop-shadow(0 0 14px var(--g))}}
@keyframes lvHue{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
</style>
