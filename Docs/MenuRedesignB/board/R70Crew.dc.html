<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rev 70 Crew - A's Ark crew: press a seat's vessel and the Hangar's vessel strip opens on that seat; one press picks the hull - interactive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Aldrich&amp;family=Chakra+Petch:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#00010A}
.abs{position:absolute}
.lab{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#747BAD}
.cap{font-family:'Chakra Petch',sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
.sl{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.sls{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;padding:0 6px;box-sizing:border-box;border:1px solid #434C89;font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:14px;color:#E6E9FF}
.btn{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:12px;height:56px;padding:0 26px;white-space:nowrap;border:0;cursor:pointer;text-decoration:none;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:18px;letter-spacing:.14em;text-transform:uppercase;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn.sm{height:44px;padding:0 18px;font-size:14px}
.commit{background:#A600FF;color:#FFFFFF}
.cta{background:#99FF80;color:#00041F}
.def{background:rgba(0,4,31,.78);color:#E6E9FF;box-shadow:inset 0 0 0 1px #747BAD}
.btn .kc{border-color:currentColor;color:inherit}
.pick{background:none;border:0;padding:0;margin:0;cursor:pointer;color:inherit;font:inherit;text-align:left}
.btn:focus-visible,.pick:focus-visible{outline:2px solid #00D4FF;outline-offset:3px}
.glass{background:rgba(0,4,31,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hull{mix-blend-mode:screen;object-fit:contain}
.set::before{content:attr(data-l);display:block;font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#747BAD;margin-bottom:4px}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #00041F; color: #E6E9FF; font-family: 'Aldrich', 'Chakra Petch', sans-serif">
<img src="{{room}}" alt="Inside the Ark, your squad's room" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"><div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(0,1,10,.75) 0%,rgba(0,1,10,.55) 30%,rgba(0,1,10,.6) 70%,rgba(0,1,10,.88) 100%)"></div><nav aria-label="Menu screens" class="abs" style="left:0;right:0;top:0;height:84px;background:rgba(0,1,10,.82);display:flex;align-items:center;justify-content:center;gap:48px;z-index:5"><span class="kc">LT</span><span style="position:relative;display:flex;align-items:center;gap:10px;font-family:'Chakra Petch';font-weight:600;font-size:18px;letter-spacing:.12em;color:#747BAD"><img src="/_blob/ec690d6b90d6fcdbc430b9bbaacf28a9" alt="" style="width:26px;height:26px;object-fit:contain;opacity:0.7">CODEX</span><span style="position:relative;display:flex;align-items:center;gap:10px;font-family:'Chakra Petch';font-weight:600;font-size:18px;letter-spacing:.12em;color:#747BAD"><img src="/_blob/34f5a50f1275fef42808fe9df3bf6af5" alt="" style="width:26px;height:26px;object-fit:contain;opacity:0.7">HANGAR</span><span style="position:relative;display:flex;align-items:center;gap:10px;font-family:'Chakra Petch';font-weight:600;font-size:18px;letter-spacing:.12em;color:#E6E9FF"><img src="/_blob/a5bd4d8d1de7b494567fc3de75525e1e" alt="" style="width:26px;height:26px;object-fit:contain;opacity:1">HOME<span class="abs" style="left:0;right:0;bottom:-12px;height:2px;background:#E6E9FF"></span></span><span style="position:relative;display:flex;align-items:center;gap:10px;font-family:'Chakra Petch';font-weight:600;font-size:18px;letter-spacing:.12em;color:#747BAD"><img src="/_blob/e5b050c5a676193c650e94d873ad40e2" alt="" style="width:26px;height:26px;object-fit:contain;opacity:0.7">ARK</span><span style="position:relative;display:flex;align-items:center;gap:10px;font-family:'Chakra Petch';font-weight:600;font-size:18px;letter-spacing:.12em;color:#747BAD"><img src="/_blob/d0e850bc927559f1a499868d26f2a3de" alt="" style="width:26px;height:26px;object-fit:contain;opacity:0.7">PORT</span><span class="kc">RT</span></nav><div class="abs" style="left:40px;right:40px;top:100px;height:52px;display:flex;align-items:center;justify-content:space-between;z-index:4"><div style="display:flex;align-items:center;gap:32px"><span class="kc">LB</span><span class="cap" style="position:relative;display:flex;align-items:center;gap:8px;font-size:18px;color:#E6E9FF">Voyages<span class="abs" style="left:0;right:0;bottom:-16px;height:2px;background:#E6E9FF"></span></span><span class="cap" style="position:relative;display:flex;align-items:center;gap:8px;font-size:18px;color:#747BAD">Saga</span><span class="cap" style="position:relative;display:flex;align-items:center;gap:8px;font-size:18px;color:#747BAD"><svg width="14" height="16" viewBox="0 0 14 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 7V5a4 4 0 018 0v2"></path><path d="M1.5 7h11v8h-11z"></path></svg>Episodes</span><span class="kc">RB</span></div><a class="btn sm def" href="R70A.dc.html"><span class="kc">B</span>Voyage</a></div><div class="abs" style="left:40px;top:180px;right:40px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:22px"><span style="font-size:36px">{{name}}</span>
<sc-for list="{{domains}}" as="d" hint-placeholder-count="3"><button class="pick sls" type="button" aria-pressed="{{d.pressed}}" onClick="{{d.pick}}" style="padding:10px 18px;background:rgba(0,4,31,.7);box-shadow:{{d.edge}};font-family:'Chakra Petch';font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:{{d.col}}">{{d.name}}</button></sc-for></div>
<span class="glass sls" style="padding:12px 18px;font-size:18px">{{pinned}}</span>
</div>
<div class="abs" style="left:40px;top:262px;width:1840px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px">
<sc-for list="{{seats}}" as="s" hint-placeholder-count="3"><div class="glass sl" style="height:440px;box-sizing:border-box;padding:22px 24px;box-shadow:{{s.edge}};font-family:'Chakra Petch';font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#747BAD">{{s.head}}<img class="hull" src="{{s.hull}}" alt="{{s.v}}" style="display:block;width:100%;height:170px;margin:14px 0 8px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><sc-for list="{{s.settings}}" as="g" hint-placeholder-count="4"><button class="pick set sls" type="button" data-l="{{g.label}}" onClick="{{g.press}}" style="padding:14px 16px;background:rgba(0,4,31,.62);box-shadow:{{g.edge}};font-family:'Aldrich';font-size:18px;letter-spacing:0;text-transform:none;color:{{g.col}}">{{g.value}}</button></sc-for></div>
</div></sc-for>
</div>
<sc-if value="{{strip.open}}" hint-placeholder-val="{{ true }}"><div class="abs glass sl" style="left:40px;top:730px;width:1840px;height:220px;box-sizing:border-box;padding:18px 24px;box-shadow:inset 0 0 0 1px #00D4FF;font-family:'Chakra Petch';font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#E6E9FF">{{strip.caption}}<div style="display:flex;gap:16px;margin-top:14px"><sc-for list="{{strip.items}}" as="t" hint-placeholder-count="6"><button class="pick sls" type="button" onClick="{{t.pick}}" aria-label="{{t.name}}" aria-pressed="{{t.pressed}}" style="flex:1;height:140px;display:flex;align-items:center;justify-content:center;box-shadow:{{t.edge}}"><img class="hull" src="{{t.img}}" alt="{{t.name}}" style="width:{{t.w}};height:{{t.h}}"></button></sc-for></div></div></sc-if>
<sc-if value="{{strip.shut}}" hint-placeholder-val="{{ false }}"><a class="btn cta abs" href="#" style="right:40px;top:980px"><span class="kc">Y</span>Save squad</a></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
const V = [{"n": 1, "title": "Carry sealed news to Tollmoor", "place": "Tollmoor", "min": "27 min", "ly": "540 ly", "i": 1, "crew": "Merrin Tal", "line": "Reach Tollmoor with the Ark standing. The news aboard will change what Tollmoor knows.", "placeLine": "A toll port on the edge of Tumult's bubble. The dock crews hear everything first.", "wps": 2, "map": "/_blob/9778fd69fcae1f8cb003a9bbd8508a56", "pos": "62% 58%", "thumbPos": "62% 58%"}, {"n": 2, "title": "Open the vaults at Lantern Reach", "place": "Lantern Reach", "min": "29 min", "ly": "580 ly", "i": 2, "crew": "Oriel Vance", "line": "Crack a vault with a payload, carry its artifact back to the Ark and stow it.", "placeLine": "Super-shielded shells drift in a lit shoal, each with an artifact inside.", "wps": 7, "map": "/_blob/b96bc9cef23de987e4ed42294befc28a", "pos": "38% 46%", "thumbPos": "38% 46%"}, {"n": 3, "title": "Raid the thieves' cache at Gallowglass", "place": "Gallowglass", "min": "47 min", "ly": "940 ly", "i": 2, "crew": "Cass Morrow", "line": "Take what the thieves took from their hold in the reefs, and stow it before they notice.", "placeLine": "The thieves' hold in the reefs toward the centre.", "wps": 2, "map": "/_blob/037d66eeef857313705b96448c91f4a0", "pos": "50% 40%", "thumbPos": "50% 40%"}, {"n": 4, "title": "Hunt the creature in The Maw", "place": "The Maw", "min": "49 min", "ly": "980 ly", "i": 3, "crew": "Brisk Amadou", "line": "Something big feeds in The Maw. Find it, bring it down, bring back what it carried.", "placeLine": "A dark gulf where the sea runs thick and the big feeders hunt.", "wps": 2, "map": "/_blob/da47aa2e4c65d63e53711ebfe6fc4ac2", "pos": "48% 38%", "thumbPos": "48% 38%"}];
const SQ = [{"name": "Skim Wing", "dom": "Jade", "mine": true, "owner": "", "seats": [{"role": "Leader", "who": "You", "v": "Sparrow", "p": "Shrapnel", "e": "Charge", "a": "Extra Bay"}, {"role": "Rogue One", "who": "Halcyon", "v": "Dolphin", "p": "Riptide", "e": "Space", "a": "Seed Pod"}, {"role": "Rogue Two", "who": "AI wingmate", "v": "Squirrel", "p": "Trace", "e": "Time", "a": "No artifact"}]}, {"name": "Breakers", "dom": "Ruby", "mine": false, "owner": "Kestrel", "seats": [{"role": "Leader", "who": "Kestrel", "v": "Rhino", "p": "Tomahawk", "e": "Mass", "a": "Long Edge"}, {"role": "Rogue One", "who": "You", "v": "Manta", "p": "Reaper", "e": "Charge", "a": "Tailwind"}, {"role": "Rogue Two", "who": "AI wingmate", "v": "Serpent", "p": "Scales", "e": "Space", "a": "No artifact"}]}];
const HULL = {"Sparrow": "/_blob/a2a4139d8e2822885778740d4f2fb92e", "Dolphin": "/_blob/e4ebf079ba441cd7141a2c8bc092d8ea", "Squirrel": "/_blob/694ae84ec6db347c4f034c8e03b56991", "Rhino": "/_blob/48e972fa9d369a737bacf39f37baf59f", "Manta": "/_blob/ab51cbb598b5a1e912416244829d134c", "Serpent": "/_blob/215e6ad15de9f075e7a45e7640a12f09"};
const ROOM = {"Jade": "/_blob/c2a9b2634cf0ccae357e84f5a3ff5917", "Ruby": "/_blob/cd2a783f5d168b8a448e948e3d67122a", "Gold": "/_blob/48075ef29368f88768c579631ceb3f3d"};
const DOMC = {"Jade": "#21C0BD", "Ruby": "#BD1BC8", "Gold": "#FF8F11"};
const PILOT = {"Shrapnel": "/_blob/109d50c83786e87bc77b272531aadd87", "Feist": "/_blob/4f08e5dc0445758132618029646325ef", "Longshift": "/_blob/a31623aedd55f09eb0f08c21b3f141da", "Flux": "/_blob/858b88d97e9cf77b716845a5c67979fa"};
const ELEMENT = {"Charge": "/_blob/1c70115a6fb1a56b2e125564d0300b98", "Mass": "/_blob/10bf4fb3c4924a10f0e5d5a1f71924a5", "Space": "/_blob/eea67d233893eb4fe28dfeb466d29b04", "Time": "/_blob/6af82be95fa71d9b3add315514cfd089"};
const ARTIFACTS = ["No artifact", "Extra Bay", "Seed Pod", "Tailwind", "Long Edge"];
const HULLS = ['Sparrow', 'Dolphin', 'Squirrel', 'Rhino', 'Manta', 'Serpent'];
const LABELS = ['Vessel', 'Pilot', 'Element', 'Artifact'];
const KEYS = ['v', 'p', 'e', 'a'];
class Component extends DCLogic {
constructor(p) { super(p); this.state = { seats: SQ[0].seats.map((s) => Object.assign({}, s)), dom: 'Jade', open: { seat: 1, set: 0 } }; }
renderVals() {
  const st = this.state, o = st.open;
  const setSeat = (i, k, val) => { const seats = st.seats.map((s, j) => j === i ? Object.assign({}, s, { [k]: val }) : s); this.setState({ seats, open: null }); };
  const seats = st.seats.map((s, i) => ({ v: s.v, hull: HULL[s.v],
    head: '0' + (i + 1) + ' ' + s.role + ' - ' + s.who,
    edge: o && o.seat === i ? 'inset 0 0 0 2px #00D4FF' : 'inset 0 0 0 1px rgba(116,123,173,.45)',
    settings: KEYS.map((k, j) => { const on = o && o.seat === i && o.set === j; return { label: LABELS[j], value: s[k],
      col: s[k] === 'No artifact' ? '#747BAD' : '#E6E9FF',
      edge: on ? 'inset 0 0 0 2px #00D4FF' : 'inset 0 0 0 1px rgba(116,123,173,.35)',
      press: () => this.setState({ open: on ? null : { seat: i, set: j } }) }; }) }));
  let strip = { open: false, shut: true, caption: '', items: [] };
  if (o) {
    const s = st.seats[o.seat], k = KEYS[o.set];
    let items;
    if (o.set === 0) items = HULLS.map((h) => ({ name: h, img: HULL[h], w: '200px', h: '120px' }));
    else if (o.set === 1) items = Object.keys(PILOT).map((n) => ({ name: n, img: PILOT[n], w: '96px', h: '122px' }));
    else if (o.set === 2) items = Object.keys(ELEMENT).map((n) => ({ name: n, img: ELEMENT[n], w: '72px', h: '72px' }));
    else items = ARTIFACTS.map((n) => ({ name: n, img: '', w: '0px', h: '0px' }));
    items = items.map((t) => Object.assign(t, { pressed: s[k] === t.name ? 'true' : 'false',
      edge: s[k] === t.name ? 'inset 0 0 0 2px #00D4FF' : 'none', pick: () => setSeat(o.seat, k, t.name) }));
    strip = { open: true, shut: false, caption: s.role + ' - ' + LABELS[o.set] + ': one press picks', items };
  }
  const domains = ['Jade', 'Ruby', 'Gold'].map((d) => ({ name: d, pressed: d === st.dom ? 'true' : 'false', col: d === st.dom ? '#E6E9FF' : '#747BAD',
    edge: 'inset 3px 0 0 ' + DOMC[d] + (d === st.dom ? ', inset 0 0 0 1px #00D4FF' : ', inset 0 0 0 1px rgba(116,123,173,.45)'),
    pick: () => this.setState({ dom: d }) }));
  const v = V[1];
  return { name: SQ[0].name, room: ROOM[st.dom], domains, seats, strip,
    pinned: 'Voyage ' + v.n + ' - ' + v.title + ' - ' + v.ly };
}
}
</script>
</body>
</html>
