<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rev 62 F - At a porthole</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Aldrich&amp;family=Chakra+Petch:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#00010A}
.lab{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#8C93C7;text-shadow:0 0 8px rgba(0,1,10,.95),0 1px 2px rgba(0,1,10,.95)}
.cap{font-family:'Chakra Petch',sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
.abs{position:absolute}
.sl{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.sls{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 6px;box-sizing:border-box;border:1px solid #434C89;font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:12px;color:#C9CDEA}
.btn{box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 20px;white-space:nowrap;border:0;cursor:pointer;font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:18px;letter-spacing:.1em;text-transform:uppercase}
.btn.sm{height:40px;padding:0 14px;font-size:14px}
.commit{background:#A600FF;color:#E6E9FF}
.cta{background:#99FF80;color:#00010A}
.def{background:rgba(0,4,31,.55);color:#E6E9FF;box-shadow:inset 0 0 0 1px #747BAD}
.off{background:rgba(0,4,31,.4);color:#5C5F70;box-shadow:inset 0 0 0 1px #222645}
.btn .kc{border-color:currentColor;color:inherit;opacity:.85}
.btn:focus-visible,.pick:focus-visible{outline:2px solid #00D4FF;outline-offset:2px}
.pick{background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit;text-align:left}
.glass{background:rgba(0,4,31,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 900ms ease-in-out}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #00041F; color: #E6E9FF; font-family: 'Aldrich', 'Chakra Petch', sans-serif">
<sc-for list="{{layers}}" as="l" hint-placeholder-count="3"><img class="bg" src="{{l.src}}" alt="{{l.alt}}" style="opacity:{{l.op}}"></sc-for><div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(0,1,10,.75) 0%,rgba(0,1,10,0) 22%,rgba(0,1,10,0) 70%,rgba(0,1,10,.7) 100%);pointer-events:none"></div><nav aria-label="Menu screens" class="abs" style="left:0;right:0;top:0;height:84px;background:rgba(0,1,10,.78);border-bottom:1px solid #222645;display:flex;align-items:center;justify-content:center;gap:48px;z-index:5"><span class="kc">LT</span><span style="position:relative;display:flex;align-items:center;gap:10px;font-family:'Chakra Petch';font-weight:600;font-size:17px;letter-spacing:.12em;color:#747BAD"><img src="/_blob/ec690d6b90d6fcdbc430b9bbaacf28a9" alt="" style="width:26px;height:26px;object-fit:contain;opacity:0.7">CODEX</span><span style="position:relative;display:flex;align-items:center;gap:10px;font-family:'Chakra Petch';font-weight:600;font-size:17px;letter-spacing:.12em;color:#747BAD"><img src="/_blob/34f5a50f1275fef42808fe9df3bf6af5" alt="" style="width:26px;height:26px;object-fit:contain;opacity:0.7">HANGAR</span><span style="position:relative;display:flex;align-items:center;gap:10px;font-family:'Chakra Petch';font-weight:600;font-size:17px;letter-spacing:.12em;color:#747BAD"><img src="/_blob/a5bd4d8d1de7b494567fc3de75525e1e" alt="" style="width:26px;height:26px;object-fit:contain;opacity:0.7">HOME</span><span style="position:relative;display:flex;align-items:center;gap:10px;font-family:'Chakra Petch';font-weight:600;font-size:17px;letter-spacing:.12em;color:#E6E9FF"><img src="/_blob/e5b050c5a676193c650e94d873ad40e2" alt="" style="width:26px;height:26px;object-fit:contain;opacity:1">ARK<span class="abs" style="left:0;right:0;bottom:-10px;height:2px;background:#E6E9FF"></span></span><span style="position:relative;display:flex;align-items:center;gap:10px;font-family:'Chakra Petch';font-weight:600;font-size:17px;letter-spacing:.12em;color:#747BAD"><img src="/_blob/d0e850bc927559f1a499868d26f2a3de" alt="" style="width:26px;height:26px;object-fit:contain;opacity:0.7">PORT</span><span class="kc">RT</span></nav><div class="abs num" style="right:40px;top:30px;z-index:6;display:flex;align-items:center;gap:8px;font-size:20px;color:#FFAE00"><span style="width:14px;height:18px;background:#FFAE00;clip-path:polygon(50% 0,100% 35%,50% 100%,0 35%)"></span>1,240</div><div class="abs" style="left:40px;right:40px;top:96px;height:52px;display:flex;align-items:center;gap:30px;border-bottom:1px solid rgba(116,123,173,.35);z-index:4"><span class="kc">LB</span><span><span class="cap" style="font-size:16px;color:#747BAD">Converter</span></span><span style="position:relative"><span class="cap" style="font-size:16px;color:#E6E9FF">Squads</span><span class="abs" style="left:0;right:0;bottom:-15px;height:2px;background:#E6E9FF"></span></span><span><span class="cap" style="font-size:16px;color:#747BAD">Artifacts</span></span><button class="pick" type="button" onClick="{{tabDecor}}" style="display:flex;align-items:center;gap:8px;color:#5C5F70"><svg width="12" height="14" viewBox="0 0 14 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 7V5a4 4 0 018 0v2"></path><path d="M1.5 7h11v8h-11z"></path></svg><span class="cap" style="font-size:16px;color:#5C5F70">Decor</span></button><span class="kc">RB</span></div><div class="abs" style="right:40px;top:172px;width:470px"><div style="display:flex;flex-direction:column;gap:6px"><span class="lab">{{kicker}}</span><span style="display:flex;align-items:center;gap:14px"><span style="width:12px;height:12px;transform:rotate(45deg);background:{{dc}}"></span><span style="font-size:34px;line-height:1.05">{{name}}</span></span><span style="font-size:15px;color:#9AA0CC">{{line}}</span></div></div><div class="abs" style="left:40px;top:172px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:8px"><span class="lab" style="font-size:12px;margin-right:6px">Squads</span><sc-for list="{{squads}}" as="s" hint-placeholder-count="2"><button class="pick sls glass" type="button" onClick="{{s.pick}}" style="display:flex;align-items:center;gap:8px;padding:8px 14px;box-shadow:inset 0 0 0 1px {{s.edge}}"><span style="width:8px;height:8px;transform:rotate(45deg);background:{{s.dot}}"></span><span class="cap" style="font-size:14px;color:{{s.col}}">{{s.name}}</span></button></sc-for><button class="pick sls glass" type="button" onClick="{{make}}" style="display:flex;align-items:center;gap:6px;padding:8px 14px;box-shadow:inset 0 0 0 1px rgba(116,123,173,.45);color:#9AA0CC"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 1v12M1 7h12"></path></svg><span class="cap" style="font-size:14px">Make</span></button><button class="pick sls glass" type="button" onClick="{{join}}" style="padding:8px 14px;box-shadow:inset 0 0 0 1px rgba(116,123,173,.45)"><span class="cap" style="font-size:14px;color:#9AA0CC">Join a friend</span></button></div><div style="display:flex;align-items:center;gap:8px"><span class="lab" style="font-size:12px;margin-right:6px">Domain</span><sc-for list="{{domains}}" as="d" hint-placeholder-count="3"><button class="pick sls glass" type="button" aria-pressed="{{d.pressed}}" onClick="{{d.pick}}" style="display:flex;align-items:center;gap:8px;padding:8px 14px;box-shadow:inset 0 0 0 1px {{d.edge}}"><span style="width:9px;height:9px;transform:rotate(45deg);background:{{d.dot}}"></span><span class="cap" style="font-size:14px;color:{{d.col}}">{{d.name}}</span></button></sc-for></div></div><div class="abs glass sls" style="left:40px;top:930px;padding:8px 14px;display:flex;align-items:center;gap:10px"><span class="lab" style="font-size:11px">Outside</span><span style="font-size:15px">The cell, through the glass</span></div><div class="abs" style="left:40px;right:40px;top:1004px;display:flex;justify-content:space-between;align-items:center"><div style="display:flex;align-items:center;gap:10px"><button class="btn sm def sls" type="button" onClick="{{edit}}"><span class="kc">X</span><span>Edit squad</span></button></div><div style="display:flex;align-items:center;gap:10px"><span class="lab" style="font-size:12px">Take this squad into</span><button class="btn off sl" type="button" onClick="{{mission}}"><svg width="12" height="14" viewBox="0 0 14 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 7V5a4 4 0 018 0v2"></path><path d="M1.5 7h11v8h-11z"></path></svg><span>Mission</span></button><button class="btn commit sl" type="button" onClick="{{arena}}"><span class="kc">A</span><span>Arena</span></button></div></div><div class="abs" style="right:40px;top:300px;width:470px;display:flex;flex-direction:column;gap:12px"><sc-for list="{{seats}}" as="s" hint-placeholder-count="3"><div role="group" aria-label="{{s.aria}}" class="sl glass" style="position:relative;width:470px;box-sizing:border-box;padding:16px 16px 14px 20px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 {{s.ringW}} {{s.ring}}"><span class="abs" style="left:0;top:14px;bottom:14px;width:3px;background:{{dc}}"></span><button class="pick" type="button" onClick="{{s.pick}}" style="display:flex;flex-direction:column;gap:6px;width:100%"><span style="display:flex;justify-content:space-between;width:100%"><span class="lab num" style="font-size:12px">{{s.num}} {{s.seat}}</span><span style="width:8px;height:8px;transform:rotate(45deg);background:{{s.mark}}"></span></span><span class="ell" style="font-size:21px;max-width:100%">{{s.who}}</span></button><sc-if value="{{s.filled}}" hint-placeholder-val="{{ true }}"><span style="display:flex;flex-direction:column;margin-top:4px"><span style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-top:1px solid rgba(116,123,173,.25)"><span class="lab" style="font-size:11px">Vessel</span><span class="ell" style="font-size:15px;color:#E6E9FF">{{s.v}}</span></span><span style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-top:1px solid rgba(116,123,173,.25)"><span class="lab" style="font-size:11px">Element</span><span class="ell" style="font-size:15px;color:#E6E9FF">{{s.e}}</span></span><span style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-top:1px solid rgba(116,123,173,.25)"><span class="lab" style="font-size:11px">Pilot</span><span class="ell" style="font-size:15px;color:#E6E9FF">{{s.p}}</span></span><span style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-top:1px solid rgba(116,123,173,.25)"><span class="lab" style="font-size:11px">Artifact</span><span class="ell" style="font-size:15px;color:{{s.aCol}}">{{s.a}}</span></span></span></sc-if><sc-if value="{{s.kept}}" hint-placeholder-val="{{ false }}"><span style="display:flex;flex-direction:column;gap:10px;margin-top:6px"><span style="font-size:15px;line-height:1.45;color:#9AA0CC">The seat is theirs. It stays kept until they come aboard.</span><span style="display:flex;gap:8px"><button class="btn sm cta sls" type="button" onClick="{{s.invite}}"><span class="kc">Y</span><span>Invite</span></button><button class="btn sm def sls" type="button" onClick="{{s.ai}}"><span>AI until then</span></button></span></span></sc-if></div></sc-for></div><sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="abs glass sls" role="status" style="right:40px;top:172px;width:440px;padding:14px 18px 14px 22px;z-index:9;display:flex;flex-direction:column;gap:4px"><span class="abs" style="left:0;top:12px;bottom:12px;width:3px;background:#E6E9FF"></span><span class="lab" style="font-size:12px">Squads</span><span style="font-size:16px;line-height:1.4">{{toast}}</span></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
const BG = {"Jade": "/_blob/75ff101eecbca83bee8367d8e4ca4eac", "Ruby": "/_blob/0cede152a03f2895b5699aa9c6598d52", "Gold": "/_blob/c4dcb35990d42f9ada8c45c236a79c68"};
const DOMC = {"Jade": "#21C0BD", "Ruby": "#BD1BC8", "Gold": "#FF8F11"};
const BOOK = [{"name": "Skim Wing", "dom": "Jade", "mine": true, "line": "Yours - one seat kept for a friend", "seats": [{"seat": "Leader", "who": "You", "v": "Sparrow", "e": "Charge", "p": "Shrapnel", "a": "Extra Bay"}, {"seat": "Rogue One", "who": "Halcyon", "v": "Dolphin", "e": "Space", "p": "Riptide", "a": "Seed Pod"}, {"seat": "Rogue Two", "kept": true, "for": "Mothwing"}]}, {"name": "Breakers", "dom": "Ruby", "mine": false, "owner": "Kestrel", "line": "Kestrel's squad - joined", "seats": [{"seat": "Leader", "who": "Kestrel", "v": "Rhino", "e": "Mass", "p": "Tomahawk", "a": "Long Edge"}, {"seat": "Rogue One", "who": "You", "v": "Manta", "e": "Charge", "p": "Reaper", "a": "Tailwind"}, {"seat": "Rogue Two", "who": "AI wingmate", "v": "Serpent", "e": "Space", "p": "Scales", "a": "No artifact"}]}];

class Component extends DCLogic {
 constructor(props) { super(props); this.state = { sq: 0, doms: BOOK.map((b) => b.dom), sel: 0, toast: '' }; this.t = null; }
 componentWillUnmount() { if (this.t) clearTimeout(this.t); }
 say(x) { if (this.t) clearTimeout(this.t); this.setState({ toast: x }); this.t = setTimeout(() => this.setState({ toast: '' }), 2600); }
 renderVals() {
  const st = this.state, q = BOOK[st.sq], dom = st.doms[st.sq], dc = DOMC[dom];
  const layers = ['Jade', 'Ruby', 'Gold'].map((d) => ({ src: BG[d], op: d === dom ? 1 : 0, alt: d === dom ? 'Inside the Ark, the squad lit ' + d : '' }));
  const seats = q.seats.map((s, i) => {
   const on = i === st.sel, kept = !!s.kept;
   return { num: '0' + (i + 1), seat: s.seat, who: kept ? 'Kept for ' + s.for : s.who, kept, filled: !kept,
    v: s.v || '', e: s.e || '', p: s.p || '', a: s.a || '', aCol: s.a === 'No artifact' ? '#5C5F70' : '#E6E9FF',
    ring: on ? '#00D4FF' : 'rgba(116,123,173,.45)', ringW: on ? '2px' : '1px', mark: on ? '#00D4FF' : 'transparent',
    tabCol: on ? '#E6E9FF' : '#747BAD', isSel: on, notSel: !on,
    aria: s.seat + ': ' + (kept ? 'kept for ' + s.for : s.who),
    pick: () => this.setState({ sel: i }),
    invite: () => this.say('Invite sent to ' + s.for + '. The seat stays theirs until they come aboard.'),
    ai: () => this.say('An AI wingmate sits here until ' + s.for + ' comes aboard.') };
  });
  const cur = seats[st.sel];
  const squads = BOOK.map((b, i) => ({ name: b.name, dot: DOMC[st.doms[i]], on: i === st.sq,
   edge: i === st.sq ? '#00D4FF' : 'rgba(116,123,173,.45)', col: i === st.sq ? '#E6E9FF' : '#9AA0CC',
   pick: () => this.setState({ sq: i, sel: 0, toast: '' }) }));
  const domains = ['Jade', 'Ruby', 'Gold'].map((k) => { const on = k === dom; return { name: k, dot: DOMC[k],
   edge: on ? '#00D4FF' : 'rgba(116,123,173,.45)', col: on ? '#E6E9FF' : '#9AA0CC', pressed: on ? 'true' : 'false',
   pick: () => { if (on) return; if (!q.mine) { this.say('Only ' + q.owner + ' changes the squad\'s domain.'); return; }
    const d = st.doms.slice(); d[st.sq] = k; this.setState({ doms: d }); } }; });
  return { layers, seats, cur, squads, domains, dom, dc, name: q.name, line: q.line,
   kicker: q.mine ? 'Your squad' : q.owner + '\'s squad', toast: st.toast, hasToast: st.toast !== '',
   prev: () => this.setState({ sel: (st.sel + 2) % 3 }), next: () => this.setState({ sel: (st.sel + 1) % 3 }),
   edit: () => this.say('Edit opens the seat picker.'), make: () => this.say('Make squad starts a new one.'),
   join: () => this.say('Join a friend\'s squad.'), mission: () => this.say('Mission is locked: finish Episode 1 first.'),
   arena: () => this.say('Taking ' + q.name + ' into the Arena, flying ' + dom + '.'), tabDecor: () => this.say('Not open yet.')  };
 }
}
</script>
</body>
</html>
