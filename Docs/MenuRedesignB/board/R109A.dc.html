<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rev 109 A - The tidestone: a slab of clear crystal, the crew glowing inside it, brass claws at its points (recommended)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Aldrich&amp;family=Chakra+Petch:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#00010A}
.lab{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#8A8FAE;text-shadow:0 0 8px rgba(0,1,10,.95),0 1px 2px rgba(0,1,10,.95)}
.cap{font-family:'Chakra Petch',sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.abs{position:absolute}
.sl{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.sls{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 6px;box-sizing:border-box;border:1px solid #434C89;font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:14px;color:#B8C0F0}
.pick{background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit;text-align:left}
.pick:focus-visible,.pbtn:focus-visible{outline:2px solid #00D4FF;outline-offset:2px}
.glass{background:rgba(0,4,31,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.scene{position:absolute;inset:0;transition:transform 520ms cubic-bezier(.22,.8,.25,1)}
.scr{position:absolute;left:0;top:0;width:1200px;height:870px;transform-origin:0 0;overflow:hidden;background:#00010A;color:#E6E9FF;font-family:'Aldrich','Chakra Petch',sans-serif}
.pbtn{box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:12px;height:72px;padding:0 30px;border:0;cursor:pointer;font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:28px;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,4,31,.7);color:#E6E9FF;box-shadow:inset 0 0 0 2px #747BAD}
.pbtn .kc{min-width:40px;height:34px;font-size:18px;border-color:currentColor;color:inherit}
.chip{position:relative;width:168px;height:214px}
.chip img{display:block;width:168px;height:168px;object-fit:cover}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #00041F; color: #E6E9FF; font-family: 'Aldrich', 'Chakra Petch', sans-serif">
<div class="scene">
<img class="abs" src="/_blob/fb9f84fa9d028d5044a9a2ec22d5990d" alt="A crew PDA cut from clear crystal, a long hexagon held at its points by brass claws, lying on the hangar&#x27;s workbench" style="left:0;top:0;width:1920px;height:1080px;object-fit:cover;transition:opacity 450ms ease-in-out;opacity:{{restOp}}">
<img class="abs" src="/_blob/b81defe8b95915cddde8ee30e56ca9ca" alt="The tidestone held up: the crew glowing inside the crystal, its brass claws either side" style="left:0;top:0;width:1920px;height:1080px;object-fit:cover;transition:opacity 450ms ease-in-out;opacity:{{leanOp}}">
<div class="scr" style="transform:{{mat}};transition:transform 450ms ease-in-out">
<div class="abs" style="left:0;right:0;top:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:2px solid #222645;background:#00041F">
<span class="cap" style="font-size:22px;color:#8A8FAE">{{headL}}</span><span class="cap" style="font-size:22px;color:#8A8FAE">{{headR}}</span></div>
<sc-if value="{{isRest}}" hint-placeholder-val="{{ true }}">
<img class="abs" src="{{close}}" alt="" style="left:70px;top:150px;width:470px;height:470px;object-fit:cover">
<div class="abs" style="left:600px;top:170px;width:560px;display:flex;flex-direction:column;gap:14px">
<span class="cap" style="font-size:28px;color:#8A8FAE">Last read</span>
<span class="cap" style="font-size:96px;line-height:1">{{cs}}</span>
<span style="font-size:40px;line-height:1.2">{{name}}</span>
<span style="font-size:28px;color:#B8C0F0;margin-top:26px">{{aboard}}</span>
</div>
<div class="abs" style="left:70px;right:70px;bottom:60px;height:96px;display:flex;align-items:center;justify-content:center;gap:18px;box-shadow:inset 0 0 0 3px #747BAD"><span class="kc" style="min-width:52px;height:44px;font-size:22px;border-color:#E6E9FF;color:#E6E9FF">A</span><span class="cap" style="font-size:40px">Pick up</span></div>
<button class="pick" type="button" aria-label="Pick up the crew PDA" onClick="{{pickUp}}" style="position:absolute;inset:0;z-index:3"></button>
</sc-if>
<sc-if value="{{isCrew}}" hint-placeholder-val="{{ false }}">
<div class="abs" style="left:38px;top:96px;width:1124px;display:flex;flex-wrap:wrap;gap:22px 23px">
<sc-for list="{{crew}}" as="c" hint-placeholder-count="18"><div class="chip"><button class="pick" type="button" aria-label="{{c.aria}}" onClick="{{c.pick}}" style="position:absolute;inset:0;z-index:2"></button><img src="{{c.img}}" alt="" style="box-shadow:0 0 0 2px {{c.ring}}"><span class="cap ell" style="display:block;margin-top:10px;font-size:20px;color:#E6E9FF">{{c.cs}}</span><span class="ell" style="display:block;font-size:15px;color:#8A8FAE;margin-top:2px">{{c.name}}</span></div></sc-for>
</div>
<span class="abs" style="left:38px;bottom:34px;font-size:20px;color:#747BAD">Tap a pilot to read their file.</span>
<button class="pbtn sls abs" type="button" onClick="{{down}}" style="right:34px;bottom:14px;height:62px"><span class="kc">B</span>Lay down</button>
</sc-if>
<sc-if value="{{isFile}}" hint-placeholder-val="{{ false }}">
<img class="abs" src="{{tall}}" alt="{{tallAlt}}" style="left:34px;top:92px;width:368px;height:460px;object-fit:cover">
<div class="abs" style="left:34px;top:568px;width:368px;display:flex;flex-direction:column;gap:12px">
<span class="cap" style="font-size:15px;color:#747BAD">Sight</span><span style="font-size:20px;line-height:1.35;color:#E6E9FF">{{sees}}</span></div>
<div class="abs" style="left:440px;top:88px;width:726px;display:flex;flex-direction:column;gap:6px">
<span class="cap" style="font-size:22px;color:#8A8FAE">{{cs}}</span>
<span class="ell" style="font-size:48px;line-height:1.12">{{name}}</span>
<span style="font-size:20px;color:#B8C0F0;margin-top:4px">{{species}}</span>
<span style="font-size:20px;color:#B8C0F0">{{faction}} &#183; {{home}}</span>
</div>
<div class="abs" style="left:440px;top:300px;width:726px;height:2px;background:#222645"></div>
<span class="abs cap" style="left:440px;top:322px;font-size:15px;color:#747BAD">Story</span>
<div class="abs" style="left:440px;top:354px;width:726px;display:flex;flex-direction:column;gap:16px">
<sc-for list="{{story}}" as="p" hint-placeholder-count="3"><p style="margin:0;font-size:22px;line-height:1.42;color:#E6E9FF">{{p.t}}</p></sc-for>
</div>
<div class="abs" style="left:34px;right:34px;bottom:24px;height:72px;display:flex;align-items:center;justify-content:space-between">
<button class="pbtn sls" type="button" onClick="{{back}}"><span class="kc">B</span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>Crew</button>
<div style="display:flex;align-items:center;gap:18px"><button class="pbtn sls" type="button" aria-label="Previous pilot" onClick="{{prev}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Prev</button><span class="cap" style="font-size:22px;color:#B8C0F0;min-width:96px;text-align:center">{{count}}</span><button class="pbtn sls" type="button" aria-label="Next pilot" onClick="{{next}}">Next<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button></div>
</div>
</sc-if>
<div class="abs" aria-hidden="true" style="inset:0;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,.02) 34%,rgba(255,255,255,0) 35%,rgba(255,255,255,0) 100%)"></div>
</div>
</div>
<div class="abs" aria-hidden="true" style="left:0;right:0;top:0;height:220px;background:linear-gradient(180deg,rgba(0,1,10,.78),rgba(0,1,10,0));pointer-events:none"></div>
<nav aria-label="Menu screens" class="abs" style="left:0;right:0;top:0;height:84px;background:rgba(0,1,10,.78);border-bottom:1px solid #222645;display:flex;align-items:center;justify-content:center;gap:48px;z-index:5"><span class="kc">LT</span><span style="display:flex;align-items:center;gap:10px;font-family:'Chakra Petch';font-weight:600;font-size:18px;letter-spacing:.12em;color:#747BAD"><img src="/_blob/ec690d6b90d6fcdbc430b9bbaacf28a9" alt="" style="width:26px;height:26px;object-fit:contain;opacity:0.7">CODEX</span><span style="display:flex;align-items:center;gap:10px;font-family:'Chakra Petch';font-weight:600;font-size:18px;letter-spacing:.12em;color:#747BAD"><img src="/_blob/34f5a50f1275fef42808fe9df3bf6af5" alt="" style="width:26px;height:26px;object-fit:contain;opacity:0.7">HANGAR</span><span style="display:flex;align-items:center;gap:10px;font-family:'Chakra Petch';font-weight:600;font-size:18px;letter-spacing:.12em;color:#747BAD"><img src="/_blob/a5bd4d8d1de7b494567fc3de75525e1e" alt="" style="width:26px;height:26px;object-fit:contain;opacity:0.7">HOME</span><span style="position:relative;display:flex;align-items:center;gap:10px;font-family:'Chakra Petch';font-weight:600;font-size:18px;letter-spacing:.12em;color:#E6E9FF"><img src="/_blob/e5b050c5a676193c650e94d873ad40e2" alt="" style="width:26px;height:26px;object-fit:contain;opacity:1">ARK<span class="abs" style="left:0;right:0;bottom:-10px;height:2px;background:#E6E9FF"></span></span><span style="display:flex;align-items:center;gap:10px;font-family:'Chakra Petch';font-weight:600;font-size:18px;letter-spacing:.12em;color:#747BAD"><img src="/_blob/d0e850bc927559f1a499868d26f2a3de" alt="" style="width:26px;height:26px;object-fit:contain;opacity:0.7">PORT</span><span class="kc">RT</span></nav>
<div class="abs" style="right:40px;top:30px;z-index:6;display:flex;align-items:center;gap:8px;font-size:20px;color:#FFAE00;font-variant-numeric:tabular-nums"><span style="width:14px;height:18px;background:#FFAE00;clip-path:polygon(50% 0,100% 35%,50% 100%,0 35%)"></span>1,240</div>
<div class="abs" style="left:40px;right:40px;top:96px;height:52px;display:flex;align-items:center;gap:30px;border-bottom:1px solid rgba(116,123,173,.35);z-index:4"><span class="kc">LB</span><sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><button class="pick" type="button" onClick="{{t.pick}}" style="position:relative;display:flex;align-items:center;gap:8px;color:{{t.col}}"><sc-if value="{{t.locked}}" hint-placeholder-val="{{ false }}"><svg width="12" height="14" viewBox="0 0 14 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="7" width="10" height="8"></rect><path d="M4 7V5a3 3 0 0 1 6 0v2"></path></svg></sc-if><span class="cap" style="font-size:15px;color:{{t.col}}">{{t.name}}</span><span class="abs" style="left:0;right:0;bottom:-15px;height:2px;background:{{t.mark}}"></span></button></sc-for><span class="kc">RB</span></div>
<div class="abs" style="left:40px;bottom:28px;z-index:4" aria-live="polite"><span class="lab">{{hint}}</span></div>
<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="abs sl glass" role="status" style="left:50%;bottom:40px;transform:translateX(-50%);padding:14px 26px;box-shadow:inset 0 0 0 1px #434C89;font-size:18px;z-index:8">{{toast}}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
const CREW = [{"cs": "ENSIGN", "name": "Veliane Crestward", "species": "Human / Crane / Lemur", "faction": "Wardens of the Calm", "home": "Stillwater", "sees": "Your domain's mass: what is yours to defend, and the gaps in it.", "story": ["Veliane Crestward keeps the sea wall of a water garden in Stillwater, and mends it by hand, one stone at a time.", "The Wardens of the Calm keep watch over the cores the quiet domains rely on. With Veliane aboard, the Wardens will ask your crew to patrol those cores, to answer when one calls for aid, and to hold it until the danger has passed.", "The Wardens are slow to trust a crew, and slower to forget one."], "close": "/_blob/d0722706843bc319df8813f42deca2a5", "tall": "/_blob/7e101ab02e8bc3970229bfa38ce27dc5"}, {"cs": "MANGER", "name": "Tamako Deephook", "species": "Human / Ibis / Platypus", "faction": "Order of the Last Lure", "home": "Brackenmouth", "sees": "The mass cluster the fauna are heading for.", "story": ["Tamako Deephook wades the feeding flats of Brackenmouth, inside a cell the size of a valley, and sets lure lines in water a hand deep.", "The Order of the Last Lure keeps a ledger of every vault field and every sighting its members have ever heard of. With Tamako aboard, that ledger is open to your crew: vaults to open, and lairs to hunt.", "The Order asks only that you write down what you find."], "close": "/_blob/7ddc268d4a4cf61656bf54291784f083", "tall": "/_blob/5a38c3df5c4230b71c50c0b6d0171107"}, {"cs": "ANVIL", "name": "Brikon Copperwright", "species": "Human / Yak / Beetle", "faction": "Tidewright Exchange", "home": "the Copper Reef", "sees": "Every Mass crystal.", "story": ["Brikon Copperwright hauls heavy crystal up from the quarries of the Copper Reef, a boulder at a time, and sells it by weight to anyone with a hull to fill.", "The Tidewright Exchange keeps a desk in every port worth the name. Fly with Brikon and the Exchange will hand your crew sealed dispatches to carry between them, and cargo for convoys bound to ports under pressure.", "Pay is good when the sea is quiet. When it is not, the cargo still has to arrive."], "close": "/_blob/f4c3e0f26d1f48e7d121156e212e4136", "tall": "/_blob/5b307944f40dd4ab3329bca57b8121a2"}, {"cs": "VOLT", "name": "Karenth Amberweaver", "species": "Human / Axolotl / Koi", "faction": "Brass Lantern Company", "home": "the Lantern Reach", "sees": "Every Charge crystal.", "story": ["Karenth Amberweaver makes lamps in a workshop in the Lantern Reach, and proves every bulb by hand before it is sold.", "The Brass Lantern Company lights half the ports of the HyperSea. With Karenth aboard, the Company will give your crew its dispatches to carry, and its convoys to run when a port goes dark.", "Every port you light remembers your name."], "close": "/_blob/32a9eed26dda493c7334d13cddaf435e", "tall": "/_blob/6760fa59723a74b7eda70ba160d62c26"}, {"cs": "ZODIAC", "name": "Ivelia Starreach", "species": "Human / Ocelot / Heron", "faction": "Saltmark Consortium", "home": "Starwake", "sees": "Every Space crystal.", "story": ["Ivelia Starreach was apprenticed to a cartographer in Starwake, and now keeps the chart house of a trade barge crossing the HyperSea.", "The Saltmark Consortium charts the trade lanes and sells passage along them. Fly with Ivelia and the Consortium will give your crew dispatches to carry, and convoys to bring to the ports its lanes have left short.", "The charts are never finished. Neither is the work."], "close": "/_blob/30c5723ab68af43282bfca424757ff31", "tall": "/_blob/706c426e007e3987d06ffcffbe76fdde"}, {"cs": "SUNDIAL", "name": "Delmira Stillwater", "species": "Human / Owl / Pangolin", "faction": "House Verdance", "home": "Gloamwater", "sees": "Every Time crystal.", "story": ["Delmira Stillwater keeps the great water clock of Gloamwater, and has never once arrived early.", "House Verdance trusts its clocks and its cores to the same few hands. With Delmira in your crew, you will patrol the house's cores, answer its calls for aid, and retake a core another domain has seized.", "Verdance keeps time in seasons, not days."], "close": "/_blob/7c6ca6ecc0a83ebe77abab96aac4cc29", "tall": "/_blob/e06ea08442ebbf923f09e4d604cf4a8f"}, {"cs": "OPAL", "name": "Quivera Pearlspark", "species": "Human / Chameleon / Jellyfish", "faction": "House of Seven Scales", "home": "the Silver Lane", "sees": "Every Omni crystal.", "story": ["Quivera Pearlspark trades along the Silver Lane from a cargo quay that never sleeps, and refuses to fly on an empty stomach.", "The House of Seven Scales moves goods to every port on the Lane. Fly with Quivera and your crew will carry its dispatches from port to port, and run its convoys to ports short of what they need.", "A port under pressure pays well, and remembers who came."], "close": "/_blob/02126cf45624881e04e68ab3443b261b", "tall": "/_blob/fa1bc075bdbd0350e5c4cd992752af3e"}, {"cs": "RAMPART", "name": "Obelo Stormstone", "species": "Human / Badger / Armadillo", "faction": "Quayside Mutual", "home": "Shellmouth", "sees": "Every shielded prism.", "story": ["Obelo Stormstone keeps a warehouse on the harbour at Shellmouth, and wants nothing more than a quiet harbour and a long sleep.", "The Quayside Mutual insures cargo across the HyperSea, so it needs crews to carry its dispatches and see its convoys safe to ports where trouble is brewing. With Obelo aboard, that work comes to you.", "The Mutual pays on arrival. Not one moment before."], "close": "/_blob/eeb9791e88d775390515d374cec71f6b", "tall": "/_blob/db7cf92873c24f549dc9a7bbe03841d2"}, {"cs": "CITADEL", "name": "Nedira Shellward", "species": "Human / Hedgehog / Tortoise", "faction": "House Albrine", "home": "Coldharbour", "sees": "Every super-shielded prism: what a payload is for.", "story": ["Nedira Shellward keeps the storerooms of House Albrine in Coldharbour, and every winter the harbour eats from them.", "The house holds cores across the sea for the domains it answers to. With Nedira in your crew, Albrine will send you to patrol them, to answer its calls for aid, and to take back a core another domain has seized.", "A house that feeds a harbour remembers who stood by it."], "close": "/_blob/d0df7ab8ebac626cdfb038866c8db9f0", "tall": "/_blob/e40ad9b86a157dd28aefbe49dd4f0d64"}, {"cs": "HORNET", "name": "Zeko Mirethorn", "species": "Human / Mantis / Newt", "faction": "Deepreed Stalkers", "home": "the Glass Shoals", "sees": "Every danger prism: the mass that burns your petals.", "story": ["Zeko Mirethorn keeps the hazard light on a shoal in the Glass Shoals, and stands under it through the night, watching what the light draws in.", "The Deepreed Stalkers hunt where the water is dangerous. With Zeko in your crew, they will send you after vaults rumoured in the shallows, and into lairs where the fauna have grown into predators.", "A lair is cleared when nothing in it is left to bite."], "close": "/_blob/5bb7e9dc77ccbb917e79991a86168b17", "tall": "/_blob/43d5cc7af8dfe39f8e03cffcb121dc86"}, {"cs": "IVY", "name": "Mathalo Kelpbloom", "species": "Human / Orangutan / Sloth", "faction": "House Verdance", "home": "the Kelp Throne", "sees": "Every plant.", "story": ["Mathalo Kelpbloom tends a forest that grows downward inside a living cell above the Kelp Throne, and judges its one bloom of the year.", "House Verdance holds cores in the green reaches of the HyperSea. Fly with Mathalo and the house will ask your crew to patrol them, to answer its calls for aid, and to retake the ones another domain has taken.", "Verdance is patient. It expects its crews to be patient too."], "close": "/_blob/d750680bcbd6bed6958c9fa98632d348", "tall": "/_blob/6a4df7481e5e23e2d83d4358d6fcc9e4"}, {"cs": "TALON", "name": "Wyvendo Waveline", "species": "Human / Lynx / Jackal", "faction": "Hollowfen Trackers", "home": "Hollowfen", "sees": "Every predator.", "story": ["Wyvendo Waveline grew up in the brickyards of Hollowfen, reading the prints of whatever walked through town in the night.", "The Hollowfen Trackers follow sightings across the HyperSea. Fly with Wyvendo and you will hear of vault fields before other crews do, and of lairs where something has grown too large to leave alone.", "The Trackers share what they find. Mostly."], "close": "/_blob/77e722ebf367c3b4093b2ae2778762e4", "tall": "/_blob/3531d7cc65a34ce447f77a23a2d4e226"}, {"cs": "DOE", "name": "Fenlia Moonbell", "species": "Human / Moose / Fennec", "faction": "Longwake Lodge", "home": "Mirrorfen", "sees": "Every herbivore.", "story": ["Fenlia Moonbell grew up on the floating meadows of Mirrorfen, where the turf drifts in the haze and the hunting is done by ear.", "The Longwake Lodge trades in rumours: a vault field glimpsed through the mist, a lair where the predators have grown too bold. Fly with Fenlia and those rumours become your crew's work.", "What a vault holds goes home in the Ark."], "close": "/_blob/b214d22d4da869609f3bcdf9bdb404e0", "tall": "/_blob/3b10815ffd8b9882fa114bd21210a4a5"}, {"cs": "WINGMAN", "name": "Jorin Gullwing", "species": "Human / Puffin / Pelican", "faction": "Gullbone Crew", "home": "Farshore", "sees": "Every vessel on your side, through mass.", "story": ["Jorin Gullwing lives in a burrow on the sea cliffs of Farshore, and wants one thing above all: a crew that stays.", "The Gullbone Crew raid the hoards other pirates leave unguarded, and strip the wrecks nobody else will touch. With Jorin aboard, they will tell your crew where both are.", "Gullbone looks after its own. Stay long enough and that means you."], "close": "/_blob/e907f06a7e1221c5fbd2265e0738b5ae", "tall": "/_blob/cf6bf4b56f8ddf24154e2823a86aaf35"}, {"cs": "BANDIT", "name": "Rosh Rusthook", "species": "Human / Octopus / Raven", "faction": "Black Tide", "home": "Wrackline", "sees": "Every opposing vessel, through mass.", "story": ["Rosh Rusthook works the wrack at low tide on Wrackline, where old ships come apart on the sand and nothing stays buried for long.", "The Black Tide knows where the other crews hide their hoard .", "The Saltjaw Brethren live off what the sea gives up. Sign Ekora on and the Brethren will point your crew at the stashes they know of, and at wrecks still fresh enough to strip.", "Rival crews hunt the same wrecks. Whoever arrives first keeps what is aboard."], "close": "/_blob/78ad334460657bdc5cf529a6cb76d1cd", "tall": "/_blob/cfe5c00123b194bc5845945fd6be8fcd"}];
