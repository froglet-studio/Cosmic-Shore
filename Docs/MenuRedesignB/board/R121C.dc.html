.mask-b{-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 100%);mask-image:linear-gradient(180deg,#000 55%,transparent 100%)}

.body{font-size:18px;line-height:1.5;color:#B8C0F0}
.new{display:inline-block;width:8px;height:8px;background:#E6E9FF;transform:rotate(45deg);flex:none}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
const LOG = [{"ver": "Update 0.3", "name": "Voyages", "date": "November 2026", "new": true, "line": "Take your crew aboard the Ark and sail the HyperSea.", "feats": [{"title": "Take a job", "line": "Your pilots bring you work: bounty hunts, couriers, raids and the Leviathan."}, {"title": "Rival crews", "line": "Black Tide and other crews take the same jobs. Get there first."}, {"title": "Sagas and relics", "line": "Follow a saga to its end and bring home a relic, like the Lantern of Oriel."}], "fixes": ["A new voyage HUD, the same on PC, phone and controller.", "The Ark no longer waits at a stop forever.", "Escort wingmates keep their target after a pilot swap."]}, {"ver": "Update 0.2", "name": "Quests and colour sets", "date": "October 2026", "new": false, "line": "Five quests across the Arcade, and a colour set to earn from each.", "feats": [{"title": "Quests", "line": "Each quest opens the next game and its harder intensities."}, {"title": "Colour sets", "line": "Wear a new palette for every domain from your Profile."}, {"title": "The Ark", "line": "Your squad and your pilots, in one place."}], "fixes": ["Faster menus on phones.", "Invert Y now reaches every vessel."]}, {"ver": "Update 0.1", "name": "The first beta", "date": "September 2026", "new": false, "line": "The Arcade, the Hangar and the Toybox, for friends and family.", "feats": [{"title": "The Arcade", "line": "Time, Charge, Mass and Space games for every vessel."}, {"title": "The Hangar", "line": "Every vessel, its abilities and its pilots."}, {"title": "The Toybox", "line": "Fly anything, anywhere, with no score."}], "fixes": []}];
const CLOSED = 'What\u2019s new stays in Settings, under Other.';
class Component extends DCLogic {
constructor(p) { super(p); this.state = { open: true, sel: 0, toast: '' }; }
renderVals() {
  const st = this.state, i = st.sel;
  const toast = { show: !!st.toast, text: st.toast || '', again: st.toast === CLOSED, open: () => this.setState({ open: true, toast: '' }) };
  const log = LOG.map((u, k) => { const on = k === i; return { ver: u.ver, name: u.name, date: u.date, isNew: u.new,
    pressed: on ? 'true' : 'false', ink: on ? '#E6E9FF' : '#B8C0F0', verInk: on ? '#E6E9FF' : '#747BAD',
    bg: on ? 'linear-gradient(90deg,rgba(67,76,137,.35),rgba(67,76,137,0))' : 'rgba(0,0,0,0)', edge: on ? 'inset 2px 0 0 #00D4FF' : 'none',
    pick: () => this.setState({ sel: k }) }; });
  const u = LOG[i];
  const sel = { ver: u.ver, name: u.name, date: u.date, line: u.line, isNew: u.new, feats: u.feats,
    fixes: u.fixes.map((t) => ({ t })), hasFixes: u.fixes.length > 0 };
  return { open: st.open, toast, log, sel, h0: i === 0, h1: i === 1, h2: i === 2,
    close: () => this.setState({ open: false, toast: CLOSED }),
    sail: () => this.setState({ open: false, toast: 'Opening Voyages on the Ark.' }) };
}
}
