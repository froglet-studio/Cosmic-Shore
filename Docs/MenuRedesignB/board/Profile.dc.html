<style>
body{margin:0;background:#00010A}
.sl{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}

.lab{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#747BAD}
.btn{appearance:none;border:0;padding:1px;cursor:pointer;background:var(--bc);font-family:'Chakra Petch',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.08em;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn>span{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--bf);color:var(--bt);padding:9px 16px;font-size:14px;white-space:nowrap;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn.big>span{padding:14px 28px;font-size:18px}
.btn:focus,.card:focus,.tile:focus{outline:none}
.btn:disabled{cursor:default}
.card,.tile{appearance:none;cursor:pointer;font:inherit;color:inherit;border:0;text-align:left;padding:0}
.tab{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:18px;letter-spacing:.08em}
.num{font-variant-numeric:tabular-nums}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#434C89 transparent}
@keyframes csRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes csDrop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes csFade{from{opacity:0}to{opacity:1}}
@keyframes csGrowX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes csGrowY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes csSparkX{from{left:-48px}to{left:100%}}
@keyframes csSparkY{from{top:-36px}to{top:100%}}
@keyframes csFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes csSweep{0%{left:-80px}55%,100%{left:110%}}
@keyframes csPan{from{transform:scale(1.04) translate(-1%,0)}to{transform:scale(1.09) translate(1.2%,-1%)}}
@keyframes csBlink{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes csPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes csGlow{0%,100%{box-shadow:0 0 18px rgba(153,255,128,.22)}50%{box-shadow:0 0 34px rgba(153,255,128,.5)}}
@keyframes csShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes csSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes csSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes csDrain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes csCeremony{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.tile,.card{transition:filter 120ms ease-out}
.tile:hover,.card:hover{filter:brightness(1.18)}
.grid{background-color:#00041F;background-image:linear-gradient(#0A0F33 1px,transparent 1px),linear-gradient(90deg,#0A0F33 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1920, "height": 1080}, "start": {"editor": null}}'>
const Q = [{"name": "SCURRY", "mode": "Scurry", "art": "/_blob/a1f5c5b5b5c1074b0e6e9257d75fe653", "desc": "Unlock Intensity 4 to unlock gamemodes", "goals": {"3": "Rank first in an Intensity 2 game", "4": "Rank first in an Intensity 3 game"}}, {"name": "HEX RACE", "mode": "Skim Race", "art": "/_blob/33b45ebe5f51c2b0d213c122ea74892a", "desc": "Unlock Intensity 4 to unlock gamemodes", "goals": {"3": "Rank first in an Intensity 2 race", "4": "Rank first in an Intensity 3 race"}}, {"name": "JOUST", "mode": "Joust", "art": "/_blob/1efac15c724589a0f77c042d666ebb18", "desc": "Unlock Intensity 4 to unlock gamemodes", "goals": {"3": "Win a Joust match at Intensity 2", "4": "Win a Joust match at Intensity 3"}}, {"name": "MAELSTROM", "mode": "Maelstrom", "art": "/_blob/e5ff645affc0bc6995957b95d3a8c0c7", "desc": "Unlock Intensity 4 to unlock Hangar", "goals": {"3": "Play Intensity 2 to unlock", "4": "Play Intensity 3 to unlock"}}, {"name": "VESSEL HANGAR", "mode": "", "art": "/_blob/b9c23a15cc3620c737d974cd5f402158", "desc": "Complete all game mode quests to unlock the Vessel Hangar", "goals": {}}];

class Component extends DCLogic {

    for (let i = 0; i < Q.length - 1; i++) {
      const on = reached(i);
      rail.push({ x: cx[i], w: cx[i + 1] - cx[i], top: on ? 12 : 13, h: on ? 3 : 2, c: on ? '#00D4FF' : '#003648', spark: on, d: 200 + i * 80, sd: 700 + i * 300 });
    }
    Q.forEach((_, i) => {
      const s = st.states[i];
      nodes.push({ x: cx[i] - 16, d: 160 + i * 60, border: s === 'locked' ? '#25262D' : (s === 'current' ? '#E6E9FF' : '#00D4FF'),
                   fill: s === 'done' || s === 'ready' ? '#00D4FF' : '#00041F' });
    });
    const goalRows = (q, i, s) => {
      if (!q.mode) return Q.slice(0, 4).map((p, k) => ({ lab: 'Quest ' + (k + 1), text: p.name,
        done: st.states[k] === 'done', next: st.states[k] === 'ready' || st.states[k] === 'current', todo: st.states[k] === 'locked',
        color: st.states[k] === 'done' ? '#747BAD' : '#E6E9FF', labColor: '#5C5F70', d: 360 + i * 40 + k * 40 }));
      return [3, 4].map((lv, k) => {
        const done = s === 'done' || s === 'ready' || (s === 'current' && st.level >= lv);
        const next = s === 'current' && st.level + 1 === lv;
        return { lab: 'Unlock intensity ' + lv, text: q.goals[lv], done, next, todo: !done && !next,
                 color: done ? '#747BAD' : (next ? '#E6E9FF' : '#5C5F70'), labColor: next ? '#E6E9FF' : '#5C5F70', d: 360 + i * 40 + k * 40 };
      });
    };
    const cards = Q.map((q, i) => {
      const s = st.states[i], prev = i > 0 ? Q[i - 1].name : '';
      const ceremony = st.claimed === i;
      return { name: q.name, desc: q.desc, art: q.art, mode: q.mode, num: '0' + (i + 1),
        tag: s === 'done' ? 'Completed' : (s === 'ready' ? 'Ready to claim' : (s === 'current' ? 'In progress' : 'Locked')),
        tagColor: s === 'ready' ? '#99FF80' : (s === 'locked' ? '#5C5F70' : '#747BAD'),
        titleColor: s === 'locked' ? '#5C5F70' : '#E6E9FF', artAlpha: s === 'locked' ? 0.3 : (s === 'done' ? 0.7 : 1),
        border: s === 'ready' ? '#99FF80' : (s === 'current' ? '#E6E9FF' : '#222645'),
        anim: ceremony ? 'csCeremony 500ms cubic-bezier(.34,1.56,.64,1) both'
                       : (s === 'ready' ? 'csRise 320ms ' + OUT + ' ' + (200 + i * 40) + 'ms both, csGlow 2.4s ease-in-out 600ms infinite'
                                        : 'csRise 320ms ' + OUT + ' ' + (200 + i * 40) + 'ms both'),
        done: s === 'done', ready: s === 'ready', current: s === 'current', locked: s === 'locked',
        goalsTitle: q.mode ? 'Goals' : 'Needs', goals: goalRows(q, i, s),
        showBars: s === 'current', level: String(st.level),
        bars: [1, 2, 3, 4].map((b) => ({ h: 10 + b * 4, c: b <= st.level ? '#E6E9FF' : '#222645', d: 500 + b * 40 })),
        lockText: 'Unlocks after ' + prev,
        claim: () => {
          const states = st.states.slice(); states[i] = 'done';
          this.setState({ states, claimed: i }); this.say('Quest Complete! ' + q.name);
        },
        play: () => this.say('Opens ' + q.mode + ' in the Arcade.') };
    });
    const done = st.states.filter((s) => s === 'done').length;
    const ease = 1 - Math.pow(1 - st.t, 3);
    return {
      avatar: AV[st.avatar], name: st.name, rail, nodes, cards,
      record: RECORD.map((r, i) => ({ k: r[0], crystal: r[2] === 'crystal', d: 120 + i * 40, color: r[2] === 'crystal' ? '#FFAE00' : '#E6E9FF',
                                      v: typeof r[1] === 'number' ? Math.round(r[1] * ease).toLocaleString('en-US') : r[1] })),
      doneCount: String(done), donePct: done * 20,
      shake: st.shake ? 'csShake 240ms ease-out' : 'none',
      toAvatar: () => this.say('Opens the profile window on Avatar.'),
      toName: () => this.say('Opens the profile window on Display name.'),
      episodes: () => {
        this.setState({ shake: st.shake + 1 });
        if (this.shakeT) clearTimeout(this.shakeT);
        this.shakeT = setTimeout(() => this.setState({ shake: 0 }), 260);
        this.say('Episodes arrive with the full release.');
      },
      toast: !!st.toast, toastText: st.toast
    };
  }
}
</script>
