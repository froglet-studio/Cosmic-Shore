<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1948,"height":900}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { online: true, asking: false, invite: true, toast: '' }; }
say(t){ this.setState({ toast: t }); }
renderVals() {
const st = this.state;
return { h: {
  lampColor: st.online ? '#99FF80' : '#5C5F70', status: st.online ? 'Online' : 'Offline',
  lamp: () => this.setState({ asking: true }), asking: st.asking,
  question: st.online ? 'Go offline?' : 'Go online?',
  note: st.online ? 'Party, friends and the weekly board pause until you come back.' : 'Reconnects to party, friends and the weekly board.',
  confirm: () => this.setState({ asking: false, online: !st.online, invite: st.online ? false : st.invite }),
  cancel: () => this.setState({ asking: false }),
  invite: st.invite && st.online && !st.asking,
  join: () => this.setState({ invite: false, toast: "Joining Halcyon's party." }),
  decline: () => this.setState({ invite: false }),
  hub: () => this.say('Opens that window.'), toastOn: st.toast !== '', toast: st.toast,
  countdown: '6d 3h' } };
}
}
