body{margin:0;background:#00010A}

.btn{appearance:none;border:0;padding:1px;cursor:pointer;background:var(--bc);font-family:'Chakra Petch',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.08em;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}

.btn.big>span{padding:14px 28px;font-size:18px}
.btn:focus,.card:focus,.tile:focus{outline:none}
.btn:disabled{cursor:default}
.card,.tile{appearance:none;cursor:pointer;font:inherit;color:inherit;border:0;text-align:left;padding:0}
.tab{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:18px;letter-spacing:.08em}
.num{font-variant-numeric:tabular-nums}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#434C89 transparent}
@keyframes csRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes csDrop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes csFade{from{opacity:0}to{opacity:1}}
@keyframes csGrowX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes csGrowY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes csSparkX{from{left:-48px}to{left:100%}}
@keyframes csSparkY{from{top:-36px}to{top:100%}}
@keyframes csFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes csSweep{0%{left:-80px}55%,100%{left:110%}}
@keyframes csPan{from{transform:scale(1.04) translate(-1%,0)}to{transform:scale(1.09) translate(1.2%,-1%)}}
@keyframes csBlink{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes csPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes csGlow{0%,100%{box-shadow:0 0 18px rgba(153,255,128,.22)}50%{box-shadow:0 0 34px rgba(153,255,128,.5)}}
@keyframes csShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes csSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes csSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes csDrain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes csCeremony{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.tile,.card{transition:filter 120ms ease-out}
.tile:hover,.card:hover{filter:brightness(1.18)}
.grid{background-color:#00041F;background-image:linear-gradient(#0A0F33 1px,transparent 1px),linear-gradient(90deg,#0A0F33 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
</style>

nted giant worm that hunts mass and lunges at ships with fanged jaws. Cut it in two and you get two worms; every segment drops a crystal. Sheds segments when starved."}, {"n": "Piranha", "d": "", "icon": "", "branch": true, "desc": "A fast pack of eight tiny, always-hungry fish that eat any team's trail and pull toward the middle of the cell. Charge crystals. Starves in 40s without trail."}, {"n": "Swarm", "d": "", "icon": "", "branch": true, "desc": "The SORT swarm: about 240 tadpoles that sort themselves into one animal per element (Charge pufferfish, Mass whale, Space jellyfish, Time dragonfly). Kill its main element and it molts into another. Eats flora only."}, {"n": "Swarm Field", "d": "", "icon": "", "branch": true, "desc": "The FIELD swarm model: designed attractor fields where every tadpole owns a slot, so the animal reads crisp and exact. Smaller bodies than the Sort swarm. Eats flora only."}, {"n": "Swarm Grid", "d": "", "icon": "", "branch": true, "desc": "The GRID swarm model: each tadpole reads only the morphogen at its own position, so the animal is looser and more organic than Field. Smaller bodies than Sort. Eats flora only."}, {"n": "Swarm EvoFate", "d": "", "icon": "", "branch": true, "desc": "The EVOFATE swarm model: a learned network moves every tadpole, with a light pull toward its chosen place. The most alive texture and the most expensive. Eats flora only."}, {"n": "Pack Hunter", "d": "", "icon": "", "branch": true, "desc": "Six long hunters that ring your ship, close in and strike together, then tire for 3s. They also hunt locusts by scent. Time crystals."}, {"n": "Locust", "d": "", "icon": "", "branch": true, "desc": "Lone, bobbing grazers that flip into a fast biting swarm when crowded and hungry, and breed from the plants they eat. Space crystals. Needs flora."}, {"n": "Lurker", "d": "", "icon": "", "branch": true, "desc": "Looks like a plant's crystal. It creeps toward you while you look away, freezes when you look, then gapes and snaps. Best among flora, which it mimics and eats."}, {"n": "Stampede", "d": "", "icon": "", "branch": true, "desc": "Grazing herds where every fourth animal is a bull that lowers its head and charges a nearby ship. Mass crystals. Needs flora."}, {"n": "Mobber", "d": "", "icon": "", "branch": true, "desc": "Roosting birds that mob a slow ship or one near their roost: they circle, dive and peck to drain you. Time crystals."}, {"n": "Leech", "d": "", "icon": "", "branch": true, "desc": "Drifting puddles that pounce on a ship within 140u, latch on and slowly drain it. Turn hard to fling them off. Charge crystals. Needs flora."}, {"n": "Leviathan", "d": "", "icon": "", "branch": true, "desc": "A shoal of grazers that assembles into a 120u manta when fed, opens its jaws and surges into a ship ahead of it. Space crystals. Falls apart unfed: needs flora."}, {"n": "Fortress Builders", "d": "", "icon": "", "branch": true, "desc": "48 workers that steal loose prisms and your trail to wall in their nest. A cut wall knits shut and defenders sting. Mass crystals. Fly a trail to feed them."}, {"n": "Thief Nest", "d": "", "icon": "", "branch": true, "desc": "Magpies that nest on a plant, tail your ship, snatch your fresh trail and fly it home to a visible hoard. Space crystals. Fly a trail near them."}, {"n": "Wearer Builders", "d": "", "icon": "", "branch": true, "desc": "Hearts that steal your trail and wear it as a body, fuse together, then rear and lunge. Ram one to strip the prisms back. Fly a trail to feed them."}, {"n": "Shoal", "d": "", "icon": "", "branch": true, "desc": "120 small fish that school as the lab's evolved herd: tight, aligned schools that swerve round a hunter or a ship. Harmless; ram them. Time crystals. Needs flora."}, {"n": "Harrier", "d": "", "icon": "", "branch": true, "desc": "8 sprinters that hunt the shoal as a pack. A hunter streaks out when it bursts and can burn only after 0.4 s of it. Charge crystals. Spawn with a Shoal or it scavenges flora."}], "elem class Component extends DCLogic {

                 this.setState({ sel: r.n });
               } };

    const crumb = [t.name].concat(path).join('  /  ');

      previewTag: st.sel || (path.length ? path[path.length - 1] : ''),

      crumb, count: list.length ? String(list.length) : '', rows,
      status: st.toy === 'domain' ? 'Tap a domain to fly it at once.' : (st.sel ? st.sel + ' selected' : (leaf ? 'Pick a variation.' : 'Pick a branch.')),
      showCommit: !!t.verb, canCommit: !!st.sel, noCommit: !st.sel, verb,
      commit: () => this.say(verb + ': ' + st.sel + '. The window closes and you fly out.'),

      toast: !!st.toast, toastText: st.toast
    };
  }
}
