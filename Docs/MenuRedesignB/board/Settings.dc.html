<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">

<style>
body{margin:0;background:#00010A}
.sl{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.slf{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.sls{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.oct{clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%)}
.hex{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.lab{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#747BAD}
.btn{appearance:none;border:0;padding:1px;cursor:pointer;background:var(--bc);font-family:'Chakra Petch',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.08em;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn>span{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--bf);color:var(--bt);padding:9px 16px;font-size:14px;white-space:nowrap;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn.big>span{padding:14px 28px;font-size:18px}
.btn:focus,.card:focus,.tile:focus{outline:none}
.btn:disabled{cursor:default}
.card,.tile{appearance:none;cursor:pointer;font:inherit;color:inherit;border:0;text-align:left;padding:0}
.tab{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:18px;letter-spacing:.08em}
.num{font-variant-numeric:tabular-nums}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#434C89 transparent}
@keyframes csRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes csDrop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes csFade{from{opacity:0}to{opacity:1}}
@keyframes csGrowX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes csGrowY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes csSparkX{from{left:-48px}to{left:100%}}
@keyframes csSparkY{from{top:-36px}to{top:100%}}
@keyframes csFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes csSweep{0%{left:-80px}55%,100%{left:110%}}
@keyframes csPan{from{transform:scale(1.04) translate(-1%,0)}to{transform:scale(1.09) translate(1.2%,-1%)}}
@keyframes csBlink{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes csPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes csGlow{0%,100%{box-shadow:0 0 18px rgba(153,255,128,.22)}50%{box-shadow:0 0 34px rgba(153,255,128,.5)}}
@keyframes csShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes csSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes csSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes csDrain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes csCeremony{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.tile,.card{transition:filter 120ms ease-out}
.tile:hover,.card:hover{filter:brightness(1.18)}
.grid{background-color:#00041F;background-image:linear-gradient(#0A0F33 1px,transparent 1px),linear-gradient(90deg,#0A0F33 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
</style>
</helmet>

th: 66px; height: 56px; background: {{tab2.fill}}; color: {{tab2.icon}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 18a8 8 0 1116 0"></path><path d="M12 18l4-6"></path></svg></span></span><span class="lab" style="color: {{tab2.label}}">Performance</span></button><button class="tile" type="button" aria-label="Other" onClick="{{tab3.pick}}" style="display: flex; flex-direction: column; align-items: center; gap: 8px; background: transparent"><span class="hex" style="display: grid; place-items: center; width: 70px; height: 60px; background: {{tab3.border}}"><span class="hex" style="display: grid; place-items: center; width: 66px; height: 56px; background: {{tab3.fill}}; color: {{tab3.icon}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><path d="M14 5v4M8 15v4"></path></svg></span></span><span class="lab" style="color: {{tab3.label}}">Other</span></button></nav>
          <button class="btn" type="button" style="--bc: #00D4FF; --bf: #001D3A; --bt: #E6E9FF"><span><span class="sls" style="display: inline-flex; background: #434C89; padding: 1px"><span class="sls" style="background: #00041F; padding: 1px 8px; color: #747BAD; font-size: 12px">B</span></span>Close</span></button>

                      <span class="hex" style="position: absolute; left: {{r.knob}}px; top: 0; transition: left 200ms cubic-bezier(.33,1,.68,1); display: grid; place-items: center; width: 30px; height: 26px; background: #00D4FF"><span class="hex" style="display: block; width: 24px; height: 20px; background: #E6E9FF"></span></span>

      <div class="sl" style="background: #00041F; padding: 12px 22px; font-size: 17px">{{toastText}}</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1920, "height": 1080}, "start": {"editor": null}}'>
const SETTINGS = {"General": [{"k": "dd", "label": "Colorblind mode", "desc": "Adjusts team colours for colour vision deficiency.", "opts": ["Off", "Protanopia", "Deuteranopia", "Tritanopia"], "v": 0}, {"k": "tg", "label": "Subtitles", "desc": "Captions for spoken lines.", "v": false}, {"k": "dd", "label": "Subtitle size", "desc": "How large the captions are.", "opts": ["Small", "Medium", "Large"], "v": 1}, {"k": "tg", "label": "Analytics and crash reports", "desc": "Share anonymous usage and crash reports so bugs get fixed.", "v": true}], "Display": [{"k": "dd", "label": "Display mode", "desc": "Fullscreen, a borderless window, or a window.", "opts": ["Fullscreen", "Borderless", "Windowed"], "v": 0}, {"k": "dd", "label": "Resolution", "desc": "Native follows your monitor.", "opts": ["Native", "1920 x 1080", "2560 x 1440", "3840 x 2160"], "v": 0}, {"k": "dd", "label": "Frame rate limit", "desc": "Caps how many frames are drawn each second.", "opts": ["30", "60", "120", "144", "240", "Uncapped"], "v": 1}, {"k": "tg", "label": "V-Sync", "desc": "Syncs frames to the monitor to stop tearing.", "v": true}, {"k": "sl", "label": "Field of view", "desc": "Wider shows more around your vessel.", "lo": 60, "hi": 90, "v": 75}], "Performance": [{"k": "dd", "label": "Quality preset", "desc": "Sets every option below in one step.", "opts": ["Very Low", "Low", "Medium", "High", "Very High", "Ultra", "Custom"], "v": 3, "restart": true}, {"k": "dd", "label": "Anti-aliasing", "desc": "Smooths jagged edges.", "opts": ["Off", "FXAA", "SMAA", "MSAA 2x", "MSAA 4x", "MSAA 8x", "TAA"], "v": 2, "restart": true, "custom": true}, {"k": "dd", "label": "Texture quality", "desc": "Lower saves video memory.", "opts": ["Full", "Half", "Quarter", "Eighth"], "v": 0, "restart": true, "custom": true}, {"k": "dd", "label": "Upscaling", "desc": "Draws fewer pixels and scales up for speed.", "opts": ["Auto", "Linear", "FSR", "STP"], "v": 0, "restart": true, "custom": true}, {"k": "dd", "label": "Adaptive performance", "desc": "Lowers detail when the device runs hot.", "opts": ["Off", "Balanced", "Aggressive"], "v": 1}, {"k": "dd", "label": "Physics / collider detail", "desc": "Lower uses simpler collision shapes.", "opts": ["Low", "High"], "v": 1}], "Other": [{"k": "tg", "label": "Invert Y", "desc": "Pull back to climb.", "v": false}, {"k": "tg", "label": "Invert throttle", "desc": "Swap which way the throttle runs.", "v": false}, {"k": "tg", "label": "Music", "desc": "Play the soundtrack.", "v": true}, {"k": "sl", "label": "Music volume", "desc": "How loud the soundtrack is.", "lo": 0, "hi": 100, "v": 70}, {"k": "tg", "label": "SFX", "desc": "Play sound effects.", "v": true}, {"k": "sl", "label": "SFX volume", "desc": "How loud the effects are.", "lo": 0, "hi": 100, "v": 85}, {"k": "tg", "label": "Haptics", "desc": "Controller rumble.", "v": true}]};
const TABS = ["General", "Display", "Performance", "Other"];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const s = Object.assign({ tab: 'General', restart: false }, props.start || {});

      if (r.k === 'dd') { o.value = r.opts[r.v]; o.next = () => this.set(st.tab, i, (r.v + 1) % (r.opts[r.opts.length - 1] === 'Custom' ? r.opts.length - 1 : r.opts.length), r); }
      if (r.k === 'tg') { o.onColor = r.v ? '#E6E9FF' : '#5C5F70'; o.offColor = r.v ? '#5C5F70' : '#E6E9FF';
                          o.onScale = r.v ? 1 : 0; o.offScale = r.v ? 0 : 1;
                          o.on = () => this.set(st.tab, i, true, r); o.off = () => this.set(st.tab, i, false, r); }

      return o;
    });
