const VESSELS = [{"name": "Squirrel", "desc": "Get in your flow and stay there. Hard decisions are for other classes. You\u2019re here to bounce around and ride your speed tubes, leaving a wake of creation and destruction.", "cost": 0, "owned": true, "icon": "/_blob/1e9d1aac634b11e0c3bbe058a246f84e", "preview": "/_blob/b9c23a15cc3620c737d974cd5f402158", "abilities": [{"n": "Speed Tubes", "d": "Speed tubes surround blocks, provide maneuverability, and increase block size the closer you are to the shards of a tube. Your trail display shows how close you are to the tube shards."}, {"n": "Bouncy", "d": "Don't stress about collisions, you bounce off prisms."}, {"n": "Mach Cone", "d": "Overtake hostile players to make a burst of volume."}, {"n": "Explosive Acorn", "d": "Hitting crystals produces large explosions that only destroys hostile volume"}]}, {"name": "Sparrow", "desc": "The classic arcade flyer. Use your Pulsefire Cannons and Skyburst Rockets to destroy enemy blocks, flora, fauna, structures, everything...", "cost": 4000, "owned": false, "icon": "/_blob/61381b53669b7110e41be12509cbb817", "preview": "/_blob/cd8fa4dc480b7782c61dd7ddecf0e3fd", "abilities": [{"n": "Pulsefire Cannons", "d": "The Sparrow fires high velocity lasers that destroy volume and damage enemy vessels."}, {"n": "Skyburst Rockets", "d": "The sparrow has 2 Skyburst Rockets that it can fire. Rockets will detonate on the first thing they hit, or after a certain duration if they don\u2019t hit anything. Upon detonation rockets will destroy all volume within its blast radius and create its own firework of volume. Picking up a crystal fully restocks rockets."}, {"n": "Velocity Surge", "d": "The Sparrow reroutes energy to its thrusters gaining a boost of movement speed while gaining heat."}, {"n": "Redirection", "d": "Crash, bounce, keep soaring. No obstacles, just speed."}]}, {"name": "Manta", "desc": "Soar at high speed through open spaces to create the biggest blocks in the Hypersea, or skim your opponents trail to steal theirs.", "cost": 4000, "owned": false, "icon": "/_blob/8c982fb3b1311931aa946a7f5337d47b", "preview": "/_blob/88502af5e4dca8a74c575a5b8cf2666d", "abilities": [{"n": "Prism Size", "d": "Your prisms fill the space you give them. Your camera lets you know you're getting too close to other prisms. Use your high top speed for extra volume."}, {"n": "Prism Thief", "d": "Skim past prisms to change them from working against you to working for you."}, {"n": "Bloom", "d": "Instantly produce a large amount of shielded mass."}, {"n": "Decoy", "d": "Drop a decoy crystal that the shards don't point at. It looks blue to your team, but will trick and stun unwary opponents."}]}, {"name": "Serpent", "desc": "Navigate with just one thumb and place seeds that will steal ALL local blocks into a wall that can be sheilded. Use walls to disrupt enemy volume and navigation.", "cost": 4000, "owned": false, "icon": "/_blob/d60af9f6ab71865788f13a01fc914c77", "preview": "/_blob/247cff3e5731cdea25ab4e37706b4fe3", "abilities": [{"n": "Burrow", "d": "The serpent punches through any block it touches."}, {"n": "Slither", "d": "The Serpent expends a battery to supercharge its thrusters for a burst of speed."}, {"n": "Shed Skin", "d": "Collect a crystal to make an explosion that shields friendly prisms."}, {"n": "Lay Egg", "d": "The serpent sheds its skin to deploy a self-assembling wall that steals nearby blocks to build itself."}]}, {"name": "Rhino", "desc": "Smash things with your face to gain boost and volume. Hunt down other players to stop them from making volume. Watch out for collateral damage.", "cost": 4000, "owned": false, "icon": "/_blob/1ce285176825995d5760aa32191fb823", "preview": "/_blob/267d6d4d70a40f135866b318cab2e29d", "abilities": [{"n": "Boost", "d": "When you point your ship full speed and straight you consume fuel for a signifcant burst of speed."}, {"n": "Berserk", "d": "Flying full speed and straight will cause your forcefield to grow, your camera to provide greater visibility, and your trail to grow. Destroy mass to earn fuel."}, {"n": "Shockwave", "d": "When you hit a crystal it unleashes a stunning explosion, making opponents easier to blitz."}, {"n": "Blitz", "d": "Temporarily disable an opponent's trail by crashing into them."}]}, {"name": "Dolphin", "desc": "Thread the narrowest needles at the highest speeds to build max charge, then drift sideways into a crystal to release one of the biggest blasts in the Hypersea.", "cost": 4000, "owned": false, "icon": "/_blob/0fa7978ec882f85c851f541bb20b17bc", "preview": "/_blob/aacc24c01c767c790116dd1340c00e85", "abilities": [{"n": "Drift", "d": "Pick up either thumb to slide and aim for an Artillery fire. Prism volume is enhanced while drifting, and movement speed is boost after drifting."}, {"n": "Harvest", "d": "Flying near blocks harvests charge for the Artillery Cannon."}, {"n": "Artillery Cannon", "d": "Hit a crystal to consume all harvested charge and unleash a devestating directional blast."}, {"n": "Agility", "d": "Dolphin is the most agile class. Use it to move and glide in the most crowded areas."}]}, {"name": "Urchin", "desc": "Don't mess with me or I will shoot. I will shoot anyway, but don't mess with me.", "cost": 4000, "owned": false, "icon": "/_blob/955585ad0ea3df6c91ff0328e8f7609e", "preview": "/_blob/dfe6b23c6651c7d26beefeb12bff12f0", "abilities": [{"n": "Shed Skin", "d": "Collect a crystal to make an explosion that shields friendly prisms."}, {"n": "Lay Egg", "d": "The serpent sheds its skin to deploy a self-assembling wall that steals nearby blocks to build itself."}, {"n": "Slither", "d": "The Serpent expends a battery to supercharge its thrusters for a burst of speed."}, {"n": "Burrow", "d": "The serpent punches through any block it touches."}]}, {"name": "Butterfly", "desc": "Slow, wide and quiet. The Butterfly paints broad surfaces through the hypersea while everyone else is fighting \u2014 and folds space when it wants to be somewhere else.", "cost": 100, "owned": false, "icon": "/_blob/8280d6385d684da1ec7b9adbcc9138d0", "preview": "", "abilities": []}, {"name": "Thresher", "desc": "A small, nimble hull towing a heavy wrecking ball on a chain. Turn hard and snap back and the ball whips round; wind the chain out and let it reel in, and it cracks red-hot through everything. Plant it and swing round it to sling yourself off.", "cost": 100, "owned": false, "icon": "/_blob/33b84497b25b0549ed888f18680543bd", "preview": "", "abilities": []}, {"name": "Scarab", "desc": "Roll a ball you made yourself. Analog throttle and drift, a side-bump juke, and crystal-funded switch rings - the Rocket League vessel, tuned for Astro League.", "cost": 100, "owned": false, "icon": "/_blob/7398e80012e26922f395bd11fbaa95de", "preview": "", "abilities": []}, {"name": "Stoat", "desc": "Never flies straight for long. The Stoat throws a wormhole pair across itself - attractor on one side, repulsor on the other - and goes where the pull throws it.", "cost": 0, "owned": false, "icon": "/_blob/1e9d1aac634b11e0c3bbe058a246f84e", "preview": "", "abilities": []}];
class Component extends DCLogic {
constructor(p){ super(p); this.state = { pick: 0, sheet: false, spend: false }; }
renderVals() {
const st = this.state, V = VESSELS[st.pick];
const fmt = (n) => n.toLocaleString('en-US');
return { g: {
  name: V.name, upper: V.name.toUpperCase(), preview: V.preview || VESSELS[0].preview, desc: V.desc || 'Coming soon.',

  count: V.abilities.length, abilities: V.abilities.length ? V.abilities : [{ n: 'Abilities', d: 'No abilities are listed for the ' + V.name + ' yet.' }],
  sheet: st.sheet, openSheet: () => this.setState({ sheet: true }), closeSheet: () => this.setState({ sheet: false }),
  spend: st.spend, openSpend: () => this.setState({ spend: true }), closeSpend: () => this.setState({ spend: false }),
  list: VESSELS.map((v, i) => ({ name: v.name, icon: v.icon || VESSELS[0].icon,
    status: v.owned ? 'Owned' : v.cost ? fmt(v.cost) + ' crystals' : 'Coming soon', statusInk: v.owned ? '#99FF80' : '#747BAD',
    pressed: i === st.pick ? 'true' : 'false', fill: i === st.pick ? 'rgba(0,212,255,.12)' : 'rgba(0,4,31,.86)',
    edge: i === st.pick ? '#00D4FF' : 'transparent', pick: () => this.setState({ pick: i, sheet: false, spend: false }) })) } };
}
}
