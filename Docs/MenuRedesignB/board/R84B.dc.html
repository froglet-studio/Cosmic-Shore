<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rev 84 B - The whole fleet, sorted and filtered by completion and by tier, each on its own</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&amp;family=Saira:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#13010C}
.app{position:relative;overflow:hidden;color:#F5E6EE;background:radial-gradient(ellipse 70% 60% at 50% 30%,#210118,#13010C 72%);font-family:'Saira',sans-serif}
.app *{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid #65E1DF;outline-offset:2px}
.disp{font-family:'Saira Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.lab{font-size:12px;letter-spacing:.22em;color:#A8869A;text-transform:uppercase}
.soft{-webkit-mask-image:radial-gradient(ellipse 58% 62% at 50% 50%,#000 52%,transparent 100%);mask-image:radial-gradient(ellipse 58% 62% at 50% 50%,#000 52%,transparent 100%)}
.hud{position:absolute;padding:22px 24px;background:rgba(19,1,12,.88)}
.chip{border:0;cursor:pointer;height:34px;padding:0 14px;background:transparent;color:#A8869A;box-shadow:inset 0 0 0 1px #70405F;font-size:13px;letter-spacing:.06em;transition:color .2s cubic-bezier(.45,0,.2,1),background .2s cubic-bezier(.45,0,.2,1)}
.chip:hover{color:#F5E6EE}
.chip.on{color:#13010C;background:#65E1DF;box-shadow:none}
/* the certificate: five segments, filled in ink, the stage word in Gold only when it is Arena Ready (a first place) */
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg i{display:block;height:8px;background:#70405F;opacity:.45;transition:opacity .4s cubic-bezier(.45,0,.2,1),background .4s cubic-bezier(.45,0,.2,1)}
.seg i.on{background:#F5E6EE;opacity:1}
.seg i.part{background:linear-gradient(90deg,#F5E6EE var(--p),#70405F var(--p));opacity:1}
.seg.thin i{height:4px}
.chk{display:grid;grid-template-columns:20px 130px 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(112,64,95,.5);font-size:14px}
.chk svg{width:16px;height:16px}
.chk span{color:#A8869A;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.chk.no{color:#6C5A65}
.stage{font-family:'Saira Condensed',sans-serif;font-weight:700;text-transform:uppercase;font-size:30px;letter-spacing:.04em}
.stage.gold{color:#FFC549}
.stage.dim{color:#A8869A}
/* a tier letter: S solid (Gold, a first place), A outlined ink, B soft, C off; a dash is no game of that element */
.tier{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:22px}
.tier.tS{background:#FFC549;color:#13010C}
.tier.tA{box-shadow:inset 0 0 0 2px #F5E6EE;color:#F5E6EE}
.tier.tB{box-shadow:inset 0 0 0 1px #70405F;color:#A8869A}
.tier.tC{color:#6C5A65;box-shadow:inset 0 0 0 1px rgba(112,64,95,.5)}
.tier.t-{color:#6C5A65;font-size:16px}
.vsel{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:0;cursor:pointer;background:transparent;box-shadow:inset 0 0 0 1px #70405F;transition:background .2s cubic-bezier(.45,0,.2,1)}
.vsel.on{background:#3C1D31;box-shadow:inset 0 0 0 1px #65E1DF}
.vsel img{width:46px;height:26px;object-fit:cover}
.trow{display:grid;grid-template-columns:64px 170px 300px 70px 160px repeat(4,70px);gap:18px;align-items:center;height:42px;border-bottom:1px solid rgba(112,64,95,.45);font-size:15px}
.trow img{width:64px;height:36px;object-fit:cover}
.trow.h{height:34px;font-size:11px;letter-spacing:.2em;color:#A8869A;text-transform:uppercase}
.fcard{display:flex;flex-direction:column;gap:7px;padding:8px 10px 10px;background:rgba(60,29,49,.42);box-shadow:inset 0 0 0 1px rgba(112,64,95,.6)}
.fcard img{width:100%;height:62px;object-fit:cover;-webkit-mask-image:radial-gradient(ellipse 60% 64% at 50% 50%,#000 50%,transparent 100%);mask-image:radial-gradient(ellipse 60% 64% at 50% 50%,#000 50%,transparent 100%)}
.fcard b{font-family:'Saira Condensed',sans-serif;font-size:21px;text-transform:uppercase;line-height:1}
.tier.hot{outline:2px solid #65E1DF;outline-offset:1px}
.tile{display:flex;flex-direction:column;gap:6px;width:150px;padding:8px;background:rgba(60,29,49,.35);box-shadow:inset 0 0 0 1px rgba(112,64,95,.6)}
.tile img{width:134px;height:70px;object-fit:cover}
.tile b{font-family:'Saira Condensed',sans-serif;font-size:19px;text-transform:uppercase;line-height:1}
.tile small{font-size:11px;color:#A8869A}
.lane{display:grid;grid-template-columns:90px 1fr;gap:20px;align-items:center;min-height:132px;border-bottom:1px solid rgba(112,64,95,.5);padding:10px 0}
.lane .tier{width:72px;height:72px;font-size:46px}
.lane .tiles{display:flex;gap:12px;flex-wrap:wrap}
.grow{animation:grow .7s cubic-bezier(.45,0,.2,1) both}
@keyframes grow{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
@media (prefers-reduced-motion:reduce){.grow{animation:none}}
</style>
</helmet>
<div class="app" style="width:1920px;height:1080px">
<header style="position:absolute;left:64px;right:64px;top:24px;height:52px;display:flex;align-items:center;gap:26px"><span class="disp" style="font-size:28px;letter-spacing:.12em">Fleet Codex</span><span style="font-size:13px;color:#A8869A;letter-spacing:.08em">THE FLEET</span><span style="flex:1"></span></header>
<div style="position:absolute;left:64px;right:64px;top:92px;display:flex;align-items:flex-end;gap:30px">
  <div><div class="lab" style="color:#65E1DF">THE FLEET</div><h1 class="disp" style="font-size:60px;margin:4px 0 0">Pick a vessel</h1></div>
  <span style="flex:1"></span><span style="font-size:14px;color:#A8869A">{{shown}} solo vessels</span>
</div>
<div style="position:absolute;left:64px;right:64px;top:176px;display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:center">
  <span class="lab">SORT BY</span><div style="display:flex;gap:6px;flex-wrap:wrap"><sc-for list="{{sorts}}" as="c" hint-placeholder-count="5"><button type="button" class="{{c.cls}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div>
  <span class="lab">COMPLETION</span><div style="display:flex;gap:6px;flex-wrap:wrap"><sc-for list="{{stages}}" as="c" hint-placeholder-count="5"><button type="button" class="{{c.cls}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div>
  <span class="lab">TIER</span><div style="display:flex;gap:18px;align-items:center"><div style="display:flex;gap:6px;flex-wrap:wrap"><sc-for list="{{tels}}" as="c" hint-placeholder-count="4"><button type="button" class="{{c.cls}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div><span style="width:1px;height:26px;background:#70405F"></span><div style="display:flex;gap:6px;flex-wrap:wrap"><sc-for list="{{tls}}" as="c" hint-placeholder-count="5"><button type="button" class="{{c.cls}}" onClick="{{c.pick}}">{{c.label}}</button></sc-for></div></div>
</div>
<div style="position:absolute;left:64px;right:64px;top:318px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px">
  <sc-for list="{{cards}}" as="v" hint-placeholder-count="18"><div class="fcard">
    <img src="{{v.img}}" alt="">
    <div style="display:flex;align-items:baseline;gap:8px"><b>{{v.name}}</b><span style="flex:1"></span><span class="disp num" style="font-size:20px">{{v.pctS}}</span></div>
    <div class="seg thin"><sc-for list="{{v.segs}}" as="g" hint-placeholder-count="5"><i class="{{g.cls}}" style="{{g.style}}"></i></sc-for></div>
    <div style="display:flex;align-items:center;gap:5px"><span class="{{v.stageCls}}" style="font-size:15px;flex:1">{{v.stage}}</span>
      <sc-for list="{{v.tiers}}" as="t" hint-placeholder-count="4"><span style="display:flex;flex-direction:column;align-items:center;gap:2px"><span class="{{t.cls}}" style="width:24px;height:24px;font-size:15px">{{t.t}}</span><small style="font-size:9px;letter-spacing:.1em;color:#A8869A">{{t.e}}</small></span></sc-for></div>
  </div></sc-for>
  <sc-if value="{{none}}" hint-placeholder-val="{{false}}"><p style="color:#A8869A;grid-column:1/-1">No vessel matches both filters.</p></sc-if>
</div>
</div>
</x-dc>
