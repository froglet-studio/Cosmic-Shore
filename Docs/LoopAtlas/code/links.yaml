# Code Atlas hand links: which code implements each loop. Loop id (Docs/LoopAtlas/model) -> code node ids, or globs over
# ids (* ? [...], at most 60 hits each). Ids: d:<dir> f:<file> t:<Full.Type> n:<namespace> (Docs/LoopAtlas/CODE.md).
# Every repo path a loop already cites in src (and every vessel's class asset, ability map and named types, and every
# arcade card the map names) is linked automatically by Tools/Build/code_atlas.py; add here what that misses.
# A pattern that matches nothing is listed by the build ("link: ..."), never dropped silently.
