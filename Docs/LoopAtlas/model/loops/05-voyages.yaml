- id: voy.home
  parent: voyages
  at: 4
  name: The way home
  tier: 3
  kind: loop
  t: [30, 300]
  is: A decision with teeth. A laden Ark draws pirates, and only docking extracts. A fall or an abandoned voyage loses what
    is aboard.
  phases:
  - n: Count what is aboard
  - n: Read the rumour about your own Ark
  - n: Push on or turn back
  - n: Run for the harbour
  drivers: [stake, own]
  reps: '1'
  repsOf: per voyage
  now:
