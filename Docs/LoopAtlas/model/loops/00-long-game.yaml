# Loop Atlas model: loops, long-game. Docs/LoopAtlas/README.md explains the fields.
# Edit here; Tools/Build/loop_atlas.py build rebuilds model.json and the page.
- id: era
  name: The long game
  tier: 7
  kind: loop
  t: [1209600, 15552000]
  is: Everything the product offers a person over months. Each pass is a stretch of sittings that ends because the world,
    the fleet or the meta changed.
  phases:
  - n: Come back
    d: 'Something pulled you in: a friend, news from the sea, a new hull, habit.'
  - n: Pick a place
    d: Home offers the Toybox, the Arcade, the Arena and Voyages.
  - n: Play a sitting
    d: Rounds in one place, sometimes crossing to another.
  - n: Bank what it paid
    d: Crystals, quest progress, artifacts, standing, replays.
  - n: Grow
    d: 'Spend and arrange: a vessel, a squad, a pilot, an artifact.'
  - n: The world moves on
    d: The sea ticks, sagas open, the meta is rebalanced, a vessel is added.
  drivers: [find, own, story, crew, mastery]
  now:
    s: part
    note: The places and most arcs exist. Nothing in the build changes on a schedule, so the last phase is empty today.
  plan:
    note: The meta is rebalanced on a schedule by the elemental loop's step 5, voyages add a living sea with sagas and relics,
      and new vessels enter at step 1 and unsettle more than their own balance.
  prop:
    s: change
    note: 'Give the last phase a name and a clock: the Tide (see The Tide).'
  holes:
  - 'on': np
    q: How often a person comes back is now read (the Froglet Analytics console's Sessions and Retention pages, from
      session_started and session_ended in builds after 2026-11-07; PostHog was closed on 2026-11-23), but how many
      sittings make one pass is not, because nothing marks a pass or a Tide.
    fill: Target 3 to 5 sittings a week and one Tide every 6 weeks. Read sittings per week from the Sessions page's
      sessions per player, and mark the pass with a tide_started event when the Tide ships, before tuning anything above
      the Round.
  src:
  - Docs/ElementalLoop/PLAYBOOK.md section 0
  - Docs/Voyages/DEPTH.md
  - Docs/ACTIVATION.md section 5
