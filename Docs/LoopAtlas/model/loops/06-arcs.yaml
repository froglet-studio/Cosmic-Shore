- id: arc.flower
  parent: era
  at: 4
  in: x
  name: The vessel's flower
  tier: 6
  kind: loop
  t: [3600, 604800]
  is: 'Proposed. Each vessel has a flower of three petals: Time, Charge, Mass-Space. A petal lights when its game is cleared
    at I3. It is the player''s own pass through the elemental loop.'
  phases:
  - n: Fly the hull's Time game
    d: Petal 1. Offers Regatta.
  - n: Its Charge game
    d: Petal 2. Offers Broadside.
  - n: Its Mass-Space game
    d: Petal 3. Offers Brood Rush.
  - n: The flower is whole
    d: The hull is marked voyage-ready in the squad book.
  drivers: [mastery, own, goal]
  reps: '3'
  repsOf: petals per vessel
  prop:
    s: add
    note: Proposal P8. It gives every card an order, makes 'arcade trains for arena' visible to the player, and reuses the
      petal shape the HUD already teaches.
  src: [proposal]
