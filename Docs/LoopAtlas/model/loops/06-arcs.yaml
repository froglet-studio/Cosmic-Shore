- id: arc.saga
  parent: era
  at: 5
  name: A saga
  tier: 6
  kind: loop
  t: [259200, 3628800]
  is: One story across several voyages. Each chapter is news that becomes a job, found only with the right faction's pilot
    seated, and the last chapter holds a relic that exists once.
  phases:
  - n: A chapter's news reaches port
  - n: Seat the pilot it asks for
  - n: Sail the chapter's job
  - n: The next chapter opens
  - n: 'The finale: a relic'
  drivers: [story, own, find]
  reps: '3'
  repsOf: chapters per saga; four sagas authored
  now:
    s: built
    note: Four sagas of three chapters, each ending in a named relic. A saga runs once.
  holes:
  - 'on': np
    q: A saga does not run again, so four sagas are a fixed amount of story. 'A season could reseed it' is a default, not
      a decision.
    fill: Each Tide reseeds one saga and adds one, so there is always an unfinished thread.
  - 'on': np
    q: 'Four sagas of three chapters last a weekend-binge group about three weekends (simulated: spent by day 19 to 20 in
      a third of the Night Crew''s runs as planned, in all of them with chapters and one currency).'
    fill: Each Tide reseeds one saga (era.tide phase 3), so a binge group meets a new chapter every six weeks, and a saga's
      chapter length follows the voyage chapter (P13), not a whole voyage.
  src:
  - Docs/Voyages/DEPTH.md section 5
  - Docs/LoopAtlas/sim/REPORT.md
- id: arc.social
  parent: era
  at: 0
  name: Party and friends
  tier: 6
  kind: loop
  t: [600, 604800]
  is: Invite a friend, play as a party, rematch, and come back because they did.
  phases:
  - n: Invite or be invited
  - n: Party up
    d: AI fills the empty seats.
  - n: Play together
  - n: Rematch
  - n: They are on your friends list
  drivers: [crew, rival]
  reps: null
  repsOf: sittings with a friend
  now:
    s: built
    note: A party match pays every member by the party's best placing. Losing still pays nothing in solo play, as decided.
  prop:
    s: change
    note: 'A crew vessel''s empty seat is the invite: ''fly the kite on my Wrasse''.'
  holes:
  - 'on': np
    q: Nothing a party does together lasts past the sitting, so a friend is a reason to play tonight and not a reason to
      return.
    fill: 'A party shares one voyage record: the Ark, its hoard and the saga thread belong to the party that sailed it.
      Since 2026-11-21 friends follow the host into one voyage and sail one Ark domain the host picks and friends vote on
      (commits 00373d12f, 2d72d986f), so the party the record would belong to now exists.'
  - 'on': np
    q: Since 2026-11-21 a party on two builds is kept apart (the protocol version gates matchmaking and every join by id,
      commit 8697ef19f) and the friend sees only a mismatch toast, so the older friend has no way back to the party from
      that moment. The live flags' update wall (commit 7324953ba) answers only the flags' minimum version, not a friend's
      newer build.
    fill: The protocol mismatch toast carries the live flags' per-platform update link for whichever side is older, so a
      split party ends in an update instead of a lost evening.
  - 'on': n
    q: The now note says crew vessels are local only, but Docs/CREW_STATIONS.md has the rider seat networked on the Orca,
      Honeyguide, Wrasse and Goby. One of them is stale.
  - 'on': np
    q: 'A group of four meets three seats everywhere: a squad, a voyage party, a team in Brood Rush. Simulated, one of the
      Night Crew sits out 47% of their team matches. No crew vessel has an arena card, so a crew vessel cannot take the
      fourth.'
    fill: 'P15: every crew vessel seats at least one arena card and a voyage squad, so two people share one seat and four
      friends fit three seats.'
  src:
  - Docs/claude/MULTIPLAYER_AND_SOCIAL.md
  - Docs/Voyages/PARTY.md
  - Docs/LoopAtlas/sim/REPORT.md
