- id: arc.crew
  parent: era
  at: 4
  name: Crew and standing
  tier: 6
  kind: loop
  t: [259200, 5184000]
  is: Pilots are people. Recruiting one brings their faction's jobs; succeeding for a faction raises standing, which widens
    the work and the pay. Pirate work raises notoriety, and a bounty.
  phases:
  - n: Recruit a pilot
  - n: 'Seat them: their faction''s jobs appear'
  - n: Do the work
  - n: Standing rises
    d: Stranger, Known, Trusted.
  - n: 'Promote a captain: join a faction'
  drivers: [story, own, reward]
  reps: '5'
  repsOf: successes for one faction to reach Trusted
  now:
    s: part
    note: 'Device-side stand-in built 2026-11-07: unique people on 18 callsigns, standing, notoriety, grudges. The backend
      faction roster and the captain UI are not built.'
  src:
  - Docs/Voyages/DEPTH.md section 6
  - Docs/Voyages/VOYAGES.md section 6.2.1
  - Docs/Pilots/CALLSIGNS.md
  prop:
    s: change
    note: 'Since 2026-11-21 the painted pool holds 324 pilots (PRs 2318, 2328: 17 roster crews, each pilot a species pair
      no earlier one had), and an account is dealt 18 of them once (PaintedCrewSO). Make the dealt crew the start of this
      loop and the other ~300 its recruit pool: "Recruit a pilot" at port offers someone outside your crew, a species pair
      you do not hold yet, and standing is earned per pilot. Each new painted batch then restocks the port, a reason to
      come back that the Returner persona lacks (loop_timescale_sim, PR 2338: Returner 12% at D30 with every fix).'
