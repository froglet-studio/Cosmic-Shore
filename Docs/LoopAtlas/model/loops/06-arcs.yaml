  is: Invite a friend, play as a party, rematch, and come back because they did.
  phases:
  - n: Invite or be invited
  - n: Party up
    d: AI fills the empty seats.
  - n: Play together
  - n: Rematch
  - n: They are on your friends list
  drivers: [crew, rival]
  reps: null
  repsOf: sittings with a friend
  now:
