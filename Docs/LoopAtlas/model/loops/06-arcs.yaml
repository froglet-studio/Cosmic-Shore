# Loop Atlas model: loops, arcs. Docs/LoopAtlas/README.md explains the fields.
# Edit here; Tools/Build/loop_atlas.py build rebuilds model.json and the page.
- id: arc.activation
  parent: era
  at: 0
  name: Activation
  tier: 6
  kind: loop
  t: [600, 7200]
  is: The first hours. A spotlight guide to the first game, a Lesson per ship with a ghost that flies the step once, then
    a Mentor's tips.
  phases:
  - n: First launch
  - n: The spotlight leads to one card
  - n: The Lesson
    d: The autopilot flies the step once, then hands over the stick.
  - n: The Mentor's tips
  - n: The quest chain takes over
  drivers: [mastery, find, goal]
  reps: '1'
  repsOf: per player; one Lesson per ship
  now:
    s: dark
    note: Built and merged, never run in the editor. The master unlock is on in shipped builds, so a fresh install gets
      every lock open and no guidance.
  plan:
    note: The Microgame Training plan. The gate is flipped once the chain is signed off.
  holes:
  - 'on': n
    q: No player has seen the onboarding. The first loop a stranger meets is an unlocked menu.
  - 'on': p
    q: The Lesson teaches a ship's Time verb. Nothing yet teaches a combo or a role.
    fill: 'The Mentor''s stream is ordered by the ladder of tiers: Pulse and Verb in the Lesson, the kit''s first Combo
      after three races, the Role the first time the player enters a Mass-Space game.'
  - 'on': p
    q: 'Activation is one funnel: every new player is led to a flying race. Simulated, a player who came for the Ratel''s
      puzzle flies 62% of her arcade rounds today and all of them once the gate flips (the Honeyguide''s cards open only
      after the chain), and leaves (D30 3 to 4%).'
    fill: 'Activation has doors, each measured on its own: fly (first race finished), solve (first Ratel board played, P14),
      make (first painting shared, P16), crew (first match with a friend, P15). The first-login guide asks which one and
      spotlights it.'
  - 'on': p
    q: Nothing says how often a new player should win their first ten rounds. Simulated against an I1 AI of strength 0.15,
      a non-flyer takes first in 16% of them, a commuter 32%, the teen core 37%.
    fill: 'Target: a new player takes first in at least half of their first ten rounds, read from game_completed placement
      in the first sittings. The I1 AI reaches it with fun, suboptimal behaviour loops (the AI complexity rule), never random
      mistakes.'
  - 'on': npx
    q: 'Activation has one door: first launch, the spotlight, a Lesson that flies a Time verb. Two of the six journeys (Mira,
      the night crew) arrive by invite and never pass through it, and Mira does not want to fly at all.'
    fill: 'Activation starts where the player arrived: an invite starts in the inviter''s party and the seat it named, and
      the Lesson for that seat (a crew board, a hull) runs there.'
  src:
  - Docs/ACTIVATION.md
  - Docs/ModePreview/TRAINING_PLAN.md
  - Docs/LoopAtlas/sim/REPORT.md
- id: arc.unlock
  parent: era
  at: 3
  name: The quest chain
  tier: 6
  kind: loop
  t: [3600, 1209600]
  is: Games unlock in a chain. Reaching a mode's top rung completes its quest; claiming it opens the next. There is no XP.
  phases:
  - n: Play the frontier mode
  - n: Reach rung I4
  - n: Claim the quest
  - n: The next mode unlocks
  - n: 'At the end: the Hangar opens'
  drivers: [reward, find, mastery]
  reps: '4'
  repsOf: quests before the Hangar
  now:
    s: built
    note: A quest clears at I2, so the chain is about four to eight wins, and I3 and I4 stay the ladder's challenge after
      the Hangar.
  holes:
  - 'on': np
    q: The chain orders 4 cards. About 80 others have no order, so after the Hangar opens nothing says what to play next.
    fill: 'After the Hangar, the chain is per vessel: each hull''s flower (see The vessel''s flower) is its own short chain
      of three element games.'
  src:
  - Docs/MENU_PROGRESSION_AND_IAP.md section 2
  - Docs/QUEST_TRACK_AND_BREADCRUMB.md
  - Docs/LoopAtlas/sim/REPORT.md
- id: arc.fleet
  parent: era
  at: 4
  name: The fleet
  tier: 6
  kind: loop
  t: [86400, 2592000]
  is: Winning pays crystals, crystals buy vessels, and a new vessel is a new kit with its own games to learn.
  phases:
  - n: Win rounds
  - n: Crystals add up
  - n: Buy a vessel in the Hangar
  - n: Learn its kit in its games
  - n: Seat it in a squad
  drivers: [own, reward, find]
  reps: '20'
  repsOf: wins per vessel (200 a win, 4000 a vessel)
  now:
    s: part
    note: 'The economy is live: the winner is paid 200, everyone else nothing; five vessels cost 4000 each. Twenty-three
      hulls exist; most are not priced or in the shipping list.'
  prop:
    s: change
    note: Crystals get a second sink so the loop does not end with the last vessel.
  holes:
  - 'on': np
    q: Crystals buy only vessels. When the fleet is owned the reward has no use, and the payout stops driving anything.
    fill: 'Three more sinks: refitting the Ark (hold and plates), recruiting a pilot at port, and colour sets.'
  - 'on': np
    q: Which of the 23 hulls ship, at what price and in what order, is not decided beyond the first five.
    fill: 'Price by how many loops a hull opens: a solo hull 4000, a crew vessel 6000 because it opens a second seat for
      a friend.'
  - 'on': np
    q: A daily arena player owns all seven priced vessels by day 12 to 14 and holds about 60,000 crystals nobody can spend
      by day 42 (simulated). P7's three sinks add about nine days. A casual or puzzle player never reaches the first vessel
      at all.
    fill: 'Two ends to fix. For the core: open the other hulls over the Tides (one or two per Tide), so the fleet has a
      new goal every six weeks, and keep P7''s sinks. For the casual end: their first vessel comes from the doors they play
      (a solved board, a shared painting, a daily job), not only from placing.'
  - 'on': n
    q: 'Today the master unlock owns every vessel, so crystals buy nothing and no playtest can measure the economy: whatever
      testers earn is banked and never spent.'
    fill: A tester build that keeps the unlock for modes and the Hangar but locks vessels, so the earn-to-buy step can be
      watched before launch.
  - 'on': npx
    q: Only the winner is paid. In a group of friends who beat each other, the one who wins least owns nothing new after
      two weeks; in the night crew journey that friend leaves on day 17 and the crew shrinks.
    fill: Pay a team win to every seat on the team, crew seats included, and pay a little for finishing, so a friend's fleet
      grows at the group's pace.
  src:
  - Docs/ECONOMY_AND_PRICING.md
  - Docs/MENU_PROGRESSION_AND_IAP.md section 2c
  - Docs/LoopAtlas/sim/REPORT.md
