- id: era.meta
  parent: era
  at: 5
  name: The meta turns
  tier: 7
  kind: loop
  t: [2419200, 10368000]
  is: 'The studio''s elemental loop, seen from the player''s side: arena play exposes imbalance, vessels are retuned, and
    a new vessel disturbs more than itself.'
  phases:
  - n: Arena environments plateau
  - n: What is left over is vessel imbalance
  - n: Vessels and elements are retuned
  - n: Ladders and AIs are redone for them
  - n: A new vessel enters at step 1
  drivers: [mastery, find, rival]
  in: px
  plan:
    s: decided
    note: 'Garrett, 2026-11-12: it will disrupt the meta on an optimized schedule before it gets stale. Each loop needs
      fewer people.'
  prop:
    s: change
    note: Tie each turn to a Tide so that players can see it coming.
  holes:
  - 'on': p
    q: The schedule is not set, and nothing tells a player that the meta turned or why their vessel flies differently.
    fill: One turn per Tide, six weeks. The Tide's news says in authored words which vessels changed and which arena environments
      are new.
  src:
  - Docs/ElementalLoop/PLAYBOOK.md sections 0 and 1
