      creator and waits on a playtest. Broadside and Brood Rush have not started steps 4 and 5.
  plan:
    note: Three polished arena games, one per element pair, each with an environment creator trained against a fixed pool
      of elemental AIs. No artifacts in the Arena.
  prop:
    s: change
    note: An arena match offers the voyage that squad is ready for.
  holes:
  - 'on': np
    q: Matches per set, and what makes a squad stay for another, are not written.
