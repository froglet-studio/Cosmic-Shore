- id: round.broodrush
  parent: arena
  at: 2
  name: Brood Rush
  tier: 4
  kind: loop
  t: [120, 360]
  kit: ms
  element: Mass-Space
  is: 'The Mass and Space arena: teams fight for the nucleus claim and score when fauna are born under it.'
  phases:
  - n: Read the nucleus
  - n: Cultivators add volume, destroyers remove it
  - n: The claim tips
  - n: A brood is born in your colour
  - n: First to 3 broods
  drivers: [make, break, crew, goal]
  reps: '3'
  repsOf: broods to win with three teams
  now:
    s: part
    note: Seven hulls seated; three teams and the volume books landed 2026-11-18. Steps 4 and 5 not started.
  plan:
    note: Balances net control of space. Each vessel's place between cultivator and destroyer is measured from play, never
      set.
  holes:
  - 'on': np
    q: 'Since 2026-11-26 every vessel has a role set by hand: Cultivator, Destroyer or a third, Guardian (protects allied
      prisms), with nine archetypes and counters, shown in the Hangar (Shombith''s board, Docs/Vessels/ARCHETYPES.md,
      125231223). The plan above says a vessel''s place is measured, never set, and the phases have no step for guarding.
      Nothing says which wins when a hull''s role and its measured place disagree.'
    fill: Treat the board's role as the design intent and the volume judge (standing volume by trail type, e90ea20a9) as
      the measure. A hull whose measured place contradicts its role goes back to its redesign, and 'Guard your claim'
      joins the phases once a Guardian is seated.
  src:
  - Docs/ArcadeRestructure/PLAN.md rulings 10 to 12
  - Docs/ElementalLoop/PLAYBOOK.md section 1
  prop:
    s: change
    note: 'Seat the twelve hulls the trail-volume lever already balanced (Meerkat, Wrasse, Urchin, Honeyguide, Stoat, Sparrow,
      Scarab, Squirrel, Dolphin, Orca, Tiger Moth, Thresher: each within 10% of the mean on net control of space over 124
      real-game matches) as Brood Rush''s roster now, and hold the ten flagged hulls (Manta, Serpent, Grizzly, Jewel Wasp,
      Angler, Rhino, Jacks, Goby, Swordfish, Brittle Star) out until the redesign brings each in range. The Shrike''s nest
      rework measured 1.09, so it may join first. Source: commits 2b94a1fda and b8f578023, Docs/ElementalLoop/REDESIGN.md.'
