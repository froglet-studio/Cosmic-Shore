verbs:
  Time:
    ability: Faster Ride
    does: You rush through every tunnel faster, your own or another Meerkat's.
    trigger: Passive - ride a tunnel
    scales: More Time makes the rush through every tunnel stronger.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/MEERKAT.md
