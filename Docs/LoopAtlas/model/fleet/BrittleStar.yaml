label: Brittle Star
verbs:
  Time:
    ability: Speed Mode
    does: Ignite every thruster for a big jump in cruise speed. The trail spreads out and stretches so it still joins up,
      without laying more prisms per second.
    trigger: Tap to switch mode
    scales: More Time makes Speed Mode faster still.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/BRITTLE_STAR.md
    arch: mode
    t: [5, 30]
  Charge:
    ability: Charge Mode
    does: 'Five cords, one per turret, slice prisms and strike rival hulls for petals: loose whips, or stiff sabers while
      you fire. With a spare ring, throw the ring to burst a spinning disk that wrecks every prism in its plane.'
    trigger: Tap to switch mode
    scales: More Charge widens the cords' cut, grows the rounds and thickens the thrown ring's blast disk.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/BRITTLE_STAR.md
    arch: mode
    t: [5, 30]
  Mass:
    ability: Creation Mode
    does: 'Lay a trail behind each of the ring''s five corners instead of one behind the cockpit, the five lines turning
      with the ring. The slowest mode: you cruise at half speed.'
    trigger: Tap to switch mode
    scales: More Mass makes every block you lay wider and taller, never longer.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/BRITTLE_STAR.md
    arch: mode
    t: [5, 30]
  Space:
    ability: Space Mode
    does: All five guns fire together, converged ahead or splayed by your aim, and rounds that hit rival hulls take petals.
      Firing heats the guns; overheated they stop, and your trail lays danger prisms.
    trigger: Tap to switch mode, hold to fire
    scales: More Space gives every gun longer range and lets the guns hold more heat before they overheat.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/BRITTLE_STAR.md
    arch: mode
    t: [5, 30]
  Omni:
    ability: Ring Charge
    does: Adds a spare ring to your stock, up to two, so you can throw your ring for a ring explosion.
    trigger: Pick up an omni crystal
    scales: ''
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/BRITTLE_STAR.md
    arch: omni
    t: [10, 60]
