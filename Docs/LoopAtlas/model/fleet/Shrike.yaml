label: Shrike
verbs:
  Time:
    ability: Void Sling
    does: Shoot a tether at the first block ahead; the hull flies straight there in one second, laying thick trail, and
      docks on arrival. No block in range, no sling. A crystal resets it.
    trigger: Select mode, then tap fire
    scales: More Time shortens the sling's cooldown.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/SHRIKE.md
    arch: mode
    t: [5, 30]
  Charge:
    ability: Targeting Array
    does: Paint a target - a rival first, then a creature, a plant or nearby mass - and every nest plant with a ready missile
      launches it. Missiles home while you paint and burst on contact, a petal hit on any rival caught.
    trigger: Select mode, then hold fire to paint
    scales: More Charge does not change the missiles; it widens your Void Lance's beam.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/SHRIKE.md
    arch: mode
    t: [5, 30]
  Mass:
    ability: Nest
    does: Touch any block and you dock to it; docked, every cooldown runs faster. Detach and you leave a nest behind - a
      cup of super-shielded blocks crowned with a plant that grows a missile. Up to three nests at once.
    trigger: Passive dock; tap to detach
    scales: More Mass builds each nest from more blocks and tightens your trail's wave.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/SHRIKE.md
    arch: passive
    t: [2, 15]
  Space:
    ability: Void Lance
    does: Fire a long hitscan beam that breaks every block it passes, any domain, except super-shielded mass and the nest
      you sit in. A rival hull on the line takes a scored petal hit.
    trigger: Select mode, then hold fire
    scales: More Space does not change the lance; it widens the Targeting Array's lock cone.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/SHRIKE.md
    arch: mode
    t: [5, 30]
  Omni:
    ability: Shrike
    does: The crystal becomes a nest plant where it was, which grows large missiles you can call down, and your Void Sling
      is ready again at once.
    trigger: Pick up an omni crystal
    scales: ''
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/SHRIKE.md
    arch: omni
    t: [10, 60]
