label: Jacks
verbs:
  Time:
    ability: Decoys
    does: Herding, drop a decoy jack where one of your jacks stands; it keeps the herd away like a third jack. Netting,
      rush the whole ship to the decoy at speed.
    trigger: Tap
    scales: More Time makes your herd swim faster.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/JACKS.md
    arch: tap
    t: [2, 20]
  Charge:
    ability: Danger Share
    does: Part of your herd turns dangerous. A danger creature that touches a rival hull stings it, scoring a hit, and is
      used up.
    trigger: Passive - your herd touches a rival
    scales: More Charge makes more of your herd dangerous, from none of it to all of it.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/JACKS.md
    arch: passive
    t: [2, 15]
  Mass:
    ability: The Call
    does: Herding, the herd rushes to the point between your two jacks for a moment. Netting, it switches whether your creatures
      are pulled onto your plane.
    trigger: Tap
    scales: More Mass makes your herd breed faster, each birth costing less food.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/JACKS.md
    arch: tap
    t: [2, 20]
  Space:
    ability: Wide
    does: Herding, the view eases out to show the whole cell so you can find more creatures, and back in again. It does
      nothing while netting.
    trigger: Tap
    scales: More Space widens the ring your jacks and decoy push the herd away with.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/JACKS.md
    arch: tap
    t: [2, 20]
  Omni:
    ability: Omni Worm
    does: A jack or the hull that collects an omni crystal hatches a worm colony of your colour behind you, which eats prisms
      and creatures. A crystal caught in the net is carried, not collected.
    trigger: Pick up an omni crystal
    scales: ''
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/JACKS.md
    arch: omni
    t: [10, 60]
