label: Rhino
verbs:
  Time:
    ability: Ramp Spool
    does: Fly at full throttle in a straight line and the Rhino winds up steadily toward a very high top speed. Turning
      bleeds it off. Prisms you ram are shoved aside and cost you no speed.
    trigger: Passive - fly flat out and straight
    scales: More Time winds you up to top speed faster; the top speed itself stays the same.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/RHINO_RAMP_BOOST.md
    arch: passive
    t: [2, 15]
  Charge:
    ability: Carry
    does: A prism your plough throws keeps flying past where it would land and smashes the next prism in its way - both
      break.
    trigger: Passive - plough
    scales: More Charge lets a thrown prism fly further on to hit another.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/RHINO_PLOUGH.md
    arch: passive
    t: [2, 15]
  Mass:
    ability: Blade
    does: A plough blade across your nose catches the prisms you fly into and throws them clear of the whole blade.
    trigger: Passive - plough
    scales: More Mass makes the plough blade wider.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/RHINO_PLOUGH.md
    arch: passive
    t: [2, 15]
  Space:
    ability: Furrow
    does: Every prism your hull hits is shoved aside, never destroyed. Pull a trigger for a little shove that way; hold
      it and everything you plough is thrown to that side.
    trigger: Hold LT or RT to steer
    scales: More Space throws ploughed prisms further aside.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/RHINO_PLOUGH.md
    arch: hold
    t: [2, 12]
