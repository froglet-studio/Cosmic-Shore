label: Manta
verbs:
  Time:
    ability: Yawstery
    does: Hard, flat turns on the turn pair, one side per direction. Your trail is a plain trail; Time makes the Manta faster,
      cruising and soaring.
    trigger: Hold, one side per direction
    scales: More Time raises your cruise speed and your soaring speed.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/MANTA_STING_KABLOOM.md
    arch: hold
    t: [2, 12]
  Charge:
    ability: Sting
    does: Graze a rival vessel or creature to plant a bomb without them knowing; each costs the energy your skimming gathers.
      Every bomb shares one fuse and a new plant resets it, so they all go off together, and none can be scraped off.
    trigger: Passive - skim to arm, graze to plant
    scales: 'More Charge makes the shared fuse run longer when a plant resets it: 20 s at rest, 30 s at Charge 10.'
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/MANTA_STING_KABLOOM.md
    arch: passive
    t: [2, 15]
  Mass:
    ability: Decoy
    does: Every elemental crystal you collect leaves a decoy where it was, one of its effects frozen as the tell. A rival
      who takes it gets a cluster of danger prisms laid across their course.
    trigger: Passive - collect a crystal
    scales: More Mass makes a decoy stand longer.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/MANTA_STING_KABLOOM.md
    arch: passive
    t: [2, 15]
  Space:
    ability: Skim
    does: 'Skimming prisms gathers the energy that plants bombs, and turns rival prisms explosive: destroyed, they take
      their neighbours with them. Touching a prism with your hull sets off every bomb and loses all the energy.'
    trigger: Passive - skim prisms
    scales: More Space widens your skimmer.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/MANTA_STING_KABLOOM.md
    arch: passive
    t: [2, 15]
  Omni:
    ability: Kabloom
    does: Every bomb you have planted on rivals and creatures goes off at once, and a blast blooms round your own ship as
      well.
    trigger: Pick up an omni crystal
    scales: ''
    source: Assets/_Scripts/Controller/ImpactEffects/EffectsSO/Vessel Crystal Effects/MantaKabloomByCrystalEffectSO.cs
    arch: omni
    t: [10, 60]
