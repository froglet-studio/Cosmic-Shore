label: Scarab
verbs:
  Time:
    ability: Throttle
    does: 'Thrust along your nose: the deeper you press, the harder you keep accelerating. Letting go is your only brake.'
    trigger: Hold, deeper pushes harder
    scales: More Time raises the throttle's top speed.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/SCARAB.md
    arch: hold
    t: [2, 12]
  Charge:
    ability: Shove
    does: Every hard dash throws a broad flat plate along your path that shreds prisms, kills creatures and debuffs any
      rival pilot it engulfs, flinging everything the way you dashed. It recovers in a few seconds.
    trigger: Passive - rides your dash
    scales: 'More Charge recharges the shove faster: 2.5 s at rest, 1.25 s at Charge 10.'
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/SCARAB.md
    arch: passive
    t: [2, 15]
  Mass:
    ability: Switch
    does: Place a curved ring around an elemental crystal on your path. Its panel deflects balls; any ball, friend or foe,
      that threads it pays you energy toward your next ball and breaks the switch into a dais of prisms.
    trigger: Tap near a crystal
    scales: More Mass widens the switch's ring, an easier mouth for a ball to thread.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/SCARAB.md
    arch: tap
    t: [2, 20]
  Space:
    ability: Nucleus Seeding
    does: 'While you fly, balls of your domain appear stuck in the cell''s nucleus. Anyone can knock them loose: outward
      they bounce harmlessly around the cell, inward they become live balls in play.'
    trigger: Always on
    scales: More Space seeds bigger balls; each keeps the size it was born with.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/SCARAB.md
    arch: passive
    t: [2, 15]
  Omni:
    ability: Omni crystal
    does: When your skimmer touches an omni crystal it turns into a ball, sitting still where the crystal was, ready for
      you to strike.
    trigger: Pick up an omni crystal
    scales: ''
    source: Assets/_Scripts/Controller/ImpactEffects/EffectsSO/Skimmer Crystal Effects/ScarabBallForgeBySkimmerCrystalEffectSO.cs
    arch: omni
    t: [10, 60]
