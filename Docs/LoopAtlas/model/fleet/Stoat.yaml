    ability: Ripple
    does: Whenever one of your hole pairs collapses, it throws a space-time ripple that strips a petal of every element
      from each rival it sweeps over and kills creatures. It never touches prisms, you or teammates.
    trigger: Passive - when your pair collapses
    scales: More Charge makes the ripple reach further.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/STOAT_DIPOLE.md
    arch: passive
    t: [2, 15]
  Mass:
    ability: Heavy Launch
    does: Your launch out of an orbit hits harder. Let go or flick your steering thumb to fly out of the orbit, aimed where
      you flick or steer, and the kick carries more momentum.
    trigger: Passive - on every launch
    scales: More Mass makes the launch kick harder.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/STOAT.md
    arch: passive
    t: [2, 15]
  Space:
    ability: Catch Orbit
    does: 'Lay a black hole and its white hole ahead, the black hole on the side you pressed. Fly past it on that side and
      it catches you into an orbit: squeeze for a tighter circle, let go or flick to launch where you aim.'
    trigger: Press, hold to orbit, release or flick to launch
    scales: More Space widens the orbit your hole pair catches you into.
    source: Assets/_Scripts/Controller/Vessel/R_VesselActions/STOAT.md
    arch: hold_release
    t: [2, 12]
