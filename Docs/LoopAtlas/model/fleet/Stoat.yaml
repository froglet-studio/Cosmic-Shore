verbs:
  Time:
    ability: Timed Slingshot
    does: While you orbit, your clock warps and you fly faster. Let go about a quarter-turn after the catch, when the dotted
      circle turns lime, for the full slingshot kick; any other moment gives only a fraction.
    trigger: Passive - release timing while orbiting
