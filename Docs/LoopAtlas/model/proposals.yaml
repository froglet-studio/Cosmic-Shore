# Loop Atlas model: proposals. Docs/LoopAtlas/README.md explains the fields.
# Edit here; Tools/Build/loop_atlas.py build rebuilds model.json and the page.
proposals:
- id: P1
  title: One ladder of words
  what: Use the eight tier terms (Pulse, Verb, Combo, Role, Round, Session, Arc, Era) in every design doc, ticket and review,
    so a problem is placed before it is argued.
  touches: [era]
- id: P2
  title: Every verb names its feeling
  what: 'Each ability''s doc gets its loop as steps and one sentence: the feeling, and the step where it lands. The fun
    card asks about that step.'
  touches: []
- id: P3
  title: Every kit names two combos
  what: A feeder into a spender, and one that crosses two elements. Ability icons and the Mentor teach them; a game's course
    is checked against them.
  touches: []
- id: P4
  title: Show the role
  what: The two volume numbers the scoreboard already books become one live meter, and the vessel's measured lean goes on
    its Hangar card.
  touches: [round.ms, round.broodrush, voy.cell]
- id: P5
  title: The breath between rounds
  what: 'After every result, one offered next step: rematch, next rung, or a crossing to the place the round trained for.'
  touches: [breath, sitting, arcade]
- id: P6
  title: The Tide
  what: A daily job, a weekly card and a six-week season, built from the living sea's tick and the studio's rebalance.
  touches: [era.tide, era.meta, arc.saga, arc.support]
- id: P7
  title: More to spend crystals on
  what: Ark refits, recruiting pilots and colour sets, so the payout still drives something after the last vessel.
  touches: [arc.fleet]
- id: P8
  title: The vessel's flower
  what: Three petals per hull, lit by clearing its Time, Charge and Mass-Space games at I3. The player's own pass through
    the elemental loop.
  touches: [arc.flower, arc.unlock]
- id: P9
  title: Set the counts
  what: 'Cells per leg, rounds per run, matches per set, passes per round: each gets a target number and an analytics event
    that measures it.'
  touches: [voy.cell, arcade, arena, sitting]
- id: P10
  title: One currency
  what: Voyage pay is the same crystals as arcade pay, so 'the voyage ended, buy a vessel' is a real path.
  touches: [voyages, arc.fleet]
- id: P11
  title: A party owns something
  what: A party shares one voyage record, and a crew vessel's empty seat is an invite.
  touches: [arc.social]
- id: P12
  title: A replay can travel
  what: A ten-second cut shared as a link that opens the same card at the same rung.
  touches: [arc.replay]
- id: P13
  title: Voyage chapters
  what: A voyage can be left at any location it has reached and picked up next sitting, with the haul still aboard; only
    the dock at home banks it. A 20 to 40 minute voyage becomes two to four phone sittings, and a commuter stops losing
    hauls (100% of started voyages simulated as planned, none with chapters).
  touches: [voyages, voy.place, voy.home, sitting]
- id: P14
  title: A puzzle-first door
  what: The first-login guide asks fly or solve. A solver's spotlight leads to the Ratel's board while the Honeyguide's
    AI flies, and a Honeyguide game counts for the quest chain. Simulated, it lifts a puzzle player's D30 from 3% to 94%,
    with P15.
  touches: [arc.activation, arc.unlock, toybox, fleet]
- id: P15
  title: A crew vessel in every squad
  what: 'Every crew vessel seats at least one arena card and a voyage squad, so two people share one seat: a parent rides
    as the Ratel in a child''s arena squad, and four friends fit three seats.'
  touches: [arena, voyages, arc.social, arc.squad, fleet]
- id: P16
  title: Making pays
  what: A finished painting pays a little and can be shared as a replay link; a liked painting is the creative player's
    win. The Toybox feeds the long game instead of standing beside it.
  touches: [toybox, toy.paint, arc.replay, arc.fleet]
