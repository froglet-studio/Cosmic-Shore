# Loop timescale simulation: the players' side. Each segment is a culture or demographic described by the
# timescales it prefers: how long a sitting is, how many a day, when, how long one finishable thing may take, which
# reset rhythm it answers to (daily, weekly, seasonal), how long it will grind for one goal, and how it plays with
# others. These are PRIORS, not measurements: industry-common patterns written as numbers so the simulation can be
# argued with. Every segment says how sure it is. Replace a prior with telemetry (game_started / game_completed per
# account, Docs/Analytics/event-taxonomy.md) as soon as there is any; the simulation reads the same fields.
# Read by Tools/Build/loop_timescale_sim.py. Docs/LoopAtlas/sim/README.md explains the fields.
#
# Fields:
#   sittings: [weekday lo, hi, weekend lo, hi]  sittings a day (a uniform pick between lo and hi; fractions are odds)
#   minutes:  [weekday lo, hi, weekend lo, hi]  minutes in one sitting
#   hours:    the hours of the day sittings start in (local time)
#   unit:     [lo, hi] minutes one finishable thing should take; longer than hi feels like a commitment
#   reset:    days of the rhythm the segment answers to (1 daily, 7 weekly, 42 seasonal, 0 none)
#   patience: wins this segment will put into one goal before it feels like a grind
#   habit:    chance of coming back on a day with a sitting scheduled, before the game earns anything
#   social:   solo | with-friends | squad (who they play with by default)
#   wants:    weights over the drivers in the model (joy, mastery, make, break, rival, crew, find, own, stake, story,
#             goal, reward); the simulation scores each place by how much of what a segment wants it offers
#   sure:     low | medium  (how well-founded the prior is)

segments:
- id: casual-mobile
  name: Casual mobile, Western
  is: Plays on a phone in the gaps of a day, puzzle and idle games mostly. Will not learn a control scheme to play.
  sittings: [1, 2, 1, 3]
  minutes: [4, 10, 5, 15]
  hours: [7, 12, 20, 21, 22]
  unit: [1, 4]
  reset: 1
  patience: 6
  habit: 0.55
  social: solo
  wants: {joy: 2, make: 1, goal: 2, reward: 2, own: 1, mastery: 0.5}
  sure: medium

- id: east-asia-commute
  name: East Asian mobile, commuter
  is: Two or three short sittings a day on trains, a fixed daily routine around resets, high completion and collection
    drive, fluent in daily missions and season passes.
  sittings: [2, 4, 1, 3]
  minutes: [5, 8, 8, 25]
  hours: [7, 8, 12, 18, 19, 23]
  unit: [2, 5]
  reset: 1
  patience: 25
  habit: 0.75
  social: solo
  wants: {goal: 2, reward: 2, own: 2, mastery: 1.5, rival: 1, story: 1}
  sure: medium

- id: latam-sea-social
  name: Latin American and South-East Asian mobile, social
  is: Plays where friends play, on a shared or mid-range phone, in the evening, in voice chat. Free to play expected; a
    friend leaving is the main reason to stop.
  sittings: [1, 2, 1, 3]
  minutes: [15, 40, 20, 60]
  hours: [19, 20, 21, 22]
  unit: [3, 10]
  reset: 7
  patience: 15
  habit: 0.5
  social: with-friends
  wants: {crew: 3, rival: 2, joy: 1, break: 1, reward: 1}
  sure: low

- id: teen-competitive
  name: Teen competitive
  is: After school and after homework, ranked matches with the same friends, wants to be seen getting better.
  sittings: [1, 2, 1, 3]
  minutes: [30, 75, 45, 150]
  hours: [16, 17, 19, 20, 21]
  unit: [2, 8]
  reset: 7
  patience: 20
  habit: 0.7
  social: squad
  wants: {rival: 3, mastery: 2, crew: 2, break: 1, own: 1}
  sure: medium

- id: pc-core-adult
  name: PC core, 20s and 30s (NA and EU)
  is: Weeknight sessions after work, long weekend binges, in a regular group on voice. Wants depth and something to talk
    about; will play a 40-minute run if it is worth it.
  sittings: [0.6, 1, 1, 2]
  minutes: [45, 120, 90, 240]
  hours: [20, 21, 22, 14, 15]
  unit: [5, 45]
  reset: 7
  patience: 30
  habit: 0.65
  social: squad
  wants: {crew: 3, stake: 2, story: 2, find: 2, rival: 2, mastery: 1}
  sure: medium

- id: steam-completionist
  name: Steam completionist
  is: Buys a game, plays it on weekends in long sittings until its goals are done, dislikes daily chores and will leave
    a game that asks for them.
  sittings: [0.2, 0.5, 1, 1]
  minutes: [40, 90, 120, 300]
  hours: [13, 14, 20]
  unit: [10, 60]
  reset: 0
  patience: 40
  habit: 0.6
  social: solo
  wants: {find: 3, own: 2, story: 2, mastery: 2, goal: 1}
  sure: medium

- id: creative-sandbox
  name: Creative sandbox
  is: Plays to make things and show them. Ignores scores. Comes back when there is a new toy or someone liked a thing
    they made.
  sittings: [0.5, 1, 1, 2]
  minutes: [15, 45, 30, 90]
  hours: [16, 20, 21]
  unit: [5, 30]
  reset: 0
  patience: 5
  habit: 0.45
  social: solo
  wants: {make: 3, joy: 2, find: 2}
  sure: low

- id: lapsed-adult
  name: Lapsed adult
  is: Used to play a lot, now has a job and family. Two or three sittings a week, leaves at the first sign of a grind,
    returns for news or a friend.
  sittings: [0.3, 0.6, 0.5, 1]
  minutes: [15, 30, 20, 45]
  hours: [21, 22, 15]
  unit: [3, 15]
  reset: 7
  patience: 8
  habit: 0.4
  social: solo
  wants: {joy: 2, mastery: 1, story: 1, find: 1, crew: 1}
  sure: low
