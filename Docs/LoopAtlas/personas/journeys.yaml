# Player journeys: who plays Cosmic Shore, and the path each takes through the Loop Atlas's loops.
# Garrett, 2026-11-21: "anticipate how different demographics will engage differently and model their different
# paths ... I want to know what their activation paths look like ... animate their path through their respective
# gameplay loops with a velocity slider."
#
# Every persona here is a hypothesis on the Proposed layer: an invention for the team to accept, change or throw out.
# Nothing here is measured. The loop ids are the atlas's (model/loops/*.yaml); the build refuses an unknown id.
#
# Shared with the economy and timescale simulation (Docs/LoopAtlas/sim/personas.yaml, branch
# claude/loop-timescale-sim): the ids mira, jonah and night-crew are the same people there. That file is the
# statistical definition (segment, skill, schedule, affinities); this one is the authored path in two layers.
#
# Fields
#   persona: id, name, who, from (whose idea), challenge (where the example does not hold), device, group (people
#     who play as this persona), drivers (atlas driver ids, strongest first), timescale (what the economy sim reads:
#     sittings a week, minutes a sitting, the longest loop they will sit through, in seconds), win (share of rounds
#     won, for the crystal estimate), layers.
#   layers.now = the game today (bleeding-edge, the master unlock on: every lock open, no guide).
#   layers.prop = the same person with the Proposed layer's fixes (the proposal ids in `uses`).
#   A layer has `sittings` (one-off `day: N`, or `every: [mon, ...]` with `from` and `to`), `events` (dated lines
#   shown on the timeline) and `fate` (`day` and `why` when they leave; no day means still playing at the horizon).
#   A sitting has `at` (HH:MM), `with` (another persona sitting together) and `steps`.
#   A step: l = loop id, m = minutes, in = the place it is played in when the loop sits elsewhere in the tree
#     (the Ratel's board played inside a Honeycomb round), via = the handoff that brought them (vocabulary.yaml),
#     n = what happens, hole = where the path breaks, risk = chance they leave at that step (0 to 1),
#     ev = the analytics event that would see it, won = rounds the persona's typical member wins in the step
#     (crystals = won x 200; the build adds an event each time the total covers another 4000-crystal vessel).
horizon: 49
start: mon
personas:

- id: mira
  name: Mira, the puzzle parent
  from: Garrett's example
  who: 44, works full time, plays on an older phone in portrait at the end of the day. Plays the Ratel as a casual
    puzzle game; gets pulled into her son Jonah's squad on weekends.
  challenge: 'The example runs the wrong way round in today''s build. The Ratel is not a game she can find: it is the
    second seat of the Honeyguide, reached through the Toybox''s Vessel Changer and a two-finger swipe. So she cannot
    start as a solo puzzle player and later be roped in. She is roped in first, by Jonah, and only discovers the
    Ratel because it is the one seat that needs no flying. And his squad cannot take her along: the Honeyguide has no
    arena card, so the day he moves to the arena she is handed a hull to fly.'
  device: phone, older, portrait, one thumb
  group: 1
  drivers: [crew, mastery, make]
  timescale: {sittings_week: [3, 5], sitting_min: [6, 15], longest_loop_s: 900, best_tiers: [1, 2, 3]}
  win: 0.3
  layers:
    now:
      fate: {day: 13, why: 'She can only reach the Ratel when Jonah sets it up, and on day 13 he takes the squad to
        the arena, where the Honeyguide has no card. She flies a Squirrel, finishes last, and stops.'}
      sittings:
      - day: 2
        at: '20:30'
        with: jonah
        steps:
        - {l: arc.social, m: 2, via: pull, n: Jonah installs it on her phone and asks her into his party.}
        - {l: sitting, m: 1, n: 'Home: four places, every card unlocked, nothing pointing anywhere.', ev: ftue_phase_completed}
        - {l: toybox, m: 2, n: He flies her out to the Vessel Changer.}
        - {l: toy.changers, m: 2, n: 'Honeyguide and Ratel, then a two-finger swipe to the Ratel''s seat.'}
        - {l: seat.ratel, in: toybox, m: 14, n: 'She plays the Dynamo while the AI flies the hull. She likes it. No goal,
            no score and no end, so she stops when the tea is cold.', hole: The Toybox gives the Ratel no objective and
            banks nothing., risk: 0.2}
      - day: 4
        at: '21:40'
        steps:
        - {l: sitting, m: 2, n: 'Alone. Home has no Ratel on it.', hole: There is no way in to the Ratel on its own.,
           risk: 0.4}
        - {l: toybox, m: 4, n: 'Flies about looking for the Changer, does not find it, closes the game.', via: tired}
      - day: 6
        at: '15:00'
        with: jonah
        steps:
        - {l: arc.social, m: 1, via: pull}
        - {l: seat.ratel, in: round.ms, m: 16, won: 1, n: 'Jonah flies the Honeyguide in Honeycomb, she plays the Ratel.
            Four rounds. Her patterns load his darts: my partner made that shot possible.'}
        - {l: sitting, m: 1, n: 'Results, then Home. Nothing offers her the next step.', hole: No breath between rounds.}
      - day: 9
        at: '21:30'
        steps:
        - {l: sitting, m: 3, n: 'Alone again; gives up after three minutes.', risk: 0.5}
      - day: 13
        at: '15:00'
        with: jonah
        steps:
        - {l: arc.social, m: 1, via: pull}
        - {l: arena, m: 2, n: Jonah wants Brood Rush with his squad.}
        - {l: round.broodrush, m: 6, n: 'The Honeyguide is in no arena roster. She is given a Squirrel to fly and comes
            last.', hole: The Honeyguide has no arena card., risk: 0.9}
      events:
      - {day: 2, at: '20:50', kind: find, n: 'Finds the Ratel, through Jonah.'}
      - {day: 13, at: '15:10', kind: loss, n: Leaves. Jonah loses his weekend partner too.}
    prop:
      uses: [seat.crew, seat.ratel, breath, era.tide, arc.flower]
      fate: {why: 'Still playing at week 7: four short Ratel sittings a week on her own, and Saturdays in Jonah''s squad.
        Her Saturdays keep Jonah coming back as well.'}
      sittings:
      - day: 2
        at: '20:30'
        with: jonah
        steps:
        - {l: arc.social, m: 1, via: pull, n: 'The invite is the empty seat: "play the Ratel on my Honeyguide". The link
            opens the game straight into the seat.'}
        - {l: seat.crew, m: 1, n: 'She is seated; the Mentor shows the board, one move at a time.', ev: ftue_step_completed}
        - {l: seat.ratel, in: round.ms, m: 14, won: 1, n: 'Three Honeycomb rounds with Jonah flying.'}
        - {l: breath, m: 1, n: 'The breath offers: "Play the Ratel on your own".', via: new}
      - day: 3
        at: '21:45'
        steps:
        - {l: sitting, m: 1}
        - {l: seat.ratel, in: ladder, m: 9, won: 2, n: 'The Ratel''s own card, the AI flying the hull. Rungs I1 and I2.'}
        - {l: breath, m: 1, n: 'Rung I3 is offered for tomorrow.'}
      - every: [mon, wed, thu]
        from: 5
        to: 49
        at: '21:45'
        steps:
        - {l: sitting, m: 1}
        - {l: seat.ratel, in: ladder, m: 8, won: 1}
        - {l: breath, m: 1}
      - every: [tue, fri]
        from: 8
        to: 49
        at: '22:00'
        steps:
        - {l: era.tide, m: 6, won: 1, n: 'The day''s job: a five-minute hive puzzle that expires tonight.'}
      - every: [sat]
        from: 6
        to: 49
        at: '15:00'
        with: jonah
        steps:
        - {l: arc.social, m: 1, via: pull}
        - {l: seat.ratel, in: round.ms, m: 12, won: 1}
        - {l: seat.ratel, in: round.broodrush, m: 14, won: 1, n: 'The Honeyguide seats in Jonah''s Brood Rush squad, so
            she plays the Ratel in the arena too.'}
        - {l: breath, m: 1}
      events:
      - {day: 2, at: '20:31', kind: find, n: Straight into the Ratel's seat from Jonah's invite.}
      - {day: 17, at: '21:55', kind: own, n: 'The Honeyguide''s Mass petal lights from the Ratel seat.'}
      - {day: 27, at: '15:20', kind: crew, n: 'First arena win as the Ratel.'}

