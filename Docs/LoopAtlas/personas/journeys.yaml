- id: commuter
  name: The five-minute commuter
  from: Claude, to challenge the Session tier
  who: 34, rides a train twice a day on an older Android phone, sound off, one hand. Six or seven minutes a sitting.
  challenge: 'The atlas''s Session tier starts at 10 minutes and a voyage takes 20 to 40. His sittings are 6. Most
    of the game is out of reach of his day: he can fit three Time rounds and nothing that banks. He is the player the
    economy simulation''s short-session cultures will look like.'
  device: phone, older, one hand
  group: 1
  drivers: [mastery, joy, reward]
