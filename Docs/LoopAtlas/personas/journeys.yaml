    night one of them is on the other team or out. Only the winner of a match is paid (200 crystals, 4000 a vessel),
    so in a group that wins and loses to each other the quietest friend owns nothing new after two weeks. A Saturday
    voyage binge builds only the host''s Ark and hoard. And they never meet activation at all: they come in by invite
    and go straight to the arena, which is fine today and would be a wall if the gate flipped as planned.'
