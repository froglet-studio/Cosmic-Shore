<title>Fleet Codex</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: design B of the board's Rev 48 (picked by Shombith, 2026-11-02), in the website's Silver Screen look.
   A top bar, a filmstrip of the whole fleet (crew vessels as wider posters with their seats), then the picked vessel as
   a bento of tiles: the hull, its five abilities (four elements and the omni crystal), ONE control map drawing the
   controller, keyboard and phone together with the picked ability lit on all three, the games it plays in, the picked
   ability's full text, its docs and changes. #fleet is the whole fleet as one table. Data: fleet.json, generated from
   the shipped assets by Tools/Build/fleet_codex.py; every icon is the game's own art. */
:root{
  --bg:#050505; --surface:#0C0C0C; --raise:#141414; --ink:#ECECEC; --muted:#A6A6A6; --faint:#6E6E6E; --line:#222;
  --edge:#3A3A3A; --tile:#111; --accent:#00D4FF; --warn:#E2A552; --good:#7FD69B; color-scheme:dark;
  --display:"Bebas Neue","Arial Narrow",Impact,sans-serif; --mono:"Space Mono",ui-monospace,Menlo,monospace;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EDEDEB; --surface:#F7F7F5; --raise:#FFFFFF; --ink:#111; --muted:#555; --faint:#8A8A8A; --line:#D2D2CF;
  --edge:#A9A9A6; --tile:#111; --accent:#0B7C8C; --warn:#9A5B0E; --good:#2C7A4B; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EDEDEB; --surface:#F7F7F5; --raise:#FFFFFF; --ink:#111; --muted:#555; --faint:#8A8A8A; --line:#D2D2CF;
  --edge:#A9A9A6; --tile:#111; --accent:#0B7C8C; --warn:#9A5B0E; --good:#2C7A4B; color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hd{font-family:var(--display);font-weight:400;letter-spacing:.04em;text-transform:uppercase;line-height:.95}
.mo{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.wrap{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{width:22px;height:22px}
.logo span{font-size:26px}
.top nav a{text-decoration:none;color:var(--muted);font-weight:500}
.top nav a[aria-current="page"]{color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;height:36px;flex:0 1 320px;min-width:180px;padding:0 14px;border:1px solid var(--edge);border-radius:18px;background:var(--surface);margin-left:auto}
.search input{all:unset;font-size:13px;color:var(--ink);width:100%}
/* filmstrip */
.strip{display:flex;gap:12px;overflow-x:auto;padding-block:16px 12px;scrollbar-width:thin}
.poster{display:flex;flex-direction:column;gap:6px;flex:none;width:128px;text-decoration:none;color:var(--muted);font-size:12.5px;line-height:16px}
.poster.crew{width:176px}
.poster .ph{position:relative;display:block;height:72px;border-radius:8px;overflow:hidden;background:var(--surface)}
.poster img{width:100%;height:100%;object-fit:cover;filter:grayscale(1);opacity:.55;display:block}
.poster.crew .ph{box-shadow:inset 0 0 0 1px var(--edge)}
.poster[aria-current="page"]{color:var(--ink)}
.poster[aria-current="page"] img{filter:none;opacity:1}
.poster[aria-current="page"] .ph{box-shadow:0 0 0 2px var(--ink)}
.poster:hover img{opacity:.85}
.seats{position:absolute;right:6px;top:6px;font-family:var(--mono);font-size:9.5px;color:#ECECEC;background:rgba(5,5,5,.8);border:1px solid #555;border-radius:8px;padding:0 6px}
.poster.all .ph{display:flex;align-items:center;justify-content:center;border:1px dashed var(--edge);background:transparent}
.poster.all .ph svg{opacity:.8}
/* bento */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;padding-block:6px 40px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0;position:relative;overflow:hidden}
.pad{padding:18px 20px}
.span5{grid-column:span 5}.span7{grid-column:span 7}.span9{grid-column:span 9}.span3{grid-column:span 3}.span12{grid-column:span 12}
.hero{min-height:400px;display:flex;align-items:flex-end}
.hero .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1);opacity:.7}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--surface) 16%,transparent 72%)}
.hero .copy{position:relative;z-index:1;padding:22px 24px;display:flex;flex-direction:column;gap:8px;width:100%}
.hero h1{font-size:clamp(52px,6vw,88px);margin:0}
.hero .crewline{font-family:var(--display);font-size:24px;letter-spacing:.06em;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:6px}
.stats .n{font-family:var(--display);font-size:28px}
.kit{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.ab{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer;min-width:0;min-height:400px}
.ab:hover{border-color:var(--edge)}
.ab[aria-pressed="true"]{background:var(--raise);border-color:var(--ink)}
.ab .el{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.chip{width:22px;height:22px;border-radius:5px;background:var(--tile);display:inline-flex;align-items:center;justify-content:center;flex:none}
.chip img{width:15px;height:15px;object-fit:contain}
.icontile{width:96px;height:96px;border-radius:14px;background:var(--tile);display:flex;align-items:center;justify-content:center;margin:14px 0 10px}
.icontile img{width:80px;height:80px;object-fit:contain}
.icontile.none img{width:44px;height:44px;opacity:.6}
.ab .name{font-family:var(--display);font-size:30px;line-height:1}
.ab>span{max-width:100%}
.ab .sum{width:100%;font-size:12.5px;line-height:18px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;overflow-wrap:anywhere}
.ab .mo{overflow-wrap:anywhere}
.ab .name{overflow-wrap:anywhere}
.ab .grow{flex:1}
.pill{font-family:var(--mono);font-size:10px;border:1px solid var(--edge);border-radius:10px;padding:1px 8px;color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:currentColor}.pill.warn{color:var(--warn);border-color:currentColor}
/* controls */
.ctl-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ctl-head .hd{font-size:26px}
.devices{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.9fr) minmax(0,1fr);gap:22px}
.dev h3{margin:0 0 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;font-weight:400;color:var(--muted)}
.pad-map{position:relative;aspect-ratio:16/10;max-width:100%}
.pad-body{position:absolute;left:12%;right:12%;top:24%;bottom:6%;border:2px solid var(--edge);border-radius:40% 40% 46% 46%}
.slot{position:absolute;display:flex;align-items:center;gap:6px;transition:opacity .15s;font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.slot img{width:28px;height:28px;object-fit:contain}
.slot.stick img{width:38px;height:38px}
.slot .lbl{font-family:var(--mono);font-size:10px;color:var(--muted)}
.padwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:14px;align-items:start}
.legend{display:flex;flex-direction:column;gap:6px}
.legend .row{display:flex;align-items:center;gap:8px;transition:opacity .15s;font-size:12.5px;line-height:15px}
.legend .row img{width:24px;height:24px;object-fit:contain;flex:none}
.legend .row .g{display:flex;gap:2px;flex:none;min-width:24px}
.legend .row .cap{height:22px;font-size:9.5px;min-width:22px;padding:0 4px}
.lit{opacity:1}.dim{opacity:.32}.off{opacity:.12}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.key{display:flex;flex-direction:column;gap:5px;transition:opacity .15s}
.cap{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;min-width:34px;height:30px;padding:0 8px;border:1px solid var(--edge);border-bottom-width:3px;border-radius:6px;font-family:var(--mono);font-size:11px;background:var(--raise);white-space:nowrap}
.key .lbl{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.phone{position:relative;border:2px solid var(--edge);border-radius:26px;background:var(--bg);aspect-ratio:16/9;display:flex;align-items:center;gap:12px;padding:14px}
.phone .steer{width:30%;aspect-ratio:1;border-radius:50%;border:1px dashed var(--edge);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted);flex:none;padding:6px}
.phone .btns{flex:1;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-content:center}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;transition:opacity .15s;width:64px}
.tb .face{width:46px;height:46px;border-radius:12px;background:var(--tile);border:1px solid #444;display:flex;align-items:center;justify-content:center}
.tb.round .face{border-radius:50%}
.tb img{width:34px;height:34px;object-fit:contain}
.tb .lbl{font-family:var(--mono);font-size:9.5px;color:var(--muted);text-align:center;line-height:12px}
.notes{margin:10px 0 0;padding-left:16px;color:var(--muted);font-size:12px;line-height:17px}
/* plays in, detail, docs */
.play{display:flex;flex-direction:column;gap:10px}
.game{position:relative;border-radius:10px;overflow:hidden;min-height:150px;display:flex;align-items:flex-end;background:var(--raise)}
.game img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1);opacity:.5}
.game::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--surface) 12%,transparent 80%)}
.game .copy{position:relative;z-index:1;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.game .copy .hd{font-size:28px}
.game .copy p{margin:0;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.detail h2{margin:0;font-size:34px}
.detail p{margin:8px 0 0;max-width:110ch;color:var(--ink)}
.dials{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:14px}
.dial{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--raise)}
.dial .top2{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px}
.dial .v{white-space:nowrap}
.dial .src{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.dial.off{opacity:.5}
.l5{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.l5 .t{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.l5 .gate{font-family:var(--mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
ul.list{list-style:none;margin:8px 0 0;padding:0}
ul.list li{padding:8px 0;border-top:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}
ul.list .dt{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}
/* fleet table */
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tally .tile{padding:16px 18px}
.tally .n{font-family:var(--display);font-size:44px}
.scroll{overflow-x:auto}
table.mx{border-collapse:collapse;width:100%;min-width:1100px}
.mx th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:400;white-space:nowrap}
.mx th .chip{margin-right:6px;vertical-align:middle}
.mx td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.mx tbody tr{cursor:pointer}
.mx tbody tr:hover td{background:var(--raise)}
.cell{display:flex;align-items:center;gap:8px;min-width:0}
.cell .ic{width:34px;height:34px;border-radius:8px;background:var(--tile);display:flex;align-items:center;justify-content:center;flex:none}
.cell .ic img{width:28px;height:28px;object-fit:contain}
.cell .nm{font-weight:600;font-size:13px;line-height:16px}
.cell .gl{height:18px;width:auto;vertical-align:middle;margin-right:4px}
.hull{display:flex;gap:10px;align-items:center}
.hull img{width:64px;height:36px;object-fit:cover;border-radius:6px;filter:grayscale(1)}
.hull .nm{font-family:var(--display);font-size:22px;letter-spacing:.04em}
footer{padding-block:6px 40px;color:var(--muted);font-size:12.5px;max-width:110ch}
footer code{font-family:var(--mono);font-size:11.5px}
.empty{color:var(--muted);font-style:italic}
@media (max-width:1280px){
  .span5,.span7,.span9,.span3{grid-column:span 12}
  .kit{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  .ab{min-height:0}
  .devices{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
}
@media (prefers-reduced-motion:reduce){.slot,.key,.tb{transition:none}}
</style>

<header class="top wrap">
  <a class="logo" href="#fleet"><img id="logo" alt=""><span class="hd">Fleet Codex</span></a>
  <nav aria-label="Sections"><a href="#fleet" id="navFleet">Fleet</a></nav>
  <label class="search"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" aria-label="Search the fleet" placeholder="Search vessels, abilities, games"></label>
  <span class="mo" id="stamp">Loading&hellip;</span>
</header>
<div class="wrap"><nav class="strip" id="strip" aria-label="The fleet"></nav></div>
<main class="wrap" id="app"><p class="empty">Reading the fleet&hellip;</p></main>
<footer class="wrap" id="foot"></footer>

<script>
(function(){
  var D = null, query = "", pick = 0;
  var EL_WORD = {Charge:"threat", Mass:"size", Space:"reach", Time:"rate"};
  var L5 = {wired:["good","L5 wired"], open:["","L5 open"], off:["warn","L5 switched off"], "label-only":["warn","L5 named, not gated"], "gate-only":["warn","L5 gated, not named"]};
  var app = document.getElementById("app"), strip = document.getElementById("strip"), q = document.getElementById("q");

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function num(v){ return v == null ? "&ndash;" : String(Math.round(v * 100) / 100); }
  function gh(p){ return D.github + p.split("/").map(encodeURIComponent).join("/"); }
  function commit(sha){ return D.github.replace(/blob\/[^\/]+\/$/, "commit/") + sha; }
  function file(p){ return (p || "").split("/").pop(); }
  function img(src, alt, cls){ return src ? '<img src="' + esc(src) + '" alt="' + esc(alt || "") + '"' + (cls ? ' class="' + cls + '"' : '') + ' loading="lazy">' : ''; }
  function pill(st){ var s = L5[st] || L5.open; return '<span class="pill ' + s[0] + '">' + s[1] + '</span>'; }
  function crewName(v){ return v.crew && v.crew.names && v.crew.names.length ? v.crew.names.join(" and ") : v.name; }
  function isCrew(v){ return v.crew && v.crew.seats > 1; }
  function current(){ var k = decodeURIComponent(location.hash.slice(1)); return D.vessels.filter(function(v){ return v.key === k; })[0] || null; }
  function kitOf(v){
    var out = D.elements.map(function(n){ var e = v.elements[n]; return e ? {kind:"element", el:n, e:e} : null; }).filter(Boolean);
    if(v.omni) out.push({kind:"omni", el:"Omni", e:v.omni});
    return out;
  }
  function matches(v){
    if(!query) return true;
    var hay = [v.name, crewName(v), v.key, v.description].concat(
      Object.keys(v.elements).map(function(n){ var e = v.elements[n]; return e.ability + " " + e.upgrade.label; }),
      v.cards.map(function(c){ return c.name; }), v.omni ? [v.omni.label].concat(v.omni.effects) : []).join(" ").toLowerCase();
    return query.split(/\s+/).every(function(w){ return hay.indexOf(w) >= 0; });
  }

  function drawStrip(){
    var cur = current();
    var vs = D.vessels.filter(function(v){ return v.status.hasMap && matches(v); });
    vs.sort(function(a, b){ return (isCrew(a) - isCrew(b)) || a.id - b.id; });
    strip.innerHTML = '<a class="poster all" href="#fleet"' + (cur ? '' : ' aria-current="page"') + '><span class="ph"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="7" height="7"/><rect x="14" y="4" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></span>The whole fleet</a>' +
      vs.map(function(v){
        return '<a class="poster' + (isCrew(v) ? ' crew' : '') + '" href="#' + esc(v.key) + '"' + (cur && cur.key === v.key ? ' aria-current="page"' : '') + '><span class="ph">' + img(v.image, "") +
          (isCrew(v) ? '<span class="seats">' + v.crew.seats + ' SEATS</span>' : '') + '</span>' + esc(crewName(v)) + '</a>';
      }).join("") + (vs.length ? '' : '<span class="empty">No vessel matches.</span>');
    var sel = strip.querySelector('[aria-current="page"]');
    if(sel && sel.scrollIntoView) try { sel.scrollIntoView({block:"nearest", inline:"center"}); } catch(e){}
  }

  /* ---------- the vessel ---------- */
  function abilityTile(k, i, v){
    var e = k.e, isOmni = k.kind === "omni";
    var name = isOmni ? (e.label ? e.label.charAt(0).toUpperCase() + e.label.slice(1) : (e.effects[0] || "Omni crystal")) : (e.open ? "Open slot" : e.ability);
    var icon = isOmni ? (e.icon || e.mark) : (e.icon || e.shape);
    var noArt = isOmni ? !e.icon : !e.icon;
    var live = isOmni ? [] : e.scaling.filter(function(s){ return s.on; });
    var scales = live.length ? live[0].field + " &times;" + num(live[0].min) + " &ndash; &times;" + num(live[0].max) + (live.length > 1 ? " +" + (live.length - 1) : "") : (isOmni ? "fly into an omni crystal" : "scales no number");
    var sum = isOmni ? (e.label ? "What this hull does with an omni crystal." : (e.effects.length ? "Its crystal effects: " + e.effects.join(", ") + "." : "No omni crystal effect of its own.")) : e.description;
    return '<button class="ab" type="button" data-i="' + i + '" aria-pressed="' + (pick === i) + '">' +
      '<span class="el"><span class="chip">' + img(isOmni ? e.mark : e.shape, "") + '</span>' + (isOmni ? "OMNI CRYSTAL" : k.el.toUpperCase()) + '</span>' +
      '<span class="icontile' + (noArt ? ' none' : '') + '">' + img(icon, name) + '</span>' +
      '<span class="name">' + esc(name) + '</span><span class="sum">' + esc(sum) + '</span><span class="grow"></span>' +
      '<span class="mo">' + scales + '</span>' +
      (isOmni ? '<span class="pill">no level 5</span>' : pill(e.upgrade.status)) + '</button>';
  }

  var SLOTS = {   /* the controller map: where each pad control sits, in % of the map */
    "LT":{l:4,t:2}, "RT":{r:4,t:2,flip:1}, "RB":{r:22,t:14,flip:1}, "Left stick":{l:22,t:44,stick:1}, "Right stick":{l:52,t:66,stick:1},
    "Y":{l:72,t:24}, "X":{l:61,t:41}, "B":{l:83,t:41}, "A":{l:72,t:58}
  };
  function padGlyph(pad){
    if(pad === "LT+RT") return img(PADMAP["LT"], "LT") + img(PADMAP["RT"], "RT");
    return PADMAP[pad] ? img(PADMAP[pad], pad) : '<span class="cap">' + esc(pad) + '</span>';
  }
  function padSlots(rows, litRow){
    var bySlot = {};
    rows.forEach(function(r){
      var slots = r.pad === "LT+RT" ? ["LT","RT"] : r.pad === "Both sticks" ? ["Left stick","Right stick"] : [r.pad];
      slots.forEach(function(s){ if(SLOTS[s]) (bySlot[s] = bySlot[s] || []).push(r); });
    });
    return Object.keys(SLOTS).map(function(s){
      var p = SLOTS[s], rs = bySlot[s] || [], art = rs.length ? rs[0].padArt : null;
      var state = !rs.length ? "off" : rs.some(function(r){ return r === litRow || r.action === "Steer"; }) ? "lit" : "dim";
      var pos = (p.l != null ? "left:" + p.l + "%;" : "right:" + p.r + "%;") + "top:" + p.t + "%";
      var glyph = PADMAP[s] ? img(PADMAP[s], s) : '';
      return '<span class="slot ' + state + (p.stick ? " stick" : "") + '" style="' + pos + '" title="' + esc(rs.map(function(r){ return r.action; }).join(", ") || s) + '">' + glyph + '</span>';
    }).join("");
  }
  function controlsTile(v, sel){
    var c = v.controls;
    if(!c) return '<p class="empty">No controls: this vessel has no ability map.</p>';
    var rows = c.rows, litRow = sel && sel.kind === "element" ? rows.filter(function(r){ return r.element === sel.el; })[0] : null;
    function state(r){ return r === litRow || r.action === "Steer" ? "lit" : "dim"; }
    var keyRows = rows.filter(function(r){ return r.pc && r.pc !== "no button" && r.pc !== "passive"; });
    var phoneRows = rows.filter(function(r){ return r.action !== "Steer" && r.touch && r.touch !== "no button" && r.touch !== "passive"; });
    var steer = rows.filter(function(r){ return r.action === "Steer"; })[0];
    var head = sel ? (sel.kind === "omni" ? "the omni crystal is flown into, not pressed" : esc(litRow ? litRow.action : sel.e.ability) + (litRow ? " lit on the controller, the keyboard and the phone" : " has no button: it is passive or a gesture")) : "";
    return '<div class="ctl-head"><span class="hd">Controls</span><span class="mo">' + head + '</span></div><div class="devices">' +
      '<section class="dev" aria-label="Controller"><h3>CONTROLLER</h3><div class="padwrap"><div class="pad-map"><div class="pad-body"></div>' + padSlots(rows, litRow) + '</div>' +
        '<div class="legend">' + rows.filter(function(r){ return r.pad && r.pad !== "no button"; }).map(function(r){
          return '<span class="row ' + state(r) + '"><span class="g">' + padGlyph(r.pad) + '</span><span>' + esc(r.action) + '</span></span>'; }).join("") + '</div></div></section>' +
      '<section class="dev" aria-label="Keyboard"><h3>KEYBOARD</h3><div class="keys">' + keyRows.map(function(r){
        return '<span class="key ' + state(r) + '"><span class="cap">' + esc(r.pc) + '</span><span class="lbl">' + esc(r.action) + '</span></span>'; }).join("") + '</div></section>' +
      '<section class="dev" aria-label="Phone"><h3>PHONE' + (c.touchScheme === "TotemButtons" ? " &middot; BUTTONS ROUND THE RIGHT THUMB" : c.touchScheme ? " &middot; ABILITIES ON THUMB LIFTS" : "") + '</h3>' +
        '<div class="phone"><span class="steer">' + esc(steer ? "Steer: " + steer.touch : "Steer") + '</span><span class="btns">' + phoneRows.map(function(r){
          var round = /button/i.test(r.touch) && !/card/i.test(r.touch);
          return '<span class="tb ' + state(r) + (round ? ' round' : '') + '"><span class="face">' + (r.touchArt ? img(r.touchArt, r.touch) : '<span class="mo">' + esc(r.touch) + '</span>') + '</span><span class="lbl">' + esc(r.action) + '</span></span>';
        }).join("") + '</span></div>' +
        (c.notes.length ? '<ul class="notes">' + c.notes.map(function(n){ return '<li>' + esc(n) + '</li>'; }).join("") + '</ul>' : '') +
      '</section></div>';
  }
  function detailTile(v, sel){
    if(!sel) return '';
    var e = sel.e;
    if(sel.kind === "omni"){
      return '<span class="mo">OMNI CRYSTAL &middot; ' + esc(crewName(v)) + '</span><h2 class="hd">' + esc(e.label || e.effects[0] || "Omni crystal") + '</h2>' +
        '<p>' + esc(e.label ? "In the ability map's own words: " + e.label + "." : "The map names no omni ability (its omniAbilityLabel is empty), so this is read from the vessel's crystal effects.") + '</p>' +
        (e.effects.length ? '<div class="dials">' + e.effects.map(function(x){ return '<div class="dial"><div class="top2"><span>' + esc(x) + '</span></div><div class="src">crystal effect on the vessel&rsquo;s container</div></div>'; }).join("") + '</div>' : '');
    }
    var u = e.upgrade;
    return '<span class="mo">' + sel.el.toUpperCase() + ' &middot; ' + EL_WORD[sel.el].toUpperCase() + '</span><h2 class="hd">' + esc(e.open ? "Open design slot" : e.ability) + '</h2>' +
      (e.description ? '<p>' + esc(e.description) + '</p>' : '') +
      '<div class="dials">' + (e.scaling.length ? e.scaling.map(function(s){
        return '<div class="dial' + (s.on ? '' : ' off') + '"><div class="top2"><span>' + esc(s.field) + '</span><span class="v">&times;' + num(s.min) + ' &rarr; &times;' + num(s.max) + '</span></div><div class="src">' + (s.on ? '' : 'switched off (' + esc(s.offBecause || 'disabled') + ') &middot; ') + esc(file(s.asset || s.script) || s.where) + '</div></div>'; }).join("")
        : '<span class="mo">This element changes no number.</span>') + '</div>' +
      '<div class="l5"><div class="t"><span class="hd" style="font-size:22px">Level 5</span>' + pill(u.status) + (u.label ? '<strong>' + esc(u.label) + '</strong>' : '') + '</div>' +
        (u.description ? '<p>' + esc(u.description) + '</p>' : u.status === "open" ? '<p class="mo">Not designed yet. Unlocks at level ' + u.unlockLevel + ', relocks below ' + u.relockBelow + '.</p>' : '') +
        u.gates.map(function(g){ return '<div class="gate">gated at ' + (g.script ? '<a href="' + gh(g.script) + '">' + esc(g.site) + '</a>' : esc(g.site)) + (g.offBecause ? ' &middot; switched off: ' + esc(g.offBecause) : '') + '</div>'; }).join("") +
      '</div>';
  }
  function playsTile(v){
    if(!v.cards.length) return '<span class="mo">PLAYS IN</span><p class="empty">No game card seats this vessel yet.</p>';
    return '<span class="mo">PLAYS IN &middot; ' + v.cards.length + ' GAME' + (v.cards.length > 1 ? 'S' : '') + '</span>' + v.cards.map(function(c, i){
      return '<div class="game"' + (i ? ' style="min-height:96px"' : '') + '>' + img(c.art, "") + '<div class="copy"><span class="mo">' + esc((c.rosters || []).map(function(r){ return r.replace("Games", ""); }).join(" ") || "on no roster") +
        (c.intensity ? ' &middot; I' + c.intensity[0] + '&ndash;I' + c.intensity[1] : '') + (c.hullsOnCard > 1 ? ' &middot; ' + c.hullsOnCard + ' hulls' : ' &middot; this hull only') + '</span><span class="hd">' + esc(c.name) + '</span>' +
        (i === 0 && c.description ? '<p>' + esc(c.description) + '</p>' : '') + '</div></div>';
    }).join("");
  }
  function docsTile(v){
    return '<span class="mo">DOCS</span>' + (v.docs.length ? '<ul class="list">' + v.docs.slice(0, 6).map(function(d){ return '<li><a href="' + esc(d.url) + '">' + esc(file(d.path)) + '</a></li>'; }).join("") + '</ul>' : '<p class="empty">No doc found by name.</p>') +
      '<span class="mo" style="display:block;margin-top:14px">RECENT CHANGES</span>' + (v.changes.length ? '<ul class="list">' + v.changes.slice(0, 5).map(function(c){ return '<li><span class="dt">' + esc(c.date) + '</span><a href="' + commit(c.sha) + '">' + esc(c.subject) + '</a></li>'; }).join("") + '</ul>' : '<p class="empty">None in the history read.</p>');
  }
  function vesselView(v){
    var kit = kitOf(v);
    if(pick >= kit.length) pick = 0;
    var sel = kit[pick], f = v.flight, s = v.status;
    var wired = s.upgradesWired;
    app.innerHTML = '<div class="bento">' +
      '<section class="tile hero span5" aria-label="' + esc(crewName(v)) + '">' + img(v.image, "", "still") +
        '<div class="copy"><span class="mo" style="letter-spacing:.12em">VESSEL ' + v.id + (isCrew(v) ? ' &middot; CREW VESSEL &middot; ' + v.crew.seats + ' SEATS' : v.controls ? (v.controls.oneStick ? ' &middot; ONE-STICK FLYER' : ' &middot; TWO-STICK FLYER') : '') + (s.inToybox ? ' &middot; IN THE VESSEL CHANGER' : '') + '</span>' +
        '<h1 class="hd">' + esc(isCrew(v) && v.crew.names.length ? v.crew.names.join(" & ") : v.name) + '</h1>' +
        (isCrew(v) && !v.crew.names.length ? '<span class="crewline">' + v.crew.seats + ' seats on one hull</span>' : '') +
        (v.description ? '<span style="color:var(--muted);max-width:70ch">' + esc(v.description) + '</span>' : '') +
        (f ? '<div class="stats"><span><span class="n num">' + num(f.cruise) + '</span> <span class="mo">u/s cruise</span></span><span><span class="n num">' + num(f.pitch) + '/' + num(f.yaw) + '</span> <span class="mo">pitch / yaw</span></span><span><span class="n num">' + wired + '/4</span> <span class="mo">level 5 wired</span></span><span><span class="n num">' + v.cards.length + '</span> <span class="mo">games</span></span></div>' : '') +
        '</div></section>' +
      '<div class="kit span7" role="group" aria-label="The kit">' + (kit.length ? kit.map(function(k, i){ return abilityTile(k, i, v); }).join("") : '<p class="empty">No ability map for this vessel.</p>') + '</div>' +
      '<section class="tile pad span9" aria-label="Controls">' + controlsTile(v, sel) + '</section>' +
      '<section class="tile pad span3 play" aria-label="Games">' + playsTile(v) + '</section>' +
      '<section class="tile pad span9 detail" aria-label="Ability detail">' + detailTile(v, sel) + '</section>' +
      '<section class="tile pad span3" aria-label="Docs and changes">' + docsTile(v) + '</section>' +
      '</div>';
    Array.prototype.forEach.call(app.querySelectorAll(".ab"), function(b){ b.addEventListener("click", function(){ pick = +b.dataset.i; vesselView(v); }); });
  }

  /* ---------- the fleet ---------- */
  function fleetView(){
    var vs = D.vessels.filter(function(v){ return v.status.hasMap && matches(v); });
    vs.sort(function(a, b){ return (isCrew(a) - isCrew(b)) || a.id - b.id; });
    var all = D.vessels.filter(function(v){ return v.status.hasMap; }), slots = all.length * 4;
    var wired = all.reduce(function(a, v){ return a + v.status.upgradesWired; }, 0);
    var games = {}; all.forEach(function(v){ v.cards.forEach(function(c){ games[c.name] = 1; }); });
    var crews = all.filter(isCrew).length;
    function cell(e, el){
      if(!e) return '<td class="mo">no map</td>';
      var pad = v_padArt(e);
      return '<td><span class="cell"><span class="ic">' + img(e.icon || e.shape, "") + '</span><span style="min-width:0"><span class="nm">' + esc(e.open ? "open slot" : e.ability) + '</span><br>' +
        (e.pad === "LT+RT" ? '<img class="gl" src="' + esc(PADMAP["LT"]) + '" alt="LT"><img class="gl" src="' + esc(PADMAP["RT"]) + '" alt="RT">' : pad ? '<img class="gl" src="' + esc(pad) + '" alt="' + esc(e.pad) + '">' : '') + (e.key ? '<span class="mo">' + esc(e.key) + '</span> ' : '') + pill(e.upgrade.status) + '</span></span></td>';
    }
    app.innerHTML = '<div class="bento">' +
      '<section class="tile pad span12"><span class="mo" style="letter-spacing:.12em">THE WHOLE FLEET</span><h1 class="hd" style="font-size:64px;margin:4px 0 14px">Every vessel, every ability</h1>' +
        '<div class="tally"><div class="tile"><div class="n">' + all.length + '</div><div class="mo">vessels, ' + crews + ' of them crews</div></div><div class="tile"><div class="n">' + wired + '<span class="mo"> / ' + slots + '</span></div><div class="mo">level-5 upgrades wired</div></div>' +
        '<div class="tile"><div class="n">' + Object.keys(games).length + '</div><div class="mo">game cards that seat them</div></div><div class="tile"><div class="n">' + all.filter(function(v){ return v.status.inToybox; }).length + '</div><div class="mo">in the Vessel Changer</div></div></div></section>' +
      '<section class="tile span12 scroll"><table class="mx"><thead><tr><th>Vessel</th>' + D.elements.map(function(el){ return '<th><span class="chip">' + img(D.ui["shape/" + el], "") + '</span>' + el.toUpperCase() + '</th>'; }).join("") +
        '<th><span class="chip">' + img(D.ui.omni, "") + '</span>OMNI CRYSTAL</th><th>GAMES</th></tr></thead><tbody>' +
        vs.map(function(v){
          var o = v.omni || {};
          return '<tr tabindex="0" data-k="' + esc(v.key) + '"><td><span class="hull">' + img(v.image, "") + '<span><span class="nm">' + esc(crewName(v)) + '</span><br><span class="mo">' + (isCrew(v) ? v.crew.seats + ' seats' : 'vessel ' + v.id) + '</span></span></span></td>' +
            D.elements.map(function(el){ return cell(v.elements[el], el); }).join("") +
            '<td><span class="cell"><span class="ic">' + img(o.icon || o.mark, "") + '</span><span class="nm">' + esc(o.label || (o.effects || [])[0] || "fly into it") + '</span></span></td>' +
            '<td class="mo">' + (v.cards.length ? v.cards.map(function(c){ return esc(c.name); }).join(", ") : "none") + '</td></tr>';
        }).join("") + '</tbody></table></section></div>';
    Array.prototype.forEach.call(app.querySelectorAll("tbody tr[data-k]"), function(tr){
      function go(){ location.hash = tr.dataset.k; }
      tr.addEventListener("click", go);
      tr.addEventListener("keydown", function(ev){ if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); go(); } });
    });
  }
  var PADMAP = {};
  function v_padArt(e){ return PADMAP[e.pad] || null; }

  function route(){
    if(!D) return;
    var v = current();
    drawStrip();
    document.getElementById("navFleet").setAttribute("aria-current", v ? "false" : "page");
    if(v){ vesselView(v); document.title = crewName(v) + " - Fleet Codex"; } else { fleetView(); document.title = "Fleet Codex"; }
  }

  q.addEventListener("input", function(){ query = q.value.trim().toLowerCase(); drawStrip(); if(!current()) fleetView(); });
  fetch("fleet.json", {cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(d){
    D = d;
    D.vessels.forEach(function(v){ if(v.controls) v.controls.rows.forEach(function(r){ if(r.padArt && !PADMAP[r.pad]) PADMAP[r.pad] = r.padArt; }); });
    document.getElementById("logo").src = d.ui.omni || "";
    document.getElementById("stamp").innerHTML = esc(d.branch) + ' &middot; <a href="' + commit(d.commit) + '">' + esc(d.commit) + '</a> &middot; ' + esc(d.commitDate);
    document.getElementById("foot").innerHTML = 'Nothing here is typed by hand. <code>Tools/Build/fleet_codex.py</code> reads the ability maps, the vessel prefabs and their HUDs, the class assets, the touch profiles, the game cards and git history, and a scheduled job republishes this page from bleeding-edge every day when anything changed. The icons are the game&rsquo;s own: each ability&rsquo;s HUD card, the Codex&rsquo;s element shapes, the controller glyphs and the phone&rsquo;s touch icons. Where a vessel&rsquo;s HUD draws an icon only at runtime, its element&rsquo;s shape stands in. The skill: <code>/fleet-codex</code>.';
    route();
  }).catch(function(err){ app.innerHTML = '<p class="empty">The fleet data did not load (' + esc(err.message) + '). Reload the page.</p>'; });
  window.addEventListener("hashchange", function(){ pick = 0; route(); window.scrollTo(0, 0); });
})();
</script>
