<title>Fleet Codex</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=Saira:wght@400;500;600&display=swap">
<script src="theme.js"></script>
<link rel="stylesheet" href="themes.css">
<style>
/* The Fleet Codex, design C of the board's Rev 68 drawn whole as Rev 69 (Shombith picked it 2026-11-08, "Go ahead build
   it"; Docs/MENU_REDESIGN_B.md sections 143-144). One vessel at a time, every detail, calm: a switcher in the top bar
   instead of a fleet grid; the flight-deck window (the hull flying, the pilot briefing, its element games, the picked
   ability's MOVE playing with the controller button, key and phone touch pressing in time, the ability row); then
   hairline sections: Abilities (what each does, what more of its element does with the authored numbers, its level 5),
   Missions (the games, filtered by element, Arcade, Arena), Flight and controls, Docs. #fleet is the whole fleet as one
   table. Data: fleet.json from Tools/Build/fleet_codex.py (the game's own files); every icon is the game's art.
   Themes: the game's colour sets Nocturne, Photic, Dart Frog (theme.js / themes.css, written by the generator with the
   analytics console's make_themes.py). Type: Saira Condensed and Saira, picked on the board for the website.
   Motion: only transform and opacity, on one eased curve; one 3.2 s clock for a move and its devices; reduced motion
   holds the pressed pose still. */
:root{
  --ease:cubic-bezier(.45,0,.2,1);
  --ink:var(--fs-text); --soft:var(--fs-text-soft); --off:var(--fs-text-off); --line:var(--fs-line);
  --hair:color-mix(in srgb,var(--fs-line) 60%,transparent); --panel:var(--fs-surface); --deep:var(--fs-ground-deep);
  --sel:var(--fs-selection); --cta:var(--fs-cta-fill); --warn:var(--fs-danger);
  --disp:"Saira Condensed","Arial Narrow",sans-serif; --body:"Saira",system-ui,sans-serif;
  --dom:#2cfffb; --dom-sh:#552345; --omni:#96eb29; --petal-grey:#82828a; --petal-white:#f5f5ff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fs-ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.disp{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.lab{font-size:12px;letter-spacing:.22em;color:var(--soft);text-transform:uppercase}
.wrap{max-width:1760px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.empty{color:var(--soft)}
/* the sea behind the page (the menu's SeaLines in the theme's rims) */
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 70% 55% at 50% 22%,color-mix(in srgb,var(--sea-glow) 12%,transparent),transparent 70%),
    linear-gradient(180deg,var(--sea-wash) 0%,color-mix(in srgb,var(--sea-wash) 40%,var(--fs-ground)) 50%,var(--fs-ground) 100%)}
.sea-lines{position:absolute;inset:0;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 14%,#000 86%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 14%,#000 86%,transparent 100%)}
.sea-layer{position:absolute;inset:0;background:linear-gradient(90deg,var(--sea-1),var(--sea-2) 50%,var(--sea-3));-webkit-mask-repeat:repeat-x;mask-repeat:repeat-x;animation:sea-slide 90s linear infinite}
@keyframes sea-slide{from{-webkit-mask-position:0 0;mask-position:0 0}to{-webkit-mask-position:-480px 0;mask-position:-480px 0}}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--fs-ground) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 1px 0 var(--hair)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:72px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;display:flex;align-items:center;gap:10px}
.brand img{width:24px;height:24px}
.navl{font-size:13px;color:var(--soft);text-decoration:none;letter-spacing:.08em;text-transform:uppercase}
.navl:hover,.navl[aria-current="page"]{color:var(--ink)}
.switch{display:flex;align-items:center;gap:6px;margin:0 auto;position:relative}
.step{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;font-size:13px;color:var(--soft);text-decoration:none;transition:color .2s var(--ease)}
.step:hover{color:var(--ink)}
.cur{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:0;cursor:pointer;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.cur img{width:46px;height:26px;object-fit:cover}
.cur .disp{font-size:22px}
.cur small{font-size:12px;color:var(--soft)}
.menu{position:absolute;top:52px;left:50%;transform:translateX(-50%);width:min(560px,92vw);max-height:70vh;overflow:auto;z-index:30;padding:10px;background:var(--fs-ground);box-shadow:inset 0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.5)}
.menu h4{margin:8px 6px;font-weight:500}
.menu .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.menu a{display:flex;align-items:center;gap:8px;padding:6px;text-decoration:none;font-size:14px;transition:background .2s var(--ease)}
.menu a:hover,.menu a[aria-current="page"]{background:var(--panel)}
.menu a img{width:52px;height:30px;object-fit:cover;flex:none}
.tools{display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:8px;height:40px;width:240px;padding:0 12px;color:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.search input{all:unset;font-size:13px;width:100%;color:var(--ink)}
.tbtn{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:0;cursor:pointer;background:transparent;box-shadow:inset 0 0 0 1px var(--line);font-size:13px}
.sw{display:inline-flex;gap:2px}.sw i{display:block;width:7px;height:14px}
.themes{position:relative}
.tmenu{position:absolute;right:0;top:48px;width:320px;padding:8px;z-index:30;background:var(--fs-ground);box-shadow:inset 0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.5)}
.titem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;cursor:pointer;background:none;padding:10px}
.titem:hover,.titem[aria-checked="true"]{background:var(--panel)}
.titem[aria-checked="true"]{box-shadow:inset 2px 0 0 var(--sel)}
.titem .sw i{width:10px;height:22px}
.titem b{display:block;font-family:var(--disp);font-size:20px;text-transform:uppercase}
.titem span.d{display:block;font-size:12px;color:var(--soft);line-height:1.4}
.dompick{display:flex;gap:4px}
.dompick button{width:30px;height:30px;border:0;cursor:pointer;background:transparent;display:flex;align-items:center;justify-content:center}
.dompick i{display:block;width:16px;height:16px;background:var(--c);transform:rotate(45deg);transition:box-shadow .2s var(--ease)}
.dompick button[aria-checked="true"] i{box-shadow:0 0 0 3px var(--fs-ground),0 0 0 5px var(--c)}

/* ---------- the window ---------- */
.win{position:relative;height:860px;margin-top:28px;overflow:hidden;background:radial-gradient(ellipse at 52% 46%,var(--face),var(--fs-ground) 74%);box-shadow:inset 0 0 0 1px var(--line)}
.hullbox{position:absolute;inset:0;pointer-events:none}
.hullbox img{position:absolute;left:27%;top:8%;width:52%;-webkit-mask-image:radial-gradient(ellipse 58% 62% at 50% 50%,#000 52%,transparent 100%);mask-image:radial-gradient(ellipse 58% 62% at 50% 50%,#000 52%,transparent 100%)}
.hud{position:absolute;padding:22px 24px;background:color-mix(in srgb,var(--fs-ground) 84%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.brief{left:40px;top:40px;width:520px}
.brief h1{font-size:96px;margin:6px 0 0}
.brief p{margin:12px 0 0;font-size:17px;line-height:1.55}
.stats{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.stats .disp{font-size:30px}
.stats small{display:block;font-size:11px;color:var(--soft)}
.egs{right:40px;top:40px;width:400px}
/* the flight certificate (Rev 84 A, picked 2026-11-10, section 155 of Docs/MENU_REDESIGN_B.md): five checks read from the
   game, ink for done, Gold only for Arena Ready and an S tier (the style guide's first place); solo vessels only */
.win.certified{height:1060px}
.cert{margin-top:18px}
.cline{display:flex;align-items:baseline;gap:14px;margin:6px 0 10px}
.cline .disp{font-size:52px;font-variant-numeric:tabular-nums}
.cline .gold,.fcert .gold{color:var(--fs-gold)}.cline .dim,.fcert .dim{color:var(--soft)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg i{display:block;height:7px;background:var(--line);opacity:.5}
.seg i.on{background:var(--ink);opacity:1}
.seg i.part{background:linear-gradient(90deg,var(--ink) var(--p),var(--line) var(--p));opacity:1}
.seg.thin i{height:4px}
.chks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:10px 0 0;padding:0;list-style:none}
.chks li{display:flex;flex-direction:column;gap:3px;padding:7px 8px;background:color-mix(in srgb,var(--deep) 70%,transparent);box-shadow:inset 0 0 0 1px var(--hair);font-size:12px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.chks li b{display:flex;align-items:center;gap:4px;font-weight:600;font-size:13px}
.chks li span{font-size:10px;letter-spacing:.12em;color:var(--soft);text-transform:uppercase}
.chks li.no{color:var(--off)}
.chks svg{width:13px;height:13px;flex:none}
.next{margin:10px 0 0;font-size:14px;color:var(--sel)}
.tier{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;font-family:var(--disp);font-weight:700;font-size:17px;flex:none}
.tier.tS{background:var(--fs-gold);color:var(--fs-ground)}
.tier.tA{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.tier.tB{box-shadow:inset 0 0 0 1px var(--line);color:var(--soft)}
.tier.tC{box-shadow:inset 0 0 0 1px var(--hair);color:var(--off)}
.tier.tu{box-shadow:inset 0 0 0 1px var(--hair);color:var(--off);font-size:14px}
.tier.tn{color:var(--off);font-size:14px}
.tier.hot{outline:2px solid var(--sel);outline-offset:1px}
.eg{display:grid;grid-template-columns:18px 76px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--hair);font-size:15px}
.eg .flower{width:16px;height:16px}
.eg span{font-size:11px;letter-spacing:.16em;color:var(--soft)}
.eg.none{color:var(--off)}
.cta{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 22px;margin-top:18px;background:var(--cta);color:var(--fs-ground);font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:.1em;text-decoration:none;text-transform:uppercase}
.move{left:40px;bottom:40px;width:660px}
.move .mhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.move .mhead .disp{font-size:34px}
.trig{color:var(--sel);font-size:14px}
.l5tog{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;height:32px;padding:0 12px;background:transparent;color:var(--soft);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--disp);font-size:15px;letter-spacing:.1em;text-transform:uppercase;transition:color .2s var(--ease),background .2s var(--ease)}
.l5tog:hover{color:var(--ink)}
.l5tog[aria-pressed="true"]{background:var(--cta);color:var(--fs-ground);box-shadow:none}
.mhead .mic{display:inline-flex;align-self:center;width:40px;height:40px}
.mhead .mic img,.mhead .mic .ico{width:40px;height:40px;object-fit:contain}
.abrow{position:absolute;right:40px;bottom:40px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 780px)}
.ab{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;border:0;cursor:pointer;background:transparent;padding:0;transition:transform .3s var(--ease)}
.ab .i{width:84px;height:84px;display:flex;align-items:center;justify-content:center;background:transparent;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .3s var(--ease)}
.ab .i img,.ab .i .ico{width:58px;height:58px;object-fit:contain}
.ab small{font-size:12px;color:var(--soft);text-align:center;line-height:1.2;min-height:2.4em}
.ab:hover{transform:translateY(-4px)}
.ab[aria-pressed="true"]{transform:translateY(-8px)}
.ab[aria-pressed="true"] .i{box-shadow:inset 0 0 0 2px var(--sel)}
.ab[aria-pressed="true"] small{color:var(--ink)}
/* an icon as the HUD tints it: domain parts (d) and shielded parts (s) are masks filled with the picked domain */
.ico{position:relative;display:block}
.ico>*{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ico .lay{-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}

/* ---------- the move: a scene of the ability happening, and the devices pressing on its clock ---------- */
.stage{position:relative;overflow:hidden;height:150px;margin-top:12px;background:color-mix(in srgb,var(--deep) 72%,transparent);box-shadow:inset 0 0 0 1px var(--line)}
.stage .lane{position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.shull{position:absolute;top:50%;left:0;width:46px;height:26px;margin-top:-13px;animation:fly 3.2s var(--ease) infinite;will-change:transform}
.shull svg{width:100%;height:100%;display:block}
@keyframes fly{0%{transform:translateX(-60px)}100%{transform:translateX(720px)}}
.shull.low{top:40%}
.crys{position:absolute;left:52%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid var(--ink);transform:rotate(45deg);animation:crys 3.2s var(--ease) infinite}
@keyframes crys{0%,40%{transform:translateX(0) rotate(45deg) scale(1);opacity:1}52%{transform:translateX(12px) rotate(45deg) scale(1.35);opacity:1}62%,100%{transform:translateX(14px) rotate(45deg) scale(0);opacity:0}}
.plus{position:absolute;left:54%;top:26%;font-weight:600;font-size:14px;color:var(--sel);opacity:0;animation:plus 3.2s var(--ease) infinite}
@keyframes plus{0%,52%{opacity:0;transform:translateY(8px)}62%{opacity:1;transform:translateY(0)}86%,100%{opacity:0;transform:translateY(-14px)}}
.ringwrap{position:absolute;left:58%;top:50%;width:0;height:0}
.blk{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;background:var(--fs-ruby);opacity:0;animation:blk 3.2s var(--ease) infinite}
@keyframes blk{0%,16%{transform:rotate(var(--a)) translateX(10px) scale(0);opacity:0}28%,70%{transform:rotate(var(--a)) translateX(34px) scale(1);opacity:1}84%,100%{transform:rotate(var(--a)) translateX(40px) scale(0);opacity:0}}
.streak{position:absolute;left:30%;top:50%;width:46%;height:2px;margin-top:-1px;background:linear-gradient(90deg,transparent,var(--sel));transform-origin:left;transform:scaleX(0);opacity:0;animation:streak 3.2s var(--ease) infinite}
@keyframes streak{0%,50%{transform:scaleX(0);opacity:0}60%{transform:scaleX(1);opacity:1}80%,100%{transform:scaleX(1);opacity:0}}
.prow{position:absolute;left:8%;right:8%;top:62%;display:flex;justify-content:space-between}
.pr{position:relative;width:22px;height:22px}
.pr i,.pr b{position:absolute;inset:0;transform:rotate(45deg) scale(.8)}
.pr i{background:var(--fs-ruby);animation:prA 3.2s var(--ease) infinite;animation-delay:var(--d)}
.pr b{background:var(--fs-jade);opacity:0;animation:prB 3.2s var(--ease) infinite;animation-delay:var(--d)}
@keyframes prA{0%,10%{opacity:1}20%,88%{opacity:0}100%{opacity:1}}
@keyframes prB{0%,10%{opacity:0;transform:rotate(45deg) scale(.8)}18%{opacity:1;transform:rotate(45deg) scale(1.05)}26%,88%{opacity:1;transform:rotate(45deg) scale(.8)}100%{opacity:0}}
.pr.g i{background:var(--line);animation:none}.pr.g b{display:none}
.meter{position:absolute;left:8%;right:8%;bottom:12%;height:6px;background:var(--deep);box-shadow:inset 0 0 0 1px var(--line)}
.meter i{position:absolute;inset:0;background:var(--sel);transform-origin:left;animation:meter 3.2s var(--ease) infinite}
@keyframes meter{0%{transform:scaleX(.18)}90%{transform:scaleX(1)}100%{transform:scaleX(.18)}}
.burst{position:absolute;left:50%;top:50%;width:0;height:0}
.oc{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid var(--omni);transform:rotate(45deg);animation:oc 3.2s var(--ease) infinite}
@keyframes oc{0%,10%{transform:rotate(45deg) scale(1);opacity:1}24%{transform:rotate(45deg) scale(1.3);opacity:1}32%,100%{transform:rotate(45deg) scale(0);opacity:0}}
.sb{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--ink);box-shadow:0 0 0 2px var(--sel);opacity:0;animation:sb 3.2s var(--ease) infinite}
@keyframes sb{0%,26%{transform:rotate(var(--a)) translateX(0) scale(.2);opacity:0}40%,78%{transform:rotate(var(--a)) translateX(44px) scale(1);opacity:1}92%,100%{transform:rotate(var(--a)) translateX(48px) scale(.6);opacity:0}}
.dev{display:flex;gap:10px;margin-top:12px}
.dv{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;background:var(--deep);box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.dl{font-size:10px;letter-spacing:.16em;color:var(--soft)}
.dg{height:44px;display:flex;align-items:center;justify-content:center;gap:4px}
.dg img{width:40px;height:40px;object-fit:contain}
.dc{font-size:12px;text-align:center;line-height:1.3}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:34px;padding:0 10px;font-size:13px;font-weight:600;background:var(--panel);box-shadow:inset 0 -4px 0 var(--line),inset 0 0 0 1px var(--line);white-space:nowrap}
.ph{display:inline-flex;align-items:center;justify-content:space-between;width:74px;height:40px;padding:0 9px;border:2px solid var(--line);border-radius:9px}
.th{width:14px;height:18px;border-radius:50%;background:var(--soft)}
.tbtn2{width:40px;height:40px;border-radius:50%;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center}
.tbtn2 img,.tbtn2 .ico{width:28px;height:28px}
/* the gestures: tap, hold, hold then release, tap on / tap off; a passive ability just flies */
.g-tap .pp{animation:p-tap 3.2s var(--ease) infinite}
.g-hold .pp{animation:p-hold 3.2s var(--ease) infinite}
.g-release .pp{animation:p-rel 3.2s var(--ease) infinite}
.g-toggle .pp{animation:p-tog 3.2s var(--ease) infinite}
.g-tap .kp{animation:k-tap 3.2s var(--ease) infinite}
.g-hold .kp{animation:k-hold 3.2s var(--ease) infinite}
.g-release .kp{animation:k-rel 3.2s var(--ease) infinite}
.g-toggle .kp{animation:k-tog 3.2s var(--ease) infinite}
.g-tap .lf,.g-toggle .lf{animation:l-tap 3.2s var(--ease) infinite}
.g-hold .lf,.g-release .lf{animation:l-hold 3.2s var(--ease) infinite}
.dr{animation:drift 3.2s var(--ease) infinite}
@keyframes p-tap{0%,16%{transform:scale(1)}20%,24%{transform:scale(.84)}30%,100%{transform:scale(1)}}
@keyframes p-hold{0%,12%{transform:scale(1)}16%,70%{transform:scale(.84)}76%,100%{transform:scale(1)}}
@keyframes p-rel{0%,12%{transform:scale(1)}16%,56%{transform:scale(.84)}60%{transform:scale(1.12)}68%,100%{transform:scale(1)}}
@keyframes p-tog{0%,12%{transform:scale(1)}15%,19%{transform:scale(.84)}23%,52%{transform:scale(1)}55%,59%{transform:scale(.84)}63%,100%{transform:scale(1)}}
@keyframes k-tap{0%,16%{transform:translateY(0)}20%,24%{transform:translateY(3px)}30%,100%{transform:translateY(0)}}
@keyframes k-hold{0%,12%{transform:translateY(0)}16%,70%{transform:translateY(3px)}76%,100%{transform:translateY(0)}}
@keyframes k-rel{0%,12%{transform:translateY(0)}16%,56%{transform:translateY(3px)}60%{transform:translateY(-1px)}66%,100%{transform:translateY(0)}}
@keyframes k-tog{0%,12%{transform:translateY(0)}15%,19%{transform:translateY(3px)}23%,52%{transform:translateY(0)}55%,59%{transform:translateY(3px)}63%,100%{transform:translateY(0)}}
@keyframes l-tap{0%,14%{transform:translateY(0) scale(1);opacity:1}20%,30%{transform:translateY(-9px) scale(1.2);opacity:.3}38%,100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes l-hold{0%,12%{transform:translateY(0) scale(1);opacity:1}18%,66%{transform:translateY(-9px) scale(1.2);opacity:.3}74%,100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}30%{transform:translate(4px,-3px)}65%{transform:translate(-3px,3px)}}

/* ---------- sections ---------- */
.sec{display:flex;align-items:center;gap:18px;margin:56px 0 8px;flex-wrap:wrap}
.sec .disp{font-size:30px}
.sec .rule{flex:1;height:1px;background:var(--line);min-width:40px}

<script>
(function(){
  var TH = window.FC_THEMES || {themes:[], current:function(){ return ""; }, pick:function(){}};

  var app = document.getElementById("app"), q = document.getElementById("q"), sw = document.getElementById("switch");
  var L5 = {wired:["good","WIRED"], open:["","OPEN"], off:["warn","SWITCHED OFF"], "label-only":["warn","NAMED, NOT GATED"], "gate-only":["warn","GATED, NOT NAMED"]};
  var HULL_SVG = '<svg viewBox="0 0 46 26" aria-hidden="true"><path d="M2 13 L16 4 L44 13 L16 22 Z" fill="currentColor"/><path d="M2 13 L16 9 L16 17 Z" fill="var(--sel)"/></svg>';
  var CARET = '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4.5l3 3 3-3"/></svg>';

  var ARROW_R = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg>';

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function day(d){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ""); return m ? (+m[3]) + " " + MONTHS[+m[2] - 1] + " " + m[1] : d; }

    if(!layers) return img(src, alt);

  /* ---------- themes and domains ---------- */

      return '<button class="titem" type="button" role="menuitemradio" aria-checked="' + (x.id === t.id) + '" data-t="' + x.id + '"><span class="sw">' + swatch(x) + '</span><span><b>' + esc(x.name) + '</b><span class="d">' + esc(x.line) + '</span></span></button>'; }).join("");

      more = '<span><span class="k">Seat control</span><p style="font-size:14px;color:var(--soft)">Read from ' + esc(file(v.seats.source)) + '.</p></span>';
      l5 = '<span class="l5"><span class="k">Level 5</span><p>The ability map carries one ability per element for the hull; this seat ability has no level 5 of its own.</p></span>';
    } else if(p.omni){
      var ow = p.omni.words || {};
      does = '<span><span class="k">What it does</span><p>' + esc(ow.does || (p.omni.effects.length ? "Its crystal effects: " + p.omni.effects.join(", ") + "." : "No omni crystal effect of its own.")) + '</p></span>';
      more = '<span><span class="k">Omni crystal</span><p style="font-size:15px">Flown into, never pressed.</p></span>';
      l5 = '<span class="l5"><span class="k">Level 5</span><b>No level 5</b><p>The omni crystal has no level-5 upgrade.</p></span>';
    } else {
      var e = p.e, w = e.words || {}, u = e.upgrade, st = L5[u.status] || L5.open;
      does = '<span><span class="k">What it does</span><p>' + esc(w.does || e.description) + '</p></span>';
      more = '<span><span class="k">More ' + esc(p.el) + '</span>' + (w.scales ? '<p style="font-size:15px">' + esc(w.scales) + '</p>' : '') + e.scaling.filter(function(x){ return x.field && x.min != null; }).map(function(x){
          return '<span class="dial' + (x.on ? '' : ' off') + '">' + esc(x.field) + ' &times;' + num(x.min) + ' to &times;' + num(x.max) + (x.on ? '' : ' (switched off)') + '<i>' + esc(file(x.asset || x.script)) + '</i></span>'; }).join("") +
        (!w.scales && !e.scaling.length ? '<p style="font-size:14px;color:var(--soft)">This element changes no number.</p>' : '') + '</span>';
      var frames = flower(p.el, 0);
      l5 = '<span class="l5"><span class="l5top"><span class="k" style="margin:0">Level 5</span><button type="button" class="l5go" data-l5="' + p.key + '" aria-label="Play level 5 of ' + esc(p.name) + '"><span class="flw">' + frames + '</span>Play L5</button></span><b>' + esc(u.label || (u.status === "open" ? "Not designed yet" : "Unnamed")) + '</b><p>' + esc(u.description || (u.status === "open" ? "Unlocks at level " + u.unlockLevel + ", relocks below " + u.relockBelow + "." : "")) + '</p><span class="pill ' + st[0] + '">' + st[1] + '</span></span>';
    }
    return '<div class="row' + (on ? ' on' : '') + '" data-row="' + p.key + '"><button type="button" class="pickhead" data-pick="' + p.key + '" aria-pressed="' + on + '" aria-label="Play the move of ' + esc(p.name) + '">' + head + '</button>' + does + more + l5 + '</div>';
  }

  /* ---------- the whole fleet: one card per vessel, every vessel on a screen or two ---------- */
  var fleetFilt = "All", fleetSort = "Completion", fleetStage = "Any", tierEl = "Time", tierPick = "Any tier";
  function fleetView(){
    var all = listed(), vs = all.filter(matches).filter(function(v){ return fleetFilt === "All" || (fleetFilt === "Crews") === !!isCrew(v); });
    var wired = all.reduce(function(a, v){ return a + v.status.upgradesWired; }, 0);
    var sortEl = fleetSort === "Completion" ? null : fleetSort.split(" ")[0];
    /* completion and tier filter and sort the solo vessels on their own (Shombith 2026-11-10: "sort and filter ... as per
       tier and completion separately"); crews carry no certificate, so a stage or tier filter leaves them out */
    var certFilter = fleetStage !== "Any" || tierPick !== "Any tier";
    function card(v){
      var by = elementGames(v), ps = picks(v), c = v.certificate;
      var flowers = D.elements.map(function(el){
        var g = by[el]; return '<span class="fel' + (g.length ? '' : ' none') + '" title="' + esc(el + ': ' + (g.length ? g.map(function(c){ return c.name; }).join(", ") : 'no game yet')) + '">' + flower(el, 5) + '</span>'; }).join("");
      var cert = c ? '<span class="fcert"><span class="row1"><span class="lab" style="flex:1">Completion</span><b class="' + pctCls(c) + '">' + c.pct + '%</b></span>' + segs(c, true) +
        '<span class="ftiers">' + D.elements.map(function(el){ return '<span>' + tierBadge(v.tiers[el], el, el === sortEl || (tierPick !== "Any tier" && el === tierEl)) + '<small>' + el.charAt(0) + '</small></span>'; }).join("") +
        '<small style="margin-left:auto;align-self:center;font-size:12px;color:var(--soft)">' + v.cards.length + ' game' + (v.cards.length === 1 ? '' : 's') + '</small></span></span>' : '';
      return '<a class="fcard" href="#' + esc(v.key) + '"><span class="pic">' + img(vimg(v), "") + (isCrew(v) ? '<span class="seats">' + v.crew.seats + ' seats</span>' : '') + '</span>' +
        '<span class="fbody"><span class="fname"><span class="disp">' + esc(crewName(v)) + '</span><small>' + (isCrew(v) ? 'Crew' : 'Vessel ' + v.id) + ' &middot; L5 ' + v.status.upgradesWired + '/4</small></span>' +
        '<span class="fab">' + ps.slice(0, 6).map(function(p){ return '<span title="' + esc(p.name) + '">' + iconOf(p) + '</span>'; }).join("") + '</span>' +
        (c ? cert : '<span class="fels">' + flowers + '<small>' + v.cards.length + ' game' + (v.cards.length === 1 ? '' : 's') + '</small></span>') + '</span></a>';
    }
    var solo = vs.filter(function(v){ return !isCrew(v) && v.certificate; }).filter(function(v){
      return (fleetStage === "Any" || band(v.certificate) === fleetStage) && (tierPick === "Any tier" || v.tiers[tierEl] === tierPick); });
    solo.sort(function(a, b){ return (sortEl ? tierRank(a.tiers[sortEl]) - tierRank(b.tiers[sortEl]) : 0) || (b.certificate.pct - a.certificate.pct) || (a.id - b.id); });
    var crews = certFilter ? [] : vs.filter(isCrew);
    var certified = all.filter(function(v){ return v.certificate; });
    function chips(list, cur, attr, label){ return list.map(function(x){ return '<button type="button" class="chip" data-' + attr + '="' + esc(x) + '" aria-pressed="' + (x === cur) + '">' + esc(label ? label(x) : x) + '</button>'; }).join(""); }
    function sel(id, label, opts, cur, on){
      return '<label class="fsel">' + label + '<select id="' + id + '" class="' + (on ? 'on' : '') + '">' + opts.map(function(o){
        if(o.group) return '<optgroup label="' + esc(o.group) + '">' + o.items.map(function(i){ return '<option value="' + esc(i.v) + '"' + (i.v === cur ? ' selected' : '') + '>' + esc(i.t) + '</option>'; }).join("") + '</optgroup>';
        return '<option value="' + esc(o.v) + '"' + (o.v === cur ? ' selected' : '') + '>' + esc(o.t) + '</option>'; }).join("") + '</select>' + CARET + '</label>';
    }
    var tierCur = tierPick === "Any tier" ? "any" : tierEl + ":" + tierPick;
    var tools = '<div class="ftools" role="group" aria-label="Sort and filter the solo vessels">' +
      sel("fsort", "Sort", ["Completion"].concat(D.elements.map(function(e){ return e + " tier"; })).map(function(x){ return {v:x, t:x}; }), fleetSort, false) +
      sel("fstage", "Completion", [{v:"Any", t:"Any"}].concat(BANDS.map(function(x){ return {v:x, t:x + "  (" + certified.filter(function(v){ return band(v.certificate) === x; }).length + ")"}; })), fleetStage, fleetStage !== "Any") +
      sel("ftier", "Tier", [{v:"any", t:"Any"}].concat(D.elements.map(function(e){ return {group:e + " games", items:["S", "A", "B", "C"].map(function(t){
        return {v:e + ":" + t, t:e + " " + t + "  (" + certified.filter(function(v){ return v.tiers[e] === t; }).length + ")"}; })}; })), tierCur, tierPick !== "Any tier") +
      (certFilter ? '<button type="button" class="fclear" id="fclear">Clear filters</button>' : '') +
      '<span class="fcount">' + solo.length + ' of ' + certified.length + ' solo vessels</span></div>';
    app.innerHTML = '<div class="fhead"><div><div class="lab" style="color:var(--sel)">The fleet</div><h1 class="disp">Pick a vessel</h1></div>' +
      '<div class="fstats">' + [[all.length, "vessels"], [all.filter(isCrew).length, "crews"], [wired + " / " + all.length * 4, "level 5 wired"],
        [certified.filter(function(v){ return v.certificate.pct >= 100; }).length + " / " + certified.length, "at 100%"]].map(function(x){ return '<div><span class="disp">' + x[0] + '</span><small>' + x[1] + '</small></div>'; }).join("") + '</div>' +
      '<div class="filters" role="group" aria-label="Show">' + chips(["All", "Solo", "Crews"], fleetFilt, "ff") + '</div></div>' +
      (fleetFilt !== "Crews" ? tools : '') +
      (solo.length ? '<div class="fgrid">' + solo.map(card).join("") + '</div>' : '') +
      (crews.length ? '<div class="sec" style="margin-top:36px"><span class="disp">Crews</span><span class="lab">Two or more pilots, one hull &middot; no certificate</span><span class="rule"></span></div><div class="fgrid">' + crews.map(card).join("") + '</div>' : '') +
      (solo.length || crews.length ? '' : '<p class="empty">' + (certFilter ? 'No solo vessel matches both filters.' : 'No vessel matches.') + '</p>');
    function bind(attr, set){ Array.prototype.forEach.call(app.querySelectorAll("[data-" + attr + "]"), function(b){ b.addEventListener("click", function(){
      set(b.getAttribute("data-" + attr)); var y = window.scrollY; fleetView(); window.scrollTo(0, y);
      var n = app.querySelector('[data-' + attr + '="' + b.getAttribute("data-" + attr) + '"]'); if(n) n.focus({preventScroll:true}); }); }); }
    bind("ff", function(x){ fleetFilt = x; });
    function onSel(id, set){ var el = document.getElementById(id); if(el) el.addEventListener("change", function(){
      set(el.value); var y = window.scrollY; fleetView(); window.scrollTo(0, y); var n = document.getElementById(id); if(n) n.focus({preventScroll:true}); }); }
    onSel("fsort", function(x){ fleetSort = x; }); onSel("fstage", function(x){ fleetStage = x; });
    onSel("ftier", function(x){ if(x === "any"){ tierPick = "Any tier"; } else { tierEl = x.split(":")[0]; tierPick = x.split(":")[1]; } });
    var fc = document.getElementById("fclear"); if(fc) fc.addEventListener("click", function(){ fleetStage = "Any"; tierPick = "Any tier"; fleetView(); });
  }

  var PADMAP = {};
  function route(keep){
    if(!D) return;
    var v = current();
    drawSwitch();
    document.getElementById("navFleet").setAttribute("aria-current", v ? "false" : "page");
    if(v){ vesselView(v, keep === true); document.title = crewName(v) + " - Fleet Codex"; } else { fleetView(); document.title = "Fleet Codex"; }
  }
  q.addEventListener("input", function(){ query = q.value.trim().toLowerCase(); if(current()){ menuOpen = !!query; drawSwitch(); } else fleetView(); });
  fetch("fleet.json", {cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(d){
    D = d;
    var saved = null; try { saved = localStorage.getItem("fleetCodexDomain"); } catch(e){}
    applyDomain(saved || (d.palette && d.palette["default"]));
    D.vessels.forEach(function(v){ if(v.controls) v.controls.rows.forEach(function(r){ if(r.padArt && !PADMAP[r.pad]) PADMAP[r.pad] = r.padArt; }); });
    document.getElementById("logo").src = d.ui.omni || "";
    document.getElementById("foot").innerHTML = 'Read from the game&rsquo;s own files every day: the ability maps, the vessel prefabs and their HUDs, the class assets, the touch profiles and the game cards. Every icon is the game&rsquo;s own.';
    route();
  }).catch(function(err){ app.innerHTML = '<p class="empty">The fleet data did not load (' + esc(err.message) + '). Reload the page.</p>'; });
  window.addEventListener("hashchange", function(){ pick = null; filt = "All"; lv5 = false; menuOpen = false; route(); window.scrollTo(0, 0); });
})();
</script>
