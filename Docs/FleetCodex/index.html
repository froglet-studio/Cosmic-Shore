<title>Fleet Codex</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aldrich&family=Chakra+Petch:wght@500;600;700&display=swap">
<script src="theme.js"></script>
<link rel="stylesheet" href="themes.css">
<style>
/* Layout: design B of the board's Rev 48 (picked by Shombith, 2026-11-02). A top bar with the theme picker at its right,
   a filmstrip of the whole fleet (crew vessels as wider posters with their seats), then the picked vessel as a bento:
   the hull, its abilities as cards that flip to their level-5 face (a crew vessel's split into one card per seat), ONE
   control map drawing controller, keyboard and phone with the picked ability lit and PLAYING its gesture (tap, hold,
   hold and release, toggle, a stick's sweep), its games one element at a time (its Charge game, its Mass game ...),
   the picked ability's full text, docs and changes. #fleet is the whole fleet as one table. Data: fleet.json, generated
   from the shipped assets by Tools/Build/fleet_codex.py; every icon is the game's own art.
   Look: the Froglet UI style guide (Docs/UI_STYLE_GUIDE.md; Frogma's Style Guide tab) as the analytics console draws
   it - Aldrich to read, Chakra Petch to press, the corner sliver and nothing rounded, panels drawn like the game's
   prisms, the sea lines behind the page. Themes (Shombith 2026-11-08): the game's three colour sets, Nocturne, Photic
   and Dart Frog, written by Tools/Analytics/console/make_themes.py into themes.css / theme.js (the --fs-* tokens on
   html[data-fs-theme]); the film-named themes moved to these. Below, the page's own names map onto those tokens. */
:root{
  --bg:var(--fs-ground); --surface:color-mix(in srgb,var(--fs-surface) 88%,var(--fs-ground-deep)); --raise:var(--fs-surface);
  --ink:var(--fs-text); --muted:var(--fs-text-soft); --faint:var(--fs-text-off); --line:color-mix(in srgb,var(--fs-line) 72%,transparent);
  --edge:var(--fs-line); --tile:var(--fs-ground-deep); --accent:var(--fs-selection); --warn:var(--fs-danger); --good:var(--fs-cta);
  --display:"Aldrich","Chakra Petch",system-ui,sans-serif; --dscale:.74; --dcase:none; --dtrack:0;
  --mono:"Chakra Petch","Aldrich",system-ui,sans-serif; --body:"Aldrich","Chakra Petch",system-ui,sans-serif;
  --still:saturate(.7) contrast(1.05); --still-on:none; --still-op:.55; --ground:none; --radius:0px;
  --sl:14px; --sls:10px; --micro:120ms; --std:200ms; --panel:320ms; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:var(--ground);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;transition:background-color .3s,color .3s}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hd{font-family:var(--display);font-weight:600;letter-spacing:var(--dtrack);text-transform:var(--dcase);line-height:.95}
:root .hd{font-weight:400}
.mo{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.wrap{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{width:22px;height:22px}
.logo span{font-size:calc(26px * var(--dscale))}
.top nav a{text-decoration:none;color:var(--muted);font-weight:500}
.top nav a[aria-current="page"]{color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;height:36px;flex:0 1 300px;min-width:170px;padding:0 14px;border:1px solid var(--edge);border-radius:0;background:var(--surface);margin-left:auto}
.search input{all:unset;font-size:13px;color:var(--ink);width:100%}
.themes{position:relative}
.dompick{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:0;background:var(--surface)}
.dompick button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:0;font-size:12.5px;color:var(--muted)}
.dompick button i{width:14px;height:14px;border-radius:0;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.35) inset}
.dompick button[aria-checked="true"]{background:var(--raise);color:var(--ink);box-shadow:0 0 0 1px var(--edge)}
.dompick button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{position:relative;display:block;width:80px;height:80px;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.ico>*{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ico .lay{-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;transition:background-color .35s}
.l5t .ico{width:20px;height:20px;background:var(--tile);border-radius:0;align-self:center;flex:none}
.l5t .ico>*{inset:1px;width:calc(100% - 2px);height:calc(100% - 2px)}
.l5t .ico img{background:none;padding:0;border-radius:0}
.cell .ic .ico{width:100%;height:100%}
.tbtn{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--edge);border-radius:0;background:var(--surface);cursor:pointer;font-size:13px}
.tbtn:hover{border-color:var(--ink)}
.sw{display:inline-flex;width:22px;height:14px;border-radius:0;overflow:hidden;border:1px solid rgba(128,128,128,.5);flex:none}
.sw i{flex:1}
.tmenu{position:absolute;right:0;top:44px;width:290px;background:var(--surface);border:1px solid var(--edge);border-radius:0;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.45);z-index:9}
.titem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:0;padding:9px 10px;cursor:pointer}
.titem:hover,.titem[aria-checked="true"]{background:var(--raise)}
.titem .sw{width:30px;height:20px;border-radius:0}
.titem b{display:block;font-size:13px}
.titem span.d{display:block;font-size:11.5px;color:var(--muted);line-height:15px}
/* filmstrip */
.strip{display:flex;gap:12px;overflow-x:auto;padding-block:16px 12px;scrollbar-width:thin}
.poster{display:flex;flex-direction:column;gap:6px;flex:none;width:128px;text-decoration:none;color:var(--muted);font-size:12.5px;line-height:16px}
.poster.crew{width:176px}
.poster .ph{position:relative;display:block;height:72px;border-radius:0;overflow:hidden;background:var(--surface)}
.poster img{width:100%;height:100%;object-fit:cover;opacity:.72;display:block;transition:opacity .2s,transform .3s}
.poster.crew .ph{box-shadow:inset 0 0 0 1px var(--edge)}
.poster[aria-current="page"]{color:var(--ink)}
.poster[aria-current="page"] img{opacity:1}
.poster[aria-current="page"] .ph{box-shadow:0 0 0 2px var(--ink)}
.poster:hover img{opacity:.85;transform:scale(1.05)}
.seats{position:absolute;right:6px;top:6px;font-family:var(--mono);font-size:9.5px;color:var(--ink);background:color-mix(in srgb,var(--fs-ground-deep) 85%,transparent);border:1px solid #555;border-radius:0;padding:0 6px}
.poster.all .ph{display:flex;align-items:center;justify-content:center;border:1px dashed var(--edge);background:transparent}
/* bento */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;padding-block:6px 40px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:0;min-width:0;position:relative;overflow:hidden}
.pad{padding:18px 20px}
.span5{grid-column:span 5}.span7{grid-column:span 7}.span9{grid-column:span 9}.span3{grid-column:span 3}.span12{grid-column:span 12}
.hero{min-height:400px;display:flex;align-items:flex-end}
.hero .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero.wide{min-height:340px}.hero.wide .still{object-position:center 40%;left:28%;width:72%}
.hero.wide::after{background:linear-gradient(90deg,var(--surface) 30%,color-mix(in srgb,var(--surface) 55%,transparent) 48%,transparent 78%)}
.hero.wide .copy{max-width:min(760px,62%)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--surface) 16%,transparent 72%)}
.hero .copy{position:relative;z-index:1;padding:22px 24px;display:flex;flex-direction:column;gap:8px;width:100%}
.hero h1{font-size:calc(clamp(52px,6vw,88px) * var(--dscale));margin:0}
.crewline{font-family:var(--display);font-size:24px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:6px}
.stats .n{font-family:var(--display);font-size:calc(28px * var(--dscale))}
/* the kit: ability cards that flip to their level-5 face */
.kit{min-width:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-content:start}
.ab{perspective:1100px;min-width:0;animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:.25;transform:translateY(14px)}to{opacity:1;transform:none}}
.ab .inner{display:grid;transition:transform .6s cubic-bezier(.3,.9,.25,1);transform-style:preserve-3d;height:100%}
.ab.flip .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border-radius:0;background:var(--surface);border:1px solid var(--line);min-height:440px;min-width:0;transition:border-color .2s,box-shadow .25s,transform .2s}
.face.back{transform:rotateY(180deg);background:var(--raise)}
.ab:hover .face.front{border-color:var(--edge);transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.28)}
.ab.sel .face{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink),0 16px 38px rgba(0,0,0,.3)}
.pickbtn{all:unset;display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;cursor:pointer;flex:1;min-width:0}
.pickbtn:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:0}
.pickbtn:active .icontile{transform:scale(.94)}
.el{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.chip{width:22px;height:22px;border-radius:0;background:var(--tile);display:inline-flex;align-items:center;justify-content:center;flex:none}
.chip img{width:15px;height:15px;object-fit:contain}
.icontile{position:relative;width:96px;height:96px;border-radius:0;background:var(--tile);display:flex;align-items:center;justify-content:center;margin:14px 0 10px;transition:transform .25s cubic-bezier(.3,1.4,.5,1),box-shadow .25s}
.icontile img{position:relative;width:80px;height:80px;object-fit:contain;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.icontile.none img{width:44px;height:44px;opacity:.6}
.ab:hover .icontile img,.ab:hover .icontile .ico{transform:scale(1.08) rotate(-3deg)}
.ab.sel .icontile{box-shadow:inset 0 0 0 1px var(--edge)}
.icontile .bloom{position:absolute;inset:-26px;width:auto;height:auto;opacity:0;transition:opacity .5s;pointer-events:none}
.icontile .bloom{display:none}
.ab.flip .back .icontile{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rim) 55%,transparent)}
.name{font-family:var(--display);font-weight:600;font-size:calc(30px * var(--dscale) * var(--fit,1));line-height:1;letter-spacing:var(--dtrack);text-transform:var(--dcase);overflow-wrap:normal;hyphens:manual;max-width:100%}
:root .name{font-weight:400}
.sum{width:100%;font-size:12.5px;line-height:18px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;margin-top:8px;color:var(--ink);overflow-wrap:anywhere}
.face .mo{overflow-wrap:anywhere}
.how{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:3px 9px 3px 4px;border:1px solid var(--line);border-radius:0;background:var(--raise);font-family:var(--mono);font-size:10.5px;line-height:14px;color:var(--ink);max-width:100%}
.how:not(:has(.g)){padding-left:9px}
.how .g{display:inline-flex;gap:2px;background:var(--tile);border-radius:0;padding:1px 2px}.how .g img{width:18px;height:18px;object-fit:contain}.how .g .cap{font-size:10px}
.scl{display:flex;gap:7px;align-items:flex-start;width:100%;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px;line-height:16px;color:var(--muted)}
.scl .chip{width:18px;height:18px}.scl .chip img{width:12px;height:12px}
.l5t{display:flex;gap:7px;align-items:baseline;width:100%;font-size:12px;color:var(--ink)}
.l5t b{font-family:var(--display);font-size:calc(17px * var(--dscale));letter-spacing:var(--dtrack)}
.l5t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l5t img{width:20px;height:20px;object-fit:contain;align-self:center;background:var(--tile);border-radius:0;padding:1px}
.detail .what{border-left:2px solid var(--edge);padding-left:14px;margin:10px 0 16px}
.detail .big{font-size:16px;line-height:24px;color:var(--ink);max-width:75ch}
.grow{flex:1}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%;min-width:0;margin-top:10px}
.foot .l5{flex:none;margin-left:auto}
.foot .sp{flex:1}
.pill{font-family:var(--mono);font-size:10px;border:1px solid var(--edge);border-radius:0;padding:1px 8px;color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:currentColor}.pill.warn{color:var(--warn);border-color:currentColor}
.l5{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:0;border:1px solid var(--edge);background:var(--raise);cursor:pointer;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;transition:transform .15s,border-color .2s,background .2s,box-shadow .25s}
.l5:hover{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.l5:active{transform:scale(.93)}
.l5 svg{transition:transform .4s}
.l5:hover svg{transform:rotate(180deg)}
.back .lvl{font-family:var(--display);font-size:calc(54px * var(--dscale));line-height:.9;color:var(--ink);letter-spacing:var(--dtrack)}
.back .ul{font-weight:600;font-size:15px;line-height:19px}
.back .gate{font-family:var(--mono);font-size:10.5px;color:var(--muted);overflow-wrap:anywhere}
/* a crew vessel: one card per seat, the seat's abilities inside it */
.kit.crew{display:flex;flex-wrap:wrap;gap:12px}
.kit.crew .seat{flex:var(--n,1) 1 calc(var(--n,1) * 196px + 30px);min-width:0;max-width:100%}
.kit.crew>p{flex-basis:100%}
.seat{border:1px solid var(--edge);border-radius:0;padding:14px;background:color-mix(in srgb,var(--surface) 70%,transparent);animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.seat-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:2px 4px 12px}
.seat-head .hd{font-size:calc(34px * var(--dscale))}
.seat-head p{margin:0;flex:1 1 320px;color:var(--muted);font-size:13px;line-height:18px}
.seat-kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.seat-kit .face{min-height:360px}
.doc .face{min-height:0;background:transparent;border-style:dashed}
.hullrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
/* controls: one drawing per device, the picked ability's control PLAYING its gesture on all three at once (the style
   guide's one allowed motion here: "the hint that teaches the next control"). The gesture is read from the ability's
   own trigger words (abilities.json): tap, hold, hold then release, tap on / tap off, a stick's sweep. One 2.4 s loop,
   the same clock on every device; reduced motion holds the pressed pose still. */
.ctl-head{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-bottom:14px}
.ctl-head .hd{font-size:calc(30px * var(--dscale))}
.gest{display:inline-flex;align-items:center;gap:10px;min-height:32px;padding:4px 14px 4px 10px;background:var(--raise);box-shadow:inset 0 0 0 1px var(--edge);font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.gest.lit{box-shadow:inset 0 0 0 1px var(--accent),inset 3px 0 0 var(--accent)}
.gest .tl{position:relative;width:64px;height:6px;background:var(--tile);box-shadow:inset 0 0 0 1px var(--edge);flex:none;overflow:hidden}
.gest .tl i{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.gest .what2{font-weight:500;letter-spacing:.04em;text-transform:none;color:var(--muted)}
.devices{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:16px}
.dev{display:flex;flex-direction:column;gap:10px;min-width:0;padding:14px 14px 12px;background:color-mix(in srgb,var(--tile) 55%,transparent);box-shadow:inset 0 0 0 1px var(--line)}
.dev h3{margin:0;display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.16em;color:var(--muted)}
.dev h3 b{font-weight:600;color:var(--ink);letter-spacing:.08em}
.dev svg.draw{display:block;width:100%;height:auto;overflow:visible}
.draw text{font-family:var(--mono);font-weight:700;font-size:11px;fill:var(--muted);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.draw .body{fill:color-mix(in srgb,var(--fs-surface) 70%,var(--tile));stroke:var(--edge);stroke-width:1.5}
.draw .body2{fill:none;stroke:color-mix(in srgb,var(--rim) 30%,transparent);stroke-width:1}
.draw .well,.draw .cap{fill:var(--tile);stroke:var(--edge);stroke-width:1.2}
.draw .knob,.draw .rip,.draw .ring,.draw .bar,.draw .latch{transform-box:fill-box;transform-origin:center}
.draw .rip{fill:none;stroke:var(--accent);stroke-width:2;opacity:0}
.draw .ring{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:100;stroke-dashoffset:100;opacity:0}
.draw .bar{fill:var(--accent);transform-origin:left center;transform:scaleX(0)}
.draw .latch{fill:var(--accent);opacity:0}
.pp{transition:opacity var(--std)}
.pp.st-off{opacity:.35}
.pp.st-on .cap{stroke:var(--muted)}
.pp.st-on text{fill:var(--ink)}
.pp.st-lit .cap{fill:color-mix(in srgb,var(--accent) 26%,var(--tile));stroke:var(--accent);stroke-width:2}
.pp.st-lit text{fill:var(--ink)}
.pp.st-lit .well{stroke:var(--accent)}
.pp.tap{cursor:pointer}
.pp.tap:hover .cap{stroke:var(--ink)}
/* the thumbs on the phone: a soft pad of light where a thumb rests */
.draw .thumb{fill:color-mix(in srgb,var(--ink) 22%,transparent);stroke:color-mix(in srgb,var(--ink) 55%,transparent);stroke-width:1.2;transform-box:fill-box;transform-origin:center}
.draw .zone{fill:none;stroke:var(--edge);stroke-dasharray:3 4}
.draw .screen{fill:color-mix(in srgb,var(--fs-ground) 80%,var(--tile));stroke:var(--line)}
.draw .frame{fill:var(--tile);stroke:var(--edge);stroke-width:2}
/* the gestures */
.st-lit.g-tap .knob{animation:g-tap 2.4s infinite}
.st-lit.g-tap .rip{animation:g-rip 2.4s infinite}
.st-lit.g-hold .knob{animation:g-hold 2.4s infinite}
.st-lit.g-hold .ring{animation:g-ring 2.4s infinite}
.st-lit.g-hold .bar{animation:g-bar 2.4s infinite}
.st-lit.g-release .knob{animation:g-charge 2.4s infinite}
.st-lit.g-release .ring{animation:g-ring2 2.4s infinite}
.st-lit.g-release .bar{animation:g-bar2 2.4s infinite}
.st-lit.g-release .rip{animation:g-burst 2.4s infinite}
.st-lit.g-toggle .knob{animation:g-toggle 2.4s infinite}
.st-lit.g-toggle .latch{animation:g-latch 2.4s infinite}
.st-lit.g-toggle .rip{animation:g-rip2 2.4s infinite}
.st-lit.kind-stick .knob,.st-lit.g-stick .knob{animation:g-stick 2.4s ease-in-out infinite}
.st-on.kind-stick.steer .knob{animation:g-drift 7.2s ease-in-out infinite}
.st-lit.kind-trig.g-tap .knob,.st-lit.kind-trig.g-toggle .knob{animation:g-pull-tap 2.4s infinite}
.st-lit.kind-trig.g-hold .knob{animation:g-pull 2.4s infinite}
.st-lit.kind-trig.g-release .knob{animation:g-pull2 2.4s infinite}
.st-lit.kind-key.g-tap .knob,.st-lit.kind-key.g-toggle .knob{animation:g-key-tap 2.4s infinite}
.st-lit.kind-key.g-hold .knob{animation:g-key 2.4s infinite}
.st-lit.kind-key.g-release .knob{animation:g-key2 2.4s infinite}
.st-lit.kind-thumb.g-tap .thumb,.st-lit.kind-thumb.g-toggle .thumb{animation:g-lift-tap 2.4s infinite}
.st-lit.kind-thumb.g-hold .thumb,.st-lit.kind-thumb.g-release .thumb,.st-lit.kind-thumb.g-passive .thumb{animation:g-lift 2.4s infinite}
.st-lit.kind-apart .thumb.l{animation:g-apart-l 2.4s infinite}.st-lit.kind-apart .thumb.r{animation:g-apart-r 2.4s infinite}
.st-lit.kind-slide .knob{animation:g-slide 2.4s ease-in-out infinite}
.st-lit .finger{animation:g-finger 2.4s infinite}

    app.innerHTML = '<div class="bento">' +
      '<section class="tile pad span12"><span class="mo" style="letter-spacing:.12em">THE WHOLE FLEET</span><h1 class="hd" style="font-size:calc(64px * var(--dscale));margin:4px 0 14px">Every vessel, every ability</h1>' +
        '<div class="tally"><div class="tile"><div class="n">' + all.length + '</div><div class="mo">vessels, ' + all.filter(isCrew).length + ' of them crews</div></div><div class="tile"><div class="n">' + wired + '<span class="mo"> / ' + slots + '</span></div><div class="mo">level-5 upgrades wired</div></div>' +
        '<div class="tile"><div class="n">' + Object.keys(games).length + '</div><div class="mo">game cards that seat them</div></div><div class="tile"><div class="n">' + all.filter(function(v){ return v.status.inToybox; }).length + '</div><div class="mo">in the Vessel Changer</div></div></div></section>' +
      '<section class="tile span12 scroll"><table class="mx"><thead><tr><th>Vessel</th>' + D.elements.map(function(el){ return '<th><span class="chip">' + img(D.ui["shape/" + el], "") + '</span>' + el.toUpperCase() + '</th>'; }).join("") +
        '<th><span class="chip">' + img(D.ui.omni, "") + '</span>OMNI CRYSTAL</th><th>GAMES</th></tr></thead><tbody>' +
        vs.map(function(v){
          var o = v.omni || {};
          return '<tr tabindex="0" data-k="' + esc(v.key) + '"><td><span class="hull">' + img(vimg(v), "") + '<span><span class="nm">' + esc(crewName(v)) + '</span><br><span class="mo">' + (isCrew(v) ? v.crew.seats + ' seats' + (v.seats ? ': ' + esc(v.seats.list.map(function(s){ return s.name; }).join(", ")) : '') : 'vessel ' + v.id) + '</span></span></span></td>' +
            D.elements.map(function(el){ return cell(v.elements[el]); }).join("") +
            '<td><span class="cell"><span class="ic">' + (o.icon ? ico(o.icon, o.layers, "") : img(o.mark, "")) + '</span><span class="nm">' + esc(o.label || (o.effects || [])[0] || "fly into it") + '</span></span></td>' +
            '<td>' + fleetGames(v) + '</td></tr>';
        }).join("") + '</tbody></table></section></div>';
    Array.prototype.forEach.call(app.querySelectorAll("tbody tr[data-k]"), function(tr){
      function go(){ location.hash = tr.dataset.k; }
      tr.addEventListener("click", go);
      tr.addEventListener("keydown", function(ev){ if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); go(); } });
    });
  }

  function route(keep){
    if(!D) return;
    var v = current(), y = window.scrollY;
    drawStrip();
    document.getElementById("navFleet").setAttribute("aria-current", v ? "false" : "page");
    if(keep === true) setTimeout(function(){ window.scrollTo(0, y); }, 0);
    if(v){ vesselView(v, keep === true); document.title = crewName(v) + " - Fleet Codex"; } else { fleetView(); document.title = "Fleet Codex"; }
  }

  q.addEventListener("input", function(){ query = q.value.trim().toLowerCase(); drawStrip(); if(!current()) fleetView(); });
  fetch("fleet.json", {cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(d){
    D = d;
    var saved = null; try { saved = localStorage.getItem("fleetCodexDomain"); } catch(e){}
    applyDomain(saved || (d.palette && d.palette["default"]));
    D.vessels.forEach(function(v){ if(v.controls) v.controls.rows.forEach(function(r){ if(r.padArt && !PADMAP[r.pad]) PADMAP[r.pad] = r.padArt; }); });
    document.getElementById("logo").src = d.ui.omni || "";
    var pending = (d.pending || []).length
      ? ' &middot; includes unmerged: ' + d.pending.map(esc).join(', ')
      : '';
    document.getElementById("stamp").innerHTML = esc(d.branch) + ' &middot; <a href="' + commit(d.commit) + '">' + esc(d.commit) + '</a> &middot; ' + esc(d.commitDate) + pending;
    document.getElementById("foot").innerHTML = 'Only two tables here are typed by hand, each entry citing the doc or code it was read from: what each ability does (<code>Docs/FleetCodex/abilities.json</code>) and the crew seats (<code>Docs/FleetCodex/seats.json</code>). <code>Tools/Build/fleet_codex.py</code> reads the ability maps, the vessel prefabs and their HUDs, the class assets, the touch profiles, the game cards and git history, and a scheduled job republishes this page from bleeding-edge every day when anything changed. The icons are the game&rsquo;s own: each ability&rsquo;s HUD card and its level-5 state from the icon kit or the HUD, the Codex&rsquo;s element shapes, the controller glyphs and the phone&rsquo;s touch icons. Where a HUD draws an icon only at runtime, its element&rsquo;s shape stands in. The skill: <code>/fleet-codex</code>.';
    route();
  }).catch(function(err){ app.innerHTML = '<p class="empty">The fleet data did not load (' + esc(err.message) + '). Reload the page.</p>'; });
  window.addEventListener("hashchange", function(){ pick = null; route(); window.scrollTo(0, 0); });
})();
</script>
