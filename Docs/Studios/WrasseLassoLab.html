<!--
  WRASSE LASSO LAB, round 1 (a /labmaker browser studio).
  Question (Garrett, 2026-10-20): on a phone, the Wrasse's kite follows the thumb, so every lasso is the thumb
  drawing a circle. "It gets old just swirling your finger around in circles." Find lasso controls that need LESS
  finger movement and MORE finesse, in the spirit of the Thresher, whose ship swings round an anchor on a chain.
  The kite, its tail, the loop rule, the motes and the effects are the shipped Wrasse's (KiteNavigatorCore.cs,
  KiteNavigatorConfig.asset). Only the thumb-to-kite mapping changes, five ways:
    Follow - the shipped control: the kite flies to a point 21 mm above the thumb
    Sling  - the thumb is a hand on an invisible rope: small circles whirl the kite round in big ones
    Plant  - touch plants an anchor (the Thresher's plant); the kite swings round it; lift to fling
    Hook   - flick to throw; a hooked flick throws the kite in travelling loop-de-loops
    Well   - the thumb is a gravity well; the kite falls into orbit round it
  Write-up: Docs/Studios/WRASSE_LASSO_LAB.md. Verify: node .claude/skills/labmaker/verify_lab.cjs <this file>
-->
<style>

    }
  }

  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--body); overflow: hidden; }

  #app { display: grid; height: 100%; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr) 220px; grid-template-areas: "head head" "stage dock" "bottom dock"; }
  #panels { display: contents; }
  header { grid-area: head; display: flex; gap: 8px 14px; align-items: center; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }

  #diff { color: var(--changed); font-size: 12px; }

  .note { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
  .scheme-card { border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; margin: 6px 0 10px; }

  textarea, input[type=text] { width: 100%; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .toggles label { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  #panelBtn, #sheetClose { display: none; }

  /* Phone: the stage is the screen; one sheet holds the settings and the tables. */

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);

  // ================= (1) LAB meta + the shipped numbers =================
  // A READER of the shipped Wrasse. Every game constant names the field it was copied from; the knobs of the four new
  // controls are this lab's proposals (prefix sl / pl / hk / wl / lab) and have no game field yet.
  const LAB = { name: 'Wrasse Lasso Lab', branch: 'cece/loving-fermat-ntdnbu', round: 1, doc: 'Docs/Studios/WRASSE_LASSO_LAB.md' };
  const SHIPPED = {
    // KiteNavigatorConfig.asset (Assets/_SO_Assets/VesselActions/KiteNavigator/), read 2026-10-20 on bleeding-edge c2e75379
    boardRadius: 160,            // KiteNavigatorConfigSO.boardRadius (u)
    kiteRadius: 8,               // .kiteRadius (u): the head's contact radius
    kiteSpeed: 320,              // .kiteSpeed (u/s)
    kiteAccel: 12,               // .kiteAccel (1/s)
    tailLength: 4.8,             // .tailLength (board radii): 2.4 until 2026-10-20, doubled in Unity ("double the max length of the lasso")
    thumbOffsetMillimetres: 21,  // .thumbOffsetMillimetres: on touch the kite aims this far above the thumb
    moteCount: 26,               // .moteCount
    moteCluster: 4,              // .moteCluster (average motes per one-element cluster)
    moteSpread: 18,              // .moteSpread (u, gaussian)
    mixedLoops: 0,               // .mixedLoops: 0 Fizzle (shipped), 1 Majority
    growth: 2,                   // .growth: base x growth^(n-1)
    moteSize: 4.5,               // .moteSize (u, the flower's radius)
    spaceMaxScale: 60,           // .spaceMaxScale (AOEExplosion MaxScale at n = 1)
    spaceMaxScaleCap: 640,       // .spaceMaxScaleCap
    massPrisms: 6,               // .massPrisms
    massPrismCap: 240,           // .massPrismCap
    chargePetals: 1,             // .chargePetals
    chargeCap: 30,               // .chargeCap
    stealCooldown: 1,            // .stealCooldown (s)
    // lab: the world and the loop rule
    labFlow: 40,                 // lab: how fast the world (and its motes) flows down the board, u/s. The hull is always flying.
    labSnap: 0,                  // lab proposal: a loop also closes when the head passes this close to its own tail (u). 0 = shipped (crossing only)
    // lab proposal: SLING - the thumb is a hand on a rope
    // KiteNavigatorConfig.asset's sling* fields since the Sling graduated (2026-10-20); slMaxSpeed 520 -> 364 there ("70% of current")
    slRope: 42, slStiff: 260, slDamp: 5, slDrag: 0.35, slFreeDrag: 0.9, slMaxSpeed: 364,
    // lab proposal: PLANT - touch plants an anchor in the world (the Thresher's plant)
    plMin: 22, plMax: 50, plHook: 6, plReelIn: 180, plSpin: 240, plMaxSpeed: 420, plSteer: 0.35, plReel: 0, plFling: 1.15, plDrag: 0.8,
    // lab proposal: HOOK - flick to throw, a hooked flick throws loop-de-loops
    hkGain: 2.2, hkMinFlick: 120, hkMaxSpeed: 560, hkHookFull: 1.2, hkSpin: 6.5, hkLoopShare: 0.75, hkDrag: 0.7, hkBrake: 5,
    // lab proposal: WELL - the thumb is a gravity well
    wlGM: 3200000, wlSoft: 22, wlCirc: 1.5, wlDrag: 0.35, wlMaxSpeed: 520,
  };

  // ================= (2) SPEC: one row per slider =================
  const SPEC = [
    ['Board', 'labFlow', 0, 120, 1, 'World flow (u/s)', 'Lab. How fast motes stream down the board. The hull always flies, so the game never sits at 0; 0 is a practice board.'],
    ['Board', 'labSnap', 0, 40, 1, 'Snap-shut distance (u)', 'Proposal. A loop also closes when the head passes this close to its own tail. 0 is the game (the tail must be crossed).'],
    ['Board', 'tailLength', 0.8, 8, 0.1, 'Tail length (board radii)', 'Shipped 4.8 (2.4 in round 4b, doubled 2026-10-20). Longer: bigger loops fit.'],
    ['Board', 'moteCount', 6, 60, 1, 'Motes on the board', 'Shipped 26.'],
    ['Board', 'moteCluster', 1, 10, 1, 'Cluster size', 'Average motes per one-element cluster. Shipped 4.'],
    ['Board', 'moteSpread', 6, 40, 1, 'Cluster spread (u)', 'Shipped 18. The Crew lab measured this as a balance knob as strong as the exponent.'],
    ['Board', 'growth', 1, 3, 0.1, 'Growth per mote', 'Shipped 2: each extra mote in a loop doubles the effect.'],
    ['Board', 'mixedLoops', 0, 1, 1, 'Mixed loops (0 fizzle, 1 majority)', 'Shipped 0: a loop round two elements fizzles.'],
    ['Follow', 'kiteSpeed', 100, 600, 10, 'Kite top speed (u/s)', 'Shipped 320.'],
    ['Follow', 'kiteAccel', 2, 30, 0.5, 'Kite acceleration (1/s)', 'Shipped 12.'],
    ['Follow', 'thumbOffsetMillimetres', 0, 40, 1, 'Aim above the thumb (mm)', 'Shipped 21 on touch, 0 for a mouse.'],
    ['Sling', 'slRope', 15, 120, 1, 'Rope length (u)', 'How far the kite rides from your thumb. Longer: bigger, slower orbits from the same small circles.'],
    ['Sling', 'slStiff', 60, 600, 10, 'Rope stiffness (1/s²)', 'How hard a stretched rope pulls. Low: a bungee. High: a chain.'],
    ['Sling', 'slDamp', 0, 20, 0.5, 'Rope damping (1/s)', 'Bleeds the bounce out of a stretched rope.'],
    ['Sling', 'slDrag', 0, 2, 0.05, 'Drag on the rope (1/s)', 'Speed lost per second while you hold. Low: a whirl keeps going on its own.'],
    ['Sling', 'slFreeDrag', 0, 4, 0.05, 'Drag after letting go (1/s)', 'Lift your thumb and the kite flies free; this is how fast it stops.'],
    ['Sling', 'slMaxSpeed', 200, 800, 10, 'Top speed (u/s)', 'Speed cap.'],
    ['Plant', 'plMin', 8, 60, 1, 'Shortest anchor rope (u)', 'An anchor planted nearer than this pushes the orbit out to it.'],
    ['Plant', 'plMax', 20, 160, 1, 'Longest anchor rope (u)', 'Plant farther than this and the rope yanks the kite in to this length.'],
    ['Plant', 'plHook', 0, 30, 0.5, 'Hook-on rate (1/s)', 'How fast the kite\'s heading swings onto the orbit when you plant, keeping its speed (the Thresher hooks on at once). Low: it skids round wide first.'],
    ['Plant', 'plReelIn', 0, 600, 10, 'Reel to reach (u/s)', 'Plant farther than the longest rope and the rope reels the kite in to it this fast while it swings.'],
    ['Plant', 'plSpin', 0, 800, 10, 'Spin-up (u/s²)', 'The Thresher\'s "faster every lap": how fast the swing speeds up while you hold.'],
    ['Plant', 'plMaxSpeed', 150, 700, 10, 'Top swing speed (u/s)', 'Where the spin-up stops.'],
    ['Plant', 'plSteer', 0, 1, 0.05, 'Anchor steer', 'Slide your thumb while planted and the anchor moves this fraction as far. The Thresher\'s pivot steer is under half of free flight.'],
    ['Plant', 'plReel', 0, 60, 1, 'Reel in (u/s)', 'While held, the rope shortens this fast to the shortest rope, and the swing speeds up as it does.'],
    ['Plant', 'plFling', 0.5, 2, 0.05, 'Fling boost (x)', 'Lift your thumb and the kite leaves along its swing at this multiple of its speed.'],
    ['Plant', 'plDrag', 0, 4, 0.05, 'Drag in flight (1/s)', 'After the fling, how fast the kite slows.'],
    ['Hook', 'hkGain', 0.5, 5, 0.1, 'Flick gain', 'Kite launch speed per unit of thumb speed.'],
    ['Hook', 'hkMinFlick', 20, 400, 10, 'Smallest flick (u/s)', 'A thumb slower than this is a touch, not a throw: it only brakes.'],
    ['Hook', 'hkMaxSpeed', 200, 900, 10, 'Top throw speed (u/s)', 'Speed cap.'],
    ['Hook', 'hkHookFull', 0.3, 3, 0.05, 'Full hook (rad)', 'How far your flick must bend for full loops. Smaller: a slight curl is enough.'],
    ['Hook', 'hkSpin', 2, 14, 0.1, 'Loop rate (rad/s)', 'How fast the thrown kite turns its loops. Faster: tighter loops.'],
    ['Hook', 'hkLoopShare', 0, 1, 0.05, 'Loop share', 'At full hook, how much of the throw goes into looping instead of travelling.'],
    ['Hook', 'hkDrag', 0, 3, 0.05, 'Drag (1/s)', 'How fast a throw dies.'],
    ['Hook', 'hkBrake', 0, 20, 0.5, 'Touch brake (1/s)', 'Holding a thumb down slows the kite this fast: touch to catch it.'],
    ['Well', 'wlGM', 500000, 8000000, 100000, 'Pull strength', 'The well\'s gravity. An orbit 60 u out runs at sqrt(pull / 60) u/s.'],
    ['Well', 'wlSoft', 4, 60, 1, 'Softening (u)', 'Rounds off the pull near the centre. Larger: orbits precess into rosettes.'],
    ['Well', 'wlCirc', 0, 8, 0.1, 'Settle into orbit (1/s)', 'Damps the kite climbing away from the well (never its fall), so a flyby is caught and settles into a round orbit. 0: pure gravity (flybys and long ellipses).'],
    ['Well', 'wlDrag', 0, 2, 0.05, 'Drag (1/s)', 'Speed lost per second.'],
    ['Well', 'wlMaxSpeed', 200, 800, 10, 'Top speed (u/s)', 'Speed cap.'],
  ];
  // SPEC rows not on a slider: the effect numbers read by the games (kept for the shipped-vs-yours diff and the verifier)
  for (const k of ['kiteRadius', 'moteSize', 'spaceMaxScale', 'spaceMaxScaleCap', 'massPrisms', 'massPrismCap', 'chargePetals', 'chargeCap', 'stealCooldown', 'boardRadius']) void k;

  const LS = 'lab:wrasse-lasso:';
  const lsGet = (k, d) => { try { const v = localStorage.getItem(LS + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) { /* private window */ } };
  const P = Object.assign({}, SHIPPED, lsGet('P', {}));
  for (const k of Object.keys(P)) if (!(k in SHIPPED)) delete P[k];

  // ================= constants of the shipped core (KiteNavigatorCore.cs) =================
  const TAIL_STEP = 2.5, COAST_RATE = 4, APPROACH_GAIN = 7, RIM = 0.96, SKIP_NEWEST = 3;
  const BLAST_SECONDS = 3;          // AOEExplosion.prefab: 3 s sin ease (KiteNavigatorCore.BlastRadius)
  const SNAP_MIN_ARC = 90;          // lab: a snap-shut loop must be at least this long (u)
  const REF_MM_PER_U = 0.18;        // lab: a 160 u board radius drawn 29 mm on a phone held upright (the scorecard's thumb)
  const DT = 1 / 60;
  const ELEMS = ['Charge', 'Mass', 'Space', 'Time'];        // the HUD's order, index = Element - 1
  const ECOL = ['#7fb8ff', '#f2b45a', '#c08cff', '#5fe0d4']; // lab colours (a debug aid; the game draws its four lime shades, LIME_E)
  const LIME_E = ['#ffff00', '#a1c417', '#00ff00', '#c0fb93']; // GENERATED by Tools/Build/kite_mote_colors.py: the game's four lime shades, index = Element - 1
  const CH = 0, MA = 1, SP = 2, TI = 3;

  const SCHEMES = [
    { id: 'follow', name: 'Follow', tag: 'shipped', how: 'The shipped control. The kite flies to a point 21 mm above your thumb. To lasso, draw the circle yourself.' },
    { id: 'sling', name: 'Sling', tag: 'tether', how: 'Your thumb holds an invisible rope. Drag and the kite trails behind; make small circles and it whirls round in big ones. Lead it like a lasso over your head. Lift to let go.' },
    { id: 'plant', name: 'Plant', tag: 'anchor', how: 'Touch to plant an anchor where your thumb is. The kite swings round it, faster every lap, and the anchor drifts with the world. Lift to fling the kite off along its swing, then plant again.' },
    { id: 'hook', name: 'Hook', tag: 'flick', how: 'Flick to throw the kite. A straight flick darts; a hooked flick (curl the end of the swipe) throws it in travelling loop-de-loops. Touch to catch it.' },
    { id: 'well', name: 'Well', tag: 'gravity', how: 'Your thumb is a gravity well. Hold near the kite and it falls into orbit round your thumb. Lift to let it coast.' },
  ];
  const DRILLS = [
    { id: 'free', name: 'Free lasso', el: '', secs: 0, how: 'No clock. Loop motes of one element; each extra mote doubles the effect.' },

    { id: 'breaker', name: 'Breaker (Space destruction)', el: 'Space', secs: 60, how: 'Rival prisms stream down. Your head pops what it touches; a Space loop of n motes fires a blast 60 x 2^(n-1) across.' },
    { id: 'bloom', name: 'Bloom (Mass creation)', el: 'Mass', secs: 60, how: 'Every Mass loop of n motes lays 6 x 2^(n-1) of your prisms. Build as much as you can.' },
    { id: 'joust', name: 'Joust (Charge dogfight)', el: 'Charge', secs: 60, how: 'A Charge loop of n motes banks 2^(n-1) petals. Ram the rival hull to steal them all. It dodges a charged kite.' },
  ];
  const LEVELS = ['Easy', 'Medium', 'Hard'];
  const RIVAL_SPEED = [45, 80, 120];   // lab: the Joust rival's wander speed by level (u/s)

  const OPT = Object.assign({ scheme: 'sling', drill: 'free', pilot: 'you', level: 1, colours: true, tether: false, haptics: true, trace: false }, lsGet('opt', {}));

  // ================= (3) THE MODEL =================

  let w = null, seed = 7;

  function newWorld(s, scheme, drill, pilot, level) {

      t: 0, seed: s >>> 0, scheme, drill, pilot, level, rngW: mulberry32(s * 2654435761 >>> 0), rngA: mulberry32((s ^ 0x9e3779b9) >>> 0),
      kite: { x: 0, y: -0.15 * P.boardRadius, vx: 0, vy: 0 }, tail: [], motes: [], prisms: [], blasts: [], fx: [], nextId: 1,
      rope: { on: false, ax: 0, ay: 0, rest: 0, pax: 0, pay: 0, plantX: 0, plantY: 0, fx0: 0, fy0: 0 },
      hook: { pts: [], dx: 0, dy: 0, sx: 0, sy: 0, om: 0 },
      finger: { x: 0, y: 0, down: false, px: 0, py: 0 }, prevDown: false,
      st: { loops: 0, fizzles: 0, empty: 0, motes: 0, value: 0, best: 0, travel: 0, boosts: 0, mass: 0, popped: 0, blasted: 0, stolen: 0 },
      charge: 0, rival: null, target: null, cleared: 0, penalty: 0, done: false, score: 0,
      ai: { thinkT: 0, goal: null, jx: 0, jy: 0, down: false, upT: -9, downT: 0, loops0: 0, stroke: null, launchT: -9, sense: 1, loopsAtLaunch: 0 },
    };
    const R = P.boardRadius;
    if (drill === 'joust') W.rival = { x: 0, y: 0.5 * R, vx: 0, vy: 0, tx: 0, ty: 0.5 * R, retarget: 0, lastSteal: -9, flash: 0 };

  function reset(s) { if (s != null) seed = s >>> 0; newWorld(seed, OPT.scheme, OPT.drill, OPT.pilot, OPT.level); hideResult(); }

  const inDisc = (x, y, f) => x * x + y * y <= (P.boardRadius * (f || 1)) ** 2;

    const cx = (r() * 2 - 1) * R * 0.8, cy = anywhere ? (r() * 2 - 1) * R * 0.85 : R * (0.95 + r() * 0.45);
    const out = [];

  }
  function spawnTarget(W) {

  }

  // ---- the shipped tail (KiteNavigatorCore.AdvanceTail), plus the lab's optional snap-shut ----

  function pushFx(W, f) { if (W.headless) return; f.t0 = W.t; W.fx.push(f); if (W.fx.length > 24) W.fx.shift(); }

  // ---- the five thumb-to-kite mappings ----
  function capSpeed(k, max) { const s = hyp(k.vx, k.vy); if (s > max) { k.vx *= max / s; k.vy *= max / s; } }

  // A flick: read the last quarter second of the stroke. Its chord sets the throw, the bend between its first and last

  // ---- one world step ----
  function simStepW(W, inp, dt) {

  function runsPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="note">Your own finished games on this device, newest first. Thumb travel uses this screen\'s size.</p><div class="tablewrap"><table id="runsTable"></table></div>';
    queueMicrotask(refreshRuns);
    return box;
  }
  function refreshRuns() {
    const t = document.getElementById('runsTable'); if (!t) return;
    t.replaceChildren();
    const hr = document.createElement('tr'); for (const h of ['When', 'Control', 'Game', 'Score', 'Loops', 'Fizzles', 'Thumb mm/loop']) { const th = document.createElement('th'); th.textContent = h; hr.appendChild(th); } t.appendChild(hr);
    if (!runs.length) { const tr = document.createElement('tr'), td = document.createElement('td'); td.colSpan = 7; td.textContent = 'No games yet. Pick a game other than Free lasso and play to the end.'; tr.appendChild(td); t.appendChild(tr); return; }
    for (const r of runs) {
      const tr = document.createElement('tr');
      for (const v of [new Date(r.when).toLocaleTimeString(), (SCHEMES.find((s) => s.id === r.scheme) || {}).name, (DRILLS.find((d) => d.id === r.drill) || {}).name, r.score, r.loops, r.fizzles, r.mmPerLoop == null ? '' : r.mmPerLoop]) { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); }
      t.appendChild(tr);
    }
  }

  // the decision log: shared in the artifact's db, readable by Claude; this browser otherwise
  let db = null, me = '', remote = [], localLog = lsGet('log', []);
  function snapshot() { return { round: LAB.round, seed, scheme: OPT.scheme, drill: OPT.drill, changed: diffOnly() }; }
  async function record(topic, choice, note) {
    const doc = { topic, choice, note: note || '', createdAt: Date.now(), by: me, settings: snapshot() };
    if (db) { try { await db.collection('decisions').add(doc); return 'shared'; } catch (e) { /* fall through */ } }
    localLog.push(doc); lsSet('log', localLog); return 'local';
  }
  const TOPICS = ['Which control goes to Unity', 'Sling feel', 'Plant feel', 'Hook feel', 'Well feel', 'Snap-shut loops', 'Something else'];
  function currentChoice(topic) {
    const sc = SCHEMES.find((s) => s.id === OPT.scheme).name, d = diffOnly(), set = Object.keys(d).length ? ' Settings: ' + JSON.stringify(d) : ' Lab defaults.';
    if (topic === 'Which control goes to Unity') return sc + ' is the one.' + set;
    if (topic === 'Snap-shut loops') return 'Snap-shut at ' + P.labSnap + ' u: keep / drop.';
    return sc + ': right / too loose / too stiff.' + set;
  }
  function logPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="note" id="logStatus"></p><p><select id="logTopic" aria-label="Topic"></select></p><textarea id="logChoice" rows="3" aria-label="Your decision"></textarea><p><button class="btn primary" id="logSave">Record decision</button> <button class="btn" id="logCopy">Copy log</button></p><div class="tablewrap"><table id="logTable"></table></div>';
    const status = box.querySelector('#logStatus'), sel = box.querySelector('#logTopic'), ta = box.querySelector('#logChoice');
    for (const t of TOPICS) { const o = document.createElement('option'); o.textContent = t; sel.appendChild(o); }
    sel.onchange = () => { ta.value = currentChoice(sel.value); }; ta.value = currentChoice(TOPICS[0]);
    status.textContent = db ? 'Shared log: saved with the lab, read by Claude at the start of the next round.' : 'Kept in this browser. Copy the log to send it.';
    status.className = 'note ' + (db ? 'status-ok' : 'status-warn');
    box.querySelector('#logSave').onclick = async () => { const where = await record(sel.value, ta.value); status.textContent = where === 'shared' ? 'Recorded in the shared log.' : 'Recorded in this browser.'; renderLog(box); };
    box.querySelector('#logCopy').onclick = () => {
      const txt = remote.concat(localLog).map((d) => new Date(d.createdAt).toISOString() + ' · ' + d.topic + ': ' + d.choice + ' ' + JSON.stringify(d.settings)).join('\n');
      try { navigator.clipboard.writeText(txt).then(() => { status.textContent = 'Copied.'; }, () => { ta.value = txt; ta.select(); }); } catch (e) { ta.value = txt; ta.select(); }
    };
    renderLog(box);
    return box;
  }
  function renderLog(box) {
    const t = (box || document).querySelector('#logTable'); if (!t) return;
    const rows = remote.concat(localLog).sort((a, b) => b.createdAt - a.createdAt).slice(0, 50);
    t.replaceChildren(); const hr = document.createElement('tr'); for (const h of ['When', 'Topic', 'Decision']) { const th = document.createElement('th'); th.textContent = h; hr.appendChild(th); } t.appendChild(hr);
    for (const d of rows) { const tr = document.createElement('tr'); for (const v of [new Date(d.createdAt).toLocaleString(), d.topic, d.choice]) { const td = document.createElement('td'); td.textContent = v; td.style.whiteSpace = 'normal'; tr.appendChild(td); } t.appendChild(tr); }
  }
  (async function connect() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try { db = await c.use('db'); } catch (e) { db = null; }
    try { const u = await c.use('user'); if (u) me = (await u.id()) || ''; } catch (e) { me = ''; }
    if (!db) return;
    if (curBottom === 'Decisions') showBottom('Decisions');
    try { db.collection('decisions').orderBy('createdAt', 'desc').limit(300).onSnapshot((snap) => { remote = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderLog(); }, () => { db = null; }); } catch (e) { db = null; }
  })();
  function aboutPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p id="aboutHead"></p>' +
      '<p><b>The question.</b> On a phone the shipped kite follows the thumb, so every lasso is your thumb drawing a circle. Which control lets a small, well-timed thumb throw big lassos?</p>' +
      '<p><b>Shipped, unchanged:</b> the kite and its tail (KiteNavigatorCore: 2.5 u tail step, a crossing closes the loop, the tail trimmed to 2.4 board radii), the loop rule (one element fires base x 2^(n-1), a mixed loop fizzles), the motes (26 in clusters of about 4, spread 18 u) and every effect number. Follow is the shipped control line for line.</p>' +
      '<p><b>Four proposals.</b> Sling, Plant, Hook and Well change only how the thumb moves the kite. Every one of their numbers is this lab\'s and has no game field.</p>' +
      '<p><b>Not modelled:</b> the 3D world (motes and prisms live only on the board here, nothing above or below the plane), the pilot and the hull\'s turns (the board does not rotate; the world just flows down at a steady speed), the real AOEExplosion and Mass cluster (a ring and a counter), rival hulls that fight back, the HUD, network play, sound. The thumb travel figure in the scorecard assumes a board 57 mm across; your own runs use your screen. The AI pilots are lab heuristics written for each control, so a control\'s score is also a score of its pilot.</p>';
    box.querySelector('#aboutHead').textContent = LAB.name + ' · round ' + LAB.round + ' · ' + LAB.branch + ' · write-up ' + LAB.doc;
    return box;
  }
  const BOTTOM = { Scorecard: scorecardPanel, 'Your runs': runsPanel, Decisions: logPanel, About: aboutPanel };
  let curBottom = lsGet('bottom', 'Scorecard'); if (!BOTTOM[curBottom]) curBottom = 'Scorecard';
  function showBottom(name) { curBottom = name; lsSet('bottom', name); for (const b of $('bottomTabs').children) b.setAttribute('aria-selected', String(b.dataset.name === name)); $('bottomBody').replaceChildren(BOTTOM[name]()); }
  for (const n of Object.keys(BOTTOM)) { const b = document.createElement('button'); b.textContent = n; b.dataset.name = n; b.setAttribute('role', 'tab'); b.onclick = () => showBottom(n); $('bottomTabs').appendChild(b); }

  $('meta').textContent = 'round ' + LAB.round;
  let paused = false;
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
  $('restart').onclick = () => reset();
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); lsSet('P', {}); for (const k in outputs) outputs[k].inp.value = P[k]; reset(); refreshDiff(); };
  $('panelBtn').onclick = () => { document.body.classList.add('sheet'); paused = true; $('pause').textContent = 'Resume'; };
  $('sheetClose').onclick = () => { document.body.classList.remove('sheet'); paused = false; $('pause').textContent = 'Pause'; };

  // ================= sizing + fixed-step loop (manual clock for recorders) =================
  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const cw = Math.max(1, Math.round(r.width * dpr)), ch = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; } }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now(), acc = 0;
  function step(dt) { const inp = w.pilot === 'you' ? humanInput() : aiInput(w, dt); simStepW(w, inp, dt); }
  function frame(now) {
    const el = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) {
      resize();
      if (!paused) { acc += el; let n = 0; while (acc >= DT && n < 6) { step(DT); acc -= DT; n++; } if (n === 6) acc = 0; }
      render();
    }
    requestAnimationFrame(frame);
  }
  schemeChips(); fillSelects(); setHint(); showDock(DOCK.includes(curDock) ? curDock : 'Control'); showBottom(curBottom);
  reset(); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  // ================= the test surface =================
  window.__lab = window.__wrasseLasso = {
    LAB, SHIPPED, SPEC, P, PLATFORM, OPT, SCHEMES, DRILLS,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { dt = dt || DT; n = n || 1; for (let i = 0; i < n; i++) step(dt); resize(); render(); },
    reset, runBatch, runOne, selfTest, setParam, record,
    world: () => w,   // the live world, for a recorder or a debugging session (read it, never write it)
    // The sling's own step and the shipped tail over a scripted thumb, for Tools/Build/kite_navigator_lab/sling_parity.cjs,
    // which holds the shipped C# KiteNavigatorCore.Sling to these rows frame by frame.
    slingTrace(scn) {
      const saved = Object.assign({}, P), keep = w; Object.assign(P, scn.P || {});
      const W = newWorld(1, 'sling', 'free', 'idle', 1), rows = []; W.headless = true; w = keep;
      W.kite = { x: 0, y: 0, vx: 0, vy: 0 }; W.tail = [];
      for (const a of scn.aims) {
        stepKite(W, { x: a[0], y: a[1], down: !!a[2] }, scn.dt);
        const poly = advanceTail(W);
        rows.push({ x: W.kite.x, z: W.kite.y, vx: W.kite.vx, vz: W.kite.vy, tail: W.tail.length, loop: poly ? poly.length : 0 });
      }
      Object.assign(P, saved);
      return rows;
    },
    score: () => ({ scheme: w.scheme, drill: w.drill, score: drillScore(w), loops: w.st.loops, fizzles: w.st.fizzles, motes: w.st.motes, value: w.st.value, thumbU: +w.st.travel.toFixed(1), t: +w.t.toFixed(3) }),
    state: () => ({ t: w.t, seed, scheme: w.scheme, drill: w.drill, pilot: w.pilot, kite: Object.assign({}, w.kite), tail: w.tail.length, motes: w.motes.length, done: w.done }),
    use(scheme, drill, pilot) { if (scheme) OPT.scheme = scheme; if (drill) OPT.drill = drill; if (pilot) OPT.pilot = pilot; schemeChips(); fillSelects(); setHint(); reset(); },
  };
})();
</script>
