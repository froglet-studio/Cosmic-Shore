<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);

  // ================= (1) LAB meta + the shipped numbers =================
  const LAB = { name: 'Manta Trail Lab', branch: 'claude/manta-trail-speed-shape', round: 1, doc: 'Docs/Manta/POLISH.md' };
  const SHIPPED = {
    // --- the lay (Manta.prefab, VesselPrismController) ---
    baseX: 20,         // VesselPrismController.BaseScale.x
    baseY: 0.75,       // VesselPrismController.BaseScale.y
    baseZ: 5.5,        // VesselPrismController.BaseScale.z
    gap: 18,           // VesselPrismController.Gap (two rails)
    wavelength: 10,    // VesselPrismController.initialWavelength (m of travel per lay)
    minBlock: 1,       // VesselPrismController.minBlockScale (XScaler after Initialize)
    maxBlock: 4,       // VesselPrismController.maxBlockScale
    // --- flight (Manta.prefab VesselTransformer + MantaAnalogTurnBoostExecutor) ---
    throttleScaler: 180, // VesselTransformer.DefaultThrottleScaler
    throttleHigh: 0.9,   // AIPilot.defaultThrottleHigh (cruise stick)
    throttleLow: 0.2,    // AIPilot.defaultThrottleLow (crawl stick)
    boostMult: 4,        // VesselStatus.boostMultiplier (Soar at full trigger overlap)
    timeMult: 1,         // VesselTransformer.ThrottleScalerMultiplier (1.5 at Time 10)
    maxYaw: 60,          // MantaAnalogTurnBoostExecutor.maxYawDegPerSec
    spdEase: 1.5,        // lab: speed tracking rate (/s), stands in for VesselTransformer.StepTowardTarget
    fps: 60,             // lab: frame rate the lay loop runs at (UniTask.Delay ends on a frame)
    // --- ScoutTrailPrismScaler (ScoutTrailPrismConfig.asset), the environment sizing still live ---
    scMin: 20,         // ScoutTrailPrismScalerConfig.minRadius
    scMax: 100,        // ScoutTrailPrismScalerConfig.maxRadius
    scRate: 6000,      // ScoutTrailPrismScalerConfig.radiusGrowthRate / radiusShrinkRate
    scInterval: 0.05,  // ScoutTrailPrismScalerConfig.updateInterval
    scSmooth: 0.2,     // ScoutTrailPrismScalerConfig.scaleSmoothTime
    scLerp: 1.5,       // VesselPrismController.LerpXScalerAsync duration
    colliderWait: 1,   // VesselPrismController.defaultWaitTime (a prism joins the index after this)
    envCount: 500,     // lab: prisms scattered over the course (the Toybox cell stand-in)
    // --- proposals (no game field yet; prefix sh) ---
    shRailW: 11,       // proposal: one rail's width, m (XScaler 2, where today's scaler rests)
    shVRef: 162,       // proposal: speed at which a prism is the shipped 5.5 m x 0.75 m (cruise = 0.9 x 180)
    shZK: 1,           // proposal: Z grows as (speed / vRef)^k
    shZMin: 1.5,       // proposal: shortest prism, m
    shFill: 1,         // proposal: longest prism as a fraction of the lay spacing (1 = end to end)
    shFrameAware: 1,   // proposal: 1 = the spacing cap uses speed x frame time when that beats the wavelength
    shYMin: 0.3,       // proposal: thinnest prism, m
    shYMax: 4,         // proposal: tallest prism, m
    shYawY: 0.6,       // proposal: Yawstery height gain at full turn (x)
    shArc: 1,          // proposal: 1 = inside rail shortens, outside lengthens by the turn's geometry
    shThin: 0.25,      // proposal (Free curves): outside rail thins in Y by this at full turn
    shFreeZMax: 10,    // proposal (Free curves): Z at Soar speed, m
    shFreeV1: 600,     // proposal (Free curves): speed where Z reaches its max
    shFreeYLow: 4,     // proposal (Free curves): Y multiplier at a crawl
    shFreeVLow: 60,    // proposal (Free curves): below this speed Y grows
    shTopV: 1100,      // TrailSpeedShape.TopSpeed: the stretch is complete here
    shTopSp: 3,        // TrailSpeedShape.TopSpacingMultiplier: gap at Top Speed (x wavelength)
    shTopZ: 20,        // TrailSpeedShape.TopLength: Z at Top Speed, m
    shTopY: 0.4,       // TrailSpeedShape.TopHeightMultiplier: Y at Top Speed (x cruise)
    aiNoise: 0,        // lab: rookie steering noise (0 = skilled)
  };

  const SPEC = [
    ['Proposal', 'shRailW', 2, 30, 0.5, 'Rail width (m)', 'Uniform X for every proposed rule. Today a rail is 20 x XScaler / 2 - 9: 1 m at XScaler 1, 31 m at 4.'],
    ['Proposal', 'shVRef', 40, 400, 2, 'Reference speed (u/s)', 'The speed at which a prism keeps the shipped 5.5 x 0.75 profile.'],
    ['Proposal', 'shZK', 0.2, 2, 0.05, 'Z growth exponent', 'Volume kept: Z = 5.5 x (speed / reference)^k. 1 = Z in proportion to speed.'],
    ['Proposal', 'shZMin', 0.5, 5.5, 0.1, 'Shortest Z (m)', 'Floor on prism length at a crawl.'],
    ['Proposal', 'shFill', 0.5, 1.6, 0.05, 'Longest Z (x spacing)', 'Cap on length as a fraction of the gap to the next prism on that rail. Over 1 overlaps.'],
    ['Proposal', 'shFrameAware', 0, 1, 1, 'Frame-aware cap', '1: at Soar the lay is one per frame, so the spacing is speed x frame time, not the wavelength. The cap follows it.'],
    ['Proposal', 'shYMin', 0.1, 1.5, 0.05, 'Thinnest Y (m)', 'Floor on height at Soar.'],
    ['Proposal', 'shYMax', 0.75, 10, 0.25, 'Tallest Y (m)', 'Cap on height at a crawl or deep in a Yawstery.'],
    ['Proposal', 'shYawY', 0, 2, 0.05, 'Yawstery height gain', 'Extra height (x) at a full single-trigger turn. Volume kept trades it out of Z.'],
    ['Proposal', 'shArc', 0, 1, 0.05, 'Turn geometry', 'How much the inside rail shortens and the outside lengthens to meet their neighbours (1 = exactly the arc ratio).'],
    ['Free curves', 'shThin', 0, 0.8, 0.05, 'Outside thin', 'Free curves only: the outside rail loses this fraction of its height at full turn.'],
    ['Free curves', 'shFreeZMax', 5.5, 20, 0.5, 'Z at Soar (m)', 'Free curves only.'],
    ['Free curves', 'shFreeV1', 200, 1000, 10, 'Soar speed (u/s)', 'Free curves only: where Z reaches its max.'],
    ['Free curves', 'shFreeYLow', 1, 8, 0.25, 'Y at a crawl (x)', 'Free curves only.'],
    ['Free curves', 'shFreeVLow', 10, 160, 5, 'Crawl speed (u/s)', 'Free curves only: below this the prism grows taller.'],
    ['Free curves', 'shTopV', 600, 2000, 10, 'Top speed (u/s)', 'Free curves only: the stretch above Soar is complete here. Time 10 with both triggers is about 1080.'],
    ['Free curves', 'shTopSp', 1, 6, 0.1, 'Gap at top (x wavelength)', 'Free curves only: prisms go further apart above Soar, so production falls behind.'],
    ['Free curves', 'shTopZ', 5.5, 40, 0.5, 'Z at top (m)', 'Free curves only: still capped by Longest Z of the stretched gap.'],
    ['Free curves', 'shTopY', 0.05, 1, 0.05, 'Y at top (x)', 'Free curves only: thinning above Soar.'],
    ['Flight', 'throttleHigh', 0.2, 1, 0.05, 'Cruise stick', 'AIPilot.defaultThrottleHigh. Cruise = stick x 180.'],
    ['Flight', 'boostMult', 1, 6, 0.1, 'Soar multiplier', 'VesselStatus.boostMultiplier, applied at full trigger overlap.'],
    ['Flight', 'timeMult', 1, 1.5, 0.05, 'Time speed (x)', 'VesselTransformer.ThrottleScalerMultiplier: 1 at Time 0, 1.5 at Time 10.'],
    ['Flight', 'maxYaw', 20, 140, 1, 'Yaw at full trigger (deg/s)', 'MantaAnalogTurnBoostExecutor.maxYawDegPerSec.'],
    ['Flight', 'fps', 30, 144, 1, 'Frame rate', 'The lay loop waits on UniTask.Delay, which ends on a frame. At Soar that, not the wavelength, sets the spacing.'],
    ['Flight', 'aiNoise', 0, 1, 0.05, 'Rookie noise', 'Steering noise for the AI pilot. 0 = skilled.'],
    ['Today', 'scMin', 5, 100, 1, 'Probe min radius', 'ScoutTrailPrismConfig.minRadius'],
    ['Today', 'scMax', 20, 300, 1, 'Probe max radius', 'ScoutTrailPrismConfig.maxRadius'],
    ['Today', 'scRate', 50, 8000, 50, 'Radius rate (u/s)', 'ScoutTrailPrismConfig growth and shrink rate. 6000 at a 0.05 s tick slams end to end.'],
    ['Today', 'envCount', 0, 1500, 50, 'Cell prisms', 'Lab: prisms scattered over the course. Only the Today rule reads them.'],
  ];

  const LS_KEY = 'lab:' + LAB.name + ':P';
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private window */ } };
  const P = Object.assign({}, SHIPPED, lsGet(LS_KEY, {}));
  for (const k of Object.keys(P)) if (!(k in SHIPPED)) delete P[k];

  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  // ================= (3) THE MODEL =================
  // The trail RULES. Each returns one rail's prism {x, y, z} from what the lay knows at that moment.
  // ctx: speed, turn01 (|net trigger|), omega (rad/s, + = right), side (+1 right rail, -1 left), railD (rail centre offset),
  // spacing (expected gap to the next prism on this rail along the vessel path), xscaler (Today only).
  const RULES = {
    today:    { name: 'Today (scaler live)', note: 'Shipped: ScoutTrailPrismScaler sizes X from nearby prisms.' },
    plain:    { name: 'Scaler removed', note: 'Shipped prefab with the scaler deleted: XScaler stays 1, so a rail is 1 m wide.' },
    wide:     { name: 'Fixed width', note: 'The plain Squirrel-style trail the kit doc describes, at the proposed width.' },
    free:     { name: 'Free curves', note: 'Proposal: Z and Y each follow their own speed curve; the outside rail thins.' },
    conserve: { name: 'Volume kept', note: 'Proposal: X fixed, Z from speed, Y = volume / (X x Z), so slow is tall, fast is long and thin.' },
    overfill: { name: 'Planted: overfill', note: 'Negative control: every prism 1.6x the spacing long, at any speed. The overlap column must fail it.' },
  };
  const RULE_ORDER = ['today', 'plain', 'wide', 'free', 'conserve'];
  function arcFactor(c) {
    // Inside rail (on the turn's side) runs a tighter arc than the vessel, outside a wider one.
    if (Math.abs(c.omega) < 1e-3 || c.speed < 1) return 1;
    const R = c.speed / Math.abs(c.omega), inside = Math.sign(c.omega) === c.side;
    return clamp((R + (inside ? -1 : 1) * c.railD) / R, 0.2, 3);
  }
  function laySpacing(rule, speed) { return rule === 'free' ? P.wavelength * lerp(1, P.shTopSp, smooth(P.shFreeV1, P.shTopV, speed)) : P.wavelength; }
  function shapeFor(rule, c) {
    const railOf = (xs) => P.baseX * xs / 2 - P.gap / 2;
    if (rule === 'today') return { x: Math.max(0.5, railOf(c.xscaler)), y: P.baseY, z: P.baseZ };
    if (rule === 'plain') return { x: Math.max(0.5, railOf(P.minBlock)), y: P.baseY, z: P.baseZ };
    if (rule === 'wide') return { x: P.shRailW, y: P.baseY, z: P.baseZ };
    const f = lerp(1, arcFactor(c), P.shArc), cap = c.spacing * (rule === 'overfill' ? 1.6 : P.shFill) * f;
    if (rule === 'free') {
      const top = smooth(P.shFreeV1, P.shTopV, c.speed);
      let z = lerp(lerp(P.baseZ, P.shFreeZMax, smooth(P.shVRef, P.shFreeV1, c.speed)), P.shTopZ, top) * f;
      let y = P.baseY * lerp(1, P.shFreeYLow, 1 - smooth(P.shFreeVLow * 0.25, P.shFreeVLow, c.speed)) * lerp(1, P.shTopY, top) * (1 + P.shYawY * c.turn01);
      if (f > 1) y *= 1 - P.shThin * c.turn01;
      return { x: P.shRailW, y: clamp(y, P.shYMin, P.shYMax), z: Math.min(z, cap) };
    }
    // conserve / overfill: keep the cruise prism's volume
    if (rule === 'overfill') { const z = Math.max(P.shZMin, cap); return { x: P.shRailW, y: clamp(P.shRailW * P.baseY * P.baseZ / (P.shRailW * z), P.shYMin, P.shYMax), z }; }
    const v0 = P.shRailW * P.baseY * P.baseZ, yaw = 1 + P.shYawY * c.turn01;
    let z = P.baseZ * Math.pow(Math.max(c.speed, 1) / P.shVRef, P.shZK) / yaw;
    z = clamp(z * f, P.shZMin, Math.max(P.shZMin, cap));
    return { x: P.shRailW, y: clamp(v0 / (P.shRailW * z), P.shYMin, P.shYMax), z };
  }

  // The course: a Redline-style loop (Time race). Soar straights, two Yawstery hairpins, a slalom, a crawl chicane.
  const GATES = [
    { x: 0, z: 700, k: 'cruise', r: 70 }, { x: 0, z: 1700, k: 'soar', r: 70 }, { x: 0, z: 2600, k: 'soar', r: 70 }, { x: 0, z: 3400, k: 'cruise', r: 70 },
    { x: 155, z: 3555, k: 'hairpin', r: 80 }, { x: 310, z: 3300, k: 'cruise', r: 70 },
    { x: 150, z: 2700, k: 'slalom', r: 60 }, { x: 470, z: 2150, k: 'slalom', r: 60 }, { x: 150, z: 1600, k: 'slalom', r: 60 },
    { x: 310, z: 1100, k: 'crawl', r: 30 }, { x: 350, z: 1000, k: 'crawl', r: 30 }, { x: 310, z: 900, k: 'crawl', r: 30 }, { x: 350, z: 800, k: 'crawl', r: 30 },
    { x: 330, z: 350, k: 'cruise', r: 70 }, { x: 165, z: 190, k: 'hairpin', r: 80 }, { x: 0, z: 400, k: 'cruise', r: 70 },
  ];

  let world = null, seed = 1, ruleName = 'conserve', pilotMode = 'ai', paused = false;
  const human = { lt: 0, rt: 0, slow: false };
  function makeEnv(rnd) {
    const env = [];
    for (let i = 0; i < Math.round(P.envCount); i++) env.push({ x: -500 + rnd() * 1500, z: -200 + rnd() * 4100 });
    return env;
  }
  function reset(s, opts) {
    if (s != null) seed = s >>> 0;
    opts = opts || {};
    const rnd = mulberry32(seed), envRnd = mulberry32(seed * 7919 + 13);
    world = {
      t: 0, x: 0, z: 0, h: 0, speed: 0, omega: 0, turn01: 0, overlap: 0, gate: 0, laps: 0, rnd,
      noise: 0, layTimer: 2, gateT: 0, missed: 0, // startDelay 2 s on Manta.prefab
      rule: opts.rule || ruleName, env: opts.noEnv ? [] : makeEnv(envRnd),
      rails: { '-1': [], '1': [] }, lays: [], pairs: [],
      sc: { timer: 0, radius: 150, target: 0.5, cur: 0.5, vel: 0, xscaler: P.minBlock },
      input: { lt: 0, rt: 0, throttle: P.throttleHigh },
    };
  }
  function anyWithin(px, pz, r) {
    const r2 = r * r, w = world;
    for (const e of w.env) { const dx = e.x - px, dz = e.z - pz; if (dx * dx + dz * dz <= r2) return true; }
    for (const side of ['-1', '1']) {
      const L = w.rails[side];
      for (let i = L.length - 1; i >= 0 && i >= L.length - 200; i--) {
        const p = L[i]; if (w.t - p.t < P.colliderWait) continue;   // collider still off
        const dx = p.x - px, dz = p.z - pz; if (dx * dx + dz * dz <= r2) return true;
      }
    }
    return false;
  }
  function smoothDamp(cur, target, s, st, dt) {
    st = Math.max(1e-4, st); const om = 2 / st, x = om * dt, ex = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
    const ch = cur - target, temp = (s.vel + om * ch) * dt; s.vel = (s.vel - om * temp) * ex;
    let out = target + (ch + temp) * ex;
    if ((target - cur > 0) === (out > target)) { out = target; s.vel = (out - target) / dt; }
    return out;
  }
  function stepScout(dt) {
    // ScoutTrailPrismScaler.Update + VesselPrismController.SetNormalizedXScale. The stack of 1.5 s lerps it starts
    // (one per call) is approximated as one approach with a 1.5 s time constant: the newest lerp writes last each frame.
    const sc = world.sc; sc.timer += dt;
    if (sc.timer >= P.scInterval) {
      sc.timer = 0;
      const hit = anyWithin(world.x, world.z, sc.radius), step = P.scRate * P.scInterval;
      sc.radius = hit ? Math.max(P.scMin, sc.radius - step) : Math.min(P.scMax, sc.radius + step);

    box.querySelector('#logChoice').value = RULES[ruleName].name + (Object.keys(diffOnly()).length ? ' with ' + JSON.stringify(diffOnly()) : ' at the lab numbers');
    box.querySelector('#logSave').onclick = async () => { const where = await record(box.querySelector('#logTopic').value || 'General', box.querySelector('#logChoice').value); status.textContent = where === 'shared' ? 'Recorded in the shared log.' : 'Recorded in this browser.'; renderLog(box); };
    box.querySelector('#logCopy').onclick = () => { const t = remote.concat(localLog).map((d) => new Date(d.createdAt).toISOString() + ' · ' + d.topic + ': ' + d.choice + ' ' + JSON.stringify(d.settings)).join('\n'); try { navigator.clipboard.writeText(t).catch(() => {}); } catch (e) { /* clipboard refused */ } };
    renderLog(box);
    return box;
  }
  function renderLog(box) {
    const t = (box || document).querySelector('#logTable'); if (!t) return;
    const rows = remote.concat(localLog).sort((a, b) => b.createdAt - a.createdAt).slice(0, 50);
    t.innerHTML = '<tr><th>When</th><th>Topic</th><th>Decision</th></tr>';
    for (const d of rows) { const tr = document.createElement('tr'); for (const v of [new Date(d.createdAt).toLocaleString(), d.topic, d.choice]) { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); } t.appendChild(tr); }
  }
  (async function connect() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try { db = await c.use('db'); } catch (e) { db = null; }
    try { const u = await c.use('user'); if (u) me = (await u.id()) || ''; } catch (e) { me = ''; }
    if (!db) return;
    db.collection('decisions').orderBy('createdAt', 'desc').limit(300).onSnapshot((snap) => { remote = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderLog(); }, () => { db = null; });
  })();

  function scorecardPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p><button class="btn primary" id="runBatch">Score every rule</button> <button class="btn" id="runRookie">Score with a rookie</button> <span class="hint" id="scoreHint">AI pilot, seeds 1-3, 110 s (two laps) each, every flight run twice (with and without cell prisms). Bold red = a hard fail.</span></p><div class="tablewrap"><table id="scoreTable"></table></div>';
    const go = (rookie) => {
      box.querySelector('#scoreHint').textContent = 'Scoring...';
      setTimeout(() => {
        const t0 = performance.now(), rows = runBatch(rookie ? { rookie: 0.6 } : {}), t = box.querySelector('#scoreTable');
        t.innerHTML = '';
        const hd = document.createElement('tr'); hd.innerHTML = '<th>Rule</th>' + CHECKS.map((c) => '<th></th>').join('') + '<th>Passes</th>';
        CHECKS.forEach((c, i) => { hd.children[i + 1].textContent = c[1]; hd.children[i + 1].title = c[4]; });
        t.appendChild(hd);
        for (const r of rows) {
          const tr = document.createElement('tr'), td0 = document.createElement('td'); td0.textContent = r.name; td0.title = RULES[r.rule].note; tr.appendChild(td0);
          for (const c of CHECKS) { const td = document.createElement('td'), v = r[c[0]], ok = c[2](v); td.textContent = (+v).toFixed(c[0] === 'envDelta' || c[0] === 'overlapMax' ? 2 : 2); td.className = ok ? 'pass' : (c[3] ? 'fail' : 'info'); td.title = c[4]; tr.appendChild(td); }
          const tp = document.createElement('td'); tp.textContent = r.passes + ' / ' + CHECKS.length + (r.hardFail.length ? '  NO' : ''); tp.className = r.hardFail.length ? 'fail' : 'pass'; tr.appendChild(tp);
          t.appendChild(tr);
        }
        box.querySelector('#scoreHint').textContent = (rookie ? 'Rookie pilot (noise 0.6). ' : 'Skilled pilot. ') + 'Scored in ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s. Green passes, red is a hard fail, plain is a soft miss.';
      }, 20);
    };
    box.querySelector('#runBatch').onclick = () => go(false);
    box.querySelector('#runRookie').onclick = () => go(true);
    return box;
  }
  function aboutPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p id="aboutHead"></p>' +
      '<p>The question: what shape should the Manta\'s trail prisms take from speed and turning alone? X uniform, Z stretching with speed, Y growing at a crawl or in a Yawstery, the inside rail shortening and the outside lengthening to meet their neighbours. Today the width still comes from nearby prisms (ScoutTrailPrismScaler).</p>' +
      '<h3>What this lab does not model</h3><ul>' +
      '<li>The course is a stand-in for Redline, not the shipped track. Only the Time game is here; the Space, Mass and Charge games are not built for this round.</li>' +
      '<li>Flight is flat (no pitch, no roll, no Soar ramp curve); speed eases at a fixed rate and Yawstery is the analog trigger turn only (no touch pivot).</li>' +
      '<li>Prisms are drawn as flat rectangles from above and in a side view: no lighting, materials, shields, pooling, the 0.5 scale floor or the pool\'s scale window.</li>' +
      '<li>The scaler\'s stack of overlapping 1.5 s lerps is approximated as one approach with a 1.5 s time constant.</li>' +
      '<li>Nothing here measures frame time, colliders or how a prism\'s new shape changes what it is worth to other vessels.</li></ul>';
    box.querySelector('#aboutHead').textContent = LAB.name + ' · round ' + LAB.round + ' · ' + LAB.branch + ' · write-up: ' + LAB.doc;
    return box;
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Scorecard', build: scorecardPanel }, { name: 'Decisions', build: logPanel }, { name: 'About', build: aboutPanel }], 'lab:' + LAB.name + ':bottom');

  $('title').textContent = LAB.name; $('meta').textContent = 'Manta Polish round ' + LAB.round;
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
  $('restart').onclick = () => reset();
  $('pilotBtn').onclick = () => { pilotMode = pilotMode === 'ai' ? 'human' : 'ai'; $('pilotBtn').textContent = 'Pilot: ' + (pilotMode === 'ai' ? 'AI' : 'You'); $('touch').hidden = !(pilotMode === 'human' && PLATFORM.device === 'phone'); };
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); lsSet(LS_KEY, {}); for (const k in outputs) outputs[k].inp.value = P[k]; reset(); refreshDiff(); };
  const keyMap = { KeyA: 'lt', ArrowLeft: 'lt', KeyD: 'rt', ArrowRight: 'rt' };
  addEventListener('keydown', (e) => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return; if (keyMap[e.code]) human[keyMap[e.code]] = 1; if (e.code === 'Space') { human.lt = human.rt = 1; e.preventDefault(); } if (e.code === 'KeyS' || e.code === 'ArrowDown') human.slow = true; });
  addEventListener('keyup', (e) => { if (keyMap[e.code]) human[keyMap[e.code]] = 0; if (e.code === 'Space') human.lt = human.rt = 0; if (e.code === 'KeyS' || e.code === 'ArrowDown') human.slow = false; });
  const hold = (id, on, off) => { const b = $(id); b.addEventListener('pointerdown', (e) => { e.preventDefault(); on(); }); for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, off); };
  hold('tL', () => { human.lt = 1; }, () => { human.lt = 0; });
  hold('tR', () => { human.rt = 1; }, () => { human.rt = 0; });
  hold('tSlow', () => { human.slow = true; }, () => { human.slow = false; });

  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now(), acc = 0;
  function frame(now) {
    const real = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) {
      resize();
      if (!paused) { const dt = 1 / P.fps; acc += real; let n = 0; while (acc >= dt && n < 8) { simStep(dt); acc -= dt; n++; } if (n === 8) acc = 0; }
      render();
    }
    requestAnimationFrame(frame);
  }
  reset(); resize();
  for (let i = 0; i < Math.round(8 * P.fps); i++) simStep(1 / P.fps);   // open mid-flight with a trail already laid
  refreshDiff(); render(); requestAnimationFrame(frame);

  window.__lab = {
    LAB, SHIPPED, SPEC, P, PLATFORM, RULES, GATES, CHECKS,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { dt = dt || 1 / P.fps; n = n || 1; for (let i = 0; i < n; i++) simStep(dt); resize(); render(); },
    reset, score, runBatch, setParam, record, shapeFor,
    setRule(r) { if (RULES[r]) { ruleName = r; reset(); } return ruleName; },
    state: () => ({ t: world.t, seed, rule: world.rule, speed: world.speed, lays: world.lays.length, gate: world.gate, laps: world.laps, missed: world.missed }),
  };
})();
</script>
