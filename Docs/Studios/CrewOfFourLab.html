<!doctype html>
<!--
  CREW OF FOUR LAB - a /labmaker browser studio (round 4: a 4-seat vessel; the gunners' turrets are gyro-stabilized on outriggers).
  One hull, four seats, always four crew (AI in any empty seat): a two-thumb HELM with a forward-open danger-prism
  shield and a boost, and three GUNNER seats, each a first-person turret whose release button launches a fast
  fly-by-wire missile the gunner then flies with one thumb. A missile explodes on contact or after 5 s into a large
  sphere, collects elemental crystals (petals) and omni crystals (more missiles), and is spent from the hull's magazine.
  The lab is about FEEL (Garrett, 2026-10-20: "we are trying to get the vessel to have the right feel"), first drawn
  from Wildgate (Moonshot Games, 2025). Rounds 1 (2D) and 2 (3D) are CrewOfFourLab.round1.html / .round2.html.
  Four element games (Time race, Space destruction, Mass creation, Charge dogfight) at I1-I4, Easy/Medium/Hard rivals.
  Source of truth: this file. Write-up: Docs/Studios/CREW_OF_FOUR_LAB.md. Verify:
    node .claude/skills/labmaker/verify_lab.cjs Docs/Studios/CrewOfFourLab.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crew of Four Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Layout: an editor - stage (the arena under the seat's camera) + right dock (presets, dials) + bottom dock (scorecard, decisions). */
  :root {
    --bg: #edf1f3; --panel: #fbfcfd; --ink: #13202a; --muted: #576976; --line: #d3dce2;
    --accent: #0a8a84; --accent-ink: #ffffff; --warn: #a65208; --ok: #1d7543; --changed: #0a6fd0;
    --stage: #050b10; --chip: #e2e9ed;
    --f-display: 'Saira Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
    --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a1117; --panel: #0f1920; --ink: #e2ecf1; --muted: #8aa0ad; --line: #1f2f3a;
      --accent: #13fff2; --accent-ink: #04211f; --warn: #f0a050; --ok: #5cd08e; --changed: #7cc0ff;
      --stage: #03080c; --chip: #18262f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a1117; --panel: #0f1920; --ink: #e2ecf1; --muted: #8aa0ad; --line: #1f2f3a;
    --accent: #13fff2; --accent-ink: #04211f; --warn: #f0a050; --ok: #5cd08e; --changed: #7cc0ff;
    --stage: #03080c; --chip: #18262f; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--f-body); overflow: hidden; }
  #app { display: grid; height: 100%; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr) 230px; grid-template-areas: "head head" "stage dock" "bottom dock"; }
  header { grid-area: head; display: flex; gap: 6px 10px; align-items: center; padding: 6px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font: 700 19px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  #diff { color: var(--changed); font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-right: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 3px 8px; font: 600 12px var(--f-body); cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .lbl { font: 600 10px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px; }
  #stageWrap { grid-area: stage; position: relative; min-height: 0; background: var(--stage); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { touch-action: none; }
  #toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(6,16,22,.88); color: #e8fffd; border: 1px solid #13fff2; border-radius: 6px; padding: 4px 12px; font: 12px var(--f-mono); pointer-events: none; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
  #actBtns { position: absolute; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; }
  #actBtns button { font: 700 14px var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 9px 14px; border-radius: 8px; border: 1px solid #13fff2; background: rgba(4,30,32,.8); color: #d9fffd; cursor: pointer; touch-action: none; }
  #actBtns button.on { background: #13fff2; color: #04211f; }
  #dock { grid-area: dock; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px 14px 16px; }
  #bottom { grid-area: bottom; border-top: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 6px 16px 10px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .tabs button, .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 3px 9px; cursor: pointer; font: 600 12px var(--f-body); }
  .tabs button[aria-selected="true"], .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--changed); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 64px; gap: 2px 8px; margin: 7px 0; }
  .row label { display: flex; gap: 6px; align-items: baseline; }
  .row label .key { color: var(--muted); font: 11px var(--f-mono); }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; }
  .row output { text-align: right; font: 12px var(--f-mono); }
  .row output.changed { color: var(--changed); text-decoration: underline; }
  .row .tip { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .row.bool { grid-template-columns: auto 1fr 64px; align-items: baseline; }
  .row.bool .tip { grid-column: 2 / -1; }
  .cards { display: grid; gap: 8px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; background: var(--panel); text-align: left; color: var(--ink); font: inherit; }
  .card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .card h3 { margin: 0 0 2px; font: 700 16px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
  .card p { margin: 2px 0; color: var(--muted); font-size: 12px; }
  .card .ctl { color: var(--warn); font: 600 10px var(--f-body); letter-spacing: .08em; text-transform: uppercase; }
  table { border-collapse: collapse; width: 100%; font: 12px var(--f-mono); }
  th, td { text-align: right; padding: 2px 7px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font: 600 11px var(--f-body); color: var(--muted); }
  .tblwrap { overflow-x: auto; }
  .best { font-weight: 700; color: var(--ok); }
  .hint { color: var(--muted); font-size: 12px; }
  .status-ok { color: var(--ok); } .status-warn { color: var(--warn); }
  textarea, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .prose { max-width: 70ch; }
  .prose h4 { font: 700 14px var(--f-display); letter-spacing: .05em; text-transform: uppercase; margin: 10px 0 2px; }
  .prose p, .prose li { margin: 3px 0; }
  .prose ul { padding-left: 18px; margin: 4px 0; }
  kbd { font: 11px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
  @media (max-width: 900px) {
    body { overflow: auto; }
    #app { display: block; height: auto; }
    header { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    #stageWrap { aspect-ratio: 4 / 5; max-height: 78vh; width: 100%; }
    #dock, #bottom { border: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">Crew of Four Lab</h1>
    <span class="meta" id="meta"></span>
    <span id="diff"></span>
    <span class="spacer"></span>
    <span class="lbl">Game</span><select id="gameSel" aria-label="Game"></select>
    <span class="seg" id="intSeg" aria-label="Intensity"></span>
    <span class="lbl">Rivals</span><select id="diffSel" aria-label="Rival difficulty"><option value="0">Easy</option><option value="1">Medium</option><option value="2" selected>Hard</option></select>
    <span class="lbl">Seat</span><span class="seg" id="seatSeg" aria-label="Your seat"></span>

    <button class="btn" id="restart">Restart</button>
    <button class="btn" id="pause">Pause</button>
    <button class="btn" id="resetAll" title="Put every dial back to the shipped / round-3 numbers">Shipped</button>
    <span class="meta" id="platform"></span>

  <div id="stageWrap"><canvas id="stage"></canvas><canvas id="overlay"></canvas><div id="toast" hidden></div><div id="actBtns"><button id="actA" hidden>Boost</button><button id="actB" hidden>Shield</button></div></div>
  <aside id="dock"><div class="tabs" id="dockTabs" role="tablist"></div><div id="dockBody"></div></aside>
  <section id="bottom"><div class="tabs" id="bottomTabs" role="tablist"></div><div id="bottomBody"></div></section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);

  // ================= (1) LAB meta + the shipped numbers =================
  // A READER of the shipped numbers: every constant names the asset / class field it was copied from.
  // "lab" marks a proposal with no game field yet (the four-seat hull does not exist in the game).
  const LAB = { name: 'Crew of Four Lab', branch: 'cece/happy-noether-m54hz6', round: 4, doc: 'Docs/Studios/CREW_OF_FOUR_LAB.md' };
  const SHIPPED = {
    // Helm flight: VesselTransformer (Sparrow.prefab) driven by DualStickMix (Assets/_Scripts/Controller/IO/DualStickMix.cs)
    minSpeed: 10,        // VesselTransformer.DefaultMinimumSpeed
    throttleScaler: 25,  // VesselTransformer.DefaultThrottleScaler; speed = min + scaler x XDiff x boost (XDiff 0.5 at rest)
    boostMul: 5,         // VesselStatus.boostMultiplier
    yawRate: 80,         // VesselTransformer.YawScaler (deg/s), turn = XSum x (speed x rotThrottle + YawScaler)
    pitchRate: 80,       // VesselTransformer.PitchScaler, YSum
    rollRate: 30,        // VesselTransformer.RollScaler, YDiff
    rotThrottle: 0.1,    // VesselTransformer.RotationThrottleScaler
    hullSpeedMul: 0.85,  // lab: the four-seat hull's share of that speed
    hullTurnMul: 0.55,   // lab: and of those turn rates
    hullRadius: 9,       // lab: hull contact radius (u)
    boostTank: 3,        // lab: seconds of boost the tank holds at Time 0
    boostRefill: 0.25,   // lab: tank seconds regained per second
    // Trail prisms: Sparrow VesselPrismController
    prismW: 2, prismL: 5,   // BaseScale.x / .z
    wavelength: 7,       // initialWavelength
    trailCap: 90,        // lab: trail prisms kept per hull at Mass 0 (+4 per Mass level)
    // The helm's shield: danger prisms around the hull, open forward. DangerHemisphereConfig.asset (AOEDangerHemisphereBlocks)
    shieldOn: 1,         // lab: 0 = the helm has no shield (a control)
    shieldBlocks: 144,   // numberOfRays 12 x blocksPerRay 12
    shieldMinR: 50,      // minRadius
    shieldMaxR: 70,      // maxRadius
    shieldOpenDeg: 45,   // lab: half-angle of the forward opening
    shieldTime: 4,       // lab: seconds it stands at Mass 0 (+ up to kMass)
    shieldCd: 9,         // lab: seconds between shields
    shieldAttached: 1,   // lab: 1 = it rides with the hull; 0 = it is dropped where the hull is
    dangerDebuff: 0.5,   // VesselElementalDebuffByDangerPrismEffectSO.debuffMagnitude (-0.5 on every element)
    dangerDebuffTime: 4, // debuffDuration (s)
    // Missiles: the gunners' fly-by-wire rounds
    missileSpeed: 180,   // lab (u/s at Charge 0)
    missileTurn: 150,    // lab (deg/s)
    missileLife: 5,      // Garrett 2026-10-20: "explode on contact or after 5 seconds"
    blastR: 30,          // AOEExplosion MaxScale 60 -> radius 30 u (x 1 + kSpace at Space 15)
    blastTime: 0.5,      // lab: the blast reaches full size in this time (AOEExplosion's own ExplosionDuration is 3 s)
    blastPetals: 2,      // lab: petals a blast takes from each rival hull it catches (scored hits)
    startMissiles: 6,    // lab: the magazine at spawn
    maxMissiles: 12,     // lab: the magazine's size
    omniMissiles: 3,     // lab: missiles an omni crystal adds (round 3: 2 left the magazine empty 70-80% of a match)
    turretTurn: 160,     // lab: turret slew (deg/s)
    turretStab: 1,       // lab (round 4): 1 = gyro-stabilized turrets: the aim is held in world space, so the hull's turns never swing a gunner's view
    mountOut: 1,         // lab (round 4): 1 = turrets on outriggers outside the hull (above, port, starboard) instead of on its skin
    mountSmooth: 0.35,   // lab (round 4): seconds for the outrigger frame to follow the hull's turns
    horizonSmooth: 3,    // lab (round 4): seconds for a stabilized turret view's horizon to drift back to the hull's up (it otherwise holds still)
    launchCd: 0.6,       // lab: a turret's reload after its missile ends (s)
    hullCollects: 1,     // lab: 1 = the hull collects crystals it flies through too (as every game vessel does)
    aiReserve: 1,        // lab: missiles AI gunners leave in the shared magazine for each human gunner aboard

    omniShare: 0.4,      // lab: share of crystal slots that hold omni crystals
    crystalRespawn: 6,   // lab (s)
    arenaR: 320,         // the game cell's radius (the Crew Vessel Lab's cellRadius); a sphere
    matchLen: 90,        // lab: Breach / Anchorage / Broadside (s)
    raceCap: 150,        // lab: a Ring Race ends here (s)
    startLevel: 3,       // lab: each hull's level in every element (ElementalBarsConfigSO levels -5..15)
    kTime: 0.6, kSpace: 0.8, kMass: 0.8, kCharge: 0.6,   // lab: an element's effect at level 15 is 1 + k
    // Cameras: SparrowCameraSettingsSO (followOffset 0, 10, -50; followSmoothTime 0.2)
    camBack: 50, camUp: 10, camSmooth: 0.2,
    camFov: 60,          // lab: the asset has no FOV
    turretFov: 75,       // lab: the first-person turret camera
    missileCamBack: 14,  // lab: the camera behind a flown missile
    missileCamUp: 3,
  };

  // ================= (2) SPEC: one row per dial =================
  const SPEC = [
    ['Helm', 'hullSpeedMul', 0.4, 1.5, 0.05, 'Hull speed (x Sparrow)', 'Share of the Sparrow\'s speed: 10 + 25 x throttle u/s, x5 boost.'],

    ['Helm', 'throttleScaler', 5, 80, 1, 'Throttle scaler (u/s)', 'Sparrow DefaultThrottleScaler.'],

    ['Helm', 'yawRate', 20, 200, 5, 'Yaw scaler (deg/s)', 'Sparrow YawScaler.'],
    ['Helm', 'pitchRate', 20, 200, 5, 'Pitch scaler (deg/s)', 'Sparrow PitchScaler.'],
    ['Helm', 'rollRate', 0, 200, 5, 'Roll scaler (deg/s)', 'Sparrow RollScaler.'],
    ['Helm', 'rotThrottle', 0, 0.5, 0.01, 'Turn gain per u/s', 'Sparrow RotationThrottleScaler: faster turns at speed.'],
    ['Shield', 'shieldOn', 0, 1, 1, 'The helm has a shield', 'Off: the No shield control.'],
    ['Shield', 'shieldAttached', 0, 1, 1, 'Shield rides with the hull', 'On: it moves with you. Off: it is dropped where you are and you fly out of its opening.'],
    ['Shield', 'shieldBlocks', 12, 300, 4, 'Danger prisms', 'DangerHemisphereConfig: 12 rays x 12 blocks.'],
    ['Shield', 'shieldMinR', 10, 90, 1, 'Inner radius (u)', 'DangerHemisphereConfig minRadius. Below the blast radius + hull, a blast on the shell still reaches you.'],
    ['Shield', 'shieldMaxR', 10, 120, 1, 'Outer radius (u)', 'DangerHemisphereConfig maxRadius.'],
    ['Shield', 'shieldOpenDeg', 0, 120, 5, 'Forward opening (deg)', 'Half-angle of the gap left open ahead of the hull.'],

    ['Shield', 'shieldCd', 0, 30, 0.5, 'Cooldown (s)', 'From the moment it goes up.'],
    ['Shield', 'dangerDebuff', 0, 2, 0.1, 'Danger debuff (levels)', 'VesselElementalDebuffByDangerPrismEffectSO: a hull that touches a danger prism loses this on every element for a while.'],
    ['Shield', 'dangerDebuffTime', 0, 10, 0.5, 'Debuff time (s)', 'debuffDuration.'],
    ['Missile', 'missileSpeed', 40, 400, 5, 'Speed (u/s)', 'At Charge 0; Charge adds up to 1 + kCharge.'],
    ['Missile', 'missileTurn', 30, 400, 5, 'Turn rate (deg/s)', 'How hard one thumb can bend it.'],
    ['Missile', 'missileLife', 1, 12, 0.5, 'Fuse (s)', 'It explodes when this runs out.'],
    ['Missile', 'blastR', 5, 80, 1, 'Blast radius (u)', 'AOEExplosion MaxScale 60 -> 30 u, at Space 0.'],
    ['Missile', 'blastTime', 0.1, 3, 0.05, 'Blast growth (s)', 'Time to full size. AOEExplosion uses 3 s.'],
    ['Missile', 'blastPetals', 0, 6, 1, 'Petals per hull caught', 'Each rival hull a blast catches loses this many petals (scored hits).'],
    ['Missile', 'turretTurn', 30, 400, 5, 'Turret slew (deg/s)', 'How fast a turret swings (the AI\'s, and your keyboard / stick aim).'],
    ['Missile', 'turretStab', 0, 1, 1, 'Stabilized turrets', 'On: the aim holds still in the world while the hull turns under it, and the view\'s horizon follows the hull only slowly. Off: round 3\'s turrets, locked to the hull.'],
    ['Missile', 'mountOut', 0, 1, 1, 'Turrets on outriggers', 'On: the three turrets sit outside the hull (above, port, starboard), clear of its body. Off: on the hull\'s skin.'],
    ['Missile', 'mountSmooth', 0.02, 2, 0.01, 'Outrigger lag (s)', 'How long the outrigger frame takes to follow the hull\'s turns. Longer: the turrets swing wider through hard turns.'],
    ['Missile', 'horizonSmooth', 0.2, 10, 0.1, 'Turret horizon drift (s)', 'A stabilized turret view keeps its horizon still while the hull rolls and pitches, drifting back to the hull\'s up over this time.'],
    ['Missile', 'launchCd', 0, 5, 0.1, 'Reload (s)', 'After a turret\'s missile ends.'],
    ['Ammo', 'startMissiles', 0, 24, 1, 'Magazine at spawn', 'Shared by the three gunner seats.'],
    ['Ammo', 'maxMissiles', 1, 40, 1, 'Magazine size', ''],
    ['Ammo', 'omniMissiles', 0, 8, 1, 'Missiles per omni crystal', 'Omni crystals are how the magazine refills.'],
    ['Ammo', 'omniShare', 0, 1, 0.05, 'Omni share of crystals', 'The rest are elemental crystals (petals).'],

    ['Match', 'raceCap', 40, 400, 10, 'Ring Race limit (s)', ''],
    ['Match', 'startLevel', -5, 15, 1, 'Starting level, every element', 'ElementalBarsConfigSO levels run -5 to 15.'],
    ['Match', 'trailCap', 20, 300, 5, 'Trail prisms kept', 'At Mass 0; +4 per Mass level.'],
    ['Match', 'wavelength', 3, 20, 1, 'Prism every (u)', 'Sparrow initialWavelength.'],
    ['Match', 'prismW', 1, 6, 0.5, 'Prism width (u)', 'Sparrow BaseScale.x.'],
    ['Match', 'prismL', 2, 12, 0.5, 'Prism length (u)', 'Sparrow BaseScale.z.'],
    ['Elements', 'kTime', 0, 2, 0.05, 'Time: speed at 15 (+x)', 'Hull speed and boost refill.'],
    ['Elements', 'kSpace', 0, 2, 0.05, 'Space: blast at 15 (+x)', 'Blast radius.'],

    ['Camera', 'camUp', -10, 60, 1, 'Helm cam: above (u)', 'followOffset.y (10).'],
    ['Camera', 'camSmooth', 0.02, 1.5, 0.01, 'Helm cam smoothing (s)', 'followSmoothTime (0.2).'],

    ['Camera', 'missileCamUp', -5, 20, 0.5, 'Missile cam: above (u)', ''],

    tick(dt, n) { dt = dt || STEP; n = n || 1; for (let i = 0; i < n; i++) simStep(dt); resize(); render(); },
    reset, score, runBatch, runOne, setParam, record, applyPreset, takeSeat, toggleCam, get camKind() { return CAM.kind; },
    setGame(g, i, d) { if (g != null) G.game = g; if (i != null) G.intensity = i; if (d != null) G.diff = d; fillHeader(); restart(); },
    state: () => { const w = world; return { t: w.t, seed, over: w.over, winner: w.winner, missiles: w.missiles.length, prisms: w.prisms.filter((p) => !p.dead).length, crews: w.crews.map((c) => ({ dom: DOMS[c.dom].name, lv: c.lv.slice(), mag: c.mag, score: c.score, ring: c.ringIdx, shield: +c.shield.t.toFixed(2), human: c.members.map((m) => m.human), turrets: [1, 2, 3].map((s) => !!c.turrets[s].missile), hull: { f: c.hull.f, v: +c.hull.v.toFixed(1) } })) }; },
    humanIn, world: () => world,
    // the pure functions Tools/Build/orca_crew_lab/parity.cjs holds the shipped C# OrcaCrewCore to
    parity: { turnBody, followFrame, rotateToward, steerToward, holdHorizon, shieldDirs, flyMissile },
  };
})();
