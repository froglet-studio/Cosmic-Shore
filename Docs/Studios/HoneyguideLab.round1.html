<!doctype html>
<!--
  Honeyguide Lab - a /labmaker browser studio for the Honeyguide and Ratel, the two-seat crew vessel that carries
  Slipstream (Garrett's 2019-22 tabletop game). The Ratel (Engineer seat) plays a hex pattern-building puzzle, the
  Dynamo; activating a pattern pulls one muton into the battery, and that muton's domain becomes a slip charge for the
  Honeyguide (Pilot seat). Touching a trail of a held domain teleports the hull to the end of that trail it points at.
  Source of truth: this file. Write-up: Docs/Studios/HONEYGUIDE_LAB.md. The script block id="dynamo-core" is the
  engine-free core; Tools/Build/dynamo_lab/parity.cjs reads it from this file and holds it to the shipped C#
  (Assets/_Scripts/Controller/Vessel/Crew/DynamoCore.cs). Verify: node .claude/skills/labmaker/verify_lab.cjs <this file>
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Honeyguide Lab</title>
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --ink: #172028; --muted: #59646f; --line: #d8dee4;
    --accent: #b97a00; --warn: #b4560b; --ok: #1f7a43; --changed: #0b7f99;
    --f-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1216; --panel: #141b21; --ink: #e4eaef; --muted: #93a0ab; --line: #26313a;
      --accent: #ffb21f; --warn: #f0a050; --ok: #5cc98a; --changed: #6cc8e0; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1216; --panel: #141b21; --ink: #e4eaef; --muted: #93a0ab; --line: #26313a;
    --accent: #ffb21f; --warn: #f0a050; --ok: #5cc98a; --changed: #6cc8e0; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--f-ui); overflow: hidden; }
  #app { display: grid; height: 100%; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr) 220px; grid-template-areas: "head head" "stage dock" "bottom dock"; }
  header { grid-area: head; display: flex; gap: 8px 10px; align-items: center; padding: 7px max(16px, env(safe-area-inset-right, 0px)) 7px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; }
  header .meta { color: var(--muted); }
  header .spacer { flex: 1; }
  #diff { color: var(--changed); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-right: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 4px 10px; font: inherit; cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #111; }
  #stageWrap { grid-area: stage; position: relative; min-height: 0; background: #04070a; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage { width: 100%; height: 100%; display: block; }
  #toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: rgba(10,20,26,.92); color: #fff6e0; border: 1px solid #ffa700; border-radius: 6px; padding: 5px 12px; font: 12px var(--f-mono); pointer-events: none; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
  #dock { grid-area: dock; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px 16px 16px; }
  #bottom { grid-area: bottom; border-top: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px 16px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .tabs button, .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  .tabs button[aria-selected="true"], .btn.primary { background: var(--accent); color: #111; border-color: var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 64px; gap: 2px 8px; margin: 8px 0; }
  .row label { display: flex; gap: 6px; align-items: baseline; }
  .row label .key { color: var(--muted); font: 11px var(--f-mono); }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  .row output.changed { color: var(--changed); text-decoration: underline; }
  .row .tip { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .field { display: grid; gap: 4px; margin: 10px 0; }
  .field > span { color: var(--muted); font-size: 12px; }
  .check { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-weight: 600; font-size: 12px; cursor: help; }
  .tablewrap { overflow-x: auto; }
  .best { font-weight: 700; color: var(--ok); }
  .hint { color: var(--muted); font-size: 12px; }
  .status-ok { color: var(--ok); } .status-warn { color: var(--warn); }
  textarea, select, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  ul.plain { margin: 4px 0; padding-left: 18px; }
  ul.plain li { margin: 2px 0; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin: 6px 0; }
  .card b { display: block; }
  .card .fam { font: 11px var(--f-mono); }
  @media (max-width: 900px) {
    body { overflow: auto; }
    #app { display: block; height: auto; }
    #stageWrap { height: 86vh; height: var(--stageH, 86svh); min-height: 520px; }
    header { gap: 6px; padding-top: 5px; padding-bottom: 5px; }
    header h1 { font-size: 14px; }
    header .btn, .seg button { padding: 3px 8px; }
    #dock, #bottom { border: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    header .meta#platform { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title"></h1>
    <span class="meta" id="meta"></span>
    <span id="diff"></span>
    <span class="spacer"></span>
    <span class="seg" id="seatSeg" role="group" aria-label="Your seat">
      <button data-you="eng" title="You play the Ratel (the Engineer's Dynamo); an AI flies">Engineer</button><button data-you="fly" title="You fly the Honeyguide; an AI plays the Dynamo">Fly</button><button data-you="watch" title="Two AIs">Watch</button><button data-you="couch" title="Two people: keyboard flies, mouse or touch plays the Dynamo">Couch</button>
    </span>
    <button class="btn" id="swapBtn" title="Swap seats with your squad mate (D-pad left/right, 1 / 2, or double-tap the small view)">Swap</button>
    <span class="meta" id="platform"></span>
    <button class="btn" id="pause">Pause</button>
    <button class="btn" id="restart">Restart</button>
    <button class="btn" id="resetAll">Shipped</button>
  </header>
  <div id="stageWrap"><canvas id="stage"></canvas><div id="toast" hidden></div></div>
  <aside id="dock"><div class="tabs" id="dockTabs" role="tablist"></div><div id="dockBody"></div></aside>
  <section id="bottom"><div class="tabs" id="bottomTabs" role="tablist"></div><div id="bottomBody"></div></section>
</div>
<script id="dynamo-core">
/* DynamoCore - the Ratel's hex puzzle (the Engineer seat of the Honeyguide), engine-free.
 * Inputs are seat inputs and a clock; nothing here draws, reads a device or knows about hulls. The game's
 * Assets/_Scripts/Controller/Vessel/Crew/DynamoCore.cs is this file ported line for line, and
 * Tools/Build/dynamo_lab/parity.cjs holds the two to each other input by input. Change both, or the gate fails.
 * Colours: 0 empty, 1 Mass, 2 Charge, 3 Space-Time (which DOMAIN a colour is, is the lab's table, not the core's).
 * Grid: a radius-3 hexagon of 37 pointy-top cells in axial (q, r), r running DOWN, (0,0) the centre. */
(function (root) {
  'use strict';
  const RADIUS = 3;
  const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];   // E NE NW W SW SE
  const Q = [], R = [], LUT = new Array(49).fill(-1);
  for (let r = -RADIUS; r <= RADIUS; r++) for (let q = Math.max(-RADIUS, -r - RADIUS); q <= Math.min(RADIUS, -r + RADIUS); q++) { LUT[(q + 3) * 7 + (r + 3)] = Q.length; Q.push(q); R.push(r); }
  const N = Q.length;
  function idx(q, r) { if (q < -3 || q > 3 || r < -3 || r > 3) return -1; return LUT[(q + 3) * 7 + (r + 3)]; }
  const CENTRE = idx(0, 0);
  function ringOf(i) { return Math.max(Math.abs(Q[i]), Math.abs(R[i]), Math.abs(Q[i] + R[i])); }
  // Each ring clockwise on screen, from its top-left cell (0, -k): E, SE, SW, W, NW, NE legs of k steps.
  const RINGS = [[CENTRE]], RING_POS = new Array(N).fill(0);
  for (let k = 1; k <= RADIUS; k++) {
    const ring = []; let q = 0, r = -k;
    for (const d of [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]]) for (let s = 0; s < k; s++) { ring.push(idx(q, r)); q += d[0]; r += d[1]; }
    RINGS.push(ring);
  }
  for (let k = 1; k <= RADIUS; k++) RINGS[k].forEach((c, p) => { RING_POS[c] = p; });
  const NEIGH = [];
  for (let i = 0; i < N; i++) { const n = []; for (const d of DIRS) { const j = idx(Q[i] + d[0], R[i] + d[1]); if (j >= 0) n.push(j); } NEIGH.push(n); }
  function stepClockwise(i) { const k = ringOf(i); if (k === 0) return i; const ring = RINGS[k]; return ring[(RING_POS[i] + 1) % ring.length]; }
  function rot60(i) { return idx(-R[i], Q[i] + R[i]); }   // 60 degrees clockwise about the centre
  function isNeighbour(a, b) { return NEIGH[a].indexOf(b) >= 0; }

  // Pattern shapes: cells [[q, r, colour]] in the card's own orientation; offsets kept relative to cell 0.
  function shapes(cells, allowRotated) {
    const out = [];
    let cur = cells.map((c) => [c[0], c[1], c[2]]);
    for (let k = 0; k < (allowRotated ? 6 : 1); k++) {
      out.push(cur.map((c) => [c[0] - cur[0][0], c[1] - cur[0][1], c[2]]));
      cur = cur.map((c) => [-c[1], c[0] + c[1], c[2]]);
    }
    return out;
  }

  function rng(st) {   // mulberry32 over the state's own stream, so a replay of the same inputs draws the same cards
    let a = st.rng | 0; a = a + 0x6D2B79F5 | 0; st.rng = a;
    let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }

  function create(S, seed) {
    const st = {
      cells: new Array(N).fill(0), ports: S.ports.map((p) => [p[0], p[1]]), ap: S.apPerTick < S.apBank ? S.apPerTick : S.apBank, bonusAp: 0,
      clock: 0, ticks: 0, battery: [], slots: S.loadout.slice(), pick: null, freePlace: 0, offer: null,
      rng: seed | 0, wasted: 0, events: [], shapes: S.patterns.map((p) => shapes(p.cells, S.allowRotatedMatches)),
    };
    if (S.startFilled) for (const p of st.ports) st.cells[p[0]] = p[1];
    return st;
  }

  function portAt(st, cell) { for (const p of st.ports) if (p[0] === cell) return p[1]; return 0; }

  // The cells of the first placement of pattern `pid` that the board shows, or null. Placement order: rotation, then
  // the anchor cell in index order (deterministic, so both seats and both languages agree which copy fired).
  function match(st, S, pid) {
    const sh = st.shapes[pid];
    for (let k = 0; k < sh.length; k++) {
      const shape = sh[k];
      for (let a = 0; a < N; a++) {
        const cells = [];
        let ok = true;
        for (let c = 0; c < shape.length; c++) {
          const i = idx(Q[a] + shape[c][0], R[a] + shape[c][1]);
          if (i < 0) { ok = false; break; }
          if (st.cells[i] === shape[c][2] || (S.centreWild && i === CENTRE)) cells.push(i);
          else { ok = false; break; }
        }
        if (ok) return cells;
      }
    }
    return null;
  }

  function spendAp(st, n) {
    if (st.ap + st.bonusAp < n) return false;
    const fromAp = st.ap < n ? st.ap : n;
    st.ap -= fromAp; st.bonusAp -= n - fromAp;
    return true;
  }

  function charge(st, S, colour) {
    if (S.batteryCap < 1) return;
    if (st.battery.length >= S.batteryCap) { const old = st.battery.shift(); st.events.push({ k: 'replaced', colour: old }); }
    st.battery.push(colour);
    st.events.push({ k: 'charge', colour });
  }

  function pickCell(st, S, cell, auto) {
    const pk = st.pick, pat = S.patterns[pk.pid];
    const colour = st.cells[cell];
    st.cells[cell] = 0;
    st.pick = null;
    st.events.push({ k: 'pick', slot: pk.slot, pid: pk.pid, cell, colour, auto });
    charge(st, S, colour);
    if (pat.effect === 'bigred') {   // destroy every other muton of the picked colour
      let n = 0;
      for (let i = 0; i < N; i++) if (st.cells[i] === colour) { st.cells[i] = 0; n++; }
      st.events.push({ k: 'destroyed', colour, n });
    } else if (pat.effect === 'amanita') {   // burn one more muton of the pattern
      for (const c of pk.cells) if (c !== cell && st.cells[c] !== 0) { st.events.push({ k: 'burned', cell: c, colour: st.cells[c] }); st.cells[c] = 0; break; }
    }
  }

  // One seat input. Returns true when it was legal and applied; an illegal input changes nothing.
  function apply(st, S, inp) {
    switch (inp.k) {
      case 'tinker': {
        if (st.pick || inp.from < 0 || inp.from >= N || inp.to < 0 || inp.to >= N) return false;
        if (st.cells[inp.from] === 0 || st.cells[inp.to] !== 0 || !isNeighbour(inp.from, inp.to)) return false;
        if (!spendAp(st, 1)) return false;
        st.cells[inp.to] = st.cells[inp.from]; st.cells[inp.from] = 0;
        st.events.push({ k: 'tinker', from: inp.from, to: inp.to });
        return true;
      }
      case 'refuel': {
        if (st.pick || inp.cell < 0 || inp.cell >= N || st.cells[inp.cell] !== 0) return false;
        if (st.freePlace > 0 && inp.colour >= 1 && inp.colour <= 3) {   // a 5D Printer placement: any empty cell, any colour
          st.freePlace--; st.cells[inp.cell] = inp.colour;
          st.events.push({ k: 'place', cell: inp.cell, colour: inp.colour });
          return true;
        }
        const pc = portAt(st, inp.cell);
        if (pc === 0 || !spendAp(st, 1)) return false;
        st.cells[inp.cell] = pc;
        st.events.push({ k: 'refuel', cell: inp.cell, colour: pc });
        return true;
      }
      case 'activate': {
        if (st.pick || inp.slot < 0 || inp.slot >= st.slots.length || st.slots[inp.slot] < 0) return false;
        const pid = st.slots[inp.slot], cells = match(st, S, pid);
        if (!cells || st.ap + st.bonusAp < 1) return false;
        spendAp(st, 1);
        const pat = S.patterns[pid];
        st.events.push({ k: 'ability', slot: inp.slot, pid, effect: pat.effect });
        if (pat.effect === 'chrono') st.bonusAp = st.bonusAp + 1 > S.bonusApCap ? S.bonusApCap : st.bonusAp + 1;
        else if (pat.effect === 'printer') st.freePlace += 2;
        else if (pat.effect === 'anode') { charge(st, S, 1); charge(st, S, 2); charge(st, S, 3); }
        const live = cells.filter((c) => st.cells[c] !== 0);
        if (live.length) st.pick = { slot: inp.slot, pid, cells: live, timer: S.pickTimeout };
        return true;
      }
      case 'pick': {
        if (!st.pick || st.pick.cells.indexOf(inp.cell) < 0 || st.cells[inp.cell] === 0) return false;
        pickCell(st, S, inp.cell, false);
        return true;
      }
      case 'research': {
        if (st.pick || st.offer || inp.family < 1 || inp.family > 3) return false;
        const cand = [];
        for (let p = 0; p < S.patterns.length; p++) if (S.patterns[p].family === inp.family && st.slots.indexOf(p) < 0) cand.push(p);
        if (!cand.length || !spendAp(st, S.researchCost)) return false;
        const offer = [];
        for (let k = 0; k < 3 && cand.length; k++) { const j = Math.floor(rng(st) * cand.length); offer.push(cand.splice(j, 1)[0]); }
        st.offer = offer;
        st.events.push({ k: 'offer', family: inp.family, offer: offer.slice() });
        return true;
      }
      case 'keep': {
        if (!st.offer || inp.choice < 0 || inp.choice >= st.offer.length || inp.slot < 0 || inp.slot >= st.slots.length) return false;
        st.slots[inp.slot] = st.offer[inp.choice];
        st.events.push({ k: 'keep', slot: inp.slot, pid: st.offer[inp.choice] });
        st.offer = null;
        return true;
      }
      case 'discard': {
        if (!st.offer) return false;
        st.offer = null;
        return true;
      }
    }
    return false;
  }

  // The battery is shared with the pilot: a slip spends one charge of its colour.
  function spend(st, colour) { const i = st.battery.indexOf(colour); if (i < 0) return false; st.battery.splice(i, 1); return true; }
  function drainAll(st) { const n = st.battery.length; st.battery.length = 0; return n; }

  function tick(st, S) {
    if (S.rotateWholeEngine) {
      const next = new Array(N).fill(0);
      for (let i = 0; i < N; i++) next[rot60(i)] = st.cells[i];
      st.cells = next;
      for (const p of st.ports) p[0] = rot60(p[0]);
      if (st.pick) st.pick.cells = st.pick.cells.map(rot60);
    } else {
      for (const p of st.ports) p[0] = stepClockwise(p[0]);
    }
    const before = st.ap, cap = S.apBank;
    st.ap = before + S.apPerTick > cap ? (before > cap ? before : cap) : before + S.apPerTick;
    st.wasted += before + S.apPerTick - st.ap;
    st.ticks++;
    st.events.push({ k: 'tick', n: st.ticks });
  }

  // The clock: seconds of match time (the lab scales it by the hull's Time level before it gets here).
  function advance(st, S, dt) {
    if (st.pick) {
      st.pick.timer -= dt;
      if (st.pick.timer <= 0) {
        const fam = S.patterns[st.pick.pid].family;
        let cell = st.pick.cells[0];
        for (const c of st.pick.cells) if (st.cells[c] === fam) { cell = c; break; }
        pickCell(st, S, cell, true);
      }
    }
    st.clock += dt;
    while (st.clock >= S.tickSeconds) { st.clock -= S.tickSeconds; tick(st, S); }
  }

  function nextPorts(st, S) { return st.ports.map((p) => [S.rotateWholeEngine ? rot60(p[0]) : stepClockwise(p[0]), p[1]]); }
  function built(st, S) { return st.slots.map((pid) => (pid >= 0 ? match(st, S, pid) : null)); }
  function clone(st) {
    return { cells: st.cells.slice(), ports: st.ports.map((p) => [p[0], p[1]]), ap: st.ap, bonusAp: st.bonusAp, clock: st.clock, ticks: st.ticks,
      battery: st.battery.slice(), slots: st.slots.slice(), pick: st.pick ? { slot: st.pick.slot, pid: st.pick.pid, cells: st.pick.cells.slice(), timer: st.pick.timer } : null,
      freePlace: st.freePlace, offer: st.offer ? st.offer.slice() : null, rng: st.rng, wasted: st.wasted, events: [], shapes: st.shapes };
  }
  // A compact, exact digest of everything the parity gate compares.
  function digest(st) {
    return st.cells.join('') + '|' + st.ports.map((p) => p[0] + ':' + p[1]).join(',') + '|' + st.ap + '+' + st.bonusAp + '|' + st.battery.join('') +
      '|' + st.slots.join(',') + '|' + (st.pick ? st.pick.slot + ':' + st.pick.cells.join('.') : '-') + '|' + st.freePlace + '|' + (st.offer ? st.offer.join('.') : '-') +
      '|' + st.ticks + '|' + st.wasted + '|' + (st.rng >>> 0);
  }


  // ---- The Engineer AI: input-only. It returns ONE input (or null) from the state it sees; the caller paces it. ----
  // colourScore[c] (c = 1..3) is how much the pilot can use a charge of colour c right now (the lab scores trails of that
  // colour's domain within slip reach and ahead of the hull). Difficulty changes belief and pace, never the rules.
  function placementCost(st, S, pid, k, a, locked) {
    const shape = st.shapes[pid][k], cells = [], need = [];
    for (let c = 0; c < shape.length; c++) {
      const i = idx(Q[a] + shape[c][0], R[a] + shape[c][1]);
      if (i < 0) return null;
      cells.push(i); need.push(shape[c][2]);
    }
    let total = 0;
    const fixes = [];
    for (let c = 0; c < cells.length; c++) {
      const i = cells[c], want = need[c];
      if (st.cells[i] === want || (S.centreWild && i === CENTRE)) continue;
      const fix = cellFix(st, i, want, cells, locked);
      if (!fix) return null;
      total += fix.cost; fixes.push(fix);
    }
    return { pid, cells, total, fixes };
  }
  // The cheapest way to put a muton of colour `want` on cell i, and that way's first input.
  function cellFix(st, i, want, inPlacement, locked) {
    let extra = 0, clear = null;
    if (st.cells[i] !== 0) {   // a wrong muton sits there: move it aside first
      extra = 1;
      for (const n of NEIGH[i]) if (st.cells[n] === 0 && inPlacement.indexOf(n) < 0) { clear = { k: 'tinker', from: i, to: n }; break; }
      if (!clear) for (const n of NEIGH[i]) if (st.cells[n] === 0) { clear = { k: 'tinker', from: i, to: n }; break; }
      if (!clear) return null;
    }
    // distance from i through empty cells (i itself counts as empty once cleared)

  const OPT_SHIPPED = { rotate: 'ports', patterns: 'fixed', arming: 'hold', exit: 'align', domainMap: 'mcs', engine: 'board2021', loadout: 'starter', eject: false, centreWild: false, slip: true };

    arming: { hold: 'Hold to arm: F, the arm pad or LT (lab candidate: round 1, Found 1)', always: 'Always armed when a matching charge is held (the brief\'s default)', aim: 'Aim-gated: slips only when a trail end is inside the nose cone (lab proposal)' },

  // ================= helpers =================

  // Difficulty changes belief and pace, never the stick or the rules (/vessel-ai).
  const PSKILL = {   // the Honeyguide's pilot AI

    medium: { think: 0.3, steerNoise: 0.15, sees: 240, minGain: 50, avoid: 0.7 },

    hard: { think: 0.45, top: 1, blunder: 0, noise: 5 },

  // ================= THE MODEL: the arena =================
  function dynamoSettings(cfg) {
    const o = cfg.opts;
    return {
      tickSeconds: cfg.P.tickSeconds, apPerTick: cfg.P.apPerTick, apBank: cfg.P.apBank, bonusApCap: cfg.P.bonusApCap, batteryCap: cfg.P.batteryCap,
      pickTimeout: cfg.P.pickTimeout, researchCost: cfg.P.researchCost, rotateWholeEngine: o.rotate === 'engine', allowRotatedMatches: o.patterns === 'rotatable',
      centreWild: !!o.centreWild, startFilled: true, ports: ENGINES[o.engine].ports, patterns: PATTERNS, loadout: LOADOUTS[o.loadout].cards.map(byName),

  }
  const OTHER_DOMAINS = ['ruby', 'gold', 'jade'];
  function makeHull(id, dom, x, z, h, honey) {
    return { id, dom, x, z, h, speed: 0, boostE: 0, slowT: 0, honey, trail: null, dist: 0, tokens: [], recolour: 0, recolourDom: null, ignoreTrail: -1, ignoreT: 0, roam: null, flash: 0 };
  }
  function makeWorld(seed, cfg) {
    const rng = mulberry32(seed), Pw = cfg.P;
    const w = {
      t: 0, seed, cfg, P: Pw, rng, rngAI: mulberry32(seed ^ 0x9e3779b9), rngE: mulberry32(seed ^ 0x51ed27), rngP: mulberry32(seed ^ 0x2545f491),
      hulls: [], trails: [], nextTrail: 1, S: dynamoSettings(cfg), dyn: null, dest: null,
      seats: { pilot: Object.assign({ think: 0, cmd: { steer: 0, boost: false, button: false, arm: false }, goal: null }, cfg.pilot), eng: Object.assign({ think: 0 }, cfg.eng) },
      swapT: 0, orientT: 0, effects: [], log: [],
      m: { dests: 0, slips: 0, slipDist: 0, slipGain: 0, badSlips: 0, aimed: 0, aimedGain: 0, patterns: 0, charges: 0, used: 0, saddled: 0, emptyT: 0, apGiven: 0, hits: 0, abilities: 0, swaps: 0, clipped: 0 },
    };
    w.dyn = D.create(w.S, seed);
    w.hulls.push(makeHull(0, OUR_DOMAIN, 0, 0, -Math.PI / 2, true));
    for (let i = 0; i < Pw.others; i++) {
      const a = rng() * Math.PI * 2, r = Pw.arenaRadius * (0.3 + 0.5 * rng());
      w.hulls.push(makeHull(i + 1, OTHER_DOMAINS[i % 3], Math.cos(a) * r, Math.sin(a) * r, rng() * Math.PI * 2, false));
    }
    // a head start: every other hull has already flown a while, so trails exist from the first second
    for (let k = 0; k < 360; k++) for (const hl of w.hulls) if (!hl.honey) { rivalStep(w, hl, 1 / 15); }
    w.dest = spawnDest(w);
    w.legStart = hypot2(w.dest.x, w.dest.z);
    return w;
  }
  function spawnDest(w) {
    const h = w.hulls[0], R = w.P.arenaRadius - 40;
    for (let k = 0; k < 40; k++) {
      const a = w.rng() * Math.PI * 2, r = R * Math.sqrt(w.rng());
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (hypot2(x - h.x, z - h.z) >= w.P.destMin || k === 39) return { x, z, born: w.t };

  }
  function newTrail(w, hull, dom) { const t = { id: w.nextTrail++, owner: hull ? hull.id : -1, dom, pts: [], doms: [], born: [] }; w.trails.push(t); if (hull) hull.trail = t; return t; }
  function hullPrismCount(w, id) { let n = 0; for (const t of w.trails) if (t.owner === id) n += t.pts.length; return n; }
  function layPrism(w, hull) {
    if (!hull.trail) newTrail(w, hull, hull.dom);

    t.pts.push([hull.x - Math.cos(hull.h) * 4, 0, hull.z - Math.sin(hull.h) * 4]); t.doms.push(hull.dom); t.born.push(w.t);

  function moveHull(w, hull, steer, boost, dt) {
    const Pw = w.P;

    const boosting = boost && hull.boostE > 0;

  }
  // Teleport (the game's IVessel.SetPose: TeleportContinuity cuts the ribbon, so the hull starts a new trail)
  function setPose(w, hull, x, z, h) {
    const r = hypot2(x, z);
    if (r > w.P.arenaRadius) { x *= w.P.arenaRadius / r; z *= w.P.arenaRadius / r; }
    hull.x = x; hull.z = z; if (h != null) hull.h = h;
    hull.trail = null; hull.dist = 0;
  }
  function rivalStep(w, hl, dt) {
    if (!hl.roam || hypot2(hl.roam[0] - hl.x, hl.roam[1] - hl.z) < 30) { const a = w.rng() * Math.PI * 2, r = (w.P.arenaRadius - 30) * Math.sqrt(w.rng()); hl.roam = [Math.cos(a) * r, Math.sin(a) * r]; }
    const want = Math.atan2(hl.roam[1] - hl.z, hl.roam[0] - hl.x), err = wrapAng(want - hl.h);

  }

  // What colour a battery charge is, as a domain; which charges the hull holds.
  const domOf = (w, colour) => DOMAIN_MAPS[w.cfg.opts.domainMap].map[colour];
  function heldDomains(w) { const s = new Set(); for (const c of w.dyn.battery) s.add(domOf(w, c)); return s; }
  function colourFor(w, dom) { const m = DOMAIN_MAPS[w.cfg.opts.domainMap].map; for (let c = 1; c <= 3; c++) if (m[c] === dom) return c; return 0; }

  // The slip planner both AIs use: the best gain toward the destination from riding a trail of domain `dom`.
  function slipGain(w, hull, dom, sees) {
    const Pw = w.P, dest = w.dest, before = hypot2(dest.x - hull.x, dest.z - hull.z);
    let best = null;
    for (const t of w.trails) {
      if (t.pts.length < Pw.minSlipTrailLength || (t.id === hull.ignoreTrail && hull.ignoreT > 0)) continue;
      const pts = t.pts, step = Math.max(1, Math.floor(pts.length / 12));
      for (let i = 0; i < pts.length; i += step) {
        if (t.doms[i] !== dom) continue;
        const dx = pts[i][0] - hull.x, dz = pts[i][2] - hull.z, d = hypot2(dx, dz);
        if (d > sees || d < 8) continue;
        const fwd = [dx / d, 0, dz / d], land = D.slipDestination(pts, i, [pts[i][0], 0, pts[i][2]], fwd, Pw.slipReach, Pw.exitOffset);
        if (!land) continue;
        const gain = before - (d + hypot2(dest.x - land.point[0], dest.z - land.point[2]));

  }
  // The Engineer AI's read of the world: how useful a charge of each colour is to the pilot right now.
  function colourScores(w) {

    for (let c = 1; c <= 3; c++) {

  // ---- the Honeyguide's contacts: the Slip, recolouring, hostile prisms ----
  function contacts(w, hull, armed, dt) {
    const Pw = w.P, rr = Pw.hullRadius + Pw.prismL * 0.5, rr2 = rr * rr;
    if (hull.ignoreT > 0) hull.ignoreT -= dt;
    for (const t of w.trails) {
      const pts = t.pts;
      for (let i = 0; i < pts.length; i++) {
        const dx = pts[i][0] - hull.x, dz = pts[i][2] - hull.z;
        if (dx * dx + dz * dz > rr2) continue;
        if (t.owner === hull.id && w.t - t.born[i] < Pw.selfGrace) continue;   // SELF_TRAIL_CONTACT.md
        if (t.id === hull.ignoreTrail && hull.ignoreT > 0) continue;

          t.doms[i] = hull.recolourDom; hull.recolour--; w.effects.push({ k: 'ring', x: pts[i][0], z: pts[i][2], col: DOM[hull.recolourDom].color, t: 0.6 });

    if (!land) return;
    D.spend(w.dyn, colour);

    if (w.cfg.opts.eject) while (D.spend(w.dyn, colour)) ejected++;

  }

  // ---- pattern abilities, on the Dynamo's events ----
  function onDynamoEvent(w, e) {
    const hull = w.hulls[0], Pw = w.P;
    if (e.k === 'ability') {
      w.m.patterns++; w.m.abilities++;
      const eff = PATTERNS[e.pid].effect;
      w.effects.push({ k: 'banner', text: PATTERNS[e.pid].name, col: DOM[domOf(w, PATTERNS[e.pid].family)].color, t: 1.6 });
      if (eff === 'amanita') hull.boostE += 6 * Pw.boostPerPoint;
      else if (eff === 'thruster') for (let k = 0; k < 4; k++) hull.tokens.push({ k: 'dash', t: Pw.tokenLife });
      else if (eff === 'monte') for (let k = 0; k < 3; k++) hull.tokens.push({ k: 'swap', t: Pw.tokenLife });
      else if (eff === 'blink') { setPose(w, hull, hull.x + Math.cos(hull.h) * Pw.blinkDist, hull.z + Math.sin(hull.h) * Pw.blinkDist, null); w.effects.push({ k: 'ring', x: hull.x, z: hull.z, col: '#ffa700', t: 0.6 }); }
    } else if (e.k === 'charge') { w.m.charges++; }
    else if (e.k === 'destroyed') hull.boostE += 2 * e.n * Pw.boostPerPoint;
    else if (e.k === 'pick') {
      const eff = PATTERNS[e.pid].effect, dom = domOf(w, e.colour);

      else if (eff === 'detangler') { hull.recolour = Pw.detanglerCount; hull.recolourDom = dom; }

      } else if (eff === 'rosen') {

          const dx = t.pts[i][0] - hull.x, dz = t.pts[i][2] - hull.z, d = hypot2(dx, dz);

  // ---- the Honeyguide's pilot AI: input-only (steer, boost, button, arm) ----
  function pilotAI(w, seat, dt) {
    const hull = w.hulls[0], S = PSKILL[seat.skill], cmd = seat.cmd;
    seat.think -= dt;
    if (seat.think <= 0) {
      seat.think = S.think;
      let goal = { x: w.dest.x, z: w.dest.z, slip: false };
      if (w.cfg.opts.slip) {
        let best = null;
        for (const dom of heldDomains(w)) { const g = slipGain(w, hull, dom, S.sees); if (g && (!best || g.gain > best.gain)) best = g; }
        if (best && best.gain > S.minGain) goal = { x: best.x, z: best.z, slip: true };
      }
      seat.goal = goal;
      seat.noise = gauss(w.rngP) * S.steerNoise;
    }
    const goal = seat.goal || { x: w.dest.x, z: w.dest.z };
    let want = Math.atan2(goal.z - hull.z, goal.x - hull.x);
    // avoid a hostile prism straight ahead unless we are about to slip on it
    if (!goal.slip && w.rngP() < S.avoid) {
      const held = heldDomains(w);
      for (const t of w.trails) {
        if (t.owner === hull.id) continue;
        for (let i = 0; i < t.pts.length; i += 2) {
          // hostile prisms slow the hull; under always-armed, a held domain's trail is a slip it did not ask for
          const unwanted = held.has(t.doms[i]) ? (w.cfg.opts.slip && w.cfg.opts.arming !== 'hold' && t.pts.length >= w.P.minSlipTrailLength) : t.doms[i] !== hull.dom;
          if (!unwanted) continue;
          const dx = t.pts[i][0] - hull.x, dz = t.pts[i][2] - hull.z, d = hypot2(dx, dz);
          if (d > 30) continue;
          const rel = wrapAng(Math.atan2(dz, dx) - hull.h);
          if (Math.abs(rel) < 0.35) { want = hull.h - Math.sign(rel || 1) * 1.2; i = t.pts.length; }
        }
      }
    }
    const err = wrapAng(want - hull.h) + (seat.noise || 0);

    cmd.boost = hull.boostE > 0 && Math.abs(err) < 0.45;
    cmd.button = hull.tokens.length > 0 && Math.abs(wrapAng(Math.atan2(w.dest.z - hull.z, w.dest.x - hull.x) - hull.h)) < 0.35;

  function engineerAI(w, seat, dt) {
    seat.think -= dt;

  // ---- one step of the whole world. `live` carries the human inputs (null in the batch) ----
  function simStepWorld(w, dt, live) {
    const hull = w.hulls[0], seats = w.seats;
    if (w.swapT > 0) w.swapT -= dt;
    if (w.orientT > 0) w.orientT -= dt;
    // the pilot seat
    let cmd;
    if (seats.pilot.who === 'ai') { pilotAI(w, seats.pilot, dt); cmd = seats.pilot.cmd; }

    const box = document.createElement('div');

    const f = document.createElement('label'); f.className = 'field'; f.innerHTML = '<span>Your squad mate (the AI in the other seat)</span><select><option value="easy">AI Easy</option><option value="medium">AI Medium</option><option value="hard">AI Hard</option></select>';
    const s = f.querySelector('select'); s.value = crew.mate; s.onchange = () => { crew.mate = s.value; lsSet('mate', crew.mate); applyCrew(); };
    box.appendChild(f);
    const h = document.createElement('div'); h.className = 'hint';
    h.innerHTML = '<b>Engineer (Ratel):</b> drag a muton to move it (one AP per cell). Tap an empty coloured port to Refuel. A slot card lights when its pattern is on the board: tap it, then tap one of the outlined mutons. That muton goes to the battery, and its colour is the domain the pilot can slip through. Tap the left of the AP row to Research.<br><b>Pilot (Honeyguide):</b> A/D or ←/→ steer, W/Space boost (when an ability gave boost), Shift or E fires a dash or swap token, F arms (hold-to-arm rule only). On touch, hold a finger on the flight view and the hull turns toward it; two fingers boost. Fly into a trail of a domain you hold and you slip to the end you point at.';
    box.appendChild(h);
    return box;
  }
  const groups = [...new Set(SPEC.map((r) => r[0]))];
  makeTabs('dockTabs', 'dockBody', [{ name: 'Rules', build: rulesPanel }, { name: 'Crew', build: crewPanel }].concat(groups.map((g) => ({ name: g, build: () => sliderGroup(g) }))), LS + 'dock');

  // ================= the decision log =================
  let db = null, me = '', remote = [], localLog = lsGet('log', []);
  function snapshot() { return { round: LAB.round, seed, you: crew.you, mate: crew.mate, options: Object.assign({}, OPT), optionsChanged: optDiff(), changed: diffOnly(), score: world ? score(world) : null }; }
  async function record(topic, choice, note) {
    const doc = { topic, choice, note: note || '', createdAt: Date.now(), by: me, settings: snapshot() };
    if (db) { try { await db.collection('decisions').add(doc); return 'shared'; } catch (e) { /* fall through */ } }
    localLog.push(doc); lsSet('log', localLog); return 'local';
  }
  const TOPICS = ['Sign-off', 'Rotation', 'Pattern orientation', 'Slip arming', 'Slip exit', 'Domain map', 'Tick / AP / battery', 'Research', 'Starter set', 'Engine variant', 'Tuning', 'Other idea'];
  function currentChoice(topic) {
    const o = OPT;
    switch (topic) {
      case 'Rotation': return OPT_LABELS.rotate[o.rotate];
      case 'Pattern orientation': return OPT_LABELS.patterns[o.patterns];
      case 'Slip arming': return OPT_LABELS.arming[o.arming];
      case 'Slip exit': return OPT_LABELS.exit[o.exit];
      case 'Domain map': return DOMAIN_MAPS[o.domainMap].label;
      case 'Tick / AP / battery': return 'Tick ' + P.tickSeconds + ' s, ' + P.apPerTick + ' AP (bank ' + P.apBank + '), battery ' + P.batteryCap;
      case 'Research': return 'Research costs ' + P.researchCost + ' AP; loadout of 3 at launch';
      case 'Starter set': return LOADOUTS[o.loadout].label;
      case 'Engine variant': return ENGINES[o.engine].label;
      case 'Sign-off': return 'This is fun: build the Honeyguide and Ratel in Unity with these settings.';
      default: return 'Settings: ' + JSON.stringify(Object.assign({}, diffOnly(), optDiff()));
    }
  }
  function logPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint" id="logStatus"></p><label class="field"><span>Topic</span><select id="logTopic"></select></label><label class="field"><span>Your decision</span><textarea id="logChoice" rows="2"></textarea></label><p><button class="btn primary" id="logSave">Record decision</button> <button class="btn" id="logCopy">Copy log</button></p><div class="tablewrap"><table id="logTable"></table></div>';
    const sel = box.querySelector('#logTopic'); for (const t of TOPICS) { const o = document.createElement('option'); o.textContent = t; sel.appendChild(o); }
    const status = box.querySelector('#logStatus');
    status.textContent = db ? 'Shared log: saved with the lab, read by Claude at the start of the next round.' : 'Kept in this browser (Copy log to send it).';
    status.className = db ? 'status-ok' : 'status-warn';
    const fill = () => { box.querySelector('#logChoice').value = currentChoice(sel.value); };
    sel.onchange = fill; fill();
    box.querySelector('#logSave').onclick = async () => { const where = await record(sel.value, box.querySelector('#logChoice').value); status.textContent = where === 'shared' ? 'Recorded in the shared log.' : 'Recorded in this browser.'; renderLog(box); };
    box.querySelector('#logCopy').onclick = () => { const t = remote.concat(localLog).map((d) => new Date(d.createdAt).toISOString() + ' · ' + d.topic + ': ' + d.choice + ' ' + JSON.stringify(d.settings)).join('\n'); try { navigator.clipboard && navigator.clipboard.writeText(t); } catch (e) { /* no clipboard */ } };
    renderLog(box);
    return box;
  }
  function renderLog(box) {
    const t = (box || document).querySelector('#logTable'); if (!t) return;
    const rows = remote.concat(localLog).sort((a, b) => b.createdAt - a.createdAt).slice(0, 50);
    t.innerHTML = '<tr><th>When</th><th>Topic</th><th>Decision</th></tr>';
    for (const d of rows) { const tr = document.createElement('tr'); for (const v of [new Date(d.createdAt).toLocaleString(), d.topic, d.choice]) { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); } t.appendChild(tr); }
  }
  (async function connect() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try { db = await c.use('db'); } catch (e) { db = null; }
    try { const u = await c.use('user'); if (u) me = (await u.id()) || ''; } catch (e) { me = ''; }
    if (!db) return;
    try {
      db.collection('decisions').orderBy('createdAt', 'desc').limit(300).onSnapshot((snap) => { remote = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderLog(); }, () => { db = null; });
      for (const d of localLog.splice(0)) { try { await db.collection('decisions').add(d); } catch (e) { localLog.push(d); } }
      lsSet('log', localLog);
    } catch (e) { db = null; }
  })();

  // ================= scorecard, cards, about =================
  let lastRows = null;
  function scorecardPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p><button class="btn primary" id="runBatch">Score every variant</button> <span class="hint">Headless: 6 seeds × 120 s at 30 Hz, AI Hard pilot. The candidate also runs with an Easy and an idle Engineer. Hover a column for what it measures.</span></p><div class="tablewrap"><table id="scoreTable"></table></div>';
    const t = box.querySelector('#scoreTable');
    const paint = (rows) => {
      t.innerHTML = '';
      const hr = document.createElement('tr'); for (const [k, name, tip] of [['variant', 'Variant', 'Each row: 6 seeds × 120 s.']].concat(COLS, [['se', '± SE', 'Standard error of Dest/min over the seeds.']])) { const th = document.createElement('th'); th.textContent = name; th.title = tip; th.dataset.k = k; hr.appendChild(th); } t.appendChild(hr);
      const best = {}; for (const [k] of COLS) best[k] = Math.max(...rows.map((r) => r[k]));
      for (const r of rows) { const tr = document.createElement('tr'); const td0 = document.createElement('td'); td0.textContent = r.variant; tr.appendChild(td0); for (const [k] of COLS) { const td = document.createElement('td'); td.textContent = r[k]; if (k === 'destsPerMin' && r[k] === best[k]) td.className = 'best'; tr.appendChild(td); } const tdse = document.createElement('td'); tdse.textContent = r.se; tr.appendChild(tdse); t.appendChild(tr); }
    };
    if (lastRows) paint(lastRows);
    box.querySelector('#runBatch').onclick = () => { const b = box.querySelector('#runBatch'); b.textContent = 'Scoring…'; setTimeout(() => { lastRows = runBatch(); paint(lastRows); b.textContent = 'Score every variant'; }, 30); };
    return box;
  }
  function cardsPanel() {
    const box = document.createElement('div');
    const p = document.createElement('p'); p.className = 'hint'; p.textContent = 'All 39 Slipstream upgrade cards (2022 print) with their printed shapes. Twelve have a Cosmic Shore effect (a proposal); the rest fire with no effect yet, and the seven about sector tiles, planets or initiative are parked until Garrett re-themes them.'; box.appendChild(p);
    const grid = document.createElement('div'); grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px';
    PATTERNS.forEach((pat) => {
      const c = document.createElement('div'); c.className = 'card';
      const b = document.createElement('b'); b.textContent = pat.name; c.appendChild(b);
      const f = document.createElement('span'); f.className = 'fam'; f.style.color = DOM[DOMAIN_MAPS[OPT.domainMap].map[pat.family]].color; f.textContent = COLOUR_NAME[pat.family] + ' · ' + pat.cells.length + ' cells · ' + pat.cells.map((x) => COLOUR_LETTER[x[2]] + '(' + x[0] + ',' + x[1] + ')').join(' '); c.appendChild(f);
      const t = document.createElement('div'); t.className = 'hint'; t.textContent = '“' + pat.text + '”'; c.appendChild(t);
      const e = document.createElement('div'); e.textContent = pat.effect ? 'Cosmic Shore: ' + EFFECT_TEXT[pat.effect] : pat.parked ? 'Parked (sector tiles, planets or initiative have no equivalent)' : 'No Cosmic Shore effect yet.'; e.style.fontSize = '12px'; c.appendChild(e);
      grid.appendChild(c);
    });
    box.appendChild(grid);
    return box;
  }
  function aboutPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p id="aboutHead"></p>' +
      '<p><b>The question.</b> Is the handoff fun? The Ratel (Engineer) builds patterns on a hex Dynamo whose injection ports rotate every tick; activating a pattern pulls one muton of the Engineer\'s choice into the battery; that muton\'s domain is a slip charge, and when the Honeyguide (Pilot) touches a trail of that domain it teleports to the end of the trail it points at. Sign off on a phone, as the Engineer, on the Decisions tab ("this is fun").</p>' +
      '<p><b>What this lab does NOT model.</b></p><ul class="plain">' +
      '<li>The world is a flat 2D disc, not the 3D cell; trails are lines of dots with no shapes, shields or lighting, and the other hulls only lay trails (no prisms of flora, fauna or the cell).</li>' +
      '<li>The race (reach the next destination ring) is the lab\'s yardstick for "a slip shortened the route"; no game mode is modelled.</li>' +
      '<li>A hostile prism only slows the hull for a second; no crystals, no elements, no petals, no rival vessels to fight. PvP is petals only in the game and none of the twelve effects touch a rival.</li>' +
      '<li>Trails never loop and have no holes (IsLoop and IsRidable are not exercised); a teleport simply starts a new trail.</li>' +
      '<li>Time, Space, Mass and Charge scaling (tick rate, slip reach, battery size, effect potency) and the L5 upgrades are fixed numbers here.</li>' +
      '<li>Twelve cards have an effect; the other 27 fire with none. Effects are proposals sized in "Slipstream points".</li>' +
      '<li>Two players on one device only; no networking. A real thumb tires and misses; the AIs only have speed, noise and reaction time.</li></ul>';
    box.querySelector('#aboutHead').textContent = LAB.name + ' · round ' + LAB.round + ' · ' + LAB.branch + ' · write-up: ' + LAB.doc;
    return box;
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Decisions', build: logPanel }, { name: 'Scorecard', build: scorecardPanel }, { name: 'Cards', build: cardsPanel }, { name: 'About', build: aboutPanel }], LS + 'bottom');

  // ================= header =================
  $('title').textContent = 'Honeyguide and Ratel'; $('meta').textContent = 'lab round ' + LAB.round;
  function paintSeatSeg() { for (const b of $('seatSeg').children) b.setAttribute('aria-pressed', String(b.dataset.you === crew.you)); }
  for (const b of $('seatSeg').children) b.onclick = () => { crew.you = b.dataset.you; lsSet('you', crew.you); applyCrew(); paintSeatSeg(); };
  paintSeatSeg();
  $('swapBtn').onclick = () => requestSwap('button');
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
  $('restart').onclick = () => reset();
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); Object.assign(OPT, OPT_SHIPPED); lsSet('P', {}); lsSet('opt', OPT); for (const k in outputs) if (outputs[k].inp.isConnected) outputs[k].inp.value = P[k]; reset(); refreshDiff(); };

  // ================= sizing + loop (with a manual clock for recorders) =================
  function fitStage() { if (innerWidth > 900) return; const h = Math.max(520, innerHeight - document.querySelector('header').offsetHeight); document.documentElement.style.setProperty('--stageH', h + 'px'); }
  fitStage(); addEventListener('resize', fitStage);
  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now(), acc = 0;
  const DT = 1 / 60;
  function frame(now) {
    const el = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) {
      resize();
      if (!paused) { acc += el; livePilot(); while (acc >= DT) { simStepWorld(world, DT, live); acc -= DT; } }
      render();
    }
    requestAnimationFrame(frame);
  }
  reset(); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  // ================= the test surface =================
  window.__lab = {
    LAB, SHIPPED, SPEC, P, OPT, PLATFORM, VARIANTS, PATTERNS, ENGINES, core: D,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { dt = dt || DT; n = n || 1; for (let i = 0; i < n; i++) { livePilot(); simStepWorld(world, dt, live); } resize(); render(); },
    reset, score: () => score(world), runBatch, setParam, setOpt, record, swap: () => requestSwap('hook'),
    setSeat: (you) => { crew.you = you; applyCrew(); paintSeatSeg(); },
    engInput: (inp) => engInput(inp),
    cellPx: (i) => (ui.dynG ? cellPx(ui.dynG, i) : null), slotRect: (k) => (ui.slotRects ? ui.slotRects[k] : null), hexSize: () => (ui.dynG ? ui.dynG.size : 0),
    state: () => ({ t: world.t, seed, digest: D.digest(world.dyn), battery: world.dyn.battery.slice(), hull: { x: world.hulls[0].x, z: world.hulls[0].z, h: world.hulls[0].h }, m: Object.assign({}, world.m), seats: { pilot: world.seats.pilot.who, eng: world.seats.eng.who } }),
  };
  window.__honeyguideLab = window.__lab;
})();
</script>
</body>
