<!--
  SWARM VESSEL LAB, round 1 (2026-10-19, cece/inspiring-einstein-k6syi5).
  A vessel that IS a swarm: you do not fly one ship, you direct a population. This page is a toy box of
  "fun moments" for many swarm animals (termite, ant, locust, pigeon, rat, bee, wasp, starling, bat,
  firefly, mosquito, crow, piranha, slime mold, spider, siphonophore, tadpole) and a workbench that
  combines the MECHANICS a swarm vessel is made of: a body (how members move and what verb they do),
  a control scheme, an economy, and a meta layer (cards, draft, roulette, merge, evolution).
  Every combination is scored in the four element minigames (Time race, Space destruction, Mass
  creation, Charge dogfight), so its role on a team shows up as a fingerprint.
  Round 2 (2026-10-20, claude/project-thread-4slpcz): the SHEPHERD - a Rhino pilot, two thumb-driven sheepdogs
  and a flock of sheep on the pilot's plane (header button, or open the link with #shepherd).

<script>
(() => {
'use strict';
// ---- src/core.js ----
// ============================================================================================
// core.js — the lab meta, the shipped numbers, the sliders, and THE MODEL (world + swarm step).
// simStep never draws and never reads a device: input arrives as one object (touch, mouse, gamepad
// and the AI commander all write the same shape), so the batch can run it headless thousands of times.
// ============================================================================================
const $ = (id) => document.getElementById(id);

// ================= (1) LAB meta + the shipped numbers =================
// A READER of the shipped numbers, never their authority. Every value that exists in the game names the
// asset or field it was copied from; everything else is a lab knob ("lab:"). The game has no swarm VESSEL
// yet, so most of this page is proposal — the Termite deck and the locust's rules are the shipped anchors.
const LAB = { name: 'Swarm Vessel Lab', branch: 'claude/project-thread-4slpcz', round: 2, doc: 'Docs/Studios/SWARM_VESSEL_LAB.md' };
const SHIPPED = {
  cruise: 70,          // TermiteCommandTransformer.commandCruiseSpeed (Time 0; 112 at Time 10)
  accel: 90,           // TermiteCommandTransformer.commandAcceleration (u/s per s)
  pherMax: 10,         // TermitePheromoneAction.asset maxPheromone
  pherStart: 5,        // TermitePheromoneAction.asset startPheromone
  pherRegen: 0.357,    // TermitePheromoneAction.asset regenPerSecond.Value (0.714 at Time 10)
  droneSpeed: 55,      // TermiteDroneTuning.speed
  forage: 70,          // TermiteDroneTuning.forageRadius
  carry: 3,            // TermiteDroneTuning.carryCapacity
  droneCap: 36,        // TermiteDeckExecutor.maxLiveDrones
  locustMarch: 135,    // Tools/Ecology/bestiary/species/locust.py (gregarious march, u/s)
  locustCrowd: 40,     // locust.py: neighbours inside 40 u set the phase
  elTime: 2,           // lab: the swarm's TIME level 0..10 (Notion fauna concepts: Time = movement speed, spawn rate)
  elSpace: 2,          // lab: SPACE level (reach, spread, sense radius)
  elMass: 2,           // lab: MASS level (body size, hit points, carry)
  elCharge: 2,         // lab: CHARGE level (aggression thresholds, damage, debuff length)
  pop: 1,              // lab: population scale on every species' base count
  aggression: 0.5,     // lab: the B5 knob (NCA backlog B5 "calm <-> centroid-rush"), read by the Mood control
  rivalSkill: 0.5,     // lab: rival vessel accuracy and fire rate
  aiNoise: 0.15,       // lab: the AI commander's sloppiness (0 = expert, 1 = rookie)
  round: 45,           // lab: seconds per minigame round
};

// ================= (2) SPEC: one row per slider =================
const SPEC = [
  ['Elements', 'elTime',   0, 10, 1, 'Time',   'Swarm speed and how fast it breeds (+6% speed and +8% birth rate per level). Hull cruise follows the shipped 70 -> 112 curve.'],
  ['Elements', 'elSpace',  0, 10, 1, 'Space',  'How far members sense and reach (+8% per level), and how wide the swarm spreads.'],
  ['Elements', 'elMass',   0, 10, 1, 'Mass',   'Member size, hit points and carry capacity (+8% per level).'],
  ['Elements', 'elCharge', 0, 10, 1, 'Charge', 'Damage, sting and drain strength, debuff length (+8% per level). Lowers the locust crowd threshold.'],
  ['Swarm', 'pop',        0.25, 3, 0.05, 'Population scale', 'Multiplies every species\' base member count. Phones stay smooth up to about 2.'],
  ['Swarm', 'aggression', 0, 1, 0.01, 'Aggression (B5 knob)', 'Calm (escort the hull, avoid threats) to centroid-rush (charge the nearest enemy mass). Read live by the Mood control.'],
  ['Swarm', 'droneSpeed', 20, 160, 1, 'Member base speed', 'Shipped Termite drone speed. Each species scales it by its own factor.'],
  ['Swarm', 'forage', 20, 240, 1, 'Forage radius', 'Shipped Termite forage radius: how far a member looks for work around its focus.'],
  ['Swarm', 'carry', 1, 8, 1, 'Carry capacity', 'Shipped Termite carry: prisms a carrier moves per trip (the lab moves them as one parcel).'],
  ['Swarm', 'locustCrowd', 15, 90, 1, 'Locust crowd radius', 'locust.py: neighbours inside this radius push a locust toward the gregarious phase.'],
  ['Swarm', 'locustMarch', 60, 220, 1, 'Locust march speed', 'locust.py: gregarious march speed.'],
  ['Economy', 'pherMax', 4, 20, 1, 'Pheromone tank', 'Shipped Termite tank. Elixir-style economies and card costs are priced in it.'],
  ['Economy', 'pherStart', 0, 20, 1, 'Starting pheromone', 'Shipped start.'],
  ['Economy', 'pherRegen', 0.1, 2, 0.01, 'Pheromone per second', 'Shipped 0.357/s at Time 0 (0.714 at Time 10).'],
  ['Economy', 'droneCap', 6, 120, 1, 'Deck member cap', 'Shipped Termite cap on live drones; the deck economy respects it.'],
  ['Hull', 'cruise', 30, 200, 1, 'Hull cruise', 'Shipped Termite commanded cruise at Time 0.'],
  ['Hull', 'accel', 20, 300, 1, 'Hull acceleration', 'Shipped Termite commanded acceleration.'],
  ['Arena', 'rivalSkill', 0, 1, 0.05, 'Rival skill', 'Rival vessels\' fire rate and aim.'],
  ['Arena', 'aiNoise', 0, 1, 0.05, 'AI commander noise', '0 = an expert commander, 1 = a rookie. The scorecard runs both.'],
  ['Arena', 'round', 20, 120, 5, 'Round length (s)', 'Seconds per minigame round.'],
];

const LS_KEY = 'lab:' + LAB.name + ':P';
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private window */ } };
const P = Object.assign({}, SHIPPED, lsGet(LS_KEY, {}));
for (const k of Object.keys(P)) if (!(k in SHIPPED)) delete P[k];

// ================= seeded RNG =================
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ================= geometry =================
const R = 600;            // cell membrane radius (lab units, about one game unit each)
const NUC = 90;           // nucleus radius
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const len = (x, y) => Math.sqrt(x * x + y * y);
const DOM = { NEUTRAL: 0, JADE: 1, RUBY: 2, GOLD: 3 };
const ME = DOM.JADE;

// Element multipliers (Notion "Fauna Concepts": Mass bigger blocks, Space reach/separation, Time speed,
// Charge thresholds/debuff duration). Each is 1 at level 0.
const EL = {
  spd:   () => 1 + 0.06 * P.elTime,
  birth: () => 1 + 0.08 * P.elTime,
  reach: () => 1 + 0.08 * P.elSpace,
  size:  () => 1 + 0.08 * P.elMass,
  dmg:   () => (1 + 0.08 * P.elCharge) * (W && W.mods ? W.mods.bite : 1),
};
const hullCruise = () => P.cruise * (1 + 0.6 * P.elTime / 10);   // shipped 70 -> 112 over Time 0..10

// ================= spatial hash (prisms) =================
const CELL = 24;
function hkey(cx, cy) { return (cx + 512) * 1024 + (cy + 512); }
function hashBuild(list) {
  const m = new Map();
  for (const p of list) {
    if (!p.alive) continue;
    const k = hkey(Math.floor(p.x / CELL), Math.floor(p.y / CELL));
    let b = m.get(k); if (!b) { b = []; m.set(k, b); } b.push(p);
  }
  return m;
}
function hashQuery(m, x, y, r, fn) {
  const c0 = Math.floor((x - r) / CELL), c1 = Math.floor((x + r) / CELL), d0 = Math.floor((y - r) / CELL), d1 = Math.floor((y + r) / CELL), r2 = r * r;
  for (let cx = c0; cx <= c1; cx++) for (let cy = d0; cy <= d1; cy++) {
    const b = m.get(hkey(cx, cy)); if (!b) continue;
    for (const p of b) { if (!p.alive) continue; const dx = p.x - x, dy = p.y - y; if (dx * dx + dy * dy <= r2) if (fn(p, dx * dx + dy * dy) === false) return; }
  }
}

// ================= fields (pheromone, trail, blood) on a coarse grid =================
const FG = 80, FS = (2 * R) / FG;
function fieldIdx(x, y) { const i = Math.floor((x + R) / FS), j = Math.floor((y + R) / FS); return (i < 0 || j < 0 || i >= FG || j >= FG) ? -1 : j * FG + i; }
function fieldDiffuse(f, keep, spread) {
  const out = new Float32Array(f.length);
  for (let j = 1; j < FG - 1; j++) for (let i = 1; i < FG - 1; i++) {
    const k = j * FG + i, n = (f[k - 1] + f[k + 1] + f[k - FG] + f[k + FG]) * 0.25;
    out[k] = (f[k] * (1 - spread) + n * spread) * keep;
  }
  f.set(out);
}
function fieldGrad(f, x, y) {
  const k = fieldIdx(x, y); if (k < FG || k >= f.length - FG) return [0, 0];
  return [f[k + 1] - f[k - 1], f[k + FG] - f[k - FG]];
}

// ================= the world =================
let W = null;   // the live world; the batch swaps it out and back
function newWorld(seed) {
  return {
    seed, rnd: mulberry32(seed), t: 0, prisms: [], crystals: [], rivals: [], agents: [], fauna: [], proj: [], fx: [],
    homes: [], baits: [], marks: [], webs: [], paint: [], gates: null,
    hash: null, ahash: null, pher: new Float32Array(FG * FG), trail: new Float32Array(FG * FG), blood: new Float32Array(FG * FG),
    hull: null, econ: null, meta: null, ctl: null, sp: null, scene: 'sandbox', game: null,
    stats: { eaten: 0, destroyed: 0, built: 0, delivered: 0, crystals: 0, petalsTaken: 0, petalsLost: 0, births: 0, deaths: 0, stings: 0, flashes: 0, plays: 0, merges: 0, revealed: 0, snared: 0 },
    focus: null, selection: null, mood: P.aggression, order: 0, orderAt: 0, sync: 0, syncKick: 0, leaderIdx: -1, formation: 'ring', cast: false,
    tick: 0, done: false, finishT: null, fortress: 0, drafts: 0, nextDraft: 20, nextRoulette: 15, toast: null, rouletteIdx: 0,
  };
}

function addPrism(x, y, dom, opt) {
  if (len(x, y) > R - 8) return null;
  const p = { x, y, dom, alive: true, hp: (opt && opt.hp) || 1, sh: (opt && opt.sh) || 0, carried: -1, mark: 0, built: (opt && opt.built) || 0, claims: 0, tag: (opt && opt.tag) || 0, hidden: false };
  W.prisms.push(p);
  return p;
}
function killPrism(p, cause) {
  if (!p.alive) return;
  p.alive = false;
  W.stats.destroyed++;
  if (p.dom !== ME && p.dom !== DOM.NEUTRAL && cause !== 'fauna') W.stats.hostileKills = (W.stats.hostileKills || 0) + 1;
  if (p.tag === 1) W.fortress--;
  const k = fieldIdx(p.x, p.y); if (k >= 0) W.blood[k] += 1;
  if (cause !== 'quiet') W.fx.push({ k: 'pop', x: p.x, y: p.y, t: 0, dom: p.dom });
}
function addCrystal(x, y, opt) {
  const c = { x, y, alive: true, kind: (opt && opt.kind) || 'omni', hidden: !!(opt && opt.hidden), order: (opt && opt.order) != null ? opt.order : -1, carriedBy: -1, decoy: !!(opt && opt.decoy) };
  W.crystals.push(c); return c;
}
function addRival(x, y, dom, mode) {
  const r = { x, y, vx: 0, vy: 0, dom, petals: 10, petalDebt: 0, alive: true, cd: 1 + W.rnd(), mode: mode || 'hunt', marked: 0, respawn: 0, slow: 0, stun: 0, tx: x, ty: y, retarget: 0, trailT: 0, latched: 0, heat: 0 };
  W.rivals.push(r); return r;
}
function addHome(x, y, kind) { const h = { x, y, kind, r: 16, sites: 0, nestHp: 0, spawnT: 0, stock: 0 }; W.homes.push(h); return h; }

// clump of prisms (a resource patch, a wall arc, a ring)
function clump(cx, cy, n, spread, dom, opt) {
  for (let i = 0; i < n; i++) { const a = W.rnd() * TAU, r = Math.sqrt(W.rnd()) * spread; addPrism(cx + Math.cos(a) * r, cy + Math.sin(a) * r, dom, opt); }
}
function ring(cx, cy, rad, thick, step, dom, opt) {
  for (let r = rad; r < rad + thick; r += step) {
    const n = Math.floor(TAU * r / step);
    for (let i = 0; i < n; i++) { const a = i / n * TAU; const o = Object.assign({}, opt); if (opt && opt.shieldFrac && W.rnd() < opt.shieldFrac) o.sh = 1; addPrism(cx + Math.cos(a) * r, cy + Math.sin(a) * r, dom, o); }
  }
}
function arc(cx, cy, rad, a0, a1, step, dom, opt) {
  const n = Math.max(2, Math.floor(Math.abs(a1 - a0) * rad / step));
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; addPrism(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, dom, opt); }
}
function line(x0, y0, x1, y1, step, dom, opt) {
  const L = len(x1 - x0, y1 - y0), n = Math.max(1, Math.floor(L / step));
  for (let i = 0; i <= n; i++) addPrism(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n, dom, opt);
}

// ================= the hull (the vessel the swarm belongs to) =================
function makeHull(x, y) { return { x, y, vx: 0, vy: 0, hx: 1, hy: 0, petals: 10, mode: 'auto', tx: x, ty: y, trailT: 0, ramCd: 0, hp: 1, alive: true, roam: null, stick: false }; }

function stepHull(dt, input) {
  const h = W.hull, ctl = W.ctl;
  let tx = h.x, ty = h.y, want = 0;
  const mode = ctl.hull;                 // 'auto' | 'stick' | 'anchor'
  if (mode === 'stick') {
    if (input.down && input.px != null) { tx = input.px; ty = input.py; want = hullCruise(); }
    else if (W.ctl.id === 'school' || W.ctl.id === 'formation' || W.ctl.id === 'leash' || W.ctl.id === 'sheepdog') { tx = h.tx; ty = h.ty; want = len(tx - h.x, ty - h.y) > 8 ? hullCruise() : 0; }
    if (input.down && input.px != null) { h.tx = input.px; h.ty = input.py; }
  } else if (mode === 'auto') {
    // The queen flies herself: roam the cell band and swing toward a crystal she may collect.
    if (!h.roam || len(h.roam.x - h.x, h.roam.y - h.y) < 14 || W.t > h.roam.until) {
      let best = null, bd = 1e9;
      for (const c of W.crystals) if (c.alive && !c.hidden && c.carriedBy < 0 && !c.decoy && (W.game !== 'time' || c.order === W.gateNext)) { const d = len(c.x - h.x, c.y - h.y); if (d < bd && (d < 320 || W.game === 'time')) { bd = d; best = c; } }
      const threat = W.game === 'charge' ? nearestRival(h.x, h.y, 220) : null;
      if (threat) { const ax = h.x - threat.x, ay = h.y - threat.y, ad = len(ax, ay) || 1; best = { x: clamp(h.x + (ax / ad - ay / ad * 0.8) * 160, -R * 0.8, R * 0.8), y: clamp(h.y + (ay / ad + ax / ad * 0.8) * 160, -R * 0.8, R * 0.8) }; }
      if (best) h.roam = { x: best.x, y: best.y, until: W.t + (threat ? 1.2 : 6) };
      else { const a = W.rnd() * TAU, r = NUC * 1.6 + W.rnd() * (R * 0.7 - NUC * 1.6); h.roam = { x: Math.cos(a) * r, y: Math.sin(a) * r, until: W.t + 9 }; }
    }
    tx = h.roam.x; ty = h.roam.y; want = hullCruise() * 0.7;
  }
  const dx = tx - h.x, dy = ty - h.y, d = len(dx, dy);
  let ax = 0, ay = 0;
  if (d > 4 && want > 0) { const s = Math.min(want, Math.sqrt(2 * P.accel * d)); ax = dx / d * s - h.vx; ay = dy / d * s - h.vy; }
  else { ax = -h.vx; ay = -h.vy; }
  const am = len(ax, ay), lim = P.accel * dt;
  if (am > lim) { ax *= lim / am; ay *= lim / am; }
  h.vx += ax; h.vy += ay;
  h.x += h.vx * dt; h.y += h.vy * dt;
  const r = len(h.x, h.y); if (r > R - 12) { h.x *= (R - 12) / r; h.y *= (R - 12) / r; h.vx *= 0.5; h.vy *= 0.5; }
  const sp = len(h.vx, h.vy); if (sp > 1) { h.hx = h.vx / sp; h.hy = h.vy / sp; }
  // The hull lays its own thin trail: conserved mass, the Mass baseline every vessel has.
  h.trailT -= dt;
  if (sp > 20 && h.trailT <= 0) { h.trailT = 0.55; addPrism(h.x - h.hx * 6, h.y - h.hy * 6, ME, { built: 2 }); }
  // A weak ram: the hull breaks one hostile prism it flies into, and collects crystals it touches.
  h.ramCd -= dt;
  if (h.ramCd <= 0) hashQuery(W.hash, h.x, h.y, 7, (p) => { if (p.dom !== ME && p.sh === 0 && p.carried < 0) { killPrism(p); h.ramCd = 0.4; return false; } });
  for (const c of W.crystals) if (c.alive && !c.hidden && c.carriedBy < 0 && len(c.x - h.x, c.y - h.y) < 10) collectCrystal(c, 'hull');
}

function collectCrystal(c, by) {
  if (c.decoy) return;
  if (W.game === 'time' && c.order >= 0 && c.order !== W.gateNext) return;
  c.alive = false; c.carriedBy = -1;
  W.stats.crystals++;
  if (W.game === 'time' && c.order >= 0) { W.gateNext++; if (W.gateNext >= W.gateCount && W.finishT == null) W.finishT = W.t; }
  econOnCrystal(c);
  W.fx.push({ k: 'ring', x: c.x, y: c.y, t: 0, r: 26, col: '#9ff7c6' });
  if (W.game !== 'time' && W.scene !== 'dark') {
    // respawn somewhere else (crystals are the cell's, not the swarm's)
    const a = W.rnd() * TAU, r = NUC * 1.4 + W.rnd() * (R * 0.75 - NUC * 1.4);
    addCrystal(Math.cos(a) * r, Math.sin(a) * r, { kind: W.rnd() < 0.5 ? 'omni' : 'el' });
  }
}

// ================= rivals (vessels of another domain) =================
function nearestRival(x, y, maxD) {
  let best = null, bd = maxD || 1e9;
  for (const r of W.rivals) { if (!r.alive) continue; const d = len(r.x - x, r.y - y); if (d < bd) { bd = d; best = r; } }
  return best;
}
function stepRivals(dt) {
  const h = W.hull;
  for (const r of W.rivals) {
    if (!r.alive) continue;
    r.stun = Math.max(0, r.stun - dt); r.slow = Math.max(0, r.slow - dt);
    r.retarget -= dt;
    if (r.retarget <= 0) {
      r.retarget = 1.2 + W.rnd();
      const lure = W.crystals.find((c) => c.alive && c.decoy && len(c.x - r.x, c.y - r.y) < 320);
      if (lure) { r.tx = lure.x; r.ty = lure.y; }
      else if (r.mode === 'hunt') { r.tx = h.x + (W.rnd() - .5) * 60; r.ty = h.y + (W.rnd() - .5) * 60; }
      else if (r.mode === 'graze') {
        // grazes our mass: pick a jade prism, else a crystal, else roam
        let best = null, bd = 1e9; for (let i = 0; i < 40; i++) { const p = W.prisms[Math.floor(W.rnd() * W.prisms.length)]; if (p && p.alive && p.dom === ME) { const d = len(p.x - r.x, p.y - r.y); if (d < bd) { bd = d; best = p; } } }
        if (best) { r.tx = best.x; r.ty = best.y; } else { const a = W.rnd() * TAU; r.tx = Math.cos(a) * R * 0.6; r.ty = Math.sin(a) * R * 0.6; }
      } else if (r.mode === 'guard') { const a = W.t * 0.4 + r.dom; r.tx = W.fortX + Math.cos(a) * 110; r.ty = W.fortY + Math.sin(a) * 110; }
      else { // decoy-crystal bait: rivals chase crystals they can see
        let best = null, bd = 400; for (const c of W.crystals) if (c.alive && !c.hidden) { const d = len(c.x - r.x, c.y - r.y); if (d < bd) { bd = d; best = c; } }
        if (best) { r.tx = best.x; r.ty = best.y; } else { const a = W.rnd() * TAU; r.tx = Math.cos(a) * R * 0.5; r.ty = Math.sin(a) * R * 0.5; }
      }
    }
    const spd = (r.stun > 0 ? 0 : (r.slow > 0 ? 45 : 95)) * (1 - Math.min(0.6, r.latched * 0.05));
    const dx = r.tx - r.x, dy = r.ty - r.y, d = len(dx, dy) || 1;
    r.vx += (dx / d * spd - r.vx) * Math.min(1, 2.5 * dt); r.vy += (dy / d * spd - r.vy) * Math.min(1, 2.5 * dt);
    r.x += r.vx * dt; r.y += r.vy * dt;
    const rr = len(r.x, r.y); if (rr > R - 12) { r.x *= (R - 12) / rr; r.y *= (R - 12) / rr; }
    // rivals lay their own trail (hostile mass the swarm can eat or carry)
    r.trailT -= dt; if (r.trailT <= 0 && spd > 0) { r.trailT = 0.6; addPrism(r.x, r.y, r.dom, { built: 3 }); }
    // and eat our mass on contact
    hashQuery(W.hash, r.x, r.y, 8, (p) => { if (p.dom === ME && p.sh === 0 && p.carried < 0) { killPrism(p); } });
    // shoot
    r.cd -= dt * (0.6 + P.rivalSkill);
    if (r.cd <= 0 && r.stun <= 0) {
      r.cd = 1.9 + W.rnd() * 0.8;
      let tx = h.x, ty = h.y;
      // decoy: a dense cloud near the hull draws fire onto a member instead (starling, bat)
      const cloud = W.sp.decoy ? decoyAgentNear(h.x, h.y, 90) : null;
      if (cloud && W.rnd() < Math.min(0.85, W.decoyDensity)) { tx = cloud.x; ty = cloud.y; }
      const dd = len(tx - r.x, ty - r.y);
      if (dd < 300) {
        const spread = (1 - P.rivalSkill) * 0.5 + 0.08;
        const a = Math.atan2(ty - r.y, tx - r.x) + (W.rnd() - 0.5) * spread;
        W.proj.push({ x: r.x, y: r.y, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220, life: 1.5, dom: r.dom });
      }
    }
    // stings and drains accrue as a debt; whole petals transfer
    if (r.petalDebt >= 1) { const n = Math.floor(r.petalDebt); r.petalDebt -= n; const take = Math.min(n, r.petals); r.petals -= take; W.hull.petals += take; W.stats.petalsTaken += take; if (take) econOnPetal(take); if (take) W.fx.push({ k: 'petal', x: r.x, y: r.y, t: 0 }); }
    r.latched = 0;
  }
}
function decoyAgentNear(x, y, rad) {
  let n = 0, pick = null;
  for (const a of W.agents) if (a.alive && Math.abs(a.x - x) < rad && Math.abs(a.y - y) < rad) { n++; if (!pick || W.rnd() < 1 / n) pick = a; }
  W.decoyDensity = n / 40;
  return pick;
}
function stepProjectiles(dt) {
  const h = W.hull;
  for (const q of W.proj) {
    if (q.life <= 0) continue;
    q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;
    // members in the way absorb the shot (shield, bridge, decoy)
    for (const a of W.agents) {
      if (!a.alive) continue;
      const dx = a.x - q.x, dy = a.y - q.y, rr = 3 + a.size;
      if (dx * dx + dy * dy < rr * rr) { q.life = 0; hurtAgent(a, 1); break; }
    }
    if (q.life <= 0) continue;
    if (len(h.x - q.x, h.y - q.y) < 9) { q.life = 0; const r = nearestRival(q.x, q.y, 1e9); if (h.petals > 0) { h.petals--; W.stats.petalsLost++; if (r) r.petals++; } W.fx.push({ k: 'hit', x: h.x, y: h.y, t: 0 }); continue; }
    hashQuery(W.hash, q.x, q.y, 5, (p) => { if (p.dom === ME && p.carried < 0) { if (p.sh) p.sh = 0; else killPrism(p); q.life = 0; return false; } });
  }
  W.proj = W.proj.filter((q) => q.life > 0);
}

// ================= neutral fauna (grazers that eat any mass outside the nucleus) =================
function stepFauna(dt) {
  for (const f of W.fauna) {
    if (!f.alive) continue;
    f.t -= dt;
    if (f.t <= 0 || !f.tgt || !f.tgt.alive) {
      f.t = 2; f.tgt = null; let bd = 140;
      hashQuery(W.hash, f.x, f.y, 140, (p, d2) => { const d = Math.sqrt(d2); if (p.carried < 0 && p.sh === 0 && len(p.x, p.y) > NUC && d < bd) { bd = d; f.tgt = p; } });
      if (!f.tgt) { const a = W.rnd() * TAU; f.wx = f.x + Math.cos(a) * 80; f.wy = f.y + Math.sin(a) * 80; }
    }
    const tx = f.tgt ? f.tgt.x : f.wx, ty = f.tgt ? f.tgt.y : f.wy, dx = tx - f.x, dy = ty - f.y, d = len(dx, dy) || 1;
    f.x += dx / d * 30 * dt; f.y += dy / d * 30 * dt;
    if (f.tgt && d < 4) { f.chew -= dt; if (f.chew <= 0) { killPrism(f.tgt, 'fauna'); f.chew = 1.5; f.tgt = null; } }
  }
}

// ================= the swarm: members, genes and verbs =================
// A member is one body. Its SPECIES gives it genes (how it moves) and one VERB (what it does to the world).
// The CONTROL scheme only ever writes a focus point, an order, a mood or a selection — it never moves a
// member directly. That separation is the whole point of the lab: a swarm vessel is a combination of
// (species verb) x (control) x (economy) x (meta), and each axis can be swapped while the others hold.
function addAgent(x, y, opt) {
  const sp = W.sp, s = (opt && opt.species) ? SPECIES_BY_ID[opt.species] : sp;
  if (W.agents.filter((a) => a.alive).length >= agentCap()) return null;
  const a = {
    x, y, vx: 0, vy: 0, alive: true, sp: s.id, verb: (opt && opt.verb) || s.verb, hp: s.hp * EL.size(), size: s.size * EL.size() * ((opt && opt.big) || 1),
    state: 'idle', tgt: null, carry: null, cd: W.rnd(), phase: W.rnd() * TAU, g: 0, age: 0, sq: (opt && opt.sq) || 0, sel: true, link: -1,
    caste: (opt && opt.caste) || 'worker', born: W.t, gene: (opt && opt.gene) ? Object.assign({}, opt.gene) : { spd: 1, sense: 1, bite: 1 }, kills: 0, big: (opt && opt.big) || 1,
  };
  a.hp *= W.mods.hp / ((opt && opt.costHp) || 1);
  W.agents.push(a); W.stats.births++;
  W.fx.push({ k: 'birth', x, y, t: 0 });
  return a;
}
function agentCap() { return Math.round(Math.min(220, (W.econ && W.econ.cap) || P.droneCap) ); }
function liveAgents() { return W.agents.filter((a) => a.alive); }
function hurtAgent(a, dmg) {
  a.hp -= dmg;
  if (a.hp <= 0 && a.alive) {
    a.alive = false; W.stats.deaths++;
    // a body is conserved mass: a dead member leaves one neutral prism where it fell (the §26 skeleton, in miniature)
    if (W.sp.leavesBody) addPrism(a.x, a.y, DOM.NEUTRAL, { built: 0 });
    if (a.carry && a.carry.kind === 'crystal') { a.carry.c.carriedBy = -1; a.carry.c.x = a.x; a.carry.c.y = a.y; }
    W.fx.push({ k: 'die', x: a.x, y: a.y, t: 0 });
  }
}
function memberSpeed(a) {
  const s = SPECIES_BY_ID[a.sp];
  let v = P.droneSpeed * s.speedK * EL.spd() * a.gene.spd * W.mods.spd / Math.sqrt(a.big);
  if (s.id === 'locust') v = P.droneSpeed * 0.55 + (P.locustMarch - P.droneSpeed * 0.55) * a.g;
  if (W.buff.frenzy > 0) v *= 1.45;
  if (a.verb === 'frenzy') { const k = fieldIdx(a.x, a.y); v *= 1 + Math.min(1.5, (k >= 0 ? W.blood[k] : 0) * 0.4); }
  return v;
}
const senseR = (a) => P.forage * EL.reach() * a.gene.sense * W.mods.sense * SPECIES_BY_ID[a.sp].senseK;

// the focus a member is pulled toward: the control's focus point, its squad's focus, or the hull
function focusFor(a) {
  if (W.ctl.id === 'split') return a.sq === 1 ? (W.focusB || W.hull) : (W.focus || W.hull);
  if (W.ctl.id === 'select' && !a.sel) return a.homeFocus || W.hull;
  if (W.ctl.id === 'leader' && W.leaderIdx >= 0 && W.agents[W.leaderIdx] && W.agents[W.leaderIdx].alive && W.agents[W.leaderIdx] !== a) return W.agents[W.leaderIdx];
  if (W.order === 1) return W.hull;                                    // Gather
  if (W.order === 3 && W.homes.length) return W.homes[0];              // Defend
  if (W.bait && W.bait.t > 0) return W.bait;
  return W.focus || W.hull;
}

// work targets — every verb asks the world the same kind of question with its own filter
function findPrism(a, rad, pred) {
  let best = null, bd = rad;
  hashQuery(W.hash, a.x, a.y, rad, (p, d2) => { const d = Math.sqrt(d2); if (d < bd && pred(p)) { bd = d; best = p; } });
  return best;
}
const hostile = (p) => p.dom !== ME && p.carried < 0 && !p.hidden;
const edible = (p) => hostile(p) && p.sh === 0 && len(p.x, p.y) > NUC * 0.6;
function findCrystal(a, rad) {
  let best = null, bd = rad;
  for (const c of W.crystals) {
    if (!c.alive || c.carriedBy >= 0 || (c.hidden && !c.revealed) || c.decoy) continue;
    if (W.game === 'time' && c.order >= 0 && c.order !== W.gateNext) continue;
    const d = len(c.x - a.x, c.y - a.y); if (d < bd) { bd = d; best = c; }
  }
  return best;
}
function buildSite(a) {
  // where carried mass is laid: next to the swarm's newest construction near the focus, so a mound GROWS
  const f = W.homes.length ? W.homes[W.homes.length - 1] : (W.focus || W.hull);
  const ang = W.rnd() * TAU, r = 10 + Math.sqrt(W.rnd()) * (18 + 2.2 * Math.sqrt(W.stats.built + 1));
  return { x: f.x + Math.cos(ang) * r, y: f.y + Math.sin(ang) * r };
}

// The verb table. Each entry returns the member's GOAL (a point) and may act on arrival.
// Keep each one small: a verb is the species' one sentence.
const VERBS = {

function stepSync(dt) {

  const live = W.agents.filter((a) => a.alive && a.verb === 'flash'); if (!live.length) { W.sync = 0; return; }

    const rad = 70 + 14 * Math.sqrt(live.length) * EL.reach();

}

// ================= HUD =================
let hudFrame = 0;
function drawHud() {
  if (hudFrame++ % 6) return;
  const toy = TOYS_BY_ID[BUILD.toy];
  $('hudToy').textContent = (toy ? toy.title : 'Custom build') + '  ·  ' + SPECIES_BY_ID[BUILD.species].name + ' / ' + CONTROLS_BY_ID[BUILD.control].name;
  $('hudFun').textContent = toy ? toy.fun : (SPECIES_BY_ID[BUILD.species].fun);
  const sc = score(), live = sc.members, lines = [];
  const sceneName = SCENES_BY_ID[W.scene].name;
  lines.push(sceneName + (W.game ? '  ' + Math.max(0, P.round - W.t).toFixed(0) + 's' : ''));
  lines.push('score ' + sc.score + (W.done ? '  (final)' : ''));
  lines.push('members ' + live + (W.econ.cap ? '/' + agentCap() : ''));
  if (W.game === 'time') lines.push('gate ' + Math.min(W.gateNext + 1, W.gateCount) + '/' + W.gateCount);
  if (W.agents.some((a) => a.alive && a.verb === 'flash')) lines.push('sync ' + (W.sync * 100).toFixed(0) + '%  flashes ' + W.stats.flashes);
  if (W.sp.id === 'locust') { const l = liveAgents().filter((a) => a.sp === 'locust'); lines.push('gregarious ' + (l.length ? Math.round(100 * l.filter((a) => a.g > 0.5).length / l.length) : 0) + '%'); }
  if (W.build.meta === 'evolve') { const l = liveAgents(); if (l.length) { const m = (k) => (l.reduce((t, a) => t + a.gene[k], 0) / l.length).toFixed(2); lines.push('genes spd ' + m('spd') + ' sense ' + m('sense') + ' bite ' + m('bite')); } }
  if (W.ctl.id === 'orders') lines.push('order ' + ['Forage', 'Gather', 'Attack', 'Defend'][W.order]);
  if (W.ctl.id === 'rhythm') lines.push('streak ' + (W.streak || 0));
  if (W.stats.starved) lines.push('starved ' + W.stats.starved);
  if (W.stats.merges) lines.push('merges ' + W.stats.merges);
  if (W.stats.snared) lines.push('snared ' + W.stats.snared);
  $('hudRight').textContent = lines.join('\n');

// ---- Scorecard + Team ----
// A fingerprint is a build's score in each element game, normalised against two baselines that are measured
// in the same pass: "Hull only" (the same arena with no swarm at all) and the best build in the table.
let SCORES = lsGet('lab:' + LAB.name + ':scores', null);
function normalise(sets) {
  const base = sets.find((s) => s.label === 'Hull only'), out = {};
  for (const g of GAMES) {
    const b = base ? (base.rows.find((r) => r.game === g) || { score: 0 }).score : 0;
    const top = Math.max(b + 1, ...sets.map((s) => (s.rows.find((r) => r.game === g) || { score: 0 }).score));
    out[g] = { base: b, top };
  }
  return out;
}
function roleOf(n) {
  const names = { time: 'Runner', space: 'Breaker', mass: 'Builder', charge: 'Hunter' };
  const sorted = GAMES.slice().sort((a, b) => n[b] - n[a]);
  if (n[sorted[0]] < 15) return 'Passenger';
  return names[sorted[0]] + (n[sorted[1]] > 0.7 * n[sorted[0]] && n[sorted[1]] > 25 ? ' / ' + names[sorted[1]] : '');
}
function fingerprintTable(sets) {
  const norm = normalise(sets), t = el('table');
  const hr = el('tr'); for (const h of ['Build', 'Time', 'Space', 'Mass', 'Charge', 'Role']) hr.appendChild(el('th', '', h)); t.appendChild(hr);
  const best = {}; for (const g of GAMES) best[g] = Math.max(...sets.map((s) => (s.rows.find((r) => r.game === g) || { score: -1e9 }).score));
  for (const s of sets) {
    const tr = el('tr'); tr.appendChild(el('td', '', s.label)); const n = {};
    for (const g of GAMES) {
      const r = s.rows.find((x) => x.game === g) || { score: 0 }, nb = norm[g];
      n[g] = Math.round(100 * (r.score - nb.base) / Math.max(1, nb.top - nb.base));
      const td = el('td', r.score === best[g] && sets.length > 1 ? 'best' : '', r.score + '  (' + n[g] + ')'); td.title = 'raw score (normalised 0-100 against Hull only and the best build)'; tr.appendChild(td);
    }
    tr.appendChild(el('td', 'role', s.label === 'Hull only' ? 'baseline' : roleOf(n)));
    s.norm = n; t.appendChild(tr);
  }

}

async function record(topic, choice, note) {

  if (db) { try { await db.collection('decisions').add(doc); return 'shared'; } catch (e) { /* fall through to local */ } }

}

(async function connect() {
  const c = window.claude;

  if (!db) return;
  try { db.collection('decisions').orderBy('createdAt', 'desc').limit(300).onSnapshot((snap) => { remote = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderLog(); }, () => { db = null; }); } catch (e) { db = null; }

// ================= (2) vectors, element rules =================
const v3 = (x, y, z) => ({ x, y, z });
const vadd = (a, b) => v3(a.x + b.x, a.y + b.y, a.z + b.z);
const vsub = (a, b) => v3(a.x - b.x, a.y - b.y, a.z - b.z);
const vmul = (a, k) => v3(a.x * k, a.y * k, a.z * k);
const vdot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const vcross = (a, b) => v3(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
const vlen = (a) => Math.hypot(a.x, a.y, a.z);
const vnorm = (a) => { const L = vlen(a) || 1; return v3(a.x / L, a.y / L, a.z / L); };

function frameFrom(f, u) { f = vnorm(f); let r = vcross(u, f); if (vlen(r) < 1e-4) r = vcross(v3(0, 0, 1), f); r = vnorm(r); return { f, r, u: vcross(f, r) }; }

const L5k = (k) => elv(k) >= 5;
// the element level the vessel has NOW: authored level plus the decaying danger debuff (one vessel, one set of elements)
function elv(k) { return SP[k] + (SW ? SW.deb : 0); }

  speed: () => Math.max(0.4, 1 + 0.06 * elv('elTime')),

  ring: () => Math.max(40, SEL.floorU() * (1 + 0.06 * Math.max(0, elv('elSpace') + 5))),   // never below the floor; floor turned off -> 40 u stand-in

function fromB(a, c) { const p = SW.pilot, b = SW.board; return v3(p.x + b.r.x * a + b.f.x * c, p.y + b.r.y * a + b.f.y * c, p.z + b.r.z * a + b.f.z * c); }

// xz grid hash (y ignored in the key; distance checks are 3D, so a tilted plane only costs a few more checks)
const SH_CELL = 90;
function shKey(x, z) { return ((Math.floor(x / SH_CELL) + 2048) << 12) | (Math.floor(z / SH_CELL) + 2048); }
function shHash(list) { const m = new Map(); for (const o of list) { if (o.alive === false) continue; const k = shKey(o.x, o.z); let b = m.get(k); if (!b) m.set(k, b = []); b.push(o); } return m; }
function shQuery(m, x, z, r, fn) {
  const c0 = Math.floor((x - r) / SH_CELL), c1 = Math.floor((x + r) / SH_CELL), d0 = Math.floor((z - r) / SH_CELL), d1 = Math.floor((z + r) / SH_CELL);
  for (let i = c0; i <= c1; i++) for (let j = d0; j <= d1; j++) { const b = m.get(((i + 2048) << 12) | (j + 2048)); if (b) for (const o of b) fn(o); }
}
// the flock in 3D (centroid) and in board coordinates (what the dogs and the view use)
function flockStats() {
  const S = SW.sheep; let cx = 0, cy = 0, cz = 0;
  for (const s of S) { cx += s.x; cy += s.y; cz += s.z; }
  const n = Math.max(1, S.length); cx /= n; cy /= n; cz /= n;
  const c = toB(v3(cx, cy, cz));
  let r2 = 0, far = null, fd = -1;
  for (const s of S) { const q = toB(s), d = (q.x - c.x) ** 2 + (q.z - c.z) ** 2; r2 += d; if (d > fd) { fd = d; far = q; } }
  return { x: c.x, z: c.z, w: v3(cx, cy, cz), r: Math.sqrt(r2 / n), far, n: S.length };
}

// ================= (4) one step =================
// input: { pilot: { yaw, pitch, roll, thr, call, tele, decoy }, dogs: [{ down, x, y, z }, { down, x, y, z }] }
// (held states; edges are found here; a dog's target is a world point, snapped to the plane)
function shepStep(dt, input) {
  const w = SW; if (w.done) return;
  w.t += dt;
  const inp = input || {};
  const pi = inp.pilot || {}, di = inp.dogs || [];
  // the danger debuff decays linearly to 0 over debuffTime (VesselElementalDebuffByDangerPrismEffect)
  w.hits = w.hits.filter((h) => w.t - h < SP.debuffTime);
  w.deb = 0; for (const h of w.hits) w.deb -= SP.dangerDebuff * (1 - (w.t - h) / SP.debuffTime);
  stepPilot(dt, pi);
  stepBoard(dt);
  // ---- dogs: run to the thumb along the plane; a lift leaves a decoy where the dog stands ----
  for (let k = 0; k < 2; k++) {
    const d = w.dogs[k], t = di[k] || {};
    snapToPlane(d);
    if (d.off) continue;
    const was = w.prev['d' + k];
    if (t.down && t.x != null) {
      const tq = onPlane(v3(t.x, t.y != null ? t.y : w.pilot.y, t.z));
      const dv = vsub(tq, d), L = vlen(dv), step = SP.dogSpeed * dt;
      if (L > step) { d.x += dv.x / L * step; d.y += dv.y / L * step; d.z += dv.z / L * step; } else { d.x = tq.x; d.y = tq.y; d.z = tq.z; }
    } else if (was) { dropDecoy(d.x, d.y, d.z, 'dog'); }
    d.down = !!t.down; w.prev['d' + k] = d.down;
  }
  if (w.decoy) snapToPlane(w.decoy);
  stepSheep(dt);
  stepRivalsSh(dt);
  stepSelfHits();
  // ---- Mass L5: the flock poops a cluster of its own mass ----
  if (L5k('elMass')) {
    w.pooT -= dt;
    if (w.pooT <= 0 && w.sheep.length) {
      w.pooT = SP.pooEvery;
      const s = w.sheep[Math.floor(w.rnd() * w.sheep.length)];
      for (let i = 0; i < 7; i++) { const a = w.rnd() * TAU, r = w.rnd() * 22; if (addShPrism(s.x + Math.cos(a) * r, s.y + (w.rnd() - 0.5) * 16, s.z + Math.sin(a) * r, 'jade')) w.stats.pooped++; }
      w.fx.push({ k: 'poo', x: s.x, y: s.y, z: s.z, t: 0 });
    }
  }
  // ---- pasture regrows slowly in the Mass game ----
  if (w.game === 'mass') { w.regrowT -= dt; if (w.regrowT <= 0) { w.regrowT = 0.4; const a = w.rnd() * TAU, r = 400 + w.rnd() * 1700; addShPrism(Math.cos(a) * r, (w.rnd() - 0.5) * 1000, Math.sin(a) * r, 'pasture'); } }
  // ---- pens (spheres) ----
  if (w.game === 'time' && w.penNext < w.pens.length) {
    const p = w.pens[w.penNext]; let inside = 0;
    for (const s of w.sheep) if ((s.x - p.x) ** 2 + (s.y - p.y) ** 2 + (s.z - p.z) ** 2 < p.r * p.r) inside++;
    p.fill = w.sheep.length ? inside / w.sheep.length : 0;
    if (w.sheep.length && p.fill >= 0.6) { w.penNext++; w.fx.push({ k: 'pen', x: p.x, y: p.y, z: p.z, t: 0, r: p.r }); if (w.penNext >= w.pens.length) w.finishT = w.t; }
  }
  for (const f of w.fx) f.t += dt;
  w.fx = w.fx.filter((f) => f.t < 1.2);
  if (w.t >= SP.round || (w.game === 'time' && w.finishT != null)) w.done = true;
}

function dropDecoy(x, y, z, by) {
  SW.decoy = { x, y, z, by, t: SW.t };
  SW.stats.decoys++; if (by === 'pilot') SW.stats.pilotDecoys++;
  SW.fx.push({ k: 'decoy', x, y, z, t: 0 });
}

// The Grouper's two sticks (VesselTransformer): yaw = XSum, pitch = YSum, roll = YDiff, throttle = the spread.
// On top, the Rhino's straight-line ramp: a slope, not a switch (RampBoostActionSO).
function stepPilot(dt, pi) {
  const w = SW, p = w.pilot;
  if (p.off) return;
  const yaw = clamp(pi.yaw || 0, -1, 1), pitch = clamp(pi.pitch || 0, -1, 1), roll = clamp(pi.roll || 0, -1, 1), thr = clamp(pi.thr == null ? 0.5 : pi.thr, 0, 1);
  const dev = Math.max(Math.abs(yaw), Math.abs(pitch), Math.abs(roll));
  const straight = 1 - clamp((dev - SP.rhinoPlateau) / Math.max(1e-4, SP.rhinoGrace - SP.rhinoPlateau), 0, 1);
  const cruise = Math.max(SP.minSpeed, SP.rhinoCruise * thr);
  p.slowT = Math.max(0, p.slowT - dt);
  const slow = SP.dangerSlow > 0 ? 1 - p.slowT / SP.dangerSlow : 1;     // full stop at the hit, back over dangerSlow
  const target = Math.max(SP.minSpeed * slow, cruise * (1 + (SP.rhinoMaxBoost - 1) * straight) * slow);
  if (p.v < target) p.v = Math.min(target, p.v + SP.rhinoAccel * dt);
  else p.v = Math.max(target, p.v - (straight > 0 ? SP.rhinoBleed : SP.rhinoReturn) * dt);
  const rate = (p.v * SP.pilotRts + SP.pilotTurn) * Math.PI / 180, rrate = (p.v * SP.pilotRts + SP.pilotRoll) * Math.PI / 180;
  // yaw turns the nose toward the right wing; pitch lifts it toward up; roll drops the right wing (up leans right)
  let f = p.f, u = p.u, r = p.r;
  const a = yaw * rate * dt, b = pitch * rate * dt, c = roll * rrate * dt;
  f = vadd(vmul(f, Math.cos(a)), vmul(r, Math.sin(a)));
  const f2 = vadd(vmul(f, Math.cos(b)), vmul(u, Math.sin(b))); u = vsub(vmul(u, Math.cos(b)), vmul(f, Math.sin(b))); f = f2;
  r = vcross(u, f); u = vadd(vmul(u, Math.cos(c)), vmul(r, Math.sin(c)));
  let fr = frameFrom(f, u);
  // the cell wall turns the hull back in (the model's, not an input)
  const pos = v3(p.x, p.y, p.z), dist = vlen(pos);
  if (dist > SH_R) {
    const inward = vmul(pos, -1 / dist), ax = vcross(fr.f, inward), s = vlen(ax);
    if (s > 1e-4) { const k = vmul(ax, 1 / s), ang = Math.min(Math.acos(clamp(vdot(fr.f, inward), -1, 1)), rate * 1.5 * dt); fr = frameFrom(vrot(fr.f, k, ang), vrot(fr.u, k, ang)); }
  }
  p.f = fr.f; p.u = fr.u; p.r = fr.r;
  p.x += p.f.x * p.v * dt; p.y += p.f.y * p.v * dt; p.z += p.f.z * p.v * dt;
  // call (edge, long cooldown)
  p.callT = Math.max(0, p.callT - dt); p.callCd = Math.max(0, p.callCd - dt); p.teleCd = Math.max(0, p.teleCd - dt); p.hitCd = Math.max(0, p.hitCd - dt); p.selfCd = Math.max(0, p.selfCd - dt); p.decoyCd = Math.max(0, p.decoyCd - dt);
  if (pi.call && !w.prev.call && p.callCd <= 0) { p.callT = SP.callTime; p.callCd = SP.callCooldown; w.stats.calls++; w.fx.push({ k: 'call', x: p.x, y: p.y, z: p.z, t: 0 }); }
  w.prev.call = !!pi.call;
  // Time L5: the pilot drops THE decoy (the dogs' one decoy; a new one replaces the old) where it is
  if (pi.decoy && !w.prev.decoy && L5k('elTime') && p.decoyCd <= 0) { dropDecoy(p.x, p.y, p.z, 'pilot'); p.decoyCd = SP.decoyCooldown; }
  w.prev.decoy = !!pi.decoy;
  // teleport to the decoy (edge); the decoy is spent
  if (pi.tele && !w.prev.tele && w.decoy && p.teleCd <= 0) {
    const d = w.decoy;
    w.fx.push({ k: 'tele', x: p.x, y: p.y, z: p.z, t: 0, x2: d.x, y2: d.y, z2: d.z });
    p.x = d.x; p.y = d.y; p.z = d.z; p.teleCd = 0.6; w.stats.teleports++;
    w.decoy = null;
  }
  w.prev.tele = !!pi.tele;
}

// The board follows the hull (KiteNavigator.UpdateBoard): Eased toward the hull's x-z plane, Locked to it, or Level.
function stepBoard(dt) {
  const w = SW, p = w.pilot, b = w.board;
  if (p.off) { w.board = frameFrom(b.f, UPW); return; }
  const mode = Math.round(SP.frame);
  if (mode === 1) { w.board = { f: p.f, u: p.u, r: p.r }; return; }
  if (mode === 0) {
    const a = 1 - Math.exp(-SP.easeRate * dt);
    const f = vnorm(vadd(b.f, vmul(vsub(p.f, b.f), a))), u = vadd(b.u, vmul(vsub(p.u, b.u), a));
    w.board = frameFrom(f, u); return;
  }
  const fh = v3(p.f.x, 0, p.f.z);
  w.board = frameFrom(vlen(fh) > 0.15 ? fh : b.f, UPW);
}

function repellers() {
  const w = SW, R = SEL.ring(), out = [];
  if (!w.pilot.off && w.pilot.callT <= 0) out.push({ x: w.pilot.x, y: w.pilot.y, z: w.pilot.z, r: R });
  for (const d of w.dogs) if (!d.off) out.push({ x: d.x, y: d.y, z: d.z, r: R });
  if (w.decoy) out.push({ x: w.decoy.x, y: w.decoy.y, z: w.decoy.z, r: R });
  return out;
}

function stepSheep(dt) {
  const w = SW, S = w.sheep, U = w.board.u;
  if (w.phashDirty) { w.phash = shHash(w.prisms); w.phashDirty = false; }
  const hash = shHash(S), reps = repellers(), vmax0 = SP.sheepSpeed * SEL.speed(), p = w.pilot;
  const calling = !p.off && p.callT > 0;
  const atk = L5k('elCharge') && w.rivals.length;
  const born = [];
  for (const s of S) {
    let sx = 0, sy = 0, sz = 0, ax = 0, ay = 0, az = 0, cx = 0, cy = 0, cz = 0, n = 0;
    shQuery(hash, s.x, s.z, 160, (o) => {
      if (o === s) return;
      const dx = s.x - o.x, dy = s.y - o.y, dz = s.z - o.z, d2 = dx * dx + dy * dy + dz * dz;
      if (d2 > 160 * 160) return;
      const d = Math.sqrt(d2) || 1;
      if (d < 58) { const k = (58 - d) / 58 / d; sx += dx * k; sy += dy * k; sz += dz * k; }
      ax += o.vx; ay += o.vy; az += o.vz; cx += o.x; cy += o.y; cz += o.z; n++;
    });
    let g = v3(sx * 1.6, sy * 1.6, sz * 1.6);
    if (n) g = vadd(g, vadd(vmul(v3(ax / n, ay / n, az / n), 0.5 / vmax0), vmul(v3(cx / n - s.x, cy / n - s.y, cz / n - s.z), 0.6 / 160)));
    // the herders: a cylinder of repulsion round each, along the plane's normal (in-plane distance)
    let panic = 0;
    for (const r of reps) {
      let dv = v3(s.x - r.x, s.y - r.y, s.z - r.z); dv = vsub(dv, vmul(U, vdot(dv, U)));
      const d = vlen(dv);
      if (d < r.r) { const k = 1 - d / r.r; g = vadd(g, vmul(dv, 3.2 * k / (d || 1))); panic = Math.max(panic, k); }
    }
    if (calling) { let dv = v3(p.x - s.x, p.y - s.y, p.z - s.z); dv = vsub(dv, vmul(U, vdot(dv, U))); const d = vlen(dv) || 1; if (d > 30) g = vadd(g, vmul(dv, 2.6 / d)); panic = Math.max(panic, 0.5); }
    // Charge L5: a rival in range draws the flock in
    if (atk) { let best = null, bd = SP.attackRange; for (const r of w.rivals) if (r.out <= 0) { const d = Math.hypot(r.x - s.x, r.y - s.y, r.z - s.z); if (d < bd) { bd = d; best = r; } } if (best) { g = vadd(g, vmul(v3(best.x - s.x, best.y - s.y, best.z - s.z), 2.2 / bd)); panic = Math.max(panic, 0.6); } }
    // graze: an unafraid sheep wanders to the nearest edible prism it can sense (in 3D)
    s.eatCd -= dt;
    let gz = 0;
    if (panic < 0.5) {
      if (!s.tgt || !s.tgt.alive || !edibleFor(s.tgt)) {
        s.tgt = null; let bd = 130 * 130;
        if (s.eatCd <= 0) shQuery(w.phash, s.x, s.z, 130, (q) => { if (!edibleFor(q)) return; const d = (q.x - s.x) ** 2 + (q.y - s.y) ** 2 + (q.z - s.z) ** 2; if (d < bd) { bd = d; s.tgt = q; } });
      }
      if (s.tgt) { const dv = v3(s.tgt.x - s.x, s.tgt.y - s.y, s.tgt.z - s.z), d = vlen(dv) || 1; g = vadd(g, vmul(dv, 0.9 / d)); gz = vdot(dv, U) / d; }
    } else s.tgt = null;
    // wander (seeded per sheep, smooth), along the board
    s.ph += dt * (0.6 + s.roll * 0.8);
    g = vadd(g, vadd(vmul(w.board.r, Math.cos(s.ph * 1.7 + s.roll * 9) * 0.25), vmul(w.board.f, Math.sin(s.ph * 1.3 + s.roll * 5) * 0.25)));
    // the wall
    const rr = Math.hypot(s.x, s.y, s.z); if (rr > SH_R - 200) g = vadd(g, v3(-s.x / rr * 2, -s.y / rr * 2, -s.z / rr * 2));
    // steer along the plane; across it a spring pulls the sheep home to the plane
    const gn = vdot(g, U), gp = vsub(g, vmul(U, gn));
    const gm = vlen(gp), vmax = vmax0 * (1 + 0.8 * panic);
    const want = gm > 0.02 ? vmul(gp, vmax * Math.min(1, gm) / gm) : v3(0, 0, 0);
    const vel = v3(s.vx, s.vy, s.vz);
    let vn = vdot(vel, U); const vp = vsub(vel, vmul(U, vn));
    const ag = Math.min(1, 3 * dt);
    const vp2 = vadd(vp, vmul(vsub(want, vp), ag));
    const h = height(s);
    vn += (-h * SP.planePull - vn * 1.8 + (gn - gz * 0.9) * 40 + gz * 60 + Math.sin(s.ph * 2.1 + s.roll * 3) * 18) * dt;
    s.vx = vp2.x + U.x * vn; s.vy = vp2.y + U.y * vn; s.vz = vp2.z + U.z * vn;
    s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
    s.panic = panic; s.h = h;
    // eat on contact
    if (s.tgt && s.eatCd <= 0) {
      const q = s.tgt;
      if ((q.x - s.x) ** 2 + (q.y - s.y) ** 2 + (q.z - s.z) ** 2 < 22 * 22) {
        q.alive = false; w.phashDirty = true; s.tgt = null; s.eatCd = 0.9; s.fed++; w.stats.eaten++;
        if (q.kind === 'enemy') w.stats.enemyEaten++;
        if (s.fed >= SEL.meals()) { s.fed -= SEL.meals(); born.push(s); }
      }
    }
  }
  for (const s of born) { const l = addSheep(s.x + (w.rnd() - 0.5) * 20, s.y, s.z + (w.rnd() - 0.5) * 20); if (l) w.fx.push({ k: 'lamb', x: l.x, y: l.y, z: l.z, t: 0 }); }
  if (w.phashDirty) w.prisms = w.prisms.filter((q) => q.alive);
}

// The pilot flies into its own danger sheep: the existing collision mechanics. The sheep dies; the pilot takes the
// own-domain danger hit (full stop slow, ramp reset, every element debuffed for debuffTime, cooldown 1 s), and no
// permanent burn because the sheep is its own domain (Docs/claude/IMPACT_EFFECTS_AND_AUDIO.md, danger prisms).
function stepSelfHits() {
  const w = SW, p = w.pilot; if (p.off) return;
  for (let i = w.sheep.length - 1; i >= 0; i--) {
    const s = w.sheep[i];
    if (Math.abs(s.x - p.x) > 26 || Math.abs(s.z - p.z) > 26 || Math.abs(s.y - p.y) > 26) continue;
    if (!isDanger(s) || (s.x - p.x) ** 2 + (s.y - p.y) ** 2 + (s.z - p.z) ** 2 > 26 * 26) continue;
    w.sheep.splice(i, 1); w.stats.lost++; w.fx.push({ k: 'sting', x: s.x, y: s.y, z: s.z, t: 0 });
    if (p.selfCd <= 0) { p.selfCd = 1; w.stats.selfHits++; w.hits.push(w.t); p.slowT = SP.dangerSlow; p.v = Math.min(p.v, SP.minSpeed); w.fx.push({ k: 'hit', x: p.x, y: p.y, z: p.z, t: 0 }); }
  }
}

function stepRivalsSh(dt) {
  const w = SW; if (!w.rivals.length) return;
  const p = w.pilot, spd0 = 110 + 25 * SP.intensity;
  for (const r of w.rivals) {
    if (r.out > 0) { r.out -= dt; if (r.out <= 0) { r.petals = SH_RIVAL_PETALS; const a = w.rnd() * TAU; r.x = Math.cos(a) * 1800; r.y = (w.rnd() - 0.5) * 400; r.z = Math.sin(a) * 1800; } continue; }
    r.slow = Math.max(0, r.slow - dt); r.hitCd = Math.max(0, r.hitCd - dt); r.eatCd = Math.max(0, (r.eatCd || 0) - dt); r.re -= dt;
    // hunt: the pilot when it is near, else the nearest plain sheep (wolves eat the flock)
    if (r.re <= 0) {
      r.re = 0.5;
      const dp = p.off ? 1e9 : Math.hypot(p.x - r.x, p.y - r.y, p.z - r.z);
      let best = null, bd = 1e9; for (const s of w.sheep) { const d = Math.hypot(s.x - r.x, s.y - r.y, s.z - r.z) + (isDanger(s) ? 400 : 0); if (d < bd) { bd = d; best = s; } }
      if (dp < 700 || !best) { r.tx = p.x; r.ty = p.y; r.tz = p.z; } else { r.tx = best.x; r.ty = best.y; r.tz = best.z; }
    }
    const spd = spd0 * (r.slow > 0 ? 0.35 : 1), dx = r.tx - r.x, dy = r.ty - r.y, dz = r.tz - r.z, d = Math.hypot(dx, dy, dz) || 1, k = Math.min(1, 2 * dt);
    r.vx += (dx / d * spd - r.vx) * k; r.vy += (dy / d * spd - r.vy) * k; r.vz += (dz / d * spd - r.vz) * k;
    r.x += r.vx * dt; r.y += r.vy * dt; r.z += r.vz * dt;
    // ram the pilot
    if (!p.off && p.hitCd <= 0 && Math.hypot(p.x - r.x, p.y - r.y, p.z - r.z) < 30) { p.hitCd = 1.5; if (p.petals > 0) { p.petals--; r.petals++; w.stats.petalsLost++; } w.fx.push({ k: 'hit', x: p.x, y: p.y, z: p.z, t: 0 }); }
    // touch sheep: danger sheep sting (a petal and a slow) and are spent; plain sheep get eaten (Charge L5: they nip first)
    for (let i = w.sheep.length - 1; i >= 0 && r.eatCd <= 0; i--) {
      const s = w.sheep[i];
      if (Math.abs(s.x - r.x) > 26 || Math.abs(s.z - r.z) > 26 || Math.abs(s.y - r.y) > 26) continue;
      if (isDanger(s)) { r.debt += 1; r.slow = 1.5; w.stats.dangerHits++; }
      else if (L5k('elCharge')) r.debt += 0.34;
      r.eatCd = 1.2; w.sheep.splice(i, 1); w.stats.lost++; w.fx.push({ k: isDanger(s) ? 'sting' : 'eaten', x: s.x, y: s.y, z: s.z, t: 0 });
    }
    if (r.debt >= 1) { const n = Math.floor(r.debt); r.debt -= n; const take = Math.min(n, r.petals); r.petals -= take; p.petals += take; w.stats.petalsTaken += take; if (r.petals <= 0) { r.out = 5; w.stats.ko++; w.fx.push({ k: 'ko', x: r.x, y: r.y, z: r.z, t: 0 }); } }
  }
}

function shepScore() {
  const w = SW, s = w.stats;
  if (w.game === 'time') return w.penNext * 10 + (w.finishT != null ? Math.max(0, Math.round(SP.round - w.finishT)) : 0);
  if (w.game === 'space') return s.enemyEaten;
  if (w.game === 'mass') return s.born + w.prisms.filter((q) => q.kind === 'jade').length;
  return s.petalsTaken - s.petalsLost + 3 * s.ko;
}

// ================= (5) the AI crews: inputs only =================
// Where the flock should go, in 3D (a pen, the fort, a rival, the nearest pasture).
function shTarget() {
  const w = SW, F = flockStats().w;
  if (w.game === 'time') { const p = w.pens[Math.min(w.penNext, w.pens.length - 1)]; return v3(p.x, p.y, p.z); }
  if (w.game === 'charge') { let best = null, bd = 1e9; for (const r of w.rivals) if (r.out <= 0) { const d = Math.hypot(r.x - F.x, r.y - F.y, r.z - F.z); if (d < bd) { bd = d; best = r; } } if (best) return v3(best.x, best.y, best.z); }
  if (w.game === 'space' && w.fort) {
    let any = false; for (const q of w.prisms) if (q.kind === 'enemy' && edibleFor(q)) { any = true; break; }
    if (any) return v3(w.fort.x, w.fort.y, w.fort.z);
  }
  let best = null, bd = 1e9;
  for (const q of w.prisms) { if (!edibleFor(q)) continue; const d = Math.hypot(q.x - F.x, q.y - F.y, q.z - F.z); if (d > 150 && d < bd) { bd = d; best = q; } }

}
// The point behind the flock (seen from the target) — Strombom's driving position, in board coordinates.
function drivePoint(F, T, back) { let ux = T.x - F.x, uz = T.z - F.z; const L = Math.hypot(ux, uz) || 1; ux /= L; uz /= L; return { x: F.x - ux * back, z: F.z - uz * back, ux, uz }; }

function shAI(role) {
  const w = SW, F = flockStats(), T3 = shTarget(), T = toB(T3), R = SEL.ring(), nz = SP.aiNoise;
  const out = { pilot: { yaw: 0, pitch: 0, roll: 0, thr: 0.5, call: false, tele: false, decoy: false }, dogs: [{ down: true, x: w.dogs[0].x, y: w.dogs[0].y, z: w.dogs[0].z }, { down: true, x: w.dogs[1].x, y: w.dogs[1].y, z: w.dogs[1].z }] };

  w.ai.noiseT -= adt;

    const far = F.far, spread = F.r;

    out.pilot.thr = dist > 600 ? 1 : 0.5;

    out.pilot.call = F.r > 200 && p.callCd <= 0 && Math.hypot(F.w.x - p.x, F.w.y - p.y, F.w.z - p.z) < 900;
    // Time L5: on station with no decoy down, leave one to come back to
    w.ai.decoyT -= adt;
    if (L5k('elTime') && !w.decoy && dist < 260 && w.ai.decoyT <= 0) { out.pilot.decoy = !w.prev.decoy; w.ai.decoyT = 6; }

  }
  return out;
}

  return record('shepherd:' + settings.game, choice, (note ? note + ' ' : '') + JSON.stringify(settings));
}

// ---- the settings sheet ----
function toggleSheet(open) {
  shepState.sheet = open == null ? !shepState.sheet : open;
  $('shepSheet').hidden = !shepState.sheet; $('shepMore').setAttribute('aria-expanded', String(shepState.sheet));
  if (shepState.sheet) buildSheet();
}
function buildSheet() {
  const box = $('shepSheet'); box.replaceChildren();
  const head = el('div', 'head'); head.appendChild(el('h2', '', SHEP_NAME + ' settings')); const x = el('button', 'btn', 'Close'); x.onclick = () => toggleSheet(false); head.appendChild(x); box.appendChild(head);
  const g = SHEP_GAMES.find((v) => v.id === shepState.game), r = SHEP_ROLES.find((v) => v.id === shepState.role);
  box.appendChild(el('p', 'hint', g.how)); box.appendChild(el('p', 'hint', r.how));
  const nd = Object.keys(shepDiff()).length; box.appendChild(el('p', nd ? 'status-warn' : 'hint', nd ? nd + ' setting(s) differ from shipped / round-3 defaults (underlined).' : 'All settings at their shipped / round-3 values.'));
  let grp = '';
  for (const [group, key, lo, hi, step, label, tip] of SHEP_SPEC) {
    if (group !== grp) { grp = group; box.appendChild(el('h2', 'sec', group)); }
    const row = el('div', 'row'), lab = el('label'), out = el('output'), inp = document.createElement('input');
    lab.appendChild(el('span', '', label)); if (group === 'Elements' && SP[key] >= 5) lab.appendChild(el('span', 'el5', 'L5'));
    inp.type = 'range'; inp.min = lo; inp.max = hi; inp.step = step; inp.value = SP[key]; inp.id = 'shep-' + key; inp.setAttribute('aria-label', label);
    const show = () => { out.textContent = key === 'frame' ? FRAME_NAMES[Math.round(SP[key])] : fmt(SP[key], step); out.classList.toggle('changed', Math.abs(SP[key] - SHEP_SHIPPED[key]) > 1e-9); out.title = 'shipped ' + SHEP_SHIPPED[key] + ' · yours ' + SP[key]; };
    inp.oninput = () => { SP[key] = +inp.value; lsSet(SHEP_LS, shepDiff()); show(); if (key === 'sheep' || key === 'intensity') shepReset(); if (group === 'Elements') { lab.querySelector('.el5') && lab.querySelector('.el5').remove(); if (SP[key] >= 5) lab.appendChild(el('span', 'el5', 'L5')); } };
    show(); row.append(lab, out, inp, el('div', 'tip', tip)); box.appendChild(row);
  }
  const tb = el('label', 'flex'); const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'shepThumb'; cb.checked = shepState.showThumb; cb.onchange = () => { shepState.showThumb = cb.checked; }; tb.append(cb, el('span', '', 'Show the big-thumb disc under a held dog'));
  box.appendChild(tb);
  const vb = el('label', 'flex'); const vc = document.createElement('input'); vc.type = 'checkbox'; vc.id = 'shepNorth'; vc.checked = shepState.view === 'north'; vc.onchange = () => { shepState.view = vc.checked ? 'north' : 'heading'; lsSet('lab:' + LAB.name + ':shepView', shepState.view); }; vb.append(vc, el('span', '', 'North up (off: heading up, as the Wrasse\'s kite view)'));
  box.appendChild(vb);
  const rs = el('button', 'btn', 'Back to shipped / round-3 values'); rs.onclick = () => { Object.assign(SP, SHEP_SHIPPED); lsSet(SHEP_LS, {}); buildSheet(); shepReset(); }; box.appendChild(el('p')).appendChild(rs);
  // scorecard
  box.appendChild(el('h2', 'sec', 'Scorecard (AI crews, 30 s, seeds 1-2)'));
  box.appendChild(el('p', 'hint', 'Each row plays all four games with the AI pilot and AI dogs. Pilot only and Dogs only are the baselines; Level plane is round 2\'s flat plane, so the gap to the crew row is what rolling the plane is worth. Your current settings are the starting point for every row.'));
  const run = el('button', 'btn primary', 'Run scorecard'); const tw = el('div', 'tblWrap');
  run.onclick = () => {
    run.disabled = true; shepState.batch = []; let i = 0;
    (function next() {   // one row per task, so the page stays alive on a phone
      if (i >= SHEP_ROWS.length) { run.disabled = false; run.textContent = 'Run again'; return; }
      run.textContent = 'Running ' + (i + 1) + '/' + SHEP_ROWS.length + '...';
      shepState.batch.push(shepBatch({ seeds: [1, 2], rows: [SHEP_ROWS[i++]] })[0]); drawBatch(tw); setTimeout(next, 0);
    })();
  };
  box.appendChild(run); box.appendChild(tw); if (shepState.batch) drawBatch(tw);
  // decisions
  box.appendChild(el('h2', 'sec', 'Your call'));
  const ta = document.createElement('textarea'); ta.id = 'shepNote'; ta.placeholder = 'What felt right or wrong? (saved with the game, role and settings)'; box.appendChild(ta);
  const row = el('div', 'flex');
  for (const [c, lbl] of [['keep', 'Keep'], ['change', 'Keep, with changes'], ['cut', 'Cut']]) { const b = el('button', 'btn', lbl); b.onclick = async () => { const where = await shepRecord(c, ta.value); ta.value = ''; shToast(where === 'shared' ? 'Recorded in the shared log.' : 'Recorded in this browser.'); }; row.appendChild(b); }
  box.appendChild(row);
  box.appendChild(el('p', 'hint', db ? 'Shared log: Claude reads it next round.' : 'Kept in this browser until the shared log connects.'));
  // not modelled
  box.appendChild(el('h2', 'sec', 'What this does NOT model'));
  const ul = el('ul');
  for (const t of [
    'One screen for both crews. In the game the pilot and the dog player have their own screens; here the dog view (the Wrasse\'s top-down kite view) is shown for both.',
    'The thumb floor uses a nominal phone (6.3 CSS px per mm, 390 px tall in landscape). Real phones differ by about 15%.',
    'The pilot flies the Grouper\'s two-stick axes and turn rates with the Rhino\'s speed and straight-line ramp, but not the Rhino\'s sword, shield swipe or trail. Time does not speed its ramp here (Time is the flock\'s).',
    'The danger hit\'s element debuff is modelled as levels off every element, decaying over 4 s (the lab\'s reading of the shipped -0.5 magnitude). It is real here: it lowers Charge, so it briefly thins the danger share too.',
    'Depth from the plane is drawn as fading and size, not the game\'s face spread and dither cone.',
    'Repulsion is a cylinder along the plane\'s normal round each herder, so it reads from above; sheep far off the plane still flee.',
    'Sheep are not prisms with colliders. 180 of them would need the drone path (vessel agents, never lifeforms).',
    'Rivals are scripted wolves, not players. No networking, so no latency between the dog player and the pilot.',
    'The AI crew is a heuristic (Strombom-style drive and collect; the AI pilot rolls toward the plane through itself, the flock and the target). Treat a gap under ~10% as noise.',
  ]) ul.appendChild(el('li', 'hint', t));
  box.appendChild(ul);
}
function drawBatch(tw) {
  const t = el('table'), cols = SHEP_GAMES.map((g) => g.id), best = {};
  for (const c of cols) best[c] = Math.max(...shepState.batch.map((r) => r[c]));
  const hr = el('tr'); hr.appendChild(el('th', '', 'Build')); for (const g of SHEP_GAMES) hr.appendChild(el('th', '', g.el[0].toUpperCase() + g.el.slice(1))); t.appendChild(hr);
  for (const r of shepState.batch) { const tr = el('tr'); tr.appendChild(el('td', '', r.name)); for (const c of cols) { const td = el('td', r[c] === best[c] && r[c] > 0 ? 'best' : '', String(r[c])); tr.appendChild(td); } t.appendChild(tr); }
  tw.replaceChildren(t);
}

$('shepBack').onclick = shepClose;
$('shepRestart').onclick = () => shepReset();
$('shepPause').onclick = shepPause;
$('shepMore').onclick = () => toggleSheet();
$('shepGame').onchange = () => { shepState.game = $('shepGame').value; lsSet('lab:' + LAB.name + ':shepGame', shepState.game); shepReset(); if (shepState.sheet) buildSheet(); shToast(SHEP_GAMES.find((g) => g.id === shepState.game).how); };
$('shepRole').onchange = () => { shepState.role = $('shepRole').value; lsSet('lab:' + LAB.name + ':shepRole', shepState.role); for (const d of shIn.dogs) d.down = false; touches.clear(); if (shepState.sheet) buildSheet(); shToast(SHEP_ROLES.find((r) => r.id === shepState.role).how); };
addEventListener('resize', () => { if (shepOn) shepResize(); });

// the lab header gets the door in; #shepherd on the link opens straight into it
{
  const b = el('button', 'btn primary', SHEP_NAME); b.id = 'shepOpen'; b.title = 'Round 3: the pilot, two dogs and a flock (the Shepherd)';
  $('platform').before(b); b.onclick = shepOpen;
  if (location.hash === '#shepherd') setTimeout(shepOpen, 0);
}
shepWorld(1, shepState.game);

// the test surface
window.__lab.shep = {
  SHIPPED: SHEP_SHIPPED, SPEC: SHEP_SPEC, P: SP, GAMES: SHEP_GAMES, ROWS: SHEP_ROWS,
  open: shepOpen, close: shepClose,
  set manualClock(v) { shepState.manual = !!v; }, get manualClock() { return shepState.manual; },
  reset: (seed, game) => { if (game) { shepState.game = game; $('shepGame').value = game; } shepReset(seed); },
  tick(dt, n) { n = n || 1; for (let i = 0; i < n; i++) shepStep(dt || 1 / 60, liveInputFor()); camUpdate(0); shepRender(); },
  input: (o) => { if (o.pilot === null) shTestPilot = null; else if (o.pilot) shTestPilot = Object.assign(shTestPilot || { yaw: 0, pitch: 0, roll: 0, thr: 0.5 }, o.pilot); if (o.dogs) o.dogs.forEach((d, k) => Object.assign(shIn.dogs[k], d)); },
  toPlane, proj: (x, y, z) => proj(x, y, z), view: (v) => { if (v) shepState.view = v; return shepState.view; },
  run: shepRun, runBatch: shepBatch, score: () => shepScore(),
  state: () => ({ t: SW.t, game: SW.game, sheep: SW.sheep.length, score: shepScore(), ring: SEL.ring(), floor: SEL.floorU(), danger: SEL.danger(), decoy: SW.decoy ? { x: SW.decoy.x, y: SW.decoy.y, z: SW.decoy.z, by: SW.decoy.by } : null, pilot: { x: SW.pilot.x, y: SW.pilot.y, z: SW.pilot.z, v: SW.pilot.v, callT: SW.pilot.callT, callCd: SW.pilot.callCd, decoyCd: SW.pilot.decoyCd, slowT: SW.pilot.slowT, up: SW.pilot.u }, board: { up: SW.board.u, tilt: Math.acos(clamp(SW.board.u.y, -1, 1)) * 180 / Math.PI }, deb: SW.deb, dogs: SW.dogs.map((d) => ({ x: d.x, y: d.y, z: d.z, down: d.down, h: height(d) })), stats: Object.assign({}, SW.stats), done: SW.done }),
};

})();
</script>
