    const t = el('table'); t.innerHTML = '<tr><th>Creature</th><th>How</th><th class="num">prisms</th><th class="num">wires</th><th class="num">heart</th><th class="num">attack limbs</th><th class="num">numbers</th></tr>';
    for (const r of R.rows) { const tr = document.createElement('tr'); for (const [v, cls] of [[r.name], [r.how], [r.prisms.toFixed(5), 'num'], [r.wires.toFixed(5), 'num'], [r.heart.toFixed(5), 'num'], [r.limbs.toFixed(5), 'num'], [r.numbers.toFixed(5), 'num']]) tr.appendChild(el('td', cls, v)); t.appendChild(tr); }
    box.appendChild(t);
    box.appendChild(el('h3', null, 'The celestial laws each shipped body breaks (the redesign list, a report)'));
    for (const id of Object.keys(DATA.laws)) { box.appendChild(el('p', 'hint', (DEF[id] ? DEF[id].name : id) + ': ' + (DATA.laws[id].length ? DATA.laws[id].join(' · ') : 'none'))); }
    return box;
  }
  function aboutPanel() {
    const box = el('div');
    box.appendChild(el('p', null, LAB.name + ' · round ' + LAB.round + ' · ' + LAB.branch + ' · write-up: ' + LAB.doc));
    box.appendChild(el('p', 'hint', 'Controls. Keyboard: W/S pitch, A/D yaw, Q/E roll, Shift slow, Space or J = RT, F or K = LT, X = A (leave), [ and ] = previous / next creature. Pad: both sticks together pitch and yaw, one up one down rolls, apart is faster; RT, LT, A. Phone: two thumbs on the stage, and the RT / LT / A buttons.'));
    box.appendChild(el('p', 'hint', 'What this lab does NOT model: the game\'s look (colours here are stand-ins, wires are drawn as lines, no sway, no element erosion on Space); a real rival hull (the vessel is a stand-in pilot at a speed you set) and its petals (a strike is counted, not drained); the Ark\'s model, course and danger contact (its 108 sockets are laid on an ellipsoid of its measured size and regrow one every 2 s as in the game); collisions between a host and anything; the host\'s starvation clock, its stomach and its offspring; a LightFauna\'s mouth reach growing with its body girth; the murmuration; multiplayer. New creatures\' own moves (the Marlin\'s charge, the Basker\'s funnel, the Teredo\'s bore, the Nautilus\'s pulse, the Medusa\'s body radius, every turn rate) are proposals: nothing in the game has them yet.'));
    return box;
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Scorecard', build: scorecardPanel }, { name: 'Recreation', build: recreationPanel }, { name: 'Decisions', build: logPanel }, { name: 'About', build: aboutPanel }], 'lab:' + LAB.name + ':bottom');

  $('title').textContent = LAB.name; $('meta').textContent = 'round ' + LAB.round + ' · ' + DEFS.filter((d) => d.origin === 'shipped').length + ' shipped, ' + DEFS.filter((d) => d.origin === 'new').length + ' new';
  let paused = false;
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); lsSet(LS_KEY, {}); for (const k in outputs) outputs[k].inp.value = P[k]; reset(); refreshDiff(); };

  // ================= devices: all three write the one input object =================
  const keys = {};
  addEventListener('keydown', (e) => { if (/INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '')) return; keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); if (e.code === 'BracketRight' || e.code === 'BracketLeft') { const i = DEFS.findIndex((d) => d.id === sel.creature), n = DEFS.length; sel.creature = DEFS[(i + (e.code === 'BracketRight' ? 1 : n - 1)) % n].id; lsSet('lab:fauna:creature', sel.creature); reset(); showDock('Creatures'); } });
  addEventListener('keyup', (e) => { keys[e.code] = false; });
  const touch = { l: null, r: null, rt: false, lt: false, a: false };
  function readDevices() {
    let xs = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), ys = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), yd = (keys.KeyE ? 1 : 0) - (keys.KeyQ ? 1 : 0), xd = (keys.ShiftLeft || keys.ShiftRight) ? 0 : 1;
    let rt = !!(keys.Space || keys.KeyJ), lt = !!(keys.KeyF || keys.KeyK), a = !!keys.KeyX;
    try { const pads = navigator.getGamepads ? navigator.getGamepads() : []; for (const p of pads) { if (!p) continue; const dz = (v) => Math.abs(v) < 0.15 ? 0 : v, lx = dz(p.axes[0] || 0), ly = -dz(p.axes[1] || 0), rx = dz(p.axes[2] || 0), ry = -dz(p.axes[3] || 0);   // pad Y is inverted against up = +y
      if (lx || ly || rx || ry) { xs = (lx + rx) / 2; ys = (ly + ry) / 2; xd = clamp01(0.5 + (rx - lx) / 2 + 0.5 * (1 - Math.min(1, Math.abs(lx) + Math.abs(rx)))); yd = (ry - ly) / 2; }
      rt = rt || (p.buttons[7] && p.buttons[7].value > 0.3); lt = lt || (p.buttons[6] && p.buttons[6].value > 0.3); a = a || (p.buttons[0] && p.buttons[0].pressed); break; } } catch (e) { /* the viewer may block the Gamepad API */ }
    if (touch.l || touch.r) { const L = touch.l || { x: 0, y: 0 }, R = touch.r || { x: 0, y: 0 }; xs = (L.x + R.x) / (touch.l && touch.r ? 2 : 1); ys = (L.y + R.y) / (touch.l && touch.r ? 2 : 1); yd = touch.l && touch.r ? (R.y - L.y) / 2 : 0; xd = 1; }
    input.xSum = Math.max(-1, Math.min(1, xs)); input.ySum = Math.max(-1, Math.min(1, ys)); input.yDiff = yd; input.xDiff = xd; input.rt = rt || touch.rt; input.lt = lt || touch.lt; input.a = a || touch.a;
  }
  (function touchUI() {
    const wrap = $('stageWrap'), layer = $('touch'); if (PLATFORM.device !== 'phone') return; layer.hidden = false;
    const mk = (label, right, key) => { const b = el('div', 'tb', label); b.style.right = right + 'px'; b.addEventListener('pointerdown', (e) => { touch[key] = true; e.stopPropagation(); e.preventDefault(); }); const up = (e) => { touch[key] = false; e.stopPropagation(); }; b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up); layer.appendChild(b); };
    mk('RT', 14, 'rt'); mk('LT', 86, 'lt'); mk('A', 158, 'a');
    const sticks = {};
    wrap.addEventListener('pointerdown', (e) => { if (e.target.classList.contains('tb')) return; const r = wrap.getBoundingClientRect(), side = e.clientX - r.left < r.width / 2 ? 'l' : 'r'; sticks[e.pointerId] = { side, x0: e.clientX, y0: e.clientY }; touch[side] = { x: 0, y: 0 }; });
    wrap.addEventListener('pointermove', (e) => { const s = sticks[e.pointerId]; if (!s) return; touch[s.side] = { x: Math.max(-1, Math.min(1, (e.clientX - s.x0) / 60)), y: Math.max(-1, Math.min(1, -(e.clientY - s.y0) / 60)) }; });
    const end = (e) => { const s = sticks[e.pointerId]; if (!s) return; touch[s.side] = null; delete sticks[e.pointerId]; };
    wrap.addEventListener('pointerup', end); wrap.addEventListener('pointercancel', end);
  })();

  // ================= sizing + loop =================
  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1), w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; over.width = w; over.height = h; } }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) { resize(); if (!paused) { readDevices(); simStep(dt, input); } render(); }
    requestAnimationFrame(frame);
  }
  initGL(); reset(1); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  // ================= the test surface =================
  window.__lab = {
    LAB, SHIPPED, SPEC, P, PLATFORM, DATA, GAMES, input,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n, inp) { n = n || 1; for (let i = 0; i < n; i++) simStep(dt || 1 / 60, inp || input); resize(); render(); },
    reset, score, runBatch, playGame, setParam, record,
    select(creature, element, target) { if (creature) sel.creature = creature; if (element) sel.element = element; if (target) sel.target = target; reset(); showDock('Creatures'); },
    leave() { leave(); },
    state: () => ({ t: world.t, seed, mode: world.mode, host: world.host ? world.host.def.id : null, speed: world.host ? world.host.speed : 0, pos: world.host ? world.host.pos.slice() : world.wasp.pos.slice(), score: score() }),
  };
})();
