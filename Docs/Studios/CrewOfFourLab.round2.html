<!doctype html>
<!--
  CREW OF FOUR LAB - a /labmaker browser studio (round 2: 3D, with the game's chase camera; round 1's 2D page is CrewOfFourLab.round1.html).
  The question: what four-seat multiplayer vessel captures the magic of Wildgate (Moonshot Games, 2025:
  crews of four share one ship, fly / shoot / repair / board, and race the Artifact out through the Wildgate)
  inside Cosmic Shore's rules (petals are the only PvP currency, LOCKED 2026-10-10).
  One 3D model (a spherical arena; yaw, pitch and roll), five crew concepts, four element games (Time race, Space destruction, Mass creation, Charge dogfight),
  each at I1-I4 against Easy / Medium / Hard rival crews, and a scorecard of the Wildgate qualities.
  Source of truth: this file. Write-up: Docs/Studios/CREW_OF_FOUR_LAB.md. Verify:
    node .claude/skills/labmaker/verify_lab.cjs Docs/Studios/CrewOfFourLab.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crew of Four Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Layout: an editor - stage (the Reach, north-up, following our hull) + right dock (concepts, dials) + bottom dock (scorecard, decisions). */
  :root {
    --bg: #edf1f3; --panel: #fbfcfd; --ink: #13202a; --muted: #576976; --line: #d3dce2;
    --accent: #0a8a84; --accent-ink: #ffffff; --warn: #a65208; --ok: #1d7543; --changed: #0a6fd0;
    --stage: #050b10; --chip: #e2e9ed;
    --f-display: 'Saira Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
    --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a1117; --panel: #0f1920; --ink: #e2ecf1; --muted: #8aa0ad; --line: #1f2f3a;
      --accent: #13fff2; --accent-ink: #04211f; --warn: #f0a050; --ok: #5cd08e; --changed: #7cc0ff;
      --stage: #03080c; --chip: #18262f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a1117; --panel: #0f1920; --ink: #e2ecf1; --muted: #8aa0ad; --line: #1f2f3a;
    --accent: #13fff2; --accent-ink: #04211f; --warn: #f0a050; --ok: #5cd08e; --changed: #7cc0ff;
    --stage: #03080c; --chip: #18262f; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--f-body); overflow: hidden; }
  #app { display: grid; height: 100%; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr) 230px; grid-template-areas: "head head" "stage dock" "bottom dock"; }
  header { grid-area: head; display: flex; gap: 6px 10px; align-items: center; padding: 6px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font: 700 19px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  #diff { color: var(--changed); font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-right: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 3px 8px; font: 600 12px var(--f-body); cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .lbl { font: 600 10px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px; }
  #stageWrap { grid-area: stage; position: relative; min-height: 0; background: var(--stage); overflow: hidden; touch-action: none; }
  #stage, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { touch-action: none; cursor: crosshair; }
  #toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(6,16,22,.88); color: #e8fffd; border: 1px solid #13fff2; border-radius: 6px; padding: 4px 12px; font: 12px var(--f-mono); pointer-events: none; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
  #actBtns { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 8px; }
  #actBtns button { font: 700 14px var(--f-display); letter-spacing: .06em; text-transform: uppercase; padding: 8px 14px; border-radius: 8px; border: 1px solid #13fff2; background: rgba(4,30,32,.8); color: #d9fffd; cursor: pointer; }
  #dock { grid-area: dock; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px 14px 16px; }
  #bottom { grid-area: bottom; border-top: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 6px 16px 10px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .tabs button, .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 3px 9px; cursor: pointer; font: 600 12px var(--f-body); }
  .tabs button[aria-selected="true"], .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--changed); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 64px; gap: 2px 8px; margin: 7px 0; }
  .row label { display: flex; gap: 6px; align-items: baseline; }
  .row label .key { color: var(--muted); font: 11px var(--f-mono); }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; }
  .row output { text-align: right; font: 12px var(--f-mono); }
  .row output.changed { color: var(--changed); text-decoration: underline; }
  .row .tip { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .row.bool { grid-template-columns: auto 1fr 64px; align-items: baseline; }
  .row.bool .tip { grid-column: 2 / -1; }
  .cards { display: grid; gap: 8px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; background: var(--panel); text-align: left; color: var(--ink); font: inherit; }
  .card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .card h3 { margin: 0 0 2px; font: 700 16px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }
  .card .seats { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0; }
  .chip { font: 600 11px var(--f-mono); background: var(--chip); border-radius: 4px; padding: 1px 6px; }
  .card p { margin: 2px 0; color: var(--muted); font-size: 12px; }
  .card .ctl { color: var(--warn); font: 600 10px var(--f-body); letter-spacing: .08em; text-transform: uppercase; }
  table { border-collapse: collapse; width: 100%; font: 12px var(--f-mono); }
  th, td { text-align: right; padding: 2px 7px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font: 600 11px var(--f-body); color: var(--muted); }
  .tblwrap { overflow-x: auto; }
  .best { font-weight: 700; color: var(--ok); }
  .hint { color: var(--muted); font-size: 12px; }
  .status-ok { color: var(--ok); } .status-warn { color: var(--warn); }
  textarea, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .prose { max-width: 70ch; }
  .prose h4 { font: 700 14px var(--f-display); letter-spacing: .05em; text-transform: uppercase; margin: 10px 0 2px; }
  .prose p, .prose li { margin: 3px 0; }
  .prose ul { padding-left: 18px; margin: 4px 0; }
  kbd { font: 11px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
  @media (max-width: 900px) {
    body { overflow: auto; }
    #app { display: block; height: auto; }
    header { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    #stageWrap { aspect-ratio: 4 / 5; max-height: 74vh; width: 100%; }
    #dock, #bottom { border: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    #bottom { max-height: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">Crew of Four Lab</h1>
    <span class="meta" id="meta"></span>
    <span id="diff"></span>
    <span class="spacer"></span>
    <span class="lbl">Game</span><select id="gameSel" aria-label="Game"></select>
    <span class="seg" id="intSeg" aria-label="Intensity"></span>
    <span class="lbl">Rivals</span><select id="diffSel" aria-label="Rival difficulty"><option value="0">Easy</option><option value="1">Medium</option><option value="2" selected>Hard</option></select>
    <span class="lbl">Seat</span><span class="seg" id="seatSeg" aria-label="Your seat"></span>
    <button class="btn" id="camBtn" title="Chase camera or a view of the whole arena (C)">Chase cam</button>
    <button class="btn" id="restart">Restart</button>
    <button class="btn" id="pause">Pause</button>
    <button class="btn" id="resetAll" title="Put every dial back to the shipped / round-1 numbers">Shipped</button>
    <span class="meta" id="platform"></span>
  </header>
  <div id="stageWrap"><canvas id="stage"></canvas><canvas id="overlay"></canvas><div id="toast" hidden></div><div id="actBtns"><button id="actBtn" hidden>Ward</button></div></div>
  <aside id="dock"><div class="tabs" id="dockTabs" role="tablist"></div><div id="dockBody"></div></aside>
  <section id="bottom"><div class="tabs" id="bottomTabs" role="tablist"></div><div id="bottomBody"></div></section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);

  // ================= (1) LAB meta + the shipped numbers =================
  // A READER of the shipped numbers: every constant names the asset / class field it was copied from.
  // "lab" marks a proposal with no game field yet (the four-seat hull does not exist in the game).
  const LAB = { name: 'Crew of Four Lab', branch: 'cece/happy-noether-m54hz6', round: 2, doc: 'Docs/Studios/CREW_OF_FOUR_LAB.md' };
  const SHIPPED = {
    // Hull: the Sparrow's flight numbers (Assets/_Prefabs/Spacevessels/Sparrow.prefab), scaled for a four-seat hull
    minSpeed: 10,        // VesselTransformer.DefaultMinimumSpeed
    throttleScaler: 25,  // VesselTransformer.DefaultThrottleScaler (cruise 35 u/s)
    boostMul: 5,         // VesselStatus.boostMultiplier (the throttle term x5 while boosting)
    yawRate: 80,         // VesselTransformer.YawScaler (deg/s)
    pitchRate: 80,       // VesselTransformer.PitchScaler (deg/s)
    rollRate: 30,        // VesselTransformer.RollScaler (deg/s)
    hullSpeedMul: 0.85,  // lab: a four-seat hull flies at this share of the Sparrow's speed
    hullTurnMul: 0.55,   // lab: and turns at this share of its yaw rate
    hullRadius: 9,       // lab: hull contact radius (u)
    boostTank: 2.5,      // lab: seconds of boost the tank holds at Time 0
    // Trail prisms: Sparrow VesselPrismController
    prismW: 2,           // BaseScale.x
    prismL: 5,           // BaseScale.z
    wavelength: 7,       // initialWavelength: one prism per 7 u flown
    trailCap: 90,        // lab: trail prisms kept per hull at Mass 0 (+4 per Mass level)
    // Elements: petals are element levels, ElementalBarsConfigSO.MinLevel -5 .. MaxLevel 15 (PetalCount 5)
    startLevel: 3,       // lab: each hull's level in every element at spawn
    kTime: 0.6, kSpace: 0.8, kMass: 0.8, kCharge: 0.8,   // lab: an element's effect at level 15 is 1 + k
    // Crew
    walkTime: 2.5,       // lab: seconds to cross the deck from one station to another
    swapCooldown: 0.75,  // PilotSwap.CooldownSeconds (the shortest seat change, a console swap)
    reassign: 0.8,       // lab: an AI crew re-plans its stations this often (s)
    // Ward: the hull's shield. It keeps petals, so a bolt on it scores nothing (CombatHitDrain wards)
    wardHits: 4,         // lab: bolts the ward absorbs at Mass 0
    wardPerMass: 0.34,   // lab: extra hits per Mass level
    wardRegen: 0.5,      // lab: hits regained per second while the Core is manned
    wardRegenIdle: 0.12, // lab: ... with nobody at a Core
    wardBreakCd: 5,      // lab: seconds a broken ward stays down
    wardSpeed: 0.35,     // lab: speed bonus with the ward down (Wildgate: +35% base speed with shields lowered)
    wardGuns: 1,         // lab rule: your own ward blocks your guns, so firing means dropping it (the Wildgate gamble)
    // Guns
    fireRate: 1.6,       // lab: shots per second at Space 0
    boltSpeed: 260,      // lab (u/s)
    boltRange: 230,      // lab (u)
    turretTurn: 220,     // lab (deg/s)
    // Core
    refine: 1,           // lab rule: crystals land in the hold and only a manned Core turns them into petals
    refineTime: 1.2,     // lab: seconds per crystal refined
    forgeCost: 2,        // lab: hold crystals spent to forge one prism block
    forgePrisms: 8,      // lab: prisms in a forged block
    // Skiff: the boarder's craft
    skiffSpeed: 95,      // lab (u/s at Charge 0)
    boardDrain: 0.8,     // lab: petals per second a boarder siphons into its bag
    bagMax: 6,           // lab: petals a skiff's bag holds
    stealTime: 4,        // lab: seconds aboard a carrier to lift the Artifact
    repelTime: 2.2,      // lab: seconds a defender needs on deck to cast a boarder off
    recallTime: 1.5,     // lab: channel to recall a skiff home (not while it carries the Artifact)
    boardBypass: 1,      // lab rule: a boarder works under the ward (Wildgate: the ship's shields never stop a boarder)
    // Breach charge: the skiff's blast is AOEExplosion (Assets/_Prefabs/.../AOEExplosion.prefab)
    spaceScale: 60,      // AOEExplosion MaxScale (radius 0.5 x MaxScale), x(1 + kCharge x Charge/15) for a skiff charge
    blastDuration: 3,    // AOEExplosion ExplosionDuration (s), radius eased by sin(t pi/2)
    blastDelay: 0.2,     // AOEExplosion ExplosionDelay (s)
    // Match
    arenaR: 320,         // the game cell's radius, as the Crew Vessel Lab copies it (cellRadius 320); a sphere in round 2
    sightRange: 220,     // lab: what a crew sees without a Scope (the Crew Vessel Lab's viewRange)
    matchLen: 90,        // lab: Breach / Anchorage / Broadside length (s)
    gateCap: 180,        // lab: a Gate Run ends here if nobody escapes (s)
    crystalRespawn: 6,   // lab (s)
    rivalsGalleon: 0,    // lab: 1 = every rival crew flies the Galleon instead of your concept
    // The chase camera: SparrowCameraSettingsSO (Assets/_SO_Assets/Camera/SparrowCameraSettingsSO.asset)
    camBack: 50,         // followOffset.z = -50 (behind the hull, in its own frame)
    camUp: 10,           // followOffset.y = 10
    camSmooth: 0.2,      // followSmoothTime (s)
    camFov: 60,          // lab: the asset has no field of view; 60 deg
  };

  // ================= (2) SPEC: one row per dial =================
  const SPEC = [
    ['Crew', 'walkTime', 0, 6, 0.1, 'Walk between stations (s)', 'How long a crew member takes to cross the deck. 0 = consoles (a seat swap still costs PilotSwap 0.75 s). Long walks make every job a decision.'],
    ['Crew', 'swapCooldown', 0.25, 2, 0.05, 'Shortest seat change (s)', 'PilotSwap.CooldownSeconds. The floor under any move between stations.'],
    ['Crew', 'reassign', 0.2, 3, 0.1, 'AI re-plan interval (s)', 'How often an AI crew reconsiders who stands where. Easy crews wait 1.8x longer.'],
    ['Ward', 'wardGuns', 0, 1, 1, 'Ward blocks your own guns', 'Wildgate\'s gamble: to fire you drop your shield. Off: guns fire through your own ward.'],
    ['Ward', 'wardSpeed', 0, 1, 0.05, 'Speed with ward down (x)', 'Bonus speed while the ward is down. Wildgate: +35%.'],
    ['Ward', 'wardHits', 1, 12, 1, 'Ward hits at Mass 0', 'Bolts the ward absorbs before it breaks.'],
    ['Ward', 'wardPerMass', 0, 1, 0.02, 'Extra hits per Mass level', 'Mass petals thicken the ward.'],
    ['Ward', 'wardRegen', 0, 2, 0.05, 'Regen, Core manned (hits/s)', 'A manned Core recharges the ward this fast.'],
    ['Ward', 'wardRegenIdle', 0, 1, 0.02, 'Regen, no Core (hits/s)', 'With nobody at a Core (or no Core seat) the ward only trickles back.'],
    ['Ward', 'wardBreakCd', 0, 15, 0.5, 'Broken ward downtime (s)', 'A ward knocked to 0 stays down this long.'],
    ['Hull', 'hullSpeedMul', 0.4, 1.5, 0.05, 'Hull speed (x Sparrow)', 'The four-seat hull\'s share of the Sparrow\'s 35 u/s cruise and 135 u/s boost.'],
    ['Hull', 'hullTurnMul', 0.2, 1.5, 0.05, 'Hull turn (x Sparrow)', 'Share of the Sparrow\'s 80 deg/s yaw.'],
    ['Hull', 'hullRadius', 4, 20, 1, 'Hull radius (u)', 'Contact radius for bolts, boarders, crystals and prisms.'],
    ['Hull', 'boostTank', 0, 8, 0.25, 'Boost tank (s)', 'Seconds of boost at Time 0; refills slowly, faster with Time.'],
    ['Hull', 'trailCap', 20, 300, 5, 'Trail prisms kept', 'Trail prisms each hull keeps at Mass 0; +4 per Mass level.'],
    ['Hull', 'minSpeed', 0, 40, 1, 'Minimum speed (u/s)', 'Sparrow DefaultMinimumSpeed.'],
    ['Hull', 'throttleScaler', 5, 80, 1, 'Throttle scaler (u/s)', 'Sparrow DefaultThrottleScaler.'],
    ['Hull', 'boostMul', 1, 8, 0.25, 'Boost multiplier', 'Sparrow boostMultiplier on the throttle term.'],
    ['Hull', 'yawRate', 20, 200, 5, 'Yaw rate (deg/s)', 'Sparrow YawScaler.'],
    ['Hull', 'pitchRate', 20, 200, 5, 'Pitch rate (deg/s)', 'Sparrow PitchScaler.'],
    ['Hull', 'rollRate', 0, 200, 5, 'Roll rate (deg/s)', 'Sparrow RollScaler.'],
    ['Hull', 'wavelength', 3, 20, 1, 'Prism every (u)', 'Sparrow initialWavelength.'],
    ['Hull', 'prismW', 1, 6, 0.5, 'Prism width (u)', 'Sparrow BaseScale.x.'],
    ['Hull', 'prismL', 2, 12, 0.5, 'Prism length (u)', 'Sparrow BaseScale.z.'],
    ['Guns', 'fireRate', 0.3, 5, 0.1, 'Fire rate at Space 0 (/s)', 'Shots per second per gun deck; Space petals raise it.'],
    ['Guns', 'boltSpeed', 80, 600, 10, 'Bolt speed (u/s)', 'Faster bolts need less lead.'],
    ['Guns', 'boltRange', 80, 500, 10, 'Bolt range (u)', 'How far a bolt flies.'],
    ['Guns', 'turretTurn', 40, 720, 10, 'Turret turn (deg/s)', 'How fast a gunner swings the turret.'],
    ['Core', 'refine', 0, 1, 1, 'Crystals need refining', 'On: crystals land in the hold and a manned Core turns them into petals (Wildgate\'s ice into the reactor). Off: a crystal is a petal on pickup, as in the game.'],
    ['Core', 'refineTime', 0.2, 5, 0.1, 'Refine time (s per crystal)', 'Core work per crystal.'],
    ['Core', 'forgeCost', 1, 6, 1, 'Forge cost (crystals)', 'Hold crystals spent per forged block (Anchorage).'],
    ['Core', 'forgePrisms', 2, 24, 1, 'Prisms per block', 'Size of a forged block.'],
    ['Skiff', 'skiffSpeed', 30, 250, 5, 'Skiff speed (u/s)', 'At Charge 0; Charge petals add up to 1 + kCharge.'],
    ['Skiff', 'boardBypass', 0, 1, 1, 'Boarders work under the ward', 'On: a boarder siphons petals whatever the ward says (Wildgate). Off: a warded hull cannot be boarded.'],
    ['Skiff', 'boardDrain', 0, 3, 0.05, 'Siphon (petals/s)', 'Petals a boarder moves into its bag per second. Every one is a scored hit.'],
    ['Skiff', 'bagMax', 1, 15, 1, 'Bag size (petals)', 'A boarder leaves when its bag is full.'],
    ['Skiff', 'stealTime', 0.5, 15, 0.5, 'Lift the Artifact (s)', 'Seconds aboard a carrier to take the Artifact.'],
    ['Skiff', 'repelTime', 0.2, 8, 0.1, 'Cast off a boarder (s)', 'Seconds a defender spends on deck to cast a boarder off. Two defenders take half.'],
    ['Skiff', 'recallTime', 0, 5, 0.1, 'Recall channel (s)', 'A skiff can recall home, never with the Artifact (Wildgate: no teleport with the Artifact).'],
    ['Skiff', 'spaceScale', 10, 200, 5, 'Breach blast MaxScale', 'AOEExplosion MaxScale; the skiff\'s charge in Breach.'],
    ['Skiff', 'blastDuration', 0.5, 6, 0.1, 'Blast duration (s)', 'AOEExplosion ExplosionDuration.'],
    ['Skiff', 'blastDelay', 0, 2, 0.05, 'Blast delay (s)', 'AOEExplosion ExplosionDelay.'],
    ['Match', 'arenaR', 150, 800, 10, 'Arena radius (u)', 'A sphere. The game cell is 320 u. In 3D a bigger arena empties fast: volume grows with the cube of the radius.'],
    ['Match', 'sightRange', 80, 600, 10, 'Sight without a Scope (u)', 'Rivals and the loose Artifact are known only this close unless a Scope is manned.'],
    ['Match', 'matchLen', 30, 300, 5, 'Match length (s)', 'Breach, Anchorage and Broadside.'],
    ['Match', 'gateCap', 60, 400, 10, 'Gate Run time limit (s)', 'Nobody escaped by then: everyone failed.'],
    ['Match', 'crystalRespawn', 1, 30, 1, 'Crystal respawn (s)', ''],
    ['Match', 'startLevel', -5, 15, 1, 'Starting level, every element', 'ElementalBarsConfigSO levels run -5 to 15.'],
    ['Match', 'rivalsGalleon', 0, 1, 1, 'Rivals always fly the Galleon', 'Off: rival crews fly your concept (a mirror match). On: every rival flies the Galleon, the Wildgate-literal reference.'],
    ['Camera', 'camBack', 10, 150, 1, 'Behind the hull (u)', 'SparrowCameraSettingsSO followOffset.z (-50). The chase camera sits this far behind, in the hull\'s own frame.'],
    ['Camera', 'camUp', -10, 60, 1, 'Above the hull (u)', 'SparrowCameraSettingsSO followOffset.y (10).'],
    ['Camera', 'camSmooth', 0.02, 1.5, 0.01, 'Follow smoothing (s)', 'SparrowCameraSettingsSO followSmoothTime (0.2). Higher: the camera trails further at boost.'],
    ['Camera', 'camFov', 30, 110, 1, 'Field of view (deg)', 'Lab only: the camera asset has no FOV field.'],
    ['Elements', 'kTime', 0, 2, 0.05, 'Time: speed at 15 (+x)', 'Hull speed and boost refill gain this much at Time 15.'],
    ['Elements', 'kSpace', 0, 2, 0.05, 'Space: fire rate at 15 (+x)', 'Gun fire rate gains this much at Space 15.'],
    ['Elements', 'kMass', 0, 2, 0.05, 'Mass: ward regen at 15 (+x)', 'Ward regen gains this much at Mass 15 (Mass also adds hits).'],
    ['Elements', 'kCharge', 0, 2, 0.05, 'Charge: skiff at 15 (+x)', 'Skiff speed, siphon rate and breach blast gain this much at Charge 15.'],

  // ---- the economy: every vessel-on-vessel effect moves petals, and every move is a scored hit ----

  function controlsPanel() {

      '<h4>Camera</h4><p>The chase camera rides behind your hull (or your skiff when you fly it) at the Sparrow\'s followOffset: 50 u back, 10 u up, 0.2 s smoothing. <kbd>C</kbd> (pad <kbd>Y</kbd>) switches to an overview of the whole arena. The radar (top right) is your hull\'s view from above: a tick up or down means above or below you.</p>' +

  async function record(topic, choice, note) {
    const doc = { topic, choice, note: note || '', createdAt: Date.now(), by: me, settings: snapshot() };

    if (topic === 'Ward rule') return 'Ward blocks own guns: ' + (P.wardGuns ? 'yes' : 'no') + '; speed with ward down +' + Math.round(P.wardSpeed * 100) + '%';

    TOPICS.forEach((t) => { const o = document.createElement('option'); o.textContent = t; sel.appendChild(o); });
    const prefill = () => { ch.value = currentChoice(sel.value); };
    sel.onchange = prefill; prefill();
    status.textContent = db ? 'Shared log: saved with the lab, read by Claude at the start of the next round.' : 'Kept in this browser (Copy log to send it).';

  }
  function renderLog(box) {
    const t = (box || document).querySelector('#logTable'); if (!t) return;
    const rows = remote.concat(localLog).sort((a, b) => b.createdAt - a.createdAt).slice(0, 50);
    t.innerHTML = '<tr><th>When</th><th>Topic</th><th>Decision</th><th>Note</th></tr>';
    if (!rows.length) { const tr = document.createElement('tr'); tr.innerHTML = '<td colspan="4" class="hint">No decisions yet. Fly a concept, then record which one feels like a crew.</td>'; t.appendChild(tr); }
    for (const d of rows) { const tr = document.createElement('tr'); for (const v of [new Date(d.createdAt).toLocaleString(), d.topic, d.choice, d.note || '']) { const td = document.createElement('td'); td.textContent = v; td.style.textAlign = 'left'; tr.appendChild(td); } t.appendChild(tr); }
  }

    const c = window.claude;

    try {

      for (const d of localLog.splice(0)) { try { await db.collection('decisions').add(d); } catch (e) { localLog.push(d); } }
      lsSet('log', localLog);
    } catch (e) { db = null; }
  })();
