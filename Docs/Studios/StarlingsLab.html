<!doctype html>
<!--
  STARLINGS LAB — the passive swarm card vessel (Garrett, 2026-10-20). Source of Docs/Studios/StarlingsLab.html:
    python3 Docs/Studios/StarlingsLab/build.py     (injects Docs/Studios/SwarmCardVessel/cards.json)
    node .claude/skills/labmaker/verify_lab.cjs Docs/Studios/StarlingsLab.html
  Built from .claude/skills/labmaker/template/lab.html (the lab contract: SHIPPED, SPEC, seeded runs,
  manual clock, window.__lab, headless scorecard, decision log, an honest not-modelled list).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Starlings Lab</title>
<style>
  :root {
    --bg: #eef2f6; --panel: #ffffff; --ink: #142030; --muted: #586579; --line: #d6dde6;
    --accent: #1f7fa8; --warn: #b4560b; --ok: #1f7a43; --stage: #04101c; --changed: #1f7fa8;
    --mass: #2f6fe0; --time: #0f9488; --space: #7a4fd8; --charge: #b07a00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b121b; --panel: #121c28; --ink: #e4ebf3; --muted: #93a2b6; --line: #24324a;
      --accent: #58b8de; --warn: #f0a050; --ok: #5cc98a; --stage: #02080f; --changed: #58b8de;
      --mass: #6aa0ff; --time: #3fd6c5; --space: #a988ff; --charge: #f2c14e; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b121b; --panel: #121c28; --ink: #e4ebf3; --muted: #93a2b6; --line: #24324a;
    --accent: #58b8de; --warn: #f0a050; --ok: #5cc98a; --stage: #02080f; --changed: #58b8de;
    --mass: #6aa0ff; --time: #3fd6c5; --space: #a988ff; --charge: #f2c14e; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  #app { display: grid; height: 100vh; grid-template-columns: minmax(0, 1fr) 330px; grid-template-rows: auto minmax(0, 1fr) 210px; grid-template-areas: "head head" "stage dock" "bottom dock"; }
  header { grid-area: head; display: flex; gap: 8px 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; }
  header .meta { color: var(--muted); }
  header .spacer { flex: 1; }
  header select { width: auto; }
  #diff { color: var(--changed); }
  #stageWrap { grid-area: stage; position: relative; min-height: 0; background: var(--stage); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage { width: 100%; height: 100%; display: block; }
  #hud { position: absolute; left: 10px; top: 8px; right: 10px; color: #cfe0ee; font: 12px/1.45 ui-monospace, Menlo, monospace; pointer-events: none; }
  #phases { display: flex; gap: 4px; margin-bottom: 4px; }
  #phases div { flex: 1; border: 1px solid #2c4560; border-radius: 4px; padding: 2px 6px; background: rgba(4,16,28,.6); overflow: hidden; position: relative; white-space: nowrap; text-overflow: ellipsis; }
  #phases div.on { border-color: #9fe3ff; color: #fff; }
  #phases div i { position: absolute; left: 0; bottom: 0; height: 3px; background: #9fe3ff; }
  #hand { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 6px; justify-content: center; }
  #hand button { flex: 1 1 0; max-width: 210px; min-width: 0; text-align: left; border: 1px solid var(--c); border-radius: 8px; background: rgba(6,18,30,.92); color: #e7f0f8; padding: 6px 8px; cursor: pointer; font: 12px/1.3 system-ui, sans-serif; }
  #hand button b { display: block; color: var(--c); font-size: 13px; }
  #hand button small { display: block; color: #a7b6c6; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  #hand button:focus-visible { outline: 2px solid #fff; }
  #handNote { position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 4px; text-align: center; color: #cfe0ee; font: 12px system-ui, sans-serif; pointer-events: none; }
  #stick { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border: 2px solid rgba(160,220,255,.35); border-radius: 50%; pointer-events: none; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: rgba(160,220,255,.5); }
  #dock { grid-area: dock; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px 16px 16px; }
  #bottom { grid-area: bottom; border-top: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px 16px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .tabs button, .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  .tabs button[aria-selected="true"], .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 64px; gap: 2px 8px; margin: 8px 0; }
  .row label { display: flex; gap: 6px; align-items: baseline; }
  .row label .key { color: var(--muted); font: 11px ui-monospace, monospace; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  .row output.changed { color: var(--changed); text-decoration: underline; }
  .row .tip { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .hint { color: var(--muted); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); }
  .best { font-weight: 700; color: var(--ok); }
  .status-ok { color: var(--ok); } .status-warn { color: var(--warn); }
  textarea, select, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .held { display: grid; gap: 4px; }
  .held div { border-left: 3px solid var(--c); padding: 2px 8px; }
  .held div span { color: var(--muted); }
  @media (max-width: 900px) {
    body { overflow: auto; }
    #app { display: block; height: auto; }
    #stageWrap { height: 78vh; min-height: 320px; }
    #dock, #bottom { border: 0; border-top: 1px solid var(--line); }
    header, #dock, #bottom { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    #hand button small { -webkit-line-clamp: 2; }
  }
  /* a phone held sideways: one header row, the stage fills the rest of the screen so the hand is in view */
  @media (max-height: 520px) {
    header { padding-top: 4px; padding-bottom: 4px; flex-wrap: nowrap; overflow-x: auto; }
    header .meta, #diff, #resetAll { display: none; }
    #stageWrap { height: calc(100vh - 46px); height: calc(100svh - 46px); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title"></h1>
    <span class="meta" id="meta"></span>
    <span id="diff"></span>
    <span class="spacer"></span>
    <label class="meta" for="intensity">Intensity</label>
    <select id="intensity"><option value="1">I1</option><option value="2" selected>I2</option><option value="3">I3</option><option value="4">I4</option></select>
    <label class="meta" for="picker">Cards</label>
    <select id="picker"><option value="you">You pick</option><option value="random">AI: random</option><option value="Mass">AI: Mass first</option><option value="Time">AI: Time first</option><option value="Space">AI: Space first</option><option value="Charge">AI: Charge first</option></select>
    <span class="meta" id="platform"></span>
    <button class="btn" id="speed">×1</button>
    <button class="btn" id="pause">Pause</button>
    <button class="btn" id="restart">Restart</button>
    <button class="btn" id="resetAll">Lab defaults</button>
  </header>
  <div id="stageWrap"><canvas id="stage"></canvas>
    <div id="hud"><div id="phases"></div><div id="hudText"></div></div>
    <div id="stick" hidden><i></i></div>
    <div id="hand" hidden><div id="handNote"></div></div>
  </div>
  <aside id="dock"><div class="tabs" id="dockTabs" role="tablist"></div><div id="dockBody"></div></aside>
  <section id="bottom"><div class="tabs" id="bottomTabs" role="tablist"></div><div id="bottomBody"></div></section>
</div>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const CARDS = {"revision":3,"roles":{"Mass":"Prism production (danger or base), shielding, supershielding","Time":"Your maneuverability, speed, positioning and movement","Space":"More range or more prisms you can destroy, steal or shrink","Charge":"Silencing other vessels' Charge and Space abilities, killing fauna, stripping elemental crystals from other vessels"},"date":"2026-10-20","meanings":{"Mass":"Weight, gravity and matter: the swarm lays your prisms, shields them and turns heavy.","Time":"Speed, tempo and second chances: the swarm moves faster, turns sharper and gets where it needs to be.","Space":"Reach and geometry: the swarm reaches further and takes apart, steals or shrinks more of the enemy's prisms.","Charge":"Current, fields and lightning: the swarm silences rivals, kills fauna and knocks the crystals out of other vessels."},"cards":[{"id":"mass-mound-builders","n":1,"element":"Mass","name":"Mound Builders","kind":"Build","objective":"Any","text":"The swarm lays your team's prisms along its path.","stats":[{"label":"Prisms laid","kind":"lin","a":0.5,"b":0.25,"unit":"/s","dec":2,"key":["0.50/s","1.50/s","2.75/s","4.00/s"]}],"role":"Prism production","phys":null,"rev":null,"milestones":[{"level":5,"text":"Laid prisms join into a solid wall with no gaps"},{"level":15,"text":"Laid prisms are shielded"}]},{"id":"mass-danger-drip","n":2,"element":"Mass","name":"Danger Drip","kind":"Build","objective":"Opposing vessels","text":"Members drip danger prisms behind them. A rival that flies through one is slowed and loses a petal, as any danger prism does.","stats":[{"label":"Danger prisms","kind":"lin","a":0.3,"b":0.15,"unit":"/s","dec":2,"key":["0.30/s","0.90/s","1.65/s","2.40/s"]}],"role":"Danger prism production","phys":null,"rev":null,"milestones":[{"level":10,"text":"Drips fall in short lines across the swarm's wake"}]},{"id":"mass-conservation-of-mass","n":3,"element":"Mass","name":"Conservation of Mass","kind":"Build","objective":"Any","text":"Mass is never lost. A member that dies becomes your prisms where it fell.","stats":[{"label":"Prisms per death","kind":"lin","a":1,"b":0.5,"unit":"","dec":0,"key":["1","3","5","8"]}],"role":"Prism production","phys":"Conservation of mass","rev":null,"milestones":[{"level":10,"text":"The prisms are shielded"}]},{"id":"mass-inertial-wall","n":4,"element":"Mass","name":"Inertial Wall","kind":"Build","objective":"Opposing vessels","text":"Every few seconds the swarm drops a straight wall of your prisms along its line of travel. The faster it flies, the longer the wall, because momentum carries the bricks.","stats":[{"label":"Wall length at cruise","kind":"lin","a":4,"b":1,"unit":" prisms","dec":0,"key":["4 prisms","8 prisms","13 prisms","18 prisms"]},{"label":"Every","kind":"geo","a":10,"b":0.95,"unit":"s","dec":1,"key":["10.0 s","8.1 s","6.3 s","4.9 s"]}],"role":"Prism production","phys":"Inertia and momentum","rev":null,"milestones":[{"level":10,"text":"The wall is laid as danger prisms"}]},{"id":"mass-accretion-disk","n":5,"element":"Mass","name":"Accretion Disk","kind":"Build","objective":"Omnicrystal","text":"Members circling the objective lay a ring of your prisms round it, the way matter collects in orbit round a heavy body.","stats":[{"label":"Ring size","kind":"lin","a":8,"b":2,"unit":" prisms","dec":0,"key":["8 prisms","16 prisms","26 prisms","36 prisms"]},{"label":"Build time","kind":"geo","a":4,"b":0.9,"unit":"s","dec":1,"key":["4.0 s","2.6 s","1.5 s","0.9 s"]}],"role":"Prism production and shielding","phys":"Accretion in orbit","rev":null,"milestones":[{"level":10,"text":"The ring is shielded"},{"level":15,"text":"The ring is supershielded"}]},{"id":"mass-snowball","n":6,"element":"Mass","name":"Snowball","kind":"Form","objective":"Any","text":"Every 20 s the swarm rolls into one ball. It packs on a layer of your prisms each second, and when it breaks they land as a mound.","stats":[{"label":"Ball lasts","kind":"lin","a":3,"b":0.5,"unit":"s","dec":1,"key":["3.0 s","5.0 s","7.5 s","10.0 s"]},{"label":"Prisms per second","kind":"lin","a":2,"b":1,"unit":"","dec":0,"key":["2","6","11","16"]}],"role":"Prism production","phys":"Accretion","rev":null,"milestones":[{"level":10,"text":"The mound lands shielded"}]},{"id":"mass-density","n":7,"element":"Mass","name":"Density","kind":"Build","objective":"Any","text":"Your prisms laid close together compress into fewer, bigger prisms, so the same mass holds more volume and takes more to break.","stats":[{"label":"Merge radius","kind":"lin","a":10,"b":3,"unit":"u","dec":0,"key":["10 u","22 u","37 u","52 u"]},{"label":"Volume per merge","kind":"lin","a":1.2,"b":0.1,"unit":"×","dec":1,"key":["1.2×","1.6×","2.1×","2.6×"]}],"role":"Prism production","phys":"Density and compression","rev":null,"milestones":[{"level":15,"text":"Merged prisms are supershielded"}]},{"id":"mass-neutron-star","n":8,"element":"Mass","name":"Neutron Star","kind":"Form","objective":"Any","text":"Every 30 s the swarm crushes into one dense star that cannot be hurt. When it ends it leaves a supershielded core of your prisms.","stats":[{"label":"Star lasts","kind":"lin","a":1.5,"b":0.35,"unit":"s","dec":1,"key":["1.5 s","2.9 s","4.7 s","6.4 s"]},{"label":"Core size","kind":"lin","a":3,"b":1,"unit":" prisms","dec":0,"key":["3 prisms","7 prisms","12 prisms","17 prisms"]}],"role":"Supershielding","phys":"Degenerate matter","rev":null,"milestones":[]},{"id":"mass-golem","n":9,"element":"Mass","name":"Golem","kind":"Form","objective":"Opposing vessels","text":"Every 25 s the swarm stacks into a giant walking golem. Each stomp leaves a footprint of your prisms, and its own body is shielded.","stats":[{"label":"Golem lasts","kind":"lin","a":4,"b":0.5,"unit":"s","dec":1,"key":["4.0 s","6.0 s","8.5 s","11.0 s"]},{"label":"Prisms per footprint","kind":"lin","a":2,"b":0.5,"unit":"","dec":0,"key":["2","4","6","9"]}],"role":"Prism production and shielding","phys":"Weight","rev":null,"milestones":[{"level":10,"text":"Footprints are danger prisms"},{"level":15,"text":"The golem is supershielded"}]},{"id":"mass-supershield-core","n":10,"element":"Mass","name":"Supershield Core","kind":"Shield","objective":"Any","text":"Your prisms near the swarm's centroid are supershielded while the swarm stays close.","stats":[{"label":"Core radius","kind":"lin","a":40,"b":10,"unit":"u","dec":0,"key":["40 u","80 u","130 u","180 u"]}],"role":"Supershielding","phys":null,"rev":null,"milestones":[{"level":10,"text":"The shield lasts a few seconds after the swarm leaves"}]},{"id":"mass-carapace","n":11,"element":"Mass","name":"Carapace","kind":"Shield","objective":"Opposing vessels","text":"Members grow shells. A shell soaks one hit, then regrows.","stats":[{"label":"Shell regrows in","kind":"geo","a":12,"b":0.88,"unit":"s","dec":1,"key":["12.0 s","7.2 s","3.8 s","2.0 s"]}],"role":"Shielding","phys":null,"rev":null,"milestones":[{"level":8,"text":"Two shells per member"},{"level":15,"text":"Three shells per member"}]},{"id":"mass-gravity-well","n":12,"element":"Mass","name":"Gravity Well","kind":"Pull","objective":"Elemental crystals","text":"The centroid's gravity pulls loose crystals toward the swarm, and your prisms inside the well pack into a shielded clump.","stats":[{"label":"Pull radius","kind":"lin","a":50,"b":15,"unit":"u","dec":0,"key":["50 u","110 u","185 u","260 u"]}],"role":"Shielding","phys":"Gravity","rev":null,"milestones":[{"level":10,"text":"Enemy vessels inside the well are dragged (25% slow)"}]},{"id":"mass-bulk-up","n":13,"element":"Mass","name":"Bulk Up","kind":"Body","objective":"Opposing vessels","text":"Members grow bigger and heavier. Heavy members take more to kill and do not get knocked about.","stats":[{"label":"Member size","kind":"lin","a":1.05,"b":0.05,"unit":"×","dec":2,"key":["1.05×","1.25×","1.50×","1.75×"]},{"label":"Toughness","kind":"lin","a":1,"b":0.2,"unit":"×","dec":1,"key":["1.0×","1.8×","2.8×","3.8×"]}],"role":null,"phys":"Inertia","rev":"No stuns: its L10 shoved vessels aside; it now takes a third of a petal on a ram.","milestones":[{"level":10,"text":"A heavy member that rams a vessel takes a third of a petal"}]},{"id":"mass-mass-tug","n":14,"element":"Mass","name":"Mass Tug","kind":"Hook","objective":"Opposing vessels","text":"Members latch onto enemy vessels and weigh them down.","stats":[{"label":"Most slow on one vessel","kind":"lin","a":15,"b":4,"unit":"%","dec":0,"key":["15%","31%","51%","71%"]}],"role":null,"phys":"Added mass","rev":null,"milestones":[{"level":10,"text":"A weighed-down vessel drops a petal every 5 s"}]},{"id":"mass-brood","n":15,"element":"Mass","name":"Brood","kind":"Growth","objective":"Any","text":"The swarm breeds: a new member hatches at the centroid every few seconds, up to the swarm cap.","stats":[{"label":"Hatch every","kind":"geo","a":6,"b":0.88,"unit":"s","dec":1,"key":["6.0 s","3.6 s","1.9 s","1.0 s"]}],"role":null,"phys":null,"rev":null,"milestones":[{"level":10,"text":"Hatchlings arrive full size"},{"level":15,"text":"Twins: two members per hatch"}]},{"id":"mass-big-family","n":16,"element":"Mass","name":"Big Family","kind":"Growth","objective":"Any","text":"Raises the swarm cap and the protected minimum size.","stats":[{"label":"Swarm cap","kind":"lin","a":46,"b":6,"unit":"","dec":0,"key":["46","70","100","130"]},{"label":"Minimum size","kind":"lin","a":6,"b":0.5,"unit":"","dec":0,"key":["6","8","10","13"]}],"role":null,"phys":null,"rev":"Also raises the new minimum size, below which nothing can harm the swarm.","milestones":[{"level":10,"text":"Members over the cap wait in a reserve and refill losses at once"}]},{"id":"mass-queen","n":17,"element":"Mass","name":"Queen","kind":"Growth","objective":"Any","text":"One member is crowned. While she lives the swarm breeds faster and her guards are shielded. If she falls, the crown passes after a delay.","stats":[{"label":"Breeding bonus","kind":"lin","a":20,"b":10,"unit":"%","dec":0,"key":["20%","60%","110%","160%"]},{"label":"Crown passes in","kind":"geo","a":15,"b":0.85,"unit":"s","dec":1,"key":["15.0 s","7.8 s","3.5 s","1.5 s"]}],"role":"Shielding","phys":null,"rev":null,"milestones":[{"level":15,"text":"Two queens"}]},{"id":"mass-clutch","n":18,"element":"Mass","name":"Clutch","kind":"Growth","objective":"Elemental crystals","text":"Each crystal the swarm collects lays eggs that hatch a few seconds later.","stats":[{"label":"Eggs per crystal","kind":"lin","a":1,"b":0.5,"unit":"","dec":0,"key":["1","3","5","8"]}],"role":null,"phys":null,"rev":null,"milestones":[{"level":10,"text":"Eggs hatch at once"}]},{"id":"mass-pack-mules","n":19,"element":"Mass","name":"Pack Mules","kind":"Economy","objective":"Elemental crystals","text":"Elemental crystals the swarm carries home count for more element.","stats":[{"label":"Extra element per crystal","kind":"lin","a":10,"b":10,"unit":"%","dec":0,"key":["10%","50%","100%","150%"]}],"role":null,"phys":null,"rev":null,"milestones":[]},{"id":"mass-critical-mass","n":20,"element":"Mass","name":"Critical Mass","kind":"Burst","objective":"Opposing mass","text":"When the swarm passes a size, it throws off a shell of your prisms all round it in one go, then has to grow back past the size to do it again.","stats":[{"label":"Swarm size needed","kind":"geo","a":36,"b":0.95,"unit":"","dec":0,"key":["36","29","22","17"]},{"label":"Prisms thrown","kind":"lin","a":8,"b":3,"unit":"","dec":0,"key":["8","20","35","50"]}],"role":"Prism production","phys":"Critical mass","rev":null,"milestones":[{"level":10,"text":"The shell is shielded"}]},{"id":"time-dragonfly","n":1,"element":"Time","name":"Dragonfly","kind":"Form","objective":"Elemental crystals","text":"Every 15 s the swarm morphs into a giant dragonfly and darts at the objective in fast straight hops, collecting crystals on the way.","stats":[{"label":"Dart speed","kind":"lin","a":2,"b":0.15,"unit":"×","dec":2,"key":["2.00×","2.60×","3.35×","4.10×"]},{"label":"Dragonfly lasts","kind":"lin","a":3,"b":0.4,"unit":"s","dec":1,"key":["3.0 s","     const box = document.createElement('div');
    box.innerHTML = '<p id="aboutHead"></p>' +
      '<p><b>How to play.</b> You do not steer the starlings. Drag anywhere on the stage to turn your view (it works like a joystick and stops when you let go; arrow keys work too). The swarm works four objectives in turn on timers; each phase ends early when its goal is met. When the Omnicrystal phase ends, crystal or not, you get four cards, one per element. Pick one; the swarm keeps going while you read. A card you already hold adds its level, up to 15.</p>' +
      '<p class="hint"><b>What this lab does NOT model.</b> The view is a 2D canvas projection with a depth fade, a stand-in for the Wrasse\'s 2.5D look. Rivals are scripted wanderers that lay prisms, take crystals and shoot starlings; they are not players and they do not use abilities. Fauna only graze your prisms. A prism is a point with no volume. Only 24 of the 80 cards are wired, and their side effects are simplified. Every number is a proposal: nothing of this vessel exists in the game yet. No networking, no frame-time measurement on a phone GPU, no collider budget.</p>';
    box.querySelector('#aboutHead').textContent = LAB.name + ' · round ' + LAB.round + ' · cards ' + LAB.cards + ' · ' + LAB.branch + ' · write-up: ' + LAB.doc;
    return box;
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'About', build: aboutPanel }, { name: 'Scorecard', build: scorecardPanel }, { name: 'Decisions', build: logPanel }], 'lab:' + LAB.name + ':bottom');

  $('title').textContent = LAB.name; $('meta').textContent = 'round ' + LAB.round + ' · the Starlings';
  let paused = false, mult = 1;
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
  $('speed').onclick = () => { mult = mult === 1 ? 4 : 1; $('speed').textContent = '×' + mult; };
  $('restart').onclick = () => { reset(seed + 1); refreshHeld(); };
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); lsSet(LS_KEY, {}); for (const k in outputs) outputs[k].inp.value = P[k]; reset(); refreshDiff(); refreshHeld(); };
  $('intensity').onchange = (e) => { intensity = +e.target.value; reset(); refreshHeld(); };
  $('picker').onchange = (e) => { picker = e.target.value; if (W.hand && picker !== 'you') { autoPick(); refreshHeld(); } };

  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now(), acc = 0, lastHeld = '';
  function frame(now) {
    const real = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) {
      resize();
      const ky = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0), kp = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
      turnView((spin.yaw + ky * 1.2) * real, (spin.pitch + kp * 1.2) * real);
      if (!paused) { acc += real * mult; while (acc >= 1 / 30) { simStep(1 / 30); acc -= 1 / 30; } }
      render();
      const hk = JSON.stringify(W.held); if (hk !== lastHeld) { lastHeld = hk; refreshHeld(); }
    }
    requestAnimationFrame(frame);
  }
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors); } catch (e) { /* old browser */ }
  turnView(0.5, 0.35);
  resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  window.__lab = {
    LAB, SHIPPED, SPEC, P, PLATFORM, VARIANTS, CARDS, IMPL,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { dt = dt || 1 / 30; n = n || 1; for (let i = 0; i < n; i++) simStep(dt); resize(); render(); },
    reset, score, runBatch, setParam, record, pick, turnView,
    setIntensity(i) { intensity = i; reset(); }, setPicker(p) { picker = p; },
    state: () => ({ t: W.t, seed, intensity, picker, phase: PHASES[W.phase].key, phaseT: W.phaseT, members: alive().length, hand: W.hand && W.hand.map((c) => c.id), drawEl: W.drawEl, held: Object.assign({}, W.held), form: W.form }),
  };
})();
</script>
</body>
</html>
