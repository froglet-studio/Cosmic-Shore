<!doctype html>
<!--
  ANGLER COMMAND LAB (round 1) — a /labmaker browser lab.
  Question: what is the most satisfying way for a strategist vessel (the Angler, proposed VesselClassType 17)
  to send PARTICULAR tamed fauna at PARTICULAR prisms in a 3D cell, and what does each way cost?
  Fly it (keys / gamepad / touch), or press "Score the schemes" for the headless scorecard, where an
  input-only commander AI flies every scheme through the same four orders.
  Write-up: Docs/Studios/ANGLER_COMMAND_LAB.md. Verify: node .claude/skills/labmaker/verify_lab.cjs <this file>
-->

<style>
  /* Editor layout (labmaker §2.7): header / stage + right dock / bottom dock; nothing scrolls the page.

  :root {
    --bg: #eef1fb; --panel: #ffffff; --panel-2: #f5f7ff; --line: #c9d0ee; --fg: #141a3a; --dim: #4b567f;
    --accent: #a65f00; --accent-2: #0a6fa8; --good: #1f8a4c; --warn: #8a6100; --bad: #b3243a; --stage: #03050d;
    --jade: #13fff2; --ruby: #ff00f9; --gold: #ffa700;
    --font-display: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1026; --panel: #121a3a; --panel-2: #0e1531; --line: #27336a; --fg: #e8ecff; --dim: #9aa6d6;
      --accent: #ffb347; --accent-2: #7fd7ff; --good: #6fe39a; --warn: #ffcf5c; --bad: #ff7a8a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1026; --panel: #121a3a; --panel-2: #0e1531; --line: #27336a; --fg: #e8ecff; --dim: #9aa6d6;
    --accent: #ffb347; --accent-2: #7fd7ff; --good: #6fe39a; --warn: #ffcf5c; --bad: #ff7a8a; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* outside the claude.ai viewer a component rule can beat [hidden] (L-STU-6) */
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-body); overflow: hidden; }
  #app { display: grid; height: 100%; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr) 232px; grid-template-areas: "head head" "stage dock" "bottom dock"; }
  header { grid-area: head; display: flex; gap: 10px 14px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font: 700 1.05rem/1.2 var(--font-display); margin: 0; letter-spacing: 0.02em; }
  .meta { color: var(--dim); font-size: 0.85rem; }
  .round { font: 500 0.75rem/1.2 var(--font-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
  header .spacer { flex: 1; }
  #diff { color: var(--accent-2); font-size: 0.85rem; }

  #stage, #hud2d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud2d { pointer-events: none; }
  #noGL { position: absolute; inset: 0; display: grid; place-items: center; color: #9aa6d6; font: 600 14px var(--font-body); text-align: center; padding: 24px; }
  .hudtxt { position: absolute; color: #e8ecff; font: 500 12px/1.45 var(--font-display); letter-spacing: 0.04em; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #order { left: 50%; top: 10px; transform: translateX(-50%); text-align: center; font-size: 14px; max-width: 92%; }
  #order .big { font-size: 17px; font-weight: 700; letter-spacing: 0.06em; }
  #status { left: 12px; top: 10px; }
  #squadBar { position: absolute; right: 12px; top: 10px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; pointer-events: none; }
  .sq { font: 600 12px/1 var(--font-display); letter-spacing: 0.05em; padding: 5px 8px; border-radius: 5px; color: #e8ecff; background: rgba(14, 21, 49, 0.72); border: 1px solid #27336a; }
  .sq.on { border-color: #ffb347; color: #ffb347; }
  #hint { left: 12px; bottom: 54px; color: #9aa6d6; font-size: 11px; }
  #transport { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; }
  #transport button { font: 700 0.8rem var(--font-display); letter-spacing: 0.05em; background: rgba(14, 21, 49, 0.8); color: #e8ecff; border: 1px solid #27336a; border-radius: 6px; padding: 6px 10px; cursor: pointer; }

  #dock { grid-area: dock; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px 16px 16px; min-width: 0; }
  #bottom { grid-area: bottom; border-top: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px 16px; min-width: 0; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .tabs button, .btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: 700 0.8rem var(--font-display); letter-spacing: 0.03em; }
  .tabs button[aria-selected="true"], .btn.primary { background: var(--accent); color: #1a1200; border-color: var(--accent); }
  .btn:focus-visible, .tabs button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h3 { font: 700 0.8rem/1.2 var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; margin: 14px 0 6px; color: var(--dim); }
  .row { display: grid; grid-template-columns: 1fr 64px; gap: 2px 8px; margin: 8px 0; }
  .row label { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .row label .key { color: var(--dim); font: 11px ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .row output { text-align: right; font: 600 0.85rem var(--font-display); font-variant-numeric: tabular-nums; }
  .row output.changed { color: var(--accent-2); text-decoration: underline; }
  .row .tip { grid-column: 1 / -1; color: var(--dim); font-size: 12px; }
  .field { display: grid; gap: 4px; margin: 8px 0; }
  .field label { font: 600 0.8rem var(--font-display); letter-spacing: 0.03em; }
  .desc { color: var(--dim); font-size: 12.5px; margin: 4px 0 8px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 12.5px; }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font: 700 0.72rem var(--font-display); text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); }
  .tablewrap { overflow-x: auto; }
  .best { font-weight: 700; color: var(--good); }
  .worst { color: var(--bad); }
  .status-ok { color: var(--good); } .status-warn { color: var(--warn); }
  textarea, select, input[type=text] { width: 100%; font: 0.9rem var(--font-body); color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
  ul.plain { margin: 4px 0; padding-left: 18px; } ul.plain li { margin: 2px 0; }
  #touch { position: absolute; inset: 0; pointer-events: none; }
  #touch .tb { position: absolute; pointer-events: auto; width: 68px; height: 68px; border-radius: 50%; border: 2px solid rgba(255, 179, 71, 0.7); background: rgba(14, 21, 49, 0.55); color: #ffb347; font: 700 11px var(--font-display); letter-spacing: 0.04em; display: grid; place-items: center; user-select: none; -webkit-user-select: none; touch-action: none; }
  #touch .tb.on { background: rgba(255, 179, 71, 0.85); color: #1a1200; }
  #stickZone { position: absolute; left: 0; bottom: 0; width: 50%; height: 70%; pointer-events: auto; touch-action: none; }
  @media (max-width: 900px) {
    body { overflow: auto; }
    #app { display: block; height: auto; }
    #stageWrap { aspect-ratio: 4 / 5; max-width: 100%; }
    #dock, #bottom { border: 0; border-top: 1px solid var(--line); }
    header, #dock, #bottom { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    #order { font-size: 12px; } #order .big { font-size: 14px; }

  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);

  // ===================================================================================================
  // (1) LAB meta + SHIPPED: a READER of the game's numbers. Every constant names the asset / field it was
  //     copied from. "lab" = no game field exists yet (the Angler is a design), shown as a proposal.
  // ===================================================================================================
  const LAB = { name: 'Angler Command Lab', branch: 'cece/zealous-feynman-po8k8d', round: 1, doc: 'Docs/Studios/ANGLER_COMMAND_LAB.md', models: 'design (the Angler does not ship)' };
  const DOMAIN_HEX = { jade: 0x13fff2, ruby: 0xff00f9, gold: 0xffa700 };   // studio-domains.js (OriginalColorSetSO GetDomainSignalColor)
  const SHIPPED = {
    // --- the cell ---
    cellR: 1200,          // _Prefabs/Environment/CapsuleMembrane.prefab radius (57 of 63 cell configs)
    nucleusR: 200,        // _Prefabs/Environment/Nucleus.prefab localScale 400 (assumed unit-diameter mesh → radius 200)
    dietAny: 1,           // Cell.IsPreyForHerbivore: nucleus cells → any domain outside the nucleus is edible (1); no nucleus → opposing only (0)
    // --- the Angler (lab: a proposal, the hull does not exist) ---
    cruise: 40,           // lab. Squirrel ships 60 (prefab); 40 lets L1 Clawfish (32 × 1.25) keep formation
    boost: 110,           // lab. Squirrel boost ×5 would be 300
    turnRate: 100,        // lab (deg/s)
    // --- lure & tame (lab: no game field, nothing in the codebase lures or tames) ---
    lureAhead: 14,        // lab: the esca hangs this far ahead of the nose (u)
    lureCruise: 12,       // lab: holding the lure slows the Angler to this (u/s): the anglerfish waits with its light out
    lureRadius: 70,       // lab: wild fauna inside this reach of the esca turn to it. LightFauna detectionRadius is 60–70
    tameRadius: 22,       // lab: inside this the creature is "held" and taming fills
    tameTime: 2.5,        // lab: seconds held to tame
    tameDecay: 0.6,       // lab: taming lost per second outside the hold
    squadCap: 24,         // lab: most creatures on the leash at once
    leashTow: 1.6,        // lab: a FOLLOWING creature may swim this × its own max to hold formation (attacks stay at game speed)
    formBack: 6,          // lab: how far behind the hull the school's ring sits (u)
    // --- commanded behaviour ---
    urgency: 1,           // lab: the aggression level a commanded creature runs at (LightFauna SpeedByAggression / consume-radius rows L0/L1/L2)
    spareOwn: 1,          // lab: orders never TARGET your own prisms (a mouthful can still eat them; see dietAny)
    // --- Clawfish (Assets/_SO_Assets/Light Fauna Data/ClawfishFaunaDataSO.asset) ---
    clawMin: 18, clawMax: 32, clawReach: 36, clawTurn: 7,      // minSpeed / maxSpeed / consumeRadius / rotationLerpSpeed
    // --- QuadFish (QuadFishFaunaDataSO.asset) ---
    quadMin: 16, quadMax: 28, quadReach: 40, quadTurn: 6,
    // --- the LightFauna mouthful (LightFaunaDataSO C# defaults: no asset stores them) ---
    lfHold: 2, lfCluster: 12, lfBites: 8, lfFacing: 25,      // consumeHoldSeconds / feedingClusterRadius / maxClusterBites / feedingFacingAngle
    // --- Tadpole (Assets/_Prefabs/FloraAndFauna/TadPoleFauna.prefab, Boid forager) ---
    tadMin: 10, tadMax: 15, tadHunt: 10, tadReach: 20, tadTick: 1.5,   // minSpeed / maxSpeed / huntSpeedMultiplier / trailBlockInteractionRadius / behaviorUpdateRate
    tadHold: 2, tadCluster: 10, tadBites: 6, tadFacing: 30,           // Boid C# defaults (not in the prefab)
    tadTurn: 4,           // lab: Boid steering is a velocity lerp; this is the lab's turn rate for it
    // --- squad sizes (lab; the game's per-cell caps: Clawfish 6, QuadFish 8, Tadpole 6 per pod) ---
    clawN: 6, quadN: 6, tadN: 12,
    // --- the command schemes (all lab) ---
    paintRange: 160, paintCone: 8,                  // Spotlight: reach (u), half-angle (deg)
    flareSpeed: 260, flareRange: 260, flareAssist: 5, flareRadius: 24, flareCd: 0.5,   // Pheromone dart
    gazeRange: 240, gazeCone: 5, gazeDwell: 0.35,   // Gaze lock
    loopStep: 4, loopClose: 18, loopDepth: 40, loopMin: 120,   // Lasso
    slingAhead: 12, slingSpeed: 150, slingCatch: 8, slingCluster: 24, slingTime: 3,   // Pack sling
    feralSense: 40,       // Feral baseline: a tamed creature attacks enemy prisms within this of itself
    // --- missions (lab) ---
    taskClear: 0.6, taskTimeout: 50,
    // --- the commander AI's rookie (lab; the Skim Race levels' shape: late notice + believed aim error) ---
    rookieNotice: 0.6, rookieAim: 3,
  };

  // [group, key, lo, hi, step, label, tooltip, scheme?]. A row with a scheme tag shows only while that scheme is picked.
  const SPEC = [
    ['Command', 'spareOwn', 0, 1, 1, 'Never target my prisms', 'On: an order\'s target list skips your own prisms. A mouthful can still eat them when the cell\'s diet allows it (Cell tab).'],
    ['Command', 'urgency', 0, 2, 1, 'Commanded aggression (L0–L2)', 'The LightFauna aggression row a commanded creature runs at: speed ×1 / 1.25 / 1.6 and mouth reach ×1 / 1.4 / 1.8 (LightFauna.cs).'],
    ['Command', 'paintRange', 40, 400, 5, 'Spotlight reach (u)', 'How far the beam paints prisms.', 'paint'],
    ['Command', 'paintCone', 2, 25, 0.5, 'Spotlight half-angle (°)', 'Wider paints more per sweep but also catches neighbours.', 'paint'],
    ['Command', 'flareSpeed', 60, 600, 10, 'Dart speed (u/s)', 'How fast the pheromone dart flies.', 'flare'],
    ['Command', 'flareRange', 60, 600, 10, 'Dart range (u)', 'How far it flies before it fizzles.', 'flare'],
    ['Command', 'flareAssist', 0, 20, 0.5, 'Dart aim assist (u)', 'A prism within this of the dart\'s line counts as hit.', 'flare'],
    ['Command', 'flareRadius', 4, 80, 1, 'Scent radius (u)', 'Prisms of the struck prism\'s domain within this of the hit become the order.', 'flare'],
    ['Command', 'flareCd', 0, 3, 0.05, 'Dart cooldown (s)', 'Time between darts.', 'flare'],
    ['Command', 'gazeRange', 40, 500, 10, 'Gaze reach (u)', 'How far the reticle can lock.', 'gaze'],
    ['Command', 'gazeCone', 1, 15, 0.5, 'Gaze cone (°)', 'How close to the reticle a prism must be.', 'gaze'],
    ['Command', 'gazeDwell', 0, 2, 0.05, 'Dwell to lock (s)', 'Hold the reticle on one structure this long to lock the whole structure.', 'gaze'],
    ['Command', 'loopStep', 1, 12, 0.5, 'Leash sample (u)', 'The leash trail drops a point every this many units.', 'lasso'],
    ['Command', 'loopClose', 4, 60, 1, 'Close distance (u)', 'Return within this of the leash\'s start and the loop closes itself.', 'lasso'],
    ['Command', 'loopDepth', 5, 150, 1, 'Loop depth (u)', 'Prisms within this of the loop\'s plane and inside it are taken.', 'lasso'],
    ['Command', 'loopMin', 20, 600, 10, 'Shortest loop (u)', 'A loop must be at least this long to close itself.', 'lasso'],
    ['Command', 'slingAhead', 4, 40, 1, 'Ball distance (u)', 'Hold the trigger and the squad gathers in a ball this far ahead.', 'sling'],
    ['Command', 'slingSpeed', 40, 400, 5, 'Throw speed (u/s)', 'How fast the ball is thrown.', 'sling'],
    ['Command', 'slingCatch', 2, 30, 1, 'Catch radius (u)', 'A thrown creature that passes within this of an enemy prism latches on.', 'sling'],
    ['Command', 'slingCluster', 4, 80, 1, 'Latch cluster (u)', 'It then eats that prism\'s domain within this of the latch.', 'sling'],
    ['Command', 'slingTime', 0.5, 8, 0.1, 'Throw lasts (s)', 'A creature that latches onto nothing returns after this.', 'sling'],
    ['Command', 'feralSense', 5, 120, 1, 'Feral sense (u)', 'Baseline: tamed creatures attack any enemy prism within this, unbidden.', 'feral'],
    ['Lure', 'lureAhead', 4, 40, 1, 'Esca distance (u)', 'Where the lure light hangs, ahead of the nose.'],
    ['Lure', 'lureCruise', 0, 60, 1, 'Speed while luring (u/s)', 'Holding the lure slows the Angler to this. Lured fauna swim 16–38 u/s, so a hull at cruise outruns its own catch. Boost still overrides.'],

    ['Lure', 'tameRadius', 4, 80, 1, 'Hold radius (u)', 'Inside this the creature is held and taming fills.'],
    ['Lure', 'tameTime', 0.2, 10, 0.1, 'Time to tame (s)', 'Seconds a creature must be held.'],
    ['Lure', 'tameDecay', 0, 3, 0.05, 'Taming lost (/s)', 'How fast a half-tamed creature forgets you outside the hold.'],
    ['Lure', 'leashTow', 1, 4, 0.05, 'Leash tow ×', 'A following creature may swim this many times its own max speed to keep formation. 1 = no tow: at 1 the squad (32–40 u/s) cannot catch a 40 u/s hull and falls out of sight behind the chase camera. Attacks always run at the game\'s own speeds.'],
    ['Lure', 'formBack', -20, 60, 1, 'School ring behind (u)', 'Where the squad\'s ring sits behind the hull. Small values keep the school in the chase camera\'s view.'],
    ['Lure', 'squadCap', 3, 60, 1, 'Leash capacity', 'Most creatures you can lead at once.'],
    ['Squad', 'clawN', 0, 12, 1, 'Clawfish', 'Squad size in missions.'],
    ['Squad', 'quadN', 0, 12, 1, 'QuadFish', 'Squad size in missions.'],
    ['Squad', 'tadN', 0, 30, 1, 'Tadpoles', 'Squad size in missions.'],
    ['Squad', 'clawMax', 5, 80, 1, 'Clawfish max speed', 'ClawfishFaunaDataSO.maxSpeed.'],
    ['Squad', 'clawReach', 5, 80, 1, 'Clawfish mouth reach', 'ClawfishFaunaDataSO.consumeRadius: it eats from this far away (suction).'],

    ['Squad', 'tadBites', 1, 20, 1, 'Tadpole mouthful size', 'Boid maxClusterBites (C# default 6).'],
    ['Flight', 'cruise', 10, 120, 1, 'Cruise speed (u/s)', 'The Angler\'s cruise. Squirrel ships 60, Sparrow 35, Manta 180.'],
    ['Flight', 'boost', 20, 300, 5, 'Boost speed (u/s)', 'Speed with the boost held.'],
    ['Flight', 'turnRate', 30, 240, 5, 'Turn rate (°/s)', 'Full-stick pitch and yaw rate.'],
    ['Cell', 'dietAny', 0, 1, 1, 'Nucleus cell diet', '1: a nucleus cell, where fauna eat ANY domain outside the nucleus (the game\'s rule), so a mouthful near your trail eats your trail. 0: a cell without a nucleus, where fauna eat opposing domains only.'],

  // The command schemes the lab exists to compare. One trigger (RT / Space) drives every one, so both thumbs keep

    box.querySelector('#runBatch').onclick = () => {
      const note = box.querySelector('#batchNote'); note.textContent = 'Scoring…';
      setTimeout(() => { const t0 = performance.now(); lastRows = runBatch({ seeds: [1, 2, 3] }); lsSet('rows', lastRows); note.textContent = 'Scored in ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s (seeds 1–3, skilled and rookie).'; draw(); }, 30);
    };
    draw();
    return box;
  }
  function aboutPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p><span id="aboutLine"></span></p>' +
      '<p class="desc">The Angler is a proposed strategist hull (VesselClassType 17 is free). It lures wild fauna with the light on its stalk, tames the ones it holds there, and sends particular squads at particular prisms. This lab compares five ways to give that order, against a feral baseline and a no-squad control. The creatures are the game\'s own (Clawfish, QuadFish and Tadpoles at their shipped speeds), and they eat the way the game eats: a 2 s mouthful that takes the target and the prisms around it, any domain, outside the nucleus.</p>' +
      '<h3>What this lab does not model</h3><ul class="plain">' +
      '<li>The Angler\'s flight is a plain pitch/yaw model with the game\'s dual-stick mix on a pad, not the game\'s VesselTransformer. Its speeds are proposals.</li>' +
      '<li>No game code lets anything command a creature. Fauna.Goal is overwritten on every behaviour tick, so a port needs a persistent goal provider. Commanding here bends what a creature steers to; it still eats by its own mouthful rule.</li>' +
      '<li>Taming keeps a creature in the cell controller\'s colour with a leash, because the locked ecology rule says a cell never holds two fauna colours. Whether tamed fauna change colour is a design decision.</li>' +
      '<li>No separation between creatures, no starvation, no breeding, no predators (sharks eat creatures, never prisms), no shields, no danger prisms, no rival vessels, no network.</li>' +
      '<li>The battlefield is one fixed stand-in (two Ruby, two Gold and one Jade structure), not a cell from a real mode. Prism spacing is 4 u on trails.</li>' +
      '<li>The mouthful takes its neighbours nearest-first. The game takes them in its spatial index\'s order.</li>' +
      '<li>The commander AI is the lab\'s own. Its runs (approach, act, break away) are one competent style, and a better pilot could change a scheme\'s numbers.</li></ul>';
    box.querySelector('#aboutLine').textContent = LAB.name + ' · round ' + LAB.round + ' · models a ' + LAB.models + ' · branch ' + LAB.branch + ' · write-up ' + LAB.doc;
    return box;
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Scorecard', build: scorecardPanel }, { name: 'Decisions', build: logPanel }, { name: 'About', build: aboutPanel }], 'bottom');

  // ---------- transport, camera, touch, mouse ----------
  let paused = false, manualClock = false, aiDriving = false;
  function togglePause() { paused = !paused; $('tpPlay').textContent = paused ? '▶ Play' : '❚❚ Pause'; $('tpPlay').setAttribute('aria-pressed', String(paused)); }
  function restart() { reset(seed, { mode: S.mode, scheme: S.scheme }); if (R3) R3.cam.pos.set(START_P[0], START_P[1] + 5, START_P[2] + 16); lastHumanT = performance.now(); }
  function setCam(c) { S.cam = c; lsSet('S', S); $('camSel').value = c; }
  $('tpPlay').onclick = togglePause; $('tpStop').onclick = restart;
  $('camSel').value = S.cam; $('camSel').onchange = () => setCam($('camSel').value);
  $('roundTag').textContent = 'Round ' + LAB.round; $('meta').textContent = 'Strategist vessel · command fauna at prisms · a design, not the shipped game';
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); lsSet('P', {}); dock.refresh(); restart(); refreshDiff(); };
  const stageWrap = $('stageWrap');
  stageWrap.addEventListener('contextmenu', (e) => e.preventDefault());
  let drag = null;
  stageWrap.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch' || e.target.closest('#transport,#camTag,#touch')) return;
    if (S.cam === 'orbit' && e.shiftKey) { drag = { x: e.clientX, y: e.clientY }; return; }
    if (e.button === 0) mouse.left = true; if (e.button === 2) mouse.right = true;
    if (S.cam === 'orbit' && e.button === 1) drag = { x: e.clientX, y: e.clientY };
  });
  addEventListener('pointerup', (e) => { if (e.button === 0) mouse.left = false; if (e.button === 2) mouse.right = false; drag = null; });
  addEventListener('pointermove', (e) => { if (!drag || !R3) return; R3.cam.orbitYaw -= (e.clientX - drag.x) * 0.006; R3.cam.orbitPitch = clamp(R3.cam.orbitPitch + (e.clientY - drag.y) * 0.006, -1.4, 1.4); drag = { x: e.clientX, y: e.clientY }; });
  stageWrap.addEventListener('wheel', (e) => { if (S.cam !== 'orbit' || !R3) return; e.preventDefault(); R3.cam.orbitDist = clamp(R3.cam.orbitDist * Math.exp(e.deltaY * 0.001), 30, 900); }, { passive: false });
  if (PLATFORM.device === 'phone') {
    $('touch').hidden = false;
    let first = true;
    stageWrap.addEventListener('touchstart', () => { if (first) { first = false; try { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => {}); } catch (e) { /* the viewer may refuse */ } } }, { passive: true });
    const zone = $('stickZone');
    zone.addEventListener('pointerdown', (e) => { touch.stick = { id: e.pointerId, x: e.clientX, y: e.clientY }; touch.sx = 0; touch.sy = 0; try { zone.setPointerCapture(e.pointerId); } catch (er) { /* ok */ } });
    zone.addEventListener('pointermove', (e) => { if (!touch.stick || e.pointerId !== touch.stick.id) return; touch.sx = (e.clientX - touch.stick.x) / 50; touch.sy = (e.clientY - touch.stick.y) / 50; });
    const endStick = (e) => { if (touch.stick && e.pointerId === touch.stick.id) { touch.stick = null; touch.sx = touch.sy = 0; } };
    zone.addEventListener('pointerup', endStick); zone.addEventListener('pointercancel', endStick);
    for (const [id, key] of [['tLure', 'lure'], ['tCmd', 'cmd'], ['tSquad', 'squad'], ['tBoost', 'boost']]) {
      const el = $(id);
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); touch[key] = true; el.classList.add('on'); });
      const up = () => { touch[key] = false; el.classList.remove('on'); };
      el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up);
    }
  }

  // ---------- the loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    const real = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) {
      if (!paused) {
        acc += real;
        const human = humanInput(), pilot = S.pilot || 'you';
        while (acc >= world.dt) {
          acc -= world.dt;
          aiDriving = pilot !== 'you' || performance.now() - lastHumanT > 4000;
          simStep(world.dt, aiDriving ? commander(world, brainOf(pilot === 'rookie' ? 'rookie' : 'skilled')) : human);
        }
      }
      render();
    }
    requestAnimationFrame(frame);
  }
  reset(seed, { mode: S.mode, scheme: S.scheme }); lastHumanT = performance.now(); refreshDiff(); render(); requestAnimationFrame(frame);

  // ---------- the test surface (labmaker §2.2) ----------
  window.__lab = window.__anglerLab = {
    LAB, SHIPPED, SPEC, P, S, PLATFORM, SCHEMES, SPECIES, TASKS, SCENE,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n, input) { dt = dt || world.dt; n = n || 1; for (let i = 0; i < n; i++) simStep(dt, typeof input === 'function' ? input(world) : (input || commander(world, brainOf('skilled')))); render(); },
    reset: (s, opts) => reset(s, opts), score: () => score(), runBatch, runMission, setParam, record, commander: (kind) => commander(world, brainOf(kind || 'skilled')),
    state: () => ({ t: world.t, seed, scheme: world.scheme, mode: world.mode, taskIdx: world.taskIdx, squadSel: world.squadSel, tamed: world.m.tamed, alive: world.alive.reduce((a, x) => a + x, 0), fauna: world.fauna.map((f) => ({ sp: f.sp, state: f.state, p: [f.x, f.y, f.z] })) }),
    world: () => world,
    gl: () => R3 && { calls: R3.renderer.info.render.calls, triangles: R3.renderer.info.render.triangles, fauna: R3.fmesh.map((m) => m.count), faunaColor0: R3.fmesh.map((m) => m.instanceColor && Array.from(m.instanceColor.array.slice(0, 3)).map((x) => +x.toFixed(2))), faunaMat: R3.fmesh.map((m) => m.material.type) },
  };
})();
</script>
</body>
</html>
