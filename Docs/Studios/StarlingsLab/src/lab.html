<!doctype html>
<!--
  STARLINGS LAB — the passive swarm card vessel (Garrett, 2026-10-20). Source of Docs/Studios/StarlingsLab.html:
    python3 Docs/Studios/StarlingsLab/build.py     (injects Docs/Studios/SwarmCardVessel/cards.json)
    node .claude/skills/labmaker/verify_lab.cjs Docs/Studios/StarlingsLab.html
  Built from .claude/skills/labmaker/template/lab.html (the lab contract: SHIPPED, SPEC, seeded runs,
  manual clock, window.__lab, headless scorecard, decision log, an honest not-modelled list).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Starlings Lab</title>
<style>
  :root {
    --bg: #eef2f6; --panel: #ffffff; --ink: #142030; --muted: #586579; --line: #d6dde6;
    --accent: #1f7fa8; --warn: #b4560b; --ok: #1f7a43; --stage: #04101c; --changed: #1f7fa8;
    --mass: #2f6fe0; --time: #0f9488; --space: #7a4fd8; --charge: #b07a00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b121b; --panel: #121c28; --ink: #e4ebf3; --muted: #93a2b6; --line: #24324a;
      --accent: #58b8de; --warn: #f0a050; --ok: #5cc98a; --stage: #02080f; --changed: #58b8de;
      --mass: #6aa0ff; --time: #3fd6c5; --space: #a988ff; --charge: #f2c14e; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b121b; --panel: #121c28; --ink: #e4ebf3; --muted: #93a2b6; --line: #24324a;
    --accent: #58b8de; --warn: #f0a050; --ok: #5cc98a; --stage: #02080f; --changed: #58b8de;
    --mass: #6aa0ff; --time: #3fd6c5; --space: #a988ff; --charge: #f2c14e; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  #app { display: grid; height: 100vh; grid-template-columns: minmax(0, 1fr) 330px; grid-template-rows: auto minmax(0, 1fr) 210px; grid-template-areas: "head head" "stage dock" "bottom dock"; }
  header { grid-area: head; display: flex; gap: 8px 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; }
  header .meta { color: var(--muted); }
  header .spacer { flex: 1; }
  header select { width: auto; }
  #diff { color: var(--changed); }
  #stageWrap { grid-area: stage; position: relative; min-height: 0; background: var(--stage); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage { width: 100%; height: 100%; display: block; }
  #hud { position: absolute; left: 10px; top: 8px; right: 10px; color: #cfe0ee; font: 12px/1.45 ui-monospace, Menlo, monospace; pointer-events: none; }
  #phases { display: flex; gap: 4px; margin-bottom: 4px; }
  #phases div { flex: 1; border: 1px solid #2c4560; border-radius: 4px; padding: 2px 6px; background: rgba(4,16,28,.6); overflow: hidden; position: relative; white-space: nowrap; text-overflow: ellipsis; }
  #phases div.on { border-color: #9fe3ff; color: #fff; }
  #phases div i { position: absolute; left: 0; bottom: 0; height: 3px; background: #9fe3ff; }
  #hand { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 6px; justify-content: center; }
  #hand button { flex: 1 1 0; max-width: 210px; min-width: 0; text-align: left; border: 1px solid var(--c); border-radius: 8px; background: rgba(6,18,30,.92); color: #e7f0f8; padding: 6px 8px; cursor: pointer; font: 12px/1.3 system-ui, sans-serif; }
  #hand button b { display: block; color: var(--c); font-size: 13px; }
  #hand button small { display: block; color: #a7b6c6; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  #hand button:focus-visible { outline: 2px solid #fff; }
  #handNote { position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 4px; text-align: center; color: #cfe0ee; font: 12px system-ui, sans-serif; pointer-events: none; }
  #stick { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border: 2px solid rgba(160,220,255,.35); border-radius: 50%; pointer-events: none; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: rgba(160,220,255,.5); }
  #dock { grid-area: dock; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px 16px 16px; }
  #bottom { grid-area: bottom; border-top: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px 16px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .tabs button, .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  .tabs button[aria-selected="true"], .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 64px; gap: 2px 8px; margin: 8px 0; }
  .row label { display: flex; gap: 6px; align-items: baseline; }
  .row label .key { color: var(--muted); font: 11px ui-monospace, monospace; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  .row output.changed { color: var(--changed); text-decoration: underline; }
  .row .tip { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .hint { color: var(--muted); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); }
  .best { font-weight: 700; color: var(--ok); }
  .status-ok { color: var(--ok); } .status-warn { color: var(--warn); }
  textarea, select, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .held { display: grid; gap: 4px; }
  .held div { border-left: 3px solid var(--c); padding: 2px 8px; }
  .held div span { color: var(--muted); }
  @media (max-width: 900px) {
    body { overflow: auto; }
    #app { display: block; height: auto; }
    #stageWrap { height: 78vh; min-height: 320px; }
    #dock, #bottom { border: 0; border-top: 1px solid var(--line); }
    header, #dock, #bottom { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    #hand button small { -webkit-line-clamp: 2; }
  }
  /* a phone held sideways: one header row, the stage fills the rest of the screen so the hand is in view */
  @media (max-height: 520px) {
    header { padding-top: 4px; padding-bottom: 4px; flex-wrap: nowrap; overflow-x: auto; }
    header .meta, #diff, #resetAll { display: none; }
    #stageWrap { height: calc(100vh - 46px); height: calc(100svh - 46px); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title"></h1>
    <span class="meta" id="meta"></span>
    <span id="diff"></span>
    <span class="spacer"></span>
    <label class="meta" for="game">Game</label>
    <select id="game"><option value="sandbox">Sandbox</option><option value="race">Time race</option></select>
    <select id="course" title="Time race course" hidden><option value="random">Any course</option><option value="open">Open water</option><option value="bends">Bends</option><option value="hairpins">Hairpins</option></select>
    <label class="meta" for="intensity">Intensity</label>
    <select id="intensity"><option value="1">I1</option><option value="2" selected>I2</option><option value="3">I3</option><option value="4">I4</option></select>
    <label class="meta" for="picker">Cards</label>
    <select id="picker"><option value="you">You pick</option><option value="random">AI: random</option><option value="Mass">AI: Mass first</option><option value="Time">AI: Time first</option><option value="Space">AI: Space first</option><option value="Charge">AI: Charge first</option><option value="rotate">AI: rotate elements</option><option value="course">AI: Time, reads the course</option></select>
    <span class="meta" id="platform"></span>
    <button class="btn" id="speed">×1</button>
    <button class="btn" id="pause">Pause</button>
    <button class="btn" id="restart">Restart</button>
    <button class="btn" id="resetAll">Lab defaults</button>
  </header>
  <div id="stageWrap"><canvas id="stage"></canvas>
    <div id="hud"><div id="phases"></div><div id="hudText"></div></div>
    <div id="stick" hidden><i></i></div>
    <div id="hand" hidden><div id="handNote"></div></div>
  </div>
  <aside id="dock"><div class="tabs" id="dockTabs" role="tablist"></div><div id="dockBody"></div></aside>
  <section id="bottom"><div class="tabs" id="bottomTabs" role="tablist"></div><div id="bottomBody"></div></section>
</div>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const CARDS = /*CARDS*/null;   // Docs/Studios/SwarmCardVessel/cards.json, injected by build.py

  // ================= (1) LAB meta + the numbers =================
  // Nothing of this vessel is in the game yet, so almost every number is the lab's PROPOSAL. Card numbers are
  // read from cards.json (the card list is their source). Game rules the lab copies are named.
  const LAB = { name: 'Starlings Lab', branch: 'claude/project-thread-pkoq70', round: 1, doc: 'Docs/Studios/STARLINGS_LAB.md', cards: 'revision ' + CARDS.revision };
  const SHIPPED = {
    tOmni: 30,        // lab proposal: Omnicrystal phase timer (s)            (SWARM_CARD_VESSEL.md, the phase table)
    tElem: 25,        // lab proposal: Elemental crystals phase timer (s)
    tVessel: 25,      // lab proposal: Opposing vessels phase timer (s)
    tMass: 25,        // lab proposal: Opposing mass phase timer (s)
    goalY: 5,         // lab proposal: Y, elemental crystals that end that phase early
    goalX: 30,        // lab proposal: X, opposing prisms removed that end that phase early
    startSize: 120,   // members at the start: 5x the card baseline's 24 for a murmuration (Garrett, 2026-10-21)
    cap: 200,         // swarm cap: 5x the card baseline's 40 (Garrett, 2026-10-21; Big Family raises it)
    minSize: 30,      // protected minimum, below which nothing harms the swarm (Garrett: "just like other vessels"); 5x the 6
    cruise: 120,      // lab: member cruise speed (u/s); faster than the cards' 60 u/s baseline so a phase can be crossed
    turn: 70,         // lab: member turn rate (°/s) before Agility
    lvMass: 1,        // lab: the Mass element's upgrade level (drawn Mass cards arrive at it)
    lvTime: 1,        // lab: the Time element's upgrade level
    lvSpace: 1,       // lab: the Space element's upgrade level
    lvCharge: 1,      // lab: the Charge element's upgrade level
    slab: 260,        // lab: half-thickness of the viewing plane's sharp slice (u), the 2.5D stand-in
    viewSpan: 1400,   // lab: world units across the short side of the screen   (the Shepherd lab's view)
  };
  const SPEC = [
    ['Phases', 'tOmni', 10, 60, 1, 'Omnicrystal timer (s)', 'How long the swarm hunts the omnicrystal. A hand is dealt when this phase ends, crystal or not.'],
    ['Phases', 'tElem', 10, 60, 1, 'Elemental crystals timer (s)', 'How long the swarm chases elemental crystals before the cycle moves on.'],
    ['Phases', 'tVessel', 10, 60, 1, 'Opposing vessels timer (s)', 'How long the swarm goes after rival vessels.'],
    ['Phases', 'tMass', 10, 60, 1, 'Opposing mass timer (s)', 'How long the swarm goes after enemy prisms.'],
    ['Phases', 'goalY', 1, 15, 1, 'Y: crystals to end early', 'Elemental crystals collected in the phase that end it before its timer.'],
    ['Phases', 'goalX', 5, 100, 5, 'X: prisms to end early', 'Enemy prisms destroyed or stolen in the phase that end it before its timer.'],
    ['Swarm', 'startSize', 6, 300, 1, 'Start size', 'Members the swarm starts with.'],
    ['Swarm', 'cap', 20, 400, 1, 'Cap', 'Most members the swarm can hold before Big Family.'],
    ['Swarm', 'minSize', 0, 100, 1, 'Protected minimum', 'At or below this many members nothing can harm the swarm.'],
    ['Swarm', 'cruise', 40, 240, 5, 'Cruise (u/s)', 'Member cruise speed before Time cards.'],
    ['Swarm', 'turn', 20, 200, 5, 'Turn rate (°/s)', 'How fast a member can swing round before Agility.'],
    ['Elements', 'lvMass', 1, 15, 1, 'Mass upgrade level', 'Your between-runs Mass level: every Mass card you draw arrives at this level.'],
    ['Elements', 'lvTime', 1, 15, 1, 'Time upgrade level', 'Every Time card you draw arrives at this level.'],
    ['Elements', 'lvSpace', 1, 15, 1, 'Space upgrade level', 'Every Space card you draw arrives at this level.'],
    ['Elements', 'lvCharge', 1, 15, 1, 'Charge upgrade level', 'Every Charge card you draw arrives at this level.'],
    ['View', 'slab', 60, 900, 20, 'Slice half-thickness (u)', 'Things within this distance of your viewing plane draw sharp; the rest fade. A stand-in for the Wrasse 2.5D look.'],
    ['View', 'viewSpan', 600, 3000, 50, 'View span (u)', 'World units across the short side of the screen.'],
  ];
  const LS_KEY = 'lab:' + LAB.name + ':P';
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private window */ } };
  const P = Object.assign({}, SHIPPED, lsGet(LS_KEY, {}));
  for (const k of Object.keys(P)) if (!(k in SHIPPED)) delete P[k];

  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ================= cards: which of the 80 the lab runs, and their numbers =================
  const ELS = ['Mass', 'Time', 'Space', 'Charge'];
  const IMPL = {
    Mass: ['mass-mound-builders', 'mass-danger-drip', 'mass-carapace', 'mass-brood', 'mass-big-family', 'mass-snowball'],
    Time: ['time-quickening', 'time-agility', 'time-dragonfly', 'time-skip-ahead', 'time-hurry-up', 'time-blink-step'],
    Space: ['space-hole-punch', 'space-wide-bite', 'space-annex', 'space-shield-eaters', 'space-black-hole', 'space-split'],
    Charge: ['charge-lasers', 'charge-emp', 'charge-tesla-coil', 'charge-short-circuit', 'charge-sting', 'charge-chain-lightning'],
  };
  const CARD = {}; for (const c of CARDS.cards) CARD[c.id] = c;
  // The AI's favourites when it builds one element (lab, 2026-11-01): what a player who chose that element would take
  // first. Before this the AI took a random card of the element, which hid what an element can do on a course.
  const FAVOURITE = {
    Mass: ['mass-brood', 'mass-carapace', 'mass-big-family', 'mass-mound-builders', 'mass-snowball', 'mass-danger-drip'],
    Time: ['time-skip-ahead', 'time-dragonfly', 'time-quickening', 'time-hurry-up', 'time-agility', 'time-blink-step'],
    Space: ['space-hole-punch', 'space-shield-eaters', 'space-wide-bite', 'space-black-hole', 'space-split', 'space-annex'],
    Charge: ['charge-sting', 'charge-lasers', 'charge-emp', 'charge-short-circuit', 'charge-chain-lightning', 'charge-tesla-coil'],
  };
  for (const el of ELS) for (const id of IMPL[el]) if (!CARD[id]) throw new Error('Starlings Lab: card ' + id + ' is not in cards.json');
  function sv(id, i, L) {           // stat i of card id at level L, by the card's own formula (same rule as the deck page)
    const s = CARD[id].stats[i];
    const v = s.kind === 'lin' ? s.a + s.b * (L - 1) : s.a * Math.pow(s.b, L - 1);
    return s.dec === 0 ? Math.floor(v + 1e-9) : v;
  }

  // ================= (3) THE MODEL =================
  const PHASES = [
    { key: 'omni', name: 'Omnicrystal', t: 'tOmni' },
    { key: 'elem', name: 'Elemental crystals', t: 'tElem' },
    { key: 'vessel', name: 'Opposing vessels', t: 'tVessel' },
    { key: 'mass', name: 'Opposing mass', t: 'tMass' },
  ];
  const INT = {   // the intensity ladder (lab proposal)
    1: { rivals: 1, clusters: 3, shielded: 0.0, fire: 4.0, fauna: 4 },
    2: { rivals: 2, clusters: 5, shielded: 0.15, fire: 3.0, fauna: 6 },
    3: { rivals: 3, clusters: 7, shielded: 0.3, fire: 2.2, fauna: 9 },
    4: { rivals: 4, clusters: 9, shielded: 0.45, fire: 1.6, fauna: 12 },
  };
  const R = 900;            // lab: the cell's radius (u)
  const CLUSTER = 30;       // lab: enemy prisms per cluster
  let W = null, seed = 7, intensity = 2, picker = 'you', game = 'sandbox';

  // ================= the Time race: the Starlings' Time arcade game (Garrett, 2026-11-02) =================
  // "There should be different arcade games for different elements, so it should be fine if someone picks all Time
  // cards on all four intensity levels of the Time arcade game. The skill should be in picking Time cards best suited to
  // the random factors of the race. The race should still be about getting through the switches fastest, because then
  // the Starlings could be taken to Regatta." So: a closed loop of switch rings flown LAPS times, as in Regatta. While
  // racing, the swarm's objective is the next switch (the mode sets the objective; the swarm's flight and its cards are
  // unchanged). The phase cycle still runs on its timers and deals the hands; omnicrystals may lie on the line.
  // Each race draws its course from its seed and shows it before the start (an omnicrystal always lies mid-leg ahead of
  // the swarm, so hands keep coming; with hands only on the timers a race dealt one card and left no choice):
  //   Open water: 6 switches on a wide loop (long straights)
  //   Bends: 8 switches weaving in and out (medium turns)
  //   Hairpins: 8 switches that zigzag between the middle and the edge (sharp turns)
  // Intensity narrows the switches and adds rivals that hang round them and shoot starlings.
  const LAPS = 3;
  const RACE_I = { 1: { ringR: 90, rivals: 0 }, 2: { ringR: 75, rivals: 1 }, 3: { ringR: 60, rivals: 2 }, 4: { ringR: 50, rivals: 3 } };
  const SHAPES = { open: { name: 'Open water', hint: 'long straights', n: 6, inner: 0.8 }, bends: { name: 'Bends', hint: 'medium turns', n: 8, inner: 0.55 }, hairpins: { name: 'Hairpins', hint: 'sharp turns', n: 8, inner: 0.3 } };
  const RACE_KEYS = ['open', 'bends', 'hairpins'];
  let raceSel = 'random';
  function buildCourse() {      // W.course from raceSel, or from the seed when it is 'random'
    const key = raceSel === 'random' ? RACE_KEYS[seed % RACE_KEYS.length] : raceSel, sh = SHAPES[key], n = sh.n, rings = [];
    for (let k = 0; k < n; k++) {
      const a = k / n * Math.PI * 2, r = R * (k % 2 ? 0.85 : sh.inner), z = key === 'open' ? Math.sin(2 * a) * R * 0.25 : (k % 2 ? 1 : -1) * R * 0.2;
      rings.push([Math.cos(a) * r, Math.sin(a) * r, z]);
    }
    W.course = { key, shape: key, rings, ringR: RACE_I[intensity].ringR };
  }
  const ringAt = (j) => W.course.rings[((j % W.course.rings.length) + W.course.rings.length) % W.course.rings.length];
  const raceLen = () => W.course.rings.length * LAPS;

  const v3 = (x, y, z) => [x, y, z];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const len = (a) => Math.hypot(a[0], a[1], a[2]);
  const d2 = (a, b) => { const x = a[0] - b[0], y = a[1] - b[1], z = a[2] - b[2]; return x * x + y * y + z * z; };
  function inBall(rnd, r) { for (;;) { const p = [rnd() * 2 - 1, rnd() * 2 - 1, rnd() * 2 - 1]; if (len(p) <= 1) return [p[0] * r, p[1] * r, p[2] * r]; } }

  function lv(id) { return W.held[id] || 0; }
  function has(id) { return (W.held[id] || 0) > 0; }

  function reset(s) {
    if (s != null) seed = s >>> 0;
    const rnd = mulberry32(seed), I = INT[intensity];
    W = { t: 0, rnd, members: [], prisms: [], crystals: [], omni: null, omniRespawn: 0, rivals: [], fauna: [], held: {}, hand: null, handEl: null, drawEl: null, hands: 0,
      phase: 0, phaseT: 0, phaseCount: { omni: 0, elem: 0, vessel: 0, mass: 0 }, early: { omni: 0, elem: 0, vessel: 0, mass: 0 },
      elemTimes: [], gotY: 0, removedX: 0, debuffed: false, cd: {}, form: null, formT: 0, stats: { removed: 0, stolen: 0, laid: 0, petals: 0, kos: 0, debuffs: 0, fauna: 0, crystals: 0, omnis: 0, lost: 0 },
      events: [], nextId: 1, splitT: 0, blackHoleUsed: false };
    W.done = 0; W.finishT = null;
    if (game === 'race') buildCourse();
    const n = Math.round(P.startSize), home = game === 'race' ? ringAt(-1) : [0, 0, 0];
    for (let i = 0; i < n; i++) { const o = inBall(rnd, 60); addMember([home[0] + o[0], home[1] + o[1], home[2] + o[2]]); }
    if (game === 'race') {    // the course: switches, maybe an omnicrystal, rivals at the switches; no crystals, no fauna
      spawnOmni();
      for (let i = 0; i < RACE_I[intensity].rivals; i++) W.rivals.push(newRival());
      return;
    }
    for (let c = 0; c < I.clusters; c++) {
      const at = inBall(rnd, R * 0.75);
      for (let i = 0; i < CLUSTER; i++) { const p = inBall(rnd, 70); W.prisms.push({ p: [at[0] + p[0], at[1] + p[1], at[2] + p[2]], team: 'E', shield: rnd() < I.shielded ? 1 : 0, danger: false, alive: true, bites: 0 }); }
    }
    for (let i = 0; i < 12; i++) W.crystals.push({ p: inBall(rnd, R * 0.85), el: ELS[i % 4], alive: true });
    spawnOmni();
    for (let i = 0; i < I.rivals; i++) W.rivals.push(newRival());
    for (let i = 0; i < I.fauna; i++) W.fauna.push({ p: inBall(rnd, R * 0.8), v: [0, 0, 0], alive: true, eatT: 0, respawn: 0 });
  }
  function addMember(p) { W.members.push({ id: W.nextId++, p: p.slice(), v: [W.rnd() - 0.5, W.rnd() - 0.5, W.rnd() - 0.5].map((x) => x * 40), shells: 0, shellT: 0, alive: true, sw: 0, laserT: W.rnd() }); }
  function spawnOmni() {
    if (game !== 'race') { W.omni = { p: inBall(W.rnd, R * 0.8) }; return; }
    const a = ringAt(W.done + 1), b = ringAt(W.done + 2), o = inBall(W.rnd, 30);   // mid-leg, one leg ahead
    W.omni = { p: [(a[0] + b[0]) / 2 + o[0], (a[1] + b[1]) / 2 + o[1], (a[2] + b[2]) / 2 + o[2]] };

    stick.firstChild.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  });
  const endDrag = (e) => { if (!drag || e.pointerId !== drag.id) return; drag = null; spin.yaw = 0; spin.pitch = 0; stick.hidden = true; };
  wrap.addEventListener('pointerup', endDrag); wrap.addEventListener('pointercancel', endDrag);
  const keys = {};
  addEventListener('keydown', (e) => { if (e.target.matches && e.target.matches('input,textarea,select')) return; keys[e.key] = true; });
  addEventListener('keyup', (e) => { keys[e.key] = false; });

  // ================= UI: settings, tabs =================
  const outputs = {};
  function fmt(v, step) { const dec = step < 1 ? Math.min(3, String(step).split('.')[1].length) : 0; return Number(v).toFixed(dec); }
  function diffOnly() { const o = {}; for (const k of Object.keys(SHIPPED)) if (Math.abs(P[k] - SHIPPED[k]) > 1e-9) o[k] = P[k]; return o; }
  function refreshDiff() {
    const changed = Object.keys(diffOnly());
    $('diff').textContent = changed.length ? changed.length + ' setting' + (changed.length > 1 ? 's differ' : ' differs') + ' from the lab defaults' : 'lab defaults (all proposals)';
    for (const [, key, , , step] of SPEC) { const o = outputs[key]; if (!o) continue; o.out.textContent = fmt(P[key], step); o.out.classList.toggle('changed', Math.abs(P[key] - SHIPPED[key]) > 1e-9); o.out.title = 'lab default ' + SHIPPED[key]; }
  }
  function setParam(key, v) { P[key] = v; lsSet(LS_KEY, diffOnly()); if (key === 'startSize') reset(); refreshDiff(); }
  function makeTabs(barId, bodyId, tabs, storeKey) {
    const bar = $(barId), body = $(bodyId), sel = lsGet(storeKey, tabs[0].name);
    function show(name) { for (const b of bar.children) b.setAttribute('aria-selected', String(b.dataset.name === name)); body.replaceChildren(tabs.find((t) => t.name === name).build()); lsSet(storeKey, name); }
    for (const t of tabs) { const b = document.createElement('button'); b.textContent = t.name; b.dataset.name = t.name; b.setAttribute('role', 'tab'); b.onclick = () => show(t.name); bar.appendChild(b); }
    show(tabs.some((t) => t.name === sel) ? sel : tabs[0].name);
    return show;
  }
  function sliderGroup(group) {
    const box = document.createElement('div');
    for (const [g, key, lo, hi, step, label, tip] of SPEC) {
      if (g !== group) continue;
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = '<label><span></span><span class="key"></span></label><output></output><input type="range"><div class="tip"></div>';
      row.querySelector('label span').textContent = label; row.querySelector('.key').textContent = key; row.querySelector('.tip').textContent = tip;
      const inp = row.querySelector('input'); Object.assign(inp, { min: lo, max: hi, step, value: P[key], id: 'p-' + key });
      inp.oninput = () => setParam(key, parseFloat(inp.value));
      outputs[key] = { out: row.querySelector('output'), inp };
      box.appendChild(row);
    }
    queueMicrotask(refreshDiff);
    return box;
  }
  function heldPanel() {
    const box = document.createElement('div'); box.id = 'heldBox';
    fillHeld(box); return box;
  }
  function fillHeld(box) {
    const ids = Object.keys(W.held);
    let h = '<p class="hint">The lab runs 24 of the 80 cards (6 per element); a hand only draws from these. The deck page has all 80.</p>';
    h += ids.length ? '<div class="held">' + ids.map((id) => '<div style="--c:' + elColor(CARD[id].element) + '"><b></b> <span></span></div>').join('') + '</div>' : '<p>No cards yet. The first hand comes when the Omnicrystal phase ends.</p>';
    h += '<p><b>In the lab:</b></p><div class="held">' + ELS.map((el) => '<div style="--c:' + elColor(el) + '"><b>' + el + '</b> <span></span></div>').join('') + '</div>';
    box.innerHTML = h;
    const rows = box.querySelectorAll('.held')[0];
    if (ids.length) ids.forEach((id, i) => { rows.children[i].querySelector('b').textContent = CARD[id].name + ' L' + W.held[id]; rows.children[i].querySelector('span').textContent = CARD[id].text; });
    const impl = box.querySelectorAll('.held')[ids.length ? 1 : 0];
    ELS.forEach((el, i) => { impl.children[i].querySelector('span').textContent = IMPL[el].map((id) => CARD[id].name).join(', '); });
  }
  function refreshHeld() { const b = $('heldBox'); if (b) fillHeld(b); }
  readColors(); reset();
  const groups = [...new Set(SPEC.map((r) => r[0]))];
  makeTabs('dockTabs', 'dockBody', [{ name: 'Cards', build: heldPanel }].concat(groups.map((g) => ({ name: g, build: () => sliderGroup(g) }))), 'lab:' + LAB.name + ':dock');

  // ================= the decision log =================
  let db = null, me = '', remote = [], localLog = lsGet('lab:' + LAB.name + ':log', []);
  function snapshot() { return { round: LAB.round, seed, intensity, picker, held: Object.assign({}, W.held), changed: diffOnly() }; }
  async function record(topic, choice, note) {
    const doc = { topic, choice, note: note || '', createdAt: Date.now(), by: me, settings: snapshot() };
    if (db) { try { await db.collection('decisions').add(doc); return 'shared'; } catch (e) { /* fall through */ } }
    localLog.push(doc); lsSet('lab:' + LAB.name + ':log', localLog); return 'local';
  }
  function logPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint" id="logStatus"></p><input type="text" id="logTopic" placeholder="Topic (e.g. phase timers, a card)"><textarea id="logChoice" rows="2" placeholder="What you decided or felt"></textarea><p><button class="btn primary" id="logSave">Record</button> <button class="btn" id="logCopy">Copy log</button></p><table id="logTable"></table>';
    const status = box.querySelector('#logStatus');
    status.textContent = db ? 'Shared log: saved with the lab, readable by Claude.' : 'Kept in this browser (Copy log to send it).';
    status.className = db ? 'status-ok' : 'status-warn';
    box.querySelector('#logSave').onclick = async () => { const where = await record(box.querySelector('#logTopic').value || 'General', box.querySelector('#logChoice').value); status.textContent = where === 'shared' ? 'Recorded in the shared log.' : 'Recorded in this browser.'; renderLog(box); };
    box.querySelector('#logCopy').onclick = () => { const t = remote.concat(localLog).map((d) => new Date(d.createdAt).toISOString() + ' · ' + d.topic + ': ' + d.choice + ' ' + JSON.stringify(d.settings)).join('\n'); try { navigator.clipboard.writeText(t).catch(() => {}); } catch (e) { /* no clipboard */ } };
    renderLog(box);
    return box;
  }
  function renderLog(box) {
    const t = (box || document).querySelector('#logTable'); if (!t) return;
    const rows = remote.concat(localLog).sort((a, b) => b.createdAt - a.createdAt).slice(0, 50);
    t.innerHTML = '<tr><th>When</th><th>Topic</th><th>Decision</th></tr>';
    for (const d of rows) { const tr = document.createElement('tr'); for (const v of [new Date(d.createdAt).toLocaleString(), d.topic, d.choice]) { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); } t.appendChild(tr); }
  }
  (async function connect() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try { db = await c.use('db'); } catch (e) { db = null; }
    try { const u = await c.use('user'); if (u) me = (await u.id()) || ''; } catch (e) { me = ''; }
    if (!db) return;
    db.collection('decisions').orderBy('createdAt', 'desc').limit(300).onSnapshot((snap) => { remote = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderLog(); }, () => { db = null; });
  })();

  const COLS = [['timeRace', 'Time: crystal race (s, lower wins)', -1], ['spaceRemoved', 'Space: enemy prisms removed', 1], ['massStanding', 'Mass: your prisms standing', 1], ['chargeScore', 'Charge: petals + KOs + fauna', 1], ['hands', 'Hands', 0], ['members', 'Starlings at end', 0]];
  function scorecardPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p><button class="btn" id="runRace">Run the time race</button> <span class="hint">headless, seeds 1–3 on each course at the current intensity, Time cards at level 5; seconds to thread every switch of all three laps (lower wins). Every build is all Time; they differ in which card they take first.</span></p><table id="raceTable"></table>' +
      '<p><button class="btn primary" id="runBatch">Run the scorecard</button> <span class="hint">headless, seeds 1–3, 300 s each at the current intensity, with every element\'s upgrade level at 5 so a few picks show; the AI picks cards by the rule in each row. Each "X first" build should win its own element\'s column.</span></p><div style="overflow-x:auto"><table id="scoreTable"></table></div>';
    box.querySelector('#runRace').onclick = () => {
      const out = runRaceCourses({ seeds: [1, 2, 3] }), t = box.querySelector('#raceTable');
      t.innerHTML = '<tr><th>Build</th>' + RACE_KEYS.map((k) => '<th>' + k + '</th>').join('') + '</tr>';
      RACE_VARIANTS.forEach((va, vi) => { const tr = document.createElement('tr'), td0 = document.createElement('td'); td0.textContent = va.name; tr.appendChild(td0);
        for (const k of RACE_KEYS) { const td = document.createElement('td'), v = out[k][vi].race; td.textContent = v; if (v === Math.min(...out[k].map((r) => r.race))) td.className = 'best'; tr.appendChild(td); }
        t.appendChild(tr); });
    };
    box.querySelector('#runBatch').onclick = () => {
      const rows = runBatch(), t = box.querySelector('#scoreTable');
      t.innerHTML = '<tr><th>Build</th>' + COLS.map((c) => '<th>' + c[1] + '</th>').join('') + '</tr>';
      for (const r of rows) {
        const tr = document.createElement('tr'); tr.innerHTML = '<td></td>' + COLS.map(() => '<td></td>').join(''); tr.children[0].textContent = r.variant;
        COLS.forEach(([k, , dir], i) => { const td = tr.children[i + 1]; td.textContent = r[k]; if (dir) { const vals = rows.map((x) => x[k]), best = dir > 0 ? Math.max(...vals) : Math.min(...vals); if (r[k] === best) td.className = 'best'; } });
        t.appendChild(tr);
      }
    };
    return box;
  }
  function aboutPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p id="aboutHead"></p>' +
      '<p><b>How to play.</b> You do not steer the starlings. Drag anywhere on the stage to turn your view (it works like a joystick and stops when you let go; arrow keys work too). The swarm works four objectives in turn on timers; each phase ends early when its goal is met. When the Omnicrystal phase ends, crystal or not (or you collect an omnicrystal in another phase), you get a hand. The first hand is four cards, one per element. After you pick, choose the element of the next hand with the buttons under the stage, or keep the one you have (your first pick sets it); every later hand is five different cards of that element. Pick one; the swarm keeps going while you read. A card you already hold adds its level, up to 15.</p>' +
      '<p class="hint"><b>What this lab does NOT model.</b> The view is a 2D canvas projection with a depth fade, a stand-in for the Wrasse\'s 2.5D look. Rivals are scripted wanderers that lay prisms, take crystals and shoot starlings; they are not players and they do not use abilities. Fauna only graze your prisms. A prism is a point with no volume. Only 24 of the 80 cards are wired, and their side effects are simplified. Every number is a proposal: nothing of this vessel exists in the game yet. No networking, no frame-time measurement on a phone GPU, no collider budget.</p>';
    box.insertAdjacentHTML('beforeend', '<p><b>Time race (the Starlings\' Time arcade game, 2026-11-02).</b> Pick <i>Time race</i> in the game menu, then a course (or <i>Any course</i>, which draws one per race). The swarm races a closed loop of switch rings, three laps, as in Regatta: while racing, its objective is always the next switch. The phases still run on their timers and deal the hands; build Time and pick the Time cards that suit the course. Each race draws its course, shown before the start: <b>Open water</b> (long straights), <b>Bends</b> (medium turns) or <b>Hairpins</b> (sharp turns); an omnicrystal always lies on the line ahead, so hands keep coming. Intensity narrows the switches and adds rivals that shoot starlings round them. The vessel is unchanged; only the course is the mode\'s.</p>');
    box.querySelector('#aboutHead').textContent = LAB.name + ' · round ' + LAB.round + ' · cards ' + LAB.cards + ' · ' + LAB.branch + ' · write-up: ' + LAB.doc;
    return box;
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'About', build: aboutPanel }, { name: 'Scorecard', build: scorecardPanel }, { name: 'Decisions', build: logPanel }], 'lab:' + LAB.name + ':bottom');

  $('title').textContent = LAB.name; $('meta').textContent = 'round ' + LAB.round + ' · the Starlings';
  let paused = false, mult = 1;
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
  $('speed').onclick = () => { mult = mult === 1 ? 4 : 1; $('speed').textContent = '×' + mult; };
  $('restart').onclick = () => { reset(seed + 1); refreshHeld(); };
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); lsSet(LS_KEY, {}); for (const k in outputs) outputs[k].inp.value = P[k]; reset(); refreshDiff(); refreshHeld(); };
  $('intensity').onchange = (e) => { intensity = +e.target.value; reset(); refreshHeld(); };
  $('game').onchange = (e) => { game = e.target.value; $('course').hidden = game !== 'race'; reset(); };
  $('course').onchange = (e) => { raceSel = e.target.value; reset(); };
  $('picker').onchange = (e) => { picker = e.target.value; if (W.hand && picker !== 'you') { autoPick(); refreshHeld(); } };

  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now(), acc = 0, lastHeld = '';
  function frame(now) {
    const real = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) {
      resize();
      const ky = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0), kp = (keys.ArrowDown ? 1 : 0) - (keys.ArrowUp ? 1 : 0);
      turnView((spin.yaw + ky * 1.2) * real, (spin.pitch + kp * 1.2) * real);
      if (!paused) { acc += real * mult; while (acc >= 1 / 30) { simStep(1 / 30); acc -= 1 / 30; } }
      render();
      const hk = JSON.stringify(W.held); if (hk !== lastHeld) { lastHeld = hk; refreshHeld(); }
    }
    requestAnimationFrame(frame);
  }
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readColors); } catch (e) { /* old browser */ }
  turnView(0.5, 0.35);
  resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  window.__lab = {
    LAB, SHIPPED, SPEC, P, PLATFORM, VARIANTS, CARDS, IMPL,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { dt = dt || 1 / 30; n = n || 1; for (let i = 0; i < n; i++) simStep(dt); resize(); render(); },
    reset, score, runBatch, runRace, runRaceCourses, setCourse(c) { raceSel = c; reset(); }, give(id, level) { W.held[id] = level; }, setParam, setGame(g) { game = g; reset(); }, record, pick, turnView,
    setIntensity(i) { intensity = i; reset(); }, setPicker(p) { picker = p; },
    state: () => ({ t: W.t, seed, intensity, picker, phase: PHASES[W.phase].key, phaseT: W.phaseT, members: alive().length, hand: W.hand && W.hand.map((c) => c.id), drawEl: W.drawEl, held: Object.assign({}, W.held), form: W.form }),
  };
})();
</script>
