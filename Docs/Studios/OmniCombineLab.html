      row.querySelector('label span').textContent = label; row.querySelector('.key').textContent = key; row.querySelector('.tip').textContent = tip;
      const inp = row.querySelector('input'); inp.id = 'k_' + key; Object.assign(inp, { min: lo, max: hi, step, value: P[key] });
      inp.oninput = () => setParam(key, parseFloat(inp.value));
      outputs[key] = { out: row.querySelector('output'), inp };
      box.appendChild(row);
    }
    queueMicrotask(refreshDiff);
    return box;
  }
  let stylesBox = null;
  function refreshStyles() { if (!stylesBox) return; for (const el of stylesBox.querySelectorAll('.style')) el.classList.toggle('on', el.dataset.id === currentStyle); }
  function stylesPanel() {
    const box = document.createElement('div'); box.className = 'styles'; stylesBox = box;
    for (const st of STYLES) {
      const el = document.createElement('div'); el.className = 'style'; el.dataset.id = st.id;
      el.innerHTML = '<h3></h3><p></p><div><button class="btn">Play this</button> <span class="pill"></span></div>';
      el.querySelector('h3').textContent = st.name; el.querySelector('p').textContent = st.blurb;
      const pill = el.querySelector('.pill'); pill.textContent = st.control ? 'control' : st.archive ? 'archive' : 'proposal'; if (st.control) pill.classList.add('ctl');
      el.querySelector('button').onclick = () => applyStyle(st);
      box.appendChild(el);
    }
    queueMicrotask(refreshStyles);
    return box;
  }
  const groups = [...new Set(SPEC.map((r) => r[0]))];
  makeTabs('dockTabs', 'dockBody', [{ name: 'Styles', build: stylesPanel }].concat(groups.map((g) => ({ name: g, build: () => sliderGroup(g) }))), 'lab:' + LAB.name + ':dock');

  // ================= the decision log =================
  let db = null, me = '', remote = [], localLog = lsGet('lab:' + LAB.name + ':log', []);
  function snapshot() { return { round: LAB.round, seed, style: currentStyle, changed: diffOnly(), view: viewOnly(P), metrics: score() }; }
  async function record(topic, choice, note) {
    const doc = { topic, choice, note: note || '', createdAt: Date.now(), by: me, settings: snapshot() };
    if (db) { try { await db.collection('decisions').add(doc); return 'shared'; } catch (e) { /* fall through */ } }
    localLog.push(doc); lsSet('lab:' + LAB.name + ':log', localLog); return 'local';
  }
  function currentChoice() { const st = STYLES.find((s) => s.id === currentStyle); const d = diffOnly(); return (st ? st.name : 'Custom') + (Object.keys(d).length ? ' with ' + JSON.stringify(d) : ''); }
  function logPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint" id="logStatus"></p><input type="text" id="logTopic" placeholder="Topic (e.g. Combine motion)"><textarea id="logChoice" rows="2" placeholder="Your decision"></textarea><p><button class="btn primary" id="logSave">Record decision</button> <button class="btn" id="logCopy">Copy log</button></p><div class="tablewrap"><table id="logTable"></table></div>';
    const status = box.querySelector('#logStatus');
    status.textContent = db ? 'Shared log: saved with the lab, readable by Claude.' : 'Kept in this browser (Copy log to send it).';
    status.className = db ? 'status-ok' : 'status-warn';
    box.querySelector('#logChoice').value = currentChoice();
    box.querySelector('#logSave').onclick = async () => { const where = await record(box.querySelector('#logTopic').value || 'Combine', box.querySelector('#logChoice').value); status.textContent = where === 'shared' ? 'Recorded in the shared log.' : 'Recorded in this browser.'; renderLog(box); };
    box.querySelector('#logCopy').onclick = () => {
      const t = remote.concat(localLog).map((d) => new Date(d.createdAt).toISOString() + ' · ' + d.topic + ': ' + d.choice + ' ' + JSON.stringify(d.settings)).join('\n');
      try { navigator.clipboard.writeText(t).then(() => { status.textContent = 'Copied.'; }, () => { status.textContent = 'Copy was refused; select the table instead.'; }); } catch (e) { status.textContent = 'Copy was refused; select the table instead.'; }
    };
    renderLog(box);
    return box;
  }
  function renderLog(box) {
    const t = (box || document).querySelector('#logTable'); if (!t) return;
    const rows = remote.concat(localLog).sort((a, b) => b.createdAt - a.createdAt).slice(0, 50);
    t.innerHTML = '<tr><th>When</th><th>Topic</th><th>Decision</th></tr>';
    if (!rows.length) { const tr = document.createElement('tr'); tr.innerHTML = '<td colspan="3" class="hint">No decisions yet. Play the styles, then record the one you would ship.</td>'; t.appendChild(tr); }
    for (const d of rows) { const tr = document.createElement('tr'); for (const v of [new Date(d.createdAt).toLocaleString(), d.topic, d.choice]) { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); } t.appendChild(tr); }
  }
  (async function connect() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try { db = await c.use('db'); } catch (e) { db = null; }
    try { const u = await c.use('user'); if (u) me = (await u.id()) || ''; } catch (e) { me = ''; }
    if (!db) return;
    db.collection('decisions').orderBy('createdAt', 'desc').limit(300).onSnapshot((snap) => { remote = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderLog(); }, () => { db = null; });
  })();

  function scorecardPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p><button class="btn primary" id="runBatch">Score every style</button> <span class="hint">headless, 60 samples a second from the first departure to the last landing</span></p><div class="tablewrap"><table id="scoreTable"></table></div>';
    box.querySelector('#runBatch').onclick = () => {
      const rows = runBatch(), t = box.querySelector('#scoreTable');
      t.innerHTML = '<tr><th>Style</th><th title="Largest gap at the end between a landed vertex and its authored target on the omni, % of the omni radius">Seam %</th><th title="Seconds two stacked plates are both visible on top of each other">Overlap s</th><th title="Fastest vertex, omni radii per second">Peak</th><th title="Closest two crystals come while both are beyond 1.5 omni radii, x their combined radii">Clearance</th><th>Duration s</th></tr>';
      for (const r of rows) {
        const tr = document.createElement('tr');
        const cells = [r.style + (r.control ? ' (control)' : ''), r.seamPct, r.overlapS, r.peak, r.clearance == null ? '-' : r.clearance, r.durationS];
        cells.forEach((v, i) => { const td = document.createElement('td'); td.textContent = v; if (i) td.className = 'num'; tr.appendChild(td); });
        if (r.seamPct > 1) tr.children[1].classList.add('bad');
        if (r.overlapS > 0.05) tr.children[2].classList.add('bad');
        if (r.clearance != null && r.clearance < 1) tr.children[4].classList.add('bad');
        t.appendChild(tr);
      }
    };
    return box;
  }
  function aboutPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p id="aboutHead"></p>' +
      '<p>Round 2 plays the designer\'s order: Space lays the negative space, Charge and Mass fill the pentagons and triangles, and Time locks in. Each crystal idles with its own effect until it sets off; the finished omni wakes with all four.</p>' +
      '<p>The targets are derived from the art file and proven by the baker. Charge\'s petals untwist 13.1 degrees and become exact fifths of each pentagon. Mass\'s prisms untwist 31.5 degrees and become exact thirds of each triangle. Time\'s rhombi move rigidly onto their slots. The art file\'s own Key 1 swaps two corners of one Time rhombus (rhombus 2, corners 9 and 129), and the rigid lock-in avoids that slip.</p>' +
      '<p>The effects read the game\'s numbers. Time: TimeCrystalFlipWaveProfile.asset\'s loop, ring starts and curves, rings planned as FlipWave.Plan does from a start vertex drawn each loop. Space: SpaceCrystalAnimator\'s 5-point then 3-point spins at its cycle speed and pause. Charge: JustRotate\'s tumble, and ChargeCrystal.hlsl\'s travelling bolts at ChargeCrystalMaterial.mat\'s speed, length and duty on every real edge. Mass: CrystalDepthPrismProfile.asset and the depth-prism materials.</p>' +
      '<p class="hint"><b>What this lab does NOT model.</b> The bolts are drawn as one-pixel lines with no jitter, halo or vertex nodes; the Mass prisms are "sealed by depth" without the game\'s ratchet state; the Space crystal here is the art file\'s 60 squares, while the game\'s Space crystal is 60 kites (author_space_crystal_mesh.py) with the same spins. The shading approximates the game\'s Fresnel shaders. The relative sizes are the art file\'s; in the game the omni prefab and the elemental prefabs are scaled differently. The elemental meshes have the shipped vertex counts but are not the shipped meshes after a uniform scale. No trigger, sound or camera move.</p>';
    box.querySelector('#aboutHead').textContent = LAB.name + ' · round ' + LAB.round + ' · ' + LAB.branch + ' · write-up: ' + LAB.doc;
    return box;
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Scorecard', build: scorecardPanel }, { name: 'Decisions', build: logPanel }, { name: 'About', build: aboutPanel }], 'lab:' + LAB.name + ':bottom');

  $('title').textContent = LAB.name; $('meta').textContent = 'round ' + LAB.round;
  let paused = false;
  const setPaused = (v) => { paused = v; sim.playing = !v; $('pause').textContent = $('scrubPlay').textContent = v ? 'Play' : 'Pause'; };
  $('pause').onclick = $('scrubPlay').onclick = () => setPaused(!paused);
  $('replay').onclick = () => { sim.t = 0; setPaused(false); };
  $('resetAll').onclick = () => applyStyle(STYLES[0]);
  $('scrubT').oninput = (e) => { setPaused(true); const L = morphEnds(P) + P.hold; sim.t = parseFloat(e.target.value) * L; };

  let drag = null;
  canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, yaw: cam.yaw, pitch: cam.pitch }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => { if (!drag) return; cam.yaw = drag.yaw - (e.clientX - drag.x) * 0.008; cam.pitch = Math.max(-1.4, Math.min(1.4, drag.pitch + (e.clientY - drag.y) * 0.008)); });
  canvas.addEventListener('pointerup', () => { drag = null; });

  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', resize);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let manualClock = false, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) { resize(); simStep(dt); if (!drag && !reduced) cam.yaw += P.viewSpin * Math.PI / 180 * dt; render(); }
    requestAnimationFrame(frame);
  }
  seedConstants();
  const startStyle = STYLES.find((s) => s.id === currentStyle); if (startStyle) noMorph = !!startStyle.noMorph;
  reset(); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  window.__lab = {
    LAB, SHIPPED, SPEC, P, PLATFORM, STYLES, ASSETS: A,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { n = n || 1; for (let i = 0; i < n; i++) simStep(dt == null ? 1 / 60 : dt); resize(); render(); },
    reset, score, runBatch, setParam, applyStyle, record, pose, omniPose, measure, morphEnds, combineTime,
    setCamera(yaw, pitch) { cam.yaw = yaw; cam.pitch = pitch; },
    flipRigs: () => [TIME_RIG, OMNI_RIG].map((r) => ({ startVertices: r.axes.length, ringSizes: r.plans.map((pl) => { const n = []; for (const v of pl.values()) n[v.ring] = (n[v.ring] || 0) + 1; return n.join('/'); }) })),
    state: () => ({ t: sim.t, tc: combineTime(sim.t, P), seed, style: currentStyle, noMorph }),
  };
})();
</script>
</body>
