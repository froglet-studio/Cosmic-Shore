  CREW OF FOUR LAB (the Orca), as a page of the Vessel Studio (Docs/Studios/VesselStudio/). Source of truth: Docs/Studios/CrewOfFourLab.html; re-copy it here with .claude/skills/vessel-studio/copy_orca.py.
  CREW OF FOUR LAB - a /labmaker browser studio (round 9: the 4-seat vessel, graduated to Unity as the Orca).
  Round 9 (Yash, 2026-10-27: "we are going with Orca only, just we can have multiple choice for abilities and features"):
  PLAY STYLES, mix and match, every default round 7's. The helm's Time ability: Tank (shipped) / Breath (hold to breathe
  in, let go to surge; slow steady breaths build the surge) / Tide (ride the arena's currents; hold to tuck in). The
  helm's Mass ability: Shield (shipped) / Dock (anchor to a block: the crew reloads, a garden grows; press again to dart
  away). The missiles: Fly-by-wire (shipped) / Seeker (it flies itself to what you aimed at; you keep your turret). From
  the calm vessels (Docs/Studios/CONCEPT_FLEET.md 12): the Moon Jelly's breath, the Sea Turtle's tide, the Seahorse's hold.
  Round 8 (Garrett, 2026-10-21): flown missiles are rockets (body, nose, fins, an igniting motor, a bank into the stick)
  with a lit, faceted plume trail, and the bomb seat shows what its live bomb will break by LIGHTING those prisms in the
  world, not with a ring that says BURST ("always go for the 3d in world solution over the 2d flat text solution").
  Round 7 (Garrett, 2026-10-21): every shot flies exactly down the line its gunner aimed (a round keeps only the part of
  the hull's velocity along its aim), and the sniper looks over its turret with the Serpent's pip scope always open.
  Round 6 (Garrett, 2026-10-21): every seat is an element - Helm = Time, Sniper = Space, Fast gun = Mass, Bomb = Charge -
  and lights its own ability icon for the person in it; the sniper is always scoped; the bomb has no cooldown, one at a
  time (burst it to throw the next); the fast gun writes prisms like a pen; over-the-turret views; bespoke crosshairs.
  One hull, four seats, always four crew (AI in any empty seat): a two-thumb HELM with a boost and a forward-open shield
  that rides with the hull as super-shielded prisms, then drops in place as danger prisms; and three GUNNER seats, each a
  gyro-stabilized first-person turret on an outrigger with its own gun (a sniper, a fast gun, a bomb) and its own
  missiles: a fast fly-by-wire missile the gunner flies with one thumb, bursting on contact or after 5 s. Missiles collect
  elemental crystals (petals) and omni crystals (one more missile for every seat).
  The lab is about FEEL (Garrett, 2026-10-20: "we are trying to get the vessel to have the right feel"), first drawn
  from Wildgate (Moonshot Games, 2025). Rounds 1 (2D) and 2 (3D) are CrewOfFourLab.round1.html / .round2.html.
  Four element games (Time race, Space destruction, Mass creation, Charge dogfight) at I1-I4, Easy/Medium/Hard rivals.
  Source of truth: this file. Write-up: Docs/Studios/CREW_OF_FOUR_LAB.md. Verify:
    node .claude/skills/labmaker/verify_lab.cjs Docs/Studios/CrewOfFourLab.html
-->

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);

  // ================= (1) LAB meta + the shipped numbers =================
  // A READER of the shipped numbers: every constant names the asset / class field it was copied from.
  // "lab" marks a proposal with no game field yet (the four-seat hull does not exist in the game).
  const LAB = { name: 'Crew of Four Lab', branch: 'Ys-bleeding-edge (rounds 3-8: cece/happy-noether-m54hz6)', round: 9, doc: 'Docs/Studios/CREW_OF_FOUR_LAB.md' };
  const SHIPPED = {
    // Helm flight: VesselTransformer (Sparrow.prefab) driven by DualStickMix (Assets/_Scripts/Controller/IO/DualStickMix.cs)
    minSpeed: 10,        // VesselTransformer.DefaultMinimumSpeed
    throttleScaler: 25,  // VesselTransformer.DefaultThrottleScaler; speed = min + scaler x XDiff x boost (XDiff 0.5 at rest)
    boostMul: 5,         // VesselStatus.boostMultiplier
    yawRate: 80,         // VesselTransformer.YawScaler (deg/s), turn = XSum x (speed x rotThrottle + YawScaler)
    pitchRate: 80,       // VesselTransformer.PitchScaler, YSum
    rollRate: 30,        // VesselTransformer.RollScaler, YDiff
    rotThrottle: 0.1,    // VesselTransformer.RotationThrottleScaler
    hullSpeedMul: 0.85,  // lab: the four-seat hull's share of that speed
    hullTurnMul: 0.55,   // lab: and of those turn rates
    hullRadius: 9,       // lab: hull contact radius (u)
    boostTank: 3,        // lab: seconds of boost the tank holds at Time 0
    boostRefill: 0.25,   // lab: tank seconds regained per second
    // Trail prisms: Sparrow VesselPrismController
    prismW: 2, prismL: 5,   // BaseScale.x / .z
    wavelength: 7,       // initialWavelength
    trailCap: 90,        // lab: trail prisms kept per hull at Mass 0 (+4 per Mass level)
    // The helm's shield: danger prisms around the hull, open forward. DangerHemisphereConfig.asset (AOEDangerHemisphereBlocks)
    shieldOn: 1,         // lab: 0 = the helm has no shield (a control)
    shieldBlocks: 144,   // numberOfRays 12 x blocksPerRay 12
    shieldMinR: 50,      // minRadius
    shieldMaxR: 70,      // maxRadius
    shieldOpenDeg: 45,   // lab: half-angle of the forward opening
    shieldTime: 4,       // lab: seconds the shield rides with the hull at Mass 0 (+ up to kMass); then it drops (round 5)
    shieldCd: 9,         // lab: seconds between shields
    shieldSuper: 1,      // lab (round 5, Garrett 2026-10-21): 1 = carried as super-shielded prisms, then dropped in place as danger prisms; 0 = round 4's carried danger shell that vanishes
    shieldLinger: 20,    // lab (round 5): seconds the dropped danger prisms stay where they fell (0 = until something breaks them)
    dangerDebuff: 0.5,   // VesselElementalDebuffByDangerPrismEffectSO.debuffMagnitude (-0.5 on every element)
    dangerDebuffTime: 4, // debuffDuration (s)
    // Missiles: the gunners' fly-by-wire rounds
    missileSpeed: 180,   // lab (u/s at Charge 0)
    missileTurn: 150,    // lab (deg/s)
    missileLife: 5,      // Garrett 2026-10-20: "explode on contact or after 5 seconds"
    blastR: 30,          // AOEExplosion MaxScale 60 -> radius 30 u (x 1 + kSpace at Space 15)
    blastTime: 0.5,      // lab: the blast reaches full size in this time (AOEExplosion's own ExplosionDuration is 3 s)
    blastPetals: 2,      // lab: petals a blast takes from each rival hull it catches (scored hits)
    startMissiles: 2,    // lab: EACH gunner seat's magazine at spawn (round 5, Garrett 2026-10-21: "not a shared pool")
    maxMissiles: 4,      // lab: each seat's magazine size
    omniMissiles: 1,     // lab: missiles an omni crystal adds to EVERY gunner seat ("getting the omnicrystal should give each gun a missile")
    turretTurn: 160,     // lab: turret slew (deg/s)
    turretStab: 1,       // lab (round 4): 1 = gyro-stabilized turrets: the aim is held in world space, so the hull's turns never swing a gunner's view
    mountOut: 1,         // lab (round 4): 1 = turrets on outriggers outside the hull (above, port, starboard) instead of on its skin
    mountSmooth: 0.35,   // lab (round 4): seconds for the outrigger frame to follow the hull's turns
    horizonSmooth: 3,    // lab (round 4): seconds for a stabilized turret view's horizon to drift back to the hull's up (it otherwise holds still)
    launchCd: 0.6,       // lab: a turret's reload after its missile ends (s)
    // Guns: every gunner seat has a gun as well as its missiles, and each seat's gun is different (round 5, Garrett 2026-10-21)
    gunsOn: 1,           // lab: 0 = missiles only (round 4; a control)
    sniperCd: 12,        // gunner 1 (dorsal mast): a sniper ("long cooldown sniper that kills supershielded prisms"). SniperShotAction.asset cooldownSeconds 12 (the Serpent's)
    sniperRange: 3000,   // SniperShotAction rangeUnits
    sniperCone: 1.5,     // SniperShotAction coneHalfAngleDegrees: everything inside the cone dies, super-shielded prisms included (pierce unlimited)
    sniperMinR: 6,       // SniperShotAction minPathRadius (u): the cone is never thinner than this
    sniperPetals: 4,     // a rival hull in the cone loses one petal per element (SniperShotAction vesselStripPerElement 0.1; scored hits)
    rapidRate: 30,       // gunner 2 (port boom): a fast gun ("like a brittlestar"). lab: rounds per second while held (the Brittle Star's gun is 90; a third keeps the scorecard quick)
    rapidSpeed: 135,     // BrittleStarConfig projectileSpeed (u/s), plus the hull's own velocity
    rapidLife: 4.5,      // BrittleStarConfig projectileTime (s); a round slows as it flies (Projectile: v x cos(pi t / 2T)), so it reaches v x 2T / pi = 387 u
    rapidHeatTime: 6,    // lab: seconds of fire before it overheats (the Brittle Star's five guns overheat in ~6 s at Space 0)
    rapidCoolTime: 5,    // lab: seconds locked out once overheated (the Brittle Star's ~5 s)
    rapidHitPetals: 0.4, // a round on a rival hull: VesselCombatHitByBullet, 1 point = 0.01 of each element, i.e. 0.4 of a petal (scored hits as whole petals add up)
    rapidHitCd: 0.05,    // VesselCombatHitByBullet sameVictimCooldown (s)
    shotInherit: 1,      // lab (round 7, Garrett 2026-10-21: "not shooting where they were aiming"): 1 = a round or bomb keeps only the part of the hull's velocity along its aim, so it flies exactly down the aimed line; 0 = round 6's whole hull velocity, which slewed every shot off the barrel and the crosshair
    bombSpeed: 90,       // gunner 3 (starboard boom): a bomb ("like a grizzly bomb, but it doesn't blast the vessel around"). GrizzlyTriggerBombConfig projectileSpeed, plus the hull's velocity
    bombLife: 10,        // lab (round 6): the bomb cruises until its gunner bursts it (Garrett 2026-10-21: "it never goes on cooldown it can just only have one bomb at a time so it must blow up a bomb to fire another"); it also bursts on a rival hull, and this is only a safety
    bombBlastR: 50,      // the blast radius at Space 0 (u; x 1 + kSpace at 15). Grizzly blast MaxScale 50-200 by charge; 100, mid-charge, is 50 u
    // the fast gun's pen (round 6, Garrett 2026-10-21: "shoot prisms like a sparrow does when stopped but less than a sparrow does, and with a clean precision of calligraphy")
    rapidPenRate: 10,    // lab: at most this many pen rounds a second (a third of the rounds; the Sparrow's turret makes every round a prism)
    rapidPenReach: 120,  // lab: the pen writes this far out (u), its paper; a round reaches it early in its flight (rounds go 387 u), so a sweep of the turret is a steady stroke, not 100 u jumps
    rapidPenSpacing: 5,  // lab: one prism per this many units along a stroke (the Sparrow turret prism's 5 u length, so a stroke reads unbroken)
    rapidPenFill: 2,     // lab: prisms a single landing may lay to keep a fast stroke continuous; a longer jump starts a new stroke
    rapidPenGap: 0.35,   // lab: a pause longer than this (s) lifts the pen; the next landing starts a new stroke
    rapidPenCap: 150,    // lab: pen prisms one hull keeps (the oldest goes first)
    hullCollects: 1,     // lab: 1 = the hull collects crystals it flies through too (as every game vessel does)
    // Crystals and the match
    omniShare: 0.4,      // lab: share of crystal slots that hold omni crystals
    crystalRespawn: 6,   // lab (s)
    arenaR: 320,         // the game cell's radius (the Crew Vessel Lab's cellRadius); a sphere
    matchLen: 90,        // lab: Breach / Anchorage / Broadside (s)
    raceCap: 150,        // lab: a Ring Race ends here (s)
    startLevel: 3,       // lab: each hull's level in every element (ElementalBarsConfigSO levels -5..15)
    kTime: 0.6, kSpace: 0.8, kMass: 0.8, kCharge: 0.6,   // lab: an element's effect at level 15 is 1 + k
    // Cameras: SparrowCameraSettingsSO (followOffset 0, 10, -50; followSmoothTime 0.2)
    camBack: 50, camUp: 10, camSmooth: 0.2,
    camFov: 60,          // lab: the asset has no FOV
    turretFov: 75,       // lab: the turret cameras (the fast gun and the bomb look over their turret)
    sniperFov: 22,       // round 7: the PIP scope's field of view, always open (Garrett 2026-10-21: "always have the pip scope open like the serpent does when holding the left trigger, not have the whole camera zoomed in"); SniperScopeAction fieldOfViewAtFullZoom
    sniperCamBack: 12,   // round 7: the sniper's own view sits behind its turret (u) ...
    sniperCamUp: 6,      // ... and above it, as the other gunners' do
    rapidCamBack: 14,    // round 6: the fast gun's view sits behind its turret (u) ...
    rapidCamUp: 8,       // ... and above it, so the rounds stream away from the eye instead of filling it
    bombCamBack: 22,     // round 6: the bomb's view sits farther back and higher, to see the blast
    bombCamUp: 10,
    gunCamAim: 180,      // round 6: an over-the-turret view looks at the gun's line this far out, so the crosshair is on it there
    missileCamBack: 14,  // lab: the camera behind a flown missile
    missileCamUp: 3,
    // Play styles (round 9, Yash 2026-10-27: "multiple choice for abilities and features"). Every default is round 7's.
    styleBoost: 0,       // lab: the helm's Time ability. 0 Tank (round 7: hold while the tank lasts) / 1 Breath (the Moon Jelly's) / 2 Tide (the Sea Turtle's)
    styleShield: 0,      // lab: the helm's Mass ability. 0 Shield (round 7) / 1 Dock (the Seahorse's hold)
    styleMissile: 0,     // lab: the gunners' missiles. 0 Fly-by-wire (round 7: you fly it) / 1 Seeker (it flies itself)
    breathIn: 1.5,       // lab, Breath: seconds of boost held for a full breath in (the hull slows while it breathes in)
    breathSlow: 0.6,     // lab, Breath: the hull's speed while breathing in, times its speed
    surgeMin: 0.6,       // lab, Breath: seconds of boost a short breath gives when let go ...
    surgeMax: 2.4,       // lab, Breath: ... and a full one
    calmMin: 2,          // lab, Breath: a breath shorter than this (s, release to release) is rushed and breaks the calm
    calmWindow: 0.25,    // lab, Breath: a breath within this share of the last is steady, and builds the calm
    calmStep: 0.15,      // lab, Breath: each steady breath in a row lengthens the surge by this share

      '<p>A feel lab for one four-seat crew vessel (in Unity: the Orca). A two-thumb helm with a boost and a forward-open shield, carried super-shielded and then dropped as danger prisms; three turrets, each an element with its own gun (a sniper with an always-open pip scope on Space, a fast gun that writes prisms on Mass, a one-at-a-time bomb on Charge) and its own fly-by-wire missiles its gunner flies. First inspired by Wildgate (Moonshot Games, 2025); round 3 keeps only the crew of four on one ship.</p>' +
      '<h4>How it maps to Cosmic Shore</h4><ul><li>Petals are the only PvP currency (LOCKED): a blast that catches a rival hull takes its petals as scored hits. Nothing pushes, slows or stuns a rival vessel.</li><li>The shield is the game\'s prism kinds (DangerHemisphereConfig numbers): super-shielded while carried (a wall: missiles, rounds and bombs burst on it and cannot break it; only the sniper does), then danger prisms, an arena effect on whoever touches them, never aimed at a pilot.</li><li>The guns are the game\'s: the Serpent\'s sniper shot, the Brittle Star\'s rounds, the Grizzly\'s bomb without its self-launch.</li><li>The helm flies the game\'s dual-stick mix (DualStickMix) through VesselTransformer\'s turn and speed formulas at the Sparrow\'s numbers.</li></ul>' +
      '<h4>What this lab does NOT model</h4><ul><li>Stand-in shapes, not game models; one camera, drawn for the seat you take.</li><li>Only your seat is a person; the other three and every rival are input-only AI.</li><li>No networking: who owns the hull and each missile across machines.</li><li>The hull, shield timing, missiles, magazine and their numbers are proposals ("lab" in the dials); the flight formulas and numbers, the danger shell\'s size and count, the danger debuff, the blast radius (AOEExplosion MaxScale 60) and the cameras come from the game.</li><li>Crystals are lime with the element told by shape; omni crystals are the white icosahedra.</li></ul>' +

  function resize() {
    const r = overlay.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1), w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (overlay.width !== w || overlay.height !== h) { overlay.width = w; overlay.height = h; if (renderer) { renderer.setPixelRatio(dpr); renderer.setSize(Math.max(1, r.width), Math.max(1, r.height), false); camera.aspect = w / h; camera.updateProjectionMatrix(); } }
  }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now(), acc = 0, toastT = 0;
  const STEP = 1 / 30;
  function showToasts() { const ev = world.events; if (ev.length && ev[ev.length - 1] !== showToasts.last) { showToasts.last = ev[ev.length - 1]; const t = $('toast'); t.textContent = showToasts.last.text; t.style.borderColor = showToasts.last.col; t.hidden = false; toastT = 2.4; } }
  function frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) {
      resize(); pollDevices();
      if (!paused) { acc += dt; while (acc >= STEP) { simStep(STEP); acc -= STEP; } }
      if (world.over && world.endT > 4) restart(true);
      showToasts(); if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').hidden = true; }
      render();
    }
    requestAnimationFrame(frame);
  }
  if (HAS3D) initThree();
  reset(); fillHeader(); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  // ================= the test surface =================
  window.__lab = {
    LAB, SHIPPED, SPEC, P, PLATFORM, PRESETS, GAMES, G, STYLES,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { dt = dt || STEP; n = n || 1; for (let i = 0; i < n; i++) simStep(dt); resize(); render(); },
    reset, score, runBatch, runOne, setParam, record, applyPreset, takeSeat, toggleCam, get camKind() { return CAM.kind; },
    setGame(g, i, d) { if (g != null) G.game = g; if (i != null) G.intensity = i; if (d != null) G.diff = d; fillHeader(); restart(); },
    state: () => { const w = world; return { t: w.t, seed, over: w.over, winner: w.winner, missiles: w.missiles.length, prisms: w.prisms.filter((p) => !p.dead).length, crews: w.crews.map((c) => ({ dom: DOMS[c.dom].name, lv: c.lv.slice(), mags: [1, 2, 3].map((s) => c.turrets[s].mag), score: c.score, ring: c.ringIdx, shield: +c.shield.t.toFixed(2), human: c.members.map((m) => m.human), turrets: [1, 2, 3].map((s) => !!c.turrets[s].missile), hull: { f: c.hull.f, v: +c.hull.v.toFixed(1) } })) }; },
    humanIn, world: () => world, view: () => view, bombLight: () => bombLight(world),
    // a still from any viewpoint (a close look at a missile or a lit blast for the round's screenshots; the seat camera resumes next frame)
    still(pos, look) { if (!renderer) return; camera.position.set(pos.x, pos.y, pos.z); camera.lookAt(look.x, look.y, look.z); camera.updateMatrixWorld(); renderer.render(scene, camera); },
    // the pure functions Tools/Build/orca_crew_lab/parity.cjs holds the shipped C# OrcaCrewCore to
    parity: { turnBody, followFrame, rotateToward, steerToward, holdHorizon, shieldDirs, flyMissile, rapidStep, penLay, penFlush, penLanding, shotVel },
  };
})();
</script>
