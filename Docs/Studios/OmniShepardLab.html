  // ================= the trip chart: distance over one whole trip =================

    const top = Math.max(rOf(p.start), rOf(p.stop), body) + 1.5, bot = Math.max(0, Math.min(rOf(p.stop), rOf(p.start), body) - 1.5);
    const X = (t) => padL + (t / T) * (w - padL - padR), Y = (u) => padT + (1 - (u - bot) / (top - bot)) * (h - padT - padB);

    g.font = '11px ' + tok('--f-data'); g.textBaseline = 'middle'; g.strokeStyle = tok('--chart-grid'); g.fillStyle = tok('--chart-ink'); g.lineWidth = 1;
    const step = (top - bot) > 12 ? 4 : 2;

    g.textBaseline = 'alphabetic'; g.fillText('0 s', padL, h - 6); const tl = T.toFixed(1) + ' s trip'; g.fillText(tl, w - padR - g.measureText(tl).width, h - 6);
