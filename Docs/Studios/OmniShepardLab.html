    db.collection('votes').limit(1000).onSnapshot((snap) => { votes = snap.docs.map((d) => d.data()); renderGallery(); renderGalleryState(); }, () => { /* likes stay local */ });
    db.collection('styles').orderBy('createdAt', 'desc').limit(200).onSnapshot((snap) => { teamStyles = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderGallery(); }, () => { /* gallery shows the built-in styles */ });
    renderGallery();
  })();

  // ================= bottom panels =================
  function chartPanel() {
    const box = document.createElement('div'); box.className = 'chartBox';
    chartCanvas = document.createElement('canvas'); chartCanvas.id = 'chart';
    chartCanvas.setAttribute('aria-label', 'Distance from the crystal centre over one triangle\'s trip');
    box.appendChild(chartCanvas); requestAnimationFrame(drawChart);
    return box;
  }
  function scorecardPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint">Every style, scored from the meshes and the shader formula (seed 7). The two <b>controls</b> must fail: a classic shell landing short pops at the body, and a breathing shell with its fade line raised pops far out. "Seamless" means neither end of the loop shows.</p><div class="tablewrap"><table id="scoreTable"></table></div>';
    const t = box.querySelector('#scoreTable'), rows = runBatch();
    const hr = document.createElement('tr'); for (const h of ['Style'].concat(COLS.map((c) => c[1]))) { const th = document.createElement('th'); th.textContent = h; hr.appendChild(th); } t.appendChild(hr);
    for (const r of rows) {
      const tr = document.createElement('tr'); const td0 = document.createElement('td'); td0.textContent = r.variant; tr.appendChild(td0);
      for (const [k] of COLS) {
        const td = document.createElement('td'), v = r[k];
        if (typeof v === 'boolean') { const s = document.createElement('span'); s.className = 'pill ' + (v ? 'ok' : 'bad'); s.textContent = v ? 'yes' : 'no'; td.appendChild(s); }
        else if (k === 'needs') { const s = document.createElement('span'); s.className = 'chip mini ' + v; s.textContent = NEED_LABEL[v]; td.appendChild(s); }
        else td.textContent = v == null ? '—' : v;
        tr.appendChild(td);
      }
      t.appendChild(tr);
    }
    return box;
  }
  function exportText() {
    const need = needsOf(P), lines = [], st = activeStyleName();
    lines.push('// Omni Shepard Lab round ' + LAB.round + (st ? ' · style ' + st : '') + ' · ships as: ' + NEED_LABEL[need]);
    const n = nLayers(P), T = tripOf(P), off = (k, v) => Math.abs(P[k] - v) > 1e-9;
    if (need === 'material' && !off('ease', 1)) {
      // Whole-trip copies, the layout the game ships since round 4: every layer spans the whole trip,
      // 1/N of a trip apart. The generator owns these materials - change its constants, never the .mat.
      const out = P.direction === 1;
      lines.push('Tools/Build/author_omni_crystal_triangles.py, then run it:');
      lines.push('  TONE_SHELLS = ' + n + '   TONE_TRIP = ' + (+T.toFixed(3)) + '   PLATE_SCALE_START = ' + (+P.sizeStart.toFixed(3)) +
        '   PLATE_THICKNESS = ' + (+P.thickness.toFixed(3)) + '   FACE_FORWARD = ' + (P.faceForward > 0.5 ? 1 : 0));
      if (P.direction !== 2) lines.push('  and write _Breathe 0 (the generator writes 1)' + (out ? ', with _Start/_Stop swapped (' + P.stop + ' -> ' + P.start + ')' : ''));
      if (off('start', 1) || off('stop', SHIPPED.stop) || off('triScale', SHIPPED.triScale)) lines.push('  far end / body / shell size: _Start ' + P.start + ', _Stop ' + P.stop + ', shell scale ' + P.triScale.toFixed(6) + ' (OUTER_REACH and shepard_bands())');
      if (off('opacity', 1) || off('rimPower', 1)) lines.push('  _Opacity ' + P.opacity + ', _RimPower ' + P.rimPower + ' (add them to _tone_material)');
      lines.push(P.rimShell > 0.5 ? '  restore the rim: slot 4 in SLOTS / SLOT_MATERIALS' : '  no rim slot (as shipped)');
      lines.push('');
      lines.push('Which writes, per layer k:');
      for (let k = 0; k < n; k++) lines.push('  OmniShepardTriangles ' + k + '.mat (and Inactive ' + k + '):  _Start ' + (out ? P.stop : P.start) + '  _Stop ' + (out ? P.start : P.stop) + '  _Period ' + (+T.toFixed(3)) +
        '  _PhaseOffset ' + (k / n).toFixed(6) + '  _Breathe ' + (P.direction === 2 ? 1 : 0) + '  _PlateScaleStart ' + P.sizeStart + '  _Thickness ' + P.thickness + '  _FaceForward ' + (P.faceForward > 0.5 ? 1 : 0));
      if (n !== SHIPPED.layers) lines.push('• ' + (n > SHIPPED.layers ? 'Layers ' + SHIPPED.layers + '–' + (n - 1) + ' need new SLOTS entries (instance + material pair).' : 'Drop SLOTS entries ' + n + '–' + (SHIPPED.layers - 1) + '.'));
    } else if (need === 'material') {
      lines.push('An eased trip needs unequal BANDS: write _Breathe 0, _PhaseOffset 0 and, per layer:');
      bands(P).forEach((b, i) => lines.push('OmniShepardTriangles ' + i + '.mat (and Inactive ' + i + '):  _Start ' + b.start.toFixed(6) + '   _Stop ' + b.stop.toFixed(6) + '   _Period ' + (+P.period.toFixed(3)) + '   _Opacity ' + (+P.opacity.toFixed(3)) +
        (Math.abs(P.rimPower - 1) > 1e-9 ? '   _RimPower ' + P.rimPower : '') + (P.faceForward > 0.5 ? '   _FaceForward 1' : '')));
      if (Math.abs(P.triScale - SHIPPED.triScale) > 1e-9) lines.push('OmniCrystalTriangles.prefab  m_LocalScale ' + P.triScale.toFixed(6));
      if (n !== SHIPPED.layers) lines.push('• Layer count ' + n + ': change SLOTS in the generator.');
    } else {
      lines.push('Recipe (the lab\'s parameter names; shipped values omitted):');
      lines.push(JSON.stringify(diffOnly(false)));
      lines.push('');
      if (need === 'shader' || Object.keys(diffOnly(false)).some((k) => NEEDS[k] === 'shader')) lines.push('• Needs the OmniShepardFresnelShader extension the lab prototypes: per-plate centroid, random axis, scatter vector and timing keys baked into OmniCrystalTriangles.asset (UV2/UV3/colour), and the vertex logic in VS_SHELL (search the page source). One crystal then draws every shell from ONE material with a copy index instead of one material per layer.');
      if (Math.round(P.plates) < PLATES.length) lines.push('• Triangles per shell ' + Math.round(P.plates) + ': a mesh variant keeping plates ' + picked.join(', ') + ' (seed ' + seed + ').');
      if (P.bodyPulse > 0) lines.push('• Body pulse: OmniCrystalFresnelShader needs a pulse uniform driven by the same clock.');
    }
    return lines.join('\n');
  }
  function exportPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint">What it takes to ship what you see. The lab only proposes; the assets stay the authority until someone edits them.</p><pre class="export" id="exportText"></pre><p><button class="btn primary" id="copyExport" type="button">Copy</button> <span class="hint" id="copyStatus"></span></p>';
    box.querySelector('#exportText').textContent = exportText();
    box.querySelector('#copyExport').onclick = () => {
      const st = box.querySelector('#copyStatus');
      try { navigator.clipboard.writeText(exportText()).then(() => { st.textContent = 'Copied.'; }, () => { st.textContent = 'Copy was blocked; select the text above.'; }); } catch (e) { st.textContent = 'Copy was blocked; select the text above.'; }
    };
    return box;
  }
  function aboutPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<div class="cols"><div><p id="aboutMeta"></p><p class="hint">How it works: every shell is the 20-plate triangle mesh. Each copy loops over the whole trip, a third of a trip apart - since round 4 that is literally how the game draws it (each layer\'s _PhaseOffset). Breathe, out, plate size and thickness are the shader\'s round-4 dials; stagger, swirl, tumble, scatter, hover and the light extras would need more shader work. Chips mark which knobs ship as material values, which need a mesh, and which need a shader.</p></div>' +
      '<div><p><b>What this lab does not model</b></p><ul class="notmod">' +
      '<li>Bloom and the rest of URP post-processing; colours use a 2.2 gamma and blend in sRGB, so "Glow" and brightness above 1 only hint at what bloom does.</li>' +
      '<li>Transparent sort order: copies are drawn outer-first; per-plate stagger mixes radii inside one copy, which Unity would sort no better.</li>' +
      '<li>Domain recolours from ThemeManager (only the active and inactive materials are shown).</li>' +
      '<li>The game camera\'s FOV, the vessel, collect/explode materials, FadeIn on respawn.</li>' +
      '<li>Frame cost on a real GPU; "Tris drawn" counts triangles only.</li></ul></div></div>';
    box.querySelector('#aboutMeta').textContent = LAB.name + ' · round ' + LAB.round + ' · ' + LAB.branch + ' · write-up ' + LAB.doc + ' · numbers from ' + A.source;
    return box;
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Trip chart', build: chartPanel }, { name: 'Scorecard', build: scorecardPanel }, { name: 'Ship it', build: exportPanel }, { name: 'Decisions', build: logPanel }, { name: 'About', build: aboutPanel }], 'lab:' + LAB.name + ':bottom');

  // Does the asset still look like what this lab models? (equal bands, one shared period)
  (function driftCheck() {
    const probs = [];
    if (BREATHES) {
      A.layers.forEach((L, i) => {
        if (Math.abs(L.start - L0.start) > 1e-6 || Math.abs(L.stop - L0.stop) > 1e-6) probs.push(L.material + ' band');
        if (Math.abs(L.phaseOffset - i / NL) > 1e-5) probs.push(L.material + ' phase');
        for (const k of ['period', 'opacity', 'plateScaleStart', 'thickness', 'faceForward', 'breathe']) if (Math.abs(L[k] - L0[k]) > 1e-6) probs.push(L.material + ' ' + k);
      });
    } else {
      const gen = bands(SHIPPED);
      A.layers.forEach((L, i) => { if (Math.abs(L.start - gen[i].start) > 1e-4 || Math.abs(L.stop - gen[i].stop) > 1e-4) probs.push(L.material + ' band'); if (Math.abs(L.period - SHIPPED.period) > 1e-6) probs.push(L.material + ' period'); if (Math.abs(L.opacity - SHIPPED.opacity) > 1e-6) probs.push(L.material + ' opacity'); });
    }
    if (probs.length) { $('drift').hidden = false; $('drift').textContent = 'The shipped layers differ from what this lab models (' + probs.join(', ') + ').'; }
  })();

  $('meta').textContent = 'round ' + LAB.round;
  let paused = false;
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Play' : 'Pause'; };
  $('step').onclick = () => { paused = true; $('pause').textContent = 'Play'; simStep(1 / 60); render(); };
  $('resetAll').onclick = () => { stopCompare(); applyStyle(STYLES[0]); };
  $('exitCompare').onclick = () => stopCompare();

  // orbit + zoom (all compare cells share the camera)
  const wrap = $('stageWrap'); let drag = null;
  wrap.addEventListener('pointerdown', (e) => { if (e.target.closest && e.target.closest('button')) return; drag = { x: e.clientX, y: e.clientY }; try { wrap.setPointerCapture(e.pointerId); } catch (err) { /* ok */ } });
  wrap.addEventListener('pointermove', (e) => { if (!drag) return; world.yaw -= (e.clientX - drag.x) * 0.008; world.pitch = Math.max(-1.45, Math.min(1.45, world.pitch + (e.clientY - drag.y) * 0.008)); drag = { x: e.clientX, y: e.clientY }; if (paused) render(); });
  const endDrag = () => { drag = null; };
  wrap.addEventListener('pointerup', endDrag); wrap.addEventListener('pointercancel', endDrag);
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault(); const nd = Math.max(12, Math.min(140, Math.round(P.viewDist * (e.deltaY > 0 ? 1.08 : 1 / 1.08))));
    setParam('viewDist', nd); if (compare) for (const c of compare.cells) c.p.viewDist = nd;
  }, { passive: false });

  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', () => { resize(); if (paused) render(); });
  let manualClock = false, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) { resize(); if (!paused) simStep(dt); render(); }
    requestAnimationFrame(frame);
  }
  try { initGL(); } catch (e) { R.shell = null; $('hint').textContent = 'WebGL failed: ' + e.message; console.error('Omni Shepard Lab: ' + e.message); }
  if (!gl) $('hint').textContent = 'This browser has no WebGL; the trip chart and scorecard still work.';
  reset(); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  window.__lab = {
    LAB, SHIPPED, SPEC, P, PLATFORM, VARIANTS, STYLES, NEEDS, ASSETS: A,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { n = n || 1; for (let i = 0; i < n; i++) simStep(dt); resize(); render(); },
    reset, score, runBatch, setParam, record, bands, shepardBand, metrics, exportText, applyStyle, randomStyle, startCompare, stopCompare, needsOf, vertexAt, styleParams, CLASSIC,
    state: () => ({ t: world.t, seed, style: activeStyleName(), compare: compare ? compare.cells.map((c) => c.style.name) : null, plates: picked.slice() }),
    geometry: () => ({ plateR: plate.map((q) => q.r), bodyR: plate.map((q) => q.bodyR), rootScale: ROOT }),
  };
})();
</script>
