<style>

  :root {

  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }

  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn:focus-visible, .tabs button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #hud b { color: var(--lime); font-weight: 500; }
  #hint { position: absolute; right: 12px; bottom: 10px; color: #7d8a72; font: 11px var(--f-data); pointer-events: none; }
  #dock { grid-area: dock; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 10px 16px 16px; min-height: 0; }

  #bottomBody { flex: 1; min-height: 0; overflow: auto; }
  .tabs { display: flex; gap: 2px; flex-wrap: wrap; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); padding: 5px 10px; cursor: pointer; font: 600 11px/1.3 var(--f-ui); letter-spacing: 0.06em; text-transform: uppercase; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row label { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-weight: 500; }
  .row label .key { color: var(--muted); font: 11px var(--f-data); }
  .row label .lab { color: var(--warn); font: 600 10px var(--f-ui); letter-spacing: 0.05em; text-transform: uppercase; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0; }
  .row output { text-align: right; font: 500 12px var(--f-data); font-variant-numeric: tabular-nums; }
  .row output.changed { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

  .readout span:nth-child(even) { text-align: right; }
  .pill { display: inline-block; padding: 0 6px; border-radius: 3px; font: 600 11px/1.6 var(--f-ui); }
  .pill.ok { color: var(--ok); border: 1px solid var(--ok); }
  .pill.bad { color: var(--bad); border: 1px solid var(--bad); }
  table { border-collapse: collapse; width: 100%; font: 12px var(--f-data); font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font: 600 11px var(--f-ui); color: var(--muted); }
  .tablewrap { overflow-x: auto; }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 8px; }
  #chart { width: 100%; height: 100%; display: block; }
  .chartBox { height: 100%; min-height: 150px; position: relative; }
  textarea, input[type=text] { width: 100%; font: 12px var(--f-ui); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; }
  pre.export { font: 12px/1.5 var(--f-data); background: var(--chart-bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; margin: 6px 0; overflow-x: auto; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .cols > div { min-width: 0; }
  ul.notmod { margin: 4px 0; padding-left: 18px; color: var(--muted); }
  ul.notmod li { margin: 2px 0; }
  @media (max-width: 900px) {
    body { overflow: auto; }

    .cols { grid-template-columns: minmax(0, 1fr); }
  }

  // ================= the trip chart: radius over one whole trip =================
  let chartCanvas = null;

      const lab = el.querySelector('label'); lab.htmlFor = id;
      lab.querySelector('span').textContent = label; el.querySelector('.key').textContent = key;
      el.querySelector('.lab').textContent = LAB_ONLY[key] && LAB_ONLY[key] !== 'view' ? LAB_ONLY[key] : '';
      el.querySelector('.tip').textContent = tip;
      const inp = el.querySelector('input'); inp.id = id;
      if (isToggle(row)) { inp.checked = P[key] > 0.5; inp.onchange = () => setParam(key, inp.checked ? 1 : 0); }
      else { Object.assign(inp, { min: lo, max: hi, step, value: P[key] }); inp.oninput = () => setParam(key, parseFloat(inp.value)); }
      outputs[key] = { out: el.querySelector('output'), inp };
      box.appendChild(el);
    }
    queueMicrotask(refreshDiff);
    return box;
  }
  const groups = [...new Set(SPEC.map((r) => r[0]))];
  makeTabs('dockTabs', 'dockBody', groups.map((g) => ({ name: g, build: () => sliderGroup(g) })), 'lab:' + LAB.name + ':dock');

  // ================= decision log =================
  let db = null, me = '', remote = [], localLog = lsGet('lab:' + LAB.name + ':log', []);
  function snapshot() { return { round: LAB.round, seed, changed: diffOnly(), metrics: score() }; }
  async function record(topic, choice, note) {
    const doc = { topic, choice, note: note || '', createdAt: Date.now(), by: me, settings: snapshot() };
    if (db) { try { await db.collection('decisions').add(doc); return 'shared'; } catch (e) { /* fall through */ } }
    localLog.push(doc); lsSet('lab:' + LAB.name + ':log', localLog); return 'local';
  }
  function currentChoice() {
    const d = diffOnly(); delete d.viewDist; delete d.viewSpin; delete d.viewSlow; delete d.viewBody;
    return Object.keys(d).length ? 'Use: ' + Object.entries(d).map(([k, v]) => k + ' ' + (+v.toFixed(3))).join(', ') : 'Keep shipped';
  }
  function logPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint" id="logStatus"></p><div class="cols"><div><input type="text" id="logTopic" placeholder="Topic (e.g. Stream density)"><p></p><textarea id="logChoice" rows="2"></textarea><p><button class="btn primary" id="logSave" type="button">Record decision</button> <button class="btn" id="logCopy" type="button">Copy log</button></p></div><div class="tablewrap"><table id="logTable"></table></div></div>';
    const status = box.querySelector('#logStatus');
    status.textContent = db ? 'Shared log: saved with the lab, Claude reads it at the start of the next round.' : 'Kept in this browser. Use Copy log to send it.';
    box.querySelector('#logChoice').value = currentChoice();
    box.querySelector('#logSave').onclick = async () => { const where = await record(box.querySelector('#logTopic').value || 'Omni triangles', box.querySelector('#logChoice').value); status.textContent = where === 'shared' ? 'Recorded in the shared log.' : 'Recorded in this browser.'; renderLog(box); };
    box.querySelector('#logCopy').onclick = () => {
      const t = remote.concat(localLog).map((d) => new Date(d.createdAt).toISOString() + ' · ' + d.topic + ': ' + d.choice + ' ' + JSON.stringify(d.settings && d.settings.changed)).join('\n');
      const ok = () => { status.textContent = 'Log copied.'; };
      try { navigator.clipboard.writeText(t).then(ok, () => { status.textContent = t || 'The log is empty.'; }); } catch (e) { status.textContent = t || 'The log is empty.'; }
    };
    renderLog(box);
    return box;
  }
  function renderLog(box) {
    const t = (box || document).querySelector('#logTable'); if (!t) return;
    const rows = remote.concat(localLog).sort((a, b) => b.createdAt - a.createdAt).slice(0, 50);
    t.innerHTML = '<tr><th>When</th><th>Topic</th><th>Decision</th></tr>';
    if (!rows.length) { const tr = document.createElement('tr'); const td = document.createElement('td'); td.colSpan = 3; td.textContent = 'No decisions yet. Tune the shells, then record what you would ship.'; td.className = 'hint'; tr.appendChild(td); t.appendChild(tr); }
    for (const d of rows) { const tr = document.createElement('tr'); for (const v of [new Date(d.createdAt).toLocaleString(), d.topic, d.choice]) { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); } t.appendChild(tr); }
  }
  (async function connect() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try { db = await c.use('db'); } catch (e) { db = null; }
    try { const u = await c.use('user'); if (u) me = (await u.id()) || ''; } catch (e) { me = ''; }
    if (!db) return;
    db.collection('decisions').orderBy('createdAt', 'desc').limit(300).onSnapshot((snap) => { remote = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderLog(); }, () => { db = null; });
  })();

  // ================= bottom panels =================
  function chartPanel() {
    const box = document.createElement('div'); box.className = 'chartBox';
    chartCanvas = document.createElement('canvas'); chartCanvas.id = 'chart';
    chartCanvas.setAttribute('aria-label', 'Distance from the crystal centre over one triangle\'s trip, one line per shell');
    box.appendChild(chartCanvas); requestAnimationFrame(drawChart);
    return box;
  }
  function scorecardPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint">Every number is computed from the meshes and the shader formula; no randomness except the plate pick (seed 7). <b>Lands short</b> is the control: its landing must read as a visible pop.</p><div class="tablewrap"><table id="scoreTable"></table></div>';
    const t = box.querySelector('#scoreTable'), rows = runBatch();
    const hr = document.createElement('tr'); for (const h of ['Variant'].concat(COLS.map((c) => c[1]))) { const th = document.createElement('th'); th.textContent = h; hr.appendChild(th); } t.appendChild(hr);
    for (const r of rows) {
      const tr = document.createElement('tr'); const td0 = document.createElement('td'); td0.textContent = r.variant; tr.appendChild(td0);
      for (const [k] of COLS) {
        const td = document.createElement('td'), v = r[k];
        if (typeof v === 'boolean') { const s = document.createElement('span'); s.className = 'pill ' + (v ? 'ok' : 'bad'); s.textContent = v ? 'yes' : 'no'; td.appendChild(s); } else td.textContent = v;
        tr.appendChild(td);
      }
      t.appendChild(tr);
    }
    return box;
  }
  function exportText() {
    const B = bands(P), lines = [];
    lines.push('// Omni Shepard Lab round ' + LAB.round + ' · ' + new Date().toISOString().slice(0, 10));
    B.forEach((b, i) => lines.push('OmniShepardTriangles ' + i + '.mat (and Inactive ' + i + '):  _Start ' + b.start.toFixed(6) + '   _Stop ' + b.stop.toFixed(6) + '   _Period ' + (+P.period.toFixed(3)) + '   _Opacity ' + (+P.opacity.toFixed(3)) +
      (Math.abs(P.rimPower - 1) > 1e-9 ? '   _RimPower ' + P.rimPower : '') + (P.faceForward > 0.5 ? '   _FaceForward 1' : '')));
    if (Math.abs(P.triScale - SHIPPED.triScale) > 1e-9) lines.push('OmniCrystalTriangles.prefab  m_LocalScale ' + P.triScale.toFixed(6));
    const notes = [];
    if (B.length > A.layers.length) notes.push('Layers ' + A.layers.length + '-' + (B.length - 1) + ' do not exist yet: each needs an OmniShepardTriangles prefab instance on Crystal.prefab, an active + inactive material pair, and a crystalModels entry.');
    if (B.length < A.layers.length) notes.push('Remove layers ' + B.length + '-' + (A.layers.length - 1) + ' from Crystal.prefab (instance + crystalModels entry).');
    if (Math.round(P.plates) < PLATES.length) notes.push('Plates per shell ' + Math.round(P.plates) + ' needs a mesh variant of OmniCrystalTriangles.asset keeping plates ' + picked.join(', ') + ' (seed ' + seed + ').');
    if (Math.abs(P.fade - SHIPPED.fade) > 1e-9) notes.push('Fade line ' + P.fade + ' is a shader edit: OmniShepardFresnelShader frag, alpha = (' + P.fade + ' - i.s) * _Opacity. This also moves the rim shell and the Mass crystal, which share the shader.');
    return lines.join('\n') + (notes.length ? '\n\n' + notes.map((n) => '• ' + n).join('\n') : '');
  }
  function exportPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint">The material values that reproduce what you see. The lab only proposes these; the assets stay the authority until someone edits them.</p><pre class="export" id="exportText"></pre><p><button class="btn primary" id="copyExport" type="button">Copy values</button> <span class="hint" id="copyStatus"></span></p>';
    box.querySelector('#exportText').textContent = exportText();
    box.querySelector('#copyExport').onclick = () => {
      const st = box.querySelector('#copyStatus');
      try { navigator.clipboard.writeText(exportText()).then(() => { st.textContent = 'Copied.'; }, () => { st.textContent = 'Copy was blocked; select the text above.'; }); } catch (e) { st.textContent = 'Copy was blocked; select the text above.'; }
    };
    return box;
  }
  function aboutPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<div class="cols"><div><p id="aboutMeta"></p><p class="hint">How it works: each shell is the whole triangle mesh scaled about the centre. Every shell sweeps its own slice of the trip once per period, then jumps back to the start of its slice, exactly where the shell outside it just was. One triangle seems to fly all the way in (the thick line on the trip chart); the hand-off is hidden because it lands on the body.</p></div>' +
      '<div><p><b>What this lab does not model</b></p><ul class="notmod">' +
      '<li>Bloom and the rest of URP post-processing; colours are the shader\'s linear lerp with a 2.2 gamma, and blending happens in sRGB.</li>' +
      '<li>Transparent sort order: Unity sorts these shells by object origin, which is the same point for all of them, so the real order can differ.</li>' +
      '<li>Domain recolours from ThemeManager (only the active and inactive materials are shown).</li>' +
      '<li>The game camera\'s FOV, the vessel, the crystal\'s collection/explosion materials, and FadeIn on respawn.</li>' +
      '<li>Frame cost on a real GPU; "Tris" counts the triangles drawn, nothing more.</li></ul></div></div>';
    box.querySelector('#aboutMeta').textContent = LAB.name + ' · round ' + LAB.round + ' · ' + LAB.branch + ' · write-up ' + LAB.doc + ' · numbers from ' + A.source;
    return box;
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Trip chart', build: chartPanel }, { name: 'Scorecard', build: scorecardPanel }, { name: 'Export', build: exportPanel }, { name: 'Decisions', build: logPanel }, { name: 'About', build: aboutPanel }], 'lab:' + LAB.name + ':bottom');

  // Does the asset still look like what this lab models? (equal bands, one shared period)
  (function driftCheck() {
    const gen = bands(SHIPPED), probs = [];
    A.layers.forEach((L, i) => { if (Math.abs(L.start - gen[i].start) > 1e-4 || Math.abs(L.stop - gen[i].stop) > 1e-4) probs.push(L.material + ' band'); if (Math.abs(L.period - SHIPPED.period) > 1e-6) probs.push(L.material + ' period'); if (Math.abs(L.opacity - SHIPPED.opacity) > 1e-6) probs.push(L.material + ' opacity'); });
    if (probs.length) { $('drift').hidden = false; $('drift').textContent = 'The shipped layers are not evenly split (' + probs.join(', ') + '); the lab shows them as even bands.'; }
  })();

  $('meta').textContent = 'round ' + LAB.round;
  let paused = false;
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Play' : 'Pause'; };
  $('step').onclick = () => { paused = true; $('pause').textContent = 'Play'; simStep(1 / 60); render(); };
  $('resetAll').onclick = () => { applyPreset({}); };

  // orbit + zoom
  const wrap = $('stageWrap'); let drag = null;
  wrap.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; try { wrap.setPointerCapture(e.pointerId); } catch (err) { /* ok */ } });
  wrap.addEventListener('pointermove', (e) => { if (!drag) return; world.yaw -= (e.clientX - drag.x) * 0.008; world.pitch = Math.max(-1.45, Math.min(1.45, world.pitch + (e.clientY - drag.y) * 0.008)); drag = { x: e.clientX, y: e.clientY }; if (paused) render(); });
  const endDrag = () => { drag = null; };
  wrap.addEventListener('pointerup', endDrag); wrap.addEventListener('pointercancel', endDrag);
  wrap.addEventListener('wheel', (e) => { e.preventDefault(); setParam('viewDist', Math.max(12, Math.min(140, Math.round(P.viewDist * (e.deltaY > 0 ? 1.08 : 1 / 1.08))))); }, { passive: false });

  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', () => { resize(); if (paused) render(); });
  let manualClock = false, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) { resize(); if (!paused) simStep(dt); render(); }
    requestAnimationFrame(frame);
  }
  try { initGL(); } catch (e) { $('hint').textContent = 'WebGL failed: ' + e.message; }
  if (!gl) $('hint').textContent = 'This browser has no WebGL; the trip chart and scorecard still work.';
  reset(); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  window.__lab = {
    LAB, SHIPPED, SPEC, P, PLATFORM, VARIANTS, ASSETS: A,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { n = n || 1; for (let i = 0; i < n; i++) simStep(dt); resize(); render(); },
    reset, score, runBatch, setParam, record, bands, shepardBand, metrics, exportText,
    state: () => ({ t: world.t, seed, scales: layerScales(world.t), plates: picked.slice() }),
    geometry: () => ({ plateR: plateR.slice(), bodyR: bodyR.slice(), rootScale: ROOT }),
  };
})();
</script>
</body>
</html>
