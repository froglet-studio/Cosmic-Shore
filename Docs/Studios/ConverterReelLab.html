    const a5 = Math.atan(1 / ((1 + Math.sqrt(5)) / 2)), near = Math.cos(4 * Math.PI / 180), axes = [];
    for (const p of ids) for (const sgn of [1, -1]) {
      const u = unit(add(mul(plates[p].dir, Math.cos(a5)), mul(plates[p].diag, sgn * Math.sin(a5))));
      if (!axes.some((x) => dot(x, u) > near)) axes.push(u);
    }
    const plans = axes.map((start) => {
      const hs = ids.map((p) => dot(plates[p].dir, start));
      const sortedH = hs.slice().sort((a, b) => b - a), levels = [];
      for (const h of sortedH) if (!levels.length || levels[levels.length - 1] - h > 0.05) levels.push(h);
      const plan = new Map();
      ids.forEach((p, k) => {
        const pl = plates[p], h = hs[k];
        let ring = 0;
        for (let i = 0; i < levels.length; i++) if (Math.abs(levels[i] - h) < Math.abs(levels[ring] - h)) ring = i;
        const toward = unit(sub(start, mul(pl.dir, h))), lng = pl.diag, sht = unit(cross(pl.dir, lng));
        let axis = Math.abs(dot(lng, toward)) < Math.abs(dot(sht, toward)) ? lng : sht;
        if (dot(cross(axis, pl.dir), toward) > 0) axis = mul(axis, -1);
        plan.set(p, { ring, axis, toward });
      });
      return plan;
    });
    return { axes, plans, startLoop: -1, start: 0 };
  }

  function curveAt(keys, t, empty) {
    if (!keys || keys.length < 2) return empty;
    if (t <= keys[0]) return keys[1];
    for (let i = 2; i + 1 < keys.length; i += 2) if (t <= keys[i]) {
      const t0 = keys[i - 2], v0 = keys[i - 1], t1 = keys[i], v1 = keys[i + 1];
      return v0 + (v1 - v0) * (t - t0) / (t1 - t0);
    }
    return keys[keys.length - 1];
  }

  function flipStart(rig, loopIndex, salt) {
    const n = rig.axes.length;
    if (rig.startLoop < 0 || loopIndex < rig.startLoop) { rig.startLoop = 0; rig.start = Math.floor(hash(salt, 0) * n); }
    for (let k = rig.startLoop + 1; k <= loopIndex; k++) rig.start = (rig.start + 1 + Math.floor(hash(salt, k) * (n - 1))) % n;
    rig.startLoop = Math.max(rig.startLoop, loopIndex);
    return rig.start;
  }

  // ------------------------------------------------------------------ the core
  class Core {
    constructor(data) {
      if (!data.crystals || data.crystals.length !== 4) throw new Error('the combine needs exactly four crystals');
      this.data = data;
      this.crystals = ORDER.map((name, k) => {
        const d = data.crystals.find((c) => c.element === name);
        if (!d) throw new Error('no ' + name + ' crystal in the combine data');
        return this._model(k, d);
      });
      const ov = data.omni.verts;
      this.omniRadius = 0;
      for (let i = 0; i < ov.length; i += 3) this.omniRadius = Math.max(this.omniRadius, Math.hypot(ov[i], ov[i + 1], ov[i + 2]));
      this.omniPlates = platesOf(ov, data.omni.plate);
      this.timeRig = flipRig(this.crystals[TIME].plates, this.crystals[TIME].plates.map((_, i) => i));
      const omniTime = [];
      this.omniPlates.forEach((_, p) => { if (data.omni.plateOwner[p] === TIME) omniTime.push(p); });
      this.omniRig = flipRig(this.omniPlates, omniTime);
      this.tumbleAxis = unit(data.tumble.direction);
      this.tumbleSpeed = data.tumble.speed * Math.PI / 180;
      this.seededWith = null;
      this.tumbleAxes = [null, null, null, null];
    }

    _model(k, d) {
      const n = d.basis.length / 3;
      if (!d.final || d.final.length !== d.basis.length || d.plate.length !== n) throw new Error(d.element + ': basis, final and plate disagree');
      const plates = platesOf(d.basis, d.plate);
      const finalCentre = plates.map((pl) => { let s = [0, 0, 0]; for (const i of pl.idx) s = add(s, V(d.final, i)); return mul(s, 1 / pl.idx.length); });
      const m = { k, data: d, n, plates, finalCentre, plateR: new Float64Array(plates.length) };
      if (k === CHARGE || k === MASS) {
        m.axis = plates.map((_, q) => V(d.plateAxis, q));
        m.twist = plates.map((_, q) => d.plateTwist[q] * Math.PI / 180);
      }
      if (k === TIME) m.quat = plates.map((_, q) => [d.plateQuat[4 * q], d.plateQuat[4 * q + 1], d.plateQuat[4 * q + 2], d.plateQuat[4 * q + 3]]);
      return m;
    }

    vertexCount(k) { return this.crystals[k].n; }

    seed(seed) {
      if (seed === this.seededWith) return;
      this.seededWith = seed;
      const rnd = mulberry32(seed);
      for (const k of RNG_ORDER) {
        const c = this.crystals[k];
        const z = 2 * rnd() - 1, a = 2 * Math.PI * rnd(), s = Math.sqrt(1 - z * z);
        this.tumbleAxes[k] = [s * Math.cos(a), z, s * Math.sin(a)];
        const siteR = new Map();
        for (let q = 0; q < c.plates.length; q++) {
          const key = k === CHARGE || k === MASS ? c.data.plateSite[q] : q;
          if (!siteR.has(key)) siteR.set(key, rnd());
          c.plateR[q] = siteR.get(key);
        }
      }
    }

    startOf(k, p) {
      const d = p.Spread * this.omniRadius;
      let s;
      if (p.Layout === 0) s = mul(V(this.crystals[k].data.offset, 0), p.Spread / 3);
      else if (p.Layout === 1) { const a = k * Math.PI / 2 + Math.PI / 4; s = [Math.cos(a) * d, 0, Math.sin(a) * d]; }
      else {
        const kk = d / Math.sqrt(3);
        s = [[kk, kk, kk], [kk, -kk, -kk], [-kk, kk, -kk], [-kk, -kk, kk]][k];
      }
      return p.LayoutYaw !== 0 ? rotAxis([0, 1, 0], p.LayoutYaw, s) : s;
    }

    // OmniCombineCore.Frame: the crystal's flight centre and its two turns at t.
    frame(k, t, p) {
      const t0 = Core.departs(k, p), u = clamp01((t - t0) / p.Flight), e = easeIO(u, p.Ease);
      const s = this.startOf(k, p), left = 1 - e;
      const aim = p.ApproachTurn ? smooth(e / APPROACH_TURN_ENDS) : 0;
      const turn = aim > 0 ? (p.ApproachTurn[k] + (p.CameraAzimuth - p.ApproachCameraAzimuth)) * aim : 0;
      let centre = rotAxis([0, 1, 0], p.Swirl * 2 * Math.PI * left + turn, mul(s, left));
      centre = [centre[0], centre[1] + p.Arc * len(s) * Math.sin(Math.PI * e), centre[2]];
      if (aim > 0 && p.ApproachElevation) {
        const az = p.CameraAzimuth, across = [-Math.cos(az), 0, Math.sin(az)];
        centre = rotAxis(across, (p.CameraElevation + p.ApproachAboveCamera - p.ApproachElevation[k]) * aim, centre);
      }
      const tumble = p.Tumble * 2 * Math.PI * left;
      const spin = k === CHARGE && p.IdleTumble ? ((this.tumbleSpeed * Math.min(t, t0)) % (2 * Math.PI)) * (1 - e) : 0;
      return { centre, spin, tumble };
    }

    // OmniCombineCore.FaceCamera.
    faceCamera(p, cameraAzimuth, cameraRadiansPerSecond, now) {
      const turns = [0, 0, 0, 0], elevations = [0, 0, 0, 0];
      for (let k = 1; k < 4; k++) {
        const straight = Object.assign({}, p, { ApproachTurn: null });
        const at = this.frame(k, Core.departs(k, p) + ARRIVAL_AT * p.Flight, straight).centre;
        elevations[k] = Math.asin(Math.max(-1, Math.min(1, at[1] / Math.max(1e-12, len(at)))));
        const s = this.startOf(k, p), arrives = Core.departs(k, p) + ARRIVAL_AT * p.Flight;
        const travel = cameraRadiansPerSecond * (arrives - now);
        turns[k] = wrapAngle(cameraAzimuth + travel - Math.atan2(s[0], s[2])) - travel;
      }
      p.ApproachTurn = turns;
      p.ApproachElevation = elevations;
      p.ApproachCameraAzimuth = cameraAzimuth;
      p.CameraAzimuth = cameraAzimuth;
    }

    crystalFrame(k, t, p) {
      this.seed(p.Seed);
      const f = this.frame(k, t, p);
      return { centre: f.centre, spinAxis: this.tumbleAxis, spin: f.spin, tumbleAxis: this.tumbleAxes[k], tumble: f.tumble };
    }

    spinWeights(t, names) {
      const sp = this.data.spin, per = 1 / sp.cycleSpeed + sp.pause;
      const n = Math.floor(t / per), ph = (t - n * per) * sp.cycleSpeed, five = (n & 1) === 0;
      const w1 = ph < 1 ? clamp01(2 * ph) : 0, w2 = ph < 1 ? clamp01(2 * ph - 1) : 0;
      return names.map((nm) => (nm.startsWith('5Point') === five ? (nm.includes('1st') ? w1 : w2) : 0));
    }

    seatOf(dir, towardCamera) {
      const D = this.data.depth, d = dot(dir, towardCamera), e = clamp01((d - D.open) / (D.seal - D.open));
      return Math.pow(e * e * (3 - 2 * e), D.power);
    }

    flipPose(rig, q, pl, t, salt, fx) {
      const loop = Math.floor(t / this.data.flip.loop);
      return this.flipPoseAt(rig, q, pl, loop, t - loop * this.data.flip.loop, salt, fx);
    }

    flipPoseAt(rig, q, pl, loop, local, salt, fx) {
      const fl = this.data.flip, step = rig.plans[flipStart(rig, loop, salt)].get(q);
      const tk = local - (fl.first + fl.stagger * step.ring);
      if (tk < 0) return null;
      const cv = step.ring === 0 ? fl.lead : fl.later;
      return {
        axis: step.axis,
        angle: Math.PI * curveAt(cv.flip, tk, 0) * fx,
        scale: 1 + (curveAt(cv.scale, tk, 1) - 1) * fx,
        shift: mul(add(mul(step.toward, curveAt(cv.slide, tk, 0)), mul(pl.dir, -curveAt(cv.dip, tk, 0))), pl.reach * fx),
      };
    }

    static applyFlip(f, pl, b) { return add(add(pl.c, f.shift), mul(rotAxis(f.axis, f.angle, sub(b, pl.c)), f.scale)); }

    // OmniCombineCore.Pose, for ONE crystal k (the C# loops all four with the same arguments; the reel drives each
    // crystal on its own clock, so it asks for them one at a time). Writes positions (Float32Array, xyz per vertex)
    // and plateMorph (per plate); returns { effect, centre }.
    poseCrystal(k, t, p, towardCamera, positions, plateMorph) {
      this.seed(p.Seed);
      const c = this.crystals[k], d = c.data, te = t + p.EffectPhase;
      const t0 = Core.departs(k, p), u = clamp01((t - t0) / p.Flight);
      const fxIdle = 1 - smooth((t - t0) / p.EffectFade);
      const socket = k > 0 && p.SocketSpacing > 0 ? Core.socketIn(k, t, p) : 0;
      const effect = Math.max(0, fxIdle);
      const fr = this.frame(k, t, p), centre = fr.centre, spin = fr.spin, ang = fr.tumble;
      const mS = Math.min(p.MorphStart, 1 - p.MorphLength);
      const idleSpin = d.idle && d.idle.keys && d.idle.keys.length > 0 && fxIdle > 0;
      const sw = idleSpin ? this.spinWeights(te, d.idle.names) : null;
      for (let q = 0; q < c.plates.length; q++) {
        const pl = c.plates[q];
        const start = mS + p.SiteSpread * c.plateR[q] * (1 - p.MorphLength - mS);
        const w = smooth((u - start) / p.MorphLength);
        if (plateMorph) plateMorph[q] = w;
        let flip = null, seatScale = 1, seatLift = [0, 0, 0];
        if (fxIdle > 0 && k === TIME) flip = this.flipPose(this.timeRig, q, pl, te, TIME_FLIP_SALT, fxIdle);
        if (fxIdle > 0 && k === MASS && !p.ShaderDepth) {
          const sd = this.seatOf(pl.dir, towardCamera);
          seatScale = 1 + (this.data.depth.massSizeStart - 1) * (1 - sd) * fxIdle;
          seatLift = mul(pl.c, (this.data.depth.massReach - 1) * (1 - sd) * fxIdle);
        }
        const extra = k > 0 && p.SocketSpacing > 0 ? w * p.SocketSpacing * (1 - socket) : 0;
        for (const i of pl.idx) {
          let b = V(d.basis, i);
          if (sw) for (let key = 0; key < sw.length; key++) b = add(b, mul(V(d.idle.keys[key].delta, i), sw[key] * fxIdle));
          if (flip) b = Core.applyFlip(flip, pl, b);
          if (seatScale !== 1) b = add(add(pl.c, mul(sub(b, pl.c), seatScale)), seatLift);
          let v;
          if (k === TIME) {
            const rq = slerpIdentity(c.quat[q], w), cc = lerp3(pl.c, c.finalCentre[q], w);
            v = add(cc, quatRotate(rq, sub(b, pl.c)));
          } else if (k === CHARGE) {
            const s1 = smooth(w / p.Suck), s2 = smooth((w - p.Suck) / (1 - p.Suck));
            const v1 = lerp3(b, add(b, sub(V(d.stage1, i), V(d.basis, i))), s1);
            v = lerp3(rotAxis(c.axis[q], c.twist[q] * s2, v1), V(d.final, i), s2);
          } else if (k === MASS) {
            v = lerp3(rotAxis(c.axis[q], c.twist[q] * w, b), V(d.final, i), w);
          } else {
            v = lerp3(b, V(d.final, i), w);
          }
          if (extra !== 0) v = add(v, mul(c.finalCentre[q], extra));
          if (spin !== 0) v = rotAxis(this.tumbleAxis, spin, v);
          if (ang !== 0) v = rotAxis(this.tumbleAxes[k], ang, v);
          v = add(v, centre);
          positions[3 * i] = v[0]; positions[3 * i + 1] = v[1]; positions[3 * i + 2] = v[2];
        }
      }
      return { effect, centre };
    }

    // OmniCombineCore.OmniPose (the game-motion path and the lab path).
    omniPose(t, p, fx, towardCamera, positions, rest, waveSeconds, wave) {
      const ov = p.GameMotion && rest ? rest : this.data.omni.verts;
      positions.set(ov);
      if (fx <= 0) return;
      const te = t + p.EffectPhase;
      if (!p.GameMotion) {
        const sq = this.data.squares, w = Core.squaresWeights(te, sq);
        sq.keys.forEach((key, k) => {
          const wk = w[k] * fx;
          key.verts.forEach((j, n) => { for (let a = 0; a < 3; a++) positions[3 * j + a] += key.delta[3 * n + a] * wk; });
        });
      }
      this.omniPlates.forEach((pl, q) => {
        const owner = this.data.omni.plateOwner[q];
        if (owner === TIME) {
          if (p.GameMotion && wave < 0) return;
          const f = p.GameMotion ? this.flipPoseAt(this.omniRig, q, pl, wave, waveSeconds, OMNI_FLIP_SALT, fx)
            : this.flipPose(this.omniRig, q, pl, te, OMNI_FLIP_SALT, fx);
          if (!f) return;
          for (const i of pl.idx) { const v = Core.applyFlip(f, pl, V(ov, i)); positions[3 * i] = v[0]; positions[3 * i + 1] = v[1]; positions[3 * i + 2] = v[2]; }
        } else if (owner === MASS && !p.ShaderDepth) {
          const D = this.data.depth, s = this.seatOf(pl.dir, towardCamera), sc = 1 + (D.omniSizeStart - 1) * (1 - s) * fx;
          const lift = mul(pl.c, (D.omniReach - 1) * (1 - s) * fx);
          for (const i of pl.idx) { const v = add(add(pl.c, mul(sub(V(ov, i), pl.c), sc)), lift); positions[3 * i] = v[0]; positions[3 * i + 1] = v[1]; positions[3 * i + 2] = v[2]; }
        }
      });
    }

    static squaresWeights(t, sq) {
      const nk = sq.keys.length, frames = sq.weights.length / nk, fp = ((t * sq.fps) % frames + frames) % frames;
      const i0 = Math.floor(fp), i1 = (i0 + 1) % frames;
      let a = fp - i0;
      for (let k = 0; k < nk; k++) if (Math.abs(sq.weights[i1 * nk + k] - sq.weights[i0 * nk + k]) > 0.5) a = 0;
      const out = [];
      for (let k = 0; k < nk; k++) out.push(sq.weights[i0 * nk + k] + (sq.weights[i1 * nk + k] - sq.weights[i0 * nk + k]) * a);
      return out;
    }

    static departs(k, p) { return p.Lead + k * p.Stagger; }
    static centred(k, p) { return Core.departs(k, p) + p.Flight; }
    static morphEnds(p) { return Core.centred(TIME, p) + Math.max(0, p.SocketSeconds); }
    static socketIn(k, t, p) {
      const since = t - Core.centred(k, p);
      return p.SocketSeconds > 0 ? smooth(since / p.SocketSeconds) : since >= 0 ? 1 : 0;
    }
    static massColumnPlace(t, p) { return 1 - clamp01(p.MassRaise) * (1 - Core.socketIn(MASS, t, p)); }
  }

  // ------------------------------------------------------------------ SquareTurnFit
  function fitTurn(idx, rest, offset, degrees, tolerance) {
    let a = idx[0];
    for (const i of idx) if (dot(offset(i), offset(i)) > dot(offset(a), offset(a))) a = i;
    let best = [0, 0, 0];
    for (const i of idx) { const c = cross(offset(a), offset(i)); if (dot(c, c) > dot(best, best)) best = c; }
    if (dot(best, best) < 1e-16) return { problem: 'a square\'s key does not turn it' };
    const axis = unit(best);
    let bestError = Infinity, sign = 1;
    for (const s of [1, -1]) {
      let error = 0;
      for (const i of idx) error = Math.max(error, len(sub(angleAxis(s * degrees, axis, rest[i]), add(rest[i], offset(i)))));
      if (error < bestError) { bestError = error; sign = s; }
    }
    if (bestError > tolerance) return { problem: 'a square\'s key is not a rigid ' + degrees + '-degree turn (misses by ' + bestError.toPrecision(3) + ')' };
    return { axis, sign };
  }

  function squareTurnFit(corners, rest, centre, pentKey, step1, step2, tolerance) {
    const pent = fitTurn(corners, rest, pentKey, 72, tolerance);
    if (pent.problem) return pent;
    const tri = fitTurn(corners, rest, (i) => add(step1(i), step2(i)), 120, tolerance);
    if (tri.problem) return tri;
    const half = angleAxis(tri.sign * 60, tri.axis, centre);
    let stepCentre = [0, 0, 0];
    for (const i of corners) stepCentre = add(stepCentre, add(rest[i], step1(i)));
    stepCentre = mul(stepCentre, 1 / corners.length);
    const offset = sub(stepCentre, half), outward = unit(half), lift = dot(offset, outward);
    return { centre, pentagonAxis: pent.axis, pentagonSign: pent.sign, triangleAxis: tri.axis, triangleSign: tri.sign, lift, side: sub(offset, mul(outward, lift)) };
  }

  // SquareTurnFit.At: the rigid turn (as a function v -> rotated v) and the shift.
  function squareAt(f, pentagon, e, pentagonHop, triangleLift, triangleSide) {
    const hop = Math.sin(Math.PI * e);
    if (pentagon) {
      const deg = f.pentagonSign * 72 * e;
      return { deg, axis: f.pentagonAxis, shift: mul(unit(angleAxis(deg, f.pentagonAxis, f.centre)), pentagonHop * hop) };
    }
    const deg = f.triangleSign * 120 * e, sideDeg = f.triangleSign * (120 * e - 60);
    const shift = add(mul(unit(angleAxis(deg, f.triangleAxis, f.centre)), triangleLift * f.lift * hop), mul(angleAxis(sideDeg, f.triangleAxis, f.side), triangleSide * hop));
    return { deg, axis: f.triangleAxis, shift };
  }

  // ------------------------------------------------------------------ OmniCombineMotion
  function fitMotion(data, omniRadius, thickness) {
    const ov = data.omni.verts, n = ov.length / 3, thickOffset = new Float32Array(ov.length), rest = [];
    for (let i = 0; i < n; i++) rest.push(V(ov, i));
    const byPlate = new Map();
    for (let i = 0; i < n; i++) { const p = data.omni.plate[i]; if (!byPlate.has(p)) byPlate.set(p, []); byPlate.get(p).push(i); }
    const keys = data.squares && data.squares.keys;
    if (!keys || keys.length < 3) return { problem: 'the combine data carries no square keys' };
    const offsets = keys.slice(0, 3).map((key) => { const m = new Map(); key.verts.forEach((v, j) => m.set(v, [key.delta[3 * j], key.delta[3 * j + 1], key.delta[3 * j + 2]])); return m; });
    const off = (k, i) => offsets[k].get(i) || [0, 0, 0];
    const squares = [], corners = [], tolerance = 1e-3 * omniRadius;
    for (const [plate, idx] of byPlate) {
      const owner = data.omni.plateOwner[plate];
      if (owner === MASS) continue;
      let centre = [0, 0, 0], lo = Infinity, hi = -Infinity;
      for (const i of idx) { centre = add(centre, rest[i]); const r = len(rest[i]); lo = Math.min(lo, r); hi = Math.max(hi, r); }
      centre = mul(centre, 1 / idx.length);
      const mid = (lo + hi) / 2;
      let outer = [0, 0, 0], inner = [0, 0, 0], no = 0, ni = 0;
      for (const i of idx) if (len(rest[i]) > mid) { outer = add(outer, rest[i]); no++; } else { inner = add(inner, rest[i]); ni++; }
      if (no > 0 && ni > 0) {
        const normal = unit(sub(mul(outer, 1 / no), mul(inner, 1 / ni)));
        for (const i of idx) {
          const d = mul(normal, dot(sub(rest[i], centre), normal) * (thickness - 1));
          thickOffset[3 * i] = d[0]; thickOffset[3 * i + 1] = d[1]; thickOffset[3 * i + 2] = d[2];
        }
      }
      if (owner !== SPACE) continue;
      const fit = squareTurnFit(idx, rest, centre, (i) => off(0, i), (i) => off(1, i), (i) => off(2, i), tolerance);
      if (fit.problem) return fit;
      squares.push(fit); corners.push(idx);
    }
    if (!squares.length) return { problem: 'the combine\'s omni has no square plates to turn' };
    return {
      thickOffset, squares, corners,
      swell(verts, swell, into) { for (let i = 0; i < verts.length; i++) into[i] = verts[i] + thickOffset[i] * swell; },
      turnSquares(restVerts, pose, pentagon, e, pentagonHop, triangleLift, triangleSide) {
        squares.forEach((f, sq) => {
          const at = squareAt(f, pentagon, e, pentagonHop, triangleLift, triangleSide);
          for (const i of corners[sq]) {
            const v = add(angleAxis(at.deg, at.axis, V(restVerts, i)), at.shift);
            pose[3 * i] = v[0]; pose[3 * i + 1] = v[1]; pose[3 * i + 2] = v[2];
          }
        });
      },
    };
  }

  // ------------------------------------------------------------------ OmniCadence
  class Cadence {
    constructor(pentagonSeconds, waveSeconds, triangleSeconds, gapSeconds) {
      this.pentagon = Math.max(0.05, pentagonSeconds);
      this.wave = Math.max(0.05, waveSeconds);
      this.triangle = Math.max(0.05, triangleSeconds);
      this.gap = Math.max(0, gapSeconds);
    }
    static of(asset) { return new Cadence(asset.pentagonTurnSeconds, asset.waveActiveSeconds / Math.max(asset.waveSpeed, 0.05), asset.triangleTurnSeconds, asset.gapSeconds); }
    get cycle() { return this.pentagon + this.triangle + 2 * this.wave + 4 * this.gap; }
    waveStart(k) { return k === 0 ? this.pentagon + this.gap : this.pentagon + this.wave + this.triangle + 3 * this.gap; }
    get triangleStart() { return this.pentagon + this.wave + 2 * this.gap; }

      this.Neighbours = new Array(SiteCount);
      for (let s = 0; s < SiteCount; s++) {
        const others = [];
        for (let t = 0; t < SiteCount; t++) if (t !== s) others.push(t);
        const self = s, A = this.Axes;
        netSort(others, (a, b) => cmpF(dot(A[self], A[b]), dot(A[self], A[a])));
        this.Neighbours[s] = others.slice(0, 5);
      }
      return { ok: true, siteOf };
    }

    _buildFaces(plates, siteOf) {
      const centres = [], counts = new Array(SiteCount).fill(0);
      for (let s = 0; s < SiteCount; s++) centres.push(zero());
      for (let q = 0; q < plates.length; q++) { centres[siteOf[q]] = add(centres[siteOf[q]], plates[q].Centre); counts[siteOf[q]]++; }
      for (let s = 0; s < SiteCount; s++) centres[s] = div(centres[s], counts[s]);
      const reach = new Array(SiteCount).fill(0);
      for (let q = 0; q < plates.length; q++)
        for (const p of plates[q].Outer) reach[siteOf[q]] = Mathf.Max(reach[siteOf[q]], mag(sub(p, centres[siteOf[q]])));
      this.Faces = new Array(plates.length);
      const facesOfSite = [];
      for (let s = 0; s < SiteCount; s++) facesOfSite.push([]);
      for (let q = 0; q < plates.length; q++) {
        const plate = plates[q], s = siteOf[q];
        const lift = mul(plate.Normal, F(GlowLift * this.Radius));
        const ring = [], own = [], site = [], back = [];
        for (let k = 0; k < 5; k++) {
          ring.push(add(plate.Outer[k], lift));
          own.push(Mathf.Clamp01(F(mag(sub(plate.Outer[k], plate.OuterCentre)) / Mathf.Max(plate.Bound, C.e6))));
          site.push(Mathf.Clamp01(F(mag(sub(plate.Outer[k], centres[s])) / Mathf.Max(reach[s], C.e6))));
          if (plate.isBack(k)) back.push(div(add(plate.Outer[k], plate.Outer[(k + 1) % 5]), 2));
        }
        this.Faces[q] = {
          Site: s, Ring: ring, Centre: add(plate.OuterCentre, lift), OwnFalloff: own, SiteFalloff: site,
          SiteFalloffAtCentre: Mathf.Clamp01(F(mag(sub(plate.OuterCentre, centres[s])) / Mathf.Max(reach[s], C.e6))),
          Back: back,
          Sigma: this.Kind === Kind.Blooms ? F(plate.Bound * C.p75) : F(reach[0] * C.s1_7),
        };
        facesOfSite[s].push(q);
      }
      this.FacesOfSite = facesOfSite;
    }

    _tryBuildNet(plates, siteOf) {
      const outline = [];
      for (let s = 0; s < SiteCount; s++) outline.push([]);
      for (let q = 0; q < plates.length; q++)
        for (let k = 0; k < 5; k++)
          if (plates[q].isBack(k)) outline[siteOf[q]].push([plates[q].Outer[k], plates[q].Outer[(k + 1) % 5]]);
      let rOut = 0;
      for (let s = 0; s < SiteCount; s++) {
        let sum = 0;
        for (const seg of outline[s]) sum = F(sum + mag(seg[0]));
        rOut = F(rOut + F(sum / outline[s].length));
      }
      rOut = F(rOut / SiteCount);
      const lift = F(SeamLift * this.Radius);
      const gapPoint = (among, q) => {
        const target = mul(q, rOut);
        let sum = zero(), high = 0;
        for (const s of among) {
          const p = nearestOn(outline[s], target);
          sum = add(sum, p);
          high = Mathf.Max(high, mag(p));
        }
        return mul(norm(div(sum, among.length)), F(high + lift));
      };
      const N = this.Neighbours, A = this.Axes;
      const triples = [];
      for (let s = 0; s < SiteCount; s++)
        for (const t of N[s])
          for (const u of N[s])
            if (s < t && t < u && N[t].indexOf(u) >= 0) triples.push([s, t, u]);
      this.Junctions = new Array(triples.length);
      this.JunctionSites = triples;
      for (let j = 0; j < triples.length; j++)
        this.Junctions[j] = gapPoint(triples[j], norm(add(add(A[triples[j][0]], A[triples[j][1]]), A[triples[j][2]])));
      const seams = [], ofJunction = [];
      for (let j = 0; j < triples.length; j++) ofJunction.push([]);
      for (let i = 0; i < triples.length; i++)
        for (let j = i + 1; j < triples.length; j++) {
          const shared = [];
          for (const s of triples[i]) if (triples[j].indexOf(s) >= 0) shared.push(s);
          if (shared.length !== 2) continue;
          const points = new Array(SeamSamples + 1);
          const a = norm(this.Junctions[i]), b = norm(this.Junctions[j]);
          points[0] = this.Junctions[i];
          for (let k = 1; k < SeamSamples; k++) points[k] = gapPoint(shared, norm(lerpV(a, b, F(k / SeamSamples))));
          points[SeamSamples] = this.Junctions[j];
          ofJunction[i].push(seams.length);
          ofJunction[j].push(seams.length);
          let length = 0;
          for (let k = 1; k < points.length; k++) length = F(length + mag(sub(points[k], points[k - 1])));
          seams.push({ A: i, B: j, SiteA: shared[0], SiteB: shared[1], Points: points, Length: length });
        }
      this.Seams = seams;
      this.SeamsOfJunction = ofJunction;
      if (this.Junctions.length !== 20 || seams.length !== 30 || ofJunction.some((e) => e.length !== 3))
        return { ok: false, problem: `the seam net has ${this.Junctions.length} junctions and ${seams.length} seams, not the dodecahedron's 20 and 30` };
      return { ok: true };
    }

    _buildCorners(plates, siteOf) {
      this.Corners = new Array(SiteCount);
      if (this.Kind === Kind.Pentagons) {
        const lift = F(CornerLift * this.Radius);
        for (let q = 0; q < plates.length; q++) {
          const corners = [];
          for (let k = 0; k < 5; k++) corners.push(add(plates[q].Outer[k], mul(plates[q].Normal, lift)));
          this.Corners[siteOf[q]] = corners;
        }
        return;
      }
      for (let s = 0; s < SiteCount; s++) {
        const corners = [];
        for (let j = 0; j < this.Junctions.length; j++) if (this.JunctionSites[j].indexOf(s) >= 0) corners.push(this.Junctions[j]);
        this.Corners[s] = corners;
      }
    }
  }
  const seamTouches = (seam, site) => seam.SiteA === site || seam.SiteB === site;

  // ── ChargeFluxPath ──
  const FrameSamples = 128;
  const wrap = (a) => F(a - F(C.TwoPI * Mathf.Round(F(a / C.TwoPI))));

  class ChargeFluxPath {
    constructor(sites, source, sink) {
      this.Source = source;
      this.Sink = sink;
      const cs = sites.Corners[source], cd = sites.Corners[sink];
      let a = zero(), b = zero();
      for (const c of cs) a = add(a, c);
      for (const c of cd) b = add(b, c);
      a = div(a, cs.length);
      b = div(b, cd.length);
      this.sourceAxis = sites.Axes[source];
      this.sinkAxis = sites.Axes[sink];
      this.angle = Mathf.Acos(Mathf.Clamp(dot(this.sourceAxis, this.sinkAxis), -1, 1));
      this.bow = F(C.p16 + F(F(C.p3 * this.angle) / C.PI));
      this.sourceRadius = mag(a);
      this.sinkRadius = mag(b);
      this.SourceOffsets = new Array(cs.length);
      this.SinkOffsets = new Array(cs.length);
      for (let k = 0; k < cs.length; k++) { this.SourceOffsets[k] = sub(cs[k], a); this.SinkOffsets[k] = zero(); }
      this.frameTangent = new Array(FrameSamples + 1);
      this.frameE1 = new Array(FrameSamples + 1);
      this._buildFrame();

      const n = cs.length;
      const sourceAngles = new Array(n), sinkAngles = new Array(n);
      for (let k = 0; k < n; k++) sourceAngles[k] = this._angleIn(this.SourceOffsets[k], 0);
      for (let j = 0; j < n; j++) sinkAngles[j] = this._angleIn(sub(cd[j], b), 1);
      const sourceOrder = [], sinkOrder = [];
      for (let i = 0; i < n; i++) { sourceOrder.push(i); sinkOrder.push(i); }
      netSort(sourceOrder, (x, y) => cmpF(sourceAngles[x], sourceAngles[y]));
      netSort(sinkOrder, (x, y) => cmpF(sinkAngles[x], sinkAngles[y]));
      let bestShift = 0, bestCost = 3.4028234663852886e38, bestMean = 0;
      for (let shift = 0; shift < n; shift++) {
        let sum = 0;
        for (let i = 0; i < n; i++) sum = F(sum + wrap(F(sinkAngles[sinkOrder[(i + shift) % n]] - sourceAngles[sourceOrder[i]])));
        const mean = F(sum / n);
        let cost = F(mean * mean);
        for (let i = 0; i < n; i++) {
          const d = wrap(F(F(sinkAngles[sinkOrder[(i + shift) % n]] - sourceAngles[sourceOrder[i]]) - mean));
          cost = F(cost + F(d * d));
        }
        if (cost < bestCost) { bestCost = cost; bestShift = shift; bestMean = mean; }
      }
      const step = F(C.TwoPI / n);
      let sx = 0, sy = 0;
      for (let i = 0; i < n; i++) {
        const rel = F(sourceAngles[sourceOrder[i]] - F(i * step));
        sx = F(sx + Mathf.Cos(rel));
        sy = F(sy + Mathf.Sin(rel));
      }
      const reference = Mathf.Atan2(sy, sx);
      this.meanTurn = bestMean;
      this.slotAngle = new Array(n);
      this.startOff = new Array(n);
      this.endOff = new Array(n);
      for (let i = 0; i < n; i++) {
        const k = sourceOrder[i], j = sinkOrder[(i + bestShift) % n];
        this.SinkOffsets[k] = sub(cd[j], b);
        this.slotAngle[k] = F(reference + F(i * step));
        this.startOff[k] = wrap(F(sourceAngles[k] - this.slotAngle[k]));
        this.endOff[k] = wrap(F(sinkAngles[j] - F(this.slotAngle[k] + this.meanTurn)));
      }
    }

    /** The centre line at u (0 at the source, 1 at the sink). */
    centre(u) {
      const dir = norm(add(mul(this.sourceAxis, Mathf.Sin(F(F(1 - u) * this.angle))), mul(this.sinkAxis, Mathf.Sin(F(u * this.angle)))));
      const r = F(this.sourceRadius + F(F(this.sinkRadius - this.sourceRadius) * u));
      return mul(dir, F(r * F(1 + F(this.bow * Mathf.Sin(F(C.PI * u))))));
    }

    /** Strand k at u: on its source corner at 0, its paired sink corner at 1, a coaxial filament between. */
    strand(k, u, fork, bundle, turns) {
      const [e1, e2] = this._frame(u);
      const into = smooth(F(u / fork)), outOf = smooth(F(F(u - F(1 - fork)) / fork));
      let theta = F(this.slotAngle[k] + F(this.meanTurn * smooth(u)));
      const braid = smooth(F(F(u - fork) / Mathf.Max(C.e4, F(1 - F(2 * fork)))));
      theta = F(theta + F(F(C.TwoPI * turns) * braid));
      theta = F(theta + F(this.startOff[k] * F(1 - into)));
      theta = F(theta + F(this.endOff[k] * outOf));
      const ring = mul(add(mul(e1, Mathf.Cos(theta)), mul(e2, Mathf.Sin(theta))), bundle);
      const offset = add(add(mul(this.SourceOffsets[k], F(1 - into)), mul(ring, F(into * F(1 - outOf)))), mul(this.SinkOffsets[k], outOf));
      return add(this.centre(u), offset);
    }

    _buildFrame() {
      for (let i = 0; i <= FrameSamples; i++) {
        const u = F(i / FrameSamples);
        this.frameTangent[i] = norm(sub(this.centre(Mathf.Min(1, F(u + C.p002))), this.centre(Mathf.Max(0, F(u - C.p002)))));
      }
      const t0 = this.frameTangent[0];
      let seed = sub(this.SourceOffsets[0], mul(t0, dot(this.SourceOffsets[0], t0)));
      if (sqrMag(seed) < C.e12) seed = cross(t0, Math.abs(t0[0]) < C.p9 ? [1, 0, 0] : [0, 1, 0]);
      this.frameE1[0] = norm(seed);
      for (let i = 1; i <= FrameSamples; i++) {
        const carried = rotate(fromToRotation(this.frameTangent[i - 1], this.frameTangent[i]), this.frameE1[i - 1]);
        this.frameE1[i] = norm(sub(carried, mul(this.frameTangent[i], dot(carried, this.frameTangent[i]))));
      }
    }

    _frame(u) {
      const x = F(Mathf.Clamp01(u) * FrameSamples);
      const i = Math.min(Math.trunc(x), FrameSamples - 1);
      const f = F(x - i);
      const tangent = norm(lerpV(this.frameTangent[i], this.frameTangent[i + 1], f));
      const a = lerpV(this.frameE1[i], this.frameE1[i + 1], f);
      const e1 = norm(sub(a, mul(tangent, dot(a, tangent))));
      return [e1, cross(tangent, e1)];
    }

    _angleIn(offset, u) {
      const [e1, e2] = this._frame(u);
      return Mathf.Atan2(dot(offset, e2), dot(offset, e1));
    }
  }

  // ── ChargeSeamWalker ──
  class ChargeSeamWalker {
    constructor(sites, seed, startSeconds) {
      this.sites = sites;
      this.random = new NetRandom(seed | 0);
      this.legs = [];      // { Seam, Serial, Forward, Start, Struck, Leaves, Odometer }
      this.recent = [];
      this.options = [];
      this.at = this.random.next(sites.Junctions.length);
      this.previous = -1;
      this.serial = 0;
      this.end = F(startSeconds);
      this.odometer = 0;
    }
    get Legs() { return this.legs; }

    /** Strikes every seam due by `seconds` (and a second ahead), and forgets the ones that have faded out. */
    advance(seconds, settings) {
      seconds = F(seconds);
      const sites = this.sites, sp = span(settings);
      while (this.end <= F(seconds + 1)) {
        const options = this.options;
        options.length = 0;
        for (const e of sites.SeamsOfJunction[this.at]) if (e !== this.previous) options.push(e);
        if (this.recent.length >= 4) {
          const first = sites.Seams[this.recent[0]];
          for (const site of [first.SiteA, first.SiteB]) {
            if (!this.recent.every((e) => seamTouches(sites.Seams[e], site))) continue;
            if (options.some((e) => !seamTouches(sites.Seams[e], site))) {
              for (let i = options.length - 1; i >= 0; i--) if (seamTouches(sites.Seams[options[i]], site)) options.splice(i, 1);
            }
          }
        }
        const seam = options[this.random.next(options.length)];
        const edge = sites.Seams[seam];
        const forward = edge.A === this.at;
        const struck = F(this.end + F(settings.SeamStrike * sp));
        const leaves = F(struck + F(Mathf.Lerp(settings.SeamDwellMin, settings.SeamDwellMax, F(this.random.nextDouble())) * sp));
        this.legs.push({ Seam: seam, Serial: this.serial++, Forward: forward, Start: this.end, Struck: struck, Leaves: leaves, Odometer: this.odometer });
        this.odometer = F(this.odometer + edge.Length);
        this.end = leaves;
        this.at = forward ? edge.B : edge.A;
        this.previous = seam;
        this.recent.push(seam);
        if (this.recent.length > 4) this.recent.shift();
      }
      let drop = 0;
      const fade = F(settings.SeamFade * sp);
      while (drop < this.legs.length && F(seconds - this.legs[drop].Leaves) > fade) drop++;
      if (drop > 0) this.legs.splice(0, drop);
    }
  }

  // ── ChargeFluxChain ──
  class ChargeFluxChain {
    constructor(sites, seed) {
      this.sites = sites;
      this.random = new NetRandom(seed | 0);
      this.kept = [];        // { Index, Source, Sink }
      this.candidates = [];
      this.nextIndex = 0;
    }
    /** Discharge `index` (a whole number >= 0), or null once it has dropped out of the kept window (8). */
    tryGet(index, settings) {
      if (index < 0) return null;
      while (this.nextIndex <= index) {
        const first = this.kept.length === 0;
        const last = first ? null : this.kept[this.kept.length - 1];
        const source = first ? this.random.next(SiteCount) : last.Sink;
        const lo = Mathf.Cos(F(settings.FluxMaxDegrees * C.Deg2Rad)), hi = Mathf.Cos(F(settings.FluxMinDegrees * C.Deg2Rad));
        const cand = this.candidates;
        cand.length = 0;
        for (let i = 0; i < SiteCount; i++) {
          if (i === source || (!first && i === last.Source)) continue;
          const d = dot(this.sites.Axes[source], this.sites.Axes[i]);
          if (d < hi && d > lo) cand.push(i);
        }
        if (cand.length === 0) for (let i = 0; i < SiteCount; i++) if (i !== source) cand.push(i);
        const idx = this.nextIndex++;
        this.kept.push({ Index: idx, Source: source, Sink: cand[this.random.next(cand.length)] });
        if (this.kept.length > 8) this.kept.shift();
      }
      for (let i = this.kept.length - 1; i >= 0; i--) if (this.kept[i].Index === index) return this.kept[i];
      return null;
    }
  }

  // ── ChargeArcMeshWriter ──
  const PinLength = F(0.06), SampleSpacing = F(0.0125);

  class ChargeArcMeshWriter {
    constructor() {
      /** Flat float32 values: x,y,z per vertex, in the sites' (crystal-local) space. */
      this.positions = [];
      /** Flat float32 values: TEXCOORD0 x,y,z,w per vertex = (across -1..1, falloff 0..1, kind 0 strip / 1 face, intensity). */
      this.data = [];
      /** Triangle list (uint32-safe ints). */
      this.indices = [];
      this._arcAt = []; this._placeAt = []; this._bent = []; this._weight = [];
    }
    get vertexCount() { return this.positions.length / 3; }
    clear() { this.positions.length = 0; this.data.length = 0; this.indices.length = 0; }
    _push(p, x, y, z, w) {
      this.positions.push(p[0], p[1], p[2]);
      this.data.push(x, y, z, w);
    }

    /** A lit face as a fan from its centre; ownCentre picks the falloff from the face's own centre (a petal) or its site's. */
    face(face, intensity, ownCentre) {
      intensity = F(intensity);
      const c = this.vertexCount;
      this._push(face.Centre, 0, ownCentre ? 0 : face.SiteFalloffAtCentre, 1, intensity);
      for (let k = 0; k < face.Ring.length; k++) this._push(face.Ring[k], 0, ownCentre ? face.OwnFalloff[k] : face.SiteFalloff[k], 1, intensity);
      const n = face.Ring.length;
      for (let k = 0; k < n; k++) this.indices.push(c, c + 1 + k, c + 1 + (k + 1) % n);
    }

    /** ChargeArcMeshWriter.Plasma: one bolt along points[0..count) as a plasma ribbon and its sub-filament. */
    plasma(points, count, weights, coords, intensity, width, wobble, seed, seconds, settings, eye, radius, pinned = true) {
      if (count < 2 || intensity <= C.p01) return;
      const breath = F(C.p8 + F(C.p2 * fbm(F(F(seconds * settings.FlickerSpeed) + F(seed * C.p731)), 2)));
      this._ribbon(points, count, weights, coords, F(intensity * breath), width, wobble, seed, seconds, settings, eye, radius, pinned);
      this._ribbon(points, count, weights, coords, F(F(intensity * breath) * C.p4), F(width * C.p45), F(wobble * C.s1_7), (seed + 101) | 0,
        seconds, settings, eye, radius, pinned);
    }

    _ribbon(points, count, weights, coords, intensity, width, wobble, seed, seconds, settings, eye, radius, pinned) {
      const arcAt = this._arcAt, placeAt = this._placeAt, bent = this._bent, weight = this._weight;
      arcAt.length = 0;
      placeAt.length = 0;
      let total = 0;
      for (let i = 0; i < count; i++) {
        if (i > 0) total = F(total + mag(sub(points[i], points[i - 1])));
        arcAt.push(total);
        placeAt.push(coords == null ? total : F(coords[i] * radius));
      }
      if (total < C.e6) return;
      const step = F(SampleSpacing * radius);
      const from = placeAt[0], to = placeAt[count - 1];
      if (to <= from) return;
      bent.length = 0;
      weight.length = 0;
      const flow = F(seconds * settings.WritheSpeed), phase1 = F(seed * C.s1_37), phase2 = F(F(seed * C.s2_91) + 50);
      let seg = 0;
      let next = F(F(Mathf.Floor(F(from / step)) * step) + step);
      const quarter = F(C.p25 * step);
      if (F(next - from) < quarter) next = F(next + step);
      let guard = 0;
      const pinSpan = F(PinLength * radius);
      for (let place = from; guard++ < 512; place = F(to - next) < quarter ? to : next, next = F(next + step)) {
        while (seg < count - 2 && place > placeAt[seg + 1]) seg++;
        const spn = F(placeAt[seg + 1] - placeAt[seg]);
        const f = spn > C.e9 ? Mathf.Clamp01(F(F(place - placeAt[seg]) / spn)) : 0;
        const p = lerpU(points[seg], points[seg + 1], f);
        const tangent = norm(lerpV(pointTangent(points, count, seg), pointTangent(points, count, seg + 1), f));
        const n1 = norm(cross(tangent, sub(eye, p)));
        const n2 = cross(tangent, n1);
        const at = Mathf.Lerp(arcAt[seg], arcAt[seg + 1], f);
        const x = F(F(6 * place) / radius);
        const pin = !pinned ? 1 : F(smooth(F(at / pinSpan)) * smooth(F(F(total - at) / pinSpan)));
        const d1 = fbm(F(F(x + phase1) - flow), 3), d2 = fbm(F(F(x + phase2) + F(flow * C.p8)), 3);
        bent.push(add(p, mul(add(mul(n1, d1), mul(n2, F(C.p6 * d2))), F(F(wobble * radius) * pin))));
        weight.push(weights == null ? 1 : Mathf.Lerp(weights[seg], weights[seg + 1], f));
        if (place >= to) break;
      }
      const half = F(stripHalfWidth(settings.CoreWidth, width) * radius);
      const first = this.vertexCount;
      for (let k = 0; k < bent.length; k++) {
        const p = bent[k];
        const along = sub(bent[Math.min(k + 1, bent.length - 1)], bent[Math.max(k - 1, 0)]);
        const side = mul(norm(cross(along, sub(eye, p))), half);
        const v = F(intensity * weight[k]);
        this._push(add(p, side), 1, 0, 0, v);
        this._push(sub(p, side), -1, 0, 0, v);
        if (k === 0) continue;
        const i = first + 2 * (k - 1);
        this.indices.push(i, i + 1, i + 2, i + 2, i + 1, i + 3);
      }
    }
  }

  function pointTangent(points, count, i) {
    const before = i > 0 ? norm(sub(points[i], points[i - 1])) : zero();
    const after = i + 1 < count ? norm(sub(points[i + 1], points[i])) : zero();
    const t = add(before, after);
    return sqrMag(t) > C.e12 ? norm(t) : (sqrMag(after) > 0 ? after : before);
  }

  // ── ChargeArcs (static) ──
  function smooth(x) {
    x = Mathf.Clamp01(x);
    return F(F(x * x) * F(3 - F(2 * x)));
  }
  function hash(a, b) {
    let h = (Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263)) >>> 0;
    h = Math.imul((h ^ (h >>> 13)) >>> 0, 1274126177) >>> 0;
    h = (h ^ (h >>> 16)) >>> 0;
    return F(F(h) / 4294967296);
  }
  function valueNoise(x) {

  // ------------------------------------------------------------------ CrystalDepthPrismProfileSO
  /** profile(json): json is data/depth.json's `profile` (the asset's serialized names). Returns frozen float32 values plus

  function profile(json) {
    const p = {

      reseatDepth: f(json.reseatDepth), reseatFadeSeconds: f(json.reseatFadeSeconds), orientationJitter: f(json.orientationJitter),

      riseRate: f(json.riseRate), occluderRadius: f(json.occluderRadius),

  // ------------------------------------------------------------------ CrystalDepthPrisms.cs
  /** StepColumns: every column's ratchet against `eye` (the camera, in the prisms' own object space). `columns` (array of
   * {place, fade, leavingPlace}) is updated in place; the other arrays are read. */
  function stepColumns(columns, directions, centres, tops, plateRadius, eye, dt, fresh, prof, reach, sizeAtTop) {
    const DR = DepthRatchet;
    eye = v3(eye); dt = f(dt); plateRadius = f(plateRadius); reach = f(reach); sizeAtTop = f(sizeAtTop);
    const distance = mag(eye);
    if (distance < EPS4) return;
    const toCamera = div(eye, distance);
    const seal = prof.sealFor(plateRadius, distance);
    const rise = prof.riseWhileHidden && !fresh;
    const occluder = f(prof.occluderRadius * plateRadius);
    for (let j = 0; j < columns.length; j++) {
      const depth = dot(directions[j], toCamera);
      const seat = prof.seat(depth, seal);
      if (fresh) { columns[j] = DR.at(seat); continue; }

      if (rise && seat < columns[j].place && columns[j].fade >= 1) {

  function columnBody(plateCentre, bound, place, reach, sizeStart, split) {
    const k = lerp(f(reach), 1, f(place));
    const scale = f(k * lerp(f(sizeStart), 1, f(place)));

  /** TryGetPlates on a baked prism mesh {positions (3n), uv2 (4n: plate centre xyz, plate index w)} ->

  function tryGetPlates(mesh) {
    const P = mesh.positions, U = mesh.uv2, n = P.length / 3;
    if (!U || U.length !== 4 * n) return { problem: 'mesh carries no plate data in TEXCOORD2' };
    let count = 0;
    for (let i = 0; i < n; i++) count = Math.max(count, roundToInt(f(U[4 * i + 3])) + 1);
    if (count < 1 || count > MAX_PLATES) return { problem: `mesh has ${count} plates (1..${MAX_PLATES} supported)` };
    const directions = new Array(count).fill(null).map(() => [0, 0, 0]);
    for (let i = 0; i < n; i++) {
      const c = v3([U[4 * i], U[4 * i + 1], U[4 * i + 2]]);

      const v = v3([P[3 * i], P[3 * i + 1], P[3 * i + 2]]);

      tops[j] = max(tops[j], dot(sub(v, centre), directions[j]));
      bounds[j] = max(bounds[j], mag(sub(v, centre)));

    for (const c of centres) radius = f(radius + mag(c));

    return { directions, centres, tops, bounds, plateRadius: radius };

  // ------------------------------------------------------------------ OmniCombinePlayer.DepthColumns
  /** One depth-prism renderer's columns. new DepthColumns(plates) (the Mass: fill with setMassPlates each frame) or
   * new DepthColumns(plates, directions, centres, tops, bounds, plateRadius) (the triangles: from tryGetPlates). */
  class DepthColumns {
    constructor(plates, directions, centres, tops, bounds, plateRadius) {

      this.state = Array.from({ length: MAX_PLATES }, () => [0, 0, 0, 0]);   // the shader's _DepthState (zeros past count)

     * (0 = every prism solid at place `rest`, 1 = the ratchet). No-op (state kept, fresh kept) when the eye is at the
     * origin or plateRadius <= 0. */
    step(eye, dt, prof, reach, sizeAtTop, strength, rest = 1) {

      }

    }

    /** WriteMass's column fill: plates[q] = [cx, cy, cz, q] (from massPlates), every top at `topHeight` (the morphed shape's). */
    setMassPlates(plates, topHeight) {
      let radius = 0;
      for (let q = 0; q < plates.length; q++) {
        const c = v3(plates[q]);
        this.centres[q] = c;
        this.directions[q] = normalized(c);
        this.tops[q] = f(topHeight);
        radius = f(radius + mag(c));
      }
      this.plateRadius = f(radius / Math.max(1, plates.length));
    }

    /** The state as one Float32Array(240) for a uniform vec4[60] upload. */
    stateArray(out) {
      out = out || new Float32Array(4 * MAX_PLATES);
      for (let j = 0; j < MAX_PLATES; j++) for (let k = 0; k < 4; k++) out[4 * j + k] = this.state[j][k];

    }
  }

  /** The plates sharing each omni triangle (OmniCombinePlayer.Build): plateSite (the Mass crystal's, per plate) -> per plate,

  /** WriteMass's plate centres: `pose` (flat xyz per Mass vertex, stage space), `centre` (the crystal's flight centre = the

     *   mass      = of(materials.mass, combine.massMeshScale, combine.depth.massThickness)   (the thin combine prisms)
     *   triThin   = of(materials.omni, 1, combine.depth.omniThickness)                        (what the Mass morphs toward)

      pos[3 * i + 1] = vy + ny * (spread[1] / os[1]);
      pos[3 * i + 2] = vz + nz * (spread[2] / os[2]);

  function deformBoth(mesh, state, shape, opts) {

//                            use D3D's top-left SV_Position rows, i.e. the exact pixel pattern Unity draws on Windows.

    // The four crystals that wear the body material (Space, Charge, Time; Mass is the depth layer's) and the omni
    // body with its 20 triangle holes cut.

        this.pieces.push(this.gpuPiece(piece(d.basis, d.tris, d.plate, k)));

        bright.push(b[0] + (e[0] - b[0]) * tint, b[1] + (e[1] - b[1]) * tint, b[2] + (e[2] - b[2]) * tint);
        dark.push(...hexToLinear(look.bodyDark));
      }
      gl.uniform3fv(body.u.uBright, bright); gl.uniform3fv(body.u.uDark, dark);

        gl.uniform1f(body.u.uOpacity, 1);
        for (let k = 0; k < 4; k++) {
          const pc = this.pieces[k];
          if (!pc) continue;
          writePiece(pc, this.reel.poses[k]);
          this.uploadPiece(pc);
          gl.bindVertexArray(pc.vao); gl.drawArrays(gl.TRIANGLES, 0, pc.corner.length);

        gl.uniform1f(body.u.uOpacity, frame.omni.appear);
        writePiece(this.omniPiece, frame.omni.pos);
        this.uploadPiece(this.omniPiece);
        gl.bindVertexArray(this.omniPiece.vao); gl.drawArrays(gl.TRIANGLES, 0, this.omniPiece.corner.length);
      }
      for (const layer of this.layers) layer.draw(gl, frame, V);
      gl.bindVertexArray(null);

      // 2. resolve
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, t.msFbo);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, t.scene.fbo);
      gl.blitFramebuffer(0, 0, S.W, S.H, 0, 0, S.W, S.H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
      gl.disable(gl.DEPTH_TEST); gl.depthMask(false); gl.disable(gl.BLEND);

        gl.uniform1i(prog.u.uSrc, 0);

      const B = t.bloom;
      if (B.length) {
        gl.bindTexture(gl.TEXTURE_2D, t.scene.tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        pass(this.progs.pre, t.scene, B[0], (p) => { gl.uniform2f(p.u.uTexel, 1 / S.W * S.ss, 1 / S.H * S.ss); gl.uniform1f(p.u.uThreshold, look.bloomThreshold); gl.uniform1f(p.u.uKnee, Math.max(0.05, look.bloomThreshold * 0.5)); });

        let src = B[B.length - 1];

          pass(this.progs.up, src, dst, (p) => { gl.uniform2f(p.u.uTexel, 1 / src.w, 1 / src.h); gl.uniform1f(p.u.uRadius, look.bloomRadius); });

        gl.bindTexture(gl.TEXTURE_2D, t.scene.tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      }

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, S.w, S.h);
      const c = this.progs.comp;
      gl.useProgram(c.p);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, t.scene.tex); gl.uniform1i(c.u.uScene, 0);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, this.bloomTex || t.scene.tex); gl.uniform1i(c.u.uBloom, 1);
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, this.overlayTex); gl.uniform1i(c.u.uOverlay, 2);
      gl.uniform1i(c.u.uSS, S.ss);
      gl.uniform1f(c.u.uExposure, Math.pow(2, look.exposure)); gl.uniform1f(c.u.uBloomStrength, B.length ? look.bloomStrength : 0);
      gl.uniform1f(c.u.uSat, look.saturation); gl.uniform1f(c.u.uContrast, look.contrast);
      gl.uniform1f(c.u.uVignette, look.vignette); gl.uniform1f(c.u.uGrain, look.grain / 255); gl.uniform1f(c.u.uFrame, this.frameNo % 997);

      gl.activeTexture(gl.TEXTURE0);

  // ================= export =================
  let exporting = false, cancelExport = false, pendingFile = null;
  function exportBlock() {
    const box = document.createElement('div'); box.className = 'group';
    const f = FORMATS[P.format], frames = Math.round(reel.T.L / P.playSpeed * P.fps) * P.loops;
    const mbps = QUALITY[P.quality].bpp * f.w * f.h * P.fps / 1e6;
    box.innerHTML = '<h3>The file</h3>';
    const kv = document.createElement('div'); kv.className = 'kv';
    for (const [k, v] of [['for', f.use], ['length', fmtTime(frames / P.fps)], ['frames', String(frames)], ['bitrate', mbps.toFixed(1) + ' Mbps'], ['about', Math.round(mbps * frames / P.fps / 8) + ' MB'], ['seamless', 'last frame flows into the first']]) {
      const a = document.createElement('span'), b = document.createElement('b'); a.textContent = k; b.textContent = v; kv.append(a, b);
    }
    box.appendChild(kv);
    const n = document.createElement('p'); n.className = 'note';
    n.textContent = 'Every frame is rendered at the export size and timed exactly, so the file is smooth at its frame rate whatever this device manages live. Inside claude.ai the file is offered through a save prompt; if a save is refused here, open the repo copy in Chrome.';
    box.appendChild(n);
    return box;
  }

  async function chooseCodec(w, h, fps, bitrate) {
    if (typeof VideoEncoder === 'undefined') return null;
    const avc = ['avc1.640034', 'avc1.640033', 'avc1.640032', 'avc1.64002A', 'avc1.4D4034', 'avc1.42E034'];
    const vp9 = ['vp09.00.51.08', 'vp09.00.41.08', 'vp09.00.40.08'];
    const tryList = async (list, kind) => {
      for (const codec of list) {
        const cfg = { codec, width: w, height: h, bitrate, framerate: fps, latencyMode: 'quality', bitrateMode: 'variable' };
        if (kind === 'avc') cfg.avc = { format: 'avc' };
        try { const s = await VideoEncoder.isConfigSupported(cfg); if (s.supported) return { kind, cfg: s.config || cfg }; } catch (e) { /* next */ }
      }
      return null;
    };
    if (P.codec === 0) return (await tryList(avc, 'avc')) || (await tryList(vp9, 'vp9'));
    return (await tryList(vp9, 'vp9')) || (await tryList(avc, 'avc'));
  }

  async function exportVideo() {
    if (exporting) return;
    const f = FORMATS[P.format], fps = P.fps, w = f.w, h = f.h;
    const perLoop = Math.round(reel.T.L / P.playSpeed * fps), N = perLoop * P.loops;
    const bitrate = Math.round(QUALITY[P.quality].bpp * w * h * fps);
    showBusy('Exporting', 'Checking the encoder…');
    const pick = await chooseCodec(w, h, fps, bitrate);
    if (!pick) { busyMessage('This browser cannot encode video (no WebCodecs). Open the page in Chrome or Edge on a computer.', true); return; }
    const mp4 = P.codec === 0 || pick.kind === 'avc';
    const Mux = mp4 ? globalThis.Mp4Muxer : globalThis.WebMMuxer;
    if (!Mux) { busyMessage('The muxer library did not load (it comes from cdn.jsdelivr.net). Check the connection and try again.', true); return; }
    exporting = true; cancelExport = false;
    const muxer = mp4
      ? new Mux.Muxer({ target: new Mux.ArrayBufferTarget(), video: { codec: pick.kind === 'avc' ? 'avc' : 'vp9', width: w, height: h, frameRate: fps }, fastStart: 'in-memory' })
      : new Mux.Muxer({ target: new Mux.ArrayBufferTarget(), video: { codec: 'V_VP9', width: w, height: h, frameRate: fps } });
    let failed = null;
    const encoder = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => { failed = e; } });
    encoder.configure(pick.cfg);
    renderer.resize(w, h, P.supersample);
    drawOverlay(w, h);
    const L = look(), t0 = performance.now();
    try {
      for (let i = 0; i < N && !cancelExport && !failed; i++) {
        const tau = ((i % perLoop) / fps) * P.playSpeed;
        renderer.draw(reel.frame(tau, P.playSpeed / fps), L);
        const vf = new VideoFrame(canvas, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
        encoder.encode(vf, { keyFrame: i % (fps * 2) === 0 });
        vf.close();
        while (encoder.encodeQueueSize > 6) await new Promise((r) => setTimeout(r, 1));
        if (i % 4 === 0) {
          const el = (performance.now() - t0) / 1000, eta = el / (i + 1) * (N - i - 1);
          busyProgress((i + 1) / N, 'Frame ' + (i + 1) + ' of ' + N + ' · about ' + Math.ceil(eta) + ' s left');
          await new Promise((r) => setTimeout(r, 0));
        }
      }
      if (failed) throw failed;
      if (cancelExport) { encoder.close(); busyMessage('Cancelled.', true); return; }
      busyProgress(1, 'Finishing the file…');
      await encoder.flush();
      muxer.finalize();
      const blob = new Blob([muxer.target.buffer], { type: mp4 ? 'video/mp4' : 'video/webm' });
      const name = 'converter-reel-' + f.w + 'x' + f.h + '-' + fps + 'fps-play' + P.seed + '-' + (preset || 'custom') + (mp4 ? '.mp4' : '.webm');
      pendingFile = { name, blob };
      busyMessage('Ready: ' + name + ' (' + (blob.size / 1e6).toFixed(1) + ' MB, ' + (pick.kind === 'avc' ? 'H.264' : 'VP9') + ').', false, true);
    } catch (e) {
      busyMessage('The encoder stopped: ' + (e && e.message || e) + '. Try a smaller size or the other file type.', true);
    } finally {
      exporting = false; previewDirty = true;
      try { encoder.state !== 'closed' && encoder.close(); } catch (e) { /* closed */ }
    }
  }

  async function saveFile(file) {
    const dl = globalThis.claude && globalThis.claude.use ? await globalThis.claude.use('downloads').catch(() => null) : null;
    if (dl) {
      try { await dl.save({ filename: file.name, data: file.blob }); return 'Saved.'; }
      catch (e) { if (e && e.code === 'declined') return 'Not saved.'; if (e && e.code !== 'unavailable') return 'Save refused (' + (e.code || e) + ').'; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file.blob); a.download = file.name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    return 'Saved to your downloads.';
  }

  function showBusy(title, note) { $('busy').hidden = false; $('busyTitle').textContent = title; $('busyNote').textContent = note; $('busyBar').style.width = '0'; $('busySave').hidden = true; $('busyCancel').textContent = 'Cancel'; }
  function busyProgress(f, note) { $('busyBar').style.width = (100 * f).toFixed(1) + '%'; $('busyNote').textContent = note; }
  function busyMessage(note, closeOnly, canSave) { $('busyNote').textContent = note; $('busySave').hidden = !canSave; $('busyCancel').textContent = closeOnly || canSave ? 'Close' : 'Cancel'; }
  $('busyCancel').onclick = () => { if (exporting) cancelExport = true; else $('busy').hidden = true; };
  $('busySave').onclick = async () => { if (!pendingFile) return; $('busyNote').textContent = await saveFile(pendingFile); };
  $('bExport').onclick = exportVideo;
  $('bStill').onclick = async () => {
    const f = FORMATS[P.format];
    renderer.resize(f.w, f.h, P.supersample); drawOverlay(f.w, f.h);
    renderer.draw(reel.frame(sim.tau, 1 / 60), look());
    const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
    previewDirty = true;
    showBusy('Still', '');
    pendingFile = { name: 'converter-reel-' + f.w + 'x' + f.h + '-' + sim.tau.toFixed(2) + 's.png', blob };
    busyMessage('Ready: ' + pendingFile.name + ' (' + (blob.size / 1e6).toFixed(1) + ' MB).', false, true);
  };

  // ================= saved looks (shared) =================
  let db = null, me = null, looksCache = [];
  function savedBlock() {
    const box = document.createElement('div'); box.className = 'group';
    box.innerHTML = '<h3>Team looks</h3><p class="note" id="savedNote"></p>';
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = '<label for="lookName">Name</label><input type="text" id="lookName" maxlength="40" placeholder="Name this look">';
    const save = document.createElement('button'); save.type = 'button'; save.className = 'btn primary'; save.textContent = 'Save this look for the team';
    save.onclick = saveLook;
    const list = document.createElement('div'); list.className = 'looks'; list.id = 'lookList';
    box.append(row, save, list);
    setTimeout(renderLooks, 0);
    return box;
  }
  function snapshotLook() { return { preset, settings: diffOnly() }; }
  async function saveLook() {
    const name = ($('lookName').value || '').trim() || 'Untitled look';
    const doc = { name, ...snapshotLook(), createdAt: new Date().toISOString(), by: me };
    if (db) { try { await db.collection('looks').add(doc); $('savedNote').textContent = 'Saved for everyone who opens this page.'; return; } catch (e) { $('savedNote').textContent = 'Could not save to the team list (' + (e.code || e) + '); kept in this browser.'; } }
    const local = lsGet(LS_KEY + ':looks', []); local.unshift(doc); lsSet(LS_KEY + ':looks', local.slice(0, 40)); looksCache = mergeLooks([]); renderLooks();
  }
  function mergeLooks(remote) { return remote.concat(lsGet(LS_KEY + ':looks', []).map((l) => Object.assign({ local: true }, l))); }
  function renderLooks() {
    const list = $('lookList'), note = $('savedNote');
    if (!list) return;
    if (note && !note.textContent) note.textContent = db ? 'Looks saved here are shared with everyone who opens this page.' : 'Saved in this browser only (the team list needs the page opened in claude.ai, signed in).';
    list.innerHTML = '';
    if (!looksCache.length) { const p = document.createElement('p'); p.className = 'note'; p.textContent = 'No saved looks yet. Set a look you like, name it and save it; it shows up here for the team.'; list.appendChild(p); return; }
    for (const l of looksCache) {
      const d = document.createElement('div'); d.className = 'look';
      const t = document.createElement('div'); t.innerHTML = '<b></b><small></small>';
      t.querySelector('b').textContent = l.name;
      t.querySelector('small').textContent = Object.keys(l.settings || {}).length + ' settings · ' + (l.local ? 'this browser' : 'team') + ' · ' + String(l.createdAt || '').slice(0, 10);
      const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = 'Apply';
      b.onclick = () => { Object.assign(P, SHIPPED, l.settings || {}); preset = l.preset || 'custom'; replan(); previewDirty = true; persist(); refreshDiff(); buildPane(); };
      d.append(t, b); list.appendChild(d);
    }
  }
  (async function connect() {
    try {
      if (!globalThis.claude || !globalThis.claude.use) { looksCache = mergeLooks([]); return; }
      const [d, u] = await Promise.all([globalThis.claude.use('db'), globalThis.claude.use('user')]);
      db = d; me = u && u.id ? await u.id() : null;
      if (!db) { looksCache = mergeLooks([]); renderLooks(); return; }
      db.collection('looks').orderBy('createdAt', 'desc').limit(60).onSnapshot((snap) => { looksCache = mergeLooks(snap.docs.map((x) => x.data())); renderLooks(); }, () => {});
    } catch (e) { looksCache = mergeLooks([]); }
  })();

  // ================= the check: the loop closes, the order is first in first out =================
  // The yardstick: the largest frame-to-frame jump of any vertex across the loop point (last frame -> first), as a
  // multiple of the largest jump between two ordinary idle frames. A seamless loop reads about 1. The control plays
  // the idle effects on one clock that restarts with the loop (what a naive cut does) and must read far above 1.
  function poseSnapshot(tau, naive) {
    const out = [];
    for (let k = 0; k < 4; k++) {
      if (naive) reel.naiveClock = true;
      reel.poseCrystal(k, tau, reel.camDir(tau));
      reel.naiveClock = false;
      out.push(Float32Array.from(reel.poses[k]));
    }
    return out;
  }
  // Shape distance (symmetric Hausdorff per crystal), not vertex distance: a Space spin or a Time flip lands on a
  // congruent shape and snaps its vertices back to rest, which a per-vertex measure reads as a jump nobody can see.
  function maxJump(a, b) {
    let m = 0;
    for (let k = 0; k < 4; k++) for (const [P, Q] of [[a[k], b[k]], [b[k], a[k]]]) for (let i = 0; i < P.length; i += 3) {
      let best = Infinity;
      for (let j = 0; j < Q.length; j += 3) { const dx = P[i] - Q[j], dy = P[i + 1] - Q[j + 1], dz = P[i + 2] - Q[j + 2], d = dx * dx + dy * dy + dz * dz; if (d < best) best = d; }
      m = Math.max(m, Math.sqrt(best));
    }
    return m;
  }
  function score(fps) {
    fps = fps || 60;
    const T = reel.T, dt = 1 / fps, R = reel.R;
    const last = T.L - dt;
    const seam = maxJump(poseSnapshot(last), poseSnapshot(0));
    const naive = maxJump(poseSnapshot(last, true), poseSnapshot(0, true));
    let idle = 0;
    for (let t = 0.2; t < T.press - dt; t += 0.37) idle = Math.max(idle, maxJump(poseSnapshot(t), poseSnapshot(t + dt)));
    const order = [0, 1, 2, 3].sort((a, b) => T.out[a] - T.out[b]).map((k) => ELEMENTS[k]).join(' > ');
    return { loopSeconds: +T.L.toFixed(3), seamR: +(seam / R).toFixed(5), idleStepR: +(idle / R).toFixed(5), seamOverIdle: +(seam / Math.max(1e-9, idle)).toFixed(2), naiveOverIdle: +(naive / Math.max(1e-9, idle)).toFixed(2), outOrder: order, inOrder: 'Space > Charge > Mass > Time' };
  }
  function runBatch() {
    const keep = P.seed, rows = [];
    for (const s of [7, 21, 64]) { P.seed = s; replan(); const r = score(60); rows.push({ seed: s, loop: r.loopSeconds, seamOverIdle: r.seamOverIdle, naiveOverIdle: r.naiveOverIdle }); }
    P.seed = keep; replan();
    return rows;
  }
  function checkBlock() {
    const box = document.createElement('div'); box.className = 'group';
    box.innerHTML = '<h3>Does it loop?</h3><p class="note">How far the crystals\' shapes move from the last frame to the first, against the most they move between two idle frames. About 1 is seamless. The control restarts every idle effect with the loop, which is what cutting the video at any point would do.</p>';
    const r = score(P.fps), t = document.createElement('table'); t.className = 'score';
    const ok = r.seamOverIdle <= 1.5, ctl = r.naiveOverIdle > 3;
    t.innerHTML = '<tr><th>measure</th><th>value</th><th></th></tr>'
      + '<tr><td>loop seam / idle step</td><td>' + r.seamOverIdle + '</td><td class="' + (ok ? 'pass' : 'fail') + '">' + (ok ? 'seamless' : 'jumps') + '</td></tr>'
      + '<tr><td>control: naive cut / idle step</td><td>' + r.naiveOverIdle + '</td><td class="' + (ctl ? 'pass' : 'fail') + '">' + (ctl ? 'jumps, as it must' : 'yardstick blind') + '</td></tr>'
      + '<tr><td>in</td><td colspan="2">' + r.inOrder + '</td></tr><tr><td>out</td><td colspan="2">' + r.outOrder + '</td></tr>'
      + '<tr><td>loop</td><td colspan="2">' + fmtTime(r.loopSeconds / P.playSpeed) + '</td></tr>';
    box.appendChild(t);
    const nm = document.createElement('div'); nm.className = 'group';
    nm.innerHTML = '<h3>What this does not model</h3><ul class="plain">'
      + '<li>The menu skybox behind the converter, and the game camera\'s post stack (bloom, tonemapping). The backdrop and grade here are lab choices.</li>'
      + '<li>The pull-out does not exist in the game. It is the game\'s own pose run backwards per crystal, aimed at the camera the same way the build is.</li>'
      + '<li>Colour is judged on this screen. Phones and platforms re-encode; check the exported file on a phone before posting.</li>'
      + '<li>The game draws a new play on every press; the reel shows the one the Play number draws, with a seeded generator instead of System.Random.</li>'
      + X.notModelled.map((s) => '<li>' + s + '</li>').join('') + '</ul>';
    box.appendChild(nm);
    return box;
  }

  // ================= hooks =================
  globalThis.__lab = {
    get manualClock() { return manualClock; }, set manualClock(v) { manualClock = !!v; },
    tick(dt, n) { dt = dt == null ? 1 / 60 : dt; n = n == null ? 1 : n; for (let i = 0; i < n; i++) sim.tau = (sim.tau + dt * P.playSpeed) % reel.T.L; renderPreview(); return sim.tau; },
    reset(seed) { if (seed != null) { P.seed = seed | 0; replan(); } sim.tau = 0; renderPreview(); },
    score: () => score(60), runBatch, state: () => ({ t: sim.tau, loop: reel.T.L, phase: phaseName(sim.tau), seed: P.seed, preset }),
    SHIPPED, SPEC, P, PLATFORM: 'desktop', reel, renderer, FORMATS,
    // The headless exporter: draw frame i of the loop at the export size; the caller reads the canvas.
    prepareExport(opts) {
      opts = opts || {};
      const f = FORMATS[opts.format != null ? opts.format : P.format];
      manualClock = true; exporting = true;
      renderer.resize(f.w, f.h, opts.supersample || P.supersample); drawOverlay(f.w, f.h);
      const fps = opts.fps || P.fps;
      return { w: f.w, h: f.h, fps, frames: Math.round(reel.T.L / P.playSpeed * fps), L: reel.T.L };
    },
    renderFrame(i, fps) { fps = fps || P.fps; const tau = (i / fps) * P.playSpeed; renderer.draw(reel.frame(tau, P.playSpeed / fps), look()); return tau; },
    readPixels() { const gl = renderer.gl, w = canvas.width, h = canvas.height, px = new Uint8Array(w * h * 4); gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px); return px; },
    apply(settings) { Object.assign(P, settings); replan(); previewDirty = true; },
  };

  // ================= boot =================
  replan();
  buildTabs(); buildPane(); refreshDiff(); updateFormatChip();
  window.addEventListener('resize', () => { previewDirty = true; });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { previewDirty = true; });
  requestAnimationFrame((t) => { last = t; loop(t); });
})();
</script>
