<!--
  WRASSE HAUL LAB, round 1 (a /labmaker browser studio, an A/B).
  Question (Garrett, 2026-10-29): "the wrass has three fun things to do: attack vessels, prisms, and lasso elements.
  but the constant looping gets very repetitive. every vessel must be fun the thousandth time." Show the new concept
  (Docs/Studios/ONE_THUMB_SEAT_ARCS.md section 2: Hunt, Haul, Sling, Clean) against the shipped Wrasse, A/B.
    A - the shipped Wrasse: the Sling, a pure loop fires the moment it closes, motes spawn evenly.
    B - the concept: shoals that move like their element, loops cinch into a haul towed at the tail, lift the thumb
        mid-swing to throw it, fly home into the Grouper to dock (rest, and clean its silence).
  The kite, the Sling, the tail and the loop rule are the Wrasse Lasso Lab's copy of the shipped KiteNavigatorCore,
  line for line; the numbers are KiteNavigatorConfig.asset's. Write-up: Docs/Studios/WRASSE_HAUL_LAB.md.
  Verify: node .claude/skills/labmaker/verify_lab.cjs <this file>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);

  // ================= (1) LAB meta + the shipped numbers =================
  // A READER of the shipped Wrasse. Every game constant names the field it was copied from. The concept's knobs
  // (prefix hl = haul / throw / dock, sh = shoals) and the stand-in world (prefix lab) are this lab's proposals.
  const LAB = { name: 'Wrasse Haul Lab', branch: 'cece/jolly-lovelace-t8y3a1', round: 1, doc: 'Docs/Studios/WRASSE_HAUL_LAB.md' };
  const SHIPPED = {
    // KiteNavigatorConfig.asset (Assets/_SO_Assets/VesselActions/KiteNavigator/), read 2026-10-29 on cece/jolly-lovelace-t8y3a1
    boardRadius: 160,            // KiteNavigatorConfigSO.boardRadius (u)
    kiteRadius: 8,               // .kiteRadius (u): the head's contact radius
    tailLength: 4.8,             // .tailLength (board radii)
    moteCount: 26,               // .moteCount
    moteCluster: 4,              // .moteCluster (average motes per one-element cluster)
    moteSpread: 18,              // .moteSpread (u, gaussian)
    mixedLoops: 0,               // .mixedLoops: 0 Fizzle (shipped), 1 Majority
    growth: 2,                   // .growth: base x growth^(n-1)
    moteSize: 4.5,               // .moteSize (u, the flower's radius)
    spaceMaxScale: 60,           // .spaceMaxScale (AOEExplosion MaxScale at n = 1)
    spaceMaxScaleCap: 640,       // .spaceMaxScaleCap
    massPrisms: 6,               // .massPrisms
    massPrismCap: 240,           // .massPrismCap
    timeBoostSeconds: 1.5,       // .timeBoostSeconds
    timeBoostCap: 30,            // .timeBoostCap (s): at most 20 boosts banked
    chargePetals: 1,             // .chargePetals
    chargeCap: 30,               // .chargeCap
    stealCooldown: 1,            // .stealCooldown (s)
    slingRope: 42,               // .slingRope (u)
    slingStiffness: 260,         // .slingStiffness (1/s^2)
    slingDamping: 5,             // .slingDamping (1/s)
    slingDrag: 0.35,             // .slingDrag (1/s, while held)
    slingFreeDrag: 0.9,          // .slingFreeDrag (1/s, let go)
    slingMaxSpeed: 364,          // .slingMaxSpeed (u/s)
    // lab: the stand-in world both variants fly in
    labFlow: 40,                 // lab: how fast the world flows down the board (u/s); the hull is always flying
    labPrisms: 70,               // lab: hostile prisms kept on the board
    labDanger: 0.08,             // lab: share of hostile prisms that are danger prisms
    labRivalSpeed: 80,           // lab: the rival hull's wander speed (u/s), the lasso lab's Medium
    labRivalSilence: 4,          // lab: silence one rival hit puts on the Grouper or an ally (s)
    labRivalCooldown: 3,         // lab: seconds between the rival's hits
    labSilenceCap: 15,           // lab: most silence a hull can carry (s)
    // proposal B: the haul, the throw, the dock
    hlThrowSpeed: 220,           // proposal: the kite must swing faster than this (u/s) for a lift to throw the haul
    hlThrowGain: 1.15,           // proposal: the haul leaves at this multiple of the kite's speed
    hlThrowDrag: 1.8,            // proposal: how fast a thrown haul slows (1/s)
    hlMassPerMote: 0.12,         // proposal: each hauled mote adds this much to the kite's mass on the rope
    hlDragPerMote: 0.04,         // proposal: each hauled mote adds this much drag while held (1/s)
    hlTow: 16,                   // proposal: how far behind the head the haul rides (u)
    hlHeadSpill: 1,              // proposal: the head crossing its own haul spills it (1 on, 0 off)
    hlDockRadius: 20,            // proposal: fly into the Grouper this close to dock (u)
    hlLaunchGain: 5,             // proposal: launch speed per u of drag out of the dock (1/s)
    hlCleanRate: 2,              // proposal: extra silence the dock cleans off the Grouper per second (s/s)
    hlAllyClean: 5,              // proposal: silence one loop round an ally's shadow cleans (s)
    hlOmni: 1.5,                 // proposal: an all-four braid throws every element at this multiple
    hlHullCatch: 26,             // proposal: a Time haul thrown this close to the Grouper is caught (u)
    // proposal B: shoals that move like their element
    shFeatureShare: 0.75,        // proposal: share of new shoals that gather round a world feature (flora, crystals)
    shTimeSense: 50,             // proposal: a Time shoal darts when the kite comes this close (u)
    shTimeDart: 110,             // proposal: a Time shoal's dart (u/s)
    shMassSize: 1.75,            // proposal: Mass shoals are this many times the cluster size
    shMassDrift: 6,              // proposal: Mass shoals' drift (u/s)
    shSpaceBlink: 2,             // proposal: seconds between a Space shoal's hops
    shSpaceHop: 38,              // proposal: how far a Space shoal hops (u)
    shChargeSense: 60,           // proposal: a Charge shoal shies from the kite inside this (u)
    shChargeShy: 45,             // proposal: how fast it shies (u/s)
    shChargeLure: 14,            // proposal: how fast it drifts toward the rival (u/s)
  };

  // ================= (2) SPEC: one row per slider =================
  const SPEC = [
    ['Haul', 'hlThrowSpeed', 80, 360, 5, 'Throw speed (u/s)', 'Proposal. Lift your thumb while the kite swings faster than this and the haul flies. A slower lift lets the kite drift on with its haul, as today.'],
    ['Haul', 'hlThrowGain', 0.6, 2, 0.05, 'Throw strength (x)', 'Proposal. The haul leaves at this multiple of the kite\'s speed.'],
    ['Haul', 'hlThrowDrag', 0.5, 5, 0.1, 'Throw drag (1/s)', 'Proposal. How fast a thrown haul slows and lands.'],
    ['Haul', 'hlMassPerMote', 0, 0.5, 0.01, 'Weight per mote', 'Proposal. Each hauled mote makes the kite heavier on the rope: wider, slower swings.'],
    ['Haul', 'hlDragPerMote', 0, 0.2, 0.01, 'Drag per mote (1/s)', 'Proposal. Each hauled mote adds drag while you hold.'],
    ['Haul', 'hlTow', 6, 40, 1, 'Tow distance (u)', 'Proposal. How far behind the head the haul rides.'],
    ['Haul', 'hlHeadSpill', 0, 1, 1, 'Head crossing spills (0 / 1)', 'Proposal. Turning the head back through your own haul spills it.'],
    ['Haul', 'hlOmni', 1, 3, 0.1, 'Omni braid (x)', 'Proposal. A haul holding all four elements throws each at this multiple.'],
    ['Dock', 'hlDockRadius', 8, 40, 1, 'Dock radius (u)', 'Proposal. Fly into the Grouper with no haul (or only Time) and the kite docks.'],
    ['Dock', 'hlLaunchGain', 1, 12, 0.5, 'Launch gain (1/s)', 'Proposal. Drag out of the dock and let go: the kite leaves along the drag at this many u/s per u dragged.'],
    ['Dock', 'hlCleanRate', 0, 6, 0.25, 'Dock cleaning (s/s)', 'Proposal. Extra silence cleaned off the Grouper per second while docked.'],
    ['Dock', 'hlAllyClean', 0, 15, 0.5, 'Ally cleaning (s)', 'Proposal. A loop round an ally\'s shadow cleans this much of its silence.'],
    ['Dock', 'hlHullCatch', 10, 60, 1, 'Time catch radius (u)', 'Proposal. A Time haul thrown this close to the Grouper is caught as boosts.'],
    ['Shoals', 'shFeatureShare', 0, 1, 0.05, 'Gather round features', 'Proposal. Share of new shoals that form round a world feature (a stand-in for flora and crystals the plane cuts).'],
    ['Shoals', 'shTimeSense', 0, 120, 1, 'Time: dart range (u)', 'Proposal. A Time shoal darts away when the kite comes this close.'],
    ['Shoals', 'shTimeDart', 0, 250, 5, 'Time: dart speed (u/s)', 'Proposal.'],
    ['Shoals', 'shMassSize', 1, 3, 0.05, 'Mass: shoal size (x)', 'Proposal. Mass shoals are big and slow.'],
    ['Shoals', 'shMassDrift', 0, 30, 1, 'Mass: drift (u/s)', 'Proposal.'],
    ['Shoals', 'shSpaceBlink', 0.5, 6, 0.1, 'Space: hop every (s)', 'Proposal. A Space shoal flickers, then hops.'],
    ['Shoals', 'shSpaceHop', 0, 90, 1, 'Space: hop length (u)', 'Proposal.'],
    ['Shoals', 'shChargeSense', 0, 140, 1, 'Charge: shy range (u)', 'Proposal. A Charge shoal shies from the kite inside this.'],
    ['Shoals', 'shChargeShy', 0, 120, 1, 'Charge: shy speed (u/s)', 'Proposal.'],
    ['Shoals', 'shChargeLure', 0, 60, 1, 'Charge: drift to rival (u/s)', 'Proposal. Charge shoals are caught near danger.'],
    ['World', 'labFlow', 0, 120, 1, 'World flow (u/s)', 'Lab. The hull always flies, so the world flows down the board.'],
    ['World', 'labPrisms', 0, 160, 1, 'Hostile prisms', 'Lab. Hostile prisms kept on the board.'],
    ['World', 'labDanger', 0, 0.5, 0.01, 'Danger share', 'Lab. Share of hostile prisms that are danger prisms (they spill a haul).'],
    ['World', 'labRivalSpeed', 20, 160, 5, 'Rival speed (u/s)', 'Lab.'],
    ['World', 'labRivalSilence', 0, 10, 0.5, 'Silence per rival hit (s)', 'Lab stand-in for SILENCE.md: what one scored hit puts on the Grouper or an ally.'],
    ['World', 'labRivalCooldown', 0.5, 10, 0.5, 'Rival hit cooldown (s)', 'Lab.'],
    ['World', 'tailLength', 0.8, 8, 0.1, 'Tail length (board radii)', 'Shipped 4.8.'],
    ['World', 'moteCount', 6, 60, 1, 'Motes on the board', 'Shipped 26.'],
    ['World', 'moteCluster', 1, 10, 1, 'Cluster size', 'Shipped 4.'],
    ['World', 'moteSpread', 6, 40, 1, 'Cluster spread (u)', 'Shipped 18.'],
    ['World', 'growth', 1, 3, 0.1, 'Growth per mote', 'Shipped 2. In B the exponent counts the whole haul, so this is the haul\'s balance knob too.'],
    ['Sling', 'slingRope', 15, 120, 1, 'Rope length (u)', 'Shipped 42.'],
    ['Sling', 'slingStiffness', 60, 600, 10, 'Rope stiffness (1/s²)', 'Shipped 260.'],
    ['Sling', 'slingDamping', 0, 20, 0.5, 'Rope damping (1/s)', 'Shipped 5.'],
    ['Sling', 'slingDrag', 0, 2, 0.05, 'Drag on the rope (1/s)', 'Shipped 0.35.'],
    ['Sling', 'slingFreeDrag', 0, 4, 0.05, 'Drag after letting go (1/s)', 'Shipped 0.9.'],
    ['Sling', 'slingMaxSpeed', 200, 800, 10, 'Top speed (u/s)', 'Shipped 364.'],
  ];

  const LS = 'lab:wrasse-haul:';
  const lsGet = (k, d) => { try { const v = localStorage.getItem(LS + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) { /* private window */ } };
  const P = Object.assign({}, SHIPPED, lsGet('P', {}));
  for (const k of Object.keys(P)) if (!(k in SHIPPED)) delete P[k];

  // ================= constants of the shipped core (KiteNavigatorCore.cs) =================
  const TAIL_STEP = 2.5, RIM = 0.96, SKIP_NEWEST = 3;
  const BLAST_SECONDS = 3;          // AOEExplosion.prefab: 3 s sin ease
  const REF_MM_PER_U = 0.18;        // lab: a 160 u board radius drawn 29 mm on a phone held upright (the lasso lab's thumb)
  const DT = 1 / 60;
  const ELEMS = ['Charge', 'Mass', 'Space', 'Time'];
  const LIME_E = ['#a0ff00', '#5ec600', '#40ff00', '#9bcf00']; // GENERATED by Tools/Build/kite_mote_colors.py (the lasso lab's copy): the game's four limes
  const ECOL = ['#7fb8ff', '#f2b45a', '#c08cff', '#5fe0d4'];   // lab colours per element (a reading aid)
  const CH = 0, MA = 1, SP = 2, TI = 3;
  const SCORE_SECS = 180;

  // ================= seeded RNG =================
  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const gauss = (r) => { let u = 0, v = 0; while (u === 0) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const hyp = Math.hypot, clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const wrapA = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
  const grow = (base, n, cap) => Math.min(cap, base * Math.pow(P.growth, n - 1));
  const sum4 = (c) => c[0] + c[1] + c[2] + c[3];
  // value: growth^(n-1), the lasso lab's unit, but never past what the element's own cap lets the game deliver
  const VALUE_CAP = () => [P.chargeCap / P.chargePetals, P.massPrismCap / P.massPrisms, P.spaceMaxScaleCap / P.spaceMaxScale, P.timeBoostCap / P.timeBoostSeconds];
  const valueOf = (e, n, mult) => Math.min(VALUE_CAP()[e], Math.pow(P.growth, n - 1) * (mult || 1));

  // ================= (3) THE MODEL =================
  // Board units (u): x right, y forward (up the screen), the Grouper at the board's centre. simStep never draws and
  // never reads a device: the thumb arrives as {x, y, down}, from a person or from an AI pilot.
  let seed = 7;
  const live = { A: null, B: null };

  function newWorld(s, variant, pilot) {
    const R = P.boardRadius;
    const W = {
      t: 0, seed: s >>> 0, variant, pilot, rngW: mulberry32(s * 2654435761 >>> 0), rngA: mulberry32((s ^ 0x9e3779b9) >>> 0),
      kite: { x: 0, y: -0.35 * R, vx: 0, vy: 0 }, tail: [], motes: [], shoals: [], prisms: [], friendly: [], blasts: [], throws: [], fx: [],
      features: [], allies: [], hull: { silence: 0 }, haul: { c: [0, 0, 0, 0], x: 0, y: -0.35 * R, age: 0 },
      docked: false, undockT: -9, dockHand: null, rope: { pax: 0, pay: 0, taut: false, on: false, ax: 0, ay: 0 },
      finger: { x: 0, y: -2 * R, down: false }, prevDown: false, charge: 0, nextId: 1, headless: false,
      st: { loops: 0, fizzles: 0, empty: 0, motes: 0, value: 0, travel: 0, boosts: 0, mass: 0, popped: 0, blasted: 0, stolen: 0, throws: 0, onTarget: 0, haulSum: 0, haulMax: 0, spills: 0, spillWhy: {}, cleaned: 0, restT: 0, dockT: 0, curve: [] },
      ai: { thinkT: 0, goal: null, jx: 0, jy: 0, sense: 1, mode: 'hunt', modeT: 0, restUntil: 0, launch: null, haulTarget: 6, throwC: null, loopsSeen: 0 },
    };
    const r = W.rngW;
    // the same world opens both variants: rival, allies, features and prisms first, from the same seed
    W.rival = { x: 0.2 * R, y: 0.55 * R, vx: 0, vy: 0, tx: 0, ty: 0.5 * R, retarget: 0, lastSteal: -9, lastHit: -9, flash: -9 };
    for (let i = 0; i < 2; i++) W.allies.push({ a: i * Math.PI + 0.6, r: 0.55 * R, silence: 0, flash: -9, cleanFx: -9 });
    for (let i = 0; i < 3; i++) W.features.push(newFeature(W, true));
    while (W.prisms.length < P.labPrisms) spawnPrism(W, true);
    fillMotes(W, true);
    void r;
    return W;
  }
  function newFeature(W, anywhere) {
    const r = W.rngW, R = P.boardRadius;
    return { x: (r() * 2 - 1) * R * 0.7, y: anywhere ? (r() * 2 - 1) * R * 0.8 : R * (1.1 + r() * 0.6), e: Math.floor(r() * 4) % 4, kind: r() < 0.6 ? 'flora' : 'crystal' };
  }
  function spawnPrism(W, anywhere) {
    const r = W.rngW, R = P.boardRadius;
    W.prisms.push({ x: (r() * 2 - 1) * R, y: anywhere ? (r() * 2 - 1) * R : R * (1.0 + r() * 0.5), a: r() * Math.PI, dead: false, danger: r() < P.labDanger });
  }
  const inDisc = (x, y, f) => x * x + y * y <= (P.boardRadius * (f || 1)) ** 2;

  // ---- motes. A: the lasso lab's even spawner. B: shoals ----
  function spawnCluster(W, anywhere) {
    const r = W.rngW, R = P.boardRadius, e = Math.floor(r() * 4) % 4, n = Math.max(1, Math.round(P.moteCluster * (0.5 + r())));
    const cx = (r() * 2 - 1) * R * 0.8, cy = anywhere ? (r() * 2 - 1) * R * 0.85 : R * (0.95 + r() * 0.45);
    for (let i = 0; i < n; i++) W.motes.push({ id: W.nextId++, e, x: cx + gauss(r) * P.moteSpread, y: cy + gauss(r) * P.moteSpread, dead: false, sh: null });
  }
  function spawnShoal(W, anywhere, at) {
    const r = W.rngW, R = P.boardRadius;
    let e = Math.floor(r() * 4) % 4, cx = (r() * 2 - 1) * R * 0.8, cy = anywhere ? (r() * 2 - 1) * R * 0.85 : R * (0.95 + r() * 0.45);
    if (at) { e = at.e; cx = at.x; cy = at.y; }
    else if (r() < P.shFeatureShare) {
      const cand = W.features.filter((f) => anywhere ? inDisc(f.x, f.y, 1.1) : f.y > 0.3 * R);
      if (cand.length) { const f = cand[Math.floor(r() * cand.length) % cand.length]; e = f.e; const a = r() * 2 * Math.PI, d = 18 + r() * 26; cx = f.x + Math.cos(a) * d; cy = f.y + Math.sin(a) * d; }
    }
    let n = at ? at.n : Math.max(1, Math.round(P.moteCluster * (0.5 + r())));
    if (!at && e === MA) n = Math.round(n * P.shMassSize);
    const spread = at ? 20 : P.moteSpread * (e === MA ? 0.9 : 1);
    const sh = { e, cx, cy, vx: 0, vy: 0, wa: r() * 2 * Math.PI, scatter: 0, cool: 0, blinkT: P.shSpaceBlink * (0.5 + r()), members: 0, loose: !!at };
    W.shoals.push(sh);
    for (let i = 0; i < n; i++) { W.motes.push({ id: W.nextId++, e, ox: gauss(r) * spread, oy: gauss(r) * spread, x: cx, y: cy, dead: false, sh }); sh.members++; }
    placeMembers(sh, W);
    return sh;
  }
  function placeMembers(sh, W) { const s = 1 + 0.7 * sh.scatter; for (const m of W.motes) if (m.sh === sh) { m.x = sh.cx + m.ox * s; m.y = sh.cy + m.oy * s; } }
  function fillMotes(W, anywhere) {
    let guard = 0;
    while (W.motes.length < P.moteCount && guard++ < 40) { if (W.variant === 'A') spawnCluster(W, anywhere || P.labFlow <= 0); else spawnShoal(W, anywhere || P.labFlow <= 0); }
  }
  function stepShoals(W, dt) {
    const k = W.kite, R = P.boardRadius, flow = P.labFlow, r = W.rngW;
    for (const sh of W.shoals) {
      if (sh.members <= 0) continue;
      const dx = sh.cx - k.x, dy = sh.cy - k.y, dk = hyp(dx, dy) || 1, ax = dx / dk, ay = dy / dk;
      sh.wa += (r() - 0.5) * 1.2 * dt;
      let tvx = Math.cos(sh.wa), tvy = Math.sin(sh.wa), relax = 1.5;
      if (sh.e === TI) {
        sh.cool -= dt;
        if (dk < P.shTimeSense && sh.cool <= 0 && !W.docked) { sh.vx = ax * P.shTimeDart; sh.vy = ay * P.shTimeDart; sh.scatter = 1; sh.cool = 0.9; pushFx(W, { kind: 'dart', x: sh.cx, y: sh.cy, e: TI }); }
        tvx *= 14; tvy *= 14; relax = 1.8;
      } else if (sh.e === MA) {
        tvx *= P.shMassDrift; tvy *= P.shMassDrift; relax = 0.8;
        let best = null, bd = 130; for (const o of W.shoals) if (o !== sh && o.e === MA && o.members > 0) { const d = hyp(o.cx - sh.cx, o.cy - sh.cy); if (d < bd) { bd = d; best = o; } }
        if (best && bd > 30) { tvx += (best.cx - sh.cx) / bd * 4; tvy += (best.cy - sh.cy) / bd * 4; }
      } else if (sh.e === SP) {
        tvx *= 8; tvy *= 8;
        sh.blinkT -= dt;
        if (sh.blinkT <= 0) { const a = r() * 2 * Math.PI; pushFx(W, { kind: 'hop', x: sh.cx, y: sh.cy, e: SP }); sh.cx += Math.cos(a) * P.shSpaceHop; sh.cy += Math.sin(a) * P.shSpaceHop; sh.blinkT = P.shSpaceBlink * (0.8 + 0.4 * r()); }
      } else {
        if (dk < P.shChargeSense && !W.docked) { tvx = ax * P.shChargeShy; tvy = ay * P.shChargeShy; relax = 4; }
        else { const v = W.rival, d = hyp(v.x - sh.cx, v.y - sh.cy) || 1; tvx = (v.x - sh.cx) / d * P.shChargeLure; tvy = (v.y - sh.cy) / d * P.shChargeLure; }
      }
      const a = 1 - Math.exp(-relax * dt); sh.vx += (tvx - sh.vx) * a; sh.vy += (tvy - sh.vy) * a;
      sh.cx += sh.vx * dt; sh.cy += (sh.vy - flow) * dt;
      if (Math.abs(sh.cx) > R * 0.92) { sh.cx = Math.sign(sh.cx) * R * 0.92; sh.vx *= -0.5; sh.wa = Math.PI - sh.wa; }
      sh.scatter = Math.max(0, sh.scatter - 1.2 * dt);
      placeMembers(sh, W);
    }
    W.shoals = W.shoals.filter((s) => s.members > 0);
  }

  // ---- the shipped tail (KiteNavigatorCore.AdvanceTail), the lasso lab's copy ----
  function segX(a, b, c, d) {
    const r0 = b.x - a.x, r1 = b.y - a.y, s0 = d.x - c.x, s1 = d.y - c.y, den = r0 * s1 - r1 * s0;
    if (Math.abs(den) < 1e-9) return null;
    const t = ((c.x - a.x) * s1 - (c.y - a.y) * s0) / den, u = ((c.x - a.x) * r1 - (c.y - a.y) * r0) / den;
    if (!(t > 0 && t <= 1 && u >= 0 && u <= 1)) return null;
    return { x: a.x + r0 * t, y: a.y + r1 * t };
  }
  function advanceTail(W) {
    const T = W.tail, q = { x: W.kite.x, y: W.kite.y }, n = T.length;
    if (n > 0) { const l = T[n - 1]; if ((q.x - l.x) ** 2 + (q.y - l.y) ** 2 <= TAIL_STEP * TAIL_STEP) return null; }
    let loop = null;
    if (n >= 3) {
      const a = T[n - 1];
      for (let i = 0; i < n - SKIP_NEWEST; i++) { const x = segX(a, q, T[i], T[i + 1]); if (x) { loop = [x].concat(T.slice(i + 1), [q]); break; } }
    }
    if (loop) { T.length = 0; T.push(q); } else T.push(q);
    const limit = P.tailLength * P.boardRadius; let total = 0;
    for (let i = T.length - 1; i > 0; i--) { total += hyp(T[i].x - T[i - 1].x, T[i].y - T[i - 1].y); if (total > limit) { T.splice(0, i); break; } }
    return loop;
  }
  function pip(x, y, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const a = poly[i], b = poly[j]; if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y + 1e-9) + a.x) inside = !inside; }
    return inside;
  }
  // KiteNavigatorCore.ResolveLoop
  function resolveLoop(c, rule) {
    const total = sum4(c); if (total <= 0) return null;
    const kinds = c.filter((v) => v > 0).length; let best = 0;
    for (let i = 1; i < 4; i++) if (c[i] > c[best]) best = i;
    let n = c[best];
    if (kinds > 1) { if (rule !== 1) return { fizzle: true }; n = c[best] - (total - c[best]); if (n < 1) return { fizzle: true }; }
    return { e: best, n };
  }
  const allyPos = (W, al) => ({ x: Math.cos(al.a) * al.r, y: Math.sin(al.a) * al.r });

  function closeLoop(W, poly) {
    const c = [0, 0, 0, 0], inside = [];
    for (const m of W.motes) if (!m.dead && pip(m.x, m.y, poly)) { c[m.e]++; inside.push(m); }
    let cx = 0, cy = 0; for (const p of poly) { cx += p.x; cy += p.y; } cx /= poly.length; cy /= poly.length;
    // B: a loop round an ally's shadow cleans its silence, whatever else it holds
    if (W.variant === 'B') for (const al of W.allies) { const p = allyPos(W, al); if (al.silence > 0 && pip(p.x, p.y, poly)) { const d = Math.min(al.silence, P.hlAllyClean); al.silence -= d; W.st.cleaned += d; al.cleanFx = W.t; pushFx(W, { kind: 'clean', x: p.x, y: p.y, text: '-' + d.toFixed(1) + ' s silence' }); } }
    const res = resolveLoop(c, Math.round(P.mixedLoops));
    if (!res) { W.st.empty++; return; }
    for (const m of inside) { m.dead = true; if (m.sh) m.sh.members--; }
    if (res.fizzle) { W.st.fizzles++; pushFx(W, { kind: 'fizzle', poly, x: cx, y: cy }); return; }
    const e = res.e, n = res.n;
    W.st.loops++; W.st.motes += n;
    if (W.variant === 'A') {   // the shipped Wrasse: the loop fires on close
      W.st.value += valueOf(e, n, 1);
      let text = ELEMS[e] + ' x' + n;
      if (e === SP) { const R = 0.5 * grow(P.spaceMaxScale, n, P.spaceMaxScaleCap); W.blasts.push({ x: cx, y: cy, R, t0: W.t, r: 0 }); text = 'Blast ' + Math.round(R * 2) + ' u'; }
      else if (e === MA) { const k = Math.round(grow(P.massPrisms, n, P.massPrismCap)); W.st.mass += k; layFriendly(W, cx, cy, k); text = '+' + k + ' prisms'; }
      else if (e === CH) { W.charge = Math.min(P.chargeCap, W.charge + grow(P.chargePetals, n, P.chargeCap)); text = 'Charge ' + Math.round(W.charge); }
      else { const k = Math.round(grow(1, n, P.timeBoostCap / P.timeBoostSeconds)); W.st.boosts += k; text = '+' + k + ' boost' + (k > 1 ? 's' : ''); }
      pushFx(W, { kind: 'loop', poly, x: cx, y: cy, e, n, text });
    } else {                  // B: the loop cinches into the haul
      const h = W.haul; h.c[e] += n; h.age = 0;
      const tot = sum4(h.c); if (tot > W.st.haulMax) W.st.haulMax = tot;
      pushFx(W, { kind: 'cinch', poly, x: cx, y: cy, e, n, tx: h.x, ty: h.y, text: 'haul ' + tot + (h.c.filter((v) => v > 0).length > 1 ? ' braided' : '') });
    }
    if (isLive(W) && W.pilot === 'you') buzz(n);
  }
  function layFriendly(W, x, y, k) {
    const r = W.rngW, rad = Math.sqrt(k) * 2.4;
    for (let i = 0; i < Math.min(k, 240); i++) { const a = r() * 2 * Math.PI, d = Math.sqrt(r()) * rad; W.friendly.push({ x: x + Math.cos(a) * d, y: y + Math.sin(a) * d, a: r() * Math.PI, t0: W.t }); }
    if (W.friendly.length > 600) W.friendly.splice(0, W.friendly.length - 600);
  }
  function pushFx(W, f) { if (W.headless) return; f.t0 = W.t; W.fx.push(f); if (W.fx.length > 30) W.fx.shift(); }

  // ---- the Sling (KiteNavigatorCore.Sling, the lasso lab's stepKite 'sling' + ropeForce + rimBounce) ----
  function capSpeed(k, max) { const s = hyp(k.vx, k.vy); if (s > max) { k.vx *= max / s; k.vy *= max / s; } }
  function ropeForce(W, k, ax, ay, rest, stiff, damp, dt, mass) {
    const r = W.rope, dx = k.x - ax, dy = k.y - ay, d = hyp(dx, dy);
    const avx = (ax - r.pax) / dt, avy = (ay - r.pay) / dt; r.pax = ax; r.pay = ay;
    if (d <= rest || d < 1e-6) return false;
    const nx = dx / d, ny = dy / d, vr = (k.vx - avx) * nx + (k.vy - avy) * ny;
    const a = (stiff * (d - rest) + damp * vr) / mass;   // B: a heavier haul answers the same pull more slowly (mass 1 = shipped)
    k.vx -= nx * a * dt; k.vy -= ny * a * dt;
    return true;
  }
  function rimBounce(k) {
    const R = P.boardRadius * RIM, d = hyp(k.x, k.y);
    if (d <= R) return;
    const nx = k.x / d, ny = k.y / d; k.x = nx * R; k.y = ny * R;
    const vn = k.vx * nx + k.vy * ny; if (vn > 0) { k.vx -= 1.4 * vn * nx; k.vy -= 1.4 * vn * ny; }
  }
  function stepSling(W, inp, dt, edgeDown) {
    const k = W.kite, r = W.rope, down = !!inp.down, N = W.variant === 'B' ? sum4(W.haul.c) : 0;
    const mass = 1 + P.hlMassPerMote * N, extraDrag = P.hlDragPerMote * N;
    if (edgeDown) { r.pax = inp.x; r.pay = inp.y; }
    r.on = down; r.ax = inp.x; r.ay = inp.y;
    if (down) { r.taut = ropeForce(W, k, inp.x, inp.y, P.slingRope, P.slingStiffness, P.slingDamping, dt, mass); const c = Math.exp(-(P.slingDrag + extraDrag) * dt); k.vx *= c; k.vy *= c; }
    else { r.taut = false; const c = Math.exp(-P.slingFreeDrag * dt); k.vx *= c; k.vy *= c; }
    capSpeed(k, P.slingMaxSpeed); k.x += k.vx * dt; k.y += k.vy * dt; rimBounce(k);
  }

  // ---- B: the throw, the haul's ride, spills, the dock ----
  function tryThrow(W) {
    const h = W.haul, k = W.kite, sp = hyp(k.vx, k.vy), c = h.c, thrown = c[MA] + c[SP] + c[TI];
    if (!thrown || sp < P.hlThrowSpeed) return false;
    const omni = c[0] > 0 && c[1] > 0 && c[2] > 0 && c[3] > 0;
    const pc = [omni ? c[CH] : 0, c[MA], c[SP], c[TI]];
    W.throws.push({ x: h.x, y: h.y, vx: k.vx * P.hlThrowGain, vy: k.vy * P.hlThrowGain, c: pc, omni, t0: W.t, trail: [], hitTime: false, hitCharge: false });
    W.st.throws++; W.st.haulSum += sum4(pc);
    h.c = [omni ? 0 : c[CH], 0, 0, 0];
    pushFx(W, { kind: 'throw', x: h.x, y: h.y, text: omni ? 'OMNI sling' : 'sling' });
    if (isLive(W) && W.pilot === 'you') buzz(3);
    return true;
  }
  function deliver(W, e, n, mult) { W.st.value += valueOf(e, n, mult); }
  function stepThrows(W, dt) {
    const flow = P.labFlow, R = P.boardRadius, v = W.rival;
    for (const th of W.throws) {
      const c = Math.exp(-P.hlThrowDrag * dt); th.vx *= c; th.vy *= c;
      th.x += th.vx * dt; th.y += (th.vy - flow) * dt;
      if (!W.headless) { th.trail.push({ x: th.x, y: th.y }); if (th.trail.length > 18) th.trail.shift(); }
      const mult = th.omni ? P.hlOmni : 1;
      if (th.c[TI] > 0 && !th.hitTime && hyp(th.x, th.y) < P.hlHullCatch) {   // the Grouper catches a Time haul
        const kk = Math.round(Math.min(P.timeBoostCap / P.timeBoostSeconds, grow(1, th.c[TI], 1e9) * mult)); W.st.boosts += kk; deliver(W, TI, th.c[TI], mult);
        th.hitTime = true; th.onT = true; pushFx(W, { kind: 'catch', x: 0, y: 0, text: '+' + kk + ' boosts' });
      }
      if (th.c[CH] > 0 && !th.hitCharge && hyp(th.x - v.x, th.y - v.y) < 30) { ram(W, th.c[CH], mult); th.hitCharge = true; th.onT = true; }
      const sp = hyp(th.vx, th.vy);
      if (sp < 70 || W.t - th.t0 > 1.4 || !inDisc(th.x, th.y, 1.05)) land(W, th);
    }
    W.throws = W.throws.filter((th) => !th.done);
  }
  function land(W, th) {
    th.done = true;
    const mult = th.omni ? P.hlOmni : 1, v = W.rival;
    let on = !!th.onT;
    if (th.c[SP] > 0) {
      const Rb = 0.5 * Math.min(P.spaceMaxScaleCap, grow(P.spaceMaxScale, th.c[SP], 1e9) * mult);
      W.blasts.push({ x: th.x, y: th.y, R: Rb, t0: W.t, r: 0 });
      const hits = W.prisms.filter((p) => !p.dead && hyp(p.x - th.x, p.y - th.y) < Rb).length;
      if (hits >= 4) on = true;
      deliver(W, SP, th.c[SP], mult);
    }
    if (th.c[MA] > 0) {
      const k = Math.round(Math.min(P.massPrismCap, grow(P.massPrisms, th.c[MA], 1e9) * mult)); W.st.mass += k; layFriendly(W, th.x, th.y, k);
      const near = hyp(th.x - v.x, th.y - v.y) < 60 || W.allies.some((al) => { const p = allyPos(W, al); return hyp(th.x - p.x, th.y - p.y) < 60; });
      if (near) on = true;
      deliver(W, MA, th.c[MA], mult);
      pushFx(W, { kind: 'text', x: th.x, y: th.y, text: '+' + k + ' prisms' });
    }
    if (th.c[TI] > 0 && !th.hitTime) spawnShoal(W, false, { e: TI, n: th.c[TI], x: th.x, y: th.y });   // a missed Time haul is a loose shoal again
    if (th.c[CH] > 0 && !th.hitCharge) spawnShoal(W, false, { e: CH, n: th.c[CH], x: th.x, y: th.y });
    if (on) W.st.onTarget++;
    pushFx(W, { kind: 'land', x: th.x, y: th.y, on });
  }
  function ram(W, n, mult) {
    const v = W.rival;
    if (W.t - v.lastSteal < P.stealCooldown) return false;
    const got = Math.round(Math.min(P.chargeCap, grow(P.chargePetals, n, 1e9) * (mult || 1)));

    const smooth = (arr) => arr.map((_, i) => { let t = 0, n = 0; for (let j = Math.max(0, i - 2); j <= Math.min(arr.length - 1, i + 2); j++) { t += arr[j]; n++; } return t / n; });   // a 5 s average: the arc, not the jitter
    for (const [arr, col] of [[lastCurves.A, colA], [lastCurves.B, colB]]) { c2.strokeStyle = col; c2.lineWidth = 2; c2.beginPath(); smooth(arr).forEach((v, i) => i ? c2.lineTo(X(i), Y(v)) : c2.moveTo(X(i), Y(v))); c2.stroke(); }
    const still = (arr) => arr.filter((v) => v < 10).length;
    box.querySelector('#curveNote').textContent = 'Seconds with the thumb nearly still (under 10 mm): A ' + still(lastCurves.A) + ', B ' + still(lastCurves.B) + ' of ' + n + '. A flat line is the same work every second; valleys are rests.';
  }

  // the decision log: shared in the artifact's db, readable by Claude; this browser otherwise
  let db = null, me = '', remote = [], localLog = lsGet('log', []);
  function snapshot() { return { round: LAB.round, seed, variant: OPT.variant, changed: diffOnly() }; }
  async function record(topic, choice, note) {
    const doc = { topic, choice, note: note || '', createdAt: Date.now(), by: me, settings: snapshot() };
    if (db) { try { await db.collection('decisions').add(doc); return 'shared'; } catch (e) { /* fall through */ } }
    localLog.push(doc); lsSet('log', localLog); return 'local';
  }
  const TOPICS = ['A or B for the Wrasse', 'Haul: loops wait for the throw', 'Throw on a fast lift', 'Shoals that move like their element', 'Dock and cleaning silence', 'Something else'];
  function currentChoice(topic) {
    const d = diffOnly(), set = Object.keys(d).length ? ' Settings: ' + JSON.stringify(d) : ' Lab defaults.';
    if (topic === 'A or B for the Wrasse') return (OPT.variant === 'B' ? 'B, the haul' : 'A, keep the shipped Wrasse') + '.' + set;
    return topic + ': keep / change / drop.' + set;
  }
  function logPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="note" id="logStatus"></p><p><select id="logTopic" aria-label="Topic"></select></p><textarea id="logChoice" rows="3" aria-label="Your decision"></textarea><p><button class="btn primary" id="logSave">Record decision</button> <button class="btn" id="logCopy">Copy log</button></p><div class="tablewrap"><table id="logTable"></table></div>';
    const status = box.querySelector('#logStatus'), sel = box.querySelector('#logTopic'), ta = box.querySelector('#logChoice');
    for (const t of TOPICS) { const o = document.createElement('option'); o.textContent = t; sel.appendChild(o); }
    sel.onchange = () => { ta.value = currentChoice(sel.value); }; ta.value = currentChoice(TOPICS[0]);
    status.textContent = db ? 'Shared log: saved with the lab, read by Claude at the start of the next round.' : 'Kept in this browser. Copy the log to send it.';
    status.className = 'note ' + (db ? 'status-ok' : 'status-warn');
    box.querySelector('#logSave').onclick = async () => { const where = await record(sel.value, ta.value); status.textContent = where === 'shared' ? 'Recorded in the shared log.' : 'Recorded in this browser.'; renderLog(box); };
    box.querySelector('#logCopy').onclick = () => {
      const txt = remote.concat(localLog).map((d) => new Date(d.createdAt).toISOString() + ' · ' + d.topic + ': ' + d.choice + ' ' + JSON.stringify(d.settings)).join('\n');
      try { navigator.clipboard.writeText(txt).then(() => { status.textContent = 'Copied.'; }, () => { ta.value = txt; ta.select(); }); } catch (e) { ta.value = txt; ta.select(); }
    };
    renderLog(box);
    return box;
  }
  function renderLog(box) {
    const t = (box || document).querySelector('#logTable'); if (!t) return;
    const rows = remote.concat(localLog).sort((a, b) => b.createdAt - a.createdAt).slice(0, 50);
    t.replaceChildren(); const hr = document.createElement('tr'); for (const h of ['When', 'Topic', 'Decision']) { const th = document.createElement('th'); th.textContent = h; hr.appendChild(th); } t.appendChild(hr);
    for (const d of rows) { const tr = document.createElement('tr'); for (const v of [new Date(d.createdAt).toLocaleString(), d.topic, d.choice]) { const td = document.createElement('td'); td.textContent = v; td.style.whiteSpace = 'normal'; tr.appendChild(td); } t.appendChild(tr); }
  }
  (async function connect() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try { db = await c.use('db'); } catch (e) { db = null; }
    try { const u = await c.use('user'); if (u) me = (await u.id()) || ''; } catch (e) { me = ''; }
    if (!db) return;
    if (curBottom === 'Decisions') showBottom('Decisions');
    try { db.collection('decisions').orderBy('createdAt', 'desc').limit(300).onSnapshot((snap) => { remote = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderLog(); }, () => { db = null; }); } catch (e) { db = null; }
  })();
  function aboutPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p id="aboutHead"></p>' +
      '<p><b>The question.</b> Garrett: the Wrasse has three fun things to do (attack vessels, pop prisms, lasso elements), but the constant looping gets very repetitive. Does the concept (B: Hunt, Haul, Sling, Clean) give the seat a peak and a valley the shipped kite (A) does not have, while staying one thumb and portrait?</p>' +
      '<p><b>Shipped, in both:</b> the Sling (KiteNavigatorCore.Sling, the lasso lab\'s copy line for line), the tail and the loop rule (a crossing closes a loop; one element fires base x 2^(n-1); a mixed loop fizzles) and every effect number from KiteNavigatorConfig.asset.</p>' +
      '<p><b>Not modelled:</b> the 3D world. Motes, prisms, the rival and the allies live only on the board; the world features that shoals gather round are a stand-in for the flora and crystals the hull\'s plane cuts. The board is the round 6 disc, not the round 7 whole-screen rectangle. The pilot\'s turns (the board never rotates; the world flows down at a steady speed). Silence is a stand-in: a timer the rival adds to, not SILENCE.md\'s scored-hit worth. The real AOEExplosion, Mass cluster and boost (a ring, a count and a dot). Rival hulls that fight the kite back, Wrasse Run\'s rings, the HUD, sound, network play, the two-seat swap. The thumb figures assume a 57 mm board. The AI pilots are lab heuristics, so each variant\'s score is partly a score of its pilot, and B\'s rest share is set by its pilot\'s choice to dock.</p>';
    box.querySelector('#aboutHead').textContent = LAB.name + ' · round ' + LAB.round + ' · ' + LAB.branch + ' · write-up ' + LAB.doc;
    return box;
  }
  const BOTTOM = { Scorecard: scorecardPanel, Decisions: logPanel, About: aboutPanel };
  let curBottom = lsGet('bottom', 'Scorecard'); if (!BOTTOM[curBottom]) curBottom = 'Scorecard';
  function showBottom(name) { curBottom = name; lsSet('bottom', name); for (const b of $('bottomTabs').children) b.setAttribute('aria-selected', String(b.dataset.name === name)); $('bottomBody').replaceChildren(BOTTOM[name]()); }
  for (const n of Object.keys(BOTTOM)) { const b = document.createElement('button'); b.textContent = n; b.dataset.name = n; b.setAttribute('role', 'tab'); b.onclick = () => showBottom(n); $('bottomTabs').appendChild(b); }

  $('meta').textContent = 'round ' + LAB.round;
  let paused = false;
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
  $('restart').onclick = () => reset();
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); lsSet('P', {}); for (const k in outputs) outputs[k].inp.value = P[k]; reset(); refreshDiff(); };
  $('panelBtn').onclick = () => { document.body.classList.add('sheet'); paused = true; $('pause').textContent = 'Resume'; };
  $('sheetClose').onclick = () => { document.body.classList.remove('sheet'); paused = false; $('pause').textContent = 'Pause'; };

  // ================= sizing + fixed-step loop (manual clock for recorders) =================
  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const cw = Math.max(1, Math.round(r.width * dpr)), ch = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; } }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now(), acc = 0;
  function step(dt) {
    // a person drives the world they see; an AI flies both, so A and B stay side by side in time
    if (OPT.pilot === 'you') { const W = cur(); simStepW(W, humanInput(), dt); }
    else for (const v of ['A', 'B']) { const W = live[v]; simStepW(W, aiInput(W, dt), dt); }
  }
  function frame(now) {
    const el = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) {
      resize();
      if (!paused) { acc += el; let n = 0; while (acc >= DT && n < 6) { step(DT); acc -= DT; n++; } if (n === 6) acc = 0; }
      render();
    }
    requestAnimationFrame(frame);
  }
  syncHeader(); showDock(DOCK.includes(curDock) ? curDock : 'Concept'); showBottom(curBottom);
  reset(); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  // ================= the test surface =================
  window.__lab = window.__wrasseHaul = {
    LAB, SHIPPED, SPEC, P, PLATFORM, OPT,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { dt = dt || DT; n = n || 1; for (let i = 0; i < n; i++) step(dt); resize(); render(); },
    reset, runBatch, runOne: (v, p, s, secs) => { const W = runOne(v, p, s, secs); return { st: W.st, t: W.t }; }, curve, selfTest, setParam, record,
    world: (v) => live[v || OPT.variant],   // read it, never write it
    score: () => { const W = cur(); return { variant: W.variant, value: +W.st.value.toFixed(2), loops: W.st.loops, fizzles: W.st.fizzles, throws: W.st.throws, spills: W.st.spills, cleaned: +W.st.cleaned.toFixed(2), thumbU: +W.st.travel.toFixed(1), t: +W.t.toFixed(3) }; },
    state: () => { const W = cur(); return { t: W.t, seed, variant: W.variant, pilot: W.pilot, kite: Object.assign({}, W.kite), haul: W.haul.c.slice(), docked: W.docked, motes: W.motes.length, silence: W.hull.silence }; },
    use(variant, pilot, split) { if (variant) OPT.variant = variant; if (pilot) OPT.pilot = pilot; if (split != null) OPT.split = !!split; syncHeader(); reset(); },
  };
})();
</script>
