<!doctype html>
<!--
  Honeyguide Lab (round 2) - a /labmaker browser studio for the Honeyguide and Ratel, the two-seat crew vessel built
  from Slipstream (Garrett's 2019-22 tabletop game). The Ratel (Engineer seat) plays a hex pattern-building puzzle, the
  Dynamo; making a pattern pulls one prism into the battery (its domain is a slip charge) and gives the Honeyguide
  (Pilot seat) a passive upgrade. The Slip is the pilot's Time ability: touching a 1-D trail of a held domain with the
  nose near its axis teleports the hull to the end of that trail it points at. Round 1 is HoneyguideLab.round1.html.
  Source of truth: this file. Write-up: Docs/Studios/HONEYGUIDE_LAB.md. The script block id="dynamo-core" is the
  engine-free core; DynamoCore.cs is still the round 1 port (parity.cjs holds it to HoneyguideLab.round1.html). Verify: node .claude/skills/labmaker/verify_lab.cjs <this file>
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Honeyguide Lab</title>
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --ink: #172028; --muted: #59646f; --line: #d8dee4;
    --accent: #b97a00; --warn: #b4560b; --ok: #1f7a43; --changed: #0b7f99;
    --f-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1216; --panel: #141b21; --ink: #e4eaef; --muted: #93a0ab; --line: #26313a;
      --accent: #ffb21f; --warn: #f0a050; --ok: #5cc98a; --changed: #6cc8e0; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1216; --panel: #141b21; --ink: #e4eaef; --muted: #93a0ab; --line: #26313a;
    --accent: #ffb21f; --warn: #f0a050; --ok: #5cc98a; --changed: #6cc8e0; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--f-ui); overflow: hidden; }
  #app { display: grid; height: 100%; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr) 220px; grid-template-areas: "head head" "stage dock" "bottom dock"; }
  header { grid-area: head; display: flex; gap: 8px 10px; align-items: center; padding: 7px max(16px, env(safe-area-inset-right, 0px)) 7px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; }
  header .meta { color: var(--muted); }
  header .spacer { flex: 1; }
  #diff { color: var(--changed); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-right: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 4px 10px; font: inherit; cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #111; }
  #stageWrap { grid-area: stage; position: relative; min-height: 0; background: #04070a; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage { width: 100%; height: 100%; display: block; }
  #toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: rgba(10,20,26,.92); color: #fff6e0; border: 1px solid #ffa700; border-radius: 6px; padding: 5px 12px; font: 12px var(--f-mono); pointer-events: none; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
  #dock { grid-area: dock; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px 16px 16px; }
  #bottom { grid-area: bottom; border-top: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px 16px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }

  .tabs button[aria-selected="true"], .btn.primary { background: var(--accent); color: #111; border-color: var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  textarea, select, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  ul.plain { margin: 4px 0; padding-left: 18px; }

  .card { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin: 6px 0; }
  .card b { display: block; }

  @media (max-width: 900px) {
    body { overflow: auto; }
    #app { display: block; height: auto; }
    #stageWrap { height: 86vh; height: var(--stageH, 86svh); min-height: 520px; }
    header { gap: 6px; padding-top: 5px; padding-bottom: 5px; }
    header h1 { font-size: 14px; }
    header .btn, .seg button { padding: 3px 8px; }
    #dock, #bottom { border: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    header .meta#platform { display: none; }

<body>
<div id="app">
  <header>
    <h1 id="title"></h1>
    <span class="meta" id="meta"></span>
    <span id="diff"></span>
    <span class="spacer"></span>
    <span class="seg" id="seatSeg" role="group" aria-label="Your seat">
      <button data-you="eng" title="You play the Ratel (the Engineer's Dynamo); an AI flies">Engineer</button><button data-you="fly" title="You fly the Honeyguide; an AI plays the Dynamo">Fly</button><button data-you="watch" title="Two AIs">Watch</button><button data-you="couch" title="Two people: keyboard flies, mouse or touch plays the Dynamo">Couch</button>
    </span>
    <button class="btn" id="swapBtn" title="Swap seats with your squad mate (D-pad left/right, 1 / 2, or double-tap the small view)">Swap</button>

  </header>
  <div id="stageWrap"><canvas id="stage"></canvas><div id="toast" hidden></div></div>
  <aside id="dock"><div class="tabs" id="dockTabs" role="tablist"></div><div id="dockBody"></div></aside>
  <section id="bottom"><div class="tabs" id="bottomTabs" role="tablist"></div><div id="bottomBody"></div></section>
</div>
<script id="dynamo-core">
/* DynamoCore - the Ratel's hex puzzle (the Engineer seat of the Honeyguide), engine-free. ROUND 2 rules (Garrett,
 * 2026-10-21). Inputs are seat inputs and a clock; nothing here draws, reads a device or knows about hulls.
 * Assets/_Scripts/Controller/Vessel/Crew/DynamoCore.cs is still the ROUND 1 core (HoneyguideLab.round1.html, held to it by
 * Tools/Build/dynamo_lab/parity.cjs); it is re-ported from this block once the lab is signed off.
 * Colours: 0 empty, 1 Ruby, 2 Jade, 3 Gold (a prism's domain; the board's prisms ARE the battery's charges).
 * Grid: a radius-3 hexagon of 37 pointy-top cells in axial (q, r), r running DOWN, (0,0) the centre.
 * Round 2: the injection ports turn as one rigid pattern, 60 degrees clockwise a spin; an empty port counts as a prism of
 * its colour for completing a pattern (a real prism must still be in it, for the battery); patterns match in any of the
 * six rotations; a pattern made for the third time is replaced by a random one; every 4 patterns the Ratel draws a new
 * random ability and a new port pattern.
 * Round 3: a made pattern sends a random one of its real prisms to the battery (no pick); the new ability and the new
 * port pattern are revealed one after the other while the spin clock stands still (st.reveal), then the clock restarts. */
(function (root) {
  'use strict';
  const RADIUS = 3;
  const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];   // E NE NW W SW SE
  const Q = [], R = [], LUT = new Array(49).fill(-1);
  for (let r = -RADIUS; r <= RADIUS; r++) for (let q = Math.max(-RADIUS, -r - RADIUS); q <= Math.min(RADIUS, -r + RADIUS); q++) { LUT[(q + 3) * 7 + (r + 3)] = Q.length; Q.push(q); R.push(r); }
  const N = Q.length;
  function idx(q, r) { if (q < -3 || q > 3 || r < -3 || r > 3) return -1; return LUT[(q + 3) * 7 + (r + 3)]; }
  const CENTRE = idx(0, 0);
  function ringOf(i) { return Math.max(Math.abs(Q[i]), Math.abs(R[i]), Math.abs(Q[i] + R[i])); }
  const NEIGH = [];
  for (let i = 0; i < N; i++) { const n = []; for (const d of DIRS) { const j = idx(Q[i] + d[0], R[i] + d[1]); if (j >= 0) n.push(j); } NEIGH.push(n); }
  function rot60(i) { return idx(-R[i], Q[i] + R[i]); }   // 60 degrees clockwise on screen about the centre
  function isNeighbour(a, b) { return NEIGH[a].indexOf(b) >= 0; }

  // The Ratel's abilities (one held at a time, redrawn every few patterns). Keys only; the lab owns the words.
  const ABILITIES = ['overclock', 'longReach', 'printer', 'swap', 'freeFire', 'wildCore', 'capacitor', 'mirror', 'refund'];

  // Pattern shapes: cells [[q, r, colour]]; the six rotations, and the six rotations of the mirror image (q <-> r).
  function rotations(cells) {
    const out = [];
    let cur = cells.map((c) => [c[0], c[1], c[2]]);
    for (let k = 0; k < 6; k++) {
      out.push(cur.map((c) => [c[0] - cur[0][0], c[1] - cur[0][1], c[2]]));
      cur = cur.map((c) => [-c[1], c[0] + c[1], c[2]]);
    }
    return out;
  }
  function shapes(cells, allowRotated) {
    const rot = rotations(cells), mir = rotations(cells.map((c) => [c[1], c[0], c[2]]));
    return { rot: allowRotated ? rot : rot.slice(0, 1), mir: allowRotated ? mir : mir.slice(0, 1) };
  }

  function rng(st) {   // mulberry32 over the state's own stream, so a replay of the same inputs draws the same cards
    let a = st.rng | 0; a = a + 0x6D2B79F5 | 0; st.rng = a;
    let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  function pickOther(st, n, not) { if (n <= 1) return 0; let k = Math.floor(rng(st) * (n - 1)); if (k >= not) k++; return k; }

  function drawPattern(st, S) {   // a random pattern not already in a slot
    const cand = [];
    for (let p = 0; p < S.patterns.length; p++) if (!S.patterns[p].parked && st.slots.indexOf(p) < 0) cand.push(p);
    return cand.length ? cand[Math.floor(rng(st) * cand.length)] : -1;
  }
  function setPorts(st, S, k) { st.portSet = k; st.ports = S.portSets[k].map((p) => [p[0], p[1]]); }

  function create(S, seed) {
    const st = {
      cells: new Array(N).fill(0), ports: [], portSet: -1, ap: S.apPerTick < S.apBank ? S.apPerTick : S.apBank, bonusAp: 0,
      clock: 0, ticks: 0, battery: [], slots: [], uses: [], made: 0, reveal: null, freePlace: 0, ability: '',
      rng: seed | 0, wasted: 0, events: [], shapes: S.patterns.map((p) => shapes(p.cells, S.allowRotatedMatches)),
    };
    for (let k = 0; k < S.slotCount; k++) { st.slots.push(S.loadout && S.loadout[k] != null ? S.loadout[k] : drawPattern(st, S)); st.uses.push(0); }
    setPorts(st, S, S.firstPortSet != null ? S.firstPortSet : Math.floor(rng(st) * S.portSets.length));
    st.ability = S.fixedAbility || ABILITIES[Math.floor(rng(st) * ABILITIES.length)];
    if (st.ability === 'printer') st.freePlace = 1;
    if (S.startFilled) for (const p of st.ports) st.cells[p[0]] = p[1];
    return st;
  }

  function portAt(st, cell) { for (const p of st.ports) if (p[0] === cell) return p[1]; return 0; }
  // What a cell counts as for completing a pattern: its prism, or (empty) its port's colour.
  function shows(st, S, i) { return st.cells[i] !== 0 ? st.cells[i] : S.portsCount ? portAt(st, i) : 0; }
  function batteryCap(st, S) { return S.batteryCap + (st.ability === 'capacitor' ? 2 : 0); }

  // The cells of the first placement of pattern `pid` the board shows, or null. A placement needs at least one real
  // prism (it goes to the battery). Order: rotations, then mirror images (the Mirror ability), each by anchor cell index.
  function match(st, S, pid) {
    const sets = st.ability === 'mirror' ? [st.shapes[pid].rot, st.shapes[pid].mir] : [st.shapes[pid].rot];
    const wild = st.ability === 'wildCore';
    for (const sh of sets) for (let k = 0; k < sh.length; k++) {
      const shape = sh[k];
      for (let a = 0; a < N; a++) {
        const cells = [];
        let ok = true, real = false;
        for (let c = 0; c < shape.length; c++) {
          const i = idx(Q[a] + shape[c][0], R[a] + shape[c][1]);
          if (i < 0) { ok = false; break; }
          if (shows(st, S, i) === shape[c][2] || (wild && i === CENTRE)) { cells.push(i); if (st.cells[i] !== 0) real = true; }
          else { ok = false; break; }
        }
        if (ok && real) return cells;
      }
    }
    return null;
  }

  function spendAp(st, n) {
    if (st.ap + st.bonusAp < n) return false;
    const fromAp = st.ap < n ? st.ap : n;
    st.ap -= fromAp; st.bonusAp -= n - fromAp;
    return true;
  }

  function charge(st, S, colour) {
    const cap = batteryCap(st, S);
    if (cap < 1) return;
    while (st.battery.length >= cap) { const old = st.battery.shift(); st.events.push({ k: 'replaced', colour: old }); }
    st.battery.push(colour);
    st.events.push({ k: 'charge', colour });
  }

  // A made pattern sends one of its real prisms, drawn at random, to the battery.
  function takeRandom(st, S, slot, pid, cells) {
    const real = cells.filter((c) => st.cells[c] !== 0), cell = real[Math.floor(rng(st) * real.length)], colour = st.cells[cell];
    st.cells[cell] = 0;
    st.events.push({ k: 'pick', slot, pid, cell, colour });
    charge(st, S, colour);
  }
  // Empty cells reachable from `from` through empty cells (the Long Reach ability's move).
  function reach(st, from) {
    const seen = new Array(N).fill(false), q = [from]; seen[from] = true;
    for (let h = 0; h < q.length; h++) for (const v of NEIGH[q[h]]) if (!seen[v] && st.cells[v] === 0) { seen[v] = true; q.push(v); }
    seen[from] = false;
    return seen;
  }

  // One seat input. Returns true when it was legal and applied; an illegal input changes nothing.
  function apply(st, S, inp) {
    if (st.reveal) return false;   // the clock is stopped while the new ability and ports are shown
    switch (inp.k) {
      case 'tinker': {
        if (inp.from < 0 || inp.from >= N || inp.to < 0 || inp.to >= N || inp.from === inp.to || st.cells[inp.from] === 0) return false;
        const full = st.cells[inp.to] !== 0;
        if (full && !(st.ability === 'swap' && isNeighbour(inp.from, inp.to))) return false;
        if (!full && !isNeighbour(inp.from, inp.to) && !(st.ability === 'longReach' && reach(st, inp.from)[inp.to])) return false;
        if (!spendAp(st, 1)) return false;
        const a = st.cells[inp.from]; st.cells[inp.from] = st.cells[inp.to]; st.cells[inp.to] = a;
        st.events.push({ k: 'tinker', from: inp.from, to: inp.to });
        return true;
      }
      case 'refuel': {
        if (inp.cell < 0 || inp.cell >= N || st.cells[inp.cell] !== 0) return false;
        if (st.freePlace > 0 && inp.colour >= 1 && inp.colour <= 3) {   // the Printer: any empty cell, any colour, no AP
          st.freePlace--; st.cells[inp.cell] = inp.colour;
          st.events.push({ k: 'place', cell: inp.cell, colour: inp.colour });
          return true;
        }
        const pc = portAt(st, inp.cell);
        if (pc === 0 || !spendAp(st, 1)) return false;
        st.cells[inp.cell] = pc;
        st.events.push({ k: 'refuel', cell: inp.cell, colour: pc });
        return true;
      }
      case 'activate': {
        if (inp.slot < 0 || inp.slot >= st.slots.length || st.slots[inp.slot] < 0) return false;
        const pid = st.slots[inp.slot], cells = match(st, S, pid), cost = st.ability === 'freeFire' ? 0 : 1;
        if (!cells || st.ap + st.bonusAp < cost) return false;
        spendAp(st, cost);
        st.uses[inp.slot]++; st.made++;
        st.events.push({ k: 'ability', slot: inp.slot, pid, use: st.uses[inp.slot] });
        if (st.ability === 'refund') st.bonusAp = st.bonusAp + 1 > S.bonusApCap ? S.bonusApCap : st.bonusAp + 1;
        takeRandom(st, S, inp.slot, pid, cells);
        if (S.usesPerPattern > 0 && st.uses[inp.slot] >= S.usesPerPattern) {   // made for the third time: a new pattern
          const old = st.slots[inp.slot]; st.slots[inp.slot] = -1;
          st.slots[inp.slot] = drawPattern(st, S); st.uses[inp.slot] = 0;
          if (st.slots[inp.slot] < 0) st.slots[inp.slot] = old;
          st.events.push({ k: 'retire', slot: inp.slot, old, pid: st.slots[inp.slot] });
        }
        if (S.patternsPerShuffle > 0 && st.made % S.patternsPerShuffle === 0) {   // a new ability, then a new port pattern
          if (!S.fixedAbility) { const k = pickOther(st, ABILITIES.length, ABILITIES.indexOf(st.ability)); st.ability = ABILITIES[k]; }
          if (st.ability === 'printer' && st.freePlace < 1) st.freePlace = 1;
          const next = S.portSets.length > 1 ? pickOther(st, S.portSets.length, st.portSet) : st.portSet;
          st.events.push({ k: 'shuffle', ability: st.ability, portSet: next });
          st.reveal = { stage: 1, t: S.revealAbility, portSet: next };
          if (!(S.revealAbility > 0)) revealStep(st, S);
        }
        return true;
      }
    }
    return false;
  }

  // The battery is shared with the pilot: a slip spends one charge of its colour.
  function spend(st, colour) { const i = st.battery.indexOf(colour); if (i < 0) return false; st.battery.splice(i, 1); return true; }

  // The spin: the port pattern turns 60 degrees clockwise as one piece; the prisms stay where they are.
  function tick(st, S) {
    for (const p of st.ports) p[0] = rot60(p[0]);
    const over = st.ability === 'overclock' ? 1 : 0, gain = S.apPerTick + over, cap = S.apBank + over;
    const before = st.ap;
    st.ap = before + gain > cap ? (before > cap ? before : cap) : before + gain;
    st.wasted += before + gain - st.ap;
    if (st.ability === 'printer' && st.freePlace < 2) st.freePlace++;
    st.ticks++;
    st.events.push({ k: 'tick', n: st.ticks, ap: gain });
  }

  // The reveal: stage 1 shows the new ability (the old ports stay), stage 2 the new ports; then the spin clock restarts.
  function revealStep(st, S) {
    const rv = st.reveal;
    if (rv.stage === 1) {
      setPorts(st, S, rv.portSet);
      st.events.push({ k: 'ports', portSet: rv.portSet });
      rv.stage = 2; rv.t = S.revealPorts;
      if (rv.t > 0) return;
    }
    st.reveal = null; st.clock = 0;
    st.events.push({ k: 'resume' });
  }

  // The clock: seconds of match time. It stands still during a reveal.
  function advance(st, S, dt) {
    if (st.reveal) {
      st.reveal.t -= dt;
      while (st.reveal && st.reveal.t <= 0) revealStep(st, S);
      return;
    }
    st.clock += dt;
    while (st.clock >= S.tickSeconds) { st.clock -= S.tickSeconds; tick(st, S); }
  }

  function nextPorts(st) { return st.ports.map((p) => [rot60(p[0]), p[1]]); }
  function built(st, S) { return st.slots.map((pid) => (pid >= 0 ? match(st, S, pid) : null)); }
  function digest(st) {
    return st.cells.join('') + '|' + st.ports.map((p) => p[0] + ':' + p[1]).join(',') + '|' + st.ap + '+' + st.bonusAp + '|' + st.battery.join('') +
      '|' + st.slots.join(',') + '/' + st.uses.join(',') + '|' + (st.reveal ? st.reveal.stage + ':' + st.reveal.portSet : '-') + '|' + st.freePlace + '|' + st.ability +
      '|' + st.ticks + '|' + st.made + '|' + st.wasted + '|' + (st.rng >>> 0);
  }

  // ---- The Engineer AI: input-only. It returns ONE input (or null) from the state it sees; the caller paces it. ----
  // colourScore[c] (c = 1..3) is how much the pilot can use a charge of colour c right now (kept for the caller; since
  // round 3 the battery prism is drawn at random, so nothing reads it). Difficulty changes belief and pace, never the rules.
  function placementCost(st, S, shape, a, locked) {
    const cells = [], need = [];
    for (let c = 0; c < shape.length; c++) {
      const i = idx(Q[a] + shape[c][0], R[a] + shape[c][1]);
      if (i < 0) return null;
      cells.push(i); need.push(shape[c][2]);
    }
    let total = 0, real = false;
    const fixes = [], onPorts = [];

    const Pw = w.P, rr = Pw.hullRadius + Pw.prismL * 0.5, catchR = rr + 3 * lvl(hull, 'magnet');
    if (hull.ignoreT > 0) hull.ignoreT -= dt;
    let slipTo = null, hit = false;
    near(w, hull.x, hull.z, catchR, (t, i, d2) => {
      if (t.owner === hull.id && w.t - t.born[i] < Pw.selfGrace) return true;   // SELF_TRAIL_CONTACT.md
      if (t.id === hull.ignoreTrail && hull.ignoreT > 0) return true;
      const dom = t.doms[i], c = colourFor(w, dom);
      if (!slipTo && w.cfg.opts.slip && t.kind === 'trail' && t.pts.length >= Pw.minSlipTrailLength && c && w.dyn.battery.indexOf(c) >= 0 && armed(w, hull, t, i, armHeld)) slipTo = { t, i, c };

    });
    if (slipTo) { slip(w, hull, slipTo.t, slipTo.i, slipTo.c); return; }
    if (hit && hull.slowT <= 0) { hull.slowT = 1; w.m.hits++; }
  }
  function armed(w, hull, t, i, armHeld) {
    const a = w.cfg.opts.arming;
    if (a === 'always') return true;
    if (a === 'hold') return armHeld;
    return aligned(w, hull, t, i) && isLine(w, t, i);

  function slip(w, hull, t, i, colour) {
    const Pw = w.P, fwd = [Math.cos(hull.h), 0, Math.sin(hull.h)];
    const land = D.slipDestination(t.pts, i, [hull.x, 0, hull.z], fwd, slipReach(w, hull), Pw.exitOffset);
    if (!land) return;
    if (lvl(hull, 'echo')) { const e = hull.pass.echo; e.lvl--; if (e.lvl <= 0) delete hull.pass.echo; w.m.freeSlips++; }
    else D.spend(w.dyn, colour);
    w.m.used++;
    const x0 = hull.x, z0 = hull.z, d = hypot2(land.point[0] - x0, land.point[2] - z0);
    const gain = hypot2(w.dest.x - x0, w.dest.z - z0) - hypot2(w.dest.x - land.point[0], w.dest.z - land.point[2]);
    w.m.slipGain += gain; if (gain < 0) w.m.badSlips++;
    const ps = w.seats.pilot; if (ps.goal && ps.goal.slip) { w.m.aimed++; w.m.aimedGain += gain; }
    const h = w.cfg.opts.exit === 'align' ? Math.atan2(land.heading[2], land.heading[0]) : hull.h;

    w.log.push({ t: w.t, k: 'slip', d });
  }

  // ---- the two triggers (RT Bolt, LT Burst): every passive of the weapon kind shapes both ----
  function fire(w, hull, which) {
    const Pw = w.P, rate = (which === 'rt' ? Pw.boltRate : Pw.burstRate) * (1 + 0.5 * lvl(hull, 'rapid'));
    const cd = which === 'rt' ? 'cdR' : 'cdL';
    if (hull[cd] > 0) return;
    hull[cd] = 1 / rate;
    const rg = 1 + 0.4 * lvl(hull, 'range'), sc = lvl(hull, 'scatter');
    const speed = (which === 'rt' ? Pw.boltSpeed : Pw.burstSpeed) * rg, life = (which === 'rt' ? Pw.boltRange : Pw.burstRange) * rg / speed;
    const angs = [];
    if (which === 'rt') { angs.push(0); for (let k = 1; k <= sc; k++) angs.push(k * 8, -k * 8); }
    else { const n = Math.max(1, Math.round(Pw.burstPellets) + 2 * sc), f = Pw.burstSpread; for (let k = 0; k < n; k++) angs.push(n === 1 ? 0 : -f / 2 + f * k / (n - 1)); }
    for (const a of angs) {
      const h = hull.h + a * Math.PI / 180;
      w.shots.push({ x: hull.x + Math.cos(hull.h) * 4, z: hull.z + Math.sin(hull.h) * 4, vx: Math.cos(h) * speed, vz: Math.sin(h) * speed, life, pierce: lvl(hull, 'pierce'), kind: which });
    }
  }
  function stepShots(w, hull, dt) {
    const seek = lvl(hull, 'seeker'), blastR = lvl(hull, 'blast') ? 4 + 3 * lvl(hull, 'blast') : 0, chroma = lvl(hull, 'chroma') ? newestDomain(w) : null;
    const hostile = (t, i) => t.owner !== hull.id && t.doms[i] !== hull.dom && !w.gone.has(t.id + ':' + i) && (!chroma || t.doms[i] !== chroma);
    for (const s of w.shots) {

        let bx = 0, bz = 0, bd = 1e9; const sp = hypot2(s.vx, s.vz);
        near(w, s.x, s.z, 30, (t, i, d2) => { if (!hostile(t, i)) return true; const p = t.pts[i]; if ((p[0] - s.x) * s.vx + (p[2] - s.z) * s.vz <= 0) return true; if (d2 < bd) { bd = d2; bx = p[0]; bz = p[2]; } return true; });

  }
  // Destroyed prisms leave the world after the step; a trail broken in the middle becomes two trails (two 1-D prismscapes).
  function removeGone(w) {
    if (!w.gone.size) return;
    const by = new Map();
    for (const key of w.gone) { const [id, i] = key.split(':').map(Number); if (!by.has(id)) by.set(id, []); by.get(id).push(i); }
    const add = [];
    for (const t of w.trails) {
      const list = by.get(t.id); if (!list) continue;
      list.sort((a, b) => b - a);
      for (const i of list) {
        if (i >= t.pts.length) continue;
        if (t.kind === 'patch') { t.pts.splice(i, 1); t.doms.splice(i, 1); t.born.splice(i, 1); continue; }
        const tail = { id: w.nextTrail++, owner: t.owner, kind: 'trail', dom: t.dom, pts: t.pts.splice(i + 1), doms: t.doms.splice(i + 1), born: t.born.splice(i + 1) };

        if (tail.pts.length) add.push(tail);
      }
    }
    for (const t of add) w.trails.push(t);
    w.trails = w.trails.filter((t) => t.pts.length > 0 || w.hulls.some((h) => h.trail === t));
    w.gone.clear();
  }

  // ---- what a made pattern does: the pilot's hull gains its passive ----
  function onDynamoEvent(w, e) {
    const hull = w.hulls[0], Pw = w.P;
    if (e.k === 'ability') {
      w.m.patterns++;
      const pat = PATTERNS[e.pid], key = pat.passive;
      if (w.cfg.opts.passives) {
        const cur = hull.pass[key];
        hull.pass[key] = { lvl: Math.min(Pw.passiveMaxLevel, (cur ? cur.lvl : 0) + 1), t: Pw.passiveSeconds };
        w.effects.push({ k: 'banner', text: PASSIVES[key].name + ' ' + roman(hull.pass[key].lvl), col: DOM[COLOUR_DOM[pat.family]].color, t: 1.6 });
      }
    } else if (e.k === 'charge') w.m.charges++;
    else if (e.k === 'tick') { w.m.apGiven += e.ap; w.spinAt = w.t; }
    else if (e.k === 'shuffle') { w.m.shuffles++; w.abilityAt = w.t; }
    else if (e.k === 'ports') w.shuffleAt = w.t;
    else if (e.k === 'retire') { w.m.retired++; w.effects.push({ k: 'retire', slot: e.slot, t: 1.0 }); }
  }
  const roman = (n) => ['', 'I', 'II', 'III', 'IV', 'V'][n] || String(n);
  function stepPassives(w, hull, dt) {
    let n = 0;
    for (const k of Object.keys(hull.pass)) { const p = hull.pass[k]; p.t -= dt; if (p.t <= 0) delete hull.pass[k]; else n++; }
    w.m.passT += n * dt;
    if (lvl(hull, 'afterburner')) hull.boostE = Math.min(6, hull.boostE + 0.4 * lvl(hull, 'afterburner') * dt);
  }

  // ---- the Honeyguide's pilot AI: input-only (steer, boost, the two triggers, arm for the hold-to-arm comparison) ----
  // Hostile prisms in a cone ahead that it may shoot (never the domains it holds: those are slip lanes).
  function targetsAhead(w, hull, range, cone) {
    const held = heldDomains(w), c = Math.cos(cone * Math.PI / 180), f0 = Math.cos(hull.h), f1 = Math.sin(hull.h);
    let n = 0;
    near(w, hull.x + f0 * range / 2, hull.z + f1 * range / 2, range / 2, (t, i) => {
      if (t.owner === hull.id || t.doms[i] === hull.dom || held.has(t.doms[i])) return true;
      const p = t.pts[i], dx = p[0] - hull.x, dz = p[2] - hull.z, d = hypot2(dx, dz);
      if (d > 1e-6 && (dx * f0 + dz * f1) / d >= c) n++;
      return true;
    });
    return n;
  }
  function pilotAI(w, seat, dt) {
    const hull = w.hulls[0], S = PSKILL[seat.skill], cmd = seat.cmd;
    seat.think -= dt;
    if (seat.think <= 0) {
      seat.think = S.think;
      let goal = { x: w.dest.x, z: w.dest.z, slip: false };
      if (w.cfg.opts.slip) {
        let best = null;
        for (const dom of heldDomains(w)) { const g = slipGain(w, hull, dom, S.sees); if (g && (!best || g.gain > best.gain)) best = g; }
        if (best && best.gain > S.minGain) goal = { x: best.x, z: best.z, fx: best.fx, fz: best.fz, axis: best.axis, slip: true };
      }
      seat.goal = goal;
      seat.noise = gauss(w.rngP) * S.steerNoise;
      const wantFire = w.cfg.opts.weapons && w.rngP() < S.trigger;
      seat.fireR = wantFire && targetsAhead(w, hull, w.P.boltRange, 6) > 0;
      seat.fireL = wantFire && targetsAhead(w, hull, w.P.burstRange, w.P.burstSpread / 2) > 1;
    }
    const goal = seat.goal || { x: w.dest.x, z: w.dest.z };
    let tx = goal.x, tz = goal.z;
    if (goal.slip && goal.axis) {   // come in along the prism's axis: aim at the point on the axis line 25 u ahead of us
      const along = (hull.x - goal.x) * goal.fx + (hull.z - goal.z) * goal.fz;
      const k = Math.min(0, along + 25);
      tx = goal.x + goal.fx * k; tz = goal.z + goal.fz * k;
    }
    let want = Math.atan2(tz - hull.z, tx - hull.x);
    // steer off a hostile prism straight ahead, and off a held trail it would slip on without wanting to
    // (on the way to a slip it still dodges hostile prisms until the last 40 u)
    const closing = goal.slip && hypot2(goal.x - hull.x, goal.z - hull.z) < 40;
    if (!closing && w.rngP() < S.avoid) {
      const held = heldDomains(w), f0 = Math.cos(hull.h), f1 = Math.sin(hull.h);
      near(w, hull.x + f0 * 15, hull.z + f1 * 15, 16, (t, i) => {
        if (t.owner === hull.id) return true;
        const unwanted = held.has(t.doms[i]) ? (!goal.slip && w.cfg.opts.slip && t.kind === 'trail' && t.pts.length >= w.P.minSlipTrailLength && armed(w, hull, t, i, false)) : (t.doms[i] !== hull.dom && !lvl(hull, 'shield'));
        if (!unwanted) return true;

  function engineerAI(w, seat, dt) {

    const S = ESKILL[seat.skill];
    seat.think = S.think;
    seat.memo = seat.memo || {};
    const inp = D.aiPlan(w.dyn, w.S, S, colourScores(w), w.rngE, seat.memo);
    if (inp && inp.k === 'activate') seat.memo.key = '';
    if (inp) D.apply(w.dyn, w.S, inp);
  }

  // ---- one step of the whole world. `live` carries the human inputs (null in the batch) ----
  function simStepWorld(w, dt, live) {
    const hull = w.hulls[0], seats = w.seats;
    if (w.swapT > 0) w.swapT -= dt;
    if (w.orientT > 0) w.orientT -= dt;
    for (let i = 1; i < w.hulls.length; i++) rivalStep(w, w.hulls[i], dt);
    w.patchT -= dt;
    if (w.patchT <= 0) { w.patchT = 3; let n = 0; for (const t of w.trails) if (t.kind === 'patch') n += t.pts.length; if (n < 0.6 * w.P.patchCount * w.P.patchSize) addPatch(w); }
    buildGrid(w);
    // the pilot seat
    let cmd;
    if (seats.pilot.who === 'ai') { pilotAI(w, seats.pilot, dt); cmd = seats.pilot.cmd; }
    else if (seats.pilot.who === 'human' && live) cmd = live.pilot;
    else cmd = { steer: 0, boost: false, lt: false, rt: false, arm: false };
    if (w.orientT > 0 && seats.pilot.who !== 'human') cmd = { steer: 0, boost: false, lt: false, rt: false, arm: cmd.arm };
    moveHull(w, hull, cmd.steer, cmd.boost, dt);
    stepPassives(w, hull, dt);
    hull.cdR -= dt; hull.cdL -= dt;
    if (w.cfg.opts.weapons || seats.pilot.who === 'human') { if (cmd.rt) fire(w, hull, 'rt'); if (cmd.lt) fire(w, hull, 'lt'); }
    contacts(w, hull, !!cmd.arm, dt);
    stepShots(w, hull, dt);
    removeGone(w);
    // the engineer seat
    if (seats.eng.who === 'ai' && !(w.orientT > 0)) engineerAI(w, seats.eng, dt);
    else if (seats.eng.who === 'human' && live) for (const inp of live.eng.splice(0)) D.apply(w.dyn, w.S, inp);
    D.advance(w.dyn, w.S, dt);
    for (const e of w.dyn.events.splice(0)) onDynamoEvent(w, e);
    if (!w.dyn.battery.length) w.m.emptyT += dt;
    // the race
    if (hypot2(w.dest.x - hull.x, w.dest.z - hull.z) < w.P.destRadius) { w.m.dests++; w.effects.push({ k: 'ring', x: w.dest.x, z: w.dest.z, col: '#ffffff', t: 0.8 }); w.dest = spawnDest(w); w.legStart = hypot2(w.dest.x - hull.x, w.dest.z - hull.z); }
    for (const fx of w.effects) fx.t -= dt;
    if (w.effects.length > 40 || w.effects.some((fx) => fx.t <= 0)) w.effects = w.effects.filter((fx) => fx.t > 0).slice(-40);
    w.t += dt;
  }
  function swapSeats(w) {
    if (w.swapT > 0) return false;

    [a.who, b.who] = [b.who, a.who]; [a.skill, b.skill] = [b.skill, a.skill];
    w.swapT = w.P.swapCooldown; w.m.swaps++;
    if (a.who === 'human' || b.who === 'human') w.orientT = 0; else w.orientT = w.P.swapOrient;
    return true;
  }

  // ================= score: one number per column the lab exists to decide =================
  function score(w) {
    const min = w.t / 60, m = w.m;
    return {
      t: +w.t.toFixed(2), destsPerMin: +((m.dests + clamp(1 - hypot2(w.dest.x - w.hulls[0].x, w.dest.z - w.hulls[0].z) / Math.max(1, w.legStart), -1, 1)) / min).toFixed(2),
      slipGain: m.slips ? +(m.slipGain / m.slips).toFixed(1) : 0, badSlips: m.slips ? +(100 * m.badSlips / m.slips).toFixed(0) : 0, aimed: m.slips ? +(100 * m.aimed / m.slips).toFixed(0) : 0, slipsPerMin: +(m.slips / min).toFixed(2),
      patternsPerMin: +(m.patterns / min).toFixed(2), passivesUp: +(m.passT / Math.max(1e-9, w.t)).toFixed(2), killsPerMin: +(m.kills / min).toFixed(1), turnedPerMin: +(m.turned / min).toFixed(1),
      engIdle: m.apGiven ? +(100 * w.dyn.wasted / (m.apGiven + w.S.apPerTick)).toFixed(1) : 0,
      waiting: +(100 * m.emptyT / Math.max(1e-9, w.t)).toFixed(1), hitRate: m.charges ? +(100 * m.used / m.charges).toFixed(1) : 0,
      chargesPerMin: +(m.charges / min).toFixed(2), clipped: m.slips ? +(100 * m.clipped / m.slips).toFixed(0) : 0, hitsPerMin: +(m.hits / min).toFixed(2), shufflesPerMin: +(m.shuffles / min).toFixed(2),
    };
  }
  function cfgFrom(opts, pilotSkill, engWho, engSkill, extraP) {
    return { P: Object.assign({}, P, extraP || {}), opts: Object.assign({}, OPT, opts || {}), pilot: { who: 'ai', skill: pilotSkill }, eng: { who: engWho, skill: engSkill } };
  }
  function runOne(cfg, s, seconds, dt) { const w = makeWorld(s, cfg); const n = Math.round(seconds / dt); for (let i = 0; i < n; i++) simStepWorld(w, dt, null); return score(w); }
  const VARIANTS = [
    { name: 'Solo (no Engineer)', eng: 'none', opts: {} },
    { name: 'Candidate', opts: {}, skills: true },
    { name: 'Passives off (slip only)', opts: { passives: false } },
    { name: 'Slip off (passives only)', opts: { slip: false } },
    { name: 'Triggers never fired', opts: { weapons: false } },
    { name: 'Ports do not count', opts: { portsCount: false } },
    { name: 'Patterns never replaced', opts: { replace: false } },
    { name: 'No new ability or ports', opts: { shuffle: false } },
    { name: 'Patterns as printed (no rotation)', opts: { rotatable: false } },
    { name: 'Hold to arm (round 1)', opts: { arming: 'hold' } },
    { name: 'Always armed (the brief)', opts: { arming: 'always' } },
    { name: 'Arming cone 30°', opts: {}, P: { aimCone: 30 } },
    { name: 'Spin every 8 s (round 2)', opts: {}, P: { tickSeconds: 8 } },
    { name: 'Spin 15 s, 6 AP (round 2\'s AP rate)', opts: {}, P: { apPerTick: 6, apBank: 6 } },
    { name: 'No reveal pause', opts: {}, P: { revealAbility: 0, revealPorts: 0 } },
  ];
  const COLS = [
    ['destsPerMin', 'Legs/min', 'Race legs a minute: destinations reached, plus the share of the last leg flown. Higher is better.'],
    ['lift', 'Lift %', 'Legs/min against the solo hull (no Engineer, no battery, no passives).'],
    ['slipsPerMin', 'Slips/min', 'Slips ridden a minute.'],
    ['slipGain', 'Slip gain (u)', 'Mean distance a slip took off the way to the destination (negative: it carried the hull away).'],
    ['badSlips', 'Bad slips %', 'Slips that left the hull farther from the destination.'],
    ['aimed', 'Aimed %', 'Slips the pilot was steering for (the rest were brushes with a trail).'],
    ['patternsPerMin', 'Patterns/min', 'Patterns made a minute.'],
    ['passivesUp', 'Passives up', 'Mean number of passives the hull carries at once.'],
    ['killsPerMin', 'Kills/min', 'Hostile prisms the two triggers destroyed a minute.'],
    ['hitsPerMin', 'Hostile hits/min', 'Hostile prisms flown into (each slows the hull for a second).'],
    ['engIdle', 'Eng idle %', 'AP the Ratel let go to waste (the bank was full at a spin).'],
    ['waiting', 'Waiting %', 'Time the battery held no charge: the pilot waiting for a charge.'],
    ['hitRate', 'Hit rate %', 'Charges that were slipped on, of all charges made (the battery prism is drawn at random).'],
    ['clipped', 'Clipped %', 'Slips the reach cap cut short.'],
    ['shufflesPerMin', 'New abilities/min', 'How often the Ratel drew a new ability and port pattern.'],
  ];
  function runBatch(opts) {
    opts = opts || {};
    const seeds = opts.seeds || [1, 2, 3, 4, 5, 6], seconds = opts.seconds || 120, dt = opts.dt || 1 / 30, rows = [];
    const avg = (list) => { const o = {}; for (const k of Object.keys(list[0])) o[k] = +(list.reduce((s, r) => s + r[k], 0) / list.length).toFixed(2); return o; };
    const se = (list, k) => { const m = list.reduce((s, r) => s + r[k], 0) / list.length; return +(Math.sqrt(list.reduce((s, r) => s + (r[k] - m) * (r[k] - m), 0) / Math.max(1, list.length - 1)) / Math.sqrt(list.length)).toFixed(2); };
    let solo = 0;
    for (const v of (opts.variants || VARIANTS)) {
      const engs = v.eng === 'none' ? [['none', 'hard']] : v.skills ? [['ai', 'hard'], ['ai', 'easy'], ['idle', 'hard']] : [['ai', 'hard']];
      for (const [who, skill] of engs) {
        const list = seeds.map((s) => runOne(cfgFrom(Object.assign({}, v.opts, who === 'none' ? { slip: false, passives: false } : {}), 'hard', who === 'ai' ? 'ai' : 'none', skill, v.P), s, seconds, dt));
        const row = Object.assign({ variant: v.name + (v.skills ? (who === 'idle' ? ' · idle Ratel' : ' · ' + skill + ' Ratel') : ''), se: se(list, 'destsPerMin') }, avg(list));
        if (v.eng === 'none') solo = row.destsPerMin;
        row.lift = solo ? +(100 * (row.destsPerMin - solo) / solo).toFixed(1) : 0;
        rows.push(row);
      }
    }
    return rows;
  }

  // ================= platform: answered once =================

      case 'The spin': return 'The port pattern turns 60 degrees every ' + P.tickSeconds + ' s, animated over ' + P.spinAnim + ' s';
      case 'Ports count as prisms': return o.portsCount ? 'An empty port counts as a prism; a real prism must still be in the pattern' : 'Ports do not count';
      case 'Ratel abilities': return o.ability === 'random' ? 'Random, redrawn with the ports every ' + P.patternsPerShuffle + ' patterns; the clock stops ' + P.revealAbility + ' s to show the ability, then ' + P.revealPorts + ' s for the ports' : 'Always ' + ABILITY_TEXT[o.ability][0];
      case 'Pattern replacement': return o.replace ? 'Replaced after ' + P.usesPerPattern + ' makes' : 'Never replaced';
      case 'Passives': return 'Each pattern gives a passive for ' + P.passiveSeconds + ' s, stacking to level ' + P.passiveMaxLevel;
      case 'The two triggers': return 'RT Bolt ' + P.boltRate + '/s, ' + P.boltRange + ' u; LT Burst ' + P.burstRate + '/s, ' + P.burstPellets + ' pellets, ' + P.burstRange + ' u';
      case 'Tick / AP / battery': return 'Spin ' + P.tickSeconds + ' s, ' + P.apPerTick + ' AP (bank ' + P.apBank + '), battery ' + P.batteryCap;
      case 'Sign-off': return 'This is fun: build the Honeyguide and Ratel in Unity with these settings.';
      default: return 'Settings: ' + JSON.stringify(Object.assign({}, diffOnly(), optDiff()));
    }
  }
  function logPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint" id="logStatus"></p><label class="field"><span>Topic</span><select id="logTopic"></select></label><label class="field"><span>Your decision</span><textarea id="logChoice" rows="2"></textarea></label><p><button class="btn primary" id="logSave">Record decision</button> <button class="btn" id="logCopy">Copy log</button></p><div class="tablewrap"><table id="logTable"></table></div>';
    const sel = box.querySelector('#logTopic'); for (const t of TOPICS) { const o = document.createElement('option'); o.textContent = t; sel.appendChild(o); }
    const status = box.querySelector('#logStatus');
    status.textContent = db ? 'Shared log: saved with the lab, read by Claude at the start of the next round.' : 'Kept in this browser (Copy log to send it).';
    status.className = db ? 'status-ok' : 'status-warn';
    const fill = () => { box.querySelector('#logChoice').value = currentChoice(sel.value); };
    sel.onchange = fill; fill();
    box.querySelector('#logSave').onclick = async () => { const where = await record(sel.value, box.querySelector('#logChoice').value); status.textContent = where === 'shared' ? 'Recorded in the shared log.' : 'Recorded in this browser.'; renderLog(box); };
    box.querySelector('#logCopy').onclick = () => { const t = remote.concat(localLog).map((d) => new Date(d.createdAt).toISOString() + ' · ' + d.topic + ': ' + d.choice + ' ' + JSON.stringify(d.settings)).join('\n'); try { navigator.clipboard && navigator.clipboard.writeText(t); } catch (e) { /* no clipboard */ } };
    renderLog(box);
    return box;
  }
  function renderLog(box) {
    const t = (box || document).querySelector('#logTable'); if (!t) return;
    const rows = remote.concat(localLog).sort((a, b) => b.createdAt - a.createdAt).slice(0, 50);
    t.innerHTML = '<tr><th>When</th><th>Round</th><th>Topic</th><th>Decision</th></tr>';
    for (const d of rows) { const tr = document.createElement('tr'); for (const v of [new Date(d.createdAt).toLocaleString(), d.settings && d.settings.round ? String(d.settings.round) : '', d.topic, d.choice]) { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); } t.appendChild(tr); }
  }
  (async function connect() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try { db = await c.use('db'); } catch (e) { db = null; }
    try { const u = await c.use('user'); if (u) me = (await u.id()) || ''; } catch (e) { me = ''; }
    if (!db) return;
    try {
      db.collection('decisions').orderBy('createdAt', 'desc').limit(300).onSnapshot((snap) => { remote = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderLog(); }, () => { db = null; });
      for (const d of localLog.splice(0)) { try { await db.collection('decisions').add(d); } catch (e) { localLog.push(d); } }
      lsSet('log', localLog);
    } catch (e) { db = null; }
  })();

  // ================= scorecard, patterns, about =================
  let lastRows = null;
  function scorecardPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p><button class="btn primary" id="runBatch">Score every variant</button> <span class="hint">Headless: 6 seeds × 120 s at 30 Hz, AI Hard pilot. The candidate also runs with an Easy and an idle Ratel. Hover a column for what it measures.</span></p><div class="tablewrap"><table id="scoreTable"></table></div>';
    const t = box.querySelector('#scoreTable');
    const paint = (rows) => {
      t.innerHTML = '';
      const hr = document.createElement('tr'); for (const [k, name, tip] of [['variant', 'Variant', 'Each row: 6 seeds × 120 s.']].concat(COLS, [['se', '± SE', 'Standard error of Legs/min over the seeds.']])) { const th = document.createElement('th'); th.textContent = name; th.title = tip; th.dataset.k = k; hr.appendChild(th); } t.appendChild(hr);
      const best = {}; for (const [k] of COLS) best[k] = Math.max(...rows.map((r) => r[k]));
      for (const r of rows) { const tr = document.createElement('tr'); const td0 = document.createElement('td'); td0.textContent = r.variant; tr.appendChild(td0); for (const [k] of COLS) { const td = document.createElement('td'); td.textContent = r[k]; if (k === 'destsPerMin' && r[k] === best[k]) td.className = 'best'; tr.appendChild(td); } const tdse = document.createElement('td'); tdse.textContent = r.se; tr.appendChild(tdse); t.appendChild(tr); }
    };
    if (lastRows) paint(lastRows);
    box.querySelector('#runBatch').onclick = () => { const b = box.querySelector('#runBatch'); b.textContent = 'Scoring…'; setTimeout(() => { lastRows = runBatch(); paint(lastRows); b.textContent = 'Score every variant'; }, 30); };
    return box;
  }
  function cardsPanel() {
    const box = document.createElement('div');
    const p = document.createElement('p'); p.className = 'hint'; p.textContent = 'All 39 patterns (the Slipstream upgrade cards, 2022 print) and the passive each gives the pilot. Ruby-family patterns upgrade the triggers, Jade-family the hull, Gold-family the slip. The Ratel draws 3 at random; a pattern made 3 times is replaced.'; box.appendChild(p);
    const grid = document.createElement('div'); grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px';
    PATTERNS.forEach((pat) => {
      const c = document.createElement('div'); c.className = 'card';
      const b = document.createElement('b'); b.textContent = PASSIVES[pat.passive].name + ' · ' + pat.name; c.appendChild(b);
      const f = document.createElement('span'); f.className = 'fam'; f.style.color = DOM[COLOUR_DOM[pat.family]].color; f.textContent = DOM[COLOUR_DOM[pat.family]].name + ' family · ' + pat.cells.length + ' cells · ' + pat.cells.map((x) => COLOUR_LETTER[x[2]] + '(' + x[0] + ',' + x[1] + ')').join(' '); c.appendChild(f);
      const e = document.createElement('div'); e.textContent = PASSIVES[pat.passive].text; e.style.fontSize = '12px'; c.appendChild(e);
      grid.appendChild(c);
    });
    box.appendChild(grid);
    return box;
  }
  function aboutPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p id="aboutHead"></p>' +
      '<p><b>The question.</b> Is the handoff fun? The Ratel builds patterns on a hex Dynamo whose injection ports turn 60 degrees every spin. Making a pattern sends one of its prisms, drawn at random, to the battery (a slip charge in its domain) and gives the Honeyguide a passive upgrade. The Honeyguide flies the Sparrow hull with two triggers, and its Time ability is the Slip: touch a trail of a domain you hold, nose within 45 degrees of the trail\'s line, and jump to the end you point at. Round 3 plays Garrett\'s rules from his first two sessions: three-fold colour-symmetric port patterns only, a 15 s spin shown as a shrinking bar, the new ability and then the new ports revealed while the clock stands still, and a random battery prism. Sign off on a phone, as the Engineer, on the Decisions tab ("this is fun").</p>' +
      '<p><b>What this lab does NOT model.</b></p><ul class="plain">' +
      '<li>The world is a flat 2D disc, not the 3D cell. A prism\'s z axis is its trail\'s direction in the plane; "1-D" is measured locally (at most two neighbours within 1.5 prism spacings), so a crossing of two trails is 2-D where they cross. The 2-D beds stand in for walls, flora and the cell\'s structures.</li>' +
      '<li>The race (reach the next destination ring) is the lab\'s yardstick; no game mode is modelled. Kills count hostile prisms destroyed; nothing scores them.</li>' +
      '<li>The triggers only destroy or recolour prisms. No rival vessels to fight (PvP is petals only in the game), no ammo, heat or element costs.</li>' +
      '<li>Passive numbers, the Ratel\'s abilities and the pattern-to-passive table are proposals. Time, Space, Mass and Charge scaling and the L5 upgrades are fixed numbers here.</li>' +
      '<li>Two players on one device only; no networking. A real thumb tires and misses; the AIs only have speed, noise and reaction time.</li></ul>' +
      '<p class="hint">Round 1 (the brief\'s rules, hold-to-arm) is kept at Docs/Studios/HoneyguideLab.round1.html.</p>';
    box.querySelector('#aboutHead').textContent = LAB.name + ' · round ' + LAB.round + ' · ' + LAB.branch + ' · write-up: ' + LAB.doc;
    return box;
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Decisions', build: logPanel }, { name: 'Scorecard', build: scorecardPanel }, { name: 'Patterns', build: cardsPanel }, { name: 'About', build: aboutPanel }], LS + 'bottom');

  // ================= header =================
  $('title').textContent = 'Honeyguide and Ratel'; $('meta').textContent = 'lab round ' + LAB.round;
  function paintSeatSeg() { for (const b of $('seatSeg').children) b.setAttribute('aria-pressed', String(b.dataset.you === crew.you)); }
  for (const b of $('seatSeg').children) b.onclick = () => { crew.you = b.dataset.you; lsSet('you', crew.you); applyCrew(); paintSeatSeg(); };
  paintSeatSeg();
  $('swapBtn').onclick = () => requestSwap('button');
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
  $('restart').onclick = () => reset();
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); Object.assign(OPT, OPT_SHIPPED); lsSet('P', {}); lsSet('opt', OPT); for (const k in outputs) if (outputs[k].inp.isConnected) outputs[k].inp.value = P[k]; reset(); refreshDiff(); };

  // ================= sizing + loop (with a manual clock for recorders) =================
  function fitStage() { if (innerWidth > 900) return; const h = Math.max(520, innerHeight - document.querySelector('header').offsetHeight); document.documentElement.style.setProperty('--stageH', h + 'px'); }
  fitStage(); addEventListener('resize', fitStage);
  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now(), acc = 0;
  const DT = 1 / 60;
  function frame(now) {
    const el = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) {
      resize();
      if (!paused) { acc += el; livePilot(); while (acc >= DT) { simStepWorld(world, DT, live); acc -= DT; } }
      render();
    }
    requestAnimationFrame(frame);
  }
  reset(); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  // ================= the test surface =================
  window.__lab = {
    LAB, SHIPPED, SPEC, P, OPT, PLATFORM, VARIANTS, PATTERNS, PASSIVES, PORT_SETS, core: D,
    portCheck: () => Object.fromEntries(Object.entries(ENGINES).map(([k, e]) => [k, symmetricPorts(e.ports)])),
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { dt = dt || DT; n = n || 1; for (let i = 0; i < n; i++) { livePilot(); simStepWorld(world, dt, live); } resize(); render(); },
    reset, score: () => score(world), runBatch, setParam, setOpt, record, swap: () => requestSwap('hook'),
    setSeat: (you) => { crew.you = you; applyCrew(); paintSeatSeg(); },
    engInput: (inp) => engInput(inp),
    cellPx: (i) => (ui.dynG ? cellPx(ui.dynG, i) : null), slotRect: (k) => (ui.slotRects ? ui.slotRects[k] : null), hexSize: () => (ui.dynG ? ui.dynG.size : 0),
    world: () => world,
    state: () => ({ t: world.t, seed, digest: D.digest(world.dyn), ability: world.dyn.ability, battery: world.dyn.battery.slice(), passives: Object.fromEntries(Object.entries(world.hulls[0].pass).map(([k, v]) => [k, v.lvl])), hull: { x: world.hulls[0].x, z: world.hulls[0].z, h: world.hulls[0].h }, m: Object.assign({}, world.m), seats: { pilot: world.seats.pilot.who, eng: world.seats.eng.who } }),
  };
  window.__honeyguideLab = window.__lab;
})();
</script>
