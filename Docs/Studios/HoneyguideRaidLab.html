<!doctype html>
<!--
  Ratel Raid Lab (round 2b) - a /labmaker browser studio for the Ratel's hive mode, the second game proposed for the Ratel's
  seat of the Honeyguide (Docs/Studios/ONE_THUMB_SEAT_ARCS.md section 3), as Garrett's notes of 2026-10-31 reshaped it: a
  thin symbolic strip shows the Honeyguide and the distance to an omnicrystal (or a hive its Mass power made); reaching it
  starts hive mode on its own; every hive is solvable by chains of 3+; completing a colour pays prisms and a charge with no
  pick, and they place themselves on the Dynamo's largest planar crystal. Round 1 (the raid card, stings, the feast) is
  superseded. Round 2b: every hive holds all three domains, a shielded prism in each
  (a crossing of two snakes; two passes) and danger prisms that sting; Restart starts the next seed's match. The build is the real Dynamo, copied line for line
  from Docs/Studios/HoneyguideLab.html (script id="dynamo-core") with the round 7 Breath settings: AP bank 6, a pick of
  three abilities. Write-up: Docs/Studios/HONEYGUIDE_RAID_LAB.md. Verify: node .claude/skills/labmaker/verify_lab.cjs <this file>
-->

      --honey: #ffb21f; --honey-soft: #3a2a08; --ok: #5cc98a; --warn: #f0a050; --changed: #6cc8e0; color-scheme: dark;

  #app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr) 250px;
    grid-template-areas: "head head" "stage dock" "bottom dock"; overflow: hidden; }
  header { grid-area: head; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

<body>
<div id="app">

<script id="dynamo-core">
/* Copied line for line from Docs/Studios/HoneyguideLab.html (the block of the same id, round 7 working copy, 2026-10-29),
 * with no changes: the Breath settings (apBank 6, the pick of three) are settings, and the raid lives outside the core. */
/* DynamoCore - the Ratel's hex puzzle (the Engineer seat of the Honeyguide), engine-free. ROUND 2 rules (Garrett,
 * 2026-10-21). Inputs are seat inputs and a clock; nothing here draws, reads a device or knows about hulls.
 * Assets/_Scripts/Controller/Vessel/Crew/DynamoCore.cs is still the ROUND 1 core (HoneyguideLab.round1.html, held to it by
 * Tools/Build/dynamo_lab/parity.cjs); it is re-ported from this block once the lab is signed off.
 * Colours: 0 empty, 1 Ruby, 2 Jade, 3 Gold (a prism's domain; the board's prisms ARE the battery's charges).
 * Grid: a radius-3 hexagon of 37 pointy-top cells in axial (q, r), r running DOWN, (0,0) the centre.
 * Round 2: the injection ports turn as one rigid pattern, 60 degrees clockwise a spin; an empty port counts as a prism of
 * its colour for completing a pattern (a real prism must still be in it, for the battery); patterns match in any of the
 * six rotations; a pattern made for the third time is replaced by a random one; every 4 patterns the Ratel draws a new
 * random ability and a new port pattern.
 * Round 3: a made pattern sends a random one of its real prisms to the battery (no pick); the new ability and the new
 * port pattern are revealed one after the other while the spin clock stands still (st.reveal), then the clock restarts.
 * Round 7 (Garrett, 2026-10-29: "lets have the ap cap go to 6. lets do the 3 ability pick as well"): with S.abilityChoices > 1 the
 * draw OFFERS that many abilities (st.reveal.offers) and the Ratel picks one (input 'pick', slot = the offer); the clock stays
 * stopped while it chooses. After S.pickSeconds (> 0) the first offer is taken. The AI picks by AI_PICK_ORDER. */
(function (root) {
  'use strict';
  const RADIUS = 3;
  const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];   // E NE NW W SW SE
  const Q = [], R = [], LUT = new Array(49).fill(-1);
  for (let r = -RADIUS; r <= RADIUS; r++) for (let q = Math.max(-RADIUS, -r - RADIUS); q <= Math.min(RADIUS, -r + RADIUS); q++) { LUT[(q + 3) * 7 + (r + 3)] = Q.length; Q.push(q); R.push(r); }
  const N = Q.length;
  function idx(q, r) { if (q < -3 || q > 3 || r < -3 || r > 3) return -1; return LUT[(q + 3) * 7 + (r + 3)]; }
  const CENTRE = idx(0, 0);
  function ringOf(i) { return Math.max(Math.abs(Q[i]), Math.abs(R[i]), Math.abs(Q[i] + R[i])); }
  const NEIGH = [];
  for (let i = 0; i < N; i++) { const n = []; for (const d of DIRS) { const j = idx(Q[i] + d[0], R[i] + d[1]); if (j >= 0) n.push(j); } NEIGH.push(n); }
  function rot60(i) { return idx(-R[i], Q[i] + R[i]); }   // 60 degrees clockwise on screen about the centre
  function isNeighbour(a, b) { return NEIGH[a].indexOf(b) >= 0; }

  // The Ratel's abilities (one held at a time, redrawn every few patterns). Keys only; the lab owns the words.
  const ABILITIES = ['overclock', 'longReach', 'printer', 'swap', 'freeFire', 'wildCore', 'capacitor', 'mirror', 'refund'];

  // Pattern shapes: cells [[q, r, colour]]; the six rotations, and the six rotations of the mirror image (q <-> r).
  function rotations(cells) {
    const out = [];
    let cur = cells.map((c) => [c[0], c[1], c[2]]);
    for (let k = 0; k < 6; k++) {
      out.push(cur.map((c) => [c[0] - cur[0][0], c[1] - cur[0][1], c[2]]));
      cur = cur.map((c) => [-c[1], c[0] + c[1], c[2]]);
    }
    return out;
  }
  function shapes(cells, allowRotated) {
    const rot = rotations(cells), mir = rotations(cells.map((c) => [c[1], c[0], c[2]]));
    return { rot: allowRotated ? rot : rot.slice(0, 1), mir: allowRotated ? mir : mir.slice(0, 1) };
  }

  function rng(st) {   // mulberry32 over the state's own stream, so a replay of the same inputs draws the same cards
    let a = st.rng | 0; a = a + 0x6D2B79F5 | 0; st.rng = a;
    let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  function pickOther(st, n, not) { if (n <= 1) return 0; let k = Math.floor(rng(st) * (n - 1)); if (k >= not) k++; return k; }
  // Round 7: up to n distinct abilities from the pool, never the one held (unless it is all the pool has), in draw order.
  function drawOffers(st, pool, n) {
    const cand = pool.filter((a) => a !== st.ability), from = cand.length ? cand : pool.slice(), out = [];
    while (out.length < n && from.length) out.push(from.splice(Math.floor(rng(st) * from.length), 1)[0]);
    return out;
  }
  // The AI's pick (proposal): the first of these an offer holds. Overclock and Refund add AP, Free Fire saves it; Mirror and
  // Swap made no measurable difference in round 2; Printer is retired from the shipped draw.
  const AI_PICK_ORDER = ['overclock', 'refund', 'freeFire', 'longReach', 'capacitor', 'wildCore', 'swap', 'mirror', 'printer'];
  function aiPick(offers) { let best = 0; for (let k = 1; k < offers.length; k++) if (AI_PICK_ORDER.indexOf(offers[k]) < AI_PICK_ORDER.indexOf(offers[best])) best = k; return best; }
  // Take offer k: the new ability (and its Printer prism), announced as the old draw was; the reveal goes on to the ports.
  function takeOffer(st, k) {
    const rv = st.reveal;
    st.ability = rv.offers[k]; rv.offers = null;
    if (st.ability === 'printer' && st.free.length < 1) grantFree(st, 1);
    st.events.push({ k: 'shuffle', ability: st.ability, portSet: rv.portSet });
  }

  function drawPattern(st, S) {   // a random pattern not already in a slot
    const cand = [];
    for (let p = 0; p < S.patterns.length; p++) if (!S.patterns[p].parked && st.slots.indexOf(p) < 0) cand.push(p);
    return cand.length ? cand[Math.floor(rng(st) * cand.length)] : -1;
  }
  function setPorts(st, S, k) { st.portSet = k; st.ports = S.portSets[k].map((p) => [p[0], p[1]]); }

  // The abilities a random draw picks from: S.abilities (keys), or every ability.
  function abilityPool(S) { return S.abilities && S.abilities.length ? S.abilities : ABILITIES; }

  function create(S, seed) {
    const st = {
      cells: new Array(N).fill(0), ports: [], portSet: -1, ap: S.apPerTick < S.apBank ? S.apPerTick : S.apBank, bonusAp: 0,
      clock: 0, ticks: 0, battery: [], slots: [], uses: [], made: 0, reveal: null, free: [], ability: '',
      rng: seed | 0, wasted: 0, events: [], shapes: S.patterns.map((p) => shapes(p.cells, S.allowRotatedMatches)),
    };
    for (let k = 0; k < S.slotCount; k++) { st.slots.push(S.loadout && S.loadout[k] != null ? S.loadout[k] : drawPattern(st, S)); st.uses.push(0); }
    setPorts(st, S, S.firstPortSet != null ? S.firstPortSet : Math.floor(rng(st) * S.portSets.length));
    const pool = abilityPool(S);
    st.ability = S.fixedAbility || pool[Math.floor(rng(st) * pool.length)];
    if (st.ability === 'printer') grantFree(st, 1);
    if (S.startFilled) for (const p of st.ports) st.cells[p[0]] = p[1];
    return st;
  }

  // Free prisms (the Printer ability, Universal Translator, 5D Printer) each come with a random domain, drawn when granted
  // (Garrett 2026-10-21: "a random domain and it should follow the cursor"). The Ratel places the first one held.
  function grantFree(st, n) { for (let k = 0; k < n; k++) st.free.push(1 + Math.floor(rng(st) * 3)); }

  function portAt(st, cell) { for (const p of st.ports) if (p[0] === cell) return p[1]; return 0; }
  // What a cell counts as for completing a pattern: its prism, or (empty) its port's colour.
  function shows(st, S, i) { return st.cells[i] !== 0 ? st.cells[i] : S.portsCount ? portAt(st, i) : 0; }
  function batteryCap(st, S) { return S.batteryCap + (st.ability === 'capacitor' ? 2 : 0); }

  // The cells of the first placement of pattern `pid` the board shows, or null. A placement needs at least one real
  // prism (it goes to the battery). Order: rotations, then mirror images (the Mirror ability), each by anchor cell index.
  function match(st, S, pid) {
    const sets = st.ability === 'mirror' ? [st.shapes[pid].rot, st.shapes[pid].mir] : [st.shapes[pid].rot];
    const wild = st.ability === 'wildCore';
    for (const sh of sets) for (let k = 0; k < sh.length; k++) {
      const shape = sh[k];
      for (let a = 0; a < N; a++) {
        const cells = [];
        let ok = true, real = false;
        for (let c = 0; c < shape.length; c++) {
          const i = idx(Q[a] + shape[c][0], R[a] + shape[c][1]);
          if (i < 0) { ok = false; break; }
          if (shows(st, S, i) === shape[c][2] || (wild && i === CENTRE)) { cells.push(i); if (st.cells[i] !== 0) real = true; }
          else { ok = false; break; }
        }
        if (ok && real) return cells;
      }
    }
    return null;
  }

  function spendAp(st, n) {
    if (st.ap + st.bonusAp < n) return false;
    const fromAp = st.ap < n ? st.ap : n;
    st.ap -= fromAp; st.bonusAp -= n - fromAp;
    return true;
  }

  function charge(st, S, colour) {
    const cap = batteryCap(st, S);
    if (cap < 1) return;
    while (st.battery.length >= cap) { const old = st.battery.shift(); st.events.push({ k: 'replaced', colour: old }); }
    st.battery.push(colour);
    st.events.push({ k: 'charge', colour });
  }

  // A made pattern sends one of its real prisms, drawn at random, to the battery.
  function takeRandom(st, S, slot, pid, cells) {
    const real = cells.filter((c) => st.cells[c] !== 0), cell = real[Math.floor(rng(st) * real.length)], colour = st.cells[cell];
    st.cells[cell] = 0;
    st.events.push({ k: 'pick', slot, pid, cell, colour });
    charge(st, S, colour);
  }
  // Empty cells reachable from `from` through empty cells (the Long Reach ability's move).
  function reach(st, from) {
    const seen = new Array(N).fill(false), q = [from]; seen[from] = true;
    for (let h = 0; h < q.length; h++) for (const v of NEIGH[q[h]]) if (!seen[v] && st.cells[v] === 0) { seen[v] = true; q.push(v); }
    seen[from] = false;
    return seen;
  }

  // One seat input. Returns true when it was legal and applied; an illegal input changes nothing.
  function apply(st, S, inp) {
    if (inp.k === 'pick') {   // round 7: the Ratel picks one of the offered abilities; then the new ports are shown
      if (!st.reveal || !st.reveal.offers || !(inp.slot >= 0 && inp.slot < st.reveal.offers.length)) return false;
      takeOffer(st, inp.slot); revealStep(st, S);
      return true;
    }
    if (st.reveal) return false;   // the clock is stopped while the new ability and ports are shown
    switch (inp.k) {
      case 'tinker': {
        if (inp.from < 0 || inp.from >= N || inp.to < 0 || inp.to >= N || inp.from === inp.to || st.cells[inp.from] === 0) return false;
        const full = st.cells[inp.to] !== 0;
        if (full && !(st.ability === 'swap' && isNeighbour(inp.from, inp.to))) return false;
        if (!full && !isNeighbour(inp.from, inp.to) && !(st.ability === 'longReach' && reach(st, inp.from)[inp.to])) return false;
        if (!spendAp(st, 1)) return false;
        const a = st.cells[inp.from]; st.cells[inp.from] = st.cells[inp.to]; st.cells[inp.to] = a;
        st.events.push({ k: 'tinker', from: inp.from, to: inp.to });
        return true;
      }
      case 'refuel': {
        if (inp.cell < 0 || inp.cell >= N || st.cells[inp.cell] !== 0) return false;
        if (st.free.length && inp.colour >= 1 && inp.colour <= 3) {   // a free prism: any empty cell, its own domain, no AP
          if (inp.colour !== st.free[0]) return false;
          st.free.shift(); st.cells[inp.cell] = inp.colour;
          st.events.push({ k: 'place', cell: inp.cell, colour: inp.colour });
          return true;
        }
        const pc = portAt(st, inp.cell);
        if (pc === 0 || !spendAp(st, 1)) return false;
        st.cells[inp.cell] = pc;
        st.events.push({ k: 'refuel', cell: inp.cell, colour: pc });
        return true;
      }

  // Every one of the 39 patterns is cut from the one 3-colouring of the hex grid: colour class k = (q - r) mod 3, and two

  const CLASS = []; for (let i = 0; i < D.N; i++) CLASS.push((((D.Q[i] - D.R[i]) % 3) + 3) % 3);
  // The largest planar crystal on a board: over the six perms, the largest connected set of prisms whose colour equals
  // perm[class]. Ties go to the earlier perm, then the lower cell. Returns { perm, cells, size } (size 0 on an empty board).
  function largestCrystal(cells) {
    let best = { perm: PERMS[0], cells: [], size: 0 };
    for (const perm of PERMS) {
      const seen = new Uint8Array(D.N);
      for (let s = 0; s < D.N; s++) {
        if (seen[s] || !cells[s] || cells[s] !== perm[CLASS[s]]) continue;
        const q = [s]; seen[s] = 1;
        for (let h = 0; h < q.length; h++) for (const n of D.NEIGH[q[h]]) if (!seen[n] && cells[n] && cells[n] === perm[CLASS[n]]) { seen[n] = 1; q.push(n); }
        if (q.length > best.size) best = { perm, cells: q.slice().sort((a, b) => a - b), size: q.length };
      }

  // ================= (4) The hive: snakes, crossings, danger, the solver =================
  // A hive is 37 cells, each { dom, hits, danger } (dom 0 = empty). The other two domains are laid as SNAKES: simple paths
  // snakeMin..snakeMax long. Where two snakes of one colour cross, that cell is SHIELDED (hits 2): the first snake's chain
  // strips the shield and the second's breaks it. Our own domain is the hive's body: never chained, some of it armoured
  // (hits 2). DANGER cells (any domain) go where no snake runs: never chained, and a chain that touches one stings.
  const live = (x, c) => x.dom === c && !x.danger && x.hits > 0;   // a cell a chain of colour c may run through
  // One snake of `colour`: through cell `through` (a crossing) or from a random free cell, grown from either end through
  // free cells. It writes nothing unless it reaches snakeMin.
  function laySnake(dom, hits, rnd, colour, through, Pw) {
    const free = (i) => dom[i] < 0;

    if (through >= 0) path = [through];
    else { const f = []; for (let i = 0; i < D.N; i++) if (free(i)) f.push(i); if (!f.length) return null; path = [f[Math.floor(rnd() * f.length)]]; }
    const len = Pw.snakeMin + Math.floor(rnd() * (Math.max(Pw.snakeMin, Pw.snakeMax) - Pw.snakeMin + 1));
    while (path.length < len) {

        const next = D.NEIGH[end].filter((n) => free(n) && path.indexOf(n) < 0);
        if (next.length) { const n = next[Math.floor(rnd() * next.length)]; if (head) path.push(n); else path.unshift(n); grown = true; }
      }

  function makeHive(rnd, Pw, why) {   // why (optional): counts the reason for each regeneration
    let regenerated = 0;

      for (let h = 0; h < Pw.hiveHoles; h++) dom[rest.splice(Math.floor(rnd() * rest.length), 1)[0]] = 0;

    const arcOf = (bins) => { const R = makeRun(1, { variant: 'hive', who: 'skilled', P, headless: true }); R.bins = bins.slice(); R.t = bins.length * BIN; return score(R).arcCV; };
    out.push(['flat seat reads arc 0', arcOf(new Array(12).fill(3)) === 0]);
    out.push(['on/off spins read arc 1', arcOf([6, 6, 6, 0, 0, 0, 6, 6, 6, 0, 0, 0]) === 1]);
    // Restart, clicked the way a person does: from hive mode, paused, with a hive behind and a toast up
    {
      const seed0 = seed, keepWho = WHO, keepMc = manualClock;
      manualClock = true; WHO = 'human'; reset(seed0);
      world.homeHives.push({ born: 0, source: 'omni', bees: 5, mass: 9 }); world.t = 42; enterHive(world, 'omni'); world.hive.t = 3;
      paused = true; $('pause').textContent = 'Play'; toast('stale'); const before = world, startOld = D.digest(makeRun(seed0, liveCfg()).dyn);
      $('restart').click();
      const fresh = makeRun(seed0 + 1, liveCfg());
      out.push(['Restart starts a new match (next seed, 0 s, building, no hive, empty strip, unpaused)', world !== before && seed === seed0 + 1 && world.t === 0 && world.phase === 'build' && !world.hive && !world.homeHives.length && !world.omni && !world.massHive && !paused && $('pause').textContent === 'Pause' && $('toast').hidden && $('seedTag').textContent === 'seed ' + seed]);
      out.push(['the restarted board is the next seed\'s, not the old opening', D.digest(world.dyn) === D.digest(fresh.dyn) && D.digest(world.dyn) !== startOld]);
      // the freeze itself: a hive that ends inside a step, then a frame drawn before the strip moves on
      reset(seed0); world.omni = { d: 0, born: 0 }; world.target = 'omni'; enterHive(world, 'omni'); leaveHive(world, 'leave');
      let threw = ''; try { render(); } catch (e) { threw = e.message; }
      out.push(['drawing the frame right after a hive ends does not throw' + (threw ? ' (' + threw + ')' : ''), !threw]);
      WHO = keepWho; reset(seed0); paintSeed(); manualClock = keepMc;
    }
    // every hive: three domains, a shield in each, danger, solvable
    let good = 0, regen = 0; const N = 300;
    for (let s = 1; s <= N; s++) { const h = makeHive(mulberry32(s * 977 + 3), P3); if (h && hiveHolds(h.cells, P3).ok && solveHive(h.cells, 3)) good++; if (h) regen += h.regenerated; }
    out.push(['every hive: 3 domains, a shield in each, >= ' + P3.hiveDangerMin + ' danger, solvable (' + good + '/' + N + ', regenerated ' + regen + ')', good === N]);
    const blank = () => { const c = []; for (let i = 0; i < D.N; i++) c.push({ dom: OWN, hits: 1, danger: false }); return c; };
    const a = D.CENTRE, nb = D.NEIGH[a], c1 = OTHERS[0], c2 = OTHERS[1];
    const star = blank(); for (const i of [a, nb[0], nb[2], nb[4]]) star[i] = { dom: c1, hits: 1, danger: false };   // a centre with three leaves
    out.push(['solver catches a planted unsolvable star', solveHive(star, 3) === null]);
    const row = [D.idx(-3, 0), D.idx(-2, 0), D.idx(-1, 0), D.idx(0, 0), D.idx(1, 0)];   // a line of 5; the second is danger
    const through = blank(); row.forEach((i, k) => { through[i] = { dom: c1, hits: 1, danger: k === 1 }; });
    out.push(['solver catches a cell reachable only through danger', solveHive(through, 3) === null]);
    through[row[1]] = { dom: c1, hits: 1, danger: false };
    out.push(['the same line without the danger clears', !!solveHive(through, 3)]);
    const crossing = blank(); for (const i of [nb[0], a, nb[3]]) crossing[i] = { dom: c2, hits: 1, danger: false };   // two snakes crossing at the centre
    for (const i of [nb[1], nb[4]]) crossing[i] = { dom: c2, hits: 1, danger: false }; crossing[a].hits = 2;
    const cs = solveHive(crossing, 3);
    out.push(['solver clears a crossing in two chains through its shield', !!cs && cs.length === 2 && cs.every((p) => p.indexOf(a) >= 0)]);
    // chains in hive mode
    const R = makeRun(3, { variant: 'hive', who: 'human', P: P3, hiveEndsSpin: 'complete', headless: true });
    enterHive(R, 'omni');
    for (let i = 0; i < D.N; i++) R.hive.cells[i] = { dom: OWN, hits: 1, danger: false };
    for (const i of [a, nb[0], nb[3]]) R.hive.cells[i] = { dom: c1, hits: 1, danger: false };
    R.hive.cells[nb[0]].hits = 2;   // shielded
    const dz = nb[1]; R.hive.cells[dz] = { dom: c1, hits: 1, danger: true };
    const far = [D.idx(-3, 3), D.idx(-2, 3), D.idx(-1, 3)]; for (const i of far) R.hive.cells[i] = { dom: c2, hits: 1, danger: false };
    R.hive.total = {}; for (const c of OTHERS) R.hive.total[c] = remaining(R.hive, c);
    applyInput(R, { k: 'chainStart', cell: nb[0] }); applyInput(R, { k: 'chainAdd', cell: a });
    out.push(['a 2-chain is refused at minChain 3', !applyInput(R, { k: 'chainEnd' }) && R.hive.cells[a].hits === 1]);
    out.push(['our own domain refuses a chain', !applyInput(R, { k: 'chainStart', cell: nb[2] })]);
    applyInput(R, { k: 'chainStart', cell: nb[3] }); applyInput(R, { k: 'chainAdd', cell: a }); applyInput(R, { k: 'chainAdd', cell: dz });
    out.push(['danger stings: the chain breaks, nothing destroyed, a stun', R.hive.chain.length === 0 && R.hive.stings === 1 && R.hive.cells[a].hits === 1 && R.hive.cells[nb[3]].hits === 1 && R.hive.stun > 0 && R.hive.cells[dz].danger && !applyInput(R, { k: 'chainStart', cell: a })]);
    R.hive.stun = 0;
    applyInput(R, { k: 'chainStart', cell: nb[0] }); applyInput(R, { k: 'chainAdd', cell: a }); applyInput(R, { k: 'chainAdd', cell: nb[3] }); applyInput(R, { k: 'chainEnd' });
    const pass1 = R.hive.cells[nb[0]].dom === c1 && R.hive.cells[nb[0]].hits === 1 && R.hive.cells[a].dom === 0 && R.hive.cells[nb[3]].dom === 0;
    out.push(['a shield takes the first pass and stays; plain cells break', pass1 && R.hive.done.length === 0]);
    // the stripped cell now stands alone: plant two more so a second chain can take it
    R.hive.cells[a] = { dom: c1, hits: 1, danger: false }; R.hive.cells[nb[3]] = { dom: c1, hits: 1, danger: false };
    applyInput(R, { k: 'chainStart', cell: nb[0] }); applyInput(R, { k: 'chainAdd', cell: a }); applyInput(R, { k: 'chainAdd', cell: nb[3] }); applyInput(R, { k: 'chainEnd' });
    out.push(['the second pass breaks it; the colour completes though its danger cell stands', R.hive.cells[nb[0]].dom === 0 && R.hive.cells[dz].danger && JSON.stringify(R.hive.rewards) === JSON.stringify([c1])]);
    applyInput(R, { k: 'chainStart', cell: far[0] }); applyInput(R, { k: 'chainAdd', cell: far[1] }); applyInput(R, { k: 'chainAdd', cell: far[2] }); applyInput(R, { k: 'chainEnd' });
    out.push(['both done: theirs and ours', JSON.stringify(R.hive.rewards) === JSON.stringify([c1, c2, OWN])]);
    const bat0 = R.dyn.battery.length, cells0 = R.dyn.cells.filter((x) => x).length;
    simStep(R, 0.01, null);   // cleared: hive mode ends, the rewards place themselves
    out.push(['rewards land: 6 prisms, 3 charges (battery capped)', R.phase === 'build' && R.dyn.cells.filter((x) => x).length === cells0 + 3 * P3.rewardDynamo && R.m.rewardPlaced === 6 && R.dyn.battery.length === Math.min(D.batteryCap(R.dyn, R.S), bat0 + 3)]);
    // largestCrystal: an empty board, a planted crystal beside a wrong-coloured blob, a 7-cell crystal against a 4
    const board = new Array(D.N).fill(0);
    out.push(['empty board: crystal size 0', largestCrystal(board).size === 0]);
    const perm = PERMS[3]; for (const i of [a].concat(nb.slice(0, 2))) board[i] = perm[CLASS[i]];
    for (const i of [D.idx(3, -3), D.idx(3, -2), D.idx(2, -2), D.idx(2, -1)]) board[i] = 1;   // all Ruby: neighbours never share a class, so at most one cell of it is a crystal
    const lc = largestCrystal(board);
    out.push(['finds the planted 3-cell crystal', lc.size === 3 && lc.perm === perm]);
    const big = new Array(D.N).fill(0), p7 = PERMS[1], p4 = PERMS[5];   // p4 shares no class colour with p7, so the two never merge
    for (const i of [a].concat(nb)) big[i] = p7[CLASS[i]];
    for (const i of [D.idx(-3, 0), D.idx(-3, 1), D.idx(-2, 1), D.idx(-3, 2)]) big[i] = p4[CLASS[i]];
    const lb = largestCrystal(big);
    out.push(['prefers the 7-cell crystal over a 4-cell one', lb.size === 7 && lb.perm === p7]);
    const slot = crystalSlot(big, lb, p7[CLASS[D.idx(2, 0)]]);
    out.push(['a reward lands on the crystal, in its class', !!slot && slot.tier === 0 && CLASS[slot.cell] === p7.indexOf(p7[CLASS[D.idx(2, 0)]])]);
    const A = runBatch(), B = runBatch();
    out.push(['runBatch deterministic', JSON.stringify(A) === JSON.stringify(B)]);
    return { pass: out.every((r) => r[1]), checks: out };
  }

  // ================= (9) The test surface =================
  window.__lab = {
    LAB, SHIPPED, SPEC, P, OPT, PLATFORM, VARIANTS, PATTERNS, PORT_SETS, core: D,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { dt = dt || DT; n = n || 1; for (let i = 0; i < n; i++) simStep(world, dt, queue.splice(0)); resize(); render(); },
    reset, score: () => score(world), runBatch, setParam, setOpt, record, selfTest,
    input: (inp) => { if (!world) return false; queue.push(inp); return true; },
    seat: (who) => { WHO = who; paintSeat(); reset(); },
    hive: (source) => { if (world && world.V.hives && world.phase === 'build' && !world.dyn.reveal) enterHive(world, source === 'mass' ? 'mass' : 'omni'); return world && world.phase === 'hive'; },
    largestCrystal: (cells) => largestCrystal(cells || world.dyn.cells), crystalSlot, solveHive, makeHive, hiveHolds, CLASS, restart,
    solution: () => (world && world.hive ? world.hive.solution : null),
    cellPx: (i) => (ui.G ? cellPx(ui.G, i) : null), hexSize: () => (ui.G ? ui.G.size : 0), layout: () => ui.layout,
    world: () => world, makeRun, simStep, applyInput,
    state: () => ({ t: world.t, seed, phase: world.phase, digest: D.digest(world.dyn), ap: world.dyn.ap, bonusAp: world.dyn.bonusAp, ability: world.dyn.ability, battery: world.dyn.battery.slice(), free: world.dyn.free.slice(),
      target: world.target, omni: world.omni ? Math.round(world.omni.d) : null, massHive: world.massHive ? Math.round(world.massHive.d) : null, homeHives: world.homeHives.map((h) => ({ bees: h.bees, mass: Math.round(h.mass) })),
      hive: world.hive ? { source: world.hive.source, t: world.hive.t, broken: world.hive.broken, done: world.hive.done.slice(), rewards: world.hive.rewards.slice(), chain: world.hive.chain.slice(), stun: world.hive.stun, stings: world.hive.stings, cells: world.hive.cells.map((c) => (c.danger ? 'd' : '') + c.dom + (c.hits > 1 ? '+' : '')).join(' ') } : null,
      lastHive: world.lastHive, m: Object.assign({}, world.m) }),
  };
  window.__ratelRaidLab = window.__lab;
})();
</script>
