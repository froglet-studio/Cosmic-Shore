<!doctype html>
<!--
  Ratel Raid Lab (round 1) - a /labmaker browser studio for the Ratel's raid, the second game proposed for the Ratel's
  seat of the Honeyguide (Docs/Studios/ONE_THUMB_SEAT_ARCS.md section 3). The Honeyguide finds a hostile hive; the Ratel
  chooses when to raid it; the Dynamo becomes the hive's comb and the Ratel breaks real prisms by dragging chains; then a
  feast (place the honey, pick one of three) and the build goes on. The build is the real Dynamo, copied line for line
  from Docs/Studios/HoneyguideLab.html (script id="dynamo-core") with the round 7 Breath settings: AP bank 6, a pick of
  three abilities. Write-up: Docs/Studios/HONEYGUIDE_RAID_LAB.md. Verify: node .claude/skills/labmaker/verify_lab.cjs <this file>
-->

<style>
  /* Layout: an editor - the stage (the Ratel's phone screen) in the middle, a settings dock on the right, a bottom dock
     for the scorecard, the decision log and what the lab leaves out. Below 900 px everything stacks, stage first. */
  :root {
    --bg: #edf0f3; --panel: #ffffff; --ink: #131a21; --muted: #56626e; --line: #d3d9df;
    --honey: #a96a00; --honey-soft: #f6e3bf; --ok: #1d7444; --warn: #b4560b; --changed: #0a7a93;
    --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0e12; --panel: #11171e; --ink: #e5eaef; --muted: #8e9aa6; --line: #222c36;
      --honey: #ffb21f; --honey-soft: #3a2a08; --ok: #5cc98a; --warn: #f0a050; --changed: #6cc8e0; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0e12; --panel: #11171e; --ink: #e5eaef; --muted: #8e9aa6; --line: #222c36;
    --honey: #ffb21f; --honey-soft: #3a2a08; --ok: #5cc98a; --warn: #f0a050; --changed: #6cc8e0; color-scheme: dark;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-ui); }
  #app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr) 250px;
    grid-template-areas: "head head" "stage dock" "bottom dock"; overflow: hidden; }
  header { grid-area: head; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font: 700 18px/1 var(--f-display); letter-spacing: .02em; margin: 0 6px 0 0; }
  header h1 small { font: 500 11px var(--f-mono); color: var(--muted); letter-spacing: .04em; margin-left: 6px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--ink); font: 500 12px var(--f-ui); padding: 6px 10px; cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--honey); color: #111; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 500 12px var(--f-ui); padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  .btn.primary { background: var(--honey); border-color: var(--honey); color: #111; font-weight: 600; }
  .btn:focus-visible, .seg button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--changed); outline-offset: 1px; }
  select { font: 12px var(--f-ui); padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
  .meta { font: 11px var(--f-mono); color: var(--muted); }
  #diff { color: var(--changed); }
  #stageWrap { grid-area: stage; position: relative; min-height: 0; background: #070a0e; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  #dock { grid-area: dock; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #bottom { grid-area: bottom; border-top: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: transparent; color: var(--muted); font: 600 12px var(--f-ui); padding: 6px 9px; border-bottom: 2px solid transparent; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--honey); }
  .body { overflow: auto; padding: 10px 12px; min-height: 0; flex: 1; }
  .field { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; margin-bottom: 9px; }
  .field > span { font-size: 12px; }
  .field output { font: 12px var(--f-mono); text-align: right; }
  .field output.changed { color: var(--changed); text-decoration: underline; }
  .field input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--honey); }
  .field small { grid-column: 1 / -1; color: var(--muted); font-size: 11px; line-height: 1.35; }
  .grp { font: 700 11px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 8px; }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  .status-ok { color: var(--ok); } .status-warn { color: var(--warn); }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; font: 12px var(--f-mono); font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { font: 600 11px var(--f-ui); color: var(--muted); }
  tr.cand td { background: var(--honey-soft); }
  .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
  .chart { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
  .chart h4 { margin: 0 0 2px; font: 600 12px var(--f-ui); }
  .chart svg { width: 100%; height: 76px; display: block; }
  .chart .ax { font: 9px var(--f-mono); fill: var(--muted); }
  .prose { max-width: 70ch; }
  .prose h3 { font: 700 13px var(--f-display); letter-spacing: .04em; margin: 12px 0 4px; }
  .prose p, .prose li { margin: 0 0 6px; }
  .prose ul { padding-left: 18px; margin: 0 0 8px; }
  textarea { width: 100%; font: 12px var(--f-ui); padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
  #toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(10, 14, 20, .9); color: #f2f5f8; font: 600 12px var(--f-ui);
    padding: 6px 12px; border-radius: 6px; pointer-events: none; max-width: 90%; text-align: center; }
  @media (max-width: 900px) {
    html, body { height: auto; }
    #app { display: flex; flex-direction: column; height: auto; overflow: visible; }
    #stageWrap { height: var(--stageH, 640px); flex: none; }
    #dock { border-left: 0; border-top: 1px solid var(--line); }
    #dock .body, #bottom .body { max-height: none; overflow: visible; }
    .body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

<body>
<div id="app">
  <header>
    <h1>Ratel Raid Lab<small>ROUND 1</small></h1>
    <span class="seg" id="seatSeg" role="group" aria-label="Who plays the Ratel">
      <button data-who="human" aria-pressed="false" title="You play the Ratel: drag prisms, tap ports and cards; on a raid, drag chains">You</button>
      <button data-who="skilled" aria-pressed="true" title="Watch the skilled AI Ratel">AI skilled</button>

<script id="dynamo-core">
/* Copied line for line from Docs/Studios/HoneyguideLab.html (the block of the same id, round 7 working copy, 2026-10-29),
 * with no changes: the Breath settings (apBank 6, the pick of three) are settings, and the raid lives outside the core. */
/* DynamoCore - the Ratel's hex puzzle (the Engineer seat of the Honeyguide), engine-free. ROUND 2 rules (Garrett,
 * 2026-10-21). Inputs are seat inputs and a clock; nothing here draws, reads a device or knows about hulls.
 * Assets/_Scripts/Controller/Vessel/Crew/DynamoCore.cs is still the ROUND 1 core (HoneyguideLab.round1.html, held to it by
 * Tools/Build/dynamo_lab/parity.cjs); it is re-ported from this block once the lab is signed off.
 * Colours: 0 empty, 1 Ruby, 2 Jade, 3 Gold (a prism's domain; the board's prisms ARE the battery's charges).
 * Grid: a radius-3 hexagon of 37 pointy-top cells in axial (q, r), r running DOWN, (0,0) the centre.
 * Round 2: the injection ports turn as one rigid pattern, 60 degrees clockwise a spin; an empty port counts as a prism of
 * its colour for completing a pattern (a real prism must still be in it, for the battery); patterns match in any of the
 * six rotations; a pattern made for the third time is replaced by a random one; every 4 patterns the Ratel draws a new
 * random ability and a new port pattern.
 * Round 3: a made pattern sends a random one of its real prisms to the battery (no pick); the new ability and the new
 * port pattern are revealed one after the other while the spin clock stands still (st.reveal), then the clock restarts.
 * Round 7 (Garrett, 2026-10-29: "lets have the ap cap go to 6. lets do the 3 ability pick as well"): with S.abilityChoices > 1 the
 * draw OFFERS that many abilities (st.reveal.offers) and the Ratel picks one (input 'pick', slot = the offer); the clock stays
 * stopped while it chooses. After S.pickSeconds (> 0) the first offer is taken. The AI picks by AI_PICK_ORDER. */
(function (root) {
  'use strict';
  const RADIUS = 3;
  const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];   // E NE NW W SW SE
  const Q = [], R = [], LUT = new Array(49).fill(-1);
  for (let r = -RADIUS; r <= RADIUS; r++) for (let q = Math.max(-RADIUS, -r - RADIUS); q <= Math.min(RADIUS, -r + RADIUS); q++) { LUT[(q + 3) * 7 + (r + 3)] = Q.length; Q.push(q); R.push(r); }
  const N = Q.length;
  function idx(q, r) { if (q < -3 || q > 3 || r < -3 || r > 3) return -1; return LUT[(q + 3) * 7 + (r + 3)]; }
  const CENTRE = idx(0, 0);
  function ringOf(i) { return Math.max(Math.abs(Q[i]), Math.abs(R[i]), Math.abs(Q[i] + R[i])); }
  const NEIGH = [];
  for (let i = 0; i < N; i++) { const n = []; for (const d of DIRS) { const j = idx(Q[i] + d[0], R[i] + d[1]); if (j >= 0) n.push(j); } NEIGH.push(n); }
  function rot60(i) { return idx(-R[i], Q[i] + R[i]); }   // 60 degrees clockwise on screen about the centre
  function isNeighbour(a, b) { return NEIGH[a].indexOf(b) >= 0; }

  // The Ratel's abilities (one held at a time, redrawn every few patterns). Keys only; the lab owns the words.
  const ABILITIES = ['overclock', 'longReach', 'printer', 'swap', 'freeFire', 'wildCore', 'capacitor', 'mirror', 'refund'];

  // Pattern shapes: cells [[q, r, colour]]; the six rotations, and the six rotations of the mirror image (q <-> r).
  function rotations(cells) {
    const out = [];
    let cur = cells.map((c) => [c[0], c[1], c[2]]);
    for (let k = 0; k < 6; k++) {
      out.push(cur.map((c) => [c[0] - cur[0][0], c[1] - cur[0][1], c[2]]));
      cur = cur.map((c) => [-c[1], c[0] + c[1], c[2]]);
    }
    return out;
  }
  function shapes(cells, allowRotated) {
    const rot = rotations(cells), mir = rotations(cells.map((c) => [c[1], c[0], c[2]]));
    return { rot: allowRotated ? rot : rot.slice(0, 1), mir: allowRotated ? mir : mir.slice(0, 1) };
  }

  function rng(st) {   // mulberry32 over the state's own stream, so a replay of the same inputs draws the same cards
    let a = st.rng | 0; a = a + 0x6D2B79F5 | 0; st.rng = a;
    let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  function pickOther(st, n, not) { if (n <= 1) return 0; let k = Math.floor(rng(st) * (n - 1)); if (k >= not) k++; return k; }
  // Round 7: up to n distinct abilities from the pool, never the one held (unless it is all the pool has), in draw order.
  function drawOffers(st, pool, n) {
    const cand = pool.filter((a) => a !== st.ability), from = cand.length ? cand : pool.slice(), out = [];
    while (out.length < n && from.length) out.push(from.splice(Math.floor(rng(st) * from.length), 1)[0]);
    return out;
  }
  // The AI's pick (proposal): the first of these an offer holds. Overclock and Refund add AP, Free Fire saves it; Mirror and
  // Swap made no measurable difference in round 2; Printer is retired from the shipped draw.
  const AI_PICK_ORDER = ['overclock', 'refund', 'freeFire', 'longReach', 'capacitor', 'wildCore', 'swap', 'mirror', 'printer'];
  function aiPick(offers) { let best = 0; for (let k = 1; k < offers.length; k++) if (AI_PICK_ORDER.indexOf(offers[k]) < AI_PICK_ORDER.indexOf(offers[best])) best = k; return best; }
  // Take offer k: the new ability (and its Printer prism), announced as the old draw was; the reveal goes on to the ports.
  function takeOffer(st, k) {
    const rv = st.reveal;
    st.ability = rv.offers[k]; rv.offers = null;
    if (st.ability === 'printer' && st.free.length < 1) grantFree(st, 1);
    st.events.push({ k: 'shuffle', ability: st.ability, portSet: rv.portSet });
  }

  function drawPattern(st, S) {   // a random pattern not already in a slot
    const cand = [];
    for (let p = 0; p < S.patterns.length; p++) if (!S.patterns[p].parked && st.slots.indexOf(p) < 0) cand.push(p);
    return cand.length ? cand[Math.floor(rng(st) * cand.length)] : -1;
  }
  function setPorts(st, S, k) { st.portSet = k; st.ports = S.portSets[k].map((p) => [p[0], p[1]]); }

  // The abilities a random draw picks from: S.abilities (keys), or every ability.
  function abilityPool(S) { return S.abilities && S.abilities.length ? S.abilities : ABILITIES; }

  function create(S, seed) {
    const st = {
      cells: new Array(N).fill(0), ports: [], portSet: -1, ap: S.apPerTick < S.apBank ? S.apPerTick : S.apBank, bonusAp: 0,
      clock: 0, ticks: 0, battery: [], slots: [], uses: [], made: 0, reveal: null, free: [], ability: '',
      rng: seed | 0, wasted: 0, events: [], shapes: S.patterns.map((p) => shapes(p.cells, S.allowRotatedMatches)),
    };
    for (let k = 0; k < S.slotCount; k++) { st.slots.push(S.loadout && S.loadout[k] != null ? S.loadout[k] : drawPattern(st, S)); st.uses.push(0); }
    setPorts(st, S, S.firstPortSet != null ? S.firstPortSet : Math.floor(rng(st) * S.portSets.length));
    const pool = abilityPool(S);
    st.ability = S.fixedAbility || pool[Math.floor(rng(st) * pool.length)];
    if (st.ability === 'printer') grantFree(st, 1);
    if (S.startFilled) for (const p of st.ports) st.cells[p[0]] = p[1];
    return st;
  }

  // Free prisms (the Printer ability, Universal Translator, 5D Printer) each come with a random domain, drawn when granted
  // (Garrett 2026-10-21: "a random domain and it should follow the cursor"). The Ratel places the first one held.
  function grantFree(st, n) { for (let k = 0; k < n; k++) st.free.push(1 + Math.floor(rng(st) * 3)); }

  function portAt(st, cell) { for (const p of st.ports) if (p[0] === cell) return p[1]; return 0; }
  // What a cell counts as for completing a pattern: its prism, or (empty) its port's colour.
  function shows(st, S, i) { return st.cells[i] !== 0 ? st.cells[i] : S.portsCount ? portAt(st, i) : 0; }
  function batteryCap(st, S) { return S.batteryCap + (st.ability === 'capacitor' ? 2 : 0); }

  // The cells of the first placement of pattern `pid` the board shows, or null. A placement needs at least one real
  // prism (it goes to the battery). Order: rotations, then mirror images (the Mirror ability), each by anchor cell index.
  function match(st, S, pid) {
    const sets = st.ability === 'mirror' ? [st.shapes[pid].rot, st.shapes[pid].mir] : [st.shapes[pid].rot];
    const wild = st.ability === 'wildCore';
    for (const sh of sets) for (let k = 0; k < sh.length; k++) {
      const shape = sh[k];
      for (let a = 0; a < N; a++) {
        const cells = [];
        let ok = true, real = false;
        for (let c = 0; c < shape.length; c++) {
          const i = idx(Q[a] + shape[c][0], R[a] + shape[c][1]);
          if (i < 0) { ok = false; break; }
          if (shows(st, S, i) === shape[c][2] || (wild && i === CENTRE)) { cells.push(i); if (st.cells[i] !== 0) real = true; }
          else { ok = false; break; }
        }
        if (ok && real) return cells;
      }
    }
    return null;
  }

  function spendAp(st, n) {
    if (st.ap + st.bonusAp < n) return false;
    const fromAp = st.ap < n ? st.ap : n;
    st.ap -= fromAp; st.bonusAp -= n - fromAp;
    return true;
  }

  function charge(st, S, colour) {
    const cap = batteryCap(st, S);
    if (cap < 1) return;
    while (st.battery.length >= cap) { const old = st.battery.shift(); st.events.push({ k: 'replaced', colour: old }); }
    st.battery.push(colour);
    st.events.push({ k: 'charge', colour });
  }

  // A made pattern sends one of its real prisms, drawn at random, to the battery.
  function takeRandom(st, S, slot, pid, cells) {
    const real = cells.filter((c) => st.cells[c] !== 0), cell = real[Math.floor(rng(st) * real.length)], colour = st.cells[cell];
    st.cells[cell] = 0;
    st.events.push({ k: 'pick', slot, pid, cell, colour });
    charge(st, S, colour);
  }
  // Empty cells reachable from `from` through empty cells (the Long Reach ability's move).
  function reach(st, from) {
    const seen = new Array(N).fill(false), q = [from]; seen[from] = true;
    for (let h = 0; h < q.length; h++) for (const v of NEIGH[q[h]]) if (!seen[v] && st.cells[v] === 0) { seen[v] = true; q.push(v); }
    seen[from] = false;
    return seen;
  }

  // One seat input. Returns true when it was legal and applied; an illegal input changes nothing.
  function apply(st, S, inp) {
    if (inp.k === 'pick') {   // round 7: the Ratel picks one of the offered abilities; then the new ports are shown
      if (!st.reveal || !st.reveal.offers || !(inp.slot >= 0 && inp.slot < st.reveal.offers.length)) return false;
      takeOffer(st, inp.slot); revealStep(st, S);
      return true;
    }
    if (st.reveal) return false;   // the clock is stopped while the new ability and ports are shown
    switch (inp.k) {
      case 'tinker': {
        if (inp.from < 0 || inp.from >= N || inp.to < 0 || inp.to >= N || inp.from === inp.to || st.cells[inp.from] === 0) return false;
        const full = st.cells[inp.to] !== 0;
        if (full && !(st.ability === 'swap' && isNeighbour(inp.from, inp.to))) return false;
        if (!full && !isNeighbour(inp.from, inp.to) && !(st.ability === 'longReach' && reach(st, inp.from)[inp.to])) return false;
        if (!spendAp(st, 1)) return false;
        const a = st.cells[inp.from]; st.cells[inp.from] = st.cells[inp.to]; st.cells[inp.to] = a;
        st.events.push({ k: 'tinker', from: inp.from, to: inp.to });
        return true;
      }
      case 'refuel': {
        if (inp.cell < 0 || inp.cell >= N || st.cells[inp.cell] !== 0) return false;
        if (st.free.length && inp.colour >= 1 && inp.colour <= 3) {   // a free prism: any empty cell, its own domain, no AP
          if (inp.colour !== st.free[0]) return false;
          st.free.shift(); st.cells[inp.cell] = inp.colour;
          st.events.push({ k: 'place', cell: inp.cell, colour: inp.colour });
          return true;
        }
        const pc = portAt(st, inp.cell);
        if (pc === 0 || !spendAp(st, 1)) return false;
        st.cells[inp.cell] = pc;
        st.events.push({ k: 'refuel', cell: inp.cell, colour: pc });
        return true;
      }
      case 'remove': {   // Garrett 2026-10-21: right-click a prism to delete it, for 1 AP
        if (inp.cell < 0 || inp.cell >= N || st.cells[inp.cell] === 0 || !spendAp(st, 1)) return false;
        const colour = st.cells[inp.cell]; st.cells[inp.cell] = 0;
        st.events.push({ k: 'remove', cell: inp.cell, colour });
        return true;
      }
      case 'activate': {

  }
  function renderLog(box) {
    const t = (box || document).querySelector('#logTable'); if (!t) return;
    const rows = remote.concat(localLog).sort((a, b) => b.createdAt - a.createdAt).slice(0, 50);
    t.innerHTML = '<tr><th>When</th><th>Topic</th><th>Decision</th></tr>';
    for (const d of rows) { const tr = document.createElement('tr'); for (const v of [new Date(d.createdAt).toLocaleString(), d.topic, d.choice]) { const td = document.createElement('td'); td.textContent = v; td.style.textAlign = 'left'; td.style.whiteSpace = 'normal'; tr.appendChild(td); } t.appendChild(tr); }
  }
  function logPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint" id="logStatus"></p><label class="field"><span>Topic</span><select id="logTopic" style="grid-column:1/-1"></select></label><label class="field"><span>Your decision</span><textarea id="logChoice" rows="2" style="grid-column:1/-1"></textarea></label><p><button class="btn primary" id="logSave">Record decision</button> <button class="btn" id="logCopy">Copy log</button></p><div class="tablewrap"><table id="logTable"></table></div>';
    const sel = box.querySelector('#logTopic'); for (const t of TOPICS) { const o = document.createElement('option'); o.textContent = t; sel.appendChild(o); }
    const status = box.querySelector('#logStatus');
    status.textContent = db ? 'Shared log: saved with the lab, read by Claude at the start of the next round.' : 'Kept in this browser (Copy log to send it).';
    status.className = db ? 'hint status-ok' : 'hint status-warn';
    const fill = () => { box.querySelector('#logChoice').value = currentChoice(sel.value); };
    sel.onchange = fill; fill();
    box.querySelector('#logSave').onclick = async () => { const where = await record(sel.value, box.querySelector('#logChoice').value); status.textContent = where === 'shared' ? 'Recorded in the shared log.' : 'Recorded in this browser.'; renderLog(box); };
    box.querySelector('#logCopy').onclick = () => { const t = remote.concat(localLog).map((d) => new Date(d.createdAt).toISOString() + ' · ' + d.topic + ': ' + d.choice + ' ' + JSON.stringify(d.settings)).join('\n'); try { const p = navigator.clipboard && navigator.clipboard.writeText(t); if (p && p.catch) p.catch(() => {}); } catch (e) { /* no clipboard */ } };
    renderLog(box);
    return box;
  }
  (async function connect() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try { db = await c.use('db'); } catch (e) { db = null; }
    try { const u = await c.use('user'); if (u) me = (await u.id()) || ''; } catch (e) { me = ''; }
    if (!db) return;
    try {
      db.collection('decisions').orderBy('createdAt', 'desc').limit(300).onSnapshot((snap) => { remote = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderLog(); }, () => { db = null; });
      for (const d of localLog.splice(0)) { try { await db.collection('decisions').add(d); } catch (e) { localLog.push(d); } }
      lsSet('log', localLog);
    } catch (e) { db = null; }
  })();
  function aboutPanel() {
    const box = document.createElement('div'); box.className = 'prose';
    box.innerHTML = '<h3>The question</h3><p>Garrett, 2026-10-29: the Ratel "is a fun puzzle but it needs something to break up the repetition of pure pattern building"; and then: "show me the raid in an artifact". The raid is the proposal in ONE_THUMB_SEAT_ARCS.md §3: build → a hive is found → the Ratel chooses when → raid → feast → build.</p>' +
      '<h3>How to play the Ratel</h3><ul><li><b>Build</b> (the Dynamo, as in the game): drag a prism along empty cells (1 AP a step), tap a port to inject (1 AP), tap a lit card to make its pattern (1 AP). Hold a prism still (or right-click) to delete it. AP now carries over up to 6.</li>' +
      '<li><b>Pick</b>: every 4 patterns the clock stops and you pick one of three abilities.</li>' +
      '<li><b>Raid</b>: when the Honeyguide finds a hive, the Hive card lights. Tap it when you choose. The board becomes the hive: drag through touching cells of one colour and let go to break them. White-rimmed cells are shielded (two passes), red cells sting, steel cells never break, faint Jade cells are ours.</li>' +
      '<li><b>Feast</b>: the clock stays stopped. Pick one of three and place your honey (free prisms) on empty cells.</li></ul>' +
      '<h3>What this lab does NOT model</h3><ul>' +
      '<li>The Honeyguide. The pilot is a stand-in: it spends a charge about every ' + P.plSlipSeconds + ' s, finds a hive on a seeded clock and holds it with a set chance. Whether a pilot finds and holds hives in the real game, and how the hive is chosen (a hostile surface or volume, PrismscapeTopology.DimensionOf), is not tested.</li>' +
      '<li>The pilot-side card effects. Only the cards that change the Dynamo itself fire (Amanita Furnace, Big Red Button, Dragon Saddle, Zero Point (its drain), Triplesynth, Universal Translator, Anode Ray, 5D Printer, Square-Peg Hammer, Reactor Cilia, Chrono-Compressor, Vorticity Module). The 13 trigger upgrades and the passives do nothing here.</li>' +
      '<li>The hive\'s comb is a seeded stand-in for a projection of real prisms (patches of a domain, holes, shields, danger and super-shielded cells), not a capture of a real structure.</li>' +
      '<li>What the broken prisms are worth to the squad: the scorecard counts them, nothing scores them.</li>' +
      '<li>Sound, haptics, network play and the Honeyguide\'s view while the Ratel raids.</li>' +
      '<li>The AI Ratel is a heuristic: the Honeyguide Lab\'s planner for the build, a longest-chain search for the raid. A person plays differently; the scorecard shows the shape, a phone decides.</li></ul>' +
      '<p class="meta">' + LAB.name + ' round ' + LAB.round + ' · branch ' + LAB.branch + ' · write-up ' + LAB.doc + '</p>';
    return box;
  }
  function rulesPanel() {
    const box = document.createElement('div');
    box.appendChild(selectField('Rules on the live board', 'variant'));
    box.appendChild(selectField('AI Ratel: when to raid', 'aiGo'));
    const p = document.createElement('p'); p.className = 'hint'; p.textContent = 'Candidate = what is underlined when it differs. Every change restarts the live board; the scorecard uses the sliders too.'; box.appendChild(p);
    return box;
  }
  makeTabs('dockTabs', 'dockBody', [
    { name: 'Rules', build: () => { const b = rulesPanel(); b.appendChild(sliderGroup('Dynamo')); return b; } },
    { name: 'Hive', build: () => sliderGroup('Hive') },
    { name: 'Raid', build: () => sliderGroup('Raid') },
    { name: 'Pilot', build: () => sliderGroup('Pilot') },
  ], 'dock');
  makeTabs('bottomTabs', 'bottomBody', [
    { name: 'Scorecard', build: scorecardPanel },
    { name: 'Decisions', build: logPanel },
    { name: 'About', build: aboutPanel },
  ], 'bottom');
  function paintSeat() { for (const b of $('seatSeg').children) b.setAttribute('aria-pressed', String(b.dataset.who === WHO)); }
  for (const b of $('seatSeg').children) b.onclick = () => { WHO = b.dataset.who; lsSet('who', WHO); paintSeat(); reset(); };
  function paintVariant() { const s = $('variant'); if (!s.options.length) for (const [v, t] of Object.entries(OPT_LABELS.variant)) { const o = document.createElement('option'); o.value = v; o.textContent = t; s.appendChild(o); } s.value = OPT.variant; $('hiveNow').disabled = !VARIANTS[OPT.variant].raids; }
  $('variant').onchange = () => setOpt('variant', $('variant').value);
  $('hiveNow').onclick = () => { if (world && world.V.raids && world.phase === 'build' && !world.hive) { world.nextHive = world.t; } };
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Play' : 'Pause'; };
  $('restart').onclick = () => reset();
  $('resetAll').onclick = () => { for (const k of Object.keys(SHIPPED)) P[k] = SHIPPED[k]; Object.assign(OPT, OPT_SHIPPED); lsSet('P', {}); lsSet('opt', OPT); reset(); paintVariant(); makeTabsRefresh(); refreshDiff(); };
  function makeTabsRefresh() { const a = document.querySelector('#dockTabs [aria-selected="true"]'); if (a) a.click(); }
  $('platform').textContent = PLATFORM.device === 'phone' ? 'phone' : 'PC';
  paintSeat(); paintVariant();

  function fitStage() { if (innerWidth > 900) { document.documentElement.style.removeProperty('--stageH'); return; } const h = Math.max(560, innerHeight - document.querySelector('header').offsetHeight); document.documentElement.style.setProperty('--stageH', h + 'px'); }
  function resize() { fitStage(); const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', resize);
  let acc = 0, lastNow = 0;
  function frame(now) {
    const el = lastNow ? Math.min(0.1, (now - lastNow) / 1000) : 0; lastNow = now;
    if (!manualClock) {
      resize(); longPress();
      if (!paused) { acc += el; while (acc >= DT) { simStep(world, DT, queue.splice(0)); acc -= DT; } }
      render();
      if (ui.toastT > 0) { ui.toastT -= el; if (ui.toastT <= 0) $('toast').hidden = true; }
    }
    requestAnimationFrame(frame);
  }
  reset(); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  // Planted cases: the arc yardstick must read a flat seat as 0 and an on/off seat as 1; the chain rules must sting,
  // refuse super-shielded and other-domain cells, and take two passes on a shield.
  function selfTest() {
    const out = [];
    const arcOf = (bins) => { const R = makeRun(1, { variant: 'raid', who: 'skilled', P, aiGo: 'finish', headless: true }); R.bins = bins.slice(); R.t = bins.length * BIN; return score(R).arcCV; };
    out.push(['flat seat reads arc 0', arcOf(new Array(12).fill(3)) === 0]);
    out.push(['on/off spins read arc 1', arcOf([6, 6, 6, 0, 0, 0, 6, 6, 6, 0, 0, 0]) === 1]);
    const R = makeRun(3, { variant: 'raid', who: 'human', P, aiGo: 'finish', headless: true });
    foundHive(R); startRaid(R);
    const cells = R.raid.cells; for (let i = 0; i < D.N; i++) { cells[i].dom = 1; cells[i].kind = 'plain'; }
    const a = D.CENTRE, n = D.NEIGH[a];
    cells[n[0]].kind = 'danger'; cells[n[1]].kind = 'super'; cells[n[2]].dom = 3; cells[n[3]].kind = 'shield';
    applyInput(R, { k: 'chainStart', cell: a });
    out.push(['super-shielded refused', !applyInput(R, { k: 'chainAdd', cell: n[1] })]);
    out.push(['other domain refused', !applyInput(R, { k: 'chainAdd', cell: n[2] })]);
    const ap0 = R.dyn.ap + R.dyn.bonusAp; applyInput(R, { k: 'chainAdd', cell: n[0] });
    out.push(['danger stings and breaks the chain', R.raid.chain.length === 0 && R.m.stings === 1 && R.dyn.ap + R.dyn.bonusAp === Math.max(0, ap0 - P.raidStingAp)]);
    applyInput(R, { k: 'chainStart', cell: a }); applyInput(R, { k: 'chainAdd', cell: n[3] }); applyInput(R, { k: 'chainEnd' });
    out.push(['a shield takes the first pass', cells[n[3]].kind === 'plain' && cells[a].kind === 'empty' && R.m.broken === 1]);
    const A = runBatch(), B = runBatch();
    out.push(['runBatch deterministic', JSON.stringify(A) === JSON.stringify(B)]);
    return { pass: out.every((r) => r[1]), checks: out };
  }

  // ================= (7) The test surface =================
  window.__lab = {
    LAB, SHIPPED, SPEC, P, OPT, PLATFORM, VARIANTS, PATTERNS, PORT_SETS, core: D,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { dt = dt || DT; n = n || 1; for (let i = 0; i < n; i++) simStep(world, dt, queue.splice(0)); resize(); render(); },
    reset, score: () => score(world), runBatch, setParam, setOpt, record,
    input: (inp) => { if (!world) return false; queue.push(inp); return true; },
    seat: (who) => { WHO = who; paintSeat(); reset(); },
    hive: () => { if (world && world.V.raids && world.phase === 'build' && !world.hive) foundHive(world); return !!(world && world.hive); },
    bestChains: () => (world && world.raid ? bestChains(world.raid, world.P.raidMinChain, 5) : []),
    cellPx: (i) => (ui.G ? cellPx(ui.G, i) : null), hexSize: () => (ui.G ? ui.G.size : 0), layout: () => ui.layout,
    world: () => world, makeRun, simStep, applyInput, selfTest,
    state: () => ({ t: world.t, seed, phase: world.phase, digest: D.digest(world.dyn), ap: world.dyn.ap, bonusAp: world.dyn.bonusAp, ability: world.dyn.ability, battery: world.dyn.battery.slice(), free: world.dyn.free.slice(),
      hive: !!world.hive, raid: world.raid ? { t: world.raid.t, broken: world.raid.broken, chain: world.raid.chain.slice(), cells: world.raid.cells.map((c) => c.kind[0] + c.dom).join(' ') } : null,
      feast: world.feast ? { picked: world.feast.picked, options: world.feast.options.map((o) => o.k) } : null, m: Object.assign({}, world.m) }),
  };
  window.__ratelRaidLab = window.__lab;
})();
