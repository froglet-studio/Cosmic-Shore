    box.innerHTML = '<div class="twocol"><div><div class="row"><label for="movers"><span>Moving prisms</span><span class="key">e.g. a black hole\'s bodies</span></label><output id="moversOut">1</output><input type="range" id="movers" min="0" max="400" step="1" value="1"></div><p class="hint">Drag up past ' + C.showcaseMaxMovers + ' and ' + C.boxMaxMovers + ', then back down: each line is crossed downward only at three quarters of it (' + Math.floor(C.showcaseMaxMovers * 3 / 4) + ', ' + Math.floor(C.boxMaxMovers * 3 / 4) + ').</p><canvas id="ladderTrace" width="600" height="70" style="width:100%;height:70px;display:block;"></canvas></div><div class="ladder" id="rungs"></div></div><p class="hint">Burst budget: ' + C.maxLiveBursts + ' alive at once × ' + (12 * C.burstSubdivision * C.burstSubdivision) + ' triangles = ' + (C.maxLiveBursts * 12 * C.burstSubdivision * C.burstSubdivision).toLocaleString() + ' triangles. A level-1 collision past the budget draws the ordinary explosion. The plough moves one prism per ram, so it is always level 1.</p>';
    const rungs = box.querySelector('#rungs');
    const info = [['Level 1 · Showcase', '≤ ' + C.showcaseMaxMovers + ' moving', 'Exact boxes. Each destroyed prism comes apart as a collision burst (this lab), budget permitting.'], ['Level 2 · Plain', '≤ ' + C.boxMaxMovers + ' moving', 'Exact boxes. The ordinary explosion.'], ['Level 3 · Bulk', 'above ' + C.boxMaxMovers, 'Spheres of the prisms\' volumes, in Burst. The ordinary explosion.']];
    info.forEach((r) => { const d = document.createElement('div'); d.className = 'rung'; d.innerHTML = '<b></b><span class="hint"></span><div></div>'; d.querySelector('b').textContent = r[0]; d.querySelector('.hint').textContent = r[1]; d.lastChild.textContent = r[2]; rungs.appendChild(d); });
    const trace = [], cv = box.querySelector('#ladderTrace');
    let level = 1;
    const update = (n) => {
      level = nextLevel(level, n, C.showcaseMaxMovers, C.boxMaxMovers);
      trace.push([n, level]); if (trace.length > 120) trace.shift();
      box.querySelector('#moversOut').textContent = n;
      [...rungs.children].forEach((d, i) => d.dataset.on = String(i + 1 === level));
      const g = cv.getContext('2d'), w = cv.width, h = cv.height, cs = getComputedStyle(document.documentElement);
      g.clearRect(0, 0, w, h);
      g.strokeStyle = cs.getPropertyValue('--line'); g.lineWidth = 1;
      for (const y of [C.showcaseMaxMovers, C.boxMaxMovers]) { const yy = h - y / 400 * h; g.beginPath(); g.moveTo(0, yy); g.lineTo(w, yy); g.stroke(); }
      const cols = ['--ok', '--accent', '--warn'];
      trace.forEach(([v, l], i) => { g.fillStyle = cs.getPropertyValue(cols[l - 1]); g.fillRect(i * w / 120, h - v / 400 * h - 2, w / 120 + 0.5, 4); });
    };
    box.querySelector('#movers').oninput = (e) => update(parseInt(e.target.value, 10));
    queueMicrotask(() => update(1));
    return box;
  }

  // ================= the decision log =================
  let db = null, me = '', remote = [], localLog = lsGet('log', []);
  function snapshot() { return { round: LAB.round, view, domain, changed: diffOnly(), score: score() }; }
  async function record(topic, choice) {
    const doc = { topic, choice, note: '', createdAt: Date.now(), by: me, settings: snapshot() };
    if (db) { try { await db.collection('decisions').add(doc); return 'shared'; } catch (e) { /* fall through */ } }
    localLog.push(doc); lsSet('log', localLog); return 'local';
  }
  function currentChoice() {
    const d = diffOnly(), parts = [];
    parts.push(Object.keys(d).length ? 'Settings: ' + JSON.stringify(d) : 'Settings: shipped');
    if (lastScore) parts.push('Squint: ' + lastScore.filter((r) => !r.control).map((r) => r.name + ' ' + r.squint + ' (' + r.verdict + ')').join('; '));
    return parts.join('\n');
  }
  function logPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint" id="logStatus"></p><div class="twocol"><div><select id="logTopic" aria-label="Topic"><option>Shatter</option><option>Bloom</option><option>Unravel</option><option>Glitter</option><option>Squint verdict</option><option>Ladder</option><option>Overall</option></select><textarea id="logChoice" rows="4" aria-label="Your decision"></textarea><p><button class="btn primary" id="logSave">Record decision</button> <button class="btn" id="logCopy">Copy log</button></p></div><div class="tablewrap"><table id="logTable"></table></div></div>';
    const status = box.querySelector('#logStatus');
    status.textContent = db ? 'Shared log: saved with the lab and readable by Claude at the start of the next round.' : 'Kept in this browser. Use Copy log to send it.';
    status.className = db ? 'ok' : 'warn';
    box.querySelector('#logChoice').value = currentChoice();
    box.querySelector('#logSave').onclick = async () => { const where = await record(box.querySelector('#logTopic').value, box.querySelector('#logChoice').value); status.textContent = where === 'shared' ? 'Recorded in the shared log.' : 'Recorded in this browser.'; renderLog(box); };
    box.querySelector('#logCopy').onclick = () => { const t = remote.concat(localLog).map((d) => new Date(d.createdAt).toISOString() + ' · ' + d.topic + ': ' + d.choice).join('\n'); try { navigator.clipboard.writeText(t).catch(() => {}); } catch (e) { /* refused */ } };
    renderLog(box);
    return box;
  }
  function renderLog(box) {
    const t = (box || document).querySelector('#logTable'); if (!t) return;
    const rows = remote.concat(localLog).sort((a, b) => b.createdAt - a.createdAt).slice(0, 40);
    t.innerHTML = '<tr><th>When</th><th>Topic</th><th>Decision</th></tr>';
    for (const d of rows) { const tr = document.createElement('tr'); for (const v of [new Date(d.createdAt).toLocaleString(), d.topic, d.choice]) { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); } t.appendChild(tr); }
  }
  (async function connect() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try { db = await c.use('db'); } catch (e) { db = null; }
    try { const u = await c.use('user'); if (u) me = (await u.id()) || ''; } catch (e) { me = ''; }
    if (!db) return;
    try { db.collection('decisions').orderBy('createdAt', 'desc').limit(300).onSnapshot((snap) => { remote = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderLog(); }, () => { db = null; }); } catch (e) { db = null; }
  })();

  function aboutPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<div class="twocol"><div><p><b>What you are looking at.</b> When a moving prism runs into another, both are destroyed. While few prisms move (level 1) each comes apart as a collision burst on the ultra-high-res prism instead of the ordinary explosion. The brief: spectacular up close, the explosion when you squint. Line-up shows the shipped explosion beside the four kinds on one prism; Collision plays the real event. Click a label to fly the camera to it.</p><p class="hint" id="aboutSource"></p></div><div><p><b>What this lab does not model</b></p><ul class="plain"><li>Bloom and HDR. The game\'s post-processing makes the hot cracks, glints and embers glow; here they clip to white.</li><li>The explosion\'s own colouring. Both use the burst\'s skin shading (dark face, bright rim). The explosion\'s MOTION and FADE are the shipped graph and HLSL.</li><li>The occlusion corridor (prisms between camera and ship go see-through).</li><li>The real collision test: Collision mode meets at touching x-extents, not the swept box test.</li><li>Shielded, danger and super-shielded tiers (other colour pairs, the danger gain).</li><li>The game\'s float32 clock and a phone GPU\'s precision; frame time on a real device.</li></ul></div></div>';
    box.querySelector('#aboutSource').textContent = LAB.name + ' · round ' + LAB.round + ' · ' + LAB.branch + ' · write-up ' + LAB.doc + ' · the burst runs ' + DATA.sources.burst + '; the explosion\'s fade runs ' + DATA.sources.erosion + '; its motion is ' + DATA.sources.explosionMap + '.';
    return box;
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Squint scorecard', build: scorecardPanel }, { name: 'Ladder', build: ladderPanel }, { name: 'Decisions', build: logPanel }, { name: 'About', build: aboutPanel }], 'bottom');

  // ================= header + transport =================
  $('meta').textContent = 'round ' + LAB.round + ' · the shipped HLSL';
  function setView(v) {
    view = v; lsSet('view', v); cam.focus = -1; cam.dist = 0; saveCam(); clock = loopStart();
    $('viewLineup').setAttribute('aria-pressed', String(v === 'lineup')); $('viewCollision').setAttribute('aria-pressed', String(v === 'collision'));
    labelsEl.replaceChildren();
  }
  $('viewLineup').onclick = () => setView('lineup');
  $('viewCollision').onclick = () => setView('collision');
  let squinting = false;
  function applySquint() { canvas.style.filter = squinting ? 'blur(' + P.labSquint + 'px)' : 'none'; $('squint').setAttribute('aria-pressed', String(squinting)); $('squintTag').hidden = !squinting; labelsEl.style.opacity = squinting ? '0.35' : '1'; }
  $('squint').onclick = () => { squinting = !squinting; applySquint(); };
  function applyCarry() { $('carry').setAttribute('aria-pressed', String(carry)); $('carry').classList.toggle('primary', carry); labelsEl.replaceChildren(); }
  $('carry').onclick = () => { carry = !carry; lsSet('carry', carry); applyCarry(); };
  $('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; };
  $('replay').onclick = () => { labSeed++; clock = loopStart(); playing = true; $('play').textContent = 'Pause'; labelsEl.replaceChildren(); };
  $('scrub').oninput = (e) => { clock = parseFloat(e.target.value); playing = false; $('play').textContent = 'Play'; };
  $('rate').onchange = (e) => { rate = parseFloat(e.target.value); };
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); lsSet('P', {}); for (const k in outputs) outputs[k].inp.value = P[k]; refreshDiff(); applySquint(); };

  // camera: drag to orbit, wheel / pinch to zoom
  function saveCam() { lsSet('cam', { yaw: cam.yaw, pitch: cam.pitch, dist: cam.dist, focus: cam.focus }); }
  const pts = new Map(); let pinch0 = 0;
  canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); canvas.style.cursor = 'grabbing'; });
  canvas.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch0) { cam.dist = camDistance() * pinch0 / d; } pinch0 = d; return; }
    cam.yaw -= (e.clientX - prev[0]) * 0.006; cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch + (e.clientY - prev[1]) * 0.006));
  });
  const up = (e) => { pts.delete(e.pointerId); pinch0 = 0; canvas.style.cursor = 'grab'; saveCam(); };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.dist = camDistance() * Math.exp(e.deltaY * 0.0012); saveCam(); }, { passive: false });

  addEventListener('resize', resize);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) { resize(); if (playing) simStep(dt); render(); }
    requestAnimationFrame(frame);
  }
  setView(view); applySquint(); applyCarry(); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  // ================= the test surface =================
  window.__lab = {
    LAB, SHIPPED, SPEC, P, PLATFORM, DATA, KINDS,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { n = n || 1; for (let i = 0; i < n; i++) simStep(dt); resize(); render(); },
    reset(seed) { labSeed = seed >>> 0 || 0; clock = loopStart(); labelsEl.replaceChildren(); },
    setView, setParam, record, score, runBatch,
    setCarry(v) { carry = !!v; applyCarry(); },
    setClock(t) { clock = t; render(); },
    state: () => ({ t: elapsed, clock, view, seed: labSeed, playing, glError }),
    probeBurstCase, probeExplosionCase, nextLevel, pickKind, resolveFlight,
  };
})();
</script>
</body>
