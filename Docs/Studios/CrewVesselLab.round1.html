<!--
  CREW VESSEL LAB — the first MULTIPLAYER VESSEL, explored before it is built ("Maverick and Goose").
  One hull, two seats: the PILOT flies the 3D world; the NAVIGATOR plays a 2D console that feeds the
  hull, for a player who does not want to process a 3D scene. An empty seat is filled by an AI squad
  mate, and the D-pad swaps seats the way PilotSwap swaps hulls. Built from the /labmaker template:
    (1) LAB meta + SHIPPED   (2) SPEC   (3) THE MODEL (world, pilot AI, four consoles, crew seats)
  Verify:  node .claude/skills/labmaker/verify_lab.cjs Docs/Studios/CrewVesselLab.html
  Write-up: Docs/Studios/CREW_VESSEL_LAB.md

<style>

  header { grid-area: head; display: flex; gap: 10px; align-items: center; padding: 7px max(16px, env(safe-area-inset-right, 0px)) 7px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }

  @media (max-width: 900px) {

    #dock, #bottom { border: 0; border-top: 1px solid var(--line); }
    #dock, #bottom { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);

  // ================= (1) LAB meta + the shipped numbers =================
  const LAB = { name: 'Crew Vessel Lab', branch: 'cece/compassionate-babbage-gc13io', round: 1, doc: 'Docs/Studios/CREW_VESSEL_LAB.md' };
  const SHIPPED = {
    // Flight: the Sparrow's numbers (Assets/_Prefabs/Spacevessels/Sparrow.prefab, VesselTransformer), the fleet's fighter.
    minSpeed: 10,      // DefaultMinimumSpeed 10 (u/s at zero throttle)
    throttleScaler: 25,// DefaultThrottleScaler 25 (u/s added at full throttle: cruise 35)
    yawRate: 80,       // YawScaler 80 (deg/s)
    boostMul: 2,       // lab: speed × while boosting (the game's boost differs per hull)
    boostDrain: 0.5,   // lab: boost meter spent per second of boost
    skimGain: 0.06,    // lab: boost meter per prism skimmed (scaled by Charge)
    skimRadius: 12,    // lab: skimmer reach (u)
    hitRadius: 2.5,    // lab: hull radius for a danger-prism hit (u)
    hitSlow: 0.5,      // lab: speed lost on a danger-prism hit (VesselChangeSpeedByPrismEffectSO stand-in)
    hitSlowSec: 1.0,   // lab: how long that slow lasts (s)
    // World (a stand-in cell)
    cellRadius: 320,   // lab: cell membrane radius (u)
    crystalCount: 10,  // lab: elemental crystals alive at once
    rivalTrail: 160,   // lab: prisms in the rival's danger trail
    catchRadius: 6,    // lab: crystal pickup reach at Space level 0 (u)
    // Elements (ResourceSystem)
    recovery: 0.02,    // ResourceSystem.elementalRecoveryRate (normalized/s: one level per 5 s back into [0,10])
    startLevel: 2,     // lab: every element's starting level
    kTime: 0.5,        // lab: Time = rate. speed × (1 + kTime·L/10)
    kSpace: 1.5,       // lab: Space = reach. catch reach × (1 + kSpace·L/10)
    kCharge: 1.0,      // lab: Charge = energy. boost per skim × (1 + kCharge·L/10)
    kMass: 0.8,        // lab: Mass = size. danger slow × (1 − kMass·L/10)
    // Crew seats
    swapCooldown: 0.75,// PilotSwap.CooldownSeconds (the arena hull swap's debounce)
    swapOrient: 1.0,   // lab: seconds a HUMAN needs to find their bearings after a swap (scorecard proxy)
    pilotFov: 120,     // lab: what the pilot's chase view shows ahead (deg)
    viewRange: 200,    // lab: how far the chase view reads a crystal (u)
    // Console: Gem Feed
    gemCols: 6, gemRows: 6,
    gemBuff: 1,        // lab: temporary levels per gem beyond 2 in a match (ApplyElementalEffect, duration > 0)
    gemDur: 8,         // lab: that buff's duration (s), linear decay
    // Console: Scope Call
    radarRange: 420,   // lab: the navigator's 360° radar (u)
    // Console: Lock & Reel
    lockRange: 100,    // lab: tractor scope range at Space 0 (u); grows with Space
    lockTime: 1.5,     // lab: reticle hold needed to lock (s)
    lockTol: 0.06,     // lab: how close the reticle must sit (console widths)
    reelSpeed: 80,     // lab: how fast a locked crystal flies to the hull (u/s)
    // Console: Power Split
    powerPips: 6,      // lab: power pips the navigator routes (each = +1 held level, never above 10)
  };

  // ================= (2) SPEC: one row per slider =================
  const SPEC = [
    ['Flight', 'minSpeed', 0, 40, 1, 'Minimum speed (u/s)', 'Sparrow DefaultMinimumSpeed: the speed at zero throttle. Brake (S / LT) to tighten a turn.'],
    ['Flight', 'throttleScaler', 5, 80, 1, 'Throttle scaler (u/s)', 'Sparrow DefaultThrottleScaler: added at full throttle. Cruise = minimum + this.'],
    ['Flight', 'yawRate', 30, 200, 5, 'Turn rate (°/s)', 'Sparrow YawScaler. Lower: crystals behind cost more to reach, so the radar matters more.'],
    ['Flight', 'boostMul', 1, 4, 0.1, 'Boost ×', 'Speed multiplier while boosting.'],
    ['Flight', 'boostDrain', 0.1, 2, 0.05, 'Boost drain (/s)', 'Meter spent per second of boost.'],
    ['Flight', 'skimGain', 0, 0.3, 0.01, 'Boost per skim', 'Meter per prism skimmed, before Charge scaling. The Gem Feed also drops one gem per skim.'],
    ['Flight', 'skimRadius', 4, 30, 1, 'Skim reach (u)', 'How near a prism the hull must pass to skim it.'],
    ['Flight', 'hitSlow', 0, 0.9, 0.05, 'Danger slow', 'Speed lost on a danger-prism hit, before Mass.'],
    ['World', 'cellRadius', 180, 600, 10, 'Cell radius (u)', 'The membrane. Bigger: more searching, so more value in seeing.'],
    ['World', 'crystalCount', 3, 30, 1, 'Crystals', 'Crystals alive at once; a caught one respawns elsewhere.'],
    ['World', 'rivalTrail', 0, 400, 10, 'Rival trail', 'Danger prisms in the rival\'s trail. 0 = no danger, no skims.'],
    ['World', 'catchRadius', 2, 20, 0.5, 'Catch reach (u)', 'Pickup reach at Space level 0.'],
    ['Elements', 'recovery', 0, 0.1, 0.005, 'Recovery (norm/s)', 'ResourceSystem.elementalRecoveryRate: overcharge above 10 drains back at this rate.'],
    ['Elements', 'startLevel', 0, 10, 1, 'Start level', 'Every element\'s level at spawn.'],
    ['Elements', 'kTime', 0, 2, 0.05, 'Time → speed', 'Speed gain at Time level 10 (0.5 = +50%).'],
    ['Elements', 'kSpace', 0, 4, 0.1, 'Space → reach', 'Catch-reach gain at Space level 10 (also the Lock & Reel scope range).'],
    ['Elements', 'kCharge', 0, 4, 0.1, 'Charge → boost', 'Boost-per-skim gain at Charge level 10.'],
    ['Elements', 'kMass', 0, 1, 0.05, 'Mass → shrug', 'Danger slow cut at Mass level 10.'],
    ['Seats', 'swapCooldown', 0, 3, 0.05, 'Swap cooldown (s)', 'PilotSwap.CooldownSeconds: no second swap inside this.'],
    ['Seats', 'swapOrient', 0, 4, 0.1, 'Human re-orient (s)', 'Scorecard only: a human proxy gives no input for this long after arriving in a seat.'],
    ['Seats', 'pilotFov', 40, 360, 5, 'Pilot sight (°)', 'The chase view\'s field. 360 = the pilot sees everything (radar becomes useless).'],
    ['Seats', 'viewRange', 60, 500, 10, 'Pilot sight range (u)', 'How far the chase view reads a crystal.'],
    ['Gem Feed', 'gemCols', 4, 9, 1, 'Board columns', 'Restart to apply.'],
    ['Gem Feed', 'gemRows', 4, 9, 1, 'Board rows', 'Restart to apply.'],
    ['Gem Feed', 'gemBuff', 0, 4, 0.25, 'Levels per extra gem', 'A match of n gives gemBuff × (n − 2) temporary levels × the cascade count.'],
    ['Gem Feed', 'gemDur', 1, 30, 0.5, 'Buff duration (s)', 'Temporary: decays linearly to 0 (ApplyElementalEffect with a duration).'],
    ['Scope Call', 'radarRange', 100, 800, 10, 'Radar range (u)', 'The navigator\'s 360° picture.'],
    ['Lock & Reel', 'lockRange', 40, 400, 10, 'Scope range (u)', 'At Space 0; grows with Space like catch reach.'],
    ['Lock & Reel', 'lockTime', 0.1, 3, 0.05, 'Lock hold (s)', 'How long the reticle must sit on a blip.'],
    ['Lock & Reel', 'lockTol', 0.01, 0.2, 0.005, 'Reticle tolerance', 'In console widths.'],
    ['Lock & Reel', 'reelSpeed', 20, 400, 10, 'Reel speed (u/s)', 'A locked crystal flies to the hull at this speed.'],
    ['Power Split', 'powerPips', 0, 12, 1, 'Power pips', 'Held levels the navigator routes between the four elements. Capped so no element is HELD above 10.'],
  ];

  const LS_KEY = 'lab:' + LAB.name + ':P';
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private window */ } };
  const P = Object.assign({}, SHIPPED, lsGet(LS_KEY, {}));
  for (const k of Object.keys(P)) if (!(k in SHIPPED)) delete P[k];

  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const gauss = (rng) => { const u = Math.max(1e-9, rng()), v = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
  const wrapA = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
  const DEG = Math.PI / 180;

  // ================= (3) THE MODEL =================
  // Elements in the HUD's charge → mass → space → time order (the four-icon ability row).
  const EL = ['Charge', 'Mass', 'Space', 'Time'], ELC = ['#f2c14e', '#ff6b4a', '#8f84ff', '#36d39a'];
  const CH = 0, MA = 1, SP = 2, TI = 3;
  // AI difficulty edits BELIEF and reaction (what it sees, when it acts), never the stick (/vessel-ai).
  const SKILL = {
    easy:   { label: 'Easy',   noise: 0.35, react: 0.55, think: 0.9,  avoid: 0.25, cursor: 0.9, jitter: 0.03,  blunder: 0.35, fovMul: 0.8 },
    medium: { label: 'Medium', noise: 0.15, react: 0.30, think: 0.5,  avoid: 0.6,  cursor: 1.6, jitter: 0.012, blunder: 0.12, fovMul: 1.0 },
    hard:   { label: 'Hard',   noise: 0.04, react: 0.15, think: 0.25, avoid: 0.9,  cursor: 2.6, jitter: 0.004, blunder: 0.0,  fovMul: 1.0 },
  };

  let world = null, seed = 7;

  function makeWorld(s, cfg) {
    const R = P.cellRadius;
    const w = {
      t: 0, seed: s, cfg, nextId: 1,
      rngW: mulberry32(s * 9301 + 1), rngP: mulberry32(s * 7919 + 11), rngN: mulberry32(s * 104729 + 5), rngF: mulberry32(s * 31337 + 3),
      hull: { x: 0, y: -R * 0.5, th: Math.PI / 2, speed: cruiseSpeed(), boost: 0.3, slowT: 0, boosting: false, flash: 0 },
      el: { base: [P.startLevel, P.startLevel, P.startLevel, P.startLevel], temp: [], held: [0, 0, 0, 0] },
      crystals: [], prisms: [], rival: null,
      caught: 0, reeled: 0, hits: 0, skims: 0, swaps: 0, navPresses: 0, waypoint: -1, pilotTarget: -1, reel: null,
      seats: { pilot: seatFrom(cfg.pilot), nav: seatFrom(cfg.nav) },
      swapT: cfg.swapEvery || 0, swapCool: 0, con: {}, navIn: { cx: 0.5, cy: 0.5, hold: false, press: false },
      log: [],
    };
    for (let i = 0; i < P.crystalCount; i++) spawnCrystal(w);
    const rr = w.rngW;
    w.rival = { x: (rr() - 0.5) * R, y: R * 0.3 * rr(), th: rr() * 6.283, gx: 0, gy: 0, acc: 0 };
    newRivalGoal(w);
    for (let i = 0; i < 1400; i++) stepRival(w, 1 / 30);   // pre-roll so the trail exists at t = 0
    CON[cfg.console].init(w);
    return w;
  }
  function seatFrom(o) { return { who: o.who, skill: o.skill || 'medium', human: !!o.human, orient: 0, q: [], thinkT: 0, target: -1, noise: 0, avoidRoll: 1, plan: null, cur: { x: 0.5, y: 0.5 }, jx: 0, jy: 0, prevHold: false, clickT: 0 }; }

  function spawnCrystal(w) {
    const R = P.cellRadius * 0.85, h = w.hull, rng = w.rngW;
    let x = 0, y = 0;
    for (let k = 0; k < 6; k++) { const r = R * Math.sqrt(rng()), a = rng() * 6.283; x = Math.cos(a) * r; y = Math.sin(a) * r; if (Math.hypot(x - h.x, y - h.y) > 60) break; }
    w.crystals.push({ id: w.nextId++, x, y, e: Math.floor(rng() * 4) % 4, state: 'free' });
  }
  const crystalById = (w, id) => { for (const c of w.crystals) if (c.id === id) return c; return null; };

  function newRivalGoal(w) { const r = P.cellRadius * 0.8 * Math.sqrt(w.rngW()), a = w.rngW() * 6.283; w.rival.gx = Math.cos(a) * r; w.rival.gy = Math.sin(a) * r; }
  function stepRival(w, dt) {
    const v = w.rival, sp = 30;
    if (Math.hypot(v.gx - v.x, v.gy - v.y) < 30) newRivalGoal(w);
    const err = wrapA(Math.atan2(v.gy - v.y, v.gx - v.x) - v.th);
    v.th += clamp(err, -1.05 * dt, 1.05 * dt);
    v.x += Math.cos(v.th) * sp * dt; v.y += Math.sin(v.th) * sp * dt;
    v.acc += sp * dt;
    if (v.acc >= 6) {
      v.acc -= 6;
      if (P.rivalTrail > 0) { w.prisms.push({ x: v.x, y: v.y, skimT: -9 }); while (w.prisms.length > P.rivalTrail) w.prisms.shift(); }
      else w.prisms.length = 0;
    }
  }

  // Element levels: base (crystals; drains back into [0,10]) + temporary buffs (decay) + held power (never above 10).
  function levels(w) {
    const L = w.el.base.slice();
    for (const b of w.el.temp) L[b.e] += b.mag * (1 - b.age / b.dur);
    for (let i = 0; i < 4; i++) L[i] += Math.min(w.el.held[i], Math.max(0, 10 - L[i]));
    return L;
  }
  const lv = (L) => clamp(L, -5, 15) / 10;
  function addTemp(w, e, mag, dur) { if (mag > 0 && dur > 0) w.el.temp.push({ e, mag, dur, age: 0 }); }
  function stepElements(w, dt) {
    const step = P.recovery * 10 * dt, b = w.el.base;
    for (let i = 0; i < 4; i++) { if (b[i] > 10) b[i] = Math.max(10, b[i] - step); else if (b[i] < 0) b[i] = Math.min(0, b[i] + step); }
    const t = w.el.temp;
    for (let i = t.length - 1; i >= 0; i--) { t[i].age += dt; if (t[i].age >= t[i].dur) t.splice(i, 1); }
  }
  const cruiseSpeed = () => P.minSpeed + P.throttleScaler;
  const catchReach = (L) => P.catchRadius * Math.max(0.2, 1 + P.kSpace * lv(L[SP]));
  const scopeRange = (L) => P.lockRange * Math.max(0.2, 1 + P.kSpace * lv(L[SP]));

  function catchCrystal(w, c, how) {
    const i = w.crystals.indexOf(c); if (i < 0) return;
    w.crystals.splice(i, 1);
    w.caught++; if (how === 'reel') w.reeled++;
    w.el.base[c.e] += 1;                                   // one crystal = one petal (SkimmerAdjustElementLevelByCrystalEffectSO)
    if (w.waypoint === c.id) w.waypoint = -1;
    if (w.reel === c.id) w.reel = null;
    CON[w.cfg.console].onCatch(w, c.e);
    spawnCrystal(w);
  }

  function stepHull(w, inp, dt) {
    const h = w.hull, L = levels(w), R = P.cellRadius;
    h.th = wrapA(h.th + clamp(inp.steer, -1, 1) * P.yawRate * DEG * dt);
    const thr = inp.throttle == null ? 1 : clamp(inp.throttle, 0, 1);
    let sp = (P.minSpeed + P.throttleScaler * thr) * Math.max(0.2, 1 + P.kTime * lv(L[TI]));
    h.boosting = !!inp.boost && h.boost > 0.02;
    if (h.boosting) { sp *= P.boostMul; h.boost = Math.max(0, h.boost - P.boostDrain * dt); }
    if (h.slowT > 0) { h.slowT -= dt; sp *= 1 - P.hitSlow * (1 - P.kMass * clamp(lv(L[MA]), 0, 1)); }
    h.speed = sp;

    const r = Math.hypot(h.x, h.y);
    if (r > R) {                                           // the membrane turns you back in

      let dx = Math.cos(h.th), dy = Math.sin(h.th); const d = dx * nx + dy * ny;

    if (h.flash > 0) h.flash -= dt;
    // prisms: skim (boost, gem) or hit (slow, prism destroyed)
    const sk2 = P.skimRadius * P.skimRadius, hit2 = P.hitRadius * P.hitRadius;
    for (let i = w.prisms.length - 1; i >= 0; i--) {
      const p = w.prisms[i], dx = p.x - h.x, dy = p.y - h.y, d2 = dx * dx + dy * dy;
      if (d2 > sk2) continue;
      if (d2 < hit2) { w.prisms.splice(i, 1); h.slowT = P.hitSlowSec; h.flash = 0.25; w.hits++; continue; }
      if (w.t - p.skimT > 1) { p.skimT = w.t; w.skims++; h.boost = Math.min(1, h.boost + P.skimGain * Math.max(0, 1 + P.kCharge * lv(L[CH]))); CON[w.cfg.console].onSkim(w); }

    const reach = catchReach(L);
    for (let i = w.crystals.length - 1; i >= 0; i--) {
      const c = w.crystals[i];

      if (Math.hypot(c.x - h.x, c.y - h.y) < reach) catchCrystal(w, c, 'fly');

  }

  // ---------------- the PILOT seat's AI: writes the same {steer, boost} a gamepad does ----------------
  function perceives(w, seat, c) {
    const h = w.hull, dx = c.x - h.x, dy = c.y - h.y, d = Math.hypot(dx, dy);
    if (d < 40) return true;
    if (d > P.viewRange) return false;
    return Math.abs(wrapA(Math.atan2(dy, dx) - h.th)) <= P.pilotFov * DEG * 0.5 * SKILL[seat.skill].fovMul;
  }
  function travelCost(w, x, y) { const h = w.hull, d = Math.hypot(x - h.x, y - h.y), b = Math.abs(wrapA(Math.atan2(y - h.y, x - h.x) - h.th)); return d + b * (cruiseSpeed() / (P.yawRate * DEG)); }
  function pilotAI(w, seat, dt) {
    const S = SKILL[seat.skill], h = w.hull, rng = w.rngP, R = P.cellRadius;
    seat.thinkT -= dt;
    if (seat.thinkT <= 0) {
      seat.thinkT = S.think * (0.8 + 0.4 * rng());
      let tgt = -1;
      const wp = w.waypoint >= 0 && !w.cfg.ignoreCalls ? crystalById(w, w.waypoint) : null;
      if (wp && wp.state === 'free') tgt = wp.id;            // the navigator's call wins
      else {
        let best = 1e9;
        for (const c of w.crystals) { if (c.state !== 'free' || !perceives(w, seat, c)) continue; const k = travelCost(w, c.x, c.y); if (k < best) { best = k; tgt = c.id; } }
      }
      seat.target = tgt; w.pilotTarget = tgt;
      seat.noise = gauss(rng) * S.noise; seat.avoidRoll = rng();
    }
    const tg = seat.target >= 0 ? crystalById(w, seat.target) : null, r = Math.hypot(h.x, h.y);
    let desired, dist = 0;
    const outward = h.x * Math.cos(h.th) + h.y * Math.sin(h.th) > 0;
    if (r > R * 0.93 && outward && !(tg && Math.hypot(tg.x, tg.y) > R * 0.88)) desired = Math.atan2(-h.y, -h.x);

      if (!seat.roam || Math.hypot(seat.roam.x - h.x, seat.roam.y - h.y) < 40 || w.t > seat.roam.until) {
        const rr = R * 0.7 * Math.sqrt(rng()), a = rng() * 6.283; seat.roam = { x: Math.cos(a) * rr, y: Math.sin(a) * rr, until: w.t + 12 };
      }
      desired = Math.atan2(seat.roam.y - h.y, seat.roam.x - h.x);
    }
    const err = wrapA(desired - h.th);
    let steer = clamp(err / 0.35, -1, 1);
    if (seat.avoidRoll < S.avoid) {
      let nb = 0, nd = 1e9;
      for (const p of w.prisms) { const dx = p.x - h.x, dy = p.y - h.y, d = Math.hypot(dx, dy); if (d > 45 || d >= nd) continue; const b = wrapA(Math.atan2(dy, dx) - h.th); if (Math.abs(b) < 0.3) { nd = d; nb = b; } }

    }
    const boost = !!tg && Math.abs(err) < 0.2 && dist > 70 && h.boost > 0.15;
    // brake into a turn the hull cannot make at cruise: a target inside the turn circle is orbited forever otherwise
    const turnR = cruiseSpeed() / (P.yawRate * DEG);
    const throttle = tg && Math.abs(err) > 0.5 && dist < turnR * 2.2 ? 0 : 1;
    seat.q.push({ t: w.t, steer, boost, throttle });
    while (seat.q.length > 1 && seat.q[1].t <= w.t - S.react) seat.q.shift();
    return { steer: seat.q[0].steer, boost: seat.q[0].boost, throttle: seat.q[0].throttle };
  }

  // ---------------- the NAVIGATOR seat's AI cursor: the same {cx, cy, hold} a mouse writes ----------------
  function navCursor(seat, gx, gy, dt) {
    const S = SKILL[seat.skill], c = seat.cur, tx = gx + seat.jx, ty = gy + seat.jy;
    const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy), s = S.cursor * dt;
    if (d <= s) { c.x = tx; c.y = ty; } else { c.x += dx / d * s; c.y += dy / d * s; }

  }
  function refreshJitter(w, seat) { const S = SKILL[seat.skill]; seat.jx = gauss(w.rngN) * S.jitter; seat.jy = gauss(w.rngN) * S.jitter; }

  function clickWhen(seat, near, dt) { seat.clickT -= dt; if (near && seat.clickT <= 0) { seat.clickT = 0.12; return true; } return false; }

  // heading-up scope projection, shared by the radar, the tractor scope and the pilot's view
  function toScope(w, x, y, range) {
    const h = w.hull, dx = x - h.x, dy = y - h.y, c = Math.cos(h.th), s = Math.sin(h.th);

  }

  // ================= the four NAVIGATOR consoles (plus the empty seat) =================
  const CON = {};
  CON.off = {
    name: 'Empty seat (solo)', short: 'Solo', reads: '—', economy: '—',
    blurb: 'No navigator. The baseline every console is measured against.',
    init() {}, step() {}, ai: (w, seat) => ({ cx: seat.cur.x, cy: seat.cur.y, hold: false }), onSkim() {}, onCatch() {}, render() {},
  };

  // ---- Gem Feed: the pilot's skims and catches drop gems; the navigator swaps to match; matches are temporary buffs.
  CON.gem = {
    name: 'Gem Feed', short: 'Gem', reads: 'none (board only)', economy: 'temporary buffs (decay)',
    blurb: 'Every skim drops a random gem and every crystal a gem of its element into a match board. Swap neighbours to line up 3+; a match buffs that element for a while. No 3D at all: the pilot\'s flying is the feed.',
    init(w) { const C = Math.round(P.gemCols), Rw = Math.round(P.gemRows); w.con = { C, R: Rw, g: Array.from({ length: C }, () => new Array(Rw).fill(-1)), sel: null, last: 0, matches: 0, jams: 0, bounces: 0, pops: [] }; },
    cell(w, x, y) { const k = w.con, cs = 0.92 / Math.max(k.C, k.R), x0 = 0.5 - cs * k.C / 2, y0 = 0.5 - cs * k.R / 2; const c = Math.floor((x - x0) / cs), r = k.R - 1 - Math.floor((y - y0) / cs); return (c >= 0 && c < k.C && r >= 0 && r < k.R) ? [c, r] : null; },
    centre(w, c, r) { const k = w.con, cs = 0.92 / Math.max(k.C, k.R), x0 = 0.5 - cs * k.C / 2, y0 = 0.5 - cs * k.R / 2; return [x0 + (c + 0.5) * cs, y0 + (k.R - 1 - r + 0.5) * cs]; },
    drop(w, e) {
      if (w.cfg.sever) return;
      const k = w.con; let bestC = -1, bestH = 1e9;
      for (let i = 0; i < k.C; i++) { const c = (k.last + 1 + i) % k.C; const hgt = k.g[c].indexOf(-1); if (hgt >= 0 && hgt < bestH) { bestH = hgt; bestC = c; } }
      if (bestC < 0) { k.jams++; return; }
      k.g[bestC][bestH] = e; k.last = bestC;
      this.resolve(w);
    },
    onSkim(w) { this.drop(w, Math.floor(w.rngF() * 4) % 4); },
    onCatch(w, e) { this.drop(w, e); },
    runs(k) {
      const mark = Array.from({ length: k.C }, () => new Array(k.R).fill(false)), runs = [];
      for (let r = 0; r < k.R; r++) for (let c = 0; c < k.C;) { const e = k.g[c][r]; let n = 1; while (e >= 0 && c + n < k.C && k.g[c + n][r] === e) n++; if (e >= 0 && n >= 3) { runs.push({ e, n }); for (let i = 0; i < n; i++) mark[c + i][r] = true; } c += n; }
      for (let c = 0; c < k.C; c++) for (let r = 0; r < k.R;) { const e = k.g[c][r]; let n = 1; while (e >= 0 && r + n < k.R && k.g[c][r + n] === e) n++; if (e >= 0 && n >= 3) { runs.push({ e, n }); for (let i = 0; i < n; i++) mark[c][r + i] = true; } r += n; }
      return { runs, mark };
    },
    resolve(w) {
      const k = w.con;
      for (let combo = 1; combo < 10; combo++) {
        const { runs, mark } = this.runs(k);
        if (!runs.length) return;
        for (const run of runs) { addTemp(w, run.e, P.gemBuff * (run.n - 2) * combo, P.gemDur); k.matches++; k.pops.push({ e: run.e, t: w.t, n: run.n * combo }); }
        for (let c = 0; c < k.C; c++) { const col = k.g[c].filter((e, r) => e >= 0 && !mark[c][r]); while (col.length < k.R) col.push(-1); k.g[c] = col; }
      }
    },
    swapMakesMatch(k, a, b) { const ea = k.g[a[0]][a[1]], eb = k.g[b[0]][b[1]]; if (ea < 0 || eb < 0 || ea === eb) return 0; k.g[a[0]][a[1]] = eb; k.g[b[0]][b[1]] = ea; const { runs } = this.runs(k); k.g[a[0]][a[1]] = ea; k.g[b[0]][b[1]] = eb; let n = 0; for (const r of runs) n += r.n; return n; },
    step(w, inp) {
      const k = w.con; if (k.pops.length && w.t - k.pops[0].t > 1.2) k.pops.shift();
      if (!inp.press) return;
      const cell = this.cell(w, inp.cx, inp.cy);
      if (!cell || (k.sel && cell[0] === k.sel[0] && cell[1] === k.sel[1])) { k.sel = null; return; }
      if (!k.sel || k.g[k.sel[0]][k.sel[1]] < 0) { k.sel = k.g[cell[0]][cell[1]] >= 0 ? cell : null; return; }
      if (Math.abs(cell[0] - k.sel[0]) + Math.abs(cell[1] - k.sel[1]) !== 1) { k.sel = k.g[cell[0]][cell[1]] >= 0 ? cell : null; return; }

    },
    ai(w, seat, dt) {
      const S = SKILL[seat.skill], k = w.con;

        seat.thinkT = S.think * (0.8 + 0.4 * w.rngN());

    },
    render(w, ctx, x0, y0, s) {
      const k = w.con, cs = 0.92 / Math.max(k.C, k.R);
      for (let c = 0; c < k.C; c++) for (let r = 0; r < k.R; r++) {

        ctx.strokeStyle = 'rgba(160,190,210,.12)'; ctx.lineWidth = 1; ctx.strokeRect(px - half, py - half, half * 2, half * 2);

      }

      k.pops.forEach((p, i) => { ctx.fillStyle = ELC[p.e]; ctx.fillText('+' + EL[p.e] + ' ×' + p.n, x0 + 4, y0 + 12 + i * 13); });

  };

  // ---- Scope Call: a 360° radar of what the chase view cannot see; the navigator calls a crystal and it becomes the pilot's waypoint.
  CON.scope = {
    name: 'Scope Call', short: 'Scope', reads: 'a 2D map (heading-up radar)', economy: 'none (steering calls only)',
    blurb: 'A heading-up radar shows every crystal within range, behind and beside the hull. Tap one to call it; it becomes the pilot\'s waypoint (an arrow on the pilot view; the AI pilot follows it). The navigator plans; the pilot executes.',
    init(w) { w.con = { calls: 0 }; },
    onSkim() {}, onCatch() {},
    pick(w, x, y, range, tol) { let best = null, bd = tol; for (const c of w.crystals) { if (c.state !== 'free') continue; const p = toScope(w, c.x, c.y, range); if (p.d > range) continue; const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = c; } } return best; },
    step(w, inp) { if (!inp.press) return; const c = this.pick(w, inp.cx, inp.cy, P.radarRange, 0.05); if (c) { w.waypoint = c.id; w.con.calls++; } },
    value(w, c, skill) {
      const k = skill === 'easy' ? Math.hypot(c.x - w.hull.x, c.y - w.hull.y) : travelCost(w, c.x, c.y);

    ai(w, seat, dt) {

        const cur = w.waypoint >= 0 ? crystalById(w, w.waypoint) : null;

    },
  };

  // ---- Lock & Reel: hold a reticle on a drifting blip until it locks; the crystal is reeled into the hull.
  CON.lock = {
    name: 'Lock & Reel', short: 'Lock', reads: 'a moving 2D scope', economy: 'crystals caught as usual (one petal each)',
    blurb: 'A short-range heading-up scope; blips drift as the pilot turns. Hold the reticle on one until the ring closes and the tractor reels it in. The navigator extends the hull\'s reach (and Space extends the scope).',
    init(w) { w.con = { lockId: -1, prog: 0, locks: 0 }; },
    onSkim() {}, onCatch() {},
    step(w, inp, dt) {
      const k = w.con, range = scopeRange(levels(w));

    ai(w, seat, dt) {

      if ((!seat.plan || seat.thinkT <= 0) && w.reel == null) {
        seat.thinkT = S.think * (0.8 + 0.4 * w.rngN());

        for (const c of w.crystals) {
          if (c.state !== 'free') continue; const q = toScope(w, c.x, c.y, range); if (q.d > range) continue;

      if (seat.plan && w.reel == null) { const c = crystalById(w, seat.plan.id), q = toScope(w, c.x, c.y, range), d = navCursor(seat, q.x, q.y, dt); hold = d < P.lockTol * 0.9; }

    },
    render(w, ctx, x0, y0, s) {

    box.innerHTML = '<p id="aboutHead"></p><p><b>The question.</b> A multiplayer vessel puts two players in one hull. The pilot flies the 3D world; the navigator plays a 2D console that feeds the hull, for a player who does not want to process a 3D scene. Which console should the first one (Maverick and Goose) carry, how should an AI fill the empty seat, and does a D-pad seat swap feel like trading places with a squad mate?</p>' +
      '<p class="hint"><b>What this lab does NOT model.</b></p><ul class="plain hint">' +
      '<li>The pilot view is a 2D top-down stand-in for the 3D chase camera. The chase view\'s limits are modelled as a forward sight cone (pilotFov, viewRange).</li>' +
      '<li>Element effects are stand-ins that follow the element conventions (Time = rate → speed, Space = reach → catch reach, Charge = energy → boost per skim, Mass = size → shrugging off danger). No real hull\'s four abilities are modelled, and no ability fires.</li>' +
      '<li>One hull, one rival AI, no game mode and no scoring rule. Petals per minute is the yardstick.</li>' +
      '<li>The rival\'s trail recycles its oldest prism. The game conserves mass; this lab does not.</li>' +
      '<li>Two players in one hull does not exist in the game. Today one Player flies one vessel, and PilotSwap only exchanges hulls. Ownership, replication, score credit and which machine runs the console are not modelled.</li>' +
      '<li>Human players are proxied in the scorecard by AI skill levels, plus a guessed re-orientation time after a swap (swapOrient).</li></ul>';
    box.querySelector('#aboutHead').textContent = LAB.name + ' · round ' + LAB.round + ' · ' + LAB.branch + ' · write-up: ' + LAB.doc;
    return box;
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Scorecard', build: scorecardPanel }, { name: 'Consoles', build: conceptsPanel }, { name: 'Decisions', build: logPanel }, { name: 'About', build: aboutPanel }], 'lab:' + LAB.name + ':bottom');

  $('title').textContent = LAB.name; $('meta').textContent = 'round ' + LAB.round + ' · Maverick and Goose';
  let paused = false;
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
  $('restart').onclick = () => reset();
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); lsSet(LS_KEY, {}); for (const k in outputs) if (outputs[k].inp.isConnected) outputs[k].inp.value = P[k]; reset(); refreshDiff(); };

  // ================= sizing + loop (fixed 60 Hz sub-steps; manual clock for recorders) =================
  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now(), acc = 0;
  const DT = 1 / 60;
  function frame(now) {
    const el = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) {
      pollPad(); resize();
      if (!paused) { acc += el; while (acc >= DT) { simStepWorld(world, DT, LIVE); acc -= DT; } }
      if (toastT > 0) { toastT -= el; if (toastT <= 0) $('toast').hidden = true; }
      render();
    }
    requestAnimationFrame(frame);
  }
  reset(); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  window.__lab = {
    LAB, SHIPPED, SPEC, P, PLATFORM, CON, SKILL, crew,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { dt = dt || DT; n = n || 1; for (let i = 0; i < n; i++) simStepWorld(world, dt, LIVE); resize(); render(); },
    reset, score: () => score(), runBatch, runOne, makeWorld, simStepWorld, crystalById, setParam, record, requestSwap,
    state: () => ({ t: world.t, seed, console: world.cfg.console, pilot: seatName(world.seats.pilot), nav: seatName(world.seats.nav), caught: world.caught, hits: world.hits, swaps: world.swaps, levels: levels(world).map((x) => +x.toFixed(2)) }),
  };
})();
</script>
