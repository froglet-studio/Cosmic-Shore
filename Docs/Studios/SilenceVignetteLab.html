<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);

  // ================= (1) LAB meta + the shipped numbers =================
  const LAB = { name: 'Silence Vignette Lab', branch: 'cece/sleepy-shannon-9qk646', round: 1, doc: 'Docs/Studios/SILENCE_VIGNETTE_LAB.md' };
  // Every key is a VesselSilenceConfigSO field, read off Assets/Resources/VesselSilenceConfig.asset
  // (the "overtuned" first cut of the overlay, 2026-10-21). Lab-only knobs carry the lab* prefix.
  const SHIPPED = {
    vignetteIntensity: 0.75,      // VesselSilenceConfigSO.vignetteIntensity (peak overlay opacity)
    vignetteColorStrength: 1,     // .vignetteColorStrength (black .. the palette's danger colour)
    vignetteDarken: 0.3,          // .vignetteDarken (URP Vignette, black, under the colour)
    vignetteSmoothness: 0.55,     // .vignetteSmoothness (that darkening's URP smoothness)
    vignetteStyle: 0,             // .vignetteStyle (0 Soft, 1 Faceted)
    vignetteFacets: 10,           // .vignetteFacets
    vignetteInner: 0.55,          // .vignetteInner
    vignetteFeather: 0.5,         // .vignetteFeather
    vignetteRoundness: 0.25,      // .vignetteRoundness
    vignetteFill: 1,              // .vignetteFill
    vignetteRimStrength: 0.35,    // .vignetteRimStrength
    vignetteRimWidth: 0.04,       // .vignetteRimWidth
    vignetteBreatheDepth: 0.25,   // .vignetteBreatheDepth
    vignetteBreatheHz: 0.8,       // .vignetteBreatheHz
    vignetteHitPulse: 0.35,       // .vignetteHitPulse
    vignetteHitPulseSeconds: 0.35,// .vignetteHitPulseSeconds
    vignetteFadeInSeconds: 0.15,  // .vignetteFadeInSeconds
    vignetteFadeOutSeconds: 0.6,  // .vignetteFadeOutSeconds
    onsetShakeIntensity: 0.45,    // .onsetShakeIntensity (world units, CustomCameraController.Shake)
    onsetShakeSeconds: 0.35,      // .onsetShakeSeconds
    hitShakeIntensity: 0.2,       // .hitShakeIntensity
    hitShakeSeconds: 0.15,        // .hitShakeSeconds
    secondsPerPetal: 1,           // .secondsPerPetal
    maxSeconds: 8,                // .maxSeconds
    labHitsPerSecond: 1.2,        // lab: how often the stand-in rival lands a hit while firing
  };
  // OriginalColorSetSO.asset (the live palette, Docs/PALETTE.md §1).
  const PALETTE = {
    sky: [0, 0, 0.102],                                   // EnvironmentColors.SkyColor
    danger: [1.4979111, 0.0058463, 0.0068495],            // EnvironmentColors.Danger (HDR; the game normalises it)
    jade: { base: [0, 0.16, 0.34], rim: [0, 0.5884546, 1.1353014] },
    ruby: { base: [0.11906711, 0.006783697, 0.30817598], rim: [0.5490196, 0, 1.4980392] },
    gold: { base: [0.23899364, 0.124818474, 0], rim: [0.9964046, 0.4048625, 0.0185709] },
  };
  // SO_ColorSet.GetDangerSignalColor: the rim's hue with its brightest channel driven to 1.
  const DANGER = (() => { const c = PALETTE.danger, p = Math.max(...c); return c.map((x) => x / p); })();

  // ================= (2) SPEC: one row per slider =================
  const SPEC = [
    ['Edge',   'vignetteIntensity',      0, 1, 0.01, 'Strength', 'Peak opacity of the danger-coloured edge while silenced. The overlay ADDS colour, so it shows on black space.'],
    ['Edge',   'vignetteColorStrength',  0, 1, 0.01, 'Danger colour', '1 = the palette\'s danger signal colour (the rim every danger prism wears); toward 0 it darkens to black.'],
    ['Edge',   'vignetteDarken',         0, 1, 0.01, 'Darken under it', 'URP Vignette, black, under the colour: helps the edge read over a bright scene. On its own it is invisible on black space.'],
    ['Edge',   'vignetteSmoothness',  0.01, 1, 0.01, 'Darken smoothness', 'URP smoothness of that darkening.'],
    ['Shape',  'vignetteStyle',          0, 1, 1,    'Style (0 soft, 1 faceted)', 'Soft: a smooth ellipse. Faceted: a polygonal window, the prisms\' language.'],
    ['Shape',  'vignetteFacets',         3, 16, 1,   'Facets', 'Sides of the faceted window.'],
    ['Shape',  'vignetteInner',          0, 1.5, 0.01, 'Starts at', '0 = the centre of the screen, 1 = the top and bottom edges.'],
    ['Shape',  'vignetteFeather',        0, 1.5, 0.01, 'Feather', 'How far the edge takes to reach full strength.'],
    ['Shape',  'vignetteRoundness',      0, 1, 0.01, 'Roundness', '0 = the screen\'s own ellipse; 1 = a circle in pixels (reaches the top and bottom first).'],
    ['Shape',  'vignetteFill',           0, 1, 0.01, 'Fill', 'Opacity of the outer fill. 0 leaves only the rim line.'],
    ['Shape',  'vignetteRimStrength',    0, 1, 0.01, 'Rim line', 'A bright line along the edge\'s inner boundary.'],
    ['Shape',  'vignetteRimWidth',       0, 0.3, 0.005, 'Rim width', 'Half-width of that line.'],
    ['Motion', 'vignetteBreatheDepth',   0, 1, 0.01, 'Breathe depth', 'How far the edge dips and returns while silenced.'],
    ['Motion', 'vignetteBreatheHz',      0, 4, 0.05, 'Breaths / s', 'Speed of the breathing.'],
    ['Motion', 'vignetteHitPulse',       0, 1, 0.01, 'Hit flare', 'Extra opacity each hit adds while silenced, decaying.'],
    ['Motion', 'vignetteHitPulseSeconds', 0.05, 2, 0.01, 'Flare decay (s)', 'Time for a flare to fall to a third.'],
    ['Motion', 'vignetteFadeInSeconds',  0, 2, 0.05, 'Fade in (s)', 'How fast the edge rises when a silence lands.'],
    ['Motion', 'vignetteFadeOutSeconds', 0, 3, 0.05, 'Fade out (s)', 'How long it drains when the silence ends.'],
    ['Motion', 'onsetShakeIntensity',    0, 1.5, 0.01, 'Onset shake', 'Camera shake when a silence begins (world units; shown here as an approximate pixel offset).'],
    ['Motion', 'onsetShakeSeconds',      0, 1, 0.01, 'Onset shake (s)', 'Its decay time.'],
    ['Motion', 'hitShakeIntensity',      0, 1, 0.01, 'Hit shake', 'A lighter shake on each further hit.'],
    ['Motion', 'hitShakeSeconds',        0, 1, 0.01, 'Hit shake (s)', 'Its decay time.'],
    ['Silence', 'secondsPerPetal',       0, 3, 0.05, 'Seconds per petal', 'A hit silences for its worth: points / 10 x 4 elements x this.'],
    ['Silence', 'maxSeconds',            0, 15, 0.5, 'Ceiling (s)', 'The most silence one pilot carries.'],
    ['Silence', 'labHitsPerSecond',      0.1, 4, 0.1, 'Rival hit rate (lab)', 'Hits a second the stand-in rival lands while "Rival firing" is on.'],
  ];

  const LS_KEY = 'lab:' + LAB.name + ':P';
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private window */ } };
  const P = Object.assign({}, SHIPPED, lsGet(LS_KEY, {}));
  for (const k of Object.keys(P)) if (!(k in SHIPPED)) delete P[k];

  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ================= (3) THE MODEL =================
  // <mask-twin> SilenceVignetteMask.cs, line for line. Tools/Build/silence_vignette_parity extracts this block.
  const MASK = (() => {
    const StyleFaceted = 1;
    const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
    const lerp = (a, b, t) => a + (b - a) * clamp01(t);
    const repeat = (t, length) => t - Math.floor(t / length) * length;
    function smoothStep(a, b, x) {
      if (b <= a) return x >= a ? 1 : 0;
      const t = clamp01((x - a) / (b - a));
      return t * t * (3 - 2 * t);
    }
    function distance(u, v, aspect, s) {
      const x = (u - 0.5) * 2 * lerp(1, Math.max(0.01, aspect), clamp01(s.roundness));
      const y = (v - 0.5) * 2;
      const r = Math.sqrt(x * x + y * y);
      if (s.style !== StyleFaceted || s.facets < 3) return r;
      const seg = 2 * Math.PI / s.facets;
      const start = Math.PI * 0.5 - seg * 0.5;
      const a = repeat(Math.atan2(y, x) - start, seg) - seg * 0.5;
      return r * Math.cos(a);
    }
    function alpha(u, v, aspect, s) {
      const d = distance(u, v, aspect, s);
      const fill = smoothStep(s.inner, s.inner + Math.max(0, s.feather), d) * clamp01(s.fill);
      let rim = 0;
      if (s.rimStrength > 0 && s.rimWidth > 0)
        rim = clamp01(1 - Math.abs(d - s.inner) / s.rimWidth) * clamp01(s.rimStrength);
      return clamp01(fill + rim);
    }
    function breathe(time, depth, hz) {
      if (depth <= 0 || hz <= 0) return 1;
      const wave = 0.5 + 0.5 * Math.cos(2 * Math.PI * hz * time);
      return 1 - clamp01(depth) * (1 - wave);
    }
    function opacity(mask, weight, intensity, breatheValue, pulse) {
      return clamp01(mask) * clamp01(clamp01(weight) * clamp01(intensity) * breatheValue + Math.max(0, pulse));
    }
    return { distance, alpha, breathe, opacity };
  })();
  // </mask-twin>

  // The shape the mask reads, from the lab's settings (VesselSilenceConfigSO.VignetteShape).
  function shapeOf(p) {
    return { style: Math.round(p.vignetteStyle), facets: Math.round(p.vignetteFacets), inner: p.vignetteInner,
      feather: p.vignetteFeather, roundness: p.vignetteRoundness, fill: p.vignetteFill,
      rimStrength: p.vignetteRimStrength, rimWidth: p.vignetteRimWidth };
  }
  // URP's UberPost ApplyVignette (Universal RP 17): input * lerp(color, 1, pow(saturate(1 - dot(d, d)), smoothness*5)),
  // d = |uv - centre| * intensity*3, d.x *= aspect when rounded. Round 0 shipped it in danger red; it now only darkens.
  function urpFactor(u, v, aspect, intensity, smoothness, rounded) {
    let dx = Math.abs(u - 0.5) * intensity * 3, dy = Math.abs(v - 0.5) * intensity * 3;
    if (rounded) dx *= aspect;
    const t = Math.max(0, Math.min(1, 1 - (dx * dx + dy * dy)));
    return Math.pow(t, smoothness * 5);
  }

  // ---- the silence timeline: the game's own rules, so the edge is judged in motion ----
  // VesselSilence.SecondsForPoints / Extend; SilenceScreenFeedback.Update (MoveTowards weight, SmoothStep drive,
  // pulse decay exp(-dt / seconds), onset vs per-hit shake).
  const HIT = { bullet: 1, strike: 8, shockwave: 10, debuff: 12, blast: 20, direct: 30 };   // CombatHitDrain.PointsFor
  let world = null, seed = 7;
  function reset(s) {
    if (s != null) seed = s >>> 0;
    world = { t: 0, rnd: mulberry32(seed), left: 0, weight: 0, pulse: 0, shakeLeft: 0, shakeDur: 0, shakeAmp: 0,
              hits: 0, onsets: 0, nextHit: 0, auto: world ? world.auto : true, hold: world ? world.hold : false, flashes: [] };
    world.nextHit = 0.6;
  }
  function shake(amp, dur) {
    if (amp <= 0 || dur <= 0) return;
    if (world.shakeLeft > 0 && amp < world.shakeAmp * (world.shakeLeft / world.shakeDur)) return;   // a stronger one keeps playing
    world.shakeAmp = amp; world.shakeDur = dur; world.shakeLeft = dur;
  }
  function hit(kind) {
    const pts = HIT[kind] || 1;
    const add = pts / 10 * 4 * P.secondsPerPetal;
    if (add <= 0 || P.maxSeconds <= 0) return;
    const onset = world.weight <= 0.0001;
    world.left = Math.min(P.maxSeconds, Math.max(0, world.left) + add);
    world.hits++;
    if (onset) { world.onsets++; shake(P.onsetShakeIntensity, P.onsetShakeSeconds); }
    else { shake(P.hitShakeIntensity, P.hitShakeSeconds); world.pulse = Math.min(1, world.pulse + P.vignetteHitPulse); }
    world.flashes.push({ t: world.t, kind });
  }
  function simStep(dt) {
    const w = world;
    w.t += dt;
    if (w.auto && !w.hold) {
      w.nextHit -= dt;
      if (w.nextHit <= 0) {
        hit(w.rnd() < 0.12 ? 'shockwave' : 'bullet');
        w.nextHit = (0.5 + w.rnd()) / Math.max(0.1, P.labHitsPerSecond);
      }
    }
    if (w.hold) w.left = Math.max(w.left, 1);
    w.left = Math.max(0, w.left - dt);
    const silenced = w.left > 0;
    const secs = silenced ? P.vignetteFadeInSeconds : P.vignetteFadeOutSeconds;
    const target = silenced ? 1 : 0;
    w.weight = secs > 0 ? (w.weight < target ? Math.min(target, w.weight + dt / secs) : Math.max(target, w.weight - dt / secs)) : target;
    w.pulse = P.vignetteHitPulseSeconds > 0 ? w.pulse * Math.exp(-dt / P.vignetteHitPulseSeconds) : 0;
    if (w.weight <= 0.0001) w.pulse = 0;
    w.shakeLeft = Math.max(0, w.shakeLeft - dt);
    w.flashes = w.flashes.filter((f) => w.t - f.t < 0.25);
  }
  const smooth = (x) => x * x * (3 - 2 * x);

  // ---- the stand-in Dog Fight: the shipped palette, drawn deterministically from a seed ----
  const BACKDROPS = [
    { key: 'space', name: 'Open space (Dog Fight)' },
    { key: 'bright', name: 'Bright cell' },
    { key: 'danger', name: 'Busy mass + danger prisms' },
  ];
  let backdrop = lsGet('lab:' + LAB.name + ':backdrop', 'space');
  if (!BACKDROPS.some((b) => b.key === backdrop)) backdrop = 'space';
  const css = (c, a) => 'rgba(' + Math.round(Math.min(1, c[0]) * 255) + ',' + Math.round(Math.min(1, c[1]) * 255) + ',' + Math.round(Math.min(1, c[2]) * 255) + ',' + (a == null ? 1 : a) + ')';
  function drawBackdrop(g, w, h, kind, sd, t) {
    const rnd = mulberry32(sd * 977 + kind.length);
    g.fillStyle = css(PALETTE.sky); g.fillRect(0, 0, w, h);
    // a faint far field of specks
    g.fillStyle = 'rgba(160,180,255,0.35)';

      const rows = runBatch(), t = box.querySelector('#scoreTable');
      const best = (k, hi) => (hi ? Math.max : Math.min)(...rows.filter((r) => !/control|Round 0/.test(r.variant)).map((r) => r[k]));
      t.innerHTML = '<tr><th>Look</th><th>Edge: open space</th><th>Edge: bright cell</th><th>Edge: danger prisms</th><th>Centre</th><th>Red added (space)</th></tr>';
      const hiKeys = { edgeSpace: 1, edgeBright: 1, edgeDanger: 1, redSpace: 1 }, bests = {};
      for (const k of ['edgeSpace', 'edgeBright', 'edgeDanger', 'centre', 'redSpace']) bests[k] = best(k, !!hiKeys[k]);
      for (const r of rows) {
        const tr = document.createElement('tr'), cells = [r.variant, r.edgeSpace, r.edgeBright, r.edgeDanger, r.centre, r.redSpace];
        cells.forEach((v, i) => { const td = document.createElement('td'); td.textContent = v; if (i) td.className = 'num'; tr.appendChild(td); });
        ['edgeSpace', 'edgeBright', 'edgeDanger', 'centre', 'redSpace'].forEach((k, i) => { if (!/control|Round 0/.test(r.variant) && r[k] === bests[k]) tr.children[i + 1].classList.add('best'); });
        if (/Round 0/.test(r.variant)) tr.children[1].classList.add('bad');
        t.appendChild(tr);
      }
      const off = rows[0], r0 = rows[1], sh = rows[2];
      const ok = off.edgeSpace === 0 && off.centre === 0 && r0.edgeSpace < 4 && sh.edgeSpace > 10 * Math.max(0.1, r0.edgeSpace);
      box.querySelector('#yard').textContent = (ok ? 'Yardstick check passed: ' : 'Yardstick check FAILED: ') + 'Off reads ' + off.edgeSpace + ' / ' + off.centre + ' (must be 0), Round 0 reads ' + r0.edgeSpace + ' on open space (must be under 4, near the just-noticeable difference of about 2: nobody saw it), Shipped reads ' + sh.edgeSpace + '.';
      box.querySelector('#yard').className = 'hint ' + (ok ? 'status-ok' : 'status-warn');
    };
    return box;
  }
  function exportPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint">Your settings as the lines of Assets/Resources/VesselSilenceConfig.asset that would change. Record a decision and Claude ports it; this is for reading.</p><pre class="export" id="exportText"></pre><button class="btn" id="exportCopy" type="button">Copy lines</button>';
    const d = diffOnly(), keys = Object.keys(d).filter((k) => !k.startsWith('lab'));
    box.querySelector('#exportText').textContent = keys.length ? keys.map((k) => '  ' + k + ': ' + d[k]).join('\n') : '(no change from the shipped asset)';
    box.querySelector('#exportCopy').onclick = () => { try { navigator.clipboard.writeText(box.querySelector('#exportText').textContent).catch(() => {}); } catch (e) { /* refused */ } };
    return box;
  }
  function aboutPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p id="aboutLine"></p>'
      + '<p class="hint"><strong>Why an overlay.</strong> URP\'s Vignette multiplies the frame by its colour, so a red one only darkens. Over the arena\'s near-black space that is invisible; Round 0 shipped exactly that and Garrett saw nothing in Dog Fight. The game now draws the edge as an overlay in the palette\'s danger colour (it adds colour), with an optional black URP darkening under it.</p>'
      + '<p class="hint"><strong>What this lab does NOT model.</strong> The scene is a 2D stand-in drawn in the shipped palette, not the game\'s 3D render: no bloom, no tonemapping, no HDR, no HUD. The URP darkening uses URP 17\'s formula without its colour grading. The shake is an approximate pixel offset (1 world unit at the chase camera taken as 1/40 of the height). The rival\'s hits are a seeded schedule, not an AI. Phones draw the same overlay; the game\'s mobile render path is not modelled.</p>';
    box.querySelector('#aboutLine').textContent = LAB.name + ' · round ' + LAB.round + ' · ' + LAB.branch + ' · write-up: ' + LAB.doc + ' · the mask is SilenceVignetteMask.cs, line for line';
    return box;
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Scorecard', build: scorecardPanel }, { name: 'Decisions', build: logPanel }, { name: 'To Unity', build: exportPanel }, { name: 'About', build: aboutPanel }], 'lab:' + LAB.name + ':bottom');

  // ================= header, stage buttons =================
  $('title').textContent = LAB.name; $('meta').textContent = 'round ' + LAB.round;
  for (const b of BACKDROPS) { const o = document.createElement('option'); o.value = b.key; o.textContent = b.name; $('backdrop').appendChild(o); }
  $('backdrop').value = backdrop;
  $('backdrop').onchange = () => { backdrop = $('backdrop').value; lsSet('lab:' + LAB.name + ':backdrop', backdrop); };
  let paused = false;
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
  $('resetAll').onclick = () => applyPreset({});
  $('hitBullet').onclick = () => hit('bullet');
  $('hitRocket').onclick = () => hit('shockwave');
  $('silence4').onclick = () => { const onset = world.weight <= 0.0001; world.left = Math.min(P.maxSeconds || 4, Math.max(world.left, 4)); if (onset) { world.onsets++; shake(P.onsetShakeIntensity, P.onsetShakeSeconds); } };
  function syncToggles() { $('autoRival').classList.toggle('on', world.auto); $('hold').classList.toggle('on', world.hold); }
  $('autoRival').onclick = () => { world.auto = !world.auto; syncToggles(); };
  $('hold').onclick = () => { world.hold = !world.hold; syncToggles(); };

  // ================= sizing + loop =================
  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) { resize(); if (!paused) simStep(dt); render(); }
    requestAnimationFrame(frame);
  }
  reset(); syncToggles(); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  window.__lab = {
    LAB, SHIPPED, SPEC, P, PLATFORM, VARIANTS, MASK, PALETTE, DANGER,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { dt = dt || 1 / 60; n = n || 1; for (let i = 0; i < n; i++) simStep(dt); resize(); render(); },
    reset, score, runBatch, setParam, record, hit,
    state: () => ({ t: world.t, seed, left: world.left, weight: world.weight, pulse: world.pulse, hits: world.hits, onsets: world.onsets, backdrop }),
  };
})();
</script>
</body>
