  sure and still fits the game (Docs/ElementalAbilitySystem/SILENCE.md §5)?
  The mask is a line-for-line twin of Assets/_Scripts/Controller/FX/SilenceVignetteMask.cs (between the
  <mask-twin> markers), and the 3D perimeter's layout and shard geometry are a twin of SilencePerimeter.cs
  (between the <perimeter-twin> markers); Tools/Build/silence_vignette_parity/run.sh holds both together. Every SHIPPED
  key is a VesselSilenceConfigSO field (Assets/Resources/VesselSilenceConfig.asset).
  Write-up: Docs/Studios/SILENCE_VIGNETTE_LAB.md. Live: https://claude.ai/artifact/Hequw1VLdwXi2ztrDeuXQC

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);

  // ================= (1) LAB meta + the shipped numbers =================
  const LAB = { name: 'Silence Vignette Lab', branch: 'cece/sleepy-shannon-9qk646', round: 4, doc: 'Docs/Studios/SILENCE_VIGNETTE_LAB.md' };
  // Every key is a VesselSilenceConfigSO field, read off Assets/Resources/VesselSilenceConfig.asset
  // (the "overtuned" first cut of the overlay, 2026-10-21). Lab-only knobs carry the lab* prefix.
  const SHIPPED = {
    vignetteIntensity: 0.6,       // VesselSilenceConfigSO.vignetteIntensity (the 2D edge, drawn UNDER the shards so the pull drags it)
    vignetteColorStrength: 1,     // .vignetteColorStrength (black .. the palette's danger colour)
    vignetteDarken: 0,            // .vignetteDarken (URP Vignette, black, under the colour; off with the 2D edge)
    vignetteSmoothness: 0.55,     // .vignetteSmoothness (that darkening's URP smoothness)
    vignetteStyle: 1,             // .vignetteStyle (0 Soft, 1 Faceted; 4 facets = a frame that hugs the screen's border)
    vignetteFacets: 4,            // .vignetteFacets
    vignetteInner: 0.93,          // .vignetteInner (where the edge starts with little silence left: a thin band)
    vignetteFeather: 0.07,        // .vignetteFeather
    vignetteRoundness: 0,         // .vignetteRoundness
    vignetteDeepInner: 0.6,       // .vignetteDeepInner (where the edge starts at full depth)
    vignetteFill: 1,              // .vignetteFill
    vignetteRimStrength: 0.3,     // .vignetteRimStrength
    vignetteRimWidth: 0.015,      // .vignetteRimWidth
    vignetteBreatheDepth: 0.25,   // .vignetteBreatheDepth
    vignetteBreatheHz: 0.8,       // .vignetteBreatheHz
    vignetteHitPulse: 0.35,       // .vignetteHitPulse
    vignetteHitPulseSeconds: 0.35,// .vignetteHitPulseSeconds
    vignetteFadeInSeconds: 0.15,  // .vignetteFadeInSeconds
    vignetteFadeOutSeconds: 0.6,  // .vignetteFadeOutSeconds
    onsetShakeIntensity: 0.45,    // .onsetShakeIntensity (world units, CustomCameraController.Shake)
    onsetShakeSeconds: 0.35,      // .onsetShakeSeconds
    hitShakeIntensity: 0.2,       // .hitShakeIntensity
    hitShakeSeconds: 0.15,        // .hitShakeSeconds
    depthFullSeconds: 8,          // .depthFullSeconds (seconds of silence left that reach full depth)
    depthFollowSeconds: 0.25,     // .depthFollowSeconds (how fast depth catches up, 0 -> 1)
    secondsPerPetal: 1,           // .secondsPerPetal
    maxSeconds: 8,                // .maxSeconds
    perimeterAmount: 1,           // .perimeterAmount (the 3D perimeter: 0 off .. 1 full)
    perimeterShape: 0,            // .perimeterShape (0 crystal shards, 1 prism slabs)
    perimeterCount: 160,          // .perimeterCount
    perimeterSeed: 7,             // .perimeterSeed
    perimeterSize: 0.1,           // .perimeterSize (shard length with little silence left, x the screen's height)
    perimeterReach: 0.03,         // .perimeterReach (how far a centre may sink with little silence left, x half the height)
    perimeterDeepSize: 0.38,      // .perimeterDeepSize (shard length at full depth)
    perimeterDeepReach: 0.22,     // .perimeterDeepReach (sink at full depth)
    perimeterSpin: 0.35,          // .perimeterSpin (radians a second)
    perimeterRefraction: 0.14,    // .perimeterRefraction
    perimeterTwist: 0.9,          // .perimeterTwist
    perimeterAberration: 0.02,    // .perimeterAberration
    perimeterTint: 0.25,          // .perimeterTint
    perimeterRimGlow: 0.6,        // .perimeterRimGlow
    perimeterEdgeGlow: 0.05,      // .perimeterEdgeGlow
    perimeterFill: 0.1,           // .perimeterFill
    perimeterInvert: 0,           // .perimeterInvert
    perimeterOpacity: 0.95,       // .perimeterOpacity
    perimeterWarp: 0.08,          // .perimeterWarp
    perimeterGlitch: 0.06,        // .perimeterGlitch
    perimeterPull: 0.08,          // .perimeterPull
    perimeterStreak: 0.012,       // .perimeterStreak
    perimeterTipFade: 0.85,       // .perimeterTipFade
    perimeterPullDrift: 0.12,     // .perimeterPullDrift (radians a second around the screen)
    labHitsPerSecond: 1.2,        // lab: how often the stand-in rival lands a hit while firing
  };
  // OriginalColorSetSO.asset (the live palette, Docs/PALETTE.md §1).
  const PALETTE = {
    sky: [0, 0, 0.102],                                   // EnvironmentColors.SkyColor
    danger: [1.4979111, 0.0058463, 0.0068495],            // EnvironmentColors.Danger (HDR; the game normalises it)
    jade: { base: [0, 0.16, 0.34], rim: [0, 0.5884546, 1.1353014] },
    ruby: { base: [0.11906711, 0.006783697, 0.30817598], rim: [0.5490196, 0, 1.4980392] },
    gold: { base: [0.23899364, 0.124818474, 0], rim: [0.9964046, 0.4048625, 0.0185709] },
  };
  // SO_ColorSet.GetDangerSignalColor: the rim's hue with its brightest channel driven to 1.
  const DANGER = (() => { const c = PALETTE.danger, p = Math.max(...c); return c.map((x) => x / p); })();

  // ================= (2) SPEC: one row per slider =================
  const SPEC = [
    ['Perimeter', 'perimeterAmount',      0, 1, 0.01, 'Amount', '0 = off. The 3D perimeter: faceted shards on the screen\'s edge, each facet showing the frame behind it bent - reality breaking. Drawn only for the silenced pilot.'],
    ['Perimeter', 'perimeterShape',       0, 1, 1,    'Shape (0 crystal, 1 prism slab)', 'Crystal: pointed shards. Prism slab: broken pieces of a trail, the prisms\' own boxes.'],
    ['Perimeter', 'perimeterCount',       4, 160, 1,  'Shards', 'How many shards ring the screen. Many, so they overlap in layers and no one of them reads as a crystal.'],
    ['Perimeter', 'perimeterSeed',        1, 99, 1,   'Arrangement', 'Reshuffles where the shards sit and how each is cut.'],
    ['Perimeter', 'perimeterSize',     0.02, 0.6, 0.01, 'Size (thin)', 'Shard length with little silence left, as a share of the screen\'s height.'],
    ['Perimeter', 'perimeterDeepSize', 0.02, 0.8, 0.01, 'Size (deep)', 'Shard length at full depth: the more seconds of silence, the longer they grow.'],
    ['Perimeter', 'perimeterDeepReach',   0, 0.6, 0.01, 'Sink (deep)', 'How far in a shard\'s centre may sink at full depth.'],
    ['Perimeter', 'perimeterReach',       0, 0.6, 0.01, 'Sink (thin)', 'Each shard\'s centre sits on the screen\'s edge, half of it beyond; this is how far in a centre may sink (share of half the height).'],
    ['Perimeter', 'perimeterSpin',        0, 3, 0.05, 'Spin', 'How fast each shard turns about its long axis (radians a second).'],
    ['Perimeter', 'perimeterRefraction',  0, 0.3, 0.005, 'Refraction', 'How far each facet bends the frame it shows (by the facet\'s normal).'],
    ['Perimeter', 'perimeterTwist',       0, 1, 0.01, 'Twist', 'How much each shard turns and scales the reality it shows.'],
    ['Perimeter', 'perimeterAberration',  0, 0.04, 0.001, 'Aberration', 'Red and blue pulled apart inside the facets.'],
    ['Perimeter', 'perimeterTint',        0, 1, 0.01, 'Danger tint', 'How much the bent frame takes the danger colour.'],
    ['Perimeter', 'perimeterRimGlow',     0, 3, 0.05, 'Rim glow', 'Danger light where a facet turns away from you (fresnel), as every prism\'s rim does.'],
    ['Perimeter', 'perimeterEdgeGlow',    0, 3, 0.05, 'Edge lines', 'Danger lines along the shards\' facet edges.'],
    ['Perimeter', 'perimeterFill',        0, 1, 0.01, 'Danger fill', 'A lit danger glow inside every facet, brighter on facets that face the light, so a shard reads as a solid volume even over black space.'],
    ['Perimeter', 'perimeterInvert',      0, 1, 0.01, 'Invert', 'Turns the reality inside a facet into its negative.'],
    ['Perimeter', 'perimeterOpacity',     0, 1, 0.01, 'Opacity', 'How solid the shards are.'],
    ['Perimeter', 'perimeterWarp',        0, 0.15, 0.005, 'Warp', 'The frame swirls and ripples near the edges while silenced; hits send a ring through it.'],
    ['Perimeter', 'perimeterGlitch',      0, 0.2, 0.005, 'Hit glitch', 'Each hit tears the facets\' picture into sliding bands (decays with the hit flare).'],
    ['Perimeter', 'perimeterPull',        0, 0.3, 0.005, 'Pull', 'Reality is dragged, in slow waves, toward a point near the edge: the frame and every facet\'s picture stream toward it.'],
    ['Perimeter', 'perimeterStreak',      0, 0.05, 0.001, 'Streak', 'Each facet\'s picture is smeared toward the pull, so light streams into the maw.'],
    ['Perimeter', 'perimeterTipFade',     0, 1, 0.01, 'Tip fade', 'Each shard fades toward its inward tip, so none ends in a point you could name: it dissolves into the distortion.'],
    ['Perimeter', 'perimeterPullDrift',   0, 1, 0.01, 'Pull drift', 'How fast that point wanders around the screen (radians a second).'],
    ['Edge',   'vignetteIntensity',      0, 1, 0.01, 'Strength', 'Peak opacity of the danger-coloured edge while silenced. The overlay ADDS colour, so it shows on black space.'],
    ['Edge',   'vignetteColorStrength',  0, 1, 0.01, 'Danger colour', '1 = the palette\'s danger signal colour (the rim every danger prism wears); toward 0 it darkens to black.'],
    ['Edge',   'vignetteDarken',         0, 1, 0.01, 'Darken under it', 'URP Vignette, black, under the colour: helps the edge read over a bright scene. On its own it is invisible on black space.'],
    ['Edge',   'vignetteSmoothness',  0.01, 1, 0.01, 'Darken smoothness', 'URP smoothness of that darkening.'],
    ['Shape',  'vignetteStyle',          0, 1, 1,    'Style (0 soft, 1 faceted)', 'Soft: a smooth ellipse. Faceted: a polygonal window, the prisms\' language.'],
    ['Shape',  'vignetteFacets',         3, 16, 1,   'Facets', 'Sides of the faceted window.'],
    ['Shape',  'vignetteInner',          0, 1.5, 0.01, 'Starts at (thin)', 'Where the edge starts with little silence left: 0 = the centre of the screen, 1 = the top and bottom edges.'],
    ['Shape',  'vignetteDeepInner',      0, 1.5, 0.01, 'Starts at (deep)', 'Where the edge starts at full depth: it moves in with the seconds of silence and bleeds back out as they drain.'],
    ['Shape',  'vignetteFeather',        0, 1.5, 0.01, 'Feather', 'How far the edge takes to reach full strength.'],
    ['Shape',  'vignetteRoundness',      0, 1, 0.01, 'Roundness', '0 = the screen\'s own ellipse; 1 = a circle in pixels (reaches the top and bottom first).'],
    ['Shape',  'vignetteFill',           0, 1, 0.01, 'Fill', 'Opacity of the outer fill. 0 leaves only the rim line.'],
    ['Shape',  'vignetteRimStrength',    0, 1, 0.01, 'Rim line', 'A bright line along the edge\'s inner boundary.'],
    ['Shape',  'vignetteRimWidth',       0, 0.3, 0.005, 'Rim width', 'Half-width of that line.'],
    ['Motion', 'vignetteBreatheDepth',   0, 1, 0.01, 'Breathe depth', 'How far the edge dips and returns while silenced.'],
    ['Motion', 'vignetteBreatheHz',      0, 4, 0.05, 'Breaths / s', 'Speed of the breathing.'],
    ['Motion', 'vignetteHitPulse',       0, 1, 0.01, 'Hit flare', 'Extra opacity each hit adds while silenced, decaying.'],
    ['Motion', 'vignetteHitPulseSeconds', 0.05, 2, 0.01, 'Flare decay (s)', 'Time for a flare to fall to a third.'],
    ['Motion', 'vignetteFadeInSeconds',  0, 2, 0.05, 'Fade in (s)', 'How fast the edge rises when a silence lands.'],
    ['Motion', 'vignetteFadeOutSeconds', 0, 3, 0.05, 'Fade out (s)', 'How long it drains when the silence ends.'],
    ['Motion', 'onsetShakeIntensity',    0, 1.5, 0.01, 'Onset shake', 'Camera shake when a silence begins (world units; shown here as an approximate pixel offset).'],
    ['Motion', 'onsetShakeSeconds',      0, 1, 0.01, 'Onset shake (s)', 'Its decay time.'],
    ['Motion', 'hitShakeIntensity',      0, 1, 0.01, 'Hit shake', 'A lighter shake on each further hit.'],
    ['Motion', 'hitShakeSeconds',        0, 1, 0.01, 'Hit shake (s)', 'Its decay time.'],
    ['Silence', 'secondsPerPetal',       0, 3, 0.05, 'Seconds per petal', 'A hit silences for its worth: points / 10 x 4 elements x this.'],
    ['Silence', 'depthFullSeconds',      0.5, 15, 0.5, 'Full depth at (s)', 'Seconds of silence left that reach full depth. Fewer seconds, shallower.'],
    ['Silence', 'depthFollowSeconds',    0, 2, 0.05, 'Depth follow (s)', 'How fast depth catches up with the seconds (0 to full).'],
    ['Silence', 'maxSeconds',            0, 15, 0.5, 'Ceiling (s)', 'The most silence one pilot carries.'],
    ['Silence', 'labHitsPerSecond',      0.1, 4, 0.1, 'Rival hit rate (lab)', 'Hits a second the stand-in rival lands while "Rival firing" is on.'],
  ];

  const LS_KEY = 'lab:' + LAB.name + ':P';
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private window */ } };
  const P = Object.assign({}, SHIPPED, lsGet(LS_KEY, {}));
  for (const k of Object.keys(P)) if (!(k in SHIPPED)) delete P[k];

  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ================= (3) THE MODEL =================
  // <mask-twin> SilenceVignetteMask.cs, line for line. Tools/Build/silence_vignette_parity extracts this block.
  const MASK = (() => {
    const StyleFaceted = 1;
    const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
    const lerp = (a, b, t) => a + (b - a) * clamp01(t);
    const repeat = (t, length) => t - Math.floor(t / length) * length;
    function smoothStep(a, b, x) {
      if (b <= a) return x >= a ? 1 : 0;
      const t = clamp01((x - a) / (b - a));
      return t * t * (3 - 2 * t);
    }
    function distance(u, v, aspect, s) {
      const x = (u - 0.5) * 2 * lerp(1, Math.max(0.01, aspect), clamp01(s.roundness));
      const y = (v - 0.5) * 2;

    { name: 'Round 2: crystals from the edge', v: { vignetteIntensity: 0, perimeterDeepSize: 0.26, perimeterDeepReach: 0.26, perimeterTipFade: 0, perimeterStreak: 0, perimeterCount: 22, perimeterSize: 0.26, perimeterReach: 0.26, perimeterSpin: 0.5, perimeterRefraction: 0.06, perimeterTwist: 0.5, perimeterAberration: 0.006, perimeterTint: 0.15, perimeterRimGlow: 1.2, perimeterEdgeGlow: 0.8, perimeterFill: 0.4, perimeterOpacity: 0.9, perimeterWarp: 0.03, perimeterGlitch: 0.05, perimeterPull: 0 } },
    { name: 'Round 3: pull + 2D edge', v: { ...R3_PULL, vignetteIntensity: 0.4, vignetteStyle: 0, vignetteFacets: 10, vignetteRoundness: 0.25, vignetteInner: 0.7, vignetteDeepInner: 0.7, vignetteFeather: 0.5, vignetteRimStrength: 0.35, vignetteRimWidth: 0.04 } },
    { name: 'Hairline (very thin, very deep)', v: { vignetteInner: 0.975, vignetteFeather: 0.04, perimeterSize: 0.06, perimeterReach: 0.01, perimeterDeepSize: 0.45, perimeterDeepReach: 0.28, vignetteDeepInner: 0.45 } },
    { name: 'Soft oval edge', v: { vignetteStyle: 0, vignetteRoundness: 0.25, vignetteInner: 0.95, vignetteFeather: 0.15, vignetteDeepInner: 0.6 } },
    { name: 'Yours (current settings)', v: null },
    // Archive: round 1's 2D looks, one click away (not scored).
    { name: 'Ember (subtle)', archive: true, v: Object.assign({}, R1_EDGE, { vignetteIntensity: 0.45, vignetteInner: 0.7, vignetteFeather: 0.45, vignetteRimStrength: 0, vignetteDarken: 0.2 }) },
    { name: 'Faceted window', archive: true, v: Object.assign({}, R1_EDGE, { vignetteStyle: 1, vignetteFacets: 10, vignetteInner: 0.62, vignetteFeather: 0.25, vignetteFill: 0.85, vignetteRimStrength: 0.6, vignetteRimWidth: 0.025 }) },
    { name: 'Prism rim', archive: true, v: Object.assign({}, R1_EDGE, { vignetteInner: 0.75, vignetteFeather: 0.4, vignetteFill: 0.25, vignetteRimStrength: 0.9, vignetteRimWidth: 0.05 }) },
    { name: 'Hard frame', archive: true, v: Object.assign({}, R1_EDGE, { vignetteIntensity: 0.9, vignetteInner: 0.45, vignetteFeather: 0.3, vignetteDarken: 0.5 }) },
    { name: 'Breathing', archive: true, v: Object.assign({}, R1_EDGE, { vignetteBreatheDepth: 0.6, vignetteBreatheHz: 1.2 }) },
  ];
  const SCORE_SEEDS = [1, 2, 3];
  function scoreVariant(base) {
    const out = {};
    for (const b of BACKDROPS) {
      let e = 0, m = 0, r = 0;
      for (const sd of SCORE_SEEDS) { const s = compositeScore(base.p, base.legacy, b.key, sd); if (!s) return null; e += s.edge; m += s.mid; r += s.red; }
      out[b.key] = { edge: +(e / SCORE_SEEDS.length).toFixed(2), mid: +(m / SCORE_SEEDS.length).toFixed(2), red: +(r / SCORE_SEEDS.length).toFixed(3) };
    }
    return out;
  }
  function runBatch() {
    const rows = [];
    for (const va of VARIANTS) {
      if (va.archive) continue;
      const p = Object.assign({}, va.v === null ? P : SHIPPED, va.v || {});
      const s = scoreVariant({ p, legacy: va.legacy });
      if (!s) { rows.push({ variant: va.name, edgeSpace: null, edgeBright: null, edgeDanger: null, centre: null, redSpace: null }); continue; }
      rows.push({ variant: va.name, edgeSpace: s.space.edge, edgeBright: s.bright.edge, edgeDanger: s.danger.edge,
        centre: +((s.space.mid + s.bright.mid + s.danger.mid) / 3).toFixed(2), redSpace: s.space.red });
    }
    return rows;
  }
  function score() { const s = scoreVariant({ p: Object.assign({}, P) }); if (!s) return null; return { edgeSpace: s.space.edge, edgeBright: s.bright.edge, edgeDanger: s.danger.edge, centre: +((s.space.mid + s.bright.mid + s.danger.mid) / 3).toFixed(2), t: +world.t.toFixed(2) }; }

  // ================= platform =================
  function detectPlatform() {
    const host = window.__labHost || {}, ua = navigator.userAgent || '';
    const mobileUA = (navigator.userAgentData && navigator.userAgentData.mobile) || /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    const coarseOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
    return { shell: host.shell || 'web', device: host.device || ((mobileUA || coarseOnly) ? 'phone' : 'pc') };
  }
  const PLATFORM = detectPlatform();
  $('platform').textContent = (PLATFORM.shell === 'web' ? 'Web' : PLATFORM.shell) + ' · ' + (PLATFORM.device === 'phone' ? 'Phone' : 'PC');

  // ================= UI =================
  const outputs = {};
  function fmt(v, step) { const dec = step < 1 ? Math.min(3, String(step).split('.')[1].length) : 0; return Number(v).toFixed(dec); }
  function diffOnly() { const o = {}; for (const k of Object.keys(SHIPPED)) if (Math.abs(P[k] - SHIPPED[k]) > 1e-9) o[k] = P[k]; return o; }
  function refreshDiff() {
    const n = Object.keys(diffOnly()).length;
    $('diff').textContent = n ? n + ' setting' + (n > 1 ? 's differ' : ' differs') + ' from shipped' : 'shipped numbers';
    for (const [, key, , , step] of SPEC) {
      const o = outputs[key]; if (!o) continue;
      o.out.textContent = fmt(P[key], step); o.inp.value = P[key];
      const changed = Math.abs(P[key] - SHIPPED[key]) > 1e-9;
      o.out.classList.toggle('changed', changed);
      o.out.title = 'shipped ' + SHIPPED[key] + ' · yours ' + P[key];
    }
  }
  function setParam(key, v) { P[key] = v; lsSet(LS_KEY, diffOnly()); refreshDiff(); }
  function applyPreset(v) { Object.assign(P, SHIPPED, v || {}); lsSet(LS_KEY, diffOnly()); refreshDiff(); if (world.weight < 0.5) hit('shockwave'); }

  function makeTabs(barId, bodyId, tabs, storeKey) {
    const bar = $(barId), body = $(bodyId), sel = lsGet(storeKey, tabs[0].name);
    function show(name) {
      for (const b of bar.children) b.setAttribute('aria-selected', String(b.dataset.name === name));
      body.replaceChildren(tabs.find((t) => t.name === name).build()); lsSet(storeKey, name);
    }
    for (const t of tabs) { const b = document.createElement('button'); b.type = 'button'; b.textContent = t.name; b.dataset.name = t.name; b.setAttribute('role', 'tab'); b.onclick = () => show(t.name); bar.appendChild(b); }
    show(tabs.some((t) => t.name === sel) ? sel : tabs[0].name);
  }
  function presetsBox() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="eyebrow">Looks</p><div class="presets" id="lookGrid"></div><p class="eyebrow">Archive: round 1, the 2D edge</p><div class="presets" id="archiveGrid"></div><p class="hint">A look loads its settings over the shipped ones and lands a hit so you see it. Shipped = what the game draws today.</p>';
    for (const va of VARIANTS) {
      if (va.v === null || va.legacy || /control/.test(va.name)) continue;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = va.name; b.onclick = () => applyPreset(va.v);
      box.querySelector(va.archive ? '#archiveGrid' : '#lookGrid').appendChild(b);
    }
    return box;
  }
  function sliderGroup(group) {
    const box = document.createElement('div');
    if (group === 'Perimeter') box.appendChild(presetsBox());
    for (const [g, key, lo, hi, step, label, tip] of SPEC) {
      if (g !== group) continue;
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = '<label><span></span><span class="key"></span></label><output></output><input type="range"><div class="tip"></div>';
      const id = 'p_' + key;
      row.querySelector('label').htmlFor = id; row.querySelector('label span').textContent = label; row.querySelector('.key').textContent = key; row.querySelector('.tip').textContent = tip;
      const inp = row.querySelector('input'); inp.id = id; Object.assign(inp, { min: lo, max: hi, step, value: P[key] });
      inp.oninput = () => setParam(key, parseFloat(inp.value));
      outputs[key] = { out: row.querySelector('output'), inp };
      box.appendChild(row);
    }
    queueMicrotask(refreshDiff);
    return box;
  }
  const groups = [...new Set(SPEC.map((r) => r[0]))];
  makeTabs('dockTabs', 'dockBody', groups.map((g) => ({ name: g, build: () => sliderGroup(g) })), 'lab:' + LAB.name + ':dock');

  // ================= decision log =================
  let db = null, me = '', remote = [], localLog = lsGet('lab:' + LAB.name + ':log', []);
  function snapshot() { return { round: LAB.round, seed, backdrop, changed: diffOnly() }; }
  async function record(topic, choice, note) {
    const doc = { topic, choice, note: note || '', createdAt: Date.now(), by: me, settings: snapshot() };
    if (db) { try { await db.collection('decisions').add(doc); return 'shared'; } catch (e) { /* fall through to this browser */ } }
    localLog.push(doc); lsSet('lab:' + LAB.name + ':log', localLog); return 'local';
  }
  function logPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint" id="logStatus"></p><div class="flex"><input type="text" id="logTopic" placeholder="Topic" value="Silence vignette look" style="max-width:260px"><button class="btn primary" id="logSave" type="button">Record decision</button><button class="btn" id="logCopy" type="button">Copy log</button></div><textarea id="logChoice" rows="2" style="margin-top:6px" placeholder="What you picked and why"></textarea><div class="tablewrap"><table id="logTable"></table></div>';
    const status = box.querySelector('#logStatus');
    status.textContent = db ? 'Shared log: saved with the lab and read by Claude at the start of the next round. Your current settings are attached.' : 'Kept in this browser (Copy log to send it). Your current settings are attached.';
    status.className = db ? 'status-ok' : 'status-warn';
    box.querySelector('#logChoice').value = Object.keys(diffOnly()).length ? 'This look, with these settings.' : 'The shipped look.';
    box.querySelector('#logSave').onclick = async () => { const where = await record(box.querySelector('#logTopic').value || 'Silence vignette look', box.querySelector('#logChoice').value); status.textContent = where === 'shared' ? 'Recorded in the shared log.' : 'Recorded in this browser.'; renderLog(box); };
    box.querySelector('#logCopy').onclick = () => {
      const t = remote.concat(localLog).map((d) => new Date(d.createdAt).toISOString() + ' · ' + d.topic + ': ' + d.choice + ' ' + JSON.stringify(d.settings)).join('\n');
      try { navigator.clipboard.writeText(t).catch(() => {}); } catch (e) { /* the viewer refused the clipboard */ }
    };
    renderLog(box);
    return box;
  }
  function renderLog(box) {
    const t = (box || document).querySelector('#logTable'); if (!t) return;
    const rows = remote.concat(localLog).sort((a, b) => b.createdAt - a.createdAt).slice(0, 50);
    t.innerHTML = '<tr><th>When</th><th>Topic</th><th>Decision</th><th>Settings</th></tr>';
    for (const d of rows) { const tr = document.createElement('tr'); for (const v of [new Date(d.createdAt).toLocaleString(), d.topic, d.choice, Object.keys((d.settings && d.settings.changed) || {}).length + ' changed']) { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); } t.appendChild(tr); }
  }
  (async function connect() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try { db = await c.use('db'); } catch (e) { db = null; }
    try { const u = await c.use('user'); if (u) me = (await u.id()) || ''; } catch (e) { me = ''; }
    if (!db) return;
    try { db.collection('decisions').orderBy('createdAt', 'desc').limit(300).onSnapshot((snap) => { remote = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderLog(); }, () => { db = null; }); } catch (e) { db = null; }
  })();

  function scorecardPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<div class="flex"><button class="btn primary" id="runBatch" type="button">Score the looks</button><span class="hint">Edge = how much the edge changes the picture (OKLab difference x100, higher reads more). Centre = how much it touches the middle of the screen (lower keeps play clear). Seeds 1-3, full strength, at the peak of each breath (breathing is judged by eye).</span></div><p class="hint" id="yard"></p><div class="tablewrap"><table id="scoreTable"></table></div>';
    box.querySelector('#runBatch').onclick = () => {
      const rows = runBatch(), t = box.querySelector('#scoreTable');
      const best = (k, hi) => (hi ? Math.max : Math.min)(...rows.filter((r) => !/control|Round 0/.test(r.variant) && r[k] !== null).map((r) => r[k]));
      t.innerHTML = '<tr><th>Look</th><th>Edge: open space</th><th>Edge: bright cell</th><th>Edge: danger prisms</th><th>Centre</th><th>Red added (space)</th></tr>';
      const hiKeys = { edgeSpace: 1, edgeBright: 1, edgeDanger: 1, redSpace: 1 }, bests = {};
      for (const k of ['edgeSpace', 'edgeBright', 'edgeDanger', 'centre', 'redSpace']) bests[k] = best(k, !!hiKeys[k]);
      for (const r of rows) {
        const tr = document.createElement('tr'), cells = [r.variant, r.edgeSpace, r.edgeBright, r.edgeDanger, r.centre, r.redSpace];
        cells.forEach((v, i) => { const td = document.createElement('td'); td.textContent = v === null ? 'n/a' : v; if (i) td.className = 'num'; tr.appendChild(td); });
        ['edgeSpace', 'edgeBright', 'edgeDanger', 'centre', 'redSpace'].forEach((k, i) => { if (!/control|Round 0/.test(r.variant) && r[k] === bests[k]) tr.children[i + 1].classList.add('best'); });
        if (/Round 0/.test(r.variant)) tr.children[1].classList.add('bad');
        t.appendChild(tr);
      }
      const off = rows[0], r0 = rows[1], sh = rows.find((r) => /^Shipped/.test(r.variant));
      const ok = off.edgeSpace === 0 && off.centre === 0 && r0.edgeSpace < 4 && sh.edgeSpace !== null && sh.edgeSpace > 2 * Math.max(0.1, r0.edgeSpace);
      box.querySelector('#yard').textContent = (ok ? 'Yardstick check passed: ' : 'Yardstick check FAILED: ') + 'Off reads ' + off.edgeSpace + ' / ' + off.centre + ' (must be 0), Round 0 reads ' + r0.edgeSpace + ' on open space (must be under 4, near the just-noticeable difference of about 2: nobody saw it), Shipped reads ' + sh.edgeSpace + ' (must be over twice Round 0; the band average favours a full frame, so a sparse moving perimeter is judged by eye too).';
      box.querySelector('#yard').className = 'hint ' + (ok ? 'status-ok' : 'status-warn');
    };
    return box;
  }
  function exportPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint">Your settings as the lines of Assets/Resources/VesselSilenceConfig.asset that would change. Record a decision and Claude ports it; this is for reading.</p><pre class="export" id="exportText"></pre><button class="btn" id="exportCopy" type="button">Copy lines</button>';
    const d = diffOnly(), keys = Object.keys(d).filter((k) => !k.startsWith('lab'));
    box.querySelector('#exportText').textContent = keys.length ? keys.map((k) => '  ' + k + ': ' + d[k]).join('\n') : '(no change from the shipped asset)';
    box.querySelector('#exportCopy').onclick = () => { try { navigator.clipboard.writeText(box.querySelector('#exportText').textContent).catch(() => {}); } catch (e) { /* refused */ } };
    return box;
  }
  function aboutPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p id="aboutLine"></p>'
      + '<p class="hint"><strong>Why an overlay.</strong> URP\'s Vignette multiplies the frame by its colour, so a red one only darkens. Over the arena\'s near-black space that is invisible; Round 0 shipped exactly that and Garrett saw nothing in Dog Fight. The game now draws the edge as an overlay in the palette\'s danger colour (it adds colour), with an optional black URP darkening under it.</p>'
      + '<p class="hint"><strong>What this lab does NOT model.</strong> The scene is a 2D stand-in drawn in the shipped palette, not the game\'s 3D render: no bloom, no tonemapping, no HDR, no HUD. The URP darkening uses URP 17\'s formula without its colour grading. The shake is an approximate pixel offset (1 world unit at the chase camera taken as 1/40 of the height). The rival\'s hits are a seeded schedule, not an AI. Phones draw the same overlay; the game\'s mobile render path is not modelled.</p>'
      + '<p class="hint"><strong>The 3D perimeter (round 2).</strong> The shards are real 3D facets drawn the way the game draws them: the frame is copied, warped near the edges, and every shard samples that copy, bent by its facet\'s normal, turned by its own twist and torn by hits. Their layout and geometry are the game\'s own code (SilencePerimeter.cs, held by a parity gate). Not modelled: the game\'s camera field of view (the lab uses 60 degrees), HDR and bloom on the danger lines, anything nearer the camera than the shards (the game draws them over everything), and the extra cost of the frame copy on a phone.</p>';
    box.querySelector('#aboutLine').textContent = LAB.name + ' · round ' + LAB.round + ' · ' + LAB.branch + ' · write-up: ' + LAB.doc + ' · the mask is SilenceVignetteMask.cs, line for line';
    return box;
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Scorecard', build: scorecardPanel }, { name: 'Decisions', build: logPanel }, { name: 'To Unity', build: exportPanel }, { name: 'About', build: aboutPanel }], 'lab:' + LAB.name + ':bottom');

  // ================= header, stage buttons =================
  $('title').textContent = LAB.name; $('meta').textContent = 'round ' + LAB.round;
  for (const b of BACKDROPS) { const o = document.createElement('option'); o.value = b.key; o.textContent = b.name; $('backdrop').appendChild(o); }
  $('backdrop').value = backdrop;
  $('backdrop').onchange = () => { backdrop = $('backdrop').value; lsSet('lab:' + LAB.name + ':backdrop', backdrop); };
  let paused = false;
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
  $('resetAll').onclick = () => applyPreset({});
  $('hitBullet').onclick = () => hit('bullet');
  $('hitRocket').onclick = () => hit('shockwave');
  function silenceFor(seconds) { const onset = world.weight <= 0.0001; world.left = Math.min(P.maxSeconds || seconds, Math.max(world.left, seconds)); if (onset) { world.onsets++; shake(P.onsetShakeIntensity, P.onsetShakeSeconds); } }
  $('silence4').onclick = () => silenceFor(4);
  $('silence8').onclick = () => silenceFor(8);
  function syncToggles() { $('autoRival').classList.toggle('on', world.auto); $('hold').classList.toggle('on', world.hold); }
  $('autoRival').onclick = () => { world.auto = !world.auto; syncToggles(); };
  $('hold').onclick = () => { world.hold = !world.hold; syncToggles(); };

  // ================= sizing + loop =================
  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) { resize(); if (!paused) simStep(dt); render(); }
    requestAnimationFrame(frame);
  }
  reset(); syncToggles(); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  window.__lab = {
    LAB, SHIPPED, SPEC, P, PLATFORM, VARIANTS, MASK, PERIM, PALETTE, DANGER,
    get perimeterOk() { return stagePerim.ok; },
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { dt = dt || 1 / 60; n = n || 1; for (let i = 0; i < n; i++) simStep(dt); resize(); render(); },
    reset, score, runBatch, setParam, record, hit,
    state: () => ({ t: world.t, seed, left: world.left, weight: world.weight, depth: world.depth, pulse: world.pulse, hits: world.hits, onsets: world.onsets, backdrop }),
  };
})();
</script>
