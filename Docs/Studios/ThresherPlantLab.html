<!doctype html>
<!--
  THRESHER PLANT LAB — the Thresher's Time ability (LT "Plant") without the jolts.
  A /labmaker browser studio. Write-up: Docs/Studios/THRESHER_PLANT_LAB.md.
  The model is a line-for-line JS port of the SHIPPED ThresherChainSolver (held to the C# solver by
  Tools/Build/thresher_plant_lab/parity.cjs), plus the transformer's seams and the executor's camera,
  plus the LAB approaches (every lab dial has a value at which the shipped path runs unchanged).
  Verify:  node .claude/skills/labmaker/verify_lab.cjs Docs/Studios/ThresherPlantLab.html
           node Tools/Build/thresher_plant_lab/parity.cjs
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thresher Plant Lab</title>
<style>
  /* Layout: a flight-recorder bench. Two chase views fly the same stick side by side (Shipped | the
     approach under test), the right dock holds the approaches and their dials, the bottom dock the
     recorder traces, the scorecard and the decision log. */
  :root {
    --bg: #eef0f2; --panel: #f9fafb; --ink: #1a1e23; --muted: #5a6470; --line: #d5dae0;
    --accent: #c2410c; --accent-ink: #ffffff; --ok: #1f7a43; --warn: #a15c07;
    --stage: #0a0d12; --stage-ink: #c9d3de; --shipped: #8fa3b8; --trial: #f2994a;
    --changed: #c2410c;
    --font-ui: "Bahnschrift", "DIN Alternate", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-num: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1115; --panel: #151a20; --ink: #e4e8ed; --muted: #95a0ad; --line: #28303a;
      --accent: #f2994a; --accent-ink: #1a1206; --ok: #5cc98a; --warn: #f0b050;
      --stage: #05070a; --stage-ink: #c9d3de; --shipped: #8fa3b8; --trial: #f2994a; --changed: #f2994a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1115; --panel: #151a20; --ink: #e4e8ed; --muted: #95a0ad; --line: #28303a;
    --accent: #f2994a; --accent-ink: #1a1206; --ok: #5cc98a; --warn: #f0b050;
    --stage: #05070a; --stage-ink: #c9d3de; --shipped: #8fa3b8; --trial: #f2994a; --changed: #f2994a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.4 var(--font-ui); overflow: hidden; }
  #app { display: grid; height: 100vh; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr) 236px; grid-template-areas: "head head" "stage dock" "bottom dock"; }
  header { grid-area: head; display: flex; gap: 10px; align-items: center; padding: 7px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; min-width: 0; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.02em; text-transform: uppercase; }
  header .meta { color: var(--muted); }
  header .spacer { flex: 1; }
  #diff { color: var(--changed); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-right: 1px solid var(--line); border-radius: 0; }
  .seg button:last-child { border-right: 0; }
  #stageWrap { grid-area: stage; position: relative; min-height: 0; background: var(--stage); }
  #stage { width: 100%; height: 100%; display: block; touch-action: none; }
  #legend { position: absolute; right: 10px; bottom: 8px; color: var(--stage-ink); opacity: 0.75; font: 11px/1.4 var(--font-num); pointer-events: none; text-align: right; }
  #touch { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: space-between; padding: 0 16px; pointer-events: none; }
  #touch button { pointer-events: auto; width: 76px; height: 56px; border-radius: 12px; border: 1px solid #ffffff44; background: #ffffff18; color: #fff; font: 600 15px var(--font-ui); }
  #touch button.on { background: var(--trial); color: #1a1206; }
  #dock { grid-area: dock; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px 16px 16px; min-width: 0; }
  #bottom { grid-area: bottom; border-top: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px 16px; min-width: 0; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .tabs button, .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  .tabs button[aria-selected="true"], .btn.primary, .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 70px; gap: 2px 8px; margin: 8px 0; }
  .row label { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .row label .key { color: var(--muted); font: 11px var(--font-num); overflow: hidden; text-overflow: ellipsis; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .row output { text-align: right; font: 12px var(--font-num); }
  .row output.changed { color: var(--changed); text-decoration: underline; }
  .row .tip { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .preset { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; cursor: pointer; background: var(--bg); }
  .preset[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .preset b { font-size: 13px; }
  .preset .kind { font: 10px var(--font-num); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; align-self: center; }
  .preset p { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 12px; }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0; }
  table { border-collapse: collapse; width: 100%; font: 12px var(--font-num); }
  th, td { text-align: right; padding: 3px 7px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font: 600 11px var(--font-ui); color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; vertical-align: bottom; white-space: normal; }
  .best { font-weight: 700; color: var(--ok); }
  .worst { color: var(--warn); }
  .tablewrap { overflow-x: auto; }
  .status-ok { color: var(--ok); } .status-warn { color: var(--warn); }
  #traces { width: 100%; height: 182px; display: block; }
  textarea, select, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .about { max-width: 70ch; }
  .about li { margin: 2px 0; }
  @media (max-width: 900px) {
    body { overflow: auto; }
    #app { display: block; height: auto; }
    #stageWrap { aspect-ratio: 4 / 5; max-width: 100%; }
    #dock, #bottom { border: 0; border-top: 1px solid var(--line); }
    header, #dock, #bottom { padding-left: 16px; padding-right: 16px; }
    #bottom { max-height: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title"></h1>
    <span class="meta" id="meta"></span>
    <span id="diff"></span>
    <span class="spacer"></span>
    <span class="seg" role="group" aria-label="View"><button class="btn" id="viewSplit">Split</button><button class="btn" id="viewSingle">Single</button></span>
    <span class="seg" role="group" aria-label="Camera"><button class="btn" id="camPilot">Pilot cam</button><button class="btn" id="camWorld">Top-down</button></span>
    <button class="btn" id="auto">Autopilot</button>
    <button class="btn" id="slow">Slow-mo</button>
    <button class="btn" id="pause">Pause</button>
    <button class="btn" id="resetAll">Digital</button>
    <span class="meta" id="platform"></span>
  </header>
  <div id="stageWrap"><canvas id="stage"></canvas>
    <div id="legend">A/D steer · hold Q = LT · hold E = RT · R restart · Tab A/B</div>
    <div id="touch" hidden><button id="tLT">LT</button><button id="tRT">RT</button></div>
  </div>
  <aside id="dock"><div class="tabs" id="dockTabs" role="tablist"></div><div id="dockBody"></div></aside>
  <section id="bottom"><div class="tabs" id="bottomTabs" role="tablist"></div><div id="bottomBody"></div></section>
</div>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const D2R = Math.PI / 180, R2D = 180 / Math.PI;

  // ================= (1) LAB meta + the shipped numbers =================
  // GRADUATED 2026-10-13: the game now ships the "Analog triggers" preset (ThresherConfig.asset turns
  // dials.analogTriggers on; parity.cjs holds that asset equal to the preset, and this page's solver to the C#).
  // SHIPPED below is the DIGITAL Thresher before it: the class defaults (ThresherDials field initializers), which
  // the asset still uses for every non-analog dial. View A flies it, labelled "Digital (before)".
  const LAB = { name: 'Thresher Plant Lab', branch: 'cece/zealous-johnson-gopp6t', round: 2, doc: 'Docs/Studios/THRESHER_PLANT_LAB.md' };
  // Every shipped constant names where it was read from (2026-10-13). The dials asset is
  // Assets/_SO_Assets/VesselActions/Thresher/ThresherConfig.asset (ThresherConfigSO.dials = ThresherDials),
  // in SANDBOX units; settingsFrom() scales them exactly as ThresherDials.ToSettings does.
  const SHIPPED = {
    sandboxCruise: 380,  // ThresherDials.sandboxCruise
    gameCruise: 70,      // ThresherDials.gameCruise (DefaultMinimumSpeed 15 + 0.5 x DefaultThrottleScaler 110)
    restLen: 120,        // ThresherDials.restLen
    maxLen: 760,         // ThresherDials.maxLen
    payOut: 1000,        // ThresherDials.payOut
    reelIn: 1800,        // ThresherDials.reelIn
    reelSpinCap: 1.6,    // ThresherDials.reelSpinCap
    ballDrag: 0.35,      // ThresherDials.ballDrag
    ballMass: 0.4,       // ThresherDials.ballMass
    ballR: 17,           // ThresherDials.ballR
    maxBall: 2600,       // ThresherDials.maxBall
    tug: 0.2,            // ThresherDials.tug
    minShip: 0.6,        // ThresherDials.minShip
    crack: 0.6,          // ThresherDials.crack
    smashSpeed: 700,     // ThresherDials.smashSpeed
    skid: 7,             // ThresherDials.skid            (plant brake, 1/s)
    skidSeconds: 0.3,    // ThresherDials.skidSeconds
    lockKeep: 1,         // ThresherDials.lockKeep
    lockSpin: 220,       // ThresherDials.lockSpin
    lockMax: 2.2,        // ThresherDials.lockMax
    yank: 0.5,           // ThresherDials.yank
    hookTurnRate: 300,   // ThresherDials.hookTurnRate    (deg/s)
    hookReturnRate: 5,   // ThresherDials.hookReturnRate  (1/s)
    spinMultiplier: 1,   // ThresherConfigSO.spinMultiplier (Time element: x1 -> x1.75 on lockSpin and lockMax)
    pivotFacingRate: 25, // Thresher.prefab ThresherVesselTransformer.pivotFacingRate (1/s)
    yawScaler: 120,      // Thresher.prefab YawScaler (deg/s at full stick)
    noseLerp: 1.5,       // VesselTransformer.LERP_AMOUNT (hull follows the command; speed eases to cruise)
    cameraMaxFollowTurnRate: 240, // ThresherConfigSO.cameraMaxFollowTurnRate (deg/s)
    spectateSpinRate: 0.9,        // ThresherConfigSO.spectateSpinRate (rad/s)
    spectateEngageSeconds: 0.1,   // ThresherConfigSO.spectateEngageSeconds
    spectateReleaseFraction: 0.75,// ThresherConfigSO.spectateReleaseFraction
    spectateEnterSeconds: 0.9,    // ThresherConfigSO.spectateEnterSeconds
    spectateExitSeconds: 0.8,     // ThresherConfigSO.spectateExitSeconds
    perfectWindowSeconds: 0.25,   // ThresherConfigSO.perfectWindowSeconds
    // ---- LAB dials (no game field yet). At these values the shipped path runs unchanged. ----
    bkMode: 0,       // lab: 0 = shipped skid then pin; 1 = quick deceleration to rest
    bkSeconds: 0.35, // lab: brake time (quick deceleration only)
    bkCurve: 2,      // lab: 0 linear, 1 bite-then-settle, 2 S-curve
    hkEarly: 0,      // lab: 1 = start swinging onto the orbit at the press, round the braking ball
    hkShape: 0,      // lab: 0 = shipped constant-rate hook; 1 = S-curve hook over hkSeconds
    hkSeconds: 0.45, // lab: S-curve hook duration
    spEase: 0,       // lab: seconds over which the spin-up fades in (0 = shipped step)
    rlSpinDown: 0,   // lab: seconds over which the spin's turn rate winds down on release (0 = shipped dead stop)
    rlSpinMaxDeg: 30,// lab: the most the wind-down may turn past the launch line (deg)
    rlRopeGive: 0,   // lab: seconds the rope takes to draw the ball up to speed after a release (0 = shipped hard rope)
    cmAngAccel: 0,   // lab: follow-frame angular acceleration limit (deg/s^2; 0 = shipped rate cap only)
    cmCarry: 0,      // lab: spectate entry carries the camera's turn and glides it to a stop over this time (0 = shipped freeze)
    wdReel: 1,       // lab: planted reel-in rate, x reelIn (1 = shipped)
    // ---- round 2: ANALOG TRIGGERS (lab; anScheme 0 = the shipped digital controls) ----
    anScheme: 0,     // lab: 1 = LT is an analog brake that stops the ball only at a full pull; RT is the chain's rigidity (pulled = rigid, released = slack)
    anFull: 0.97,    // lab: trigger depth that counts as a FULL pull (stop / rigid / camera switch)
    anRelease: 0.9,  // lab: below this a full pull counts as let go (hysteresis, so trigger noise cannot chatter)
    anBrake: 4,      // lab: ball brake at a full-but-one pull (1/s)
    anBrakeCurve: 1.5, // lab: brake = depth^this x anBrake
    anAnchor: 2,     // lab: how fast the braking ball turns into an anchor: the ship's share of the rope's pull = shipped share + (1 - it) x depth^this
    anStopDecel: 450,  // lab: peak deceleration of the final stop at a full pull (u/s^2); the stop takes 1.5 x speed / this
    elSlack: 1.2,    // lab: the chain's natural frequency with RT released (rad/s): a soft bungee
    elRigid: 30,     // lab: ... with RT fully pulled (rad/s): ~1 u of stretch at full spin
    elDamp: 0.8,     // lab: the chain's damping ratio (1 = critically damped)
    elCurve: 1,      // lab: rigidity = slack x (rigid/slack)^(depth^this)
    elSlew: 0,       // lab: the most the chain's rigidity can change per second, as a fraction of the trigger's travel (0 = follows the trigger at once)
    hlPost: 0,       // lab: 1 = while planted the hull also turns with the frame's velocity change AFTER the move (as towing does); shipped 0 = it faces the PREVIOUS frame's velocity, so it lags a frame and does not turn at all on the frame a plant begins
    inKeyRamp: 0.35, // lab input only: seconds for a held key / touch button to ramp a trigger from 0 to 1 (and back)
  };

  // ================= (2) SPEC: one row per slider =================
  const SPEC = [
    ['Analog', 'anScheme', 0, 1, 1, 'Analog triggers', 'Off (0): the shipped controls, both triggers read as on/off (LT plants, RT held lets chain out). On (1), round 2: LT is a BRAKE whose strength follows the pull and the ball only stops (and becomes the pivot) at a full pull; RT is the chain\'s RIGIDITY, pulled = rigid, released = slack. The camera switches to the launch view only with both at a full pull.'],
    ['Analog', 'anFull', 0.8, 1, 0.01, 'Full pull at', 'Trigger depth that counts as a full pull. Pads reach 1.0; 0.97 leaves room for a worn trigger.'],
    ['Analog', 'anRelease', 0.5, 0.99, 0.01, 'Let go below', 'Once full, a trigger counts as let go only below this, so noise at the end of travel cannot flicker the stop or the camera.'],
    ['Analog', 'anBrake', 0, 12, 0.5, 'Brake (1/s)', 'How hard the ball brakes just short of a full pull. A partial pull brakes less (depth^curve).'],
    ['Analog', 'anBrakeCurve', 0.5, 3, 0.1, 'Brake curve', 'Brake = depth^this. Above 1, the first part of the pull is gentle and the last part bites.'],
    ['Analog', 'anAnchor', 0.5, 4, 0.1, 'Anchor curve', 'As LT deepens, more of the chain\'s pull goes into the ship (the braking ball becomes an anchor), so a half pull already swings the ship round a sliding ball. Share = shipped 5.7% + the rest x depth^this.'],
    ['Analog', 'anStopDecel', 100, 1500, 25, 'Final stop (u/s²)', 'At a full pull the ball\'s remaining speed is stopped along an S-curve that peaks at this deceleration. A slow squeeze has already shed most of it, so its stop is gentle; a slam stops ~70 u/s in 0.23 s.'],
    ['Analog', 'elSlack', 0.3, 6, 0.1, 'Slack chain (rad/s)', 'The chain\'s natural frequency with RT released: a soft bungee the ball (and a planted ship) swings out on. The chain\'s full length (140 u) is always a hard limit.'],
    ['Analog', 'elRigid', 10, 45, 1, 'Rigid chain (rad/s)', 'The chain\'s natural frequency at a full RT pull. 30 rad/s leaves ~1 u of stretch at full spin.'],
    ['Analog', 'elDamp', 0.2, 1.5, 0.05, 'Chain damping', 'Damping ratio: below 1 the chain bounces, 1 settles without overshoot.'],
    ['Analog', 'elSlew', 0, 10, 0.5, 'Rigidity slew (/s)', 'The chain stiffens or slackens at most this much of the trigger\'s travel per second, so a SLAMMED RT pulls the ball in over 1/this s instead of in one frame. 0 = it follows the trigger at once.'],
    ['Analog', 'elCurve', 0.3, 3, 0.1, 'Rigidity curve', 'Rigidity follows depth^this between slack and rigid (log scale). Above 1 the chain stays soft through most of the pull.'],
    ['Spin', 'hlPost', 0, 1, 1, 'Hull keeps up', 'Shipped (0): while planted, the hull faces the velocity of the frame BEFORE (ThresherVesselTransformer.RotateShip runs before the move), so it lags a frame and its turn rate drops to zero on the frame a plant begins: a one-frame hitch. 1: it also turns with the frame\'s own velocity change after the move, as towing already does.'],
    ['Analog', 'inKeyRamp', 0.05, 1.5, 0.05, 'Key ramp (s)', 'Keyboard and touch only: a held key ramps its trigger from 0 to 1 over this time, and back on release. A pad reads the real trigger.'],
    ['Catch', 'bkMode', 0, 1, 1, 'Quick deceleration', 'Off (0) is the shipped plant: the ball skids for skidSeconds against a 7/s brake, but the taut rope keeps dragging it along, so after 0.3 s it is still doing ~63 u/s and is then pinned in ONE frame. On (1): the ball decelerates to rest along a curve over bkSeconds while the rope pays out, and becomes the pivot already at rest.'],
    ['Catch', 'bkSeconds', 0.1, 1, 0.05, 'Brake time (s)', 'How long the ball takes to come to rest. Shorter is snappier and still has no single-frame stop. Only with quick deceleration on.'],
    ['Catch', 'bkCurve', 0, 2, 1, 'Brake curve', '0 linear: constant deceleration (the decel switches on and off at once). 1 bite-then-settle: hardest at the press, landing softly. 2 S-curve: the deceleration rises and falls, nothing switches at once.'],
    ['Catch', 'skid', 0, 20, 0.5, 'Skid brake (1/s)', 'Shipped skid brake. Only used with quick deceleration off. Tuning it barely changes the stop, because the rope, not the brake, sets the ball\'s speed during the skid.'],
    ['Catch', 'skidSeconds', 0, 1, 0.05, 'Skid time (s)', 'Shipped skid length before the pin. 0 pins the ball at full speed (the planted-defect control).'],
    ['Hook', 'hkEarly', 0, 1, 1, 'Swing from the press', 'On: the ship starts curving onto the orbit the moment LT goes down, round the still-braking ball, instead of flying straight away from it until the brake ends.'],
    ['Hook', 'hkShape', 0, 1, 1, 'S-curve hook', 'Off: the shipped hook-on, the heading turns at a flat hookTurnRate from the first frame (the turn rate jumps from 0 to 300 deg/s and back). On: it eases in and out over hkSeconds.'],
    ['Hook', 'hkSeconds', 0.15, 1.2, 0.05, 'Hook time (s)', 'S-curve hook duration.'],
    ['Hook', 'hookTurnRate', 60, 720, 10, 'Hook turn rate (deg/s)', 'Shipped constant-rate hook-on cap.'],
    ['Hook', 'hookReturnRate', 1, 15, 0.5, 'Stretch reel-back (1/s)', 'How fast the chain reels back the stretch the swing-out took (critically damped).'],
    ['Spin', 'spEase', 0, 1, 0.05, 'Spin-up fade-in (s)', 'The orbit spins up at lockSpin from the first frame. A fade-in ramps that acceleration in over this time.'],
    ['Spin', 'lockSpin', 50, 600, 10, 'Spin-up (sandbox u/s²)', 'Shipped orbital spin-up while planted.'],
    ['Spin', 'lockMax', 1, 4, 0.1, 'Spin cap (x cruise)', 'Shipped spin-up cap.'],
    ['Spin', 'spinMultiplier', 1, 1.75, 0.05, 'Time scaling', 'The Time element\'s spinMultiplier (x1 at level 0 to x1.75), applied to spin-up and cap.'],
    ['Spin', 'wdReel', 0.2, 1, 0.05, 'Planted wind-in rate', 'RT up while planted reels the chain in at reelIn (331 u/s): from full let-out the ship is hauled 118 u inward in 0.36 s and the hull whips round at over 1500 deg/s. The spin gained is the same at any rate (spin is conserved per unit length), so this slows the haul, not the payoff. x reelIn; 1 = shipped.'],
    ['Spin', 'pivotFacingRate', 2, 60, 1, 'Hull facing (1/s)', 'How fast the hull turns to face the orbit tangent while planted (prefab field).'],
    ['Let go', 'rlSpinDown', 0, 0.8, 0.05, 'Spin wind-down (s)', 'Shipped: on release the heading stops turning in one frame (it was turning at the orbit rate, ~180 deg/s reeled in). Here the turn rate winds down over this time. An aimed launch leaves early by the angle it will still turn, so it still lands on the aim.'],
    ['Let go', 'rlSpinMaxDeg', 5, 90, 5, 'Wind-down angle cap (deg)', 'The wind-down is shortened so it never turns the ship more than this past its line. A fast spin (a let-out plant wound in reaches ~1100 deg/s) then stops harder; a bigger cap is smoother but the launch leaves earlier and the exit drifts more.'],
    ['Let go', 'rlRopeGive', 0, 0.8, 0.05, 'Rope give (s)', 'Shipped: the ball is set to yank x ship velocity in one frame, then the hard rope snaps it to the ship\'s speed. Here the rope\'s pull is limited, so it draws the ball up to speed in about this long (and does not tug the ship meanwhile). Pair it with yank 0 so the ball leaves the pivot at rest.'],
    ['Let go', 'yank', 0, 1.2, 0.05, 'Yank (x ship speed)', 'Shipped: the ball leaves the pivot at this fraction of the ship\'s velocity.'],
    ['Camera', 'cmAngAccel', 0, 4000, 100, 'Follow angular accel (deg/s²)', 'Shipped: the chase camera\'s follow frame turns at most cameraMaxFollowTurnRate but can start and stop that turn in one frame. Here its turn rate also changes at most this fast. 0 = shipped.'],
    ['Camera', 'cmCarry', 0, 0.8, 0.05, 'Spectate glide (s)', 'Shipped: when a fast spin hands the camera to the launch vantage, the entry ease starts from the pose the camera was in, so a camera turning with the hull at up to 240 deg/s stops turning in one frame. Here it keeps its turn and glides to a stop over this time; the aim (and the vantage) is where the glide ends. 0 = shipped.'],
    ['Camera', 'cameraMaxFollowTurnRate', 60, 720, 10, 'Follow turn cap (deg/s)', 'Shipped cap on how fast the follow frame turns.'],
    ['Camera', 'spectateSpinRate', 0.3, 5, 0.1, 'Spectate at (rad/s)', 'A planted orbit spinning at least this fast detaches the camera to the launch vantage (eased in over 0.9 s). Raise it to ride every spin in the chase view.'],
  ];

  const LS_KEY = 'lab:' + LAB.name + ':P';
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };

<p>The Thresher's Time ability is the <b>Plant</b> (LT): the ball stops and becomes a pivot, the ship swings round it, and LT up flings the ship off. Shipped, the ball is pinned in one frame while still doing about 63 u/s, the heading snaps into a 300°/s turn, and on release the spin stops dead and the ball is yanked to speed in one frame. A always flies the shipped model; B flies the approach you pick. The traces below the stage plot both.</p>
<p><b>Round 2: analog triggers</b> (dial <code>anScheme</code>, preset <i>Analog triggers</i>). LT is a brake: a partial pull slows the ball and hands more of the chain\'s pull to the ship, so it swings round a sliding anchor; only a full pull stops the ball, along an S-curve, and makes it the pivot. RT is the chain\'s rigidity, flipped from the shipped winch: released is a slack bungee, pulled is rigid. Stiffening the chain pulls the ball (or a planted ship) in and spins it up by angular momentum, which is what the winch\'s let-out and crack were. The camera switches to the launch view only with both triggers at a full pull. The left view keeps the shipped controls, so with a human at the sticks the same pull means different things on each side; the autopilot flies the same intent on both.</p>\n<p><b>Graduated (2026-10-13).</b> The game now ships the <i>Analog triggers</i> preset: <code>ThresherChainSolver</code> carries the analog path, <code>ThresherConfig.asset</code> turns it on, and <code>parity.cjs</code> holds this page's solver to the C# on both paths and the asset to the preset. View A is the digital Thresher from before.</p>\n<p><b>How faithful it is.</b> The chain is a line-for-line port of <code>ThresherChainSolver</code>, held to the C# solver frame by frame by <code>Tools/Build/thresher_plant_lab/parity.cjs</code>. Hull, grip, nose speed and the camera follow <code>ThresherVesselTransformer</code>, <code>VesselTransformer</code> (vector model) and <code>ThresherExecutor.UpdateCamera</code>, re-implemented here, not ported.</p>
<p><b>What this lab does NOT model:</b></p>
<ul>
<li>Flight is in one plane: yaw only. Pitch, roll, planted steering (<code>pivotSteer</code>) and tilting the orbit with the aim are not modelled.</li>
<li>The camera is a simplified <code>CustomCameraController</code>: no smoothing beyond the follow-frame cap, a zoom approximated as max(55, 1.15 × chain length), the spectate vantage without the sight window or FOV.</li>
<li>No prisms, smashes, hit-stop, shake, haptics, audio, chain links or element upgrades (Perfect Release's boost is off).</li>
<li>The ball is drawn as a sphere and the chain as a straight line; the game draws 24 relaxed links.</li>
<li>Frame time is a fixed 1/60 s in the scorecard (the game's is variable).</li>
<li>The lab approaches are lab code. None of them is in the game yet.</li>\n<li>Round 2\'s elastic chain is a spring model the game does not have: the shipped chain is a hard max-distance rope with a winch. Spin is conserved exactly (r × v) as the elastic radius changes; the shipped winch spends spin by sqrt(old/new) when paying out.</li>

  $('auto').onclick = () => { autopilot = !autopilot; autoCycle = 0; reset(); pressed(); };
  $('slow').onclick = () => { slowmo = !slowmo; pressed(); };
  $('pause').onclick = () => { paused = !paused; pressed(); };
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); activePreset = 'Digital (before)'; lsSet(LS_KEY, {}); reset(); refreshDiff(); };

  // ================= input: keyboard, gamepad, touch — all into one input object =================
  const keys = new Set();
  function manual() { if (autopilot) { autopilot = false; reset(); pressed(); } }
  addEventListener('keydown', (e) => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.code === 'Tab') { e.preventDefault(); showA = !showA; return; }
    if (e.code === 'KeyR') { reset(); return; }
    if (['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD', 'KeyQ', 'KeyE', 'KeyJ', 'KeyK', 'Space', 'ShiftLeft', 'ShiftRight'].includes(e.code)) { e.preventDefault(); manual(); keys.add(e.code); }
  });
  addEventListener('keyup', (e) => keys.delete(e.code));
  addEventListener('blur', () => keys.clear());
  let touchLT = false, touchRT = false, dragX = null, dragYaw = 0;
  const tbtn = (id, set) => { const b = $(id); b.addEventListener('pointerdown', (e) => { e.preventDefault(); manual(); set(true); b.classList.add('on'); try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); } catch (err) { /* refused */ } }); for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, () => { set(false); b.classList.remove('on'); }); };
  tbtn('tLT', (v) => { touchLT = v; }); tbtn('tRT', (v) => { touchRT = v; });
  canvas.addEventListener('pointerdown', (e) => { if (PLATFORM.device === 'phone') { manual(); dragX = e.clientX; } });
  canvas.addEventListener('pointermove', (e) => { if (dragX != null) dragYaw = Math.max(-1, Math.min(1, (e.clientX - dragX) / 80)); });
  for (const ev of ['pointerup', 'pointercancel']) canvas.addEventListener(ev, () => { dragX = null; dragYaw = 0; });
  // A held key or touch button RAMPS its trigger over inKeyRamp (and back on release), so the analog
  // scheme can be flown without a pad. A pad's real trigger depth wins when it is deeper.
  let kLT = 0, kRT = 0;
  function pollInput(dt) {
    let yaw = 0;
    if (keys.has('ArrowLeft') || keys.has('KeyA')) yaw -= 1;
    if (keys.has('ArrowRight') || keys.has('KeyD')) yaw += 1;
    const holdL = keys.has('KeyQ') || keys.has('KeyJ') || keys.has('ShiftLeft') || touchLT;
    const holdR = keys.has('KeyE') || keys.has('KeyK') || keys.has('Space') || keys.has('ShiftRight') || touchRT;
    const step = (dt || 0) / Math.max(0.01, P.inKeyRamp);
    kLT = clamp01(kLT + (holdL ? step : -step)); kRT = clamp01(kRT + (holdR ? step : -step));
    let lt = kLT, rt = kRT;
    let pads = [];
    try { pads = navigator.getGamepads ? Array.from(navigator.getGamepads()).filter(Boolean) : []; } catch (e) { pads = []; }
    for (const gp of pads) {
      const ax = gp.axes[0] || 0, l = gp.buttons[6] ? gp.buttons[6].value : 0, r = gp.buttons[7] ? gp.buttons[7].value : 0;
      if (Math.abs(ax) > 0.12) yaw = ax; lt = Math.max(lt, l); rt = Math.max(rt, r);
      if (autopilot && (Math.abs(ax) > 0.3 || l > 0.3 || r > 0.3)) manual();
    }
    if (dragX != null) yaw = dragYaw;
    input.yaw = Math.max(-1, Math.min(1, yaw)); input.lt = lt; input.rt = rt;
  }

  // ================= sizing + loop (manual clock for recorders) =================
  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now(), accum = 0;
  const FIXED = 1 / 60;
  function frame(now) {
    const real = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) {
      resize(); pollInput(real * (slowmo ? 0.25 : 1));
      if (!paused) { accum += real * (slowmo ? 0.25 : 1); let n = 0; while (accum >= FIXED && n < 6) { simStep(FIXED); accum -= FIXED; n++; } if (n === 6) accum = 0; }
      render();
    }
    requestAnimationFrame(frame);
  }
  // First open: B flies the lead approach, so the page opens on a comparison (saved settings win after that).
  if (!hadSaved && activePreset === 'Analog triggers') Object.assign(P, SHIPPED, VARIANTS.find((va) => va.name === activePreset).v);
  reset(); resize(); refreshDiff(); pressed(); render(); requestAnimationFrame(frame);

  window.__lab = {
    LAB, SHIPPED, SPEC, P, PLATFORM, VARIANTS, COLS,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { dt = dt || FIXED; n = n || 1; for (let i = 0; i < n; i++) simStep(dt); resize(); render(); },
    reset, score, runBatch, setParam, applyPreset, record: recordDecision, parityTrace,
    runScenario: (overrides, seedN, kind, dt) => { const sc = scenario(seedN || 1, kind || 'reeled'); return peaks(runScenario(Object.assign({}, SHIPPED, overrides || {}), sc, dt || FIXED), sc); },
    runRows: (overrides, seedN, kind, dt, pilot) => { const sc = scenario(seedN || 1, kind || 'reeled', pilot), r = runScenario(Object.assign({}, SHIPPED, overrides || {}), sc, dt || FIXED); return { pressAt: sc.pressAt, releaseAt: sc.releaseAt, launchAt: r.launchAt, rows: r.rows.map((q) => ({ t: q.t, mode: q.mode, bs: len(q.bv), bv: q.bv, slack: q.slack, sy: yawOf(q.sv) * R2D, ss: len(q.sv), rp: q.rp, rv: q.rv, ny: q.ny, py: q.py, th: q.th, pvx: q.pvx, pvz: q.pvz, ext: q.ext, hull: q.hull * R2D, cy: q.cy * R2D, spect: q.spect, turning: q.turning, braking: q.braking })) }; },
    state: () => ({ t: A.t, seed, modeA: A.solver.Mode, modeB: B.solver.Mode, ballA: A.solver.BallSpeed, ballB: B.solver.BallSpeed, preset: currentName() }),
  };
})();
</script>
