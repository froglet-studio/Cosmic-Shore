  Everything else (the contract the /labmaker skill describes) is already wired:

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manta Bomb Drop Lab</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5d6673; --line: #dde1e6;
    --accent: #2f6fdb; --warn: #b4560b; --ok: #1f7a43; --stage: #0b0e14; --changed: #2f6fdb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --panel: #171b21; --ink: #e6e9ee; --muted: #98a2b0; --line: #2a313b;
      --accent: #6ea0ff; --warn: #f0a050; --ok: #5cc98a; --stage: #05070a; --changed: #6ea0ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --panel: #171b21; --ink: #e6e9ee; --muted: #98a2b0; --line: #2a313b;
    --accent: #6ea0ff; --warn: #f0a050; --ok: #5cc98a; --stage: #05070a; --changed: #6ea0ff;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* outside the claude.ai viewer a component rule can beat [hidden] */
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  /* The editor layout: header / stage + right dock / bottom dock. Nothing scrolls the PAGE. */
  #app { display: grid; height: 100vh; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr) 200px; grid-template-areas: "head head" "stage dock" "bottom dock"; }
  header { grid-area: head; display: flex; gap: 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; }
  header .meta { color: var(--muted); }
  header .spacer { flex: 1; }

  #stageWrap { grid-area: stage; position: relative; min-height: 0; background: var(--stage); }

  .tabs button[aria-selected="true"], .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

  textarea, select, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  /* Below 900 px the docks stack under the stage; the page may scroll there, the stage keeps a 16:10 box. */

<body>
<div id="app">
  <header>
    <h1 id="title"></h1>
    <span class="meta" id="meta"></span>
    <span id="diff"></span>
    <span class="spacer"></span>
    <span class="meta" id="platform"></span>

    <button class="btn" id="resetAll">Shipped</button>
  </header>
  <div id="stageWrap"><canvas id="stage"></canvas><div id="hud"></div></div>
  <aside id="dock"><div class="tabs" id="dockTabs" role="tablist"></div><div id="dockBody"></div></aside>
  <section id="bottom"><div class="tabs" id="bottomTabs" role="tablist"></div><div id="bottomBody"></div></section>
</div>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);

  // ================= (1) LAB meta + the shipped numbers =================
  // A READER of the shipped numbers. Every constant names the asset or field it was copied from
  // (bleeding-edge bbee6b66b, 2026-11-13). Keys marked "lab" have no game field: they are this round's proposal.
  const LAB = { name: 'Manta Bomb Drop Lab', branch: 'claude/manta-bomb-drop', round: 1, doc: 'Docs/Manta/POLISH.md' };
  const SHIPPED = {
    // MantaStingConfig.asset (Assets/_SO_Assets/VesselActions/Manta)
    energyPerSkim: 0.34,     // MantaStingConfigSO.energyPerSkim
    energyCapacity: 1,       // MantaStingConfigSO.energyCapacity (1 energy = 1 bomb)
    perPrismCooldown: 1.5,   // MantaStingConfigSO.perPrismEnergyCooldown (s)
    fuseSeconds: 20,         // MantaStingConfigSO.fuseSeconds (x fuseScale 1 at Charge 0)
    fuseBlastScale: 70,      // MantaStingConfigSO.fuseBlastScale (AOEMantaBloom SphereCollider r 0.5 -> 35 m)
    kabloomBlastScale: 140,  // MantaStingConfigSO.kabloomBlastScale
    omniPerExtraBomb: 0.35,  // MantaStingConfigSO.omniScalePerExtraBomb
    omniMultMax: 3,          // MantaStingConfigSO.omniScaleMultiplierMax
    bloomGrowSeconds: 2.5,   // MantaStingConfigSO.bloomGrowSeconds
    omniGrowSeconds: 4,      // MantaStingConfigSO.omniBloomGrowSeconds
    chainBeat: 0.12,         // PrismExplosiveChain.BeatSeconds
    chainReach: 1.6,         // PrismExplosiveChain.ReachInExtents (x the prism's largest extent, 8 m)
    skimScale: 20,           // Manta.prefab Skimmer.Scale.Value (20 at Space 0; sphere r = scale x 0.5)
    cruise: 180,             // Manta.prefab VesselTransformer.DefaultThrottleScaler (full throttle, Time 0)
    // lab: the proposal under test (no game field yet)
    detonator: 0,            // lab: 0 none (shipped), 1 DROP, 2 LAUNCH
    ownFuse: 0,              // lab: 0 = a dropped/launched bomb joins the shared fuse (resets it); >0 = its own fuse (s)
    launchSpeed: 400,        // lab: launched bomb speed over the Manta's (u/s)
    launchRange: 300,        // lab: a launched bomb that hits nothing stops here and waits (m)
    mineCap: 0,              // lab: most loose bombs (dropped or launched) alive at once; 0 = no cap
    // lab: the world (a stand-in for a rival-trail-rich cell)
    trailEvery: 10,          // lab: a new rival trail every N s
    trailLife: 40,           // lab: a rival trail prism lives this long (s)
    floraCount: 8,           // lab: joustable flora in the 1600 x 1000 m board
    // lab: the input-only AI pilot
    aiRam: 1,                // lab: with no detonator, may the AI ram (1) or must it joust (0)?
    aiRun: 20,               // lab: primed prisms in a run before the AI sets it off
    aiOffset: 9,             // lab: how far off the trail's centre line the AI skims (m)
    aiNoise: 0.08,           // lab: stick noise (0.08 skilled; the rookie column uses 0.5)
  };

  // ================= (2) SPEC =================
  const SPEC = [
    ['Proposal', 'detonator',   0, 2, 1,    'Detonator (0 none, 1 drop, 2 launch)', 'The control under test. 0 is the shipped kit: ram a primed prism or joust a bomb onto a lifeform near it.'],
    ['Proposal', 'ownFuse',     0, 10, 0.5, 'Loose bomb fuse (0 = shared)', '0: a dropped or launched bomb joins the bay\'s ONE fuse and resets it, like a plant (§0). Above 0: it blooms on its own after this many seconds, outside the shared fuse.'],
    ['Proposal', 'launchSpeed', 100, 900, 10, 'Launch speed (u/s)', 'Added to the Manta\'s own speed along its nose.'],
    ['Proposal', 'launchRange', 50, 800, 10, 'Launch range (m)', 'A launched bomb that touches nothing stops here and waits, like a dropped one.'],
    ['Proposal', 'mineCap',     0, 6, 1,    'Loose bombs at once (0 = no cap)', 'Refuse a drop or launch while this many loose bombs are out. 0 = only the energy pool limits it.'],
    ['Kit',      'energyPerSkim', 0.05, 1, 0.01, 'Energy per skim', 'MantaStingConfigSO.energyPerSkim. One energy is one bomb.'],
    ['Kit',      'energyCapacity', 1, 4, 1, 'Energy capacity', 'MantaStingConfigSO.energyCapacity.'],
    ['Kit',      'perPrismCooldown', 0, 5, 0.1, 'Per-prism cooldown (s)', 'MantaStingConfigSO.perPrismEnergyCooldown.'],
    ['Kit',      'fuseSeconds', 5, 40, 1,   'Shared fuse (s)', 'MantaStingConfigSO.fuseSeconds at Charge 0.'],
    ['Kit',      'fuseBlastScale', 20, 200, 5, 'Fuse bloom scale', 'Radius = scale x 0.5 m.'],
    ['Kit',      'kabloomBlastScale', 40, 300, 5, 'Omni bloom scale', 'Radius = scale x 0.5 m, times the omni multiplier.'],
    ['Kit',      'omniPerExtraBomb', 0, 1, 0.05, 'Omni +per extra bomb', 'MantaStingConfigSO.omniScalePerExtraBomb.'],
    ['Kit',      'omniMultMax', 1, 5, 0.1, 'Omni multiplier cap', 'MantaStingConfigSO.omniScaleMultiplierMax.'],
    ['Kit',      'bloomGrowSeconds', 0.2, 6, 0.1, 'Bloom grow (s)', 'MantaStingConfigSO.bloomGrowSeconds.'],
    ['Kit',      'omniGrowSeconds', 0.2, 8, 0.1, 'Omni bloom grow (s)', 'MantaStingConfigSO.omniBloomGrowSeconds.'],
    ['Kit',      'chainBeat', 0.02, 1, 0.01, 'Chain beat (s)', 'PrismExplosiveChain.BeatSeconds.'],
    ['Kit',      'chainReach', 0, 3, 0.1, 'Chain reach (extents)', 'PrismExplosiveChain.ReachInExtents. 0 turns the chain off (a control).'],
    ['Kit',      'skimScale', 20, 40, 1, 'Skimmer scale', 'Manta.prefab Skimmer.Scale (Space 0 = 20, Space 10 = 40).'],
    ['Kit',      'cruise', 90, 600, 10, 'Speed (u/s)', '180 is full throttle at Time 0; 600 is about Soar.'],
    ['World',    'trailEvery', 4, 30, 1, 'New rival trail every (s)', 'lab'],
    ['World',    'trailLife', 10, 120, 1, 'Rival prism life (s)', 'lab'],
    ['World',    'floraCount', 0, 30, 1, 'Flora on the board', 'lab: joust targets for the shipped way'],
    ['AI',       'aiRam', 0, 1, 1, 'No detonator: ram (1) or joust (0)', 'lab'],
    ['AI',       'aiRun', 3, 60, 1, 'Run length before setting it off', 'lab: primed prisms in a row'],
    ['AI',       'aiOffset', 5, 16, 0.5, 'Skim offset (m)', 'lab: centre line to hull; a prism is 8 m wide'],
    ['AI',       'aiNoise', 0, 1, 0.01, 'Stick noise', 'lab: 0.08 skilled, 0.5 rookie'],
  ];

  const LS_KEY = 'lab:' + LAB.name + ':P';
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private window */ } };
  const P = Object.assign({}, SHIPPED, lsGet(LS_KEY, {}));
  for (const k of Object.keys(P)) if (!(k in SHIPPED)) delete P[k];

  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ================= (3) THE MODEL =================
  // Top-down 2D. Rival trails are lines of prisms 6 m apart (the Manta trail's 5.5 m Z plus a gap), 8 m wide.
  // The Manta skims them (skimmer sphere r = skimScale/2 + the prism's half width), which primes each one explosive and
  // pays energy. A hull contact (r 3 m + 4 m) destroys the prism, sets off every planted or loose bomb at the fuse scale
  // and loses all energy (§0). An explosive prism's death destroys the prisms within chainReach x 8 m on its trail after
  // chainBeat; explosive ones carry it on. Blooms destroy every rival prism inside their growing radius.
  const W = 1600, H = 1000, SPACING = 6, PRISM_HALF = 4, PRISM_EXTENT = 8, HULL_R = 3, TURN_RATE = 1.75; // rad/s: lab
  let world = null, seed = 7, input = { stick: 0, drop: false, launch: false }, humanDrive = false;
  // trial = one long rival trail laid ahead of the Manta, nothing else spawns, no omni crystal: "you have primed a run,
  // now set it off" with nothing else going on. The free board (trial false) is the Space destruction game.
  let trialMode = false;
  function reset(s, trial) {
    if (s != null) seed = s >>> 0;
    if (trial != null) trialMode = !!trial;
    const rnd = mulberry32(seed);
    const flora = [];
    for (let i = 0; i < Math.round(P.floraCount); i++) flora.push({ x: 80 + rnd() * (W - 160), y: 80 + rnd() * (H - 160), bombed: false });
    world = {
      t: 0, rnd, noiseRnd: mulberry32(seed ^ 0x9e3779b9), noise: 0,
      m: { x: W / 2, y: H / 2, h: 0, energy: 0, hullHits: 0, lastHit: -9, energyLost: 0, prevDrop: false, prevLaunch: false },
      trails: [], nextTrail: 0, flora, omni: { x: 200 + rnd() * (W - 400), y: 150 + rnd() * (H - 300), respawnAt: -1 },
      bombs: [],        // {x,y,kind:'flora'|'loose', flora?, ownAt?, vx,vy, travel, moving}
      fuseAt: Infinity, blooms: [], chainQ: [],
      stats: { destroyed: 0, primed: 0, primedDestroyed: 0, chains: 0, blooms: 0, peakBlooms: 0, bombsUsed: 0, waitSum: 0, looseOut: 0, omni: 0 },
      ai: { run: 0, mode: 'skim', target: null, trail: -1 }, hitLog: [],
    };
    if (!trialMode) { spawnTrail(); spawnTrail(); return; }
    // the trial: a 240-prism line starting 40 m ahead, gently curving, the Manta parallel to it at aiOffset
    world.m.x = 100; world.m.y = H / 2 - P.aiOffset; world.m.h = 0;
    const prisms = []; let x = 140, y = H / 2, h = 0; const bend = (rnd() - 0.5) * 0.004;
    for (let i = 0; i < 240; i++) { h += bend + (rnd() - 0.5) * 0.004; x += Math.cos(h) * SPACING; y += Math.sin(h) * SPACING; prisms.push({ x, y, h, alive: true, primed: false, primedAt: 0, skimAt: -99, dieAt: Infinity }); }
    const xs = prisms.map((p) => p.x), ys = prisms.map((p) => p.y);
    world.trails.push({ prisms, minX: Math.min(...xs) - 30, maxX: Math.max(...xs) + 30, minY: Math.min(...ys) - 30, maxY: Math.max(...ys) + 30 });
    world.nextTrail = Infinity; world.omni.respawnAt = Infinity;
    for (const f of flora) { const p = prisms[20 + Math.floor(rnd() * 200)]; const off = (15 + rnd() * 185) * (rnd() < 0.5 ? -1 : 1); f.x = p.x - Math.sin(p.h) * off; f.y = p.y + Math.cos(p.h) * off; }
  }
  function spawnTrail() {
    const r = world.rnd, n = 80 + Math.floor(r() * 60);
    let x = 150 + r() * (W - 300), y = 120 + r() * (H - 240), h = r() * Math.PI * 2, bend = (r() - 0.5) * 0.02;
    if (world.m && Math.hypot(x - world.m.x, y - world.m.y) < 250) { x = (x + W / 2) % W; y = (y + H / 2) % H; } // never lay a trail on the hull
    const prisms = [];
    for (let i = 0; i < n; i++) {
      h += bend + (r() - 0.5) * 0.01;
      // keep inside the board: steer back toward the centre near the walls
      if (x < 80 || x > W - 80 || y < 80 || y > H - 80) h += 0.12 * Math.sign(Math.sin(Math.atan2(H / 2 - y, W / 2 - x) - h) || 1);
      x += Math.cos(h) * SPACING; y += Math.sin(h) * SPACING;
      prisms.push({ x, y, h, alive: true, primed: false, primedAt: 0, skimAt: -99, dieAt: world.t + P.trailLife + i * 0.02 });
    }
    const xs = prisms.map((p) => p.x), ys = prisms.map((p) => p.y);
    world.trails.push({ prisms, minX: Math.min(...xs) - 30, maxX: Math.max(...xs) + 30, minY: Math.min(...ys) - 30, maxY: Math.max(...ys) + 30 });
    world.nextTrail = world.t + P.trailEvery;
  }
  function killPrism(tr, i, why) {
    const p = tr.prisms[i]; if (!p.alive) return; p.alive = false;
    if (why !== 'expire') {
      world.stats.destroyed++;
      if (p.primed) { world.stats.primedDestroyed++; world.stats.waitSum += world.t - p.primedAt; if (world.stats.firstBoom == null) world.stats.firstBoom = world.t; }
    }
    if (p.primed && why !== 'expire' && P.chainReach > 0) {
      const reach = P.chainReach * PRISM_EXTENT, k = Math.max(1, Math.floor(reach / SPACING));
      for (let j = Math.max(0, i - k); j <= Math.min(tr.prisms.length - 1, i + k); j++) if (j !== i && tr.prisms[j].alive) world.chainQ.push({ tr, j, at: world.t + P.chainBeat });
    }
  }
  function bloom(x, y, scale, grow) {
    world.blooms.push({ x, y, R: scale * 0.5, grow: Math.max(0.05, grow), t0: world.t, chainsBefore: 0 });
    world.stats.blooms++;
  }
  function liveBombs() { return world.bombs.filter((b) => !b.done); }
  function looseOut() { return world.bombs.filter((b) => !b.done && b.kind === 'loose').length; }
  function detonateAll(scaleFn, grow) {
    const live = liveBombs(); const m = world.m;
    live.sort((a, b) => Math.hypot(a.x - m.x, a.y - m.y) - Math.hypot(b.x - m.x, b.y - m.y));
    for (const b of live) { b.done = true; if (b.flora) b.flora.bombed = false; bloom(b.x, b.y, scaleFn(live.length), grow); }
    world.fuseAt = Infinity;
  }
  function spendBomb() { world.m.energy -= 1; world.stats.bombsUsed++; }
  function resetFuse() { world.fuseAt = world.t + P.fuseSeconds; }

  function simStep(dt, inp) {
    const w = world, m = w.m;
    inp = inp || (humanDrive ? input : aiInput(dt));
    // --- fly (inputs only: stick + two buttons) ---
    m.h += Math.max(-1, Math.min(1, inp.stick)) * TURN_RATE * dt;
    m.x += Math.cos(m.h) * P.cruise * dt; m.y += Math.sin(m.h) * P.cruise * dt;
    // the board wraps, so a pilot never stalls on a wall
    if (m.x < 0) m.x += W; if (m.x > W) m.x -= W; if (m.y < 0) m.y += H; if (m.y > H) m.y -= H;
    // --- world ---
    if (w.t >= w.nextTrail) spawnTrail();
    for (const tr of w.trails) for (let i = 0; i < tr.prisms.length; i++) { const p = tr.prisms[i]; if (p.alive && w.t >= p.dieAt) killPrism(tr, i, 'expire'); }
    // --- skim + hull ---
    const skimR = P.skimScale * 0.5 + PRISM_HALF, hullR = HULL_R + PRISM_HALF;
    let hit = null;
    for (const tr of w.trails) {
      if (m.x < tr.minX - skimR || m.x > tr.maxX + skimR || m.y < tr.minY - skimR || m.y > tr.maxY + skimR) continue;
      for (let i = 0; i < tr.prisms.length; i++) {
        const p = tr.prisms[i]; if (!p.alive) continue;
        const d = Math.hypot(p.x - m.x, p.y - m.y);
        if (d < skimR) {
          if (!p.primed) { p.primed = true; p.primedAt = w.t; w.stats.primed++; w.ai.run++; }
          if (w.t - p.skimAt >= P.perPrismCooldown) { p.skimAt = w.t; m.energy = Math.min(P.energyCapacity, m.energy + P.energyPerSkim); }
        }
        if (d < hullR && !hit) hit = { tr, i };
      }
    }
    if (hit && inp.over) hit = null;   // pitched over the ribbon on purpose (the 3D escape this 2D board lacks)
    if (hit) {
      const fresh = w.t - m.lastHit > 0.5; m.lastHit = w.t;    // one crash = one scrape, however many prisms it plows
      if (fresh && hit.tr.prisms[hit.i].primed) w.stats.chains++;   // a ram into a primed prism sets its run off
      if (fresh) m.hullHits++; m.energyLost += m.energy; m.energy = 0;
      if (w.hitLog.length < 200) { const hp = hit.tr.prisms[hit.i]; w.hitLog.push({ t: +w.t.toFixed(2), rel: +angleTo(m.h - hp.h).toFixed(2), primed: hp.primed, mode: w.ai.ramming ? 'ram' : 'skim', trail: w.trails.indexOf(hit.tr), idx: hit.i, n: hit.tr.prisms.length }); }
      killPrism(hit.tr, hit.i, 'hull');
      detonateAll(() => P.fuseBlastScale, P.bloomGrowSeconds);
      w.ai.run = 0;
    }
    // --- the proposal: a drop or a launch, on a press edge, from the same pool ---
    const pressDrop = inp.drop && !m.prevDrop, pressLaunch = inp.launch && !m.prevLaunch;
    m.prevDrop = !!inp.drop; m.prevLaunch = !!inp.launch;
    const wants = (P.detonator === 1 && pressDrop) || (P.detonator === 2 && pressLaunch);
    if (wants && m.energy >= 1 - 1e-9 && (P.mineCap <= 0 || looseOut() < P.mineCap)) {
      spendBomb();
      const b = { kind: 'loose', x: m.x, y: m.y, vx: 0, vy: 0, travel: 0, moving: P.detonator === 2, ownAt: P.ownFuse > 0 ? w.t + P.ownFuse : null };
      if (b.moving) { const v = P.cruise + P.launchSpeed; b.vx = Math.cos(m.h) * v; b.vy = Math.sin(m.h) * v; }
      w.bombs.push(b); w.stats.looseOut++;
      if (!b.ownAt) resetFuse();
      w.ai.run = 0;
    }
    // --- launched bombs fly until they touch a prism or a flora, or reach their range ---
    for (const b of w.bombs) {
      if (b.done || !b.moving) continue;

    if (!c || typeof c.use !== 'function') return;
    try { db = await c.use('db'); } catch (e) { db = null; }
    try { const u = await c.use('user'); if (u) me = (await u.id()) || ''; } catch (e) { me = ''; }
    if (!db) return;
    db.collection('decisions').orderBy('createdAt', 'desc').limit(300).onSnapshot((snap) => { remote = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderLog(); }, () => { db = null; });
  })();

  const COL_NAMES = { destroyedPerMin: 'Destroyed /min', primedSetOffPct: 'Primed set off %', chainsPerMin: 'Chains /min', hullHitsPerMin: 'Crashes /min', energyLostPerMin: 'Energy lost /min', waitS: 'Wait prime to boom (s)', bombsPerMin: 'Bombs /min', bloomsPerMin: 'Blooms /min', peakBlooms: 'Peak blooms' };
  function scorecardPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p><button class="btn primary" id="runTrials">Score the trials</button> <span class="hint">one primed run, nothing else going on: 12 seeded trials of 45 s</span> &nbsp; <button class="btn" id="trialView">Fly a trial</button> <button class="btn" id="boardView">Fly the free board</button></p><p><button class="btn primary" id="runBatch">Score the free board</button> <span class="hint">headless: seeds 1-5, 120 s each, a skilled and a rookie AI (stick noise 0.5); your settings are the base</span></p><div style="overflow:auto"><table id="scoreTable"></table></div>';
    box.querySelector('#trialView').onclick = () => reset(null, true);
    box.querySelector('#boardView').onclick = () => reset(null, false);
    box.querySelector('#runTrials').onclick = () => {
      const rows = runTrials(), t = box.querySelector('#scoreTable'), names = { setOffPct: 'Primed set off %', trialsSetOff: 'Trials set off', secondsToBoom: 'Seconds ready to boom', crashes: 'Crashes', energyLost: 'Energy lost', bombs: 'Bombs spent' };
      t.innerHTML = '<tr><th>Variant</th><th>Pilot</th>' + TCOLS.map((c) => '<th>' + names[c] + '</th>').join('') + '</tr>';
      for (const r of rows) { const tr = document.createElement('tr'); for (const v of [r.variant, r.pilot].concat(TCOLS.map((c) => r[c]))) { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); } t.appendChild(tr); }
    };
    box.querySelector('#runBatch').onclick = () => {
      const rows = runBatch(), t = box.querySelector('#scoreTable');
      t.innerHTML = '<tr><th>Variant</th><th>Pilot</th>' + COLS.map((c) => '<th>' + COL_NAMES[c] + '</th>').join('') + '</tr>';
      for (const r of rows) { const tr = document.createElement('tr'); for (const v of [r.variant, r.pilot].concat(COLS.map((c) => r[c]))) { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); } t.appendChild(tr); }
    };
    return box;
  }
  function aboutPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p id="aboutHead"></p><p><b>The question.</b> The Manta primes rival prisms explosive by skimming them, but today it can only set them off by ramming one (which also sets off every bomb at the small scale and loses all its energy) or by jousting a bomb onto a lifeform that happens to sit near them. Would a DROP or a LAUNCH, spending a bomb from the same pool, let it set its own explosive prisms off, and at what cost?</p>' +
      '<p><b>Fly it.</b> Press <b>Y</b> (or tap the stage) to take the stick: A/D or left/right turn, hold <b>W</b> or up to pitch over a trail (2D stand-in for 3D), <b>Space</b> drops, <b>F</b> launches (only the detonator you picked works). Press Y again to give it back to the AI.</p>' +
      '<p class="hint"><b>What this does NOT model:</b> it is top-down 2D (no pitch, no 3D trails); the rival trails are a stand-in (straight-ish lines that appear every few seconds and expire, no rival pilots, no PvP petals, no silence); crossing a trail is a free \'pitch over\' input the AI uses only to reach a flora or the omni crystal; no Soar and no Yawstery turn (a flat 100 deg/s turn); no fauna, no heart crystals, no decoys, no Contagion; the omni crystal sits still and respawns 8 s after pickup; bloom damage is a growing circle that destroys every rival prism inside (shields, super-shields and the Space 5 Shield Breaker are not modelled); the hull radius (3 m) and the turn rate are lab guesses; frame cost is counted as blooms, never measured on a GPU; no network.</p>';
    box.querySelector('#aboutHead').textContent = LAB.name + ' - round ' + LAB.round + ' - ' + LAB.branch + ' - write-up: ' + LAB.doc;
    return box;
  }
  // ================= the human pilot: the same input object the AI writes =================
  const keys = {};
  addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'KeyY') { humanDrive = !humanDrive; }
    if (e.code === 'Space') e.preventDefault();
  });
  addEventListener('keyup', (e) => { keys[e.code] = false; });
  canvas.addEventListener('pointerdown', () => { humanDrive = true; });
  function readHuman() {
    let stick = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    let drop = !!keys.Space, launch = !!keys.KeyF, over = !!keys.KeyW || !!keys.ArrowUp;
    try { const gp = (navigator.getGamepads ? navigator.getGamepads() : [])[0]; if (gp) { if (Math.abs(gp.axes[0]) > 0.15) stick = gp.axes[0]; drop = drop || gp.buttons[0].pressed; launch = launch || gp.buttons[2].pressed; } } catch (e) { /* the viewer may block the Gamepad API */ }
    input = { stick, drop, launch, over };
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Scorecard', build: scorecardPanel }, { name: 'Decisions', build: logPanel }, { name: 'About', build: aboutPanel }], 'lab:' + LAB.name + ':bottom');

  $('title').textContent = LAB.name; $('meta').textContent = 'round ' + LAB.round;
  let paused = false;
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); lsSet(LS_KEY, {}); for (const k in outputs) outputs[k].inp.value = P[k]; reset(); refreshDiff(); };

  // ================= sizing + loop (with a manual clock for recorders) =================
  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) { resize(); if (!paused) { if (humanDrive) readHuman(); simStep(dt); } render(); }
    requestAnimationFrame(frame);
  }
  reset(); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  // ================= the test surface =================
  // Everything a recorder, the verifier or a future Claude needs, and nothing it must not touch.
  window.__lab = {
    LAB, SHIPPED, SPEC, P, PLATFORM, VARIANTS,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { n = n || 1; for (let i = 0; i < n; i++) simStep(dt); resize(); render(); },
    reset, score, runBatch, runTrials, set trial(v) { reset(null, !!v); }, setParam, record,
    state: () => ({ t: world.t, seed, energy: world.m.energy, bombs: liveBombs().length, human: humanDrive, stats: Object.assign({}, world.stats), hitLog: world.hitLog.slice() }),
    set humanDrive(v) { humanDrive = !!v; }, setInput(i) { input = Object.assign({ stick: 0, drop: false, launch: false }, i); },
  };
})();
</script>
</body>
</html>
