<!doctype html>
<!--
  OMNI MOTION LAB — the next round of the omni crystal's element effects, on the shipped omni:
    (1) Mass:   the triangle prisms seal fully once they are in the camera's visible hemisphere (seal at the horizon);
    (2) Space:  the squares move twice per loop instead of three times (pentagon turn, then ONE smooth triangle turn);
    (3) Time:   the rhombus flips are scheduled into the squares' stops, so squares and rhombi never move at once;
    (4) Charge: many candidate effects for the pentagons, shown on the omni AND on the elemental Charge crystal.
  Shipped numbers are READ (the data block below, baked by Tools/Build/omni_combine_lab_assets.py, the same block the
  Omni Combine Lab carries). Every lab knob is a proposal. Write-up: Docs/Studios/OMNI_MOTION_LAB.md.
  Verify: node .claude/skills/labmaker/verify_lab.cjs Docs/Studios/OmniMotionLab.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Omni Motion Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  /* Layout: an editor. Stage in the middle with the beat timeline under it, settings dock on the right,
     scorecard / gallery / decisions below. Palette: the omni's lime over a graphite stage, shared with the
     Omni Combine and Omni Shepard labs so the family reads as one tool; the element lanes take muted tints. */
  :root {
    --bg: #f3f5f1; --panel: #ffffff; --ink: #1a1f1a; --muted: #5b6659; --line: #dbe1d8;
    --accent: #3f7d0a; --accent-ink: #ffffff; --warn: #a65a08; --ok: #2f7a2f; --stage: #090c0a;
    --changed: #3f7d0a; --stage-ink: #cfdccb;
    --lane-space: #4f9fd6; --lane-time: #a07ae0; --lane-charge: #e0b43a; --lane-mass: #e07a6a;
    --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e110e; --panel: #151a15; --ink: #e4ebe1; --muted: #93a08f; --line: #263026;
      --accent: #8fd63a; --accent-ink: #0b1208; --warn: #f0a450; --ok: #7fd17f; --stage: #050705; --changed: #a5e35a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e110e; --panel: #151a15; --ink: #e4ebe1; --muted: #93a08f; --line: #263026;
    --accent: #8fd63a; --accent-ink: #0b1208; --warn: #f0a450; --ok: #7fd17f; --stage: #050705; --changed: #a5e35a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--body); overflow: hidden; }
  #app { display: grid; height: 100%; grid-template-columns: minmax(0, 1fr) 350px; grid-template-rows: auto minmax(0, 1fr) 64px 220px; grid-template-areas: "head head" "stage dock" "beats dock" "bottom dock"; }
  header { grid-area: head; display: flex; gap: 8px 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; min-width: 0; }
  header h1 { font: 600 16px/1 var(--display); letter-spacing: 0.04em; margin: 0; text-transform: uppercase; }
  header .meta { color: var(--muted); }
  header .spacer { flex: 1; }
  #diff { color: var(--changed); }
  #stageWrap { grid-area: stage; position: relative; min-height: 0; background: var(--stage); overflow: hidden; }
  #stage { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #hud { position: absolute; left: 12px; right: 12px; top: 10px; color: var(--stage-ink); font: 12px/1.55 var(--mono); pointer-events: none; white-space: pre-wrap; overflow: hidden; text-shadow: 0 1px 2px #000; }
  #cells { position: absolute; inset: 0; pointer-events: none; }
  #cells .cell { position: absolute; color: var(--stage-ink); font: 600 11px/1.3 var(--display); letter-spacing: 0.05em; text-transform: uppercase; padding: 6px 8px; border: 1px solid rgba(207, 220, 203, 0.12); }
  #cells .cell span { display: block; font: 10px/1.3 var(--mono); text-transform: none; letter-spacing: 0; color: #93a08f; }
  #cells .cell.on { border-color: #8fd63a; }
  #stageBtns { position: absolute; right: 12px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  #stageBtns .btn { background: rgba(20, 28, 20, 0.85); color: #dfe9da; border-color: #2c3a2c; }
  @media (max-width: 600px) { #hud { display: none; } #stageBtns { left: 8px; right: 8px; bottom: 6px; } #stageBtns .btn { font-size: 11px; padding: 2px 6px; } }
  #beatsWrap { grid-area: beats; border-top: 1px solid var(--line); background: var(--panel); position: relative; min-height: 0; }
  #beats { width: 100%; height: 100%; display: block; }
  #dock { grid-area: dock; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px 16px 16px; }
  #bottom { grid-area: bottom; border-top: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 8px 16px; min-width: 0; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .tabs button, .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit; }
  .tabs button { font: 600 11px/1.4 var(--display); letter-spacing: 0.06em; text-transform: uppercase; }
  .tabs button[aria-selected="true"], .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: grid; grid-template-columns: 1fr 64px; gap: 2px 8px; margin: 8px 0; }
  .row label { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .row label .key { color: var(--muted); font: 11px var(--mono); }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .row output { text-align: right; font: 12px var(--mono); font-variant-numeric: tabular-nums; }
  .row output.changed { color: var(--changed); text-decoration: underline; }
  .row .tip { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .row select { grid-column: 1 / -1; }
  .styles, .modes { display: grid; gap: 8px; }
  .modes { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .style { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: grid; gap: 4px; align-content: start; }
  .style h3 { margin: 0; font: 600 13px/1.3 var(--display); letter-spacing: 0.03em; }
  .style p { margin: 0; color: var(--muted); font-size: 12px; }
  .style.on { border-color: var(--accent); }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .pill { display: inline-block; font: 10px/1.6 var(--mono); padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.ctl { color: var(--warn); border-color: var(--warn); }
  .pill.ship { color: var(--ok); border-color: var(--ok); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font: 600 11px var(--display); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  td.num { font-family: var(--mono); }
  .bad { color: var(--warn); font-weight: 600; }
  .good { color: var(--ok); font-weight: 600; }
  .hint { color: var(--muted); }
  .status-ok { color: var(--ok); } .status-warn { color: var(--warn); }
  textarea, select, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }
  .tablewrap { overflow-x: auto; }
  pre.export { white-space: pre-wrap; font: 12px/1.5 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px; margin: 0; }
  h4 { margin: 10px 0 4px; font: 600 12px var(--display); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  @media (max-width: 900px) {
    body { overflow: auto; }
    #app { display: block; height: auto; }
    #stageWrap { aspect-ratio: 4 / 3; max-width: 100%; }
    #beatsWrap { height: 64px; }
    #dock, #bottom { border: 0; border-top: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title"></h1>
    <span class="meta" id="meta"></span>
    <span id="diff"></span>
    <span class="spacer"></span>
    <span class="meta" id="platform"></span>
    <button class="btn" id="pause">Pause</button>
    <button class="btn" id="resetAll">Shipped</button>
  </header>
  <div id="stageWrap">
    <canvas id="stage" aria-label="The omni crystal and the Charge crystal, animated. Drag to orbit."></canvas>
    <div id="cells"></div>
    <div id="hud"></div>
    <div id="stageBtns">
      <button class="btn" id="cmpOmni">Compare charge on the omni</button>
      <button class="btn" id="cmpCrystal">Compare charge on the Charge crystal</button>
      <button class="btn" id="cmpExit" hidden>Back to one view</button>
    </div>
  </div>
  <div id="beatsWrap"><canvas id="beats" aria-label="The beat timeline: when the squares, the rhombi and the Charge pentagons move."></canvas></div>
  <aside id="dock"><div class="tabs" id="dockTabs" role="tablist"></div><div id="dockBody"></div></aside>
  <section id="bottom"><div class="tabs" id="bottomTabs" role="tablist"></div><div id="bottomBody"></div></section>
</div>

  $('pause').onclick = () => setPaused(!paused);
  $('resetAll').onclick = () => applyStyle(STYLES[0]);
  let drag = null;
  canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, yaw: cam.yaw, pitch: cam.pitch }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => { if (!drag) return; cam.yaw = drag.yaw - (e.clientX - drag.x) * 0.008; cam.pitch = Math.max(-1.4, Math.min(1.4, drag.pitch + (e.clientY - drag.y) * 0.008)); });

    reset, score: () => measure(P, { secs: 8, hz: 8 }), runBatch: (o) => runBatch(Object.assign({ secs: 10, hz: 8 }, o || {})), runFullBatch: runBatch, runChargeBatch, measure, clipSelfTest, clipTimeline,
    setParam, applyStyle, record, beatsOf, squaresAt, wavesAt, sealOf, compare: (s) => (s ? startCompare(s) : stopCompare()),
    setCamera(yaw, pitch) { cam.yaw = yaw; cam.pitch = pitch; },
    state: () => ({ t: sim.t, seed, style: currentStyle, chMode: CH_MODES[modeOf(P)].id, compare: compare ? compare.subject : null, beats: beatsOf(P), restClips: REST_CLIPS.length }),
  };
})();
