<!doctype html>
<!--
  PUMP RIDER LAB — a /labmaker browser lab (round 1).
  The question: a new vessel latches onto prismscapes the way the Urchin does, but it makes its speed
  the way a longboarder does on a pump track — leaning into the bends and bending / extending the knees.
  Which way of doing that is worth building?

  Contract (.claude/skills/labmaker/SKILL.md §2): SHIPPED names every number's source (Urchin numbers it
  would inherit; pp* = lab-only proposals), SPEC drives every slider, simStep never draws or reads a device,
  every run is seeded, the AI writes only the input object, window.__lab is the test surface, and the
  decision log goes to the artifact db (collection "decisions") with a browser fallback.
  Verify: node .claude/skills/labmaker/verify_lab.cjs Docs/Studios/PumpRiderLab.html
  Write-up: Docs/Studios/PUMP_RIDER_LAB.md
-->
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
  /* Layout: the studio editor — header / stage + right settings dock / bottom records dock. Dark-first, the Vessel Studio's tokens. */

    --accent: #ffb347; --accent-2: #7fd7ff; --good: #6fe39a; --warn: #ffcf5c; --bad: #ff7a8a;
    --stage: #05081a; --jade: #13fff2; --ruby: #ff00f9;
    --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef1fb; --panel: #ffffff; --panel-2: #f5f7ff; --line: #c9d0ee; --fg: #141a3a; --dim: #4b567f;
      --accent: #a65f00; --accent-2: #0a6fa8; --good: #1f8a4c; --warn: #8a6100; --bad: #b3243a; color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #eef1fb; --panel: #ffffff; --panel-2: #f5f7ff; --line: #c9d0ee; --fg: #141a3a; --dim: #4b567f;
    --accent: #a65f00; --accent-2: #0a6fa8; --good: #1f8a4c; --warn: #8a6100; --bad: #b3243a; color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); overflow: hidden; }
  #app { display: grid; height: 100%; grid-template-columns: minmax(0, 1fr) 350px; grid-template-rows: auto minmax(0, 1fr) 236px; grid-template-areas: "head head" "stage dock" "bottom dock"; }
  header { grid-area: head; display: flex; gap: 12px; align-items: center; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font: 700 1.05rem var(--display); letter-spacing: 0.02em; margin: 0; }

  #touchUI div { flex: 1; margin: 8px; border: 1px dashed rgba(232,236,255,0.22); border-radius: 12px; color: rgba(232,236,255,0.5); font: 700 0.65rem var(--display); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; }

    body { overflow: auto; }
    #app { display: block; height: auto; }
    #stageWrap { aspect-ratio: 4 / 3; max-width: 100%; }
    #dock, #bottom { border: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  }

<body>
<div id="app">
  <header>
    <h1 id="title"></h1>
    <span class="chip" id="meta"></span>
    <span class="chip way" id="wayChip"></span>
    <span id="diff"></span>
    <span class="spacer"></span>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);

  // ================= (1) LAB meta + the numbers =================
  // A READER of the shipped numbers. The vessel does not exist yet, so SHIPPED holds the Urchin numbers it
  // would inherit (each names its source) plus lab-only proposals, prefixed pp* / ai*, that no game field has.
  const LAB = { name: 'Pump Rider Lab', branch: 'cece/charming-rubin-ro74tj', round: 1, doc: 'Docs/Studios/PUMP_RIDER_LAB.md' };
  const SHIPPED = {
    FriendlyTerrainSpeed: 300, // Urchin.prefab TrailFollower.FriendlyTerrainSpeed (u/s, own ribbon)
    HostileTerrainSpeed: 20,   // Urchin.prefab TrailFollower.HostileTerrainSpeed (u/s, enemy ribbon)
    speedTrackingRate: 5,      // TrailFollower.speedTrackingRate C# default (1/s chase of the ride speed)
    DefaultThrottleScaler: 65, // Urchin.prefab: free-flight cruise (u/s) — the speed a rider ARRIVES with
    rideSurfaceClearance: 1.5, // GunVesselTransformer.rideSurfaceClearance C# default (u)
    prismSpacing: 8,           // UrchinTrackAction.asset prismSpacing (u) — rail drawn with it
    // ---- lab-only proposals (no game field yet) ----
    ppStartSpeed: 150,  // lab: speed at the moment of latching on
    ppPull: 1200,       // lab: the prismscape's pull on a latched rider (u/s²); sets crest fly-off and grip
    ppLegTravel: 4,     // lab: knee travel, crouched to extended (u)
    ppLegRate: 8,       // lab: fastest knee extension (u/s)
    ppLegStiff: 30,     // lab: how hard the knees chase the stick (1/s)
    ppRollRate: 270,    // lab: lean (roll around the rail) rate at full stick (°/s)
    ppLeanMax: 180,     // lab: lean limit either side of the landing side (°); 180 = roll freely like the Urchin
    ppDrag0: 1,         // lab: rolling drag (u/s²)
    ppDrag2: 10,        // lab: speed drag (×10⁻⁵ /u)
    ppGrip: 600,        // lab: sideways load the rider holds without scrubbing (u/s²)
    ppScrub: 0.15,      // lab: fraction of the excess sideways load that bleeds speed
    ppBead: 3,          // lab: "falls outward" lean model — how fast the bend throws you to the outside (rad/s)
    ppAutoBank: 4,      // lab: "auto-bank" lean model — how fast the hull rolls into the bend (1/s)
    ppAutoEff: 0.8,     // lab: Lean way — efficiency of the hull's automatic knees
    ppTapLegs: 1.5,     // lab: Tap way — knee speed multiplier for the digital button
    ppBeatKick: 12,     // lab: Beat way — kick for a release at the tightest point of a dip (u/s)
    ppHostileDrag: 4,   // lab: drag multiplier on an enemy ribbon (the Urchin's 15× speed cliff, re-priced)
    ppRollerR: 70,      // lab: course — tightest roller radius (u)
    ppRollerLen: 360,   // lab: course — roller wavelength (u)
    aiNoise: 0.6,       // lab: how sloppy the rookie AI is (0 = skilled)
  };
  const RAIL_R = 1.5;   // UrchinTrackAction.asset prismScale {3,3,6}: half-thickness of a rail prism (u)
  const LEG_MIN = 1;    // lab: hip height with the knees fully bent (u)

  // ================= (2) SPEC: one row per slider =================
  // [tab, key, min, max, step, label, tooltip]
  const SPEC = [
    ['Scene Config', 'ppRollerR', 50, 300, 5, 'Roller radius (u)', 'Tightest bend radius of a roller or berm. Tighter bends load harder and pay more per pump, and throw you off sooner.'],
    ['Scene Config', 'ppRollerLen', 200, 1200, 20, 'Roller length (u)', 'Distance from one dip to the next. Short rollers come faster than slow knees can follow.'],
    ['Scene Config', 'ppStartSpeed', 0, 400, 5, 'Latch-on speed (u/s)', 'How fast the rider is going when it latches on. The Urchin cruises at 65 u/s (DefaultThrottleScaler).'],
    ['AI Config', 'aiNoise', 0, 1, 0.05, 'Rookie sloppiness', 'Late reactions, mistimed pumps and a wandering lean. 0 flies like the skilled AI.'],
    ['Play Style Config', 'ppAutoEff', 0.2, 1, 0.05, 'Lean: auto-knee efficiency', 'The Lean way pumps for you; this is how much of a perfect pump the hull gets.'],
    ['Play Style Config', 'ppTapLegs', 1, 4, 0.25, 'Tap: knee speed ×', 'The Tap way snaps the knees; this multiplies the knee rate.'],
    ['Play Style Config', 'ppBeatKick', 0, 40, 0.5, 'Beat: kick (u/s)', 'The Beat way kicks you forward when you let go in a dip; this is the kick for a release at the tightest point of the tightest dip. Letting go on a hump costs the same.'],
    ['Input', 'ppRollRate', 60, 540, 10, 'Lean rate (°/s)', 'How fast full stick rolls the rider around the rail.'],
    ['Input', 'ppLeanMax', 30, 180, 5, 'Lean limit (°)', 'How far either side of where you landed you can lean. 180 rolls all the way round like the Urchin; ~45 is a longboard deck.'],
    ['Input', 'ppLegRate', 2, 30, 0.5, 'Knee rate (u/s)', 'Fastest knee extension. Slow knees cannot follow short rollers at speed, which is what caps pumping.'],
    ['Input', 'ppLegStiff', 5, 60, 1, 'Knee follow (1/s)', 'How hard the knees chase the trigger.'],
    ['Input', 'ppBead', 0, 8, 0.25, 'Falls-outward strength', 'Only with the "falls outward" lean model: how fast a bend rolls you to its outside.'],
    ['Input', 'ppAutoBank', 0, 10, 0.25, 'Auto-bank strength', 'Only with the "auto-bank" lean model: how fast the hull rolls onto the nearer side of each bend for you (under it, when crests can throw you).'],
    ['Vessel Config', 'ppPull', 300, 3000, 50, 'Prismscape pull (u/s²)', 'How hard a latched rider is held. Over a crest faster than √(pull × radius) the rider flies off (when crests can throw you).'],
    ['Vessel Config', 'ppLegTravel', 0.5, 6, 0.25, 'Knee travel (u)', 'Crouched to extended. Every pump is worth about speed × 2 × travel / radius.'],
    ['Vessel Config', 'ppDrag0', 0, 6, 0.1, 'Rolling drag (u/s²)', 'Constant drag. Sets the speed below which pumping cannot keep up.'],
    ['Vessel Config', 'ppDrag2', 0, 30, 0.5, 'Speed drag (×10⁻⁵/u)', 'Drag that grows with speed².'],
    ['Vessel Config', 'ppGrip', 100, 3000, 25, 'Sideways grip (u/s²)', 'Sideways load held without scrubbing. Not leaning into a bend past this bleeds speed.'],
    ['Vessel Config', 'ppScrub', 0, 1, 0.05, 'Scrub', 'How much of the excess sideways load becomes braking.'],
    ['Vessel Config', 'ppHostileDrag', 1, 15, 0.5, 'Enemy ribbon drag ×', 'The Urchin crawls on an enemy ribbon (300 → 20 u/s). A pump rider pays drag instead.'],
    ['Vessel Config', 'FriendlyTerrainSpeed', 50, 600, 10, 'Grind speed, own (u/s)', 'Urchin.prefab TrailFollower. Used by the Urchin grind and Grind + knees ways.'],
    ['Vessel Config', 'HostileTerrainSpeed', 0, 300, 5, 'Grind speed, enemy (u/s)', 'Urchin.prefab TrailFollower.'],
    ['Vessel Config', 'speedTrackingRate', 0.5, 20, 0.5, 'Grind speed chase (1/s)', 'TrailFollower C# default: how fast the grind motor reaches its speed.'],
    ['Vessel Config', 'DefaultThrottleScaler', 20, 200, 5, 'Free-flight cruise (u/s)', 'Urchin.prefab. The "from cruise" scorecard column latches on at this speed.'],
    ['Vessel Config', 'rideSurfaceClearance', 0, 5, 0.25, 'Ride clearance (u)', 'GunVesselTransformer: gap between the rail prism face and the board.'],
    ['Vessel Config', 'prismSpacing', 4, 20, 1, 'Rail prism spacing (u)', 'UrchinTrackAction.asset. Drawing only.'],
  ];

  // Choices that are not numbers (dropdowns). Not part of SHIPPED; saved per viewer.
  const WAYS = [
    { v: 'knees', label: 'Knees', short: 'Analog knees + lean', pump: 'work', input: 'Trigger = knees (pull to crouch, let go to stand). Stick = lean.' },
    { v: 'tap',   label: 'Tap', short: 'One button + lean', pump: 'work', input: 'Hold the button to crouch, let go to stand. Stick = lean.' },
    { v: 'beat',  label: 'Beat', short: 'Timed release kick', pump: 'beat', input: 'Hold through the humps, let go at the bottom of each dip. Stick = lean.' },
    { v: 'lean',  label: 'Lean', short: 'Lean only, hull pumps', pump: 'auto', input: 'Stick = lean. The hull bends its own knees.' },
    { v: 'grind', label: 'Grind + knees', short: 'Urchin motor + pump past it', pump: 'work', input: 'The Urchin grind holds its speed; the trigger pumps you past it. Stick = lean.' },
    { v: 'coast', label: 'Coast', short: 'Ability off (control)', pump: 'none', input: 'Stick = lean. No pumping at all.' },
    { v: 'urchin', label: 'Urchin grind', short: 'Shipped Urchin (reference)', pump: 'none', input: 'Throttle sets the speed, as the Urchin rides today.' },
  ];
  const COURSES = [
    { v: 'pumptrack', label: 'Pump track oval', note: 'Four rollers, a 180° berm, four rollers, a berm. A real pump-track loop.' },
    { v: 'rollers', label: 'Rollers', note: 'Endless humps in one plane. Pure knee pumping.' },
    { v: 'slalom', label: 'Slalom', note: 'Endless left-right bends, no humps. Only leaning into them pumps.' },
    { v: 'twister', label: 'Twister', note: 'Rollers whose bend turns around the rail. Lean to keep the dip under you.' },
    { v: 'wake', label: 'Vessel wake', note: 'A smooth random 3D ribbon, like a wake you would find in a cell.' },
    { v: 'flat', label: 'Flat (control)', note: 'A straight rail. Pumping must earn nothing here.' },
  ];
  const OPT_DEFAULT = { way: 'knees', course: 'pumptrack', lean: 'free', crest: 'latched', owner: 'own', pilot: 'skilled', cam: 'side', simSpeed: 1, runLen: 20 };

  const LS_KEY = 'lab:' + LAB.name + ':P', LS_OPT = 'lab:' + LAB.name + ':opt';
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private window */ } };
  const P = Object.assign({}, SHIPPED, lsGet(LS_KEY, {}));
  for (const k of Object.keys(P)) if (!(k in SHIPPED)) delete P[k];
  const OPT = Object.assign({}, OPT_DEFAULT, lsGet(LS_OPT, {}));
  for (const k of Object.keys(OPT)) if (!(k in OPT_DEFAULT)) delete OPT[k];

  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
  const wrapPi = (a) => { a = (a + Math.PI) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a - Math.PI; };
  const D2R = Math.PI / 180;

  // ================= (3) THE COURSE: a rail defined by its bend =================
  // The rail is a curve given by its bend in a rotation-minimising frame: k1 bends toward N1 ("up" at the
  // start), k2 toward N2. A rider sits at a roll angle phi around the rail; the bend's direction alpha and
  // size kap decide whether the rail dips under the rider (a trough) or humps away (a crest).
  // The wake course's shape is a FIXED seed so every run and every viewer rides the same ribbon.
  const WAKE = (() => { const r = mulberry32(90210), w = []; for (let i = 0; i < 4; i++) w.push({ a1: (0.4 + r()) / 260, a2: (0.4 + r()) / 260, l1: 300 + r() * 1100, l2: 300 + r() * 1100, p1: r() * 6.283, p2: r() * 6.283 }); return w; })();
  function bend(s, out) {
    const A = 1 / P.ppRollerR, L = P.ppRollerLen, TAU = 2 * Math.PI;
    let k1 = 0, k2 = 0;
    switch (OPT.course) {
      case 'rollers': k1 = A * Math.sin(TAU * s / L); break;
      case 'slalom': k2 = A * Math.sin(TAU * s / L); break;
      case 'twister': { const k = A * Math.sin(TAU * s / L), a = TAU * s / (4 * L); k1 = k * Math.cos(a); k2 = k * Math.sin(a); break; }
      case 'wake': for (const w of WAKE) { k1 += w.a1 * Math.sin(TAU * s / w.l1 + w.p1); k2 += w.a2 * Math.sin(TAU * s / w.l2 + w.p2); } break;
      case 'pumptrack': {
        const roll = 4 * L, berm = Math.max(300, 6 * P.ppRollerR), per = 2 * (roll + berm);
        let u = s % per; if (u < 0) u += per;
        const half = u >= roll + berm ? u - roll - berm : u;
        if (half < roll) k1 = A * Math.sin(TAU * half / L);
        else { const x = (half - roll) / berm; k2 = (Math.PI * Math.PI / (2 * berm)) * Math.sin(Math.PI * x); }   // integrates to exactly 180°
        break;
      }
      default: break;   // flat
    }
    out.k1 = k1; out.k2 = k2; out.kap = Math.hypot(k1, k2); out.alpha = Math.atan2(k2, k1);
    return out;
  }
  const _b = { k1: 0, k2: 0, kap: 0, alpha: 0 }, _b2 = { k1: 0, k2: 0, kap: 0, alpha: 0 };

  // A frame on the rail: p (point), T (tangent), N1, N2. Advanced by midpoint integration of the bend.
  const v3 = { add: (a, b, s) => [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s], dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], len: (a) => Math.hypot(a[0], a[1], a[2]), norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }, scale: (a, s) => [a[0] * s, a[1] * s, a[2] * s] };
  function newFrame() { return { s: 0, p: [0, 0, 0], T: [1, 0, 0], N1: [0, 1, 0], N2: [0, 0, 1] }; }
  function copyFrame(f) { return { s: f.s, p: f.p.slice(), T: f.T.slice(), N1: f.N1.slice(), N2: f.N2.slice() }; }

  // ================= (4) THE MODEL =================
  // The pumping law (every way that pumps uses it): moving your hips along your own "up" by dh while the rail
  // bends under you by kf (kap·cos(alpha − phi), + = dipping toward you) changes speed by
  //     d(v²/2) = v² · kf · dh         (angular momentum about the bend: pull toward its centre, speed up)
  // The pull's own share (pull · dh) goes into height, not speed — so on a straight rail pumping earns 0.
  // The Flat course is the control that proves it.
  let world = null, seed = 7;
  const legH = () => P.ppLegTravel;
  function rideRadius(h) { return RAIL_R + P.rideSurfaceClearance + LEG_MIN + h; }
  function reset(s) {
    if (s != null) seed = s >>> 0;
    const rnd = mulberry32(seed);
    const s0 = Math.floor(rnd() * 4) * P.ppRollerLen * 0.25;       // start phase: one of four points on a roller
    const f = newFrame(); f.s = s0;
    world = {
      t: 0, s: s0, v: OPT._startSpeed != null ? OPT._startSpeed : P.ppStartSpeed, phi: 0, phiHome: 0, h: legH() * 0.5, hv: 0,
      frame: f, air: null, btn: false, up: upOf(f, 0), rnd,
      ai: { phiT: 0, jit: 0, extend: false, ph: rnd() * 6.283, held: true },
      stats: { sumV: 0, n: 0, pump: 0, scrub: 0, flyoffs: 0, lost: 0, landLoss: 0, busy: 0, minV: 1e9 },
      last: { N: P.ppPull, kf: 0, lat: 0, roll: 0, crouch: 0 },

  // input = { roll: −1..1 (lean), crouch: 0..1 (knees), btn: bool, throttle: 0..1 } — the same object a pad writes
  function simStep(dt, input) {
    const w = world, st = w.stats, way = wayOf(), H = legH(), pull = P.ppPull;
    const inp = input || NO_INPUT;
    st.busy += (Math.abs(inp.roll - w.last.roll) * 0.5 + Math.abs(inp.crouch - w.last.crouch));
    w.last.roll = inp.roll; w.last.crouch = inp.crouch;
    if (w.air) { airStep(dt, inp); w.t += dt; return; }

    // ---- the bend under the rider ----
    bend(w.s, _b);
    const d = _b.alpha - w.phi, kf = _b.kap * Math.cos(d), latK = _b.kap * Math.sin(d), v0 = w.v;
    const N = pull + w.v * w.v * kf, lat = w.v * w.v * latK;

    // ---- lean: roll around the rail ----
    let phiDot = P.ppRollRate * D2R * clamp(inp.roll, -1, 1);
    if (OPT.lean === 'bead') phiDot += -P.ppBead * clamp(lat / P.ppGrip, -3, 3);            // a bend throws you to its outside
    if (OPT.lean === 'auto' && w.v * w.v * _b.kap > 0.1 * pull) {                    // the hull rolls onto the nearer side of the bend
      const e1 = wrapPi(_b.alpha - w.phi), e2 = wrapPi(_b.alpha + Math.PI - w.phi);
      phiDot += P.ppAutoBank * (OPT.crest === 'fly' || Math.abs(e1) <= Math.abs(e2) ? e1 : e2);
    }
    const lim = P.ppLeanMax * D2R;
    w.phi += phiDot * dt;
    if (lim < Math.PI - 1e-6) w.phi = w.phiHome + clamp(wrapPi(w.phi - w.phiHome), -lim, lim);

    // ---- knees ----
    let hT = H * 0.5, rate = P.ppLegRate;
    if (way.v === 'knees' || way.v === 'grind') hT = H * (1 - clamp(inp.crouch, 0, 1));
    else if (way.v === 'tap' || way.v === 'beat') { hT = inp.btn ? 0 : H; rate *= way.v === 'tap' ? P.ppTapLegs : 4; }
    else if (way.v === 'lean') hT = loadAt(w, w.s + Math.max(1, w.v) * 0.02, w.phi).kf < kf ? H : 0;   // the hull stands up as the load passes its peak

    }
    w.btn = !!inp.btn;
    st.pump += w.v - v0;                                             // pumping only; the motor and drag come after
    if (way.v === 'urchin') {                                        // shipped: the grind motor IS the speed
      const target = clamp(inp.throttle, 0, 1) * (OPT.owner === 'own' ? P.FriendlyTerrainSpeed : P.HostileTerrainSpeed);
      w.v += (target - w.v) * (1 - Math.exp(-P.speedTrackingRate * dt));
    } else {
      const motor = way.v === 'grind' ? clamp(inp.throttle, 0, 1) * (OPT.owner === 'own' ? P.FriendlyTerrainSpeed : P.HostileTerrainSpeed) : 0;
      if (w.v < motor) w.v += (motor - w.v) * (1 - Math.exp(-P.speedTrackingRate * dt));

  }

  // Flying: the prismscape still pulls toward the nearest rail point within reach; land when you touch it.
  function launch(up) {
    const w = world, f = w.frame, pts = [];
    const g = copyFrame(f); advanceBy(g, -40);

  // ================= (5) THE AI: input only =================
  // Reads the rail ahead (what a pilot sees) and writes the same input object a gamepad writes. Never touches
  // the rider's state. The rookie is the skilled pilot plus late reactions, timing jitter and a wandering lean.
  const NO_INPUT = { roll: 0, crouch: 0, btn: false, throttle: 0 };
  function aiInput(noise) {
    const w = world, a = w.ai, way = wayOf(), v = Math.max(w.v, 1), pull = P.ppPull;
    const out = { roll: 0, crouch: 0.5, btn: false, throttle: 1 };
    if (w.air) return out;
    const late = noise * 0.16 + a.jit;
    // lean: put the coming bend under you (aim at it ~0.3 s early), stay within the lean limit
    const kA = loadAt(w, w.s + v * Math.max(0.05, 0.3 - late), w.phi);

  // ================= (6) SCORE + BATCH =================
  function score() {
    const s = world.stats, T = Math.max(world.t, 1e-6);
    return { avgSpeed: +(s.sumV / Math.max(1, s.n)).toFixed(1), endSpeed: +world.v.toFixed(1), pumpPerSec: +(s.pump / T).toFixed(2), scrubPerSec: +(s.scrub / T).toFixed(2), flyoffsPerMin: +(60 * s.flyoffs / T).toFixed(1), lost: s.lost, busy: +(s.busy / T).toFixed(2), t: +world.t.toFixed(2) };
  }
  function runOne(way, course, noise, sd, seconds, startSpeed) {
    const oWay = OPT.way, oCourse = OPT.course;
    OPT.way = way; OPT.course = course; OPT._startSpeed = startSpeed;
    reset(sd);
    const dt = 1 / 60, n = Math.round(seconds / dt);
    for (let i = 0; i < n; i++) simStep(dt, aiInput(noise));
    const r = score();
    OPT.way = oWay; OPT.course = oCourse; delete OPT._startSpeed;

  }
  const avg = (rows, k) => +(rows.reduce((a, r) => a + r[k], 0) / rows.length).toFixed(2);

  // pumping on the Flat course (must be ~0) and the skilled run latching on at the free-flight cruise.
  function runBatch(opts) {
    opts = opts || {};
    const seeds = opts.seeds || [1, 2], seconds = opts.seconds || OPT.runLen, course = opts.course || OPT.course;
    const keep = { world, seed }, rows = [];
    for (const wy of WAYS) {
      const sk = seeds.map((sd) => runOne(wy.v, course, 0, sd, seconds));
      const rk = seeds.map((sd) => runOne(wy.v, course, P.aiNoise, sd, seconds));
      const flat = runOne(wy.v, 'flat', 0, seeds[0], seconds);
      const cruise = runOne(wy.v, course, 0, seeds[0], seconds, P.DefaultThrottleScaler);
      rows.push({ way: wy.label, course, skilled: avg(sk, 'avgSpeed'), rookie: avg(rk, 'avgSpeed'), skilledEnd: avg(sk, 'endSpeed'), pump: avg(sk, 'pumpPerSec'), scrub: avg(sk, 'scrubPerSec'), flyoffs: avg(sk, 'flyoffsPerMin'), lost: avg(sk, 'lost'), busy: avg(sk, 'busy'), flatPump: flat.pumpPerSec, fromCruise: cruise.avgSpeed });
    }

  }

    opts = opts || {};

    for (const wy of WAYS) {
      const row = { way: wy.label };
      for (const c of COURSES) { row[c.v] = avg(seeds.map((sd) => runOne(wy.v, c.v, 0, sd, seconds)), 'avgSpeed'); row[c.v + ':rookie'] = avg(seeds.map((sd) => runOne(wy.v, c.v, P.aiNoise, sd, seconds)), 'avgSpeed'); }

  }

  // ================= (7) PLATFORM =================
  function detectPlatform() {
    const host = window.__labHost || {};
    const ua = navigator.userAgent || '';
    const mobileUA = (navigator.userAgentData && navigator.userAgentData.mobile) || /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    const coarseOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;

  }
  const PLATFORM = detectPlatform();
  $('platform').textContent = (PLATFORM.shell === 'web' ? 'Web' : PLATFORM.shell) + ' · ' + (PLATFORM.device === 'phone' ? 'Phone' : 'PC');
  if (PLATFORM.device === 'phone') $('touchUI').hidden = false;

  // ================= (8) HUMAN INPUT: keys, gamepad, touch → the same input object =================
  const keys = new Set();
  const human = { roll: 0, crouch: 0, btn: false, throttle: 1, touchedAt: -1 };
  const isField = (e) => /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '');

  addEventListener('keydown', (e) => { if (isField(e) || !CONTROL_KEYS.includes(e.code)) return; keys.add(e.code); takeOver(); e.preventDefault(); });
  addEventListener('keyup', (e) => { keys.delete(e.code); });
  addEventListener('blur', () => keys.clear());

  const canvas = $('stage');
  canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return;

    if (left) touch.lean = { id: e.pointerId, x0: e.clientX, x: e.clientX }; else touch.knee = { id: e.pointerId };

  });

  function readHuman() {
    let roll = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0);
    let crouch = keys.has('Space') || keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0;
    let throttle = keys.has('ArrowUp') || keys.has('KeyW') || OPT.way !== 'urchin' ? 1 : 0.6;
    let btn = crouch > 0.5;
    try {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];

        if (!gp) continue;
        const lx = gp.axes[0] || 0, rt = gp.buttons[7] ? gp.buttons[7].value : 0, a = gp.buttons[0] && gp.buttons[0].pressed;
        if (Math.abs(lx) > 0.12 || rt > 0.05 || a) takeOver();
        if (Math.abs(lx) > 0.12) roll = lx;
        if (rt > 0.02) crouch = Math.max(crouch, rt);
        if (a) { btn = true; crouch = Math.max(crouch, 1); }
        if (!btn && rt > 0.5) btn = true;
        break;
      }
    } catch (e) { /* the claude.ai viewer may block the Gamepad API — open the repo file in Chrome */ }
    if (touch.lean) roll = clamp((touch.lean.x - touch.lean.x0) / 60, -1, 1);
    if (touch.knee) { crouch = 1; btn = true; }
    human.roll = roll; human.crouch = crouch; human.btn = btn; human.throttle = throttle;
    return human;
  }
  function takeOver() { if (OPT.pilot !== 'you') { OPT.pilot = 'you'; saveOpt(); refreshPilotUI(); } }

  // ================= (9) RENDER: chase view + instruments =================
  const ctx = canvas.getContext('2d');
  const STARS = (() => { const r = mulberry32(4242), s = []; for (let i = 0; i < 260; i++) { const z = r() * 2 - 1, a = r() * 6.283, q = Math.sqrt(1 - z * z); s.push([q * Math.cos(a), z, q * Math.sin(a), 0.3 + r() * 0.7]); } return s; })();
  let camUp = [0, 1, 0];
  function riderPose() {

  }
  function render(dtReal) {
    const W = canvas.width, Hh = canvas.height, dpr = W / Math.max(1, canvas.clientWidth || W);
    const w = world, pose = riderPose();
    ctx.fillStyle = '#05081a'; ctx.fillRect(0, 0, W, Hh);
    // camera: behind and above the rider, rolling with the rider's "up" so the rail is always under you
    const k = 1 - Math.exp(-6 * (dtReal || 1 / 60));
    camUp = v3.norm(v3.add(camUp, v3.sub(pose.up, camUp), k));
    const cam = OPT.cam === 'chase' ? { back: 34, up: 11, side: 0, ahead: 90 } : OPT.cam === 'wide' ? { back: 120, up: 60, side: 0, ahead: 90 } : { back: 70, up: 16, side: 55, ahead: 110 };
    const sideV = v3.norm(v3.cross(pose.T, camUp));
    const eye = v3.add(v3.add(v3.add(pose.body, pose.T, -cam.back), camUp, cam.up), sideV, cam.side), look = v3.add(pose.body, pose.T, cam.ahead);
    const F = v3.norm(v3.sub(look, eye)), R = v3.norm(v3.cross(F, camUp)), U = v3.cross(R, F);

      ['Beat', 'Hold through the humps, let go at the bottom of each dip for a kick sized by the load. Arcade and readable; the rhythm is the skill, the legs are not simulated.'],
      ['Lean', 'The longboard carve: you only lean, and the hull bends its own knees. One stick. The skill is finding the dip and getting under it.'],
      ['Grind + knees', 'Keeps the Urchin’s grind motor (300 u/s on your own ribbon) and lets pumping take you past it. The safest port: the Urchin stays the Urchin, pumping is the expert layer.'],
      ['Coast · Urchin grind', 'The two baselines: the ability off, and the Urchin as it rides today.'],
    ];
    for (const [h, p] of CARDS) { const d = document.createElement('div'); d.className = 'way'; d.innerHTML = '<h3></h3><p></p>'; d.children[0].textContent = h; d.children[1].textContent = p; g.appendChild(d); }
    return box;
  }
  function table(rows, cols, bestCols) {
    const t = document.createElement('table');
    t.innerHTML = '<tr>' + cols.map((c) => '<th class="' + (c.num ? 'num' : '') + '"></th>').join('') + '</tr>';
    cols.forEach((c, i) => { t.rows[0].cells[i].textContent = c.label; t.rows[0].cells[i].title = c.tip || ''; });
    const best = {};
    for (const k of bestCols || []) best[k] = Math.max(...rows.filter((r) => !/Urchin|Coast/.test(r.way)).map((r) => r[k]));
    for (const r of rows) {
      const tr = document.createElement('tr');
      for (const c of cols) { const td = document.createElement('td'); const v = r[c.key]; td.textContent = typeof v === 'number' ? (Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(c.dec == null ? 1 : c.dec)) : v; if (c.num) td.className = 'num'; if (best[c.key] != null && v === best[c.key]) td.classList.add('best'); if (c.warn && c.warn(v)) td.classList.add('bad'); tr.appendChild(td); }
      t.appendChild(tr);
    }
    const wrap = document.createElement('div'); wrap.className = 'tablewrap'; wrap.appendChild(t); return wrap;
  }
  let lastRows = null, lastGrid = null;
  function scorecardPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p><button class="btn primary" id="runBatch">Score every way on this course</button> <button class="btn" id="runGrid">Score every course</button> <span class="hint" id="scoreNote">Headless, AI pilots, seeds 1–2, at 60 Hz.</span></p><div id="scoreOut"></div>';
    const out = box.querySelector('#scoreOut'), note = box.querySelector('#scoreNote');
    const COLS = [
      { key: 'way', label: 'Way' },
      { key: 'skilled', label: 'Skilled avg', num: true, tip: 'Average speed, skilled AI (u/s)' },
      { key: 'rookie', label: 'Rookie avg', num: true, tip: 'Average speed, rookie AI (u/s)' },
      { key: 'skilledEnd', label: 'End', num: true, tip: 'Skilled speed at the end of the run (u/s)' },
      { key: 'fromCruise', label: 'From cruise', num: true, tip: 'Skilled average when latching on at the free-flight cruise (DefaultThrottleScaler)' },
      { key: 'pump', label: 'Pump /s', num: true, dec: 2, tip: 'Speed the pumping itself added, per second (u/s²)' },
      { key: 'flatPump', label: 'Flat pump', num: true, dec: 2, tip: 'CONTROL: pumping on a straight rail. Must be ~0.', warn: (v) => Math.abs(v) > 0.05 },
      { key: 'scrub', label: 'Scrub /s', num: true, dec: 2, tip: 'Speed lost to sideways load (not leaning in), per second' },
      { key: 'flyoffs', label: 'Fly-offs /min', num: true, tip: 'Times thrown off a crest per minute (only when crests throw you)' },
      { key: 'busy', label: 'Busy', num: true, dec: 2, tip: 'Input changes per second: how hard the pilot works' },
    ];
    const show = () => {
      out.replaceChildren();
      if (lastRows) out.appendChild(table(lastRows, COLS, ['skilled', 'rookie', 'fromCruise']));
      if (lastGrid) {
        const cols = [{ key: 'way', label: 'Way (skilled / rookie avg u/s)' }].concat(COURSES.map((c) => ({ key: c.v, label: c.label, num: true })));
        const rows = lastGrid.map((r) => { const o = { way: r.way }; for (const c of COURSES) o[c.v] = r[c.v].toFixed(0) + ' / ' + r[c.v + ':rookie'].toFixed(0); return o; });
        const h = document.createElement('div'); h.className = 'sec'; h.textContent = 'Every course'; out.appendChild(h); out.appendChild(table(rows, cols));
      }
    };
    box.querySelector('#runBatch').onclick = () => { const t0 = performance.now(); lastRows = runBatch(); note.textContent = 'Done in ' + Math.round(performance.now() - t0) + ' ms. ' + (COURSES.find((c) => c.v === OPT.course) || {}).label + ', ' + OPT.runLen + ' s runs.'; show(); };
    box.querySelector('#runGrid').onclick = () => { const t0 = performance.now(); lastGrid = runCourseGrid(); note.textContent = 'Every course in ' + Math.round(performance.now() - t0) + ' ms.'; show(); };
    show();
    return box;
  }
  function aboutPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p></p><p class="hint"><b>What this lab does not model.</b> Only 1D prismscapes (trails); riding a 2D surface (the Urchin’s marble roll), where carving S-turns is the real longboard case, is the next round. The ribbons are stand-in bend functions, not laid trails. No free flight, no approach or latching, no Slip, no prism payoff (grow / steal / restore) and no spikes. No other vessels. The legs, hull and camera are lab drawings. Drag, pull, grip and every pp* number are lab proposals with no game field; only the numbers that name an Urchin asset are shipped. The CoM radius change is folded into the pumping law to first order. Frame time is not measured on a real GPU.</p><p class="hint"><b>Ideas not built yet</b>: an ollie (stand up hard on a crest to jump to another ribbon); pressing into the prismscape to dig your own dip (the Urchin’s cradle drape); a 2D sheet pump track.</p>';
    box.firstChild.textContent = LAB.name + ' · round ' + LAB.round + ' · ' + LAB.branch + ' · write-up ' + LAB.doc;
    return box;
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Ways', build: waysPanel }, { name: 'Scorecard', build: scorecardPanel }, { name: 'Decisions', build: logPanel }, { name: 'About', build: aboutPanel }], 'lab:' + LAB.name + ':bottom');

  $('title').textContent = LAB.name; $('meta').textContent = 'round ' + LAB.round;
  let paused = false;
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
  $('restart').onclick = () => reset(seed + 1);
  $('letAi').onclick = () => { OPT.pilot = 'skilled'; saveOpt(); refreshPilotUI(); };
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); lsSet(LS_KEY, {}); for (const k in outputs) outputs[k].inp.value = P[k]; reset(); refreshDiff(); };

  // ================= (13) LOOP + the test surface =================
  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', resize);
  function liveInput() { return OPT.pilot === 'you' ? readHuman() : aiInput(OPT.pilot === 'rookie' ? P.aiNoise : 0); }
  function stepLive(dt) {
    simStep(dt, liveInput());
    world.trace.push([world.t, world.v]); while (world.trace.length && world.trace[0][0] < world.t - 10) world.trace.shift();
  }
  let manualClock = false, last = performance.now(), acc = 0;
  function frame(now) {
    const real = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) {
      resize();
      if (!paused) { acc += real * OPT.simSpeed; let n = 0; while (acc >= 1 / 60 && n < 8) { stepLive(1 / 60); acc -= 1 / 60; n++; } if (n === 8) acc = 0; }
      render(real);
    }
    requestAnimationFrame(frame);
  }
  reset(); resize(); refreshDiff(); refreshPilotUI(); render(1 / 60); requestAnimationFrame(frame);

  window.__lab = {
    LAB, SHIPPED, SPEC, P, OPT, PLATFORM, WAYS, COURSES,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { dt = dt || 1 / 60; n = n || 1; for (let i = 0; i < n; i++) stepLive(dt); resize(); render(dt); },
    reset, score, runBatch, runCourseGrid, runOne, setParam, setOpt, record,
    state: () => ({ t: world.t, seed, s: world.s, v: world.v, phi: world.phi, h: world.h, air: !!world.air, N: world.last.N, way: OPT.way, course: OPT.course }),
  };
  window.__pumpRiderLab = window.__lab;
})();
</script>
