<!--
  CREW VESSEL LAB, round 3: the KITE AND ITS TAIL, signed off 2026-10-17 and ported to Unity
  (Assets/_Scripts/Controller/Vessel/Crew/KITE_NAVIGATOR.md; parity gate Tools/Build/kite_navigator_lab/parity.cjs).
  The navigator is a kite on the flying vessel's own x-z plane; the 3D world projects onto it. One thumb flies the kite
  (it rides above the thumb on a phone). Its HEAD destroys hostile prisms. Its TAIL is a lasso: cross your own tail and
  every navigator mote inside is collected. A loop of ONE element fires that element's effect, exponentially bigger per
  mote: Space = a prism-destroying blast, Mass = a prism cluster, Time = boost energy for the pilot, Charge = kite power
  that steals petals when the kite rams a rival vessel.
  Motes are the navigator's own and are NOT game crystals. Prisms, vessels and effects copy the game's numbers.
    (1) LAB meta + SHIPPED + presets   (2) SPEC   (3) THE MODEL
  Verify:   node .claude/skills/labmaker/verify_lab.cjs Docs/Studios/CrewVesselLab.html
  Write-up: Docs/Studios/CREW_VESSEL_LAB.md   Earlier rounds: CrewVesselLab.round1.html, CrewVesselLab.round2.html
-->

  // ================= helpers =================
  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const gauss = (rng) => { const u = Math.max(1e-9, rng()), v = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
  const DEG = Math.PI / 180;

  const len = (a) => Math.hypot(a[0], a[1], a[2]);
  const norm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];

    for (const [g, key, lo, hi, step, label, tip] of SPEC) {
      if (g !== group) continue;

  }
  let presetBox = null;

  function presetsPanel() {

      '<div class="legend"><i style="background:#8f84ff"></i><span><b>Space</b>: a blast that destroys hostile prisms (AOEExplosion)</span><i style="background:#ff6b4a"></i><span><b>Mass</b>: a cluster of your domain\'s prisms</span><i style="background:#36d39a"></i><span><b>Time</b>: boost energy for your pilot</span><i style="background:#f2c14e"></i><span><b>Charge</b>: kite power; ram a rival to steal that many petals</span></div><div class="presets"></div>';

  function optionsPanel() {

  function paintSeatSeg() { for (const b of $('seatSeg').children) b.setAttribute('aria-pressed', String(b.dataset.you === crew.you)); }

  $('swapBtn').onclick = () => requestSwap('button');

  // ---- decision log (shared db, browser fallback) ----
  let db = null, me = '', remote = [], localLog = lsGet('log', []);
  function snapshot() { return { round: LAB.round, seed, preset: presetKey, options: Object.assign({}, OPT), optionsChanged: optDiff(), you: crew.you, mate: crew.mate, changed: diffOnly() }; }
  async function record(topic, choice, note) {
    const doc = { topic, choice, note: note || '', createdAt: Date.now(), by: me, settings: snapshot() };
    if (db) { try { await db.collection('decisions').add(doc); return 'shared'; } catch (e) { /* fall through */ } }
    localLog.push(doc); lsSet('log', localLog); return 'local';
  }
  function currentChoice(topic) {
    const pr = PRESETS.find((p) => p.key === presetKey), name = pr ? pr.name : 'custom';
    if (topic === 'Sign-off') return 'Sign off ' + name + ' for Unity (or: not yet, because…)';
    if (topic === 'Effects') return 'Growth ×' + P.growth + ': Space / Mass / Time / Charge feel right / wrong because…';
    if (topic === 'Thumb offset') return 'Offset ' + P.thumbOffset + ' px: right / too much / too little';
    if (topic === 'Mixed loops') return MIXES[OPT.mixed];
    return 'Settings: ' + (Object.keys(diffOnly()).length ? JSON.stringify(diffOnly()) : 'shipped');
  }
  function logPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint" id="logStatus"></p><label class="field"><span>Topic</span><select id="logTopic"><option>Sign-off</option><option>Effects</option><option>Thumb offset</option><option>Mixed loops</option><option>Tuning</option><option>Other idea</option></select></label><label class="field"><span>Your decision</span><textarea id="logChoice" rows="2"></textarea></label><p><button class="btn primary" id="logSave">Record decision</button> <button class="btn" id="logCopy">Copy log</button></p><div class="tablewrap"><table id="logTable"></table></div>';
    const status = box.querySelector('#logStatus'), topic = box.querySelector('#logTopic'), choice = box.querySelector('#logChoice');
    status.textContent = db ? 'Shared log: saved with the lab, readable by Claude at the start of the next round.' : 'Kept in this browser. Use Copy log to send it.';
    status.className = db ? 'status-ok' : 'status-warn';
    const prefill = () => { choice.value = currentChoice(topic.value); }; topic.onchange = prefill; prefill();
    box.querySelector('#logSave').onclick = async () => { const where = await record(topic.value, choice.value); status.textContent = where === 'shared' ? 'Recorded in the shared log.' : 'Recorded in this browser.'; renderLog(box); };
    box.querySelector('#logCopy').onclick = () => { const t = remote.concat(localLog).map((d) => new Date(d.createdAt).toISOString() + ' · ' + d.topic + ': ' + d.choice + ' ' + JSON.stringify(d.settings)).join('\n'); try { navigator.clipboard.writeText(t).catch(() => {}); } catch (e) { /* refused */ } };
    renderLog(box);
    return box;
  }
  function renderLog(box) {
    const t = (box || document).querySelector('#logTable'); if (!t) return;
    const rows = remote.concat(localLog).sort((a, b) => b.createdAt - a.createdAt).slice(0, 50);
    t.innerHTML = '<tr><th>When</th><th>Topic</th><th>Decision</th></tr>';
    if (!rows.length) { const tr = document.createElement('tr'); tr.innerHTML = '<td colspan="3" class="hint">No decisions yet. Fly the kite on your phone, then sign off a preset (or say what is missing).</td>'; t.appendChild(tr); }
    for (const d of rows) { const tr = document.createElement('tr'); for (const v of [new Date(d.createdAt).toLocaleString(), d.topic, d.choice]) { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); } t.appendChild(tr); }
  }
  (async function connect() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try { db = await c.use('db'); } catch (e) { db = null; }
    try { const u = await c.use('user'); if (u) me = (await u.id()) || ''; } catch (e) { me = ''; }
    if (!db) return;
    db.collection('decisions').orderBy('createdAt', 'desc').limit(300).onSnapshot((snap) => { remote = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderLog(); }, () => { db = null; });
  })();

  const COLS = [
    ['name', 'Preset', ''], ['hullPetals', 'Hull petals/min', 'petals the hull gains per minute: its own crystals plus petals the kite stole'],
    ['lift', 'Lift %', 'hull petals against the same pilot with nobody on the board'], ['stolen', 'Stolen/min', 'petals the kite took from rivals by ramming them charged'],
    ['popped', 'Popped/min', 'hostile prisms the kite\'s head destroyed'], ['blasted', 'Blasted/min', 'hostile prisms Space blasts destroyed'],
    ['massLaid', 'Mass/min', 'prisms Mass loops laid in your domain'], ['boostGiven', 'Boost s/min', 'seconds of boost Time loops gave the pilot'],
    ['loops', 'Loops/min', 'loops that enclosed at least one mote'], ['purePct', 'Pure %', 'loops of one element'], ['meanN', 'Mean n', 'motes per firing loop'], ['maxN', 'Best n', 'the biggest loop (mean over seeds)'],
    ['skill', 'Skill %', 'how much less an Easy navigator produces (petals + boost + prisms ÷ 10), as % of Hard'],
    ['idle', 'Idle %', 'what a navigator who never touches produces, as % of Hard: the seat should earn nothing for nothing'],
    ['events', 'Moments/min', 'the navigator\'s beats (events under 0.4 s apart count once)'], ['dry', 'Dry spell (s)', 'longest wait between two moments'],
    ['thumbDown', 'Thumb down %', ''], ['whip', 'Board turn °/s', 'how fast the board turns under the thumb'], ['hits', 'Hits/min', 'hostile prisms the hull flew into'], ['noise', '± (SE)', 'standard error of hull petals/min over the seeds'],
  ];
  let lastRows = null;
  function scorecardPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p><button class="btn primary" id="runBatch">Score every preset</button> <span class="hint" id="batchNote">Headless: 3 seeds × 60 s, AI Hard pilot, 2 AI rivals; each preset with a Hard, an Easy and an idle navigator. Hover a column for what it measures.</span></p><div class="tablewrap"><table id="scoreTable"></table></div>';
    const paint = (rows) => {
      const t = box.querySelector('#scoreTable'); t.innerHTML = '';
      const hr = document.createElement('tr'); for (const [, label, tip] of COLS) { const th = document.createElement('th'); th.textContent = label; th.title = tip; hr.appendChild(th); } t.appendChild(hr);
      const hi = ['hullPetals', 'lift', 'stolen', 'popped', 'blasted', 'massLaid', 'boostGiven', 'loops', 'purePct', 'meanN', 'skill', 'events'], lo = ['idle', 'dry', 'whip'], body = rows.slice(1), best = {};
      for (const k of hi) best[k] = Math.max(...body.map((r) => r[k]));
      for (const k of lo) best[k] = Math.min(...body.map((r) => r[k]));
      for (const r of rows) { const tr = document.createElement('tr'); for (const [k] of COLS) { const td = document.createElement('td'); td.textContent = r[k]; if (r.key !== 'solo' && k in best && best[k] === r[k]) td.className = 'best'; tr.appendChild(td); } t.appendChild(tr); }
    };
    box.querySelector('#runBatch').onclick = () => { const n = box.querySelector('#batchNote'); n.textContent = 'Scoring…'; setTimeout(() => { const t0 = performance.now(); lastRows = runBatch(); paint(lastRows); n.textContent = 'Done in ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s. Green = best in its column (lowest for idle, dry spell and board turn).'; }, 30); };
    if (lastRows) paint(lastRows);
    return box;
  }
  function archivePanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint"><b>Round 2</b> (2026-10-16): twelve one-thumb presets on the vessel\'s plane; the designer kept the Lasso for collecting and the Guardian\'s direct prism destruction, and asked for navigator-only elements and in-game prisms, vessels and effects. Page: Docs/Studios/CrewVesselLab.round2.html. <b>Round 1</b> (2026-10-14): four consoles on a flat stand-in. Page: Docs/Studios/CrewVesselLab.round1.html.</p><div class="tablewrap"><table></table></div>';
    const rows = [['Round 2 preset', 'Petals/min', 'Lift %', 'Skill %', 'Moments/min', 'Dry spell (s)', 'Thumb down %'], ['Glide', 37.34, 130.9, 97.9, 51.7, 2.5, 100], ['Hopper', 52.83, 226.8, 149.5, 51.7, 4.0, 3], ['Lasso', 19.67, 21.6, 17.5, 10.8, 13.2, 24], ['Guardian', 16.5, 2.1, -4.1, 34.0, 11.6, 100], ['Everything Flat', 74.5, 360.8, 204.1, 48.7, 2.1, 100]];
    const t = box.querySelector('table');
    rows.forEach((r, i) => { const tr = document.createElement('tr'); for (const v of r) { const c = document.createElement(i ? 'td' : 'th'); c.textContent = v; tr.appendChild(c); } t.appendChild(tr); });
    return box;
  }
  function aboutPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p id="aboutHead"></p><p><b>The question.</b> Sign off the kite before it is built in Unity: one thumb, a head that destroys and a tail that collects, navigator-only motes, and four exponential pure-loop effects that act on the real game.</p>' +
      '<p class="hint"><b>Parity with the game.</b> Hulls fly the Sparrow\'s numbers (speed, ×5 boost, yaw, pitch, roll). Trail prisms are the Sparrow\'s 2 × 2 × 5 boxes, one per 7 u. The Space blast is AOEExplosion: radius 0.5 × MaxScale × sin(t·π/2) over 3 s after 0.2 s, sparing its own domain. A steal moves whole petals and only what the rival holds (ElementalTransfer.Steal; ResourceSystem never lets anything imaginary leave). Domain colours are the game\'s palette.</p>' +
      '<p class="hint"><b>What this lab does NOT model.</b></p><ul class="plain hint">' +
      '<li>The motes are new: the game has no navigator-only pickup yet. Neither does it have a prism-cluster spawner (Mass) or a boost-energy pool (the Sparrow boosts with no meter).</li>' +
      '<li>Prisms are flat boxes on the board and points in the 3D view: no shaders, shields or lighting. Trails recycle their oldest prism (the game conserves mass).</li>' +
      '<li>A hostile prism slows a hull for a second (a stand-in for the danger-prism effects). No hull abilities fire.</li>' +
      '<li>Two players in one hull, networking, and which machine runs the board. A steal would be a scored combat hit in the game (CombatHitDrain.TryAdmit); the lab only counts petals.</li>' +
      '<li>A real thumb tires and misses; the AI navigator\'s aim only has a speed, a reaction time and aim noise.</li></ul>';
    box.querySelector('#aboutHead').textContent = LAB.name + ' · round ' + LAB.round + ' · ' + LAB.branch + ' · write-up: ' + LAB.doc;
    return box;
  }

  $('title').textContent = LAB.name; $('meta').textContent = 'round ' + LAB.round + ' · the kite and its tail';
  let paused = false;
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
  $('restart').onclick = () => reset();
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); Object.assign(OPT, OPT_SHIPPED); presetKey = 'kite'; lsSet('P', {}); lsSet('preset', presetKey); applyOpts(); reset(); paintPresets(); refreshDiff(); };

  // ================= sizing + loop =================
  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now(), acc = 0;
  const DT = 1 / 60;
  function frame(now) {
    const el = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) {
      pollPad(); resize();
      if (!paused) { acc += el; while (acc >= DT) { simStepWorld(world, DT, LIVE); acc -= DT; } }
      if (toastT > 0) { toastT -= el; if (toastT <= 0) $('toast').hidden = true; }
      render();
    }
    requestAnimationFrame(frame);
  }
  reset();
  paintSeatSeg();
  const groups = [...new Set(SPEC.map((r) => r[0]))];
  makeTabs('dockTabs', 'dockBody', [{ name: 'Presets', build: presetsPanel }, { name: 'Navigator', build: optionsPanel }].concat(groups.map((g) => ({ name: g, build: () => sliderGroup(g) }))), 'dock');
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Scorecard', build: scorecardPanel }, { name: 'Decisions', build: logPanel }, { name: 'Archive', build: archivePanel }, { name: 'About', build: aboutPanel }], 'bottom');
  resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  window.__lab = {
    LAB, SHIPPED, SPEC, P, OPT, PRESETS, PLATFORM, crew,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { dt = dt || DT; n = n || 1; for (let i = 0; i < n; i++) simStepWorld(world, dt, LIVE); resize(); render(); },
    reset, score: () => score(), runBatch, runOne, makeWorld, simStepWorld, presetCfg, presetNumbers, presetOpts, setParam, applyPreset, record, requestSwap, fireEffect, closeLoop,
    get world() { return world; },
    core: { kiteMove, tailAdvance, resolveLoop, blastRadius, grow, onBoard, segX, pointInPoly },
    // parity: run a scripted thumb through the page's own kite core; one row per frame
    parityTrace(scn) {
      const saved = Object.assign({}, P); Object.assign(P, scn.P || {});
      const N = { c: [0, P.anchor * P.planeRange * 0.5], vel: [0, 0], tail: [] }, rows = [];
      for (let f = 0; f < scn.aims.length; f++) {
        const a = scn.aims[f]; kiteMove(N, a[0], a[1], !!a[2], scn.dt);
        const poly = tailAdvance(N);
        rows.push({ x: N.c[0], z: N.c[1], vx: N.vel[0], vz: N.vel[1], tail: N.tail.length, loop: poly ? poly.length : 0 });
      }
      Object.assign(P, saved);
      return rows;
    },
    state: () => ({ t: world.t, seed, preset: presetKey, pilot: seatName(world.seats.pilot), nav: seatName(world.seats.nav, true), stats: Object.assign({}, world.stats), charge: world.nav.charge, boost: world.vessels[0].boostE, petals: world.vessels[0].petals.slice() }),
  };
})();
