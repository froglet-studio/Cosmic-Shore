  It lives in the flying vessel's own x-z plane (right x forward); the 3D world projects onto that plane,
  so every bank and pitch of the pilot turns the navigator's board. One thumb plays it, on a phone first.
  Twelve presets bundle a control scheme, a job, a frame and a depth rule; the scorecard runs them all.

<script>

  // Categorical choices: a preset sets all six. They are not sliders, so they live beside SHIPPED.

  };
  const FRAMES = { eased: 'Eased: the board follows the vessel smoothly', locked: 'Locked: the board is the vessel\'s plane every frame', level: 'Level: the board only turns with heading (control)' };

  const OPT_SHIPPED = { control: 'follow', catchOn: true, shieldOn: true, comboOn: false, frame: 'eased', depth: 'ghost' };

  const G = { control: 'follow', catchOn: true, shieldOn: true, comboOn: false, frame: 'eased', depth: 'ghost' };
  const PRESETS = [
    { key: 'glide', name: 'Glide', blurb: 'The kite glides to just above your thumb. Catch crystals, pop danger.', opts: G, set: {} },

    { key: 'surfer', name: 'Slice Surfer', blurb: 'A thin slice (±18 u) locked to the vessel. Only what the pilot\'s plane cuts through is touchable.', opts: Object.assign({}, G, { frame: 'locked', depth: 'slab' }), set: { reachY: 18 } },

  const LS = 'lab:' + LAB.name + ':r2:';
  const lsGet = (k, d) => { try { const v = localStorage.getItem(LS + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) { /* private window */ } };
  const P = Object.assign({}, SHIPPED, lsGet('P', {}));
  for (const k of Object.keys(P)) if (!(k in SHIPPED)) delete P[k];
  const OPT = Object.assign({}, OPT_SHIPPED, lsGet('opt', {}));
  let presetKey = lsGet('preset', 'glide');

  // ================= helpers =================
  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const gauss = (rng) => { const u = Math.max(1e-9, rng()), v = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
  const DEG = Math.PI / 180;
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const len = (a) => Math.hypot(a[0], a[1], a[2]);
  const norm = (a) => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const addS = (a, b, s) => [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s];
  function rot(B, ka, kb, ang) { const a = B[ka], b = B[kb], c = Math.cos(ang), s = Math.sin(ang); B[ka] = [a[0] * c + b[0] * s, a[1] * c + b[1] * s, a[2] * c + b[2] * s]; B[kb] = [b[0] * c - a[0] * s, b[1] * c - a[1] * s, b[2] * c - a[2] * s]; }
  function ortho(B) { B.f = norm(B.f); B.r = norm(cross(B.u, B.f)); B.u = cross(B.f, B.r); }
  const turnAngle = (A, B) => Math.acos(clamp((dot(A.r, B.r) + dot(A.u, B.u) + dot(A.f, B.f) - 1) / 2, -1, 1));

    medium: { label: 'Medium', noise: 0.12, react: 0.28, think: 0.5,  avoid: 0.6,  fovMul: 1 },

  // Navigator AI: a THUMB that travels at a finite speed (board radii per second), not a cursor that teleports.
  const NSKILL = {
    easy:   { label: 'Easy',   thumb: 1.0, think: 0.6,  noise: 0.05,  reachAware: 0.4, lead: 0 },
    medium: { label: 'Medium', thumb: 2.0, think: 0.35, noise: 0.025, reachAware: 0.8, lead: 0.5 },
    hard:   { label: 'Hard',   thumb: 3.4, think: 0.15, noise: 0.01,  reachAware: 1,   lead: 1 },
  };

  let world = null, seed = 7;

  function seatFrom(o) { return { who: o.who, skill: o.skill || 'medium', human: !!o.human, orient: 0, q: [], thinkT: 0, target: -1, noise: [0, 0], avoidRoll: 1, roam: null, plan: null, tgt: null, thumb: { x: 0, z: 0, down: false }, jx: 0, jy: 0 }; }

  function makeWorld(s, cfg) {
    const R = P.cellRadius;
    const w = {
      t: 0, seed: s, cfg, opts: cfg.opts, nextId: 1,
      rngW: mulberry32(s * 9301 + 1), rngP: mulberry32(s * 7919 + 11), rngN: mulberry32(s * 104729 + 5),
      v: { p: [0, 0, -R * 0.45], f: [0, 0, 1], u: [0, 1, 0], r: [1, 0, 0], speed: P.minSpeed + P.throttleScaler, boost: 0.3, slowT: 0, boosting: false, flash: 0 },
      pl: { f: [0, 0, 1], u: [0, 1, 0], r: [1, 0, 0] },
      el: { base: [P.startLevel, P.startLevel, P.startLevel, P.startLevel], temp: [] },
      crystals: [], prisms: [], rival: null,
      caught: 0, navCaught: 0, pops: 0, hits: 0, skims: 0, swaps: 0, swapCool: 0, swapT: cfg.swapEvery || 0,
      whipSum: 0, whipMax: 0, whipN: 0,
      seats: { pilot: seatFrom(cfg.pilot), nav: seatFrom(cfg.nav) },
      nav: null,
    };
    const A = P.anchor * P.planeRange;
    w.nav = { c: [0, A * 0.5], vel: [0, 0], prevDown: false, lastThumb: null, origin: null, path: [], follow: null, closed: false, dashT: 0, dashTo: null, ink: P.inkMax,
      combo: { e: -1, n: 0, t: -99 }, trail: [], fx: [], lastEvent: 0, maxGap: 0, events: 0, downTime: 0, travel: 0, reachN: 0, reachHit: 0, lastSling: null };
    for (let i = 0; i < Math.round(P.crystalCount); i++) spawnCrystal(w);
    const rr = w.rngW;
    w.rival = { p: randInSphere(rr, R * 0.6), f: norm([gauss(rr), gauss(rr), gauss(rr)]), goal: null, acc: 0 };
    for (let i = 0; i < 1500; i++) stepRival(w, 1 / 30);   // pre-roll: the trail exists at t = 0
    updatePlane(w, 1 / 30, true);
    return w;
  }
  function randInSphere(rng, R) { const d = norm([gauss(rng), gauss(rng), gauss(rng)]), r = R * Math.cbrt(rng()); return [d[0] * r, d[1] * r, d[2] * r]; }
  function spawnCrystal(w) {
    let p = null;
    for (let k = 0; k < 6; k++) { p = randInSphere(w.rngW, P.cellRadius * 0.85); if (len(sub(p, w.v.p)) > 60) break; }
    w.crystals.push({ id: w.nextId++, p, e: Math.floor(w.rngW() * 4) % 4, state: 'free', byNav: false, sx: 0, sz: 0, sy: 0, svx: 0, svz: 0, has: false });
  }
  function stepRival(w, dt) {
    const v = w.rival;
    if (!v.goal || len(sub(v.goal, v.p)) < 30) v.goal = randInSphere(w.rngW, P.cellRadius * 0.75);
    const want = norm(sub(v.goal, v.p)), a = 1 - Math.exp(-1.1 * dt);
    v.f = norm(addS(v.f, sub(want, v.f), a));
    v.p = addS(v.p, v.f, 30 * dt);
    v.acc += 30 * dt;
    if (v.acc >= 6) {
      v.acc -= 6;
      if (P.rivalTrail > 0) { w.prisms.push({ p: v.p.slice(), skimT: -9, sx: 0, sz: 0, sy: 0, svx: 0, svz: 0, has: false }); while (w.prisms.length > P.rivalTrail) w.prisms.shift(); }
      else w.prisms.length = 0;
    }
  }

  // ---- elements: base (crystals; recovers into [0,10]) + temporary buffs (decay); nothing is HELD here ----
  function levels(w) { const L = w.el.base.slice(); for (const b of w.el.temp) L[b.e] += b.mag * (1 - b.age / b.dur); return L; }
  const lv = (x) => clamp(x, -5, 15) / 10;
  function addTemp(w, e, mag, dur) { if (mag > 0 && dur > 0) w.el.temp.push({ e, mag, dur, age: 0 }); }
  function stepElements(w, dt) {
    const step = P.recovery * 10 * dt, b = w.el.base;
    for (let i = 0; i < 4; i++) { if (b[i] > 10) b[i] = Math.max(10, b[i] - step); else if (b[i] < 0) b[i] = Math.min(0, b[i] + step); }
    const t = w.el.temp; for (let i = t.length - 1; i >= 0; i--) { t[i].age += dt; if (t[i].age >= t[i].dur) t.splice(i, 1); }
  }
  const cruise = () => P.minSpeed + P.throttleScaler;
  const hullReach = (L) => P.catchRadius * Math.max(0.2, 1 + P.kSpace * lv(L[SP]));

  function catchCrystal(w, c) {
    const i = w.crystals.indexOf(c); if (i < 0) return;
    w.crystals.splice(i, 1);
    w.caught++; if (c.byNav) w.navCaught++;
    w.el.base[c.e] += 1;                       // one crystal = one petal (SkimmerAdjustElementLevelByCrystalEffectSO)
    spawnCrystal(w);
  }

  // ---- the vessel in 3D ----
  function stepVessel(w, inp, dt) {
    const v = w.v, L = levels(w), R = P.cellRadius;
    rot(v, 'f', 'r', clamp(inp.yaw, -1, 1) * P.yawRate * DEG * dt);      // yaw right: nose toward the right wing
    rot(v, 'f', 'u', clamp(inp.pitch, -1, 1) * P.pitchRate * DEG * dt);  // pitch up: nose toward up
    rot(v, 'u', 'r', clamp(inp.roll, -1, 1) * (P.rollRate + 0.1 * v.speed) * DEG * dt); // roll right: up toward the right wing
    ortho(v);
    const thr = inp.throttle == null ? 1 : clamp(inp.throttle, 0, 1);
    let sp = (P.minSpeed + P.throttleScaler * thr) * Math.max(0.2, 1 + P.kTime * lv(L[TI]));
    v.boosting = !!inp.boost && v.boost > 0.02;
    if (v.boosting) { sp *= P.boostMul; v.boost = Math.max(0, v.boost - P.boostDrain * dt); }
    if (v.slowT > 0) { v.slowT -= dt; sp *= 1 - P.hitSlow * (1 - P.kMass * clamp(lv(L[MA]), 0, 1)); }
    v.speed = sp;
    v.p = addS(v.p, v.f, sp * dt);
    const r = len(v.p);
    if (r > R) {                                // the membrane turns you back in
      const n = [v.p[0] / r, v.p[1] / r, v.p[2] / r]; v.p = [n[0] * R, n[1] * R, n[2] * R];
      const d = dot(v.f, n); if (d > 0) { v.f = addS(v.f, n, -2 * d); v.u = addS(v.u, v.f, -dot(v.u, v.f)); ortho(v); }
    }
    if (v.flash > 0) v.flash -= dt;
    const sk2 = P.skimRadius * P.skimRadius, hit2 = P.hitRadius * P.hitRadius;
    for (let i = w.prisms.length - 1; i >= 0; i--) {
      const q = w.prisms[i].p, dx = q[0] - v.p[0], dy = q[1] - v.p[1], dz = q[2] - v.p[2], d2 = dx * dx + dy * dy + dz * dz;
      if (d2 > sk2) continue;
      if (d2 < hit2) { w.prisms.splice(i, 1); v.slowT = P.hitSlowSec; v.flash = 0.3; w.hits++; continue; }
      const pr = w.prisms[i];
      if (w.t - pr.skimT > 1) { pr.skimT = w.t; w.skims++; v.boost = Math.min(1, v.boost + P.skimGain * Math.max(0, 1 + P.kCharge * lv(L[CH]))); }
    }
    const reach = hullReach(L);
    for (let i = w.crystals.length - 1; i >= 0; i--) {
      const c = w.crystals[i], d = sub(v.p, c.p), dl = len(d);
      if (c.state === 'reel') { const s = P.reelSpeed * dt; if (dl <= Math.max(reach, s)) { catchCrystal(w, c); continue; } c.p = addS(c.p, d, s / dl); continue; }
      if (dl < reach) catchCrystal(w, c);
    }
  }

  // ---- the pilot's AI: writes {yaw, pitch, roll, boost, throttle}, the same object a gamepad does ----
  function localOf(B, origin, q) { const d = sub(q, origin); return [dot(d, B.r), dot(d, B.u), dot(d, B.f)]; }
  function perceives(w, seat, c) {
    const l = localOf(w.v, w.v.p, c.p), d = len(l);
    if (d < 40) return true; if (d > P.viewRange) return false;
    return Math.acos(clamp(l[2] / d, -1, 1)) <= P.pilotFov * DEG * 0.5 * SKILL[seat.skill].fovMul;
  }
  function currentRoll(v) { const lu = [-v.f[0] * v.f[1], 1 - v.f[1] * v.f[1], -v.f[2] * v.f[1]]; if (len(lu) < 0.2) return 0; return Math.atan2(-dot(lu, v.r), dot(lu, v.u)); }
  function pilotAI(w, seat, dt) {
    const S = SKILL[seat.skill], v = w.v, rng = w.rngP, R = P.cellRadius, turnR = cruise() / (P.yawRate * DEG);
    seat.thinkT -= dt;
    if (seat.thinkT <= 0) {
      seat.thinkT = S.think * (0.8 + 0.4 * rng());
      let tgt = -1, best = 1e9;
      for (const c of w.crystals) {
        if (c.state !== 'free' || !perceives(w, seat, c)) continue;
        const l = localOf(v, v.p, c.p), d = len(l), ang = Math.acos(clamp(l[2] / Math.max(d, 1e-6), -1, 1)), k = d + ang * turnR;
        if (k < best) { best = k; tgt = c.id; }
      }
      seat.target = tgt; seat.noise = [gauss(rng) * S.noise, gauss(rng) * S.noise]; seat.avoidRoll = rng();
    }
    let tg = null; if (seat.target >= 0) for (const c of w.crystals) if (c.id === seat.target && c.state === 'free') tg = c;
    let goal;
    const outward = dot(v.p, v.f) > 0 && len(v.p) > R * 0.9;
    if (outward) goal = [0, 0, 0];
    else if (tg) goal = tg.p;
    else {
      if (!seat.roam || len(sub(seat.roam.p, v.p)) < 40 || w.t > seat.roam.until) seat.roam = { p: randInSphere(rng, R * 0.6), until: w.t + 12 };
      goal = seat.roam.p;
    }
    const l = localOf(v, v.p, goal), dist = len(l);
    const yawErr = Math.atan2(l[0], l[2]) + seat.noise[0], pitchErr = Math.atan2(l[1], hypot2(l[0], l[2])) + seat.noise[1];
    let yaw = clamp(yawErr / 0.35, -1, 1), pitch = clamp(pitchErr / 0.35, -1, 1);
    if (seat.avoidRoll < S.avoid) {
      let nd = 1e9, nl = null;
      for (const pr of w.prisms) { const q = localOf(v, v.p, pr.p); if (q[2] <= 0 || q[2] > 45) continue; const off = hypot2(q[0], q[1]); if (off < q[2] * 0.25 && q[2] < nd) { nd = q[2]; nl = q; } }
      if (nl) { if (Math.abs(nl[0]) >= Math.abs(nl[1])) yaw = nl[0] >= 0 ? -1 : 1; else pitch = nl[1] >= 0 ? -1 : 1; }
    }
    const roll = clamp((yaw * P.pilotBank * 60 * DEG - currentRoll(v)) / 0.3, -1, 1);
    const angOff = Math.acos(clamp(l[2] / Math.max(dist, 1e-6), -1, 1));
    const boost = !!tg && angOff < 0.2 && dist > 70 && v.boost > 0.15;
    const throttle = tg && angOff > 0.5 && dist < turnR * 2.2 ? 0 : 1;
    seat.q.push({ t: w.t, yaw, pitch, roll, boost, throttle });
    while (seat.q.length > 1 && seat.q[1].t <= w.t - S.react) seat.q.shift();
    return seat.q[0];
  }

  // ---- the plane: the navigator's board is the vessel's x-z plane (three frames to compare) ----
  function updatePlane(w, dt, snap) {
    const v = w.v, pl = w.pl, prev = { f: pl.f, u: pl.u, r: pl.r }, mode = w.opts.frame;
    if (snap || mode === 'locked') { pl.f = v.f.slice(); pl.u = v.u.slice(); pl.r = v.r.slice(); }
    else if (mode === 'eased') { const a = 1 - Math.exp(-P.easeRate * dt); pl.f = addS(pl.f, sub(v.f, pl.f), a); pl.u = addS(pl.u, sub(v.u, pl.u), a); ortho(pl); }
    else { const fh = [v.f[0], 0, v.f[2]]; if (len(fh) > 0.15) pl.f = norm(fh); pl.u = [0, 1, 0]; pl.r = norm(cross(pl.u, pl.f)); pl.f = cross(pl.r, pl.u); }
    if (!snap && dt > 0) { const a = turnAngle(prev, pl) / DEG / dt; w.whipSum += a; w.whipN++; if (a > w.whipMax) w.whipMax = a; }
  }
  // shadow of a 3D point on the board: (x right, z forward) in u, and its height y above (+) or below (−) the plane
  function shadowOf(w, o, dt) {
    const d = sub(o.p, w.v.p), x = dot(d, w.pl.r), z = dot(d, w.pl.f), y = dot(d, w.pl.u);
    if (o.has && dt > 0) { const k = 0.5; o.svx += ((x - o.sx) / dt - o.svx) * k; o.svz += ((z - o.sz) / dt - o.svz) * k; }
    o.sx = x; o.sz = z; o.sy = y; o.has = true;
  }
  const discA = () => P.anchor * P.planeRange;
  const inDisc = (x, z) => x * x + (z - discA()) * (z - discA()) <= P.planeRange * P.planeRange;
  const touchable = (o) => Math.abs(o.sy) <= P.reachY;

  // ---- the navigator: one thumb {x, z, down} in board units drives the kite ----
  // A MOMENT is a beat the navigator feels: events less than 0.4 s apart (a sweep through a trail) are one moment.
  function navEvent(w, x, z, kind, e, text) {
    const N = w.nav;
    if (w.t - N.lastEvent > 0.4 || N.events === 0) { const gap = w.t - N.lastEvent; if (gap > N.maxGap) N.maxGap = gap; N.events++; }
    N.lastEvent = w.t;
    if (N.fx.length < 40) N.fx.push({ x, z, t: w.t, kind, e, text });
  }
  function navCatch(w, c) {
    c.state = 'reel'; c.byNav = true;
    const o = w.opts, N = w.nav;
    let text = '+1 ' + EL[c.e];
    if (o.comboOn) {
      if (c.e === N.combo.e && w.t - N.combo.t <= P.comboWindow) N.combo.n++; else { N.combo.e = c.e; N.combo.n = 1; }
      N.combo.t = w.t;
      if (N.combo.n >= 3) { addTemp(w, c.e, P.comboBuff * (N.combo.n - 2), P.comboDur); text = EL[c.e] + ' ×' + N.combo.n; }
    }
    navEvent(w, c.sx, c.sz, 'catch', c.e, text);
  }
  function navPop(w, i) { const pr = w.prisms[i]; w.prisms.splice(i, 1); w.pops++; navEvent(w, pr.sx, pr.sz, 'pop', -1, ''); }
  function touchAt(w, x, z, rad) {
    const o = w.opts, r2 = rad * rad;
    if (o.catchOn) for (const c of w.crystals) { if (c.state !== 'free' || !touchable(c) || !inDisc(c.sx, c.sz)) continue; const dx = c.sx - x, dz = c.sz - z; if (dx * dx + dz * dz <= r2) navCatch(w, c); }
    if (o.shieldOn) for (let i = w.prisms.length - 1; i >= 0; i--) { const p = w.prisms[i]; if (!touchable(p) || !inDisc(p.sx, p.sz)) continue; const dx = p.sx - x, dz = p.sz - z; if (dx * dx + dz * dz <= r2) navPop(w, i); }
  }
  function pointInPoly(x, z, pts) { let inside = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const a = pts[i], b = pts[j]; if ((a[1] > z) !== (b[1] > z) && x < (b[0] - a[0]) * (z - a[1]) / (b[1] - a[1] + 1e-9) + a[0]) inside = !inside; } return inside; }
  function lassoTake(w, pts) {
    const o = w.opts;
    if (o.catchOn) for (const c of w.crystals) if (c.state === 'free' && touchable(c) && inDisc(c.sx, c.sz) && pointInPoly(c.sx, c.sz, pts)) navCatch(w, c);
    if (o.shieldOn) for (let i = w.prisms.length - 1; i >= 0; i--) { const p = w.prisms[i]; if (touchable(p) && inDisc(p.sx, p.sz) && pointInPoly(p.sx, p.sz, pts)) navPop(w, i); }
  }
  function keepInDisc(N, bounce) {
    const A = discA(), R = P.planeRange * 0.97, dx = N.c[0], dz = N.c[1] - A, d = hypot2(dx, dz);
    if (d <= R) return;
    const nx = dx / d, nz = dz / d; N.c = [nx * R, A + nz * R];
    const vn = N.vel[0] * nx + N.vel[1] * nz;
    if (vn > 0) { if (bounce) { N.vel[0] -= 2 * vn * nx; N.vel[1] -= 2 * vn * nz; N.vel[0] *= 0.85; N.vel[1] *= 0.85; } else { N.vel[0] -= vn * nx; N.vel[1] -= vn * nz; } }
  }
  // a target the kite can actually reach: a dash or a path point past the rim would never arrive (the kite froze there)
  function onBoard(x, z) { const A = discA(), R = P.planeRange * 0.96, dz = z - A, d = hypot2(x, dz); return d <= R ? [x, z] : [x / d * R, A + dz / d * R]; }
  function steerTo(N, want, dt) { const a = 1 - Math.exp(-P.charAccel * dt); N.vel[0] += (want[0] - N.vel[0]) * a; N.vel[1] += (want[1] - N.vel[1]) * a; }
  function stepNav(w, th, dt) {
    const N = w.nav, o = w.opts, Rr = P.planeRange;
    const down = !!th.down, press = down && !N.prevDown, release = !down && N.prevDown;
    N.prevDown = down;
    if (down) N.downTime += dt;
    if (N.lastThumb) N.travel += hypot2(th.x - N.lastThumb[0], th.z - N.lastThumb[1]) / (2 * Rr);
    N.lastThumb = [th.x, th.z];
    N.dashT = Math.max(0, N.dashT - dt);
    const old = N.c.slice();
    switch (o.control) {
      case 'follow': {
        if (down) { const gx = th.x, gz = th.z + P.thumbOffset * Rr, dx = gx - N.c[0], dz = gz - N.c[1], d = hypot2(dx, dz), s = Math.min(P.charSpeed, d * 6); steerTo(N, d > 1e-6 ? [dx / d * s, dz / d * s] : [0, 0], dt); }
        else steerTo(N, [0, 0], dt);
        N.c = [N.c[0] + N.vel[0] * dt, N.c[1] + N.vel[1] * dt]; keepInDisc(N, false); break;
      }
      case 'stick': {
        if (press) N.origin = [th.x, th.z];
        if (down && N.origin) { let vx = (th.x - N.origin[0]) / (P.stickRadius * Rr), vz = (th.z - N.origin[1]) / (P.stickRadius * Rr); const m = hypot2(vx, vz); if (m > 1) { vx /= m; vz /= m; } steerTo(N, [vx * P.charSpeed, vz * P.charSpeed], dt); }
        else { steerTo(N, [0, 0], dt); if (!down) N.origin = null; }
        N.c = [N.c[0] + N.vel[0] * dt, N.c[1] + N.vel[1] * dt]; keepInDisc(N, false); break;
      }
      case 'dash': {
        if (press && N.dashT <= 0) { N.dashTo = onBoard(th.x, th.z); N.dashT = P.dashCooldown; }
        if (N.dashTo) {
          const dx = N.dashTo[0] - N.c[0], dz = N.dashTo[1] - N.c[1], d = hypot2(dx, dz), s = P.dashSpeed * dt;
          // sweep the dash in small steps so a fast dash cannot tunnel past a shadow
          const steps = Math.max(1, Math.ceil(Math.min(d, s) / (P.charRadius * 0.8)));
          for (let k = 1; k <= steps; k++) { const f = Math.min(d, s) * k / steps / Math.max(d, 1e-6); touchAt(w, N.c[0] + dx * f, N.c[1] + dz * f, P.charRadius); }
          if (d <= s) { N.c = N.dashTo; N.dashTo = null; N.vel = [0, 0]; } else { N.c = [N.c[0] + dx / d * s, N.c[1] + dz / d * s]; N.vel = [dx / d * P.dashSpeed, dz / d * P.dashSpeed]; }
        }
        keepInDisc(N, false); break;
      }
      case 'sling': {
        if (press) N.origin = [th.x, th.z];
        if (down && N.origin) N.lastSling = [N.origin[0] - th.x, N.origin[1] - th.z];
        if (release && N.origin) { const pull = [N.origin[0] - th.x, N.origin[1] - th.z]; N.vel = [pull[0] * P.slingPower, pull[1] * P.slingPower]; N.origin = null; N.lastSling = null; }
        const k = Math.exp(-P.slingFriction * dt); N.vel = [N.vel[0] * k, N.vel[1] * k];
        N.c = [N.c[0] + N.vel[0] * dt, N.c[1] + N.vel[1] * dt]; keepInDisc(N, true); break;
      }
      case 'lasso': {
        if (press) { N.path = [[th.x, th.z]]; N.closed = false; }
        if (down && !N.closed && N.path.length) {
          const lastP = N.path[N.path.length - 1], seg = hypot2(th.x - lastP[0], th.z - lastP[1]);
          if (seg > 2) {
            N.ink -= seg / Rr; N.path.push([th.x, th.z]);
            if (N.ink <= 0) { N.ink = 0; N.path = []; N.closed = true; }
            else if (N.path.length > 8 && hypot2(th.x - N.path[0][0], th.z - N.path[0][1]) < P.lassoClose * Rr) { lassoTake(w, N.path); N.fx.push({ loop: N.path.slice(), t: w.t, kind: 'loop' }); N.path = []; N.closed = true; }
          }
        }
        if (!down) { N.path = []; N.ink = Math.min(P.inkMax, N.ink + P.inkRegen * dt); }
        break;
      }
      case 'path': {
        if (press) { N.path = [onBoard(th.x, th.z)]; N.follow = null; }
        if (down && N.path.length) { const lastP = N.path[N.path.length - 1], seg = hypot2(th.x - lastP[0], th.z - lastP[1]); if (seg > 3 && N.ink > 0) { N.ink -= seg / Rr; N.path.push(onBoard(th.x, th.z)); } }

      row.innerHTML = '<label><span></span><span class="key"></span></label><output></output><input type="range"><div class="tip"></div>';
      row.querySelector('label span').textContent = label; row.querySelector('.key').textContent = key; row.querySelector('.tip').textContent = tip;
      const inp = row.querySelector('input'); Object.assign(inp, { min: lo, max: hi, step, value: P[key], id: 'sl-' + key });
      inp.oninput = () => setParam(key, parseFloat(inp.value));
      outputs[key] = { out: row.querySelector('output'), inp };
      box.appendChild(row);
    }
    queueMicrotask(refreshDiff);
    return box;
  }
  let presetBox = null;
  function paintPresets() { if (!presetBox || !presetBox.isConnected) return; for (const b of presetBox.querySelectorAll('.preset')) b.setAttribute('aria-pressed', String(b.dataset.key === presetKey)); }
  function presetsPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint">Each preset is one way the 2D character could play: a one-thumb control, a job, how the board follows the vessel, and how off-plane shadows look. Pick one, play it on your phone, then record what felt fun in Decisions.</p><div class="presets"></div>';
    const grid = box.querySelector('.presets');
    for (const pr of PRESETS) {
      const b = document.createElement('button'); b.className = 'preset'; b.dataset.key = pr.key;
      b.innerHTML = '<b></b><span></span><span class="tags"></span>';
      b.children[0].textContent = pr.name; b.children[1].textContent = pr.blurb;
      const o = pr.opts, jobs = [o.catchOn && 'catch', o.shieldOn && 'pop', o.comboOn && 'combo'].filter(Boolean).join('+');
      b.children[2].textContent = CONTROLS[o.control][0] + ' · ' + jobs + ' · ' + o.frame + ' · ' + o.depth + ('reachY' in pr.set ? ' · reach ±' + pr.set.reachY : '');
      b.onclick = () => applyPreset(pr.key);
      grid.appendChild(b);
    }
    presetBox = box; queueMicrotask(paintPresets);
    return box;
  }
  function optionsPanel() {
    const box = document.createElement('div');
    const sel = (id, label, table, key) => { const l = document.createElement('label'); l.className = 'field'; l.innerHTML = '<span></span><select></select>'; l.firstChild.textContent = label; const s = l.lastChild; s.id = id; for (const k in table) { const op = document.createElement('option'); op.value = k; op.textContent = Array.isArray(table[k]) ? table[k][0] + ': ' + table[k][1] : table[k]; s.appendChild(op); } s.value = OPT[key]; s.onchange = () => { OPT[key] = s.value; applyOpts(); markCustom(); world.nav.path = []; world.nav.follow = null; world.nav.origin = null; world.seats.nav.plan = null; }; box.appendChild(l); };
    const chk = (id, label, key) => { const l = document.createElement('label'); l.className = 'check'; l.innerHTML = '<input type="checkbox"><span></span>'; l.lastChild.textContent = label; const c = l.firstChild; c.id = id; c.checked = OPT[key]; c.onchange = () => { OPT[key] = c.checked; applyOpts(); markCustom(); }; box.appendChild(l); };
    sel('optControl', 'One-thumb control', CONTROLS, 'control');
    chk('optCatch', 'Catch crystals (each is reeled into the hull: one petal)', 'catchOn');
    chk('optShield', 'Pop danger prisms (an active force, so mass rules hold)', 'shieldOn');
    chk('optCombo', 'Combos: three of one element in a row is a temporary buff', 'comboOn');
    sel('optFrame', 'How the board follows the vessel', FRAMES, 'frame');
    sel('optDepth', 'Shadows of things off the plane', DEPTHS, 'depth');
    const p = document.createElement('p'); p.className = 'hint';
    p.textContent = 'Seats: Navigate (you play the board, an AI flies), Fly (you fly with keys or a pad: A/D yaw, W/S pitch, Q/E roll, Space boost, Shift brake), Watch, or Couch (two people: one flies, one plays the board). Swap seats with the D-pad, 1 / 2 or the header button. Touching the board takes the navigator seat.';
    box.appendChild(p);
    const ms = document.createElement('label'); ms.className = 'field'; ms.innerHTML = '<span>Your squad mate (the AI in the other seat)</span><select id="mateSel"><option value="easy">AI Easy</option><option value="medium">AI Medium</option><option value="hard">AI Hard</option></select>';
    const s2 = ms.querySelector('select'); s2.value = crew.mate; s2.onchange = () => { crew.mate = s2.value; lsSet('crew', crew); applyCrew(); };
    box.appendChild(ms);
    return box;
  }
  function paintSeatSeg() { for (const b of $('seatSeg').children) b.setAttribute('aria-pressed', String(b.dataset.you === crew.you)); }
  for (const b of $('seatSeg').children) b.onclick = () => { crew.you = b.dataset.you; lsSet('crew', crew); applyCrew(); paintSeatSeg(); };
  $('swapBtn').onclick = () => requestSwap('button');

  // ---- decision log (shared db, browser fallback) ----
  let db = null, me = '', remote = [], localLog = lsGet('log', []);
  function snapshot() { return { round: LAB.round, seed, preset: presetKey, options: Object.assign({}, OPT), optionsChanged: optDiff(), you: crew.you, mate: crew.mate, changed: diffOnly() }; }
  async function record(topic, choice, note) {
    const doc = { topic, choice, note: note || '', createdAt: Date.now(), by: me, settings: snapshot() };
    if (db) { try { await db.collection('decisions').add(doc); return 'shared'; } catch (e) { /* fall through */ } }
    localLog.push(doc); lsSet('log', localLog); return 'local';
  }
  function currentChoice(topic) {
    const pr = PRESETS.find((p) => p.key === presetKey), name = pr ? pr.name : 'custom (' + CONTROLS[OPT.control][0] + ', ' + OPT.frame + ', ' + OPT.depth + ')';
    if (topic === 'Most fun preset') return name + ' was the most fun because…';
    if (topic === 'One-thumb control') return CONTROLS[OPT.control][0] + ' feels right / wrong because…';
    if (topic === 'Board frame') return FRAMES[OPT.frame] + ': keep / change because…';
    if (topic === 'Off-plane shadows') return DEPTHS[OPT.depth] + ': keep / change because…';
    return 'Settings: ' + (Object.keys(diffOnly()).length ? JSON.stringify(diffOnly()) : 'shipped');
  }
  function logPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint" id="logStatus"></p><label class="field"><span>Topic</span><select id="logTopic"><option>Most fun preset</option><option>One-thumb control</option><option>Board frame</option><option>Off-plane shadows</option><option>Tuning</option><option>Other idea</option></select></label><label class="field"><span>Your decision</span><textarea id="logChoice" rows="2"></textarea></label><p><button class="btn primary" id="logSave">Record decision</button> <button class="btn" id="logCopy">Copy log</button></p><div class="tablewrap"><table id="logTable"></table></div>';
    const status = box.querySelector('#logStatus'), topic = box.querySelector('#logTopic'), choice = box.querySelector('#logChoice');
    status.textContent = db ? 'Shared log: saved with the lab, readable by Claude at the start of the next round.' : 'Kept in this browser. Use Copy log to send it.';
    status.className = db ? 'status-ok' : 'status-warn';
    const prefill = () => { choice.value = currentChoice(topic.value); }; topic.onchange = prefill; prefill();
    box.querySelector('#logSave').onclick = async () => { const where = await record(topic.value, choice.value); status.textContent = where === 'shared' ? 'Recorded in the shared log.' : 'Recorded in this browser.'; renderLog(box); };
    box.querySelector('#logCopy').onclick = () => { const t = remote.concat(localLog).map((d) => new Date(d.createdAt).toISOString() + ' · ' + d.topic + ': ' + d.choice + ' ' + JSON.stringify(d.settings)).join('\n'); try { navigator.clipboard.writeText(t).catch(() => {}); } catch (e) { /* refused */ } };
    renderLog(box);
    return box;
  }
  function renderLog(box) {
    const t = (box || document).querySelector('#logTable'); if (!t) return;
    const rows = remote.concat(localLog).sort((a, b) => b.createdAt - a.createdAt).slice(0, 50);
    t.innerHTML = '<tr><th>When</th><th>Topic</th><th>Decision</th></tr>';
    if (!rows.length) { const tr = document.createElement('tr'); tr.innerHTML = '<td colspan="3" class="hint">No decisions yet. Play a few presets on your phone, then record which one was fun and why.</td>'; t.appendChild(tr); }
    for (const d of rows) { const tr = document.createElement('tr'); for (const v of [new Date(d.createdAt).toLocaleString(), d.topic, d.choice]) { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); } t.appendChild(tr); }
  }
  (async function connect() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try { db = await c.use('db'); } catch (e) { db = null; }
    try { const u = await c.use('user'); if (u) me = (await u.id()) || ''; } catch (e) { me = ''; }
    if (!db) return;
    db.collection('decisions').orderBy('createdAt', 'desc').limit(300).onSnapshot((snap) => { remote = snap.docs.map((d) => Object.assign({ id: d.id }, d.data())); renderLog(); }, () => { db = null; });
  })();

  const COLS = [
    ['name', 'Preset', ''], ['petals', 'Petals/min', 'the hull\'s crystals per minute, AI Hard pilot + AI Hard navigator'],
    ['lift', 'Lift %', 'against the same pilot flying with nobody on the board'],
    ['navShare', 'Kite share %', 'of the hull\'s petals, how many the navigator caught'],
    ['skill', 'Skill %', 'Hard minus Easy navigator, as % of solo: does playing well show?'],
    ['idle', 'Idle %', 'a navigator who never touches the screen, against solo: what the seat earns for nothing'],
    ['events', 'Moments/min', 'the navigator\'s beats per minute: a catch, pop or combo, with events under 0.4 s apart counted once'],
    ['dry', 'Dry spell (s)', 'the longest wait between two navigator moments (mean over seeds)'],
    ['thumbDown', 'Thumb down %', 'how much of the time the thumb is on the glass'],
    ['travel', 'Thumb travel', 'board widths the thumb moves per minute'],
    ['whip', 'Board turn °/s', 'how fast the board turns under the thumb (mean): comfort'],
    ['reach', 'Touchable %', 'of the crystals on the board, how many are near enough the plane to touch'],
    ['hits', 'Hits/min', 'danger-prism hits on the hull'], ['noise', '± (SE)', 'standard error of petals/min over the seeds'],
  ];
  let lastRows = null;
  function scorecardPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p><button class="btn primary" id="runBatch">Score every preset</button> <span class="hint" id="batchNote">Headless: 4 seeds × 90 s, AI Hard pilot; each preset with a Hard, an Easy and an idle navigator. Hover a column for what it measures.</span></p><div class="tablewrap"><table id="scoreTable"></table></div>';
    const paint = (rows) => {
      const t = box.querySelector('#scoreTable'); t.innerHTML = '';
      const hr = document.createElement('tr'); for (const [, label, tip] of COLS) { const th = document.createElement('th'); th.textContent = label; th.title = tip; hr.appendChild(th); } t.appendChild(hr);
      const hi = { lift: 1, navShare: 1, skill: 1, events: 1, reach: 1 }, lo = { dry: 1, whip: 1, idle: 1 }, body = rows.slice(1), best = {};
      for (const k in hi) best[k] = Math.max(...body.map((r) => r[k]));
      for (const k in lo) best[k] = Math.min(...body.map((r) => r[k]));
      for (const r of rows) { const tr = document.createElement('tr'); for (const [k] of COLS) { const td = document.createElement('td'); td.textContent = r[k]; if (r.key !== 'solo' && k in best && best[k] === r[k]) td.className = 'best'; tr.appendChild(td); } t.appendChild(tr); }
    };
    box.querySelector('#runBatch').onclick = () => { const n = box.querySelector('#batchNote'); n.textContent = 'Scoring…'; setTimeout(() => { const t0 = performance.now(); lastRows = runBatch(); paint(lastRows); n.textContent = 'Done in ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s. Green = best in its column (lowest for idle, dry spell and board turn).'; }, 30); };
    if (lastRows) paint(lastRows);
    return box;
  }
  function archivePanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p class="hint">Round 1 (2026-10-14): four navigator consoles on a flat 2D stand-in for flight, Hard pilot + Hard navigator, 8 seeds × 120 s. Superseded by the designer: the radar character needs no vessel of its own, suits mobile and people who want 2D play, but it did not look fun and did not make sense in 3D without a way to rotate the slice. Full page: Docs/Studios/CrewVesselLab.round1.html.</p><div class="tablewrap"><table></table></div>';
    const rows = [['Console', 'Petals/min', 'Lift %', 'Navigator skill %', 'Rookie rescue %', 'Nav actions/min'], ['Solo', 14.06, 0, 0, 0, 0], ['Gem Feed', 15.94, 13.3, 9.8, 7.6, 24.5], ['Scope Call', 16.0, 13.8, 31.1, 32.2, 18.6], ['Lock & Reel', 30.75, 118.7, 40.9, 208.5, 22.4], ['Power Split', 16.94, 20.4, 4.0, 12.7, 202.9]];
    const t = box.querySelector('table');
    rows.forEach((r, i) => { const tr = document.createElement('tr'); for (const v of r) { const c = document.createElement(i ? 'td' : 'th'); c.textContent = v; tr.appendChild(c); } t.appendChild(tr); });
    return box;
  }
  function aboutPanel() {
    const box = document.createElement('div');
    box.innerHTML = '<p id="aboutHead"></p><p><b>The question.</b> The navigator is a 2D character with no vessel of its own. It lives in the flying vessel\'s own x-z plane, and the 3D world projects onto that plane, so the pilot\'s banks and pitches turn and sweep the navigator\'s board. What makes that fun, on a phone, with one thumb?</p>' +
      '<p class="hint"><b>What this lab does NOT model.</b></p><ul class="plain hint">' +
      '<li>The 3D world is points: no prism shapes, no lighting, no camera feel beyond a plain chase view. The board is the thing under test.</li>' +
      '<li>Element effects are stand-ins following the element conventions. No real hull\'s abilities fire.</li>' +
      '<li>One hull, one rival AI, no game mode and no scoring rule. Petals per minute is the yardstick for the crew; moments, dry spells and thumb load stand in for fun, which only playing can judge.</li>' +
      '<li>The rival\'s trail recycles its oldest prism. The game conserves mass; this lab does not.</li>' +
      '<li>Two players on one hull does not exist in the game yet (one Player flies one vessel; PilotSwap only exchanges hulls). Networking, ownership and which machine runs the board are not modelled.</li>' +
      '<li>A real thumb hides what is under it, gets tired and misses; the AI navigator\'s thumb only has a finite speed, a reaction time and aim noise.</li></ul>';
    box.querySelector('#aboutHead').textContent = LAB.name + ' · round ' + LAB.round + ' · ' + LAB.branch + ' · write-up: ' + LAB.doc;
    return box;
  }

  $('title').textContent = LAB.name; $('meta').textContent = 'round ' + LAB.round + ' · the 2D navigator';
  let paused = false;
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
  $('restart').onclick = () => reset();
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); Object.assign(OPT, OPT_SHIPPED); presetKey = 'glide'; lsSet('P', {}); lsSet('preset', presetKey); applyOpts(); reset(); paintPresets(); refreshDiff(); };

  // ================= sizing + loop =================
  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now(), acc = 0;
  const DT = 1 / 60;
  function frame(now) {
    const el = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) {
      pollPad(); resize();
      if (!paused) { acc += el; while (acc >= DT) { simStepWorld(world, DT, LIVE); acc -= DT; } }
      if (toastT > 0) { toastT -= el; if (toastT <= 0) $('toast').hidden = true; }
      render();
    }
    requestAnimationFrame(frame);
  }
  reset();
  paintSeatSeg();
  const groups = [...new Set(SPEC.map((r) => r[0]))];
  makeTabs('dockTabs', 'dockBody', [{ name: 'Presets', build: presetsPanel }, { name: 'Navigator', build: optionsPanel }].concat(groups.map((g) => ({ name: g, build: () => sliderGroup(g) }))), 'dock');
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Scorecard', build: scorecardPanel }, { name: 'Decisions', build: logPanel }, { name: 'Archive', build: archivePanel }, { name: 'About', build: aboutPanel }], 'bottom');
  resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  window.__lab = {
    LAB, SHIPPED, SPEC, P, OPT, PRESETS, PLATFORM, crew,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { dt = dt || DT; n = n || 1; for (let i = 0; i < n; i++) simStepWorld(world, dt, LIVE); resize(); render(); },
    reset, score: () => score(), runBatch, runOne, makeWorld, simStepWorld, presetCfg, presetNumbers, setParam, applyPreset, record, requestSwap,
    state: () => ({ t: world.t, seed, preset: presetKey, options: Object.assign({}, world.opts), pilot: seatName(world.seats.pilot), nav: seatName(world.seats.nav, true), caught: world.caught, navCaught: world.navCaught, pops: world.pops, hits: world.hits, levels: levels(world).map((x) => +x.toFixed(2)) }),
  };
})();
</script>
