<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cosmic Shore Launch Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- The Launch Console, built from Frogma Rev 117 (Docs/MENU_REDESIGN_B.md section 213): the board's shell, the menu cell
     and the sea behind every page, its icons and motion, on the console's own store. Five pages: Mission, Pipeline,
     Builds, Release, Signals; the theme picker sits at the foot of the rail (Shombith, 2026-11-17).
     Published with supporting files (README.md): theme.js and themes.css from Tools/Analytics/console (one theme source
     for both consoles), cell.jpg (the menu cell) and hulls/<Vessel>.png (the hangar card renders). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aldrich&family=Chakra+Petch:wght@500;600;700&display=swap">
<script src="theme.js"></script>
<script>
// This console opens in Photic, the game's own sunlit Deep Sea, and keeps its own choice (not Analytics').
(function () { var T = window.FA_THEMES; if (!T) return; var k = 'lc-theme', id = null;
  try { id = localStorage.getItem(k); } catch (e) {}
  if (!T.themes.some(function (t) { return t.id === id; })) id = 'photic';
  document.documentElement.setAttribute('data-fs-theme', id);
  T.pick = function (x) { if (!T.themes.some(function (t) { return t.id === x; })) return; document.documentElement.setAttribute('data-fs-theme', x); try { localStorage.setItem(k, x); } catch (e) {} };
})();
</script>
<link rel="stylesheet" href="themes.css">
<style>
/* The board's own names for the theme's colours. Families keep one meaning each: the call to action (Lime) is the one
   thing to do now and the only thing that glows; danger (Fire) is no-go; commit (Ruby) is no way back; selection
   (Jade) is what you picked and focus. Nothing is rounded: corners are cut. */
:root { --g: var(--fs-ground); --gd: var(--fs-ground-deep); --s: var(--fs-surface); --sr: var(--fs-surface-raised); --ln: var(--fs-line);
  --tx: var(--fs-text); --ts: var(--fs-text-soft); --to: var(--fs-text-off); --cta: var(--fs-cta); --ctaf: var(--fs-cta-fill); --on: var(--fs-on-fill);
  --dg: var(--fs-danger); --sel: var(--fs-selection); --cm: var(--fs-commit); --oncm: var(--fs-on-commit); --sea1: var(--sea-1); --sea2: var(--sea-2); --sea3: var(--sea-3);
  --wash: var(--sea-wash); --rail: 232px; --gut: 32px; --ease: cubic-bezier(.22, 1, .36, 1); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--gd); color: var(--tx); font-family: 'Aldrich', 'Chakra Petch', system-ui, sans-serif; font-size: 16px; line-height: 1.45; transition: background-color .5s, color .5s; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--sel); }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; font-weight: 400; }
.lab { font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--ts); }
.cap { font-family: 'Chakra Petch', sans-serif; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.num { font-variant-numeric: tabular-nums; }
.soft { color: var(--ts); } .off { color: var(--to); } .bad { color: var(--dg); }
.h1 { font-size: 34px; line-height: 1.1; } .h2 { font-size: 28px; line-height: 1.15; } .h3 { font-size: 21px; line-height: 1.2; }
.big { font-size: 48px; line-height: 1.05; }
.sm { font-size: 15px; } .xs { font-size: 13px; }
.mono { font-family: 'Chakra Petch', sans-serif; font-weight: 500; letter-spacing: .04em; }
.hr { height: 1px; background: color-mix(in srgb, var(--ln) 70%, transparent); }
.sl { clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
.sls { clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: square; stroke-linejoin: miter; }
svg.i.s { width: 16px; height: 16px; }

/* behind every page: the menu cell, breathing, under a wash, and the sea lines drifting */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bgimg { position: absolute; inset: -4%; width: 108%; height: 108%; object-fit: cover; opacity: .42; animation: breath 48s ease-in-out infinite alternate; transition: opacity .6s; }
@keyframes breath { from { transform: scale(1.02); } to { transform: scale(1.08) translate(-12px, 6px); } }
.wash { position: absolute; inset: 0; background: radial-gradient(1100px 640px at 72% 18%, color-mix(in srgb, var(--wash) 80%, transparent), transparent 70%), linear-gradient(180deg, color-mix(in srgb, var(--gd) 30%, transparent) 20%, var(--gd) 100%); }
.seawrap { position: absolute; left: 0; top: 0; width: 3840px; height: 100%; animation: drift 140s linear infinite; }
.seawrap svg { width: 3840px; height: 100%; } .seawrap path { fill: none; stroke-width: 1.2; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(-1920px); } }

/* the shell */
.shell { position: relative; z-index: 1; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: 28px 0 22px; background: color-mix(in srgb, var(--g) 94%, transparent); box-shadow: inset -1px 0 0 color-mix(in srgb, var(--ln) 70%, transparent); transition: background-color .5s; }
.brand { display: flex; align-items: center; gap: 14px; padding: 0 28px 28px; color: var(--tx); text-decoration: none; }
.brand .logo { width: 34px; height: 34px; flex: none; }
.brand .logo .core { transform-origin: 17px 17px; animation: spin 18s linear infinite; }
.navs { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow-y: auto; }
.nav { position: relative; display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 28px; color: var(--ts); text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; transition: color .2s, background-color .2s; }
.nav:hover { color: var(--tx); background: color-mix(in srgb, var(--sr) 25%, transparent); }
.nav[aria-current="page"] { color: var(--tx); background: color-mix(in srgb, var(--sel) 10%, transparent); }
.nav[aria-current="page"]::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; background: var(--sel); animation: grow .4s var(--ease); }
@keyframes grow { from { transform: scaleY(0); } to { transform: none; } }
.nav .count { margin-left: auto; font-size: 13px; color: var(--dg); letter-spacing: .04em; }
.rail-foot { display: flex; flex-direction: column; gap: 14px; padding: 16px 28px 0; box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ln) 70%, transparent); }
.looks-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.sets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.set { display: flex; padding: 5px; border: 0; background: transparent; cursor: pointer; min-width: 0; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ln) 70%, transparent); transition: box-shadow .15s, transform .2s; }
.set:hover { box-shadow: inset 0 0 0 1px var(--ts); transform: translateY(-2px); }
.set[aria-pressed="true"] { background: var(--s); box-shadow: inset 0 0 0 2px var(--sel); }
.set:focus-visible { outline-offset: -2px; }
.swatch { display: flex; gap: 2px; flex: 1; } .swatch i { flex: 1; height: 14px; display: block; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.me { display: flex; align-items: center; gap: 12px; }
.avatar { width: 36px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; background: var(--sr); color: var(--tx); font-size: 14px; }
.main { min-width: 0; padding: 0 var(--gut) 40px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; min-height: 96px; padding: 18px 0; }
.top .t { flex: 1 1 320px; min-width: 0; }
.days { display: flex; align-items: baseline; gap: 8px; }
.days b { font-size: 28px; font-weight: 400; }

/* panels, buttons, status */
.pn { position: relative; padding: 28px; min-width: 0; background: color-mix(in srgb, var(--g) 93%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ln) 80%, transparent); transition: background-color .5s; }
.pn.raised { background: color-mix(in srgb, var(--s) 70%, var(--g)); }
.pn > .head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 18px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; height: 52px; padding: 0 24px; white-space: nowrap; border: 0; cursor: pointer; text-decoration: none; font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: .14em; text-transform: uppercase; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: transform .12s cubic-bezier(.5, 1, .89, 1), filter .2s, box-shadow .2s, background-color .2s; }
.btn.s { height: 42px; padding: 0 16px; font-size: 13px; gap: 10px; }
.btn:active { transform: scale(.97); }
.cta { background: var(--ctaf); color: var(--on); }
.commit { background: var(--cm); color: var(--oncm); }
.def { background: transparent; color: var(--tx); box-shadow: inset 0 0 0 1px var(--ts); }
.def:hover { box-shadow: inset 0 0 0 1px var(--tx); background: color-mix(in srgb, var(--sr) 25%, transparent); }
.btn.off, .btn[disabled] { opacity: .4; pointer-events: none; }
.glow { animation: glow 3.6s ease-in-out infinite; }
@keyframes glow { 0%, 100% { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--cta) 30%, transparent)); } 50% { filter: drop-shadow(0 0 18px color-mix(in srgb, var(--cta) 60%, transparent)); } }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border: 0; cursor: pointer; background: transparent; color: var(--ts); font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; box-shadow: inset 0 0 0 1px var(--ln); clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); transition: color .2s, box-shadow .2s, background-color .2s; }
.chip:hover { color: var(--tx); }
.chip[aria-pressed="true"] { color: var(--tx); box-shadow: inset 0 0 0 1px var(--sel); background: color-mix(in srgb, var(--sel) 12%, transparent); }
.st { display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; border: 1px solid; white-space: nowrap; }
.st i { width: 8px; height: 8px; display: inline-block; background: currentColor; }
.st.go { color: var(--cta); } .st.nogo { color: var(--dg); } .st.risk { color: var(--dg); border-style: dashed; } .st.risk i { background: linear-gradient(135deg, currentColor 50%, transparent 50%); }
.st.run { color: var(--sel); } .st.run i { animation: blink 1.2s steps(2) infinite; } .st.none { color: var(--to); }
@keyframes blink { 50% { opacity: .2; } }
.pick { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; color: inherit; font: inherit; text-align: left; }
.lift { transition: transform .25s cubic-bezier(.33, 1, .68, 1), box-shadow .25s, background-color .25s; }
.lift:hover { transform: translateY(-3px); }
.hatch { background-image: repeating-linear-gradient(135deg, transparent 0 11px, color-mix(in srgb, var(--ln) 45%, transparent) 11px 12px); }
.empty { padding: 18px; color: var(--ts); font-size: 15px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ln) 70%, transparent); }

/* motion */
.page.in .rise { animation: rise .7s var(--ease) both; }
.d1 { animation-delay: .05s !important; } .d2 { animation-delay: .12s !important; } .d3 { animation-delay: .19s !important; } .d4 { animation-delay: .26s !important; } .d5 { animation-delay: .33s !important; } .d6 { animation-delay: .40s !important; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.fade { animation: fade .5s ease both; } @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.draw { stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: draw 2.6s .3s cubic-bezier(.4, 0, .2, 1) forwards; } @keyframes draw { to { stroke-dashoffset: 0; } }
.spin { animation: spin 1.1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
.pulse { animation: pulse 2.8s ease-out infinite; } @keyframes pulse { 0% { transform: rotate(45deg) scale(.6); opacity: .9; } 100% { transform: rotate(45deg) scale(2.2); opacity: 0; } }
.slidein { animation: slidein .45s var(--ease) both; } @keyframes slidein { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
.flow i { position: absolute; top: 50%; width: 6px; height: 6px; margin-top: -3px; background: var(--sel); transform: rotate(45deg); animation: flow 2.4s linear infinite; }
.flow i:nth-child(2) { animation-delay: .8s; } .flow i:nth-child(3) { animation-delay: 1.6s; }
@keyframes flow { from { left: 0; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { left: calc(100% - 6px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition: none !important; } .draw { stroke-dashoffset: 0; } }

/* layout grids */
.g { display: grid; gap: 24px; }
.row2 { grid-template-columns: minmax(0, 1fr); } .row3 { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .row2 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); } .row3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); } .row2r { grid-template-columns: minmax(0, 3fr) minmax(0, 1.15fr); } }

/* Mission */
.hero { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .hero { grid-template-columns: minmax(300px, 480px) minmax(0, 1fr); } }
.track { position: relative; width: 100%; aspect-ratio: 1040 / 260; min-height: 200px; }
.track svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.stop { position: absolute; width: 150px; margin-left: -75px; text-align: center; }
.stop .dia { display: block; position: relative; width: 22px; height: 22px; margin: -11px auto 10px; }
.stop .dia span { position: absolute; inset: 3px; transform: rotate(45deg); transition: background-color .3s, box-shadow .3s; }
.stop .dia .halo { inset: 0; box-shadow: 0 0 0 2px var(--sel); }
.stop .nm { display: block; font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--ts); transition: color .2s; }
.stop .sub { display: block; font-size: 13px; color: var(--to); }
.stop[aria-pressed="true"] .nm, .stop.here .nm { color: var(--tx); }
.stop[aria-pressed="true"] .dia span:last-child { box-shadow: 0 0 0 2px var(--sel), 0 0 18px color-mix(in srgb, var(--sel) 60%, transparent); }
.gatemark { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; transform: rotate(45deg); background: var(--g); box-shadow: inset 0 0 0 1.5px var(--ts); }
.gatelab { position: absolute; transform: translate(-50%, -30px); font-size: 13px; }
.meter { position: relative; height: 10px; background: color-mix(in srgb, var(--ln) 50%, transparent); overflow: hidden; }
.meter.hatch { background-color: transparent; box-shadow: inset 0 0 0 1px var(--ln); }
.plats { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.plat { padding: 16px 16px 18px; background: color-mix(in srgb, var(--gd) 60%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ln) 70%, transparent); display: grid; gap: 8px; text-align: left; width: 100%; }
.plat:hover { box-shadow: inset 0 0 0 1px var(--sel); }
.plat.s-go { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sel) 70%, transparent); background: color-mix(in srgb, var(--sel) 6%, var(--gd)); }
.plat .hd { display: flex; align-items: center; gap: 10px; } .plat .hd .cap { flex: 1; font-size: 14px; }
.checks { list-style: none; margin: 0; padding: 0; }
.checks li { display: grid; grid-template-columns: 30px 44px minmax(0, 1fr); gap: 12px; align-items: center; min-height: 50px; box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--ln) 60%, transparent); }
.box { width: 24px; height: 24px; border: 0; padding: 0; cursor: pointer; background: transparent; box-shadow: inset 0 0 0 1.5px var(--ts); color: var(--cta); display: inline-flex; align-items: center; justify-content: center; }
.box[aria-checked="true"] { box-shadow: inset 0 0 0 1.5px var(--cta); }
.done .what { text-decoration: line-through; color: var(--to); }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.feed li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 40px; }
.feed li .i { color: var(--ts); } .feed li.bad .i, .feed li.bad .w { color: var(--dg); }

/* Pipeline */
.lanes { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .lanes { grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr) 34px minmax(0, 1fr) 34px minmax(0, 1fr); gap: 0; } }
.lane { display: flex; flex-direction: column; gap: 14px; min-height: 560px; }
.lane .top2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hulls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hulls.six { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.hullc { display: grid; gap: 4px; }
.hullc .im { aspect-ratio: 3 / 1.6; background: color-mix(in srgb, var(--gd) 70%, transparent); display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ln) 60%, transparent); }
.hullc img { width: 118%; height: auto; object-fit: contain; transition: transform .4s var(--ease); }
.hullc:hover img { transform: scale(1.08) translateX(4px); }
.bul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.bul li { display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
.bul li::before { content: ''; width: 6px; height: 6px; flex: none; transform: translateY(-2px) rotate(45deg); background: var(--ts); }
.conn { display: none; position: relative; }
@media (min-width: 1100px) { .conn { display: block; } }
.conn .ar { position: absolute; left: 50%; top: 178px; width: 34px; height: 54px; margin-left: -17px; display: flex; align-items: center; justify-content: center; color: var(--cm); background: color-mix(in srgb, var(--g) 90%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ln) 70%, transparent); clip-path: polygon(50% 0, 100% 15%, 100% 85%, 50% 100%, 0 85%, 0 15%); }
.conn .flow { position: absolute; left: 0; right: 0; top: 100px; height: 6px; }
.sched { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .sched { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* Builds */
.mx { display: grid; grid-template-columns: 170px repeat(3, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
.mx .colh { padding: 4px 0; } .mx .rowh { display: flex; align-items: center; gap: 12px; }
.cell { padding: 14px 16px; min-height: 100px; display: grid; gap: 6px; align-content: start; background: color-mix(in srgb, var(--s) 45%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ln) 60%, transparent); width: 100%; text-align: left; }
.cell .l1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cell[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--sel), 0 0 30px color-mix(in srgb, var(--sel) 18%, transparent); background: color-mix(in srgb, var(--sel) 9%, var(--g)); }
.cell.none { background: transparent; }
.kv3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; }
.steps li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 14px; align-items: center; min-height: 44px; }
.sq { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1.5px var(--ln); color: var(--to); }
.sq.ok { color: var(--cta); box-shadow: inset 0 0 0 1.5px var(--cta); } .sq.bad { color: var(--dg); box-shadow: inset 0 0 0 1.5px var(--dg); } .sq.run { color: var(--sel); box-shadow: inset 0 0 0 1.5px var(--sel); }

/* Release */
.stepper { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 0 28px; }
.stepper button { display: flex; align-items: center; gap: 14px; padding: 26px 0 24px; position: relative; text-align: left; }
.stepper button::after { content: ''; position: absolute; left: 0; right: 10%; bottom: 0; height: 2px; background: var(--sel); transform: scaleX(0); transform-origin: left; transition: transform .4s var(--ease); }
.stepper button[aria-current="step"]::after { transform: none; }
.stepper .n { width: 34px; height: 34px; flex: none; display: inline-flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px var(--ts); font-size: 16px; }
.stepper button[aria-current="step"] .n { box-shadow: inset 0 0 0 2px var(--sel); color: var(--sel); }
.stepper .ok .n { box-shadow: inset 0 0 0 2px var(--cta); color: var(--cta); } .stepper .bad .n { box-shadow: inset 0 0 0 2px var(--dg); color: var(--dg); }
.stepper .t1 { display: block; font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; }

      const prompt = `You help the Cosmic Shore team read their launch console. Answer the question using ONLY the JSON below (pipeline status, the launch checklist, the runbook and the release draft). Say plainly when the data does not answer it. Be brief; name the checklist rank (#n) and who decides. Never invent numbers or dates.\n\nJSON:\n${JSON.stringify(ctx)}\n\nQuestion: ${q}`;
      try { const r = await sample(prompt, { signal: ctl.signal, onText: ({ text }) => { out.textContent = text; $('#askstate').textContent = ''; } }); out.textContent = r.text; $('#askstate').textContent = ''; }
      catch (e) { $('#askstate').textContent = e && e.code === 'rate_limited' ? 'Too many questions at once. Wait a minute.' : e && e.code === 'cancelled' ? '' : 'No answer came back.'; if (e && e.text) out.textContent = e.text; }
    });
  })();
})();
</script>
</body>
</html>
