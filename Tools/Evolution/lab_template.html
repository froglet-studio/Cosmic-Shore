<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const Evo = window.Evo;

  // ================= LAB meta + the shipped numbers =================
  // A READER of the shipped numbers (SHIPPED_META carries each one's source). build_lab.py re-reads the real assets
  // at bake time; any value that no longer matches the asset is listed in SHIPPED_DRIFT and flagged on screen.
  const LAB = { name: 'Darwin Lab', branch: '__BRANCH__', round: 1, built: '__BUILD_DATE__', doc: 'Docs/EVOLUTION.md' };
  const SHIPPED_META = /*__SHIPPED_JSON__*/ {};
  const SHIPPED_DRIFT = /*__SHIPPED_DRIFT__*/ [];
  const RESULTS = /*__RESULTS_JSON__*/ {};
  const GOLDEN = /*__GOLDEN_JSON__*/ {};
  const SHIPPED = {};
  for (const k of Object.keys(SHIPPED_META)) { const v = SHIPPED_META[k].value; SHIPPED[k] = typeof v === 'boolean' ? (v ? 1 : 0) : v; }
  // lab-only switches (no game field): the selection-off control, the clock
  SHIPPED.InertPhenotype = 0;   // lab: selection OFF (genomes mutate and inherit, express nothing)
  SHIPPED.Seeder = 1;           // lab: the periodic top-up to the floor (the spawner's seed behaviour, on in the game)
  SHIPPED_META.PopulationScale = SHIPPED_META.PopulationScale || { value: 1, source: 'SpawnProfileSO.FaunaPopulationScale (Blob Cell Spawn Profile: unset = 1)' };
  SHIPPED_META.PredatorScale = SHIPPED_META.PredatorScale || { value: 1, source: 'SpawnProfileSO.FaunaPopulationScale, applied to the predator alone (lab split)' };
  SHIPPED.PopulationScale = 1; SHIPPED.PredatorScale = 1;

  // ================= SPEC: one row per slider =================
  const SPEC = [
    ['Biome', 'PopulationScale', 1, 60, 1, 'Herbivore population ×', 'SpawnProfileSO.FaunaPopulationScale: the cap and the seed floor times this. The Blob cell ships 1 (cap 6); the evidence runs use 20 and 50 so selection can beat drift.'],
    ['Biome', 'PredatorScale', 0, 20, 1, 'Predator population ×', 'The same lever on the shark. 0 = no predators (no turnover but famine).'],
    ['Biome', 'FoodCap', 50, 3000, 10, 'Food ceiling (prisms)', 'FloraSpawnVolumeCeiling / 16: the most grazeable mass the cell holds. Regrowth slows as it fills.'],
    ['Biome', 'FloraGrowth', 0, 100, 1, 'Flora regrowth (prisms/s)', 'Model assumption (Tools/ecosim): how fast the flora add mass below the ceiling.'],
    ['Biome', 'GrazeRate', 0.05, 5, 0.05, 'Graze rate at full food (/s)', 'Model assumption (Tools/ecosim): feeds per second for the authored creature on a full cell.'],
    ['Biome', 'HalfSaturation', 10, 1000, 10, 'Half-saturation (prisms)', 'Food level at which grazing runs at half speed. Lower = feeding stays easy as the cell empties.'],
    ['Biome', 'SpawnWave', 1, 60, 1, 'Seeder wave (s)', 'BaseFaunaSpawnTime: how often the spawner tops a species back up to its floor.'],
    ['Biome', 'Seeder', 0, 1, 1, 'Seeder on', '1 = the spawner re-seeds founders below the floor (immigration of the authored species). 0 = a closed population.'],
    ['Biome', 'ConservedStomach', 0, 1, 1, 'Conserved stomach', 'CellConfigDataSO.ConservedFaunaStomach: 1 = a feed adds only its volume; 0 (shipped) = any feed refills the stomach.'],
    ['Species', 'HerbFeedsPerOffspring', 1, 100, 1, 'Herbivore feeds per birth', 'FaunaConfigurationSO.FeedsPerOffspring. The Fecundity locus divides it.'],
    ['Species', 'HerbCooldown', 0, 120, 1, 'Herbivore birth cooldown (s)', 'ReproductionCooldownSeconds.'],
    ['Species', 'HerbStarvation', 5, 600, 5, 'Herbivore starvation (s)', 'starvationSeconds: upkeep burns one meal in this long. The Tempo and Reach loci scale it.'],
    ['Species', 'HerbCap', 1, 400, 1, 'Herbivore cap (authored)', 'MaxLivePopulation before the population lever. A performance backstop, not the economy.'],
    ['Species', 'HerbFloor', 1, 200, 1, 'Herbivore seed floor (authored)', 'PopulationSize: the seeder only tops up to this.'],
    ['Species', 'PredFeedsPerOffspring', 1, 50, 1, 'Predator kills per birth', 'FeedsPerOffspring on the shark.'],
    ['Species', 'PredCooldown', 0, 300, 5, 'Predator birth cooldown (s)', 'ReproductionCooldownSeconds on the shark.'],
    ['Species', 'PredStarvation', 5, 600, 5, 'Predator starvation (s)', 'starvationSeconds on the shark prefab.'],
    ['Species', 'PredCap', 0, 100, 1, 'Predator cap (authored)', 'MaxLivePopulation on the shark.'],
    ['Species', 'PredFloor', 0, 50, 1, 'Predator seed floor (authored)', 'PopulationSize on the shark.'],
    ['Species', 'HuntInterval', 1, 120, 1, 'Hunt interval (s)', 'LightFaunaDataSO.huntIntervalSeconds: one kill attempt per predator per interval.'],
    ['Species', 'PredationImmunity', 0, 60, 1, 'Newborn immunity (s)', 'Fauna.predationImmunitySeconds.'],
    ['Species', 'StomachCapacity', 1, 160, 1, 'Stomach capacity (volume)', 'One nominal prism (16). Only matters with the conserved stomach.'],
    ['Mutation', 'MutationRate', 0, 1, 0.05, 'Mutation rate', 'EvolutionSettings.MutationRate: chance per locus per birth that the gene steps.'],
    ['Mutation', 'MutationSigma', 0, 0.5, 0.01, 'Mutation sigma', 'EvolutionSettings.MutationSigma: size of one step in gene units (a gene spans -1..+1). 0 = mutation OFF.'],
    ['Mutation', 'FounderSpread', 0, 0.5, 0.01, 'Founder spread', 'EvolutionSettings.FounderSpread: standing variation among seeded founders. 0 = every founder is the authored species.'],
    ['Expression', 'TempoPaceRange', 1, 3, 0.05, 'Tempo → pace ×', 'Speed multiplier at gene +1 (÷ at -1).'],
    ['Expression', 'TempoUpkeepRange', 1, 3, 0.05, 'Tempo → upkeep ×', 'The COST of pace: stomach drain at gene +1. Authored above the pace gain.'],
    ['Expression', 'ReachRadiusRange', 1, 3, 0.05, 'Reach → radius ×', 'Graze radius at gene +1 (encounter rate goes as its square here).'],
    ['Expression', 'ReachUpkeepRange', 1, 3, 0.05, 'Reach → upkeep ×', 'The cost of sensing further.'],
    ['Expression', 'FecundityRange', 1, 4, 0.05, 'Fecundity → births ×', 'Feeds per birth divided by this at gene +1.'],
    ['Expression', 'FecundityProvisionRange', 1, 4, 0.05, 'Fecundity → child stomach ÷', 'An r-lean parent births hungrier children (one-sided: a K-lean keeps them full).'],
    ['Expression', 'CohesionRange', 1, 3, 0.05, 'Cohesion → flock radius ×', 'Has NO mechanism in this arena: the locus drifts, by design. It is the neutral marker.'],
    ['Controls', 'InertPhenotype', 0, 1, 1, 'Selection OFF', 'The abiotic baseline: genomes still inherit and mutate but express nothing. Whatever moves here is drift.'],
  ];

  const LS = 'lab:' + LAB.name + ':';
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private window */ } };
  const PRESETS = [
    { name: 'Blob ×20', tip: 'the Blob cell as authored, 20× the herbivores and 5× the sharks (the evidence baseline)', v: { PopulationScale: 20, PredatorScale: 5 } },
    { name: 'Famine', tip: '50× herbivores on the shipped food: starvation bounds the population, not the cap', v: { PopulationScale: 50, PredatorScale: 5 } },
    { name: 'Sparse', tip: 'a third of the food, regrowing at 8 prisms/s', v: { PopulationScale: 50, PredatorScale: 5, FoodCap: 250, FloraGrowth: 8 } },
    { name: 'Rich', tip: 'twice the food at 40 prisms/s', v: { PopulationScale: 20, PredatorScale: 5, FoodCap: 1500, FloraGrowth: 40 } },
    { name: 'No predators', tip: 'no sharks: famine is the only turnover', v: { PopulationScale: 20, PredatorScale: 0 } },
    { name: 'Closed', tip: 'famine with the seeder off: no founder immigration', v: { PopulationScale: 50, PredatorScale: 5, Seeder: 0 } },
    { name: 'Mutation off', tip: 'CONTROL: heredity without variation', v: { PopulationScale: 20, PredatorScale: 5, MutationSigma: 0, MutationRate: 0 } },
    { name: 'Selection off', tip: 'CONTROL: the abiotic baseline', v: { PopulationScale: 20, PredatorScale: 5, InertPhenotype: 1 } },
  ];
  const saved = lsGet(LS + 'P', null);
  const P = Object.assign({}, SHIPPED, saved || PRESETS[0].v);
  for (const k of Object.keys(P)) if (!(k in SHIPPED)) delete P[k];

  // ================= THE MODEL (Tools/Evolution/sim.js, the C# arena's exact port) =================
  const EVO_KEYS = ['MutationRate', 'MutationSigma', 'FounderSpread', 'TempoPaceRange', 'TempoUpkeepRange', 'ReachRadiusRange', 'ReachUpkeepRange', 'FecundityRange', 'FecundityProvisionRange', 'CohesionRange'];
  function arenaParams(src) {
    const over = {}, evo = {};
    for (const k of Object.keys(src)) {
      if (EVO_KEYS.includes(k)) evo[k] = src[k];
      else if (k === 'Seeder' || k === 'ConservedStomach' || k === 'InertPhenotype') over[k] = !!src[k];
      else over[k] = src[k];
    }
    over.Evolution = evo;
    return Evo.params(over);
  }
  let arena = null, seed = 1, acc = 0, speed = 60, hist = [], lastSample = -1e9, first = null;
  const SAMPLE_EVERY = 10, HIST_MAX = 1800;
  function reset(s) {
    if (s != null) seed = s >>> 0;
    arena = new Evo.Arena(arenaParams(P), seed);
    acc = 0; hist = []; lastSample = -1e9; first = null;
    sample();
  }
  function sample() {
    const row = arena.census();
    hist.push(row); if (hist.length > HIST_MAX) hist.splice(0, hist.length - HIST_MAX);
    if (!first && row[Evo.ROW.herb] > 0) first = row.slice();
    lastSample = arena.t;
  }
  // Advances the model by dt seconds of wall time at the current speed; never draws, never reads a device.
  function simStep(dt) {
    acc += dt * speed;
    const P0 = arena.P;
    let guard = 0;
    while (acc >= P0.Dt && guard++ < 4000) {
      arena.stepOnce(); acc -= P0.Dt;
      if (arena.t - lastSample >= SAMPLE_EVERY) sample();
    }
  }
  function shiftOf(row) {
    const out = [0, 0, 0, 0];
    if (!first || !row || row[Evo.ROW.herb] === 0) return out;
    for (let l = 0; l < 4; l++) out[l] = row[Evo.ROW.mean + l] - first[Evo.ROW.mean + l];
    return out;
  }
  // The living population's mean genes right now (no counters touched - census() resets them).
  function liveMeans() {
    const gs = arena.genomes(), m = [0, 0, 0, 0];
    if (!gs.length) return m;
    for (const g of gs) for (let l = 0; l < 4; l++) m[l] += g[l];
    return m.map(v => v / gs.length);
  }
  // One number per column the lab decides on: the drift of each trait since the first census, and the population.
  function score() {
    const m = liveMeans(), s = [0, 0, 0, 0];
    if (first && arena.h.length) for (let l = 0; l < 4; l++) s[l] = m[l] - first[Evo.ROW.mean + l];
    return { tempo: +s[0].toFixed(3), reach: +s[1].toFixed(3), fecundity: +s[2].toFixed(3), cohesion: +s[3].toFixed(3), pop: arena.h.length, t: +arena.t.toFixed(1) };
  }

  // ================= headless batch: the scorecard =================
  // Runs fresh arenas (never the live one) across seeds for the current settings and its two controls.
  const VARIANTS = [
    { name: 'Your settings', v: {} },
    { name: 'Mutation off', v: { MutationSigma: 0, MutationRate: 0 } },
    { name: 'Selection off', v: { InertPhenotype: 1 } },
  ];
  function runOne(settings, s, hours) {
    const a = new Evo.Arena(arenaParams(settings), s);
    const dt = a.P.Dt, steps = Math.round(hours * 3600 / dt), every = Math.round(60 / dt);
    const rows = [];
    for (let i = 0; i < steps; i += every) { a.advance(every); rows.push(a.census()); }
    let f = rows.find(r => r[Evo.ROW.herb] > 0) || rows[0];
    const from = Math.floor(rows.length * 3 / 4);
    const fin = [0, 0, 0, 0]; let n = 0, pop = 0, starved = 0, eaten = 0;
    for (let i = from; i < rows.length; i++) { const r = rows[i]; if (r[Evo.ROW.herb] > 0) { n++; for (let l = 0; l < 4; l++) fin[l] += r[Evo.ROW.mean + l]; } pop += r[Evo.ROW.herb]; }
    for (const r of rows) { starved += r[Evo.ROW.starved]; eaten += r[Evo.ROW.eaten]; }
    const shift = fin.map((v, l) => n > 0 ? v / n - f[Evo.ROW.mean + l] : 0);
    return { shift, pop: pop / (rows.length - from), starved, eaten, gen: rows[rows.length - 1][Evo.ROW.maxGen] };
  }
  function runBatch(opts) {
    opts = opts || {};
    const seeds = opts.seeds || [1, 2, 3], hours = opts.hours || 1, rows = [];
    for (const va of VARIANTS) {
      const settings = Object.assign({}, P, va.v);
      const acc4 = [0, 0, 0, 0], sq4 = [0, 0, 0, 0]; let pop = 0, gen = 0;
      for (const s of seeds) {
        const r = runOne(settings, s, hours);
        for (let l = 0; l < 4; l++) { acc4[l] += r.shift[l]; sq4[l] += r.shift[l] * r.shift[l]; }
        pop += r.pop; gen = Math.max(gen, r.gen);
      }
      const n = seeds.length;
      const mean = acc4.map(v => +(v / n).toFixed(3));
      const sd = acc4.map((v, l) => +(n > 1 ? Math.sqrt(Math.max(0, (sq4[l] - v * v / n) / (n - 1))) : 0).toFixed(3));
      rows.push({ variant: va.name, tempo: mean[0], reach: mean[1], fecundity: mean[2], cohesion: mean[3], sd, pop: +(pop / n).toFixed(1), gen });
    }
    return rows;
  }

  // ================= platform =================
  function detectPlatform() {
    const host = window.__labHost || {};
    const ua = navigator.userAgent || '';
    const mobileUA = (navigator.userAgentData && navigator.userAgentData.mobile) || /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    const coarseOnly = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
    return { shell: host.shell || 'web', device: host.device || ((mobileUA || coarseOnly) ? 'phone' : 'pc') };
  }
  const PLATFORM = detectPlatform();
  $('platform').textContent = (PLATFORM.shell === 'web' ? 'Web' : PLATFORM.shell) + ' · ' + (PLATFORM.device === 'phone' ? 'Phone' : 'PC');

  // ================= the stage =================
  const canvas = $('stage'), ctx = canvas.getContext('2d');
  const C = { tempo: '#ff8a5c', reach: '#4fd6d3', fecundity: '#f4c242', cohesion: '#b48cff', herb: '#46d08a', pred: '#ff5c7a', food: '#e3c24f', ink: '#cfe3d8', dim: '#6b8278', grid: '#1a2b26', bg: '#060b0a' };
  function fmtT(t) { const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = Math.floor(t % 60); return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }
  function render() {
    const w = canvas.width, h = canvas.height, dpr = Math.min(2, devicePixelRatio || 1);

    const cols = document.createElement('div'); cols.className = 'cols';
    const a = document.createElement('div');
    a.innerHTML = '<p class="lead"><strong>Darwin Lab</strong> is where a designer decides a biome\'s evolution knobs by watching a population adapt - and watching it NOT adapt under the controls. Every slider on the Mutation and Expression tabs is a field of <span class="key">EvolutionSettings</span> on the cell\'s CellConfigDataSO; the Biome and Species tabs are the shipped assets the arena is built from.</p><p class="hint" id="aboutMeta"></p><p><b>What this lab does NOT model</b></p><ul class="plain"><li>Space. The arena is well mixed: "reach" is an encounter-rate multiplier, not a radius, and sharks pick prey uniformly rather than by distance.</li><li>Plants. The flora is one pool that regrows logistically; the game grows prisms on spindles that fauna graze in place.</li><li>Vessels. No trail mass, no Shepherd joust, no ability deaths - only starvation and predation select here.</li><li>Predator genomes. Sharks carry none in this round (Docs/EVOLUTION.md §8).</li><li>Cohesion. The locus has no mechanism in the arena, by design - it is the neutral marker every run carries.</li><li>Frame cost. Nothing here says what a population of 300 costs the GPU; Tools/ecosim does.</li><li>The shipped Blob cell caps its tadpoles at 6. The evidence runs lift that cap with the population lever; at 6 drift beats selection.</li></ul>';
    a.querySelector('#aboutMeta').textContent = LAB.name + ' · round ' + LAB.round + ' · built ' + LAB.built + ' · ' + LAB.branch + ' · write-up: ' + LAB.doc;
    const b = document.createElement('div');
    b.innerHTML = '<p><b>Where every shipped number comes from</b></p>';
    const t = document.createElement('table'); t.innerHTML = '<tr><th>key</th><th class="num">value</th><th>source</th></tr>';
    for (const k of Object.keys(SHIPPED_META)) { const tr = document.createElement('tr'); const drift = SHIPPED_DRIFT.find(d => d.key === k); tr.innerHTML = '<td class="key"></td><td class="num"></td><td></td>'; tr.children[0].textContent = k; tr.children[1].textContent = String(SHIPPED_META[k].value); tr.children[2].textContent = SHIPPED_META[k].source + (drift ? ' - ASSET MOVED: now ' + drift.asset : ''); if (drift) tr.children[2].className = 'status-warn'; t.appendChild(tr); }
    b.appendChild(t);
    cols.appendChild(a); cols.appendChild(b); box.appendChild(cols);
    return box;
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Scorecard', build: scorecardPanel }, { name: 'Evidence', build: evidencePanel }, { name: 'Parity', build: parityPanel }, { name: 'Decisions', build: logPanel }, { name: 'About', build: aboutPanel }], LS + 'bottom');

  $('meta').textContent = 'round ' + LAB.round + ' · the HyperSea\'s heritable genome · ' + (SHIPPED_DRIFT.length ? SHIPPED_DRIFT.length + ' asset(s) moved since the bake' : 'numbers match the assets');
  if (SHIPPED_DRIFT.length) $('meta').className = 'meta status-warn';
  let paused = false;
  const SPEEDS = [10, 60, 300, 1000];
  $('speed').onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; $('speed').textContent = speed + '×'; };
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); lsSet(LS + 'P', {}); for (const k in outputs) outputs[k].inp.value = P[k]; reset(); refreshDiff(); };

  // ================= sizing + loop (with a manual clock for recorders) =================
  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) { resize(); if (!paused) simStep(dt); render(); }
    requestAnimationFrame(frame);
  }
  reset(); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  // ================= the test surface =================
  window.__lab = {
    LAB, SHIPPED, SHIPPED_META, SHIPPED_DRIFT, SPEC, P, PLATFORM, VARIANTS, PRESETS, RESULTS, GOLDEN, Evo,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { n = n || 1; for (let i = 0; i < n; i++) simStep(dt); resize(); render(); },
    reset, score, runBatch, setParam, record, applyPreset,
    state: () => ({ t: arena.t, seed, herbivores: arena.h.length, predators: arena.pr.length, food: arena.food, maxGen: arena.maxGen }),
  };
})();
</script>
