<script>
// Darwin Lab - the evolution model, ported EXACTLY from the shipped C# (Docs/EVOLUTION.md §7).
//
//   core:  Assets/_Scripts/Controller/Environment/FloraAndFauna/Evolution/{LifeformGenome,GenomeExpression,
//          GenomeMutation,EvolutionSettings}.cs
//   arena: Tools/Build/evolution_harness/EvolutionArena.cs
//
// "Exactly" is held by Tools/Evolution/gate_parity.cjs against Tools/Evolution/results/golden.json: the same seed
// must give the same trajectory, draw for draw, bit for bit (===). The rules that make that possible:
//   - the C# core stores GENES and the PHENOTYPE as float32 and computes in double: every place C# rounds to float,
//     this file calls Math.fround; every C# float SETTING is fround'ed on the way in (a float 0.08 is not 0.08);
//   - no transcendental function anywhere in the step (the multiplier map is rational; the normal is Irwin-Hall);
//   - uint32 arithmetic through Math.imul and >>> 0; one draw order; stable compaction.
// Any change to the C# must land here too, and the gate says when it has not.
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Evo = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  const f32 = Math.fround;
  const LOCI = ['tempo', 'reach', 'fecundity', 'cohesion'];
  const LOCUS_COUNT = 4;

  // ------------------------------------------------------------------------------------ GenomeRng (xoshiro128**)
  function splitmix(st) {
    st.x = (st.x + 0x9E3779B9) >>> 0;
    let z = st.x;
    z = Math.imul(z ^ (z >>> 16), 0x85EBCA6B) >>> 0;
    z = Math.imul(z ^ (z >>> 13), 0xC2B2AE35) >>> 0;
    return (z ^ (z >>> 16)) >>> 0;
  }
  function rotl(x, k) { return ((x << k) | (x >>> (32 - k))) >>> 0; }

  class GenomeRng {
    constructor(seed) { this.draws = 0; this.reseed(seed); }
    reseed(seed) {
      const st = { x: seed >>> 0 };
      this.s0 = splitmix(st); this.s1 = splitmix(st); this.s2 = splitmix(st); this.s3 = splitmix(st);
      if (((this.s0 | this.s1 | this.s2 | this.s3) >>> 0) === 0) this.s0 = 0x9E3779B9;
    }
    nextU32() {
      const result = Math.imul(rotl(Math.imul(this.s1, 5) >>> 0, 7), 9) >>> 0;
      const t = (this.s1 << 9) >>> 0;
      this.s2 = (this.s2 ^ this.s0) >>> 0;
      this.s3 = (this.s3 ^ this.s1) >>> 0;
      this.s1 = (this.s1 ^ this.s2) >>> 0;
      this.s0 = (this.s0 ^ this.s3) >>> 0;
      this.s2 = (this.s2 ^ t) >>> 0;
      this.s3 = rotl(this.s3, 11);
      return result;
    }
    nextUnit() { this.draws++; return (this.nextU32() >>> 8) * (1.0 / 16777216.0); }
  }

  // ------------------------------------------------------------------------------------ EvolutionSettings
  // Every numeric field is a C# float: stored fround'ed.
  function settings(over) {
    const s = {
      Enabled: true,
      MutationRate: 1, MutationSigma: 0.08, FounderSpread: 0.1,
      TempoPaceRange: 1.5, TempoUpkeepRange: 1.84, ReachRadiusRange: 1.5, ReachUpkeepRange: 1.36,
      FecundityRange: 2, FecundityProvisionRange: 2, CohesionRange: 1.6,
      SnapshotIntervalSeconds: 30, MaxSnapshotsPerSpecies: 2048,
    };
    if (over) for (const k of Object.keys(over)) if (k in s) s[k] = over[k];
    for (const k of Object.keys(s)) if (typeof s[k] === 'number') s[k] = f32(s[k]);
    return s;
  }
  function withoutMutation(s) { const c = Object.assign({}, s); c.MutationRate = 0; c.MutationSigma = 0; return c; }
  function safeRange(r) { return (r !== r || r < 1) ? 1 : r; }   // NaN or below 1 reads as 1

  // ------------------------------------------------------------------------------------ LifeformGenome
  function clampGene(g) { if (g !== g) return 0; return g < -1 ? -1 : g > 1 ? 1 : g; }
  function genome(t, r, f, c) { return [f32(clampGene(f32(t))), f32(clampGene(f32(r))), f32(clampGene(f32(f))), f32(clampGene(f32(c)))]; }
  const FOUNDER = genome(0, 0, 0, 0);
  function isFounder(g) { return g[0] === 0 && g[1] === 0 && g[2] === 0 && g[3] === 0; }
  function quantize(g) { let q = Math.round(clampGene(g) * 127); if (q > 127) q = 127; if (q < -127) q = -127; return q; }
  function dequantize(q) { return f32(clampGene(f32(q / 127))); }
  function pack(g) {
    const b = l => (quantize(g[l]) & 0xFF) >>> 0;
    return (b(0) | (b(1) << 8) | (b(2) << 16) | (b(3) << 24)) >>> 0;
  }
  function unpack(u) {
    const sb = x => (x & 0x80) ? x - 256 : x;
    return [dequantize(sb(u & 0xFF)), dequantize(sb((u >>> 8) & 0xFF)), dequantize(sb((u >>> 16) & 0xFF)), dequantize(sb((u >>> 24) & 0xFF))];
  }
  function distance(a, b) { let s = 0; for (let l = 0; l < 4; l++) { const d = a[l] - b[l]; s += d * d; } return f32(Math.sqrt(s)); }

  // ------------------------------------------------------------------------------------ GenomeExpression
  function multiplier(gene, range) {
    const r = safeRange(range);           // float, widened
    const g = clampGene(gene);            // float, widened
    const k = r - 1.0;
    const f = g >= 0.0 ? 1.0 + k * g : 1.0 / (1.0 + k * (-g));
    return f32(f);
  }
  const NEUTRAL = { pace: 1, reach: 1, upkeep: 1, fecundity: 1, provision: 1, cohesion: 1 };
  const MIN_PROVISION = f32(0.1);
  function express(g, s) {
    if (!s || !s.Enabled) return NEUTRAL;
    const pace = multiplier(g[0], s.TempoPaceRange);
    const reach = multiplier(g[1], s.ReachRadiusRange);
    const upkeep = f32(multiplier(g[0], s.TempoUpkeepRange) * multiplier(g[1], s.ReachUpkeepRange));
    const fecundity = multiplier(g[2], s.FecundityRange);
    let provision = g[2] > 0 ? f32(1.0 / multiplier(g[2], s.FecundityProvisionRange)) : 1;
    if (provision < MIN_PROVISION) provision = MIN_PROVISION;
    if (provision > 1) provision = 1;
    const cohesion = multiplier(g[3], s.CohesionRange);
    return { pace, reach, upkeep, fecundity, provision, cohesion };
  }
  function roundAwayFromZero(x) { return x >= 0 ? Math.floor(x + 0.5) : -Math.floor(-x + 0.5); }
  function feedsPerOffspring(authored, p) {
    if (authored <= 0) return authored;
    const scaled = roundAwayFromZero(authored / Math.max(1e-6, p.fecundity));
    return scaled < 1 ? 1 : scaled;
  }
  function starvationSeconds(authored, p) {
    if (!(authored > 0)) return authored;
    return f32(authored / Math.max(1e-6, p.upkeep));
  }

  // ------------------------------------------------------------------------------------ GenomeMutation
  function normal(rng) { let sum = 0.0; for (let i = 0; i < 12; i++) sum += rng.nextUnit(); return sum - 6.0; }
  function mutate(parent, s, rng) {
    if (!s || !s.Enabled || !rng) return parent;
    const rate = s.MutationRate, sigma = s.MutationSigma;
    if (!(rate > 0.0) || !(sigma > 0.0)) return parent;
    const genes = parent.slice();
    for (let i = 0; i < LOCUS_COUNT; i++) {
      if (rate < 1.0 && rng.nextUnit() >= rate) continue;
      const g = genes[i] + sigma * normal(rng);
      genes[i] = clampGene(f32(g));
    }
    return genome(genes[0], genes[1], genes[2], genes[3]);
  }
  function founder(s, rng) {
    if (!s || !s.Enabled || !rng) return FOUNDER;
    const spread = s.FounderSpread;
    if (!(spread > 0.0)) return FOUNDER;
    const genes = [0, 0, 0, 0];
    for (let i = 0; i < LOCUS_COUNT; i++) genes[i] = clampGene(f32(spread * normal(rng)));
    return genome(genes[0], genes[1], genes[2], genes[3]);
  }

  // ------------------------------------------------------------------------------------ ArenaParams
  function params(over) {
    const p = {
      HerbFeedsPerOffspring: 20, HerbCooldown: 10, HerbCap: 6, HerbFloor: 4, HerbStarvation: 90,
      PredFeedsPerOffspring: 6, PredCooldown: 30, PredCap: 2, PredFloor: 1, PredStarvation: 45,
      HuntInterval: 20, PredationImmunity: 6, StomachCapacity: 16, SpawnWave: 15, ConservedStomach: false,
      FoodCap: 750, FloraGrowth: 20, GrazeRate: 1.15, HalfSaturation: 150,
      PopulationScale: 1, PredatorScale: 1, Dt: 0.5, Seeder: true, InertPhenotype: false,
      Evolution: settings(),
    };
    if (over) for (const k of Object.keys(over)) {
      if (k === 'Evolution') p.Evolution = settings(over.Evolution);
      else if (k in p) p[k] = over[k];
    }
    return p;
  }
  function scaleCount(authored, scale) {
    if (authored <= 0) return 0;
    const v = roundAwayFromZero(authored * scale);
    return v < 1 ? 1 : v;
  }

  // ------------------------------------------------------------------------------------ EvolutionArena
  class Arena {
    constructor(p, seed) {
      this.P = p;
      this.rng = new GenomeRng(seed);
      this.herbCap = scaleCount(p.HerbCap, p.PopulationScale);
      this.herbFloor = scaleCount(p.HerbFloor, p.PopulationScale);
      this.predCap = scaleCount(p.PredCap, p.PredatorScale);
      this.predFloor = scaleCount(p.PredFloor, p.PredatorScale);
      this.h = [];   // {stomach, feeds, lastBirth, born, gen, g, ph, alive}
      this.pr = [];  // {stomach, feeds, lastBirth, nextHunt, alive}
      this.food = p.FoodCap;
      this.step = 0;
      this.nextWave = 0;
      this.c = { births: 0, founders: 0, starved: 0, eaten: 0, predBirths: 0, predStarved: 0 };
      this.total = { births: 0, founders: 0, starved: 0, eaten: 0 };
      this.maxGen = 0;
      this.seedToFloor();
    }
    get t() { return this.step * this.P.Dt; }
    expressOf(g) { return this.P.InertPhenotype ? NEUTRAL : express(g, this.P.Evolution); }
    spawnHerbivore(g, stomach, gen) {
      this.h.push({ stomach, feeds: 0, lastBirth: -Infinity, born: this.t, gen, g, ph: this.expressOf(g), alive: true });
      if (gen > this.maxGen) this.maxGen = gen;
    }
    spawnPredator() { this.pr.push({ stomach: this.P.StomachCapacity, feeds: 0, lastBirth: -Infinity, nextHunt: this.t + this.P.HuntInterval, alive: true }); }
    seedToFloor() {
      let hd = this.herbFloor - this.h.length;
      if (this.herbCap > 0) hd = Math.min(hd, this.herbCap - this.h.length);
      for (let i = 0; i < hd; i++) {
        const g = founder(this.P.Evolution, this.rng);
        this.spawnHerbivore(g, this.P.StomachCapacity, 0);
        this.c.founders++; this.total.founders++;
      }
      let pd = this.predFloor - this.pr.length;
      if (this.predCap > 0) pd = Math.min(pd, this.predCap - this.pr.length);
      for (let i = 0; i < pd; i++) this.spawnPredator();
    }
    advance(n) { for (let i = 0; i < n; i++) this.stepOnce(); }
    stepOnce() {
      const P = this.P, dt = P.Dt, t = this.t;
      if (P.Seeder && t >= this.nextWave) { this.nextWave += P.SpawnWave; this.seedToFloor(); }
      if (P.FoodCap > 0) {
        const room = 1.0 - this.food / P.FoodCap;
        if (room > 0) this.food += P.FloraGrowth * dt * room;
        if (this.food > P.FoodCap) this.food = P.FoodCap;
      }
      const h = this.h, nh = h.length;
      const children = [];
      const sat = this.food > 0 ? this.food / (this.food + P.HalfSaturation) : 0.0;
      const drain = P.HerbStarvation > 0 ? P.StomachCapacity / P.HerbStarvation : 0.0;
      for (let i = 0; i < nh; i++) {
        const a = h[i];
        if (!a.alive) continue;
        const ph = a.ph;
        const rate = P.GrazeRate * ph.pace * ph.reach * ph.reach * sat;
        let pGraze = rate * dt;
        if (pGraze > 1.0) pGraze = 1.0;
        if (this.food >= 1.0 && this.rng.nextUnit() < pGraze) {
          this.food -= 1.0;
          if (P.ConservedStomach) { const s = a.stomach + P.StomachCapacity; a.stomach = s > P.StomachCapacity ? P.StomachCapacity : s; }
          else a.stomach = P.StomachCapacity;
          a.feeds = a.feeds + 1;
          const fpo = feedsPerOffspring(P.HerbFeedsPerOffspring, ph);
          const capOk = this.herbCap <= 0 || (nh + children.length) < this.herbCap;
          if (fpo > 0 && a.feeds >= fpo && (t - a.lastBirth) >= P.HerbCooldown && capOk) {
            a.lastBirth = t;
            a.feeds = 0;
            const cg = mutate(a.g, P.Evolution, this.rng);
            children.push({ g: cg, stomach: P.StomachCapacity * ph.provision, gen: a.gen + 1 });
          }
        }
        if (drain > 0) {
          a.stomach = a.stomach - drain * ph.upkeep * dt;
          if (a.stomach <= 0) { a.alive = false; this.c.starved++; this.total.starved++; }
        }
      }
      const pr = this.pr, np = pr.length;
      let predChildren = 0;
      const predDrain = P.PredStarvation > 0 ? P.StomachCapacity / P.PredStarvation : 0.0;
      for (let j = 0; j < np; j++) {
        const q = pr[j];
        if (!q.alive) continue;
        if (t >= q.nextHunt) {
          q.nextHunt = q.nextHunt + P.HuntInterval;
          if (nh > 0) {
            let target = Math.floor(this.rng.nextUnit() * nh);
            if (target >= nh) target = nh - 1;
            const prey = h[target];
            const immune = (t - prey.born) < P.PredationImmunity;
            if (prey.alive && !immune) {
              prey.alive = false;
              this.c.eaten++; this.total.eaten++;
              q.stomach = P.StomachCapacity;
              q.feeds = q.feeds + 1;
              const capOk = this.predCap <= 0 || (np + predChildren) < this.predCap;
              if (P.PredFeedsPerOffspring > 0 && q.feeds >= P.PredFeedsPerOffspring && (t - q.lastBirth) >= P.PredCooldown && capOk) {
                q.lastBirth = t; q.feeds = 0; predChildren++;
              }
            }
          }
        }
        if (predDrain > 0) {
          q.stomach = q.stomach - predDrain * dt;
          if (q.stomach <= 0) { q.alive = false; this.c.predStarved++; }
        }
      }
      // stable compaction, then the newborns

      for (let i = 0; i < h.length; i++) if (h[i].alive) h[w++] = h[i];

      t.innerHTML = '<tr><th>Variant</th><th class="num">Δ tempo</th><th class="num">Δ reach</th><th class="num">Δ fecundity</th><th class="num">Δ cohesion (control)</th><th class="num">population</th><th class="num">generations</th></tr>';
      for (const r of rows) {
        const tr = document.createElement('tr');
        const cells = [r.variant, fz(r.tempo) + ' ±' + r.sd[0].toFixed(2), fz(r.reach) + ' ±' + r.sd[1].toFixed(2), fz(r.fecundity) + ' ±' + r.sd[2].toFixed(2), fz(r.cohesion) + ' ±' + r.sd[3].toFixed(2), r.pop.toFixed(1), String(r.gen)];
        cells.forEach((v, i) => { const td = document.createElement('td'); td.textContent = v; if (i > 0) td.className = 'num'; if (i >= 1 && i <= 4) td.classList.add(sign([r.tempo, r.reach, r.fecundity, r.cohesion][i - 1])); tr.appendChild(td); });
        t.appendChild(tr);
      }
      box.querySelector('#batchNote').textContent = rows.length * 3 + ' runs in ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s';
    };
    return box;
  }
  function evidencePanel() {
    const box = document.createElement('div');
    const R = RESULTS, regimes = R.regimes || [];
    const famine = regimes.find(r => r.name === 'famine'), rich = regimes.find(r => r.name === 'rich'), sel = regimes.find(r => r.name === 'control-selection-off');
    const lead = document.createElement('p'); lead.className = 'lead';
    if (famine && rich && sel) {
      lead.innerHTML = 'Baked from <strong>Tools/Build/evolution_harness</strong> (C#, the shipped core): ' + regimes.length + ' regimes × ' + R.seeds + ' seeds × ' + R.hours + ' h of cell time. Under famine the population evolves <strong>slower</strong> (tempo ' + fz(famine.scorecard.shiftMean[0]) + ') and longer-reaching (reach ' + fz(famine.scorecard.shiftMean[1]) + '); on rich food it evolves <strong>faster</strong> (tempo ' + fz(rich.scorecard.shiftMean[0]) + '). The selection-off control drifts ' + fz(sel.scorecard.shiftMean[0]) + ' ± ' + sel.scorecard.shiftSd[0].toFixed(2) + '. Opposite directions in different environments, and nothing in the controls, is natural selection rather than a ratchet.';
    } else lead.textContent = 'No baked evidence in this build: run `bash Tools/Build/evolution_harness/run.sh evidence` then rebuild the lab.';
    box.appendChild(lead);
    const t = document.createElement('table');
    t.innerHTML = '<tr><th>Regime</th><th class="num">population</th><th class="num">Δ tempo</th><th class="num">Δ reach</th><th class="num">Δ fecundity</th><th class="num">Δ cohesion</th><th>4 h of mean traits</th></tr>';
    for (const reg of regimes) {
      const tr = document.createElement('tr'), sc = reg.scorecard;
      const td0 = document.createElement('td'); td0.innerHTML = '<b></b><br><span class="hint"></span>'; td0.querySelector('b').textContent = reg.name; td0.querySelector('span').textContent = reg.note; tr.appendChild(td0);
      const tdp = document.createElement('td'); tdp.className = 'num'; tdp.textContent = sc.meanPopulation.toFixed(1); tr.appendChild(tdp);
      for (let l = 0; l < 4; l++) { const td = document.createElement('td'); td.className = 'num ' + sign(sc.shiftMean[l]); td.textContent = fz(sc.shiftMean[l]) + ' ±' + sc.shiftSd[l].toFixed(3); tr.appendChild(td); }
      const tdS = document.createElement('td'); const cv = document.createElement('canvas'); cv.className = 'spark'; cv.width = 320; cv.height = 56; tdS.style.minWidth = '180px'; tdS.appendChild(cv); tr.appendChild(tdS);
      t.appendChild(tr);
      queueMicrotask(() => sparkline(cv, reg));
    }
    box.appendChild(t);
    const foot = document.createElement('p'); foot.className = 'hint';
    foot.textContent = 'Δ = time-averaged mean gene over the last quarter minus the first census, mean ± sd across seeds. Loci: ' + (R.loci || []).join(', ') + '. Generated ' + (R.generated || '?') + '.';
    box.appendChild(foot);
    return box;
  }
  function sparkline(cv, reg) {
    const c = cv.getContext('2d'), w = cv.width, h = cv.height;
    c.fillStyle = C.bg; c.fillRect(0, 0, w, h);
    c.strokeStyle = C.grid; c.beginPath(); c.moveTo(0, h / 2); c.lineTo(w, h / 2); c.stroke();
    const runs = reg.runs || []; if (!runs.length) return;
    const n = Math.min(...runs.map(r => r.rows.length));
    [C.tempo, C.reach, C.fecundity, C.cohesion].forEach((col, l) => {
      c.strokeStyle = col; c.lineWidth = 1.4; c.beginPath();
      for (let i = 0; i < n; i++) {
        let s = 0, k = 0; for (const r of runs) { if (r.rows[i][1] > 0) { s += r.rows[i][4 + l]; k++; } }
        const v = k ? s / k : 0, x = w * i / (n - 1), y = h / 2 - v * (h / 2) * 0.95;
        i ? c.lineTo(x, y) : c.moveTo(x, y);
      }
      c.stroke();
    });
  }
  function parityPanel() {
    const box = document.createElement('div');
    const cases = GOLDEN.cases || [];
    box.innerHTML = '<p class="lead">This page runs <strong>sim.js</strong>, the exact JavaScript port of the C# core the game ships and the arena the harness measured. The port is held to the C# by <strong>gate_parity.cjs</strong>: the same seed must give the same census rows, bit for bit. The golden trajectories are baked in, so the page can prove it right here.</p><p><button class="btn primary" id="runParity">Re-run the parity cases in this browser</button> <span id="parityNote" class="hint"></span></p><table id="parityTable"></table>';
    const t = box.querySelector('#parityTable');
    t.innerHTML = '<tr><th>Case</th><th class="num">seed</th><th class="num">steps</th><th class="num">rows</th><th>status</th></tr>';
    for (const cs of cases) { const tr = document.createElement('tr'); tr.innerHTML = '<td></td><td class="num"></td><td class="num"></td><td class="num"></td><td class="nil">not run</td>'; tr.children[0].textContent = cs.name; tr.children[1].textContent = cs.seed; tr.children[2].textContent = cs.steps; tr.children[3].textContent = cs.rows.length; tr.dataset.name = cs.name; t.appendChild(tr); }
    box.querySelector('#runParity').onclick = () => {
      const t0 = performance.now(); let ok = 0;
      for (const cs of cases) {
        const over = Object.assign({}, cs.params, { Evolution: Object.assign({}, cs.params.Evolution) });
        const a = new Evo.Arena(Evo.params(over), cs.seed);
        const rows = []; for (let s = 0; s < cs.steps; s += cs.every) { a.advance(cs.every); rows.push(a.census()); }
        let diff = null;
        if (rows.length !== cs.rows.length) diff = 'row count';
        else outer: for (let i = 0; i < rows.length; i++) for (let k = 0; k < rows[i].length; k++) if (rows[i][k] !== cs.rows[i][k]) { diff = 'row ' + i + ' col ' + k + ': ' + rows[i][k] + ' vs ' + cs.rows[i][k]; break outer; }
        const tr = t.querySelector('tr[data-name="' + cs.name + '"]'); if (tr) { tr.children[4].textContent = diff ? 'DIFFERS - ' + diff : 'exact'; tr.children[4].className = diff ? 'status-bad' : 'status-ok'; }
        if (!diff) ok++;
      }
      box.querySelector('#parityNote').textContent = ok + '/' + cases.length + ' cases exact in ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s';
    };
    return box;
  }
  function aboutPanel() {
    const box = document.createElement('div');
    const cols = document.createElement('div'); cols.className = 'cols';
    const a = document.createElement('div');
    a.innerHTML = '<p class="lead"><strong>Darwin Lab</strong> is where a designer decides a biome\'s evolution knobs by watching a population adapt - and watching it NOT adapt under the controls. Every slider on the Mutation and Expression tabs is a field of <span class="key">EvolutionSettings</span> on the cell\'s CellConfigDataSO; the Biome and Species tabs are the shipped assets the arena is built from.</p><p class="hint" id="aboutMeta"></p><p><b>What this lab does NOT model</b></p><ul class="plain"><li>Space. The arena is well mixed: "reach" is an encounter-rate multiplier, not a radius, and sharks pick prey uniformly rather than by distance.</li><li>Plants. The flora is one pool that regrows logistically; the game grows prisms on spindles that fauna graze in place.</li><li>Vessels. No trail mass, no Shepherd joust, no ability deaths - only starvation and predation select here.</li><li>Predator genomes. Sharks carry none in this round (Docs/EVOLUTION.md §8).</li><li>Cohesion. The locus has no mechanism in the arena, by design - it is the neutral marker every run carries.</li><li>Frame cost. Nothing here says what a population of 300 costs the GPU; Tools/ecosim does.</li><li>The shipped Blob cell caps its tadpoles at 6. The evidence runs lift that cap with the population lever; at 6 drift beats selection.</li></ul>';
    a.querySelector('#aboutMeta').textContent = LAB.name + ' · round ' + LAB.round + ' · built ' + LAB.built + ' · ' + LAB.branch + ' · write-up: ' + LAB.doc;
    const b = document.createElement('div');
    b.innerHTML = '<p><b>Where every shipped number comes from</b></p>';
    const t = document.createElement('table'); t.innerHTML = '<tr><th>key</th><th class="num">value</th><th>source</th></tr>';
    for (const k of Object.keys(SHIPPED_META)) { const tr = document.createElement('tr'); const drift = SHIPPED_DRIFT.find(d => d.key === k); tr.innerHTML = '<td class="key"></td><td class="num"></td><td></td>'; tr.children[0].textContent = k; tr.children[1].textContent = String(SHIPPED_META[k].value); tr.children[2].textContent = SHIPPED_META[k].source + (drift ? ' - ASSET MOVED: now ' + drift.asset : ''); if (drift) tr.children[2].className = 'status-warn'; t.appendChild(tr); }
    b.appendChild(t);
    cols.appendChild(a); cols.appendChild(b); box.appendChild(cols);
    return box;
  }
  makeTabs('bottomTabs', 'bottomBody', [{ name: 'Scorecard', build: scorecardPanel }, { name: 'Evidence', build: evidencePanel }, { name: 'Parity', build: parityPanel }, { name: 'Decisions', build: logPanel }, { name: 'About', build: aboutPanel }], LS + 'bottom');

  $('meta').textContent = 'round ' + LAB.round + ' · the HyperSea\'s heritable genome · ' + (SHIPPED_DRIFT.length ? SHIPPED_DRIFT.length + ' asset(s) moved since the bake' : 'numbers match the assets');
  if (SHIPPED_DRIFT.length) $('meta').className = 'meta status-warn';
  let paused = false;
  const SPEEDS = [10, 60, 300, 1000];
  $('speed').onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; $('speed').textContent = speed + '×'; };
  $('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; };
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); lsSet(LS + 'P', {}); for (const k in outputs) outputs[k].inp.value = P[k]; reset(); refreshDiff(); };

  // ================= sizing + loop (with a manual clock for recorders) =================
  function resize() { const r = canvas.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }
  addEventListener('resize', resize);
  let manualClock = false, last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) { resize(); if (!paused) simStep(dt); render(); }
    requestAnimationFrame(frame);
  }
  reset(); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  // ================= the test surface =================
  window.__lab = {
    LAB, SHIPPED, SHIPPED_META, SHIPPED_DRIFT, SPEC, P, PLATFORM, VARIANTS, PRESETS, RESULTS, GOLDEN, Evo,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { n = n || 1; for (let i = 0; i < n; i++) simStep(dt); resize(); render(); },
    reset, score, runBatch, setParam, record, applyPreset,
    state: () => ({ t: arena.t, seed, herbivores: arena.h.length, predators: arena.pr.length, food: arena.food, maxGen: arena.maxGen }),
  };
})();
