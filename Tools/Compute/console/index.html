<style>
/* Froglet Compute Console: a macOS window (title bar, traffic lights, source-list sidebar, a Terminal panel) dressed
   in Cosmic Shore's style foundation (Docs/STYLE_FOUNDATION.md): deep-space neutrals, Jade for the active
   selection, CTA green for the one call to action, Gold for "needs a person", corner slivers instead of radii inside
   the window, Aldrich for headings and numbers, Chakra Petch caps on buttons. One static page + console.json beside it
   (Tools/Compute/console.py), so it runs here and on GitHub Pages / Cloudflare unchanged. Single dark theme by
   choice: the game's UI is dark. */
:root {
  --space: #00041f; --black: #00010a;
  --window: rgba(9, 13, 44, 0.84); --titlebar: rgba(20, 25, 66, 0.92); --sidebar: rgba(3, 6, 28, 0.55);
  --card: #10153a; --card-hi: #171d4a; --sunk: #070b29;
  --line: rgba(116, 123, 173, 0.24); --line-hi: rgba(116, 123, 173, 0.45);
  --text: #e6e9ff; --muted: #a9aed6; --dim: #747bad; --inactive: #5c5f70;
  --jade: #00d4ff; --jade-l: #80eaff; --jade-d: #004d81;
  --ruby: #a600ff; --ruby-l: #d280ff;
  --gold: #ffae00; --gold-l: #ffd780; --gold-d: #805700;
  --cta: #99ff80; --danger: #ff4b3a;
  --mac-red: #ff5f57; --mac-yellow: #febc2e; --mac-green: #28c840;
  --head: "Aldrich", "Chakra Petch", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --btn: "Chakra Petch", "Aldrich", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
  --sliver: 14px; --sliver-s: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; color: var(--text); font: 13.5px/1.5 var(--ui); background: var(--space);
  background-image:
    radial-gradient(1px 1px at 12% 22%, rgba(230,233,255,0.7) 50%, transparent 51%),
    radial-gradient(1px 1px at 68% 14%, rgba(230,233,255,0.5) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 84% 62%, rgba(128,234,255,0.6) 50%, transparent 51%),
    radial-gradient(1px 1px at 32% 78%, rgba(230,233,255,0.45) 50%, transparent 51%),
    radial-gradient(1px 1px at 52% 46%, rgba(210,128,255,0.5) 50%, transparent 51%),
    radial-gradient(900px 520px at 85% 0%, rgba(166,0,255,0.16), transparent 70%),
    radial-gradient(800px 600px at 0% 100%, rgba(0,212,255,0.12), transparent 70%);
  background-size: 360px 360px, 420px 420px, 520px 520px, 300px 300px, 460px 460px, 100% 100%, 100% 100%;
  background-attachment: fixed;
  padding: 28px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); }
h1, h2, h3 { font-family: var(--head); font-weight: 400; margin: 0; line-height: 1.2; text-wrap: balance; letter-spacing: 0.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
code, .mono { font-family: var(--mono); font-size: 0.92em; }
a { color: var(--jade-l); }

/* ── the window ── */
.window { max-width: 1240px; height: 100%; min-height: 640px; margin: 0 auto; display: grid; grid-template-rows: 38px minmax(0, 1fr);
  background: var(--window); border: 1px solid rgba(230,233,255,0.14); border-radius: 12px; overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,1,10,0.7), 0 0 0 0.5px rgba(0,1,10,0.9), inset 0 1px 0 rgba(255,255,255,0.06);
  -webkit-backdrop-filter: blur(24px) saturate(140%); backdrop-filter: blur(24px) saturate(140%); }
.window.zoomed { max-width: none; }
.titlebar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 12px; background: var(--titlebar);
  border-bottom: 1px solid rgba(0,1,10,0.6); box-shadow: inset 0 -1px 0 rgba(255,255,255,0.04); user-select: none; }
.lights { display: flex; gap: 8px; }
.lights button { width: 12px; height: 12px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; position: relative; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.25); }
.lights .r { background: var(--mac-red); } .lights .y { background: var(--mac-yellow); } .lights .g { background: var(--mac-green); }
.lights button::after { content: attr(data-g); position: absolute; inset: 0; display: grid; place-items: center; font: 700 9px/1 var(--ui); color: rgba(0,0,0,0.6); opacity: 0; }
.lights:hover button::after { opacity: 1; }
.wtitle { font: 600 13px/1 var(--ui); color: var(--muted); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.wtitle b { color: var(--text); font-weight: 600; }
.tright { justify-self: end; display: flex; align-items: center; gap: 10px; font: 500 11.5px/1 var(--mono); color: var(--dim); }
.led { width: 8px; height: 8px; border-radius: 50%; background: var(--inactive); flex: none; display: inline-block; }
.led.on { background: var(--cta); box-shadow: 0 0 8px var(--cta); animation: pulse 2.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { .led.on { animation: none; } }

.body { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 0; }
.window.nosidebar .body { grid-template-columns: 0 minmax(0, 1fr); }
.window.nosidebar .side { visibility: hidden; }

/* source list */
.side { background: var(--sidebar); border-right: 1px solid rgba(0,1,10,0.55); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.side .sec { font: 600 11px/1 var(--ui); color: var(--dim); padding: 12px 10px 6px; letter-spacing: 0.02em; }
.side a { display: flex; align-items: center; gap: 9px; padding: 6px 10px; border-radius: 6px; color: var(--text); text-decoration: none; font-size: 13px; }
.side a svg { width: 16px; height: 16px; flex: none; color: var(--jade); }
.side a:hover { background: rgba(230,233,255,0.06); }
.side a[aria-current="page"] { background: rgba(0,212,255,0.18); box-shadow: inset 0 0 0 1px rgba(0,212,255,0.28); }
.side a .n { margin-left: auto; font: 500 11px/1 var(--mono); color: var(--dim); }
.side .foot { margin-top: auto; padding: 12px 10px 4px; font-size: 11.5px; color: var(--dim); display: grid; gap: 4px; border-top: 1px solid var(--line); }
.side .foot b { color: var(--muted); font-weight: 500; }

/* content + terminal */
.content { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; min-width: 0; }
.scroll { overflow-y: auto; min-height: 0; }
.pane { padding: 22px 24px 40px; display: grid; gap: 18px; max-width: 1000px; }
.ptitle { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.ptitle h2 { font-size: 22px; }
.ptitle .sub { color: var(--muted); font-size: 12.5px; }
.lead { color: var(--muted); max-width: 76ch; }
.note { font-size: 12px; color: var(--muted); }

/* style-foundation surfaces: corner slivers, no radii */
.sliver { clip-path: polygon(var(--sliver) 0, 100% 0, 100% calc(100% - var(--sliver)), calc(100% - var(--sliver)) 100%, 0 100%, 0 var(--sliver)); }
.card { background: var(--card); padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.card h3 { font-size: 15px; }
.banner { background: var(--card); padding: 14px 18px; display: grid; gap: 6px; border-left: 3px solid var(--jade); }
.banner.gold { border-left-color: var(--gold); }
.banner.bad { border-left-color: var(--danger); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.tile { background: var(--card); padding: 12px 16px 14px; display: grid; gap: 2px; }
.tile b { font: 400 24px/1.1 var(--head); font-variant-numeric: tabular-nums; }
.tile span { font-size: 11.5px; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 10.5px/1 var(--btn); letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 9px 4px;
  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); white-space: nowrap; }
.pill.ready, .pill.learned, .pill.valid, .pill.promoted { color: var(--black); background: var(--cta); }
.pill.converged, .pill.waitingyes { color: var(--black); background: var(--gold); }
.pill.blocked, .pill.waiting { color: var(--gold-l); background: rgba(255,174,0,0.16); }
.pill.proposed, .pill.paused, .pill.retired, .pill.idle { color: var(--muted); background: rgba(92,95,112,0.35); }
.pill.new, .pill.notrun { color: #fff; background: var(--danger); }

.btn { font: 600 12px/1 var(--btn); letter-spacing: 0.08em; text-transform: uppercase; padding: 11px 18px 10px; border: 0; cursor: pointer; color: var(--text); background: var(--inactive);
  clip-path: polygon(var(--sliver-s) 0, 100% 0, 100% calc(100% - var(--sliver-s)), calc(100% - var(--sliver-s)) 100%, 0 100%, 0 var(--sliver-s)); }
.btn:hover { background: #6c7084; }
.btn.cta { background: var(--cta); color: var(--black); }
.btn.cta:hover { background: #b2ff9f; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* queue rows */
.group { display: grid; gap: 8px; }
.group > h3 { font: 600 11px/1 var(--btn); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); padding: 6px 2px 2px; }
.job { display: grid; grid-template-columns: 3px minmax(0, 1fr) 150px 180px; gap: 6px 16px; align-items: center; background: var(--card); padding: 12px 16px 12px 0; cursor: pointer;
  text-align: left; width: 100%; border: 0; color: inherit; transition: background 0.15s; }
.job:hover { background: var(--card-hi); }
.job .strip { align-self: stretch; background: transparent; }
.job.attn .strip { background: var(--gold); }
.job.live .strip { background: var(--jade); }
.job .t { display: grid; gap: 3px; min-width: 0; }
.job .title { font: 400 14.5px/1.3 var(--head); }
.job .id { font: 11px/1.3 var(--mono); color: var(--dim); overflow-wrap: anywhere; }
.job .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 11.5px; color: var(--muted); }
.job .why { font-size: 11.5px; color: var(--muted); }
.job .score { display: grid; gap: 2px; justify-items: end; text-align: right; font-variant-numeric: tabular-nums; }
.job .score b { font: 400 19px/1.1 var(--head); }
.job .score span { font-size: 11px; color: var(--muted); }
.delta.good { color: var(--cta); } .delta.worse { color: var(--danger); }
.spark { width: 180px; height: 46px; display: block; }

/* drawer (a sheet from the right, inside the window) */
.drawer { position: fixed; inset: 0; z-index: 30; display: grid; grid-template-columns: 1fr min(580px, 100%); background: rgba(0,1,10,0.55); }
.drawer .scrim { border: 0; background: transparent; cursor: pointer; }
.panel { background: rgba(9,13,44,0.97); border-left: 1px solid var(--line-hi); overflow-y: auto; display: grid; align-content: start; gap: 14px;
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 20px;
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.panel .top { display: flex; justify-content: space-between; align-items: center; }
.panel h2 { font-size: 22px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 16px; font-size: 12.5px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) 70px; gap: 10px; align-items: center; }
.bar-row .lbl { font: 400 12px/1 var(--head); color: var(--muted); }
.bar-row .tracks { display: grid; gap: 3px; }
.bar-row .tr { height: 7px; background: var(--sunk); overflow: hidden; }
.bar-row .tr i { display: block; height: 100%; }
.bar-row .tr.s i { background: var(--inactive); }
.bar-row .tr.b i { background: var(--jade); }
.bar-row .val { text-align: right; font: 11px/1.35 var(--mono); color: var(--muted); white-space: pre; }
.legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 7px; margin-right: 6px; }
.approve textarea, .field { width: 100%; font: inherit; color: var(--text); background: var(--sunk); border: 1px solid var(--line); padding: 9px 11px; resize: vertical; }
.approve textarea { min-height: 56px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.decisions { display: grid; gap: 6px; }
.decision { display: flex; align-items: center; gap: 8px; font-size: 12.5px; flex-wrap: wrap; }
.decision img { width: 20px; height: 20px; border-radius: 50%; }

/* tables */
.tablewrap { overflow-x: auto; background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 10.5px/1.2 var(--btn); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); white-space: nowrap; background: rgba(0,1,10,0.25); }
tr:last-child td { border-bottom: 0; }
td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.wide { min-width: 680px; }
.params { max-height: 240px; overflow: auto; }
.matrix td.cell { text-align: center; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.matrix td.cell span { display: inline-block; min-width: 2.1em; padding: 2px 5px; margin: 1px; }
.matrix td.cell .l { background: rgba(153,255,128,0.16); color: var(--cta); }
.matrix td.cell .w { background: rgba(255,174,0,0.16); color: var(--gold-l); }
.matrix td.cell .n { background: rgba(255,75,58,0.2); color: #ff9b90; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters select { font: inherit; color: var(--text); background: var(--sunk); border: 1px solid var(--line); padding: 6px 10px; }
.empty { background: var(--card); padding: 26px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.cmdline { display: flex; gap: 8px; align-items: center; background: var(--black); padding: 9px 12px; font-family: var(--mono); font-size: 12px; min-width: 0; color: var(--jade-l); }
.cmdline code { overflow-x: auto; white-space: nowrap; flex: 1; min-width: 0; background: none; }

/* ── Terminal (a macOS Terminal pane, Cosmic Shore colours) ── */
.term { border-top: 1px solid rgba(0,1,10,0.7); background: rgba(0,1,10,0.94); display: grid; grid-template-rows: 30px minmax(0, 1fr); height: 300px; min-height: 0; }
.term[hidden] { display: none !important; }
.term.tall { height: 62vh; }
.termbar { display: flex; align-items: center; gap: 10px; padding: 0 10px 0 14px; background: linear-gradient(#1a1f4a, #121638); border-bottom: 1px solid rgba(0,1,10,0.8); font: 600 11.5px/1 var(--ui); color: var(--muted); user-select: none; }
.termbar .tab { display: flex; align-items: center; gap: 6px; padding: 5px 10px; background: rgba(0,212,255,0.12); color: var(--text); }
.termbar .sp { flex: 1; }
.termbar button { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 6px; font: 500 11.5px/1 var(--ui); }
.termbar button:hover { color: var(--text); }
.tout { overflow-y: auto; padding: 10px 14px 4px; font: 12.5px/1.55 var(--mono); color: #cfd3f5; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 0; }
.tout .line { min-height: 1.55em; }
.tout .p { color: var(--cta); } .tout .p .path { color: var(--jade); }
.tout .ok { color: var(--cta); } .tout .warn { color: var(--gold); } .tout .err { color: var(--danger); }
.tout .dim { color: var(--dim); } .tout .hl { color: var(--jade-l); } .tout .ruby { color: var(--ruby-l); } .tout .b { color: var(--text); font-weight: 600; }
.tout a { color: var(--jade-l); }
.tin { display: flex; align-items: center; gap: 8px; padding: 2px 14px 10px; font: 12.5px/1.55 var(--mono); }
.tin .p { color: var(--cta); white-space: nowrap; } .tin .p .path { color: var(--jade); }
.tin input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text); font: inherit; caret-color: var(--jade); padding: 0; }
.statusbar { display: flex; gap: 14px; align-items: center; white-space: nowrap; overflow: hidden; padding: 0 14px; height: 24px; font: 11px/1 var(--mono); color: var(--dim); border-top: 1px solid rgba(0,1,10,0.6); background: rgba(3,6,28,0.7); }
.statusbar button { background: none; border: 0; color: var(--jade-l); cursor: pointer; font: inherit; padding: 0; }
.statusbar .sp { flex: 1; }
.statusbar #sb-left { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

@media (max-width: 760px) {
  body { padding: 0; }
  .window { border-radius: 0; border: 0; min-height: 100%; }
  .titlebar { grid-template-columns: auto 1fr; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .tright, #sb-right { display: none; }
  .titlebar { gap: 14px; }
  .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .side { flex-direction: row; overflow-x: auto; padding: 8px max(10px, env(safe-area-inset-left, 0px)); border-right: 0; border-bottom: 1px solid var(--line); }
  .side .sec, .side .foot { display: none; }
  .side a { white-space: nowrap; }
  .pane { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
  .job { grid-template-columns: 3px minmax(0, 1fr) auto; }
  .job .sparkcell { grid-column: 2 / -1; }
  .spark { width: 100%; }
  .term { height: 46vh; }
}
</style>

<script>
(function () {

        out([{ t: pad(st, 11), c: st === "working" ? "ok" : (st === "failed" ? "err" : "dim") }, link("https://claude.ai/code/" + s.id, pad(s.title || s.id, 44)), { t: "  " + (s.updated_at || "").slice(0, 16).replace("T", " "), c: "dim" }]);
        if (s.post_turn_summary && s.post_turn_summary.recent_action) out([{ t: "           " + s.post_turn_summary.recent_action, c: "dim" }]); });
    }, mcpError);
  }
  function complete(v) {
    var parts = v.split(/\s+/), names = Object.keys(CMDS).filter(function (n) { return ["yes", "no"].indexOf(n) < 0; });
    if (parts.length === 1) { var m = names.filter(function (n) { return n.indexOf(parts[0]) === 0; }); return m.length === 1 ? m[0] + " " : (m.length ? (out(m.join("  "), "dim"), v) : v); }
    if (["job", "open", "approve", "decline"].indexOf(parts[0]) >= 0) {
      var pool = DATA.jobs.map(function (j) { return j.id; }).concat(parts[0] === "open" ? ["queue", "machines", "recordings", "ai"] : []);
      var mm = pool.filter(function (n) { return n.indexOf(parts[1] || "") === 0; });
      if (mm.length === 1) return parts[0] + " " + mm[0] + " "; if (mm.length) out(mm.join("  "), "dim");
    }
    return v;
  }
  function run(raw) {
    var line = raw.trim(); out([prompt(), " " + line]);
    if (!line) return;
    T.hist.push(line); T.hi = T.hist.length;
    var args = line.match(/"[^"]*"|'[^']*'|\S+/g).map(function (a) { return a.replace(/^["']|["']$/g, ""); }), cmd = args.shift().toLowerCase();
    if (T.pending && cmd !== "yes" && cmd !== "no") { T.pending = null; out("(the waiting task was cancelled)", "dim"); }
    var fn = CMDS[cmd];
    if (!DATA && ["help", "clear"].indexOf(cmd) < 0) return out("console.json has not loaded", "err");
    if (fn) { try { fn(args, line); } catch (e) { out(String(e && e.message || e), "err"); } } else out("command not found: " + cmd + " · `help`", "err");
  }
  function buildTerm() {
    T.out = document.getElementById("tout");
    var row = h("div", { class: "tin" }, [prompt(), h("input", { id: "tin", type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false", "aria-label": "Terminal input" })]);
    document.getElementById("term").appendChild(row);
    T.input = document.getElementById("tin");
    T.input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { var v = T.input.value; T.input.value = ""; run(v); }
      else if (e.key === "ArrowUp") { if (T.hi > 0) { T.hi--; T.input.value = T.hist[T.hi] || ""; } e.preventDefault(); }
      else if (e.key === "ArrowDown") { if (T.hi < T.hist.length) { T.hi++; T.input.value = T.hist[T.hi] || ""; } e.preventDefault(); }
      else if (e.key === "Tab") { e.preventDefault(); if (DATA) T.input.value = complete(T.input.value); }
      else if (e.key === "l" && e.ctrlKey) { e.preventDefault(); CMDS.clear(); }
    });
    T.out.addEventListener("click", function () { if (!window.getSelection().toString()) T.input.focus(); });
    out([{ t: "Froglet Compute", c: "b" }, { t: "  ·  type ", c: "dim" }, { t: "help", c: "hl" }, { t: " for commands", c: "dim" }]);
  }
  function refreshPrompt() { var p = document.querySelector(".tin .p"); if (p) p.replaceWith(prompt()); }
  function toggleTerm(force) {
    var t = document.getElementById("term"), show = force == null ? t.hidden : force;
    t.hidden = !show; if (show) setTimeout(function () { T.input.focus(); }, 0);
    if (show) document.getElementById("nav-term").setAttribute("aria-current", "page"); else document.getElementById("nav-term").removeAttribute("aria-current");
    if (!show && VIEW === "terminal") VIEW = "queue";
  }

  // ── capabilities (claude.ai only; the page works without them) ──
  function connect() {
    if (!window.claude || !window.claude.use) { CAP.ready = true; return; }
    var u = window.claude.use.bind(window.claude);
    u("sample").then(function (s) { CAP.sample = s; });
    u("mcp").then(function (m) { CAP.mcp = m; });
    Promise.all([u("db"), u("user")]).then(function (r) {
      CAP.db = r[0]; CAP.user = r[1]; CAP.ready = true;
      if (!CAP.user) { if (OPEN) renderDrawer(); return; }
      CAP.user.me().then(function (me) {
        CAP.me = me; refreshPrompt();
        var first = (me.name || "").split(/\s+/)[0].toLowerCase(), core = ((DATA && DATA.core) || []).map(function (c) { return c.toLowerCase(); });
        CAP.canApprove = !me.id ? false : (first ? core.indexOf(first) >= 0 : null);
        if (OPEN) renderDrawer();
      });
      if (!CAP.db) return;
      CAP.db.collection("approvals").onSnapshot(function (snap) { var a = {}; snap.docs.forEach(function (d) { a[d.id] = ((d.data() || {}).decisions) || {}; }); CAP.approvals = a; if (DATA) render(); if (OPEN) renderDrawer(); }, function () {});
      CAP.db.collection("processed").onSnapshot(function (snap) { var a = {}; snap.docs.forEach(function (d) { a[d.id] = d.data() || {}; }); CAP.processed = a; if (OPEN) renderDrawer(); }, function () {});
    });
  }

  // ── routing ──
  function render() {
    var root = document.getElementById("main"); root.textContent = "";
    renderChrome();
    ({ queue: renderQueue, machines: renderMachines, recordings: renderRecordings, ai: renderAi })[VIEW === "terminal" ? "queue" : VIEW](root);
    root.appendChild(h("p", { class: "note", text: "Built " + new Date(DATA.generated * 1000).toLocaleString() + " from git by Tools/Compute/console.py. Refresh with `refresh` in the terminal." }));
  }
  function route() {
    var v = (location.hash || "").replace("#", "");
    if (v === "terminal") { toggleTerm(true); return; }
    VIEW = ["queue", "machines", "recordings", "ai"].indexOf(v) >= 0 ? v : "queue";
    if (DATA) render();
    document.getElementById("scroll").scrollTop = 0;
  }
  window.addEventListener("hashchange", route);
  document.getElementById("nav-term").addEventListener("click", function (e) { e.preventDefault(); toggleTerm(); });
  document.getElementById("sb-term").addEventListener("click", function () { toggleTerm(); });
  document.getElementById("t-close").addEventListener("click", function () { toggleTerm(false); });
  document.getElementById("t-clear").addEventListener("click", function () { CMDS.clear(); });
  document.getElementById("t-tall").addEventListener("click", function (e) { var t = document.getElementById("term"); t.classList.toggle("tall"); e.target.textContent = t.classList.contains("tall") ? "Shrink" : "Expand"; });
  document.getElementById("l-red").addEventListener("click", function () { if (OPEN) closeJob(); else toggleTerm(false); });
  document.getElementById("l-yellow").addEventListener("click", function () { document.getElementById("win").classList.toggle("nosidebar"); });
  document.getElementById("l-green").addEventListener("click", function () { document.getElementById("win").classList.toggle("zoomed"); });
  document.getElementById("scrim").addEventListener("click", closeJob);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && OPEN) closeJob();
    if ((e.metaKey && e.key.toLowerCase() === "j") || (e.ctrlKey && e.key === "`")) { e.preventDefault(); toggleTerm(); }
  });
  buildTerm();
  route();
  fetch("console.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then(function (d) {
    DATA = d; render(); connect();
  }).catch(function (e) {
    var root = document.getElementById("main"); root.textContent = "";
    root.appendChild(h("div", { class: "banner bad" }, [h("b", { text: "console.json did not load" }), h("p", { class: "note", text: "The console reads console.json from its own folder (" + e.message + "). Build it with python3 Tools/Compute/compute.py console and publish both files together." })]));
    document.getElementById("fresh").textContent = "no data";
  });
})();
</script>
