<meta charset="utf-8">
<title>Froglet Compute Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Froglet Compute Console: an application (2026-10-29, the design board's Rev 38 "Computer artifact"; Shombith picked
   Linear's shell, Tailscale's machine list and Optuna's study view). One stylesheet: a sidebar, a top bar, lists and
   tables, status as a dot and a word, one accent. Light and dark follow the system; data-theme on <html> forces one.
   One static page + console.json beside it (Tools/Compute/console.py). */
:root {
  --bg: #FBFBFC; --side: #F4F5F7; --surface: #FFFFFF; --raised: #F0F1F4; --sunk: #F4F5F7;
  --line: #E4E6EA; --line2: #D5D8DE; --text: #16181D; --muted: #555A66; --dim: #646A76;
  --accent: #00809E; --on: #FFFFFF; --tint: rgba(0,128,158,0.10);
  --ok: #1A7F52; --warn: #9A6400; --unity: #7E46CC; --off: #8A909B; --bad: #C2372B;
  --shadow: 0 12px 32px rgba(15,18,25,0.14);
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0C10; --side: #08090C; --surface: #101218; --raised: #161921; --sunk: #0D0F14;
    --line: #1F232C; --line2: #2A2F3A; --text: #E6E8EE; --muted: #A0A5B0; --dim: #858B97;
    --accent: #00D4FF; --on: #00141A; --tint: rgba(0,212,255,0.10);
    --ok: #4CC38A; --warn: #E8B44C; --unity: #C58CFF; --off: #6B7180; --bad: #F2665A;
    --shadow: 0 16px 40px rgba(0,0,0,0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0C10; --side: #08090C; --surface: #101218; --raised: #161921; --sunk: #0D0F14;
  --line: #1F232C; --line2: #2A2F3A; --text: #E6E8EE; --muted: #A0A5B0; --dim: #858B97;
  --accent: #00D4FF; --on: #00141A; --tint: rgba(0,212,255,0.10);
  --ok: #4CC38A; --warn: #E8B44C; --unity: #C58CFF; --off: #6B7180; --bad: #F2665A;
  --shadow: 0 16px 40px rgba(0,0,0,0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/20px var(--ui); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.005em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
.num, td.num { font-variant-numeric: tabular-nums; }
.note { font-size: 12.5px; color: var(--muted); }
.lead { font-size: 13px; color: var(--muted); max-width: 80ch; }
.grow { flex: 1; }

/* ── the shell: sidebar + top bar ── */
.app { display: grid; grid-template-columns: 240px minmax(0, 1fr); height: 100%; }
.side { background: var(--side); border-right: 1px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; min-height: 0; }
.side .brand:has(.livetag:not([hidden])) .led { display: none; }
.side .brand { white-space: nowrap; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 6px; margin-bottom: 12px; color: var(--text); text-decoration: none; font-weight: 600; }
.side .brand .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: var(--on); display: inline-grid; place-items: center; flex: none; }
.side a, .side .navbtn { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 6px; color: var(--muted); text-decoration: none; border: 0; background: transparent; cursor: pointer; text-align: left; width: 100%; font-size: 14px; }
.side a svg, .side .navbtn svg { flex: none; color: var(--dim); }
.side a:hover, .side .navbtn:hover { background: var(--raised); color: var(--text); }
.side a[aria-current="page"] { background: var(--raised); color: var(--text); font-weight: 500; }
.side a[aria-current="page"] svg { color: var(--text); }
.side a .n { margin-left: auto; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.side a .n:empty { display: none; }
.side kbd { margin-left: auto; font: 12px var(--mono); color: var(--dim); }
.side .sep { height: 1px; background: var(--line); margin: 10px 4px; }
.side .foot { border-top: 1px solid var(--line); margin-top: 8px; padding: 10px 6px 2px; font-size: 12px; color: var(--dim); display: grid; gap: 2px; }
.side .foot b { color: var(--muted); font-weight: 500; }
.led { width: 8px; height: 8px; border-radius: 50%; background: var(--off); display: inline-block; flex: none; }
.led.on { background: var(--ok); }
.livetag { font-size: 11px; font-weight: 600; color: var(--ok); border: 1px solid currentColor; border-radius: 9px; padding: 0 6px; line-height: 16px; }
.main { display: grid; grid-template-rows: 56px minmax(0, 1fr); min-width: 0; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line); min-width: 0; }
.topbar h1 { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .fresh { font-size: 12px; color: var(--dim); white-space: nowrap; }
.topbar .menu-btn { display: none; }
.content { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; min-width: 0; }
.scroll { overflow-y: auto; min-height: 0; }
.pane { padding: 20px 24px 40px; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); max-width: 1440px; }
.pane > * { min-width: 0; }
.statusbar { display: none; }

/* ── controls ── */
.btn, .tbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 6px;
  border: 1px solid var(--line2); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover, .tbtn:hover { background: var(--raised); }
.btn.cta, .btn.pri, .tbtn.cta { background: var(--accent); border-color: var(--accent); color: var(--on); font-weight: 600; }
.btn.cta:hover, .btn.pri:hover, .tbtn.cta:hover { filter: brightness(1.06); background: var(--accent); }
.btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.ghost, .tbtn.ghost { background: transparent; }
.btn.icon { width: 32px; padding: 0; border-color: transparent; background: transparent; color: var(--muted); }
.btn.icon:hover { background: var(--raised); color: var(--text); }
.btn.big { height: 40px; width: 100%; font-size: 14px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.tab { height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tab:hover { color: var(--text); }
.tab[aria-pressed="true"] { background: var(--raised); border-color: var(--line2); color: var(--text); }
.tab .num { color: var(--dim); }
.searchbox { display: flex; align-items: center; gap: 8px; height: 32px; width: 260px; max-width: 100%; padding: 0 10px; border: 1px solid var(--line2); border-radius: 6px; background: var(--surface); color: var(--dim); }
.searchbox input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 13px; }
.field, select.field, input.field, textarea.field, .filters select, .approve textarea { width: 100%; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--line2); border-radius: 6px; padding: 7px 10px; }
textarea.field, .approve textarea { min-height: 60px; resize: vertical; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters select { width: auto; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ── surfaces ── */
.card, .tablewrap, .empty, .banner, .run, .mrun, .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.card { padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; overflow: hidden; }
.card > .ch { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.card > .ch h3 { font-size: 13px; flex: 1; }
.card > .ch a { font-size: 12px; color: var(--muted); }
.card > .cb { padding: 14px 16px; display: grid; gap: 10px; }
.banner { padding: 12px 16px; display: grid; gap: 4px; }
.banner.gold { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.banner.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.banner.ruby { border-color: color-mix(in srgb, var(--unity) 45%, var(--line)); }
.empty { padding: 26px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.sec { font-size: 12px; font-weight: 600; color: var(--dim); }
.rowlist > .r { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 8px 16px; border-top: 1px solid var(--line); }
.rowlist > .r:first-child { border-top: 0; }
.rowlist > .r .t { flex: 1; min-width: 0; }
.rowlist > .r .t b { font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rowlist > .r .t span { font-size: 12px; color: var(--muted); }
.rowlist > .r .w { font-size: 12px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.stat span { font-size: 12px; color: var(--dim); }
.stat b { font-size: 26px; line-height: 34px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat i { font-style: normal; font-size: 12px; color: var(--muted); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.cols > div { display: grid; gap: 20px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { padding: 12px 14px; display: grid; gap: 2px; text-align: left; }
.tile b { font-size: 22px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--muted); }

/* ── status, tags, pills ── */
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--off); }
.st { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.st.working .dot { background: var(--accent); } .st.free .dot { background: var(--ok); } .st.in-use .dot { background: var(--warn); }
.st.outside-hours .dot { background: transparent; border: 1.5px solid var(--off); } .st.offline .dot { background: transparent; border: 1.5px solid var(--off); }
.st + .sub, .sub { display: block; font-size: 12px; color: var(--dim); }
.kind { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border: 1px solid var(--line2); border-radius: 11px; font-size: 12px; color: var(--muted); white-space: nowrap; vertical-align: middle; }
.kind::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--off); }
.kind.k-model::before { background: var(--accent); } .kind.k-unity::before { background: var(--unity); }
.kind.k-player::before { background: var(--warn); } .kind.k-train::before { background: var(--muted); }
.kinds { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; color: var(--muted); }
.kinds span { display: inline-flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid var(--line2); color: var(--muted); background: transparent; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--off); }
.pill.converged::before, .pill.waitingyes::before, .pill.waiting::before, .pill.blocked::before { background: var(--warn); }
.pill.ready::before, .pill.searching::before { background: var(--accent); }
.pill.learned::before, .pill.valid::before, .pill.promoted::before { background: var(--ok); }
.pill.new::before, .pill.notrun::before { background: var(--bad); }
.flag { font-size: 12px; color: var(--muted); }
.flag.on { color: var(--text); }
.delta.good { color: var(--ok); } .delta.worse { color: var(--bad); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 6px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
.fleet { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }

/* ── progress ── */
.prog { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.prog.mini { width: 90px; display: inline-block; vertical-align: middle; }

/* ── tables ── */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 0 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { height: 36px; font-size: 12px; font-weight: 500; color: var(--dim); white-space: nowrap; }
td { height: 52px; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--raised); }
td.num { text-align: right; } th.num { text-align: right; }
td .sub { margin-top: 2px; }
td.cell { text-align: center; white-space: nowrap; }
.wide { min-width: 760px; }
.matrix td { height: 34px; }
.matrix td.cell span { display: inline-block; min-width: 2.1em; padding: 1px 5px; margin: 1px; border-radius: 4px; font-size: 12px; }
.matrix td.cell .l { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.matrix td.cell .w { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.matrix td.cell .n { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.params { max-height: none; }
.vm-grid td { height: 30px; padding: 0 4px; }
.vm-grid td:first-child { padding-left: 12px; white-space: nowrap; }
.vm-grid td.cell button { width: 26px; height: 20px; border: 0; border-radius: 4px; cursor: pointer; font-size: 10px; }
.vm-grid td.cell button.now { background: var(--tint); color: var(--accent); }
.vm-grid td.cell button.unity { background: color-mix(in srgb, var(--unity) 16%, transparent); color: var(--unity); }
.vm-grid td.cell button.game { background: transparent; color: var(--dim); border: 1px solid var(--line); }
.vm-grid th.mh { writing-mode: vertical-rl; transform: rotate(180deg); height: 96px; padding: 6px 2px; }

/* ── the row menu ── */
.menuwrap { position: relative; display: inline-block; }
.rmenu { position: absolute; right: 0; top: 36px; z-index: 20; width: 250px; padding: 6px; border: 1px solid var(--line2); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); text-align: left; }
.rmenu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: var(--text); font-size: 13px; cursor: pointer; text-align: left; }
.rmenu button:hover:not(:disabled) { background: var(--raised); }
.rmenu button:disabled { color: var(--dim); cursor: default; }
.rmenu .why { font-size: 12px; color: var(--dim); padding: 6px 10px 4px; line-height: 16px; }

/* ── searches: list + study panel ── */
.study { display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; min-height: 640px; }
.slist { border-right: 1px solid var(--line); overflow-y: auto; }
.slist .sec { padding: 14px 16px 6px; display: block; }
.slist details > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.slist details > summary::-webkit-details-marker { display: none; }
.slist details > summary::before { content: "›"; color: var(--dim); }
.slist details[open] > summary::before { content: "⌄"; }
.sitem { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 6px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; color: var(--text); }
.sitem:hover { background: var(--raised); }
.sitem[aria-current="true"] { background: var(--raised); }
.sitem .t { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sitem[aria-current="true"] .t { font-weight: 600; }
.sitem .n { width: 64px; text-align: right; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.sitem .d { width: 64px; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
.sdetail { padding: 20px 24px 28px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.sdetail .head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.sdetail .head h2 { font-size: 20px; line-height: 26px; }
.sdetail .kicker { font-size: 12px; color: var(--dim); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.kpi span { display: block; font-size: 12px; color: var(--dim); }
.kpi b { font-size: 20px; line-height: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.plot { width: 100%; height: auto; display: block; }
.plot text { font: 11px var(--ui); fill: var(--dim); }
.plot .grid { stroke: var(--line); }
.plot .line { stroke: var(--accent); fill: none; stroke-width: 2; }
.plot .pt { fill: var(--accent); }
.plot .base { stroke: var(--warn); stroke-dasharray: 5 4; }
.plot .basel { fill: var(--warn); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 16px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) 120px; gap: 10px; align-items: center; }
.bar-row .lbl { font-size: 12px; color: var(--dim); }
.bar-row .tracks { display: grid; gap: 3px; }
.bar-row .tr { height: 6px; border-radius: 3px; background: transparent; overflow: hidden; }
.bar-row .tr i { display: block; height: 100%; border-radius: 3px; }
.bar-row .tr.s i { background: var(--line2); } .bar-row .tr.b i { background: var(--accent); }
.bar-row .val { text-align: right; font: 12px var(--ui); color: var(--muted); white-space: pre; font-variant-numeric: tabular-nums; }
.spark { width: 140px; height: 36px; display: block; }
.decisions { display: grid; gap: 6px; }
.decision { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
.decision img { width: 20px; height: 20px; border-radius: 50%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.approve { padding: 14px 16px; display: grid; gap: 10px; }
.approve h3 { font-size: 13px; }

/* ── runs ── */
.run, .mrun { padding: 12px 16px; display: grid; gap: 8px; }
.run .top, .mrun .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.run .top b, .mrun .top b { font-weight: 500; }
.run .facts, .mrun .facts { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.run .facts b { color: var(--text); font-weight: 500; }
.mrun q { color: var(--muted); font-style: italic; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 12px var(--mono); padding: 2px 7px; border-radius: 4px; background: var(--raised); color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.frow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); }
.frow:first-of-type { border-top: 0; }
.item { display: flex; align-items: center; gap: 14px; }

/* ── sheets: New run, install ── */
.sheetwrap { position: fixed; inset: 0; z-index: 40; background: rgba(8,10,14,0.5); display: grid; justify-items: center; align-items: start; padding: 72px 16px 16px; overflow-y: auto; }
.sheet { width: min(640px, 100%); min-width: 0; background: var(--surface); border: 1px solid var(--line2); border-radius: 12px; box-shadow: var(--shadow); padding: 20px 24px 22px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.sheet.wide { width: min(760px, 100%); }
.sheet > * { min-width: 0; }
.sheet h2 { font-size: 16px; }
.step { display: grid; gap: 8px; min-width: 0; padding-top: 12px; border-top: 1px solid var(--line); }

        var pl = ccrPayload(r), id = pl.session_id || pl.id || (pl.session && pl.session.id);
        return id ? link("https://claude.ai/code/" + id, "open the session") : null;
      }, function (e) { mcpError(e); throw "Claude Code Remote failed (" + ((e && e.code) || "error") + ")."; });
    });
  }
  function startTask(p) {
    out("starting…", "dim");
    (T.env ? Promise.resolve(T.env) : envs(null, true)).then(function (env) {
      if (!env) return;
      var input = { prompt: p, title: "Compute console: " + p.replace(/\s+/g, " ").slice(0, 60), environment_id: env.environment_id, source_url: "https://github.com/" + (DATA.repo || "froglet-studio/Cosmic-Shore") };
      if (DATA.branch && DATA.branch !== "HEAD") input.source_revision = DATA.branch;
      return CAP.mcp.callTool(CCR, "create_session", input).then(function (r) {
        var pl = ccrPayload(r), id = pl.session_id || pl.id || (pl.session && pl.session.id);
        if (id) out([{ t: "started ", c: "ok" }, link("https://claude.ai/code/" + id, id)]); else out([{ t: "started", c: "ok" }, { t: " · " + JSON.stringify(pl).slice(0, 300), c: "dim" }]);
        out("`sessions` shows how it is doing", "dim");
      }, mcpError);
    });
  }
  function sessions() {
    if (!CAP.mcp) return out("sessions need the claude.ai console (Claude Code Remote)", "err");
    out("reading…", "dim");
    CAP.mcp.callTool(CCR, "list_sessions", { limit: 8, mine: true }).then(function (r) {
      var rows = ccrPayload(r).data || []; if (!rows.length) return out("no sessions", "dim");
      rows.forEach(function (s) { var st = String(s.status_bucket || s.session_status || "").replace(/^SESSION_STATUS_(BUCKET_)?/, "").toLowerCase();
        out([{ t: pad(st, 11), c: st === "working" ? "ok" : (st === "failed" ? "err" : "dim") }, link("https://claude.ai/code/" + s.id, pad(s.title || s.id, 44)), { t: "  " + (s.updated_at || "").slice(0, 16).replace("T", " "), c: "dim" }]);
        if (s.post_turn_summary && s.post_turn_summary.recent_action) out([{ t: "           " + s.post_turn_summary.recent_action, c: "dim" }]); });
    }, mcpError);
  }
  function complete(v) {
    var parts = v.split(/\s+/), names = Object.keys(CMDS).filter(function (n) { return ["yes", "no"].indexOf(n) < 0; });
    if (parts.length === 1) { var m = names.filter(function (n) { return n.indexOf(parts[0]) === 0; }); if (m.length === 1) return m[0] + " "; if (m.length) out(m.join("  "), "dim"); return v; }
    if (["job", "open", "approve", "decline"].indexOf(parts[0]) >= 0) {
      var pool = DATA.jobs.map(function (j) { return j.id; }).concat(parts[0] === "open" ? VIEWS : []);
      var mm = pool.filter(function (n) { return n.indexOf(parts[1] || "") === 0; }); if (mm.length === 1) return parts[0] + " " + mm[0] + " "; if (mm.length) out(mm.join("  "), "dim");
    }
    return v;
  }
  function run(raw) {
    var line = raw.trim(); out([prompt(), " " + line]); if (!line) return;
    T.hist.push(line); T.hi = T.hist.length;
    var args = line.match(/"[^"]*"|'[^']*'|\S+/g).map(function (a) { return a.replace(/^["']|["']$/g, ""); }), cmd = args.shift().toLowerCase();
    if (T.pending && cmd !== "yes" && cmd !== "no") { T.pending = null; out("(the waiting task was cancelled)", "dim"); }
    if (!DATA && ["help", "clear"].indexOf(cmd) < 0) return out("the data has not loaded", "err");
    var fn = CMDS[cmd]; if (fn) { try { fn(args, line); } catch (e) { out(String(e && e.message || e), "err"); } } else out("command not found: " + cmd + " · `help`", "err");
  }
  function buildTerm() {
    T.out = document.getElementById("tout");
    document.getElementById("term").appendChild(h("div", { class: "tin" }, [prompt(), h("input", { id: "tin", type: "text", autocomplete: "off", autocapitalize: "off", spellcheck: "false", "aria-label": "Terminal input" })]));
    T.input = document.getElementById("tin");
    T.input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { var v = T.input.value; T.input.value = ""; run(v); }
      else if (e.key === "ArrowUp") { if (T.hi > 0) { T.hi--; T.input.value = T.hist[T.hi] || ""; } e.preventDefault(); }
      else if (e.key === "ArrowDown") { if (T.hi < T.hist.length) { T.hi++; T.input.value = T.hist[T.hi] || ""; } e.preventDefault(); }
      else if (e.key === "Tab") { e.preventDefault(); if (DATA) T.input.value = complete(T.input.value); }
      else if (e.key === "l" && e.ctrlKey) { e.preventDefault(); CMDS.clear(); }
    });
    T.out.addEventListener("click", function () { if (!window.getSelection().toString()) T.input.focus(); });
    out([{ t: "Froglet Compute", c: "b" }, { t: "  ·  type ", c: "dim" }, { t: "help", c: "hl" }, { t: " for commands", c: "dim" }]);
  }
  function refreshPrompt() { var p = document.querySelector(".tin .p"); if (p) p.replaceWith(prompt()); }
  function toggleTerm(force) {
    var t = document.getElementById("term"), show = force == null ? t.hidden : force;
    t.hidden = !show; if (show) setTimeout(function () { T.input.focus(); }, 0);
    var n = document.getElementById("nav-term"); if (show) n.setAttribute("aria-current", "page"); else n.removeAttribute("aria-current");
  }

  // ── capabilities (claude.ai only; the page works without them) ──
  function connect() {
    if (!window.claude || !window.claude.use) { CAP.ready = true; return; }
    var u = window.claude.use.bind(window.claude);
    u("sample").then(function (s) { CAP.sample = s; });
    u("mcp").then(function (m) { CAP.mcp = m; });
    Promise.all([u("db"), u("user")]).then(function (r) {
      CAP.db = r[0]; CAP.user = r[1]; CAP.ready = true;
      if (!CAP.user) { if (OPEN) renderDrawer(); return; }
      CAP.user.me().then(function (me) {
        CAP.me = me; refreshPrompt();
        var first = (me.name || "").split(/\s+/)[0].toLowerCase(), core = ((DATA && DATA.core) || []).map(function (c) { return c.toLowerCase(); });
        CAP.canApprove = !me.id ? false : (first ? core.indexOf(first) >= 0 : null);
        if (OPEN) renderDrawer();
      });
      if (!CAP.db) return;
      CAP.db.collection("approvals").onSnapshot(function (snap) { var a = {}; snap.docs.forEach(function (d) { a[d.id] = ((d.data() || {}).decisions) || {}; }); CAP.approvals = a; if (DATA && TI < 0) render(); if (OPEN) renderDrawer(); }, function () {});
      CAP.db.collection("outbox").onSnapshot(function (snap) { var a = {}; snap.docs.forEach(function (d) { a[d.id] = d.data() || {}; }); CAP.outbox = a; if (DATA && TI < 0 && VIEW === "runs" && document.getElementById("sheet").hidden) render(); }, function () {});
      CAP.db.collection("sent").onSnapshot(function (snap) { var a = {}; snap.docs.forEach(function (d) { a[d.id] = d.data() || {}; }); CAP.sent = a; if (DATA && TI < 0 && VIEW === "runs" && document.getElementById("sheet").hidden) render(); }, function () {});
      CAP.db.collection("processed").onSnapshot(function (snap) { var a = {}; snap.docs.forEach(function (d) { a[d.id] = d.data() || {}; }); CAP.processed = a; if (OPEN) renderDrawer(); }, function () {});
    });
  }

  // ── routing and boot ──
  function render() {
    var root = document.getElementById("main"); root.textContent = "";
    renderChrome();
    ({ home: renderHome, runs: renderRuns, searches: renderSearches, machines: renderMachines, recordings: renderRecordings, ai: renderAi })[VIEW](root);
    if (!LIVE) root.appendChild(h("p", { class: "note foot", text: "Snapshot of " + new Date(DATA.generated * 1000).toLocaleString() + (DATA.sync_every ? " · updates every " + DATA.sync_every : "") }));
  }
  function route() {
    var v = (location.hash || "").replace("#", "");
    if (v === "queue") v = "searches";
    if (v === "terminal") { toggleTerm(true); return; }
    VIEW = VIEWS.indexOf(v) >= 0 ? v : "home";
    if (DATA) render();
    document.getElementById("scroll").scrollTop = 0;
  }
  window.addEventListener("hashchange", route);
  document.getElementById("nav-term").addEventListener("click", function (e) { e.preventDefault(); toggleTerm(); });
  document.getElementById("sb-term").addEventListener("click", function () { toggleTerm(); });
  document.getElementById("t-close").addEventListener("click", function () { toggleTerm(false); });
  document.getElementById("t-clear").addEventListener("click", function () { CMDS.clear(); });
  document.getElementById("t-tall").addEventListener("click", function (e) { var t = document.getElementById("term"); t.classList.toggle("tall"); e.target.textContent = t.classList.contains("tall") ? "Shrink" : "Expand"; });
  document.getElementById("l-red").addEventListener("click", function () { if (TI >= 0) endTour(); else if (!document.getElementById("sheet").hidden) closeInstall(); else if (OPEN) closeJob(); else toggleTerm(false); });
  document.getElementById("l-yellow").addEventListener("click", function () { document.getElementById("win").classList.toggle("nosidebar"); });
  document.getElementById("l-green").addEventListener("click", function () { document.getElementById("win").classList.toggle("zoomed"); });
  document.getElementById("b-install").addEventListener("click", openInstall);
  document.getElementById("b-tour").addEventListener("click", function () { startTour(0); });
  document.getElementById("b-newrun").addEventListener("click", function () { openNewRun(); });
  document.getElementById("b-menu").addEventListener("click", function (e) { e.stopPropagation(); document.getElementById("win").classList.toggle("menu-open"); });
  document.getElementById("nav").addEventListener("click", function (e) { if (e.target.closest("a, button")) document.getElementById("win").classList.remove("menu-open"); });
  document.addEventListener("click", function (e) {
    var w = document.getElementById("win"); if (w.classList.contains("menu-open") && !e.target.closest("#nav")) w.classList.remove("menu-open");
    if (MMENU && !e.target.closest(".menuwrap")) { MMENU = null; if (VIEW === "machines") render(); }
  });
  document.getElementById("scrim").addEventListener("click", closeJob);
  document.getElementById("sheet").addEventListener("click", function (e) { if (e.target.id === "sheet") closeInstall(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && MMENU) { MMENU = null; render(); return; }
    if (e.key === "Escape") { if (TI >= 0) endTour(); else if (!document.getElementById("sheet").hidden) closeInstall(); else if (OPEN) closeJob(); }
    if (TI >= 0 && e.key === "ArrowRight") { TI++; showStep(); }
    if (TI >= 0 && e.key === "ArrowLeft" && TI > 0) { TI--; showStep(); }
    if ((e.metaKey && e.key.toLowerCase() === "j") || (e.ctrlKey && e.key === "`")) { e.preventDefault(); toggleTerm(); }
  });
  window.addEventListener("resize", function () { if (TI >= 0) showStep(); });
  buildTerm();
  route();
  fetch("console.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then(function (d) {
    DATA = d; render(); connect(); goLive();
    if (!lsGet("fc-tour")) setTimeout(function () { startTour(0); }, 400);
  }).catch(function (e) {
    var root = document.getElementById("main"); root.textContent = "";
    root.appendChild(h("div", { class: "banner bad" }, [h("b", { text: "The data did not load" }), h("p", { class: "note", text: "This page reads console.json from its own folder (" + e.message + "). Build it with python3 Tools/Compute/compute.py console and publish both files together." })]));
    document.getElementById("fresh").textContent = "no data";
  });
})();
</script>
