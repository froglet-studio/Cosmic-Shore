<title>Froglet Tasks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a lists sidebar (Reminders) beside an issue list (GitHub); a ticket opens as a page sheet (Notion); a helper chat floats bottom right. */
:root {
  --bg: #ffffff; --side: #f3f5f4; --panel: #ffffff; --fg: #1b1f1d; --muted: #66706b; --faint: #98a19c;
  --line: #e2e7e4; --hover: #eef2f0; --sel: #e1ece6; --chip: #edf1ef;
  --accent: #1f7a52; --accent-fg: #ffffff; --accent-soft: #dcefe5;
  --open: #1a7f37; --live: #b06a00; --done: #7b52d1; --arch: #8a928e; --p1: #cf222e; --p2: #b06a00; --info: #2563c9;
  --shadow: 0 12px 40px rgba(16, 32, 24, .16); --scrim: rgba(16, 24, 20, .28);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171a19; --side: #1e2221; --panel: #1c201f; --fg: #e6eae8; --muted: #9aa39f; --faint: #6c7571;
  --line: #2c3230; --hover: #242928; --sel: #263a30; --chip: #252a29;
  --accent: #4cc38a; --accent-fg: #0b1c13; --accent-soft: #1f3a2c;
  --open: #3fb950; --live: #e0a23a; --done: #a68af0; --arch: #7d8682; --p1: #ff6b6b; --p2: #e0a23a; --info: #6ea8ff;
  --shadow: 0 12px 40px rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #171a19; --side: #1e2221; --panel: #1c201f; --fg: #e6eae8; --muted: #9aa39f; --faint: #6c7571;
  --line: #2c3230; --hover: #242928; --sel: #263a30; --chip: #252a29;
  --accent: #4cc38a; --accent-fg: #0b1c13; --accent-soft: #1f3a2c;
  --open: #3fb950; --live: #e0a23a; --done: #a68af0; --arch: #7d8682; --p1: #ff6b6b; --p2: #e0a23a; --info: #6ea8ff;
  --shadow: 0 12px 40px rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .5); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); font-size: 12px; }
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100%; }

/* Sidebar */
.side { background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
  padding-block: 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
.brand svg { flex: none; }
.brand b { font-size: 15px; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: 12px; display: block; }
.search { position: relative; }
.search input { width: 100%; box-sizing: border-box; padding: 7px 10px 7px 30px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { text-align: left; border: 0; background: var(--bg); border-radius: 12px; padding: 9px 10px; cursor: pointer; display: grid;
  grid-template-columns: auto 1fr; column-gap: 8px; align-items: center; box-shadow: 0 0 0 1px var(--line) inset; }
.tile .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: var(--accent-fg); }
.tile .n { font-size: 20px; font-weight: 700; justify-self: end; font-variant-numeric: tabular-nums; }
.tile .l { grid-column: 1 / -1; color: var(--muted); font-weight: 600; font-size: 12.5px; margin-top: 4px; }
.tile[aria-current="true"] { background: var(--accent); box-shadow: none; }
.tile[aria-current="true"] .l, .tile[aria-current="true"] .n { color: var(--accent-fg); }
.tile[aria-current="true"] .dot { background: var(--accent-fg) !important; color: var(--accent); }
.group-h { font-size: 11.5px; font-weight: 700; color: var(--muted); padding: 0 8px 4px; letter-spacing: .02em; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav button { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 6px 8px; border-radius: 8px; cursor: pointer; text-align: left; }
.nav button:hover { background: var(--hover); }
.nav button[aria-current="true"] { background: var(--sel); font-weight: 600; }
.nav .ic { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; color: var(--accent-fg); flex: none; font-size: 10px; font-weight: 700; }
.nav .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .c { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: 12px; padding: 0 6px; }
.base-pill { display: flex; align-items: center; gap: 6px; }
.base-pill .mono { color: var(--fg); background: var(--chip); padding: 1px 6px; border-radius: 5px; }
.btn { border: 1px solid var(--line); background: var(--bg); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; text-decoration: none; color: var(--fg); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); background: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: none; }
.btn.small { padding: 3px 9px; font-size: 12.5px; }

/* Main */
.main { overflow-y: auto; min-width: 0; }
.main-in { max-width: 1000px; margin: 0 auto; padding-block: 22px 96px; padding-left: max(16px, 28px); padding-right: max(16px, env(safe-area-inset-right, 0px), 28px); }
.head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
.head .count { font-size: 28px; font-weight: 700; color: var(--accent); margin-left: auto; font-variant-numeric: tabular-nums; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 72ch; }
.menu-btn, .filter-btn { display: none; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 18px 0 8px; }
.toolbar label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
.toolbar select, .field select, .field input, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 8px; }
.toolbar select { max-width: 170px; }
.tb-right { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.chip-clear { border: 0; background: none; color: var(--accent); cursor: pointer; font-weight: 600; font-size: 12.5px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.cards { display: grid; gap: 12px; margin-top: 16px; }
.cards.info { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); align-items: start; }
.cmds, .rules { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.cmd { display: grid; gap: 2px; min-width: 0; }
.cmd-top { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; min-width: 0; }
.cmd code { font-family: var(--mono); font-size: 12.5px; background: var(--chip); padding: 1px 6px; border-radius: 5px; overflow-wrap: anywhere; }
.rules li { padding-left: 14px; position: relative; max-width: 72ch; }
.rules li::before { content: ""; position: absolute; left: 0; top: .6em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.banner { margin-top: 14px; border-radius: 10px; padding: 10px 14px; background: var(--accent-soft); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.list { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.list + .list { margin-top: 14px; }
.ghead { width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 14px; border: 0; background: var(--side); cursor: pointer; text-align: left; font-weight: 600; border-bottom: 1px solid var(--line); }
.ghead .c { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.ghead .chev { transition: transform .15s; color: var(--muted); }
.ghead[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.row { width: 100%; display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 14px; border: 0;
  border-top: 1px solid var(--line); background: var(--bg); text-align: left; cursor: pointer; }
.list > .row:first-child, .ghead + .row { border-top: 0; }
.row:hover { background: var(--hover); }
.row[aria-current="true"] { background: var(--sel); }
.row .st { margin-top: 2px; }
.row .title { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .meta { grid-column: 2; color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.row .right { grid-row: 1 / span 2; grid-column: 3; display: flex; align-items: flex-start; gap: 6px; }
.why-you { color: var(--info); }
.more { width: 100%; border: 0; border-top: 1px solid var(--line); background: var(--bg); color: var(--accent); font-weight: 600; padding: 9px; cursor: pointer; }
.more:hover { background: var(--hover); }
.label { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 600; background: var(--chip); color: var(--muted); white-space: nowrap; }
.label.p1 { color: var(--p1); background: color-mix(in srgb, var(--p1) 12%, transparent); }
.label.p2 { color: var(--p2); background: color-mix(in srgb, var(--p2) 13%, transparent); }
.label.live { color: var(--live); background: color-mix(in srgb, var(--live) 13%, transparent); }
.label.ms { color: var(--accent); background: var(--accent-soft); }
.label.pending { color: var(--done); background: color-mix(in srgb, var(--done) 12%, transparent); }
.label.info { color: var(--info); background: color-mix(in srgb, var(--info) 12%, transparent); }
.soon { color: var(--p2); font-weight: 600; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }
.empty b { color: var(--fg); display: block; margin-bottom: 4px; font-size: 15px; }

/* Board view: cards in columns (Group by picks the columns) */
.viewsw { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin-left: 12px; align-self: center; }
.viewsw button { border: 0; background: var(--bg); padding: 5px 12px; font-weight: 600; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.viewsw button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.col { background: var(--side); border-radius: 14px; padding: 10px; display: grid; gap: 8px; min-width: 0; }
.col-h { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; font-weight: 700; }
.col-h .dotc { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.col-h .c { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; margin-left: auto; }
.tcard { text-align: left; border: 0; background: var(--panel); border-radius: 12px; padding: 11px 12px 10px; cursor: pointer; display: grid; gap: 7px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 0 0 1px var(--line); transition: transform .12s, box-shadow .12s; }
.tcard:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0, 0, 0, .08), 0 0 0 1px var(--line); }
.tcard[aria-current="true"] { box-shadow: 0 0 0 2px var(--accent); }
.tcard .tt { font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tcard .chips { display: flex; flex-wrap: wrap; gap: 5px; }
.tcard .foot { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.tcard .foot .mono { font-size: 11px; }
.clock { flex: 1; height: 4px; border-radius: 2px; background: var(--chip); overflow: hidden; }
.clock i { display: block; height: 100%; border-radius: 2px; background: var(--open); }
.clock.warn i { background: var(--p2); }
.avatar { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--accent-fg); background: var(--live); flex: none; }
.col .more { border-radius: 10px; border: 0; background: none; }

/* Graph strip */
.graphs { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1.3fr); gap: 12px; margin: 16px 0 6px; }
.gcard { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; display: grid; gap: 6px; align-content: start; }
.gcard h3 { margin: 0; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.gcard .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.gcard .delta { font-size: 12.5px; font-weight: 600; }
.gcard svg { width: 100%; height: auto; display: block; overflow: visible; }
.rings { display: flex; gap: 10px; flex-wrap: wrap; }
.ring { display: grid; justify-items: center; gap: 2px; font-size: 11.5px; color: var(--muted); }
.ring b { color: var(--fg); font-size: 12px; }
.donut-row { display: flex; gap: 12px; align-items: center; }
.gcard .donut-row svg { width: 76px; flex: none; }
.gcard .ring svg { width: 56px; }
.donut-legend { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.donut-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* Branches */
.pipe { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.pipe .stage { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-family: var(--mono); font-size: 12.5px; background: var(--bg); }
.pipe .stage.now { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 700; }
.pipe .arrow { color: var(--faint); }
.brow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--bg); }
.list > .brow:first-child { border-top: 0; }
.brow .name { font-family: var(--mono); font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.brow .meta { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.brow .side-n { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; }

/* Milestones */
.ms { display: grid; gap: 8px; }
.ms-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ms-top .key { font-family: var(--mono); font-weight: 700; color: var(--accent); }
.ms-top b { font-size: 16px; }
.ms-top .due { margin-left: auto; color: var(--muted); font-size: 12.5px; }
.prog { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.prog .track { flex: 1; height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.prog .track i { display: block; height: 100%; background: var(--accent); }
.gate { font-weight: 600; }
.fields { display: grid; gap: 10px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.field input, .field textarea, .field select { width: 100%; box-sizing: border-box; padding: 7px 10px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Insights */
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.stat .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .k { color: var(--muted); font-size: 12.5px; font-weight: 600; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.chart h3, .card h3 { margin: 0 0 10px; font-size: 13px; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 34px; gap: 8px; align-items: center; font-size: 12.5px; }
.bar .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.bar .t { height: 10px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.bar .t i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; color: var(--muted); font-size: 12px; margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.merged { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; }
.merged li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; }
.merged .d { color: var(--muted); font-variant-numeric: tabular-nums; }

/* Feedback */
.fb-list { display: grid; gap: 10px; margin-top: 16px; }
.fb { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.fb .who { color: var(--muted); font-size: 12.5px; }
.fb p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Ticket sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--panel); box-shadow: var(--shadow); z-index: 21;
  display: flex; flex-direction: column; border-left: 1px solid var(--line); }
.sheet-bar { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sheet-bar .mono { color: var(--muted); }
.sheet-bar .sp { flex: 1; }
.sheet-body { overflow-y: auto; padding: 22px max(16px, env(safe-area-inset-right, 0px), 28px) calc(40px + env(safe-area-inset-bottom, 0px)) 28px; display: grid; gap: 22px; align-content: start; }
.sheet h2 { margin: 0; font-size: 23px; line-height: 1.25; letter-spacing: -.015em; text-wrap: balance; }
.props { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 2px 12px; margin: 0; }
.props dt { color: var(--muted); padding: 6px 0; }
.props dd { margin: 0; padding: 4px 0; min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.props select { border: 1px solid transparent; background: none; border-radius: 6px; padding: 3px 6px; margin-left: -6px; cursor: pointer; font-weight: 600; }
.props select:hover:not(:disabled), .props select:focus { border-color: var(--line); background: var(--bg); }
.props select:disabled { cursor: default; }
.by { color: var(--faint); font-size: 12px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.sec h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; }
.check .box { flex: none; width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--faint); margin-top: 2px; display: grid; place-items: center; }
.check.done .box { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.check.done span { color: var(--muted); text-decoration: line-through; }
.prose { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 72ch; }
.prose code, .check code, .msg code { font-family: var(--mono); font-size: 12.5px; background: var(--chip); padding: 0 4px; border-radius: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.form { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.form input, .form textarea, .form select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; width: 100%; box-sizing: border-box; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.note { border-radius: 10px; padding: 10px 12px; background: var(--chip); color: var(--muted); font-size: 13px; }
.history { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; color: var(--muted); font-size: 13px; }
.ai { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }

/* Helper chat */
.chat-btn { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 15;

function load(k, d) { try { const v = localStorage.getItem("froglet-tasks." + k); return v ? JSON.parse(v) : d; } catch { return d; } }

const msName = (k) => (milestones().find((m) => m.key === k) || {}).name || "";

/* ---- the effective ticket: the synced issue, plus anything done here since the last sync ---- */
const newer = (doc, t) => !!doc && (doc.at || "") > (t.syncedAt || "");
function headline(task) {

function myTickets(T) {

  const mine = new Set([...S.takes.values()].filter((d) => d.byId && d.byId === S.meId).map((d) => d.id));

/* ---- lists ---- */
function listDef(key) {

const PR = { P1: 1, P2: 2, P3: 3 };

    <div><div class="group-h">Departments</div><div class="nav">${Object.entries(DEPTS).map(([k, l]) =>
      `<button data-list="dept:${k}" aria-current="${S.list === "dept:" + k}"><span class="ic" style="background:${DEPT_COLORS[k]}">${l[0]}</span><span class="t">${esc(l)}</span><span class="c">${n((t) => isOpen(t) && t.dept === k)}</span></button>`).join("")}</div></div>
    <div class="nav"><button data-list="archive" aria-current="${S.list === "archive"}"><span class="ic" style="background:var(--arch)">${ICON.archive}</span><span class="t">Archive</span><span class="c">${n((t) => t.state === "done" || t.state === "archived")}</span></button></div>
    <div class="side-foot">
      <button class="btn primary" data-act="new" type="button">New task</button>
      <span class="base-pill">Sessions start from <span class="mono">${esc(base())}</span></span>
      <span>${esc(phase())} · ${esc(sync)}${mcp ? ` · <button class="chip-clear" data-act="sync-now" type="button" ${S.syncing ? "disabled" : ""}>${S.syncing ? "Sync started" : "Sync now"}</button>` : ""}</span>
    </div>`;
  const q = side.querySelector("#q");
  q.addEventListener("input", () => { S.q = q.value; S.shown = 50; if (PAGES.includes(S.list)) S.list = "open"; renderMain(true); });
}

function rowHtml(t) {
  const prio = t.priority === "P1" ? `<span class="label p1">P1</span>` : t.priority === "P2" ? `<span class="label p2">P2</span>` : "";
  const ms = t.milestone && !S.list.startsWith("ms:") ? `<span class="label ms">${esc(t.milestone)}</span>` : "";

  const when = t.state === "open" && t.daysLeft !== null && t.daysLeft <= 7
    ? `<span class="${t.daysLeft <= 4 ? "soon" : ""}">${t.daysLeft <= 0 ? "archives today" : `archives in ${t.daysLeft} day${t.daysLeft === 1 ? "" : "s"}`}</span>` : "";
  const closed = t.state === "done" ? `<span>done ${esc(fmtDay(t.done))}</span>` : t.state === "archived" ? `<span>archived ${esc(fmtDay(t.archived))}</span>` : "";
  const why = t.why ? `<span class="why-you">${esc(t.why)}</span>` : "";
  return `<button class="row" data-open="${esc(t.id)}" aria-current="${S.open === t.id}">${stateIcon(t)}
    <span class="title">${esc(t.head)}</span><span class="right">${prio}${ms}</span>
    <span class="meta"><span class="mono">${esc(t.id)}</span><span>${esc(t.area)}</span>${live}${when}${closed}${why}${pend}</span></button>`;
}

function headHtml(title, count, sub, mono) {
  return `<div class="head"><button class="btn menu-btn" data-act="menu" type="button" aria-label="Show lists">Lists</button><h1 class="${mono ? "mono" : ""}" style="${mono ? "font-size:22px" : ""}">${esc(title)}</h1>${count !== "" ? `<span class="count">${count}</span>` : ""}</div>${sub ? `<p class="sub">${sub}</p>` : ""}`;
}

function renderMain(force) {
  const host = document.getElementById("mainIn");
  if (!force && inUse(host)) return;
  if (PAGES.includes(S.list)) { host.innerHTML = ({ branches: pageBranches, milestones: pageMilestones, insights: pageInsights, feedback: pageFeedback, suggested: pageSuggested, info: pageInfo })[S.list](); bindPage(host); return; }
  const def = listDef(S.list);
  const L = visible();
  const total = def.foryou ? L : all().filter(def.test);
  const areas = [...new Set(total.map((t) => t.area))].sort();
  const froms = [...new Set(total.map((t) => t.filedOn).filter(Boolean))].sort();
  const filtered = S.q || S.area || S.kind || S.from;
  let body;
  if (!S.loaded) {
    body = `<div class="empty"><b>${S.error ? "The board could not load" : db === null && S.ready ? "Open this page in claude.ai" : "Loading tickets"}</b>${S.error ? esc(S.error) : db === null && S.ready ? "The tickets live in this page's shared store, which only claude.ai serves." : "Reading the team's tickets."}</div>`;
  } else if (!S.tasks.size) {
    body = `<div class="empty"><b>No tickets yet</b>A Claude session fills this board from GitHub Issues with <span class="mono">/team-tasks sync</span>.</div>`;
  } else if (!L.length) {
    body = `<div class="empty"><b>${filtered ? "No ticket matches" : def.foryou ? "Nothing to suggest yet" : "Nothing here"}</b>${filtered ? "Clear the filters to see the whole list." : def.foryou ? "Take a ticket and this list learns what you work on." : esc(def.sub)}</div>`;
  } else if (S.view === "board" && !def.foryou) {
    body = boardHtml(L);
  } else if (S.group !== "none" && GROUPS[S.group] && !def.foryou) {
    const g = new Map();
    for (const t of L) { const k = GROUPS[S.group].key(t); if (!g.has(k)) g.set(k, []); g.get(k).push(t); }
    const keys = [...g.keys()].sort((a, b) => g.get(b).length - g.get(a).length || a.localeCompare(b));
    body = keys.map((k) => {
      const rows = g.get(k); const open = S.expanded.has(S.group + ":" + k); const show = open ? rows : rows.slice(0, 5);
      return `<div class="list"><button class="ghead" data-group="${esc(S.group + ":" + k)}" aria-expanded="${open}">
        <svg class="chev" width="12" height="12" viewBox="0 0 12 12"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        <span>${esc(k)}</span><span class="c">${rows.length}</span></button>${show.map(rowHtml).join("")}
        ${!open && rows.length > 5 ? `<button class="more" data-group="${esc(S.group + ":" + k)}">Show all ${rows.length}</button>` : ""}</div>`;
    }).join("");
  } else {
    body = `<div class="list">${L.slice(0, S.shown).map(rowHtml).join("")}${L.length > S.shown ? `<button class="more" data-act="more">Show ${Math.min(50, L.length - S.shown)} more of ${L.length - S.shown}</button>` : ""}</div>`;
  }
  const mine = [...S.fresh.values()].filter((d) => d.byId === S.meId);
  const banner = S.list === "open" && mine.length ? `<div class="banner">${mine.length} task${mine.length === 1 ? "" : "s"} you filed here ${mine.length === 1 ? "is" : "are"} waiting for the next sync to reach GitHub. <button class="btn small" data-list="suggested">See ${mine.length === 1 ? "it" : "them"}</button></div>` : "";
  const opt = (v, l, cur) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(l)}</option>`;
  const switcher = def.foryou ? "" : `<span class="viewsw" role="group" aria-label="View"><button data-act="view-board" aria-pressed="${S.view === "board"}">Board</button><button data-act="view-list" aria-pressed="${S.view === "list"}">List</button></span>`;
  const graphs = S.loaded && S.tasks.size && (S.list === "open" || S.list === "live") ? graphsHtml() : "";
  host.innerHTML = `${headHtml(def.title, L.length, esc(def.sub), def.mono).replace('<span class="count">', switcher + '<span class="count">')}${graphs}${banner}
    <div class="head" style="margin-top:6px"><button class="btn filter-btn small" data-act="filters" type="button">${filtered ? "Filters on" : "Filter and sort"}</button></div>
    <div class="toolbar" data-open="${S.filters}">
      <label>Area <select id="fArea">${opt("", "All", S.area)}${areas.map((a) => opt(a, a, S.area)).join("")}</select></label>
      <label>Kind <select id="fKind">${opt("", "All", S.kind)}${KINDS.map((k) => opt(k, k, S.kind)).join("")}</select></label>
      <label>From <select id="fFrom">${opt("", "Any branch", S.from)}${froms.map((b) => opt(b, b, S.from)).join("")}</select></label>
      ${filtered ? `<button class="chip-clear" data-act="clear" type="button">Clear</button>` : ""}
      ${def.foryou ? "" : `<span class="tb-right"><label>Sort <select id="fSort">${opt("priority", S.list === "archive" ? "Recently closed" : "Priority", S.sort)}${opt("expiring", "Archives soonest", S.sort)}${opt("newest", "Newest", S.sort)}${opt("oldest", "Oldest", S.sort)}</select></label>
      <label>Group <select id="fGroup">${Object.entries(GROUPS).map(([k, g]) => opt(k, g ? (S.view === "board" ? "Columns: " + g.label : g.label) : (S.view === "board" ? "Columns: Priority" : "None"), S.group)).join("")}</select></label></span>`}
    </div>${body}`;
  const on = (id, fn) => { const el = host.querySelector("#" + id); if (el) el.addEventListener("change", fn); };
  on("fArea", (e) => { S.area = e.target.value; S.shown = 50; renderMain(true); });
  on("fKind", (e) => { S.kind = e.target.value; S.shown = 50; renderMain(true); });
  on("fFrom", (e) => { S.from = e.target.value; S.shown = 50; renderMain(true); });
  on("fSort", (e) => { S.sort = e.target.value; keep("sort", S.sort); renderMain(true); });
  on("fGroup", (e) => { S.group = e.target.value; keep("group", S.group); renderMain(true); });
}

/* ---- the board: cards in columns ---- */
const initials = (n) => String(n || "?").split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
function cardHtml(t) {
  const prio = t.priority === "P1" ? `<span class="label p1">P1</span>` : t.priority === "P2" ? `<span class="label p2">P2</span>` : "";
  const ms = t.milestone ? `<span class="label ms">${esc(t.milestone)}</span>` : "";
  const kind = `<span class="label">${esc(t.kind)}</span>`;
  const pend = t.pending.length ? `<span class="label pending">syncing</span>` : "";
  let foot;
  if (t.state === "live") foot = `<span class="avatar" title="${esc(t.takenBy)}">${esc(initials(t.takenBy))}</span><span class="mono">${esc(t.branch || (t.session ? "new session" : "no branch"))}</span>`;
  else if (t.state === "open" && t.daysLeft !== null) {
    const used = Math.min(1, Math.max(0, (IDLE_DAYS - t.daysLeft) / IDLE_DAYS));
    foot = `<span class="mono">${esc(t.id.slice(2, 10).replace(/(\d{4})(\d{2})(\d{2})/, "$3/$2"))}</span><span class="clock ${t.daysLeft <= 4 ? "warn" : ""}" title="${t.daysLeft} of 14 days left before it is archived"><i style="width:${100 - used * 100}%"></i></span><span class="${t.daysLeft <= 4 ? "soon" : ""}">${Math.max(0, t.daysLeft)}d</span>`;
  } else foot = `<span>${esc(STATE_WORD[t.state] || t.state)} ${esc(fmtDay(closedOn(t)))}</span>`;
  return `<button class="tcard" data-open="${esc(t.id)}" aria-current="${S.open === t.id}"><span class="tt">${esc(t.head)}</span>
    <span class="chips">${prio}${ms}${kind}<span class="label">${esc(t.area)}</span>${pend}</span>
    <span class="foot">${foot}</span>${t.why ? `<span class="why-you" style="font-size:12px">${esc(t.why)}</span>` : ""}</button>`;
}
const COL_ORDER = { dept: Object.values(DEPTS), kind: KINDS };
function boardHtml(L) {
  const g = GROUPS[S.group] || { key: (t) => t.priority };
  const cols = new Map();
  for (const t of L) { const k = g.key(t); if (!cols.has(k)) cols.set(k, []); cols.get(k).push(t); }
  let keys = [...cols.keys()];
  const order = COL_ORDER[S.group] || (S.group === "none" ? ["P1", "P2", "P3"] : null);
  const at = (k) => (order.indexOf(k) < 0 ? 999 : order.indexOf(k));
  if (order) keys.sort((a, b) => at(a) - at(b));
  else if (S.group === "milestone") keys.sort();
  else keys.sort((a, b) => cols.get(b).length - cols.get(a).length);
  const color = (k) => ({ Testers: "var(--open)", Developers: "var(--info)", Decisions: "var(--done)", "Content & docs": "var(--live)", P1: "var(--p1)", P2: "var(--p2)", P3: "var(--arch)" })[k] || "var(--info)";
  return `<div class="board">${keys.map((k) => {
    const all_ = cols.get(k); const id = "col:" + S.group + ":" + k; const open = S.expanded.has(id); const show = open ? all_ : all_.slice(0, 20);
    return `<section class="col"><div class="col-h"><span class="dotc" style="background:${color(k)}"></span><span>${esc(k)}</span><span class="c">${all_.length}</span></div>
      ${show.map(cardHtml).join("")}${!open && all_.length > 20 ? `<button class="more" data-group="${esc(id)}">Show ${all_.length - 20} more</button>` : ""}</section>`;
  }).join("")}</div>`;
}

/* ---- the graph strip ---- */
function openOn(T, d) { return T.filter((t) => (t.filed || "").slice(0, 10) <= d && !(closedOn(t) && closedOn(t) <= d && !isOpen(t))).length; }
function areaChart(points, W = 520, H = 92) {
  const max = Math.max(1, ...points.map((p) => p.v)), min = Math.min(...points.map((p) => p.v));
  const lo = Math.max(0, min - (max - min) * 0.15), x = (i) => (i / (points.length - 1)) * W, y = (v) => H - 4 - ((H - 12) * (v - lo)) / Math.max(1, max - lo);
  const line = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const last = points[points.length - 1];
  return `<svg viewBox="0 0 ${W} ${H + 16}" role="img" aria-label="Open tickets per day">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L${W},${H} L0,${H} Z" fill="url(#ga)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(points.length - 1)}" cy="${y(last.v)}" r="4" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>
    <text x="0" y="${H + 14}" font-size="10.5" fill="var(--muted)">${fmtDay(points[0].d)}</text><text x="${W}" y="${H + 14}" font-size="10.5" fill="var(--muted)" text-anchor="end">${fmtDay(last.d)}</text></svg>`;
}
function ring(pct, label, sub) {
  const r = 22, c = 2 * Math.PI * r;
  return `<div class="ring"><svg viewBox="0 0 56 56" width="56" height="56" role="img" aria-label="${esc(label)} ${pct}% done"><circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--chip)" stroke-width="6"/>
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(c * pct) / 100} ${c}" transform="rotate(-90 28 28)"/>
    <text x="28" y="32" text-anchor="middle" font-size="12" font-weight="700" fill="var(--fg)">${pct}%</text></svg><b>${esc(label)}</b><span>${esc(sub)}</span></div>`;
}
function donut(parts) {
  const total = parts.reduce((a, p) => a + p[1], 0) || 1, r = 26, c = 2 * Math.PI * r; let off = 0;
  const segs = parts.map(([, v, col]) => { const len = (c * v) / total; const s_ = `<circle cx="34" cy="34" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" transform="rotate(-90 34 34)"/>`; off += len; return s_; }).join("");
  return `<div class="donut-row"><svg viewBox="0 0 68 68" width="76" height="76" role="img" aria-label="Open tickets by department">${segs}</svg>
    <div class="donut-legend">${parts.map(([n, v, col]) => `<span><i style="background:${col}"></i>${esc(n)} ${v}</span>`).join("")}</div></div>`;
}
function graphsHtml() {
  const T = all();
  const D = [...Array(30)].map((_, i) => addDays(today(), i - 29));
  const pts = D.map((d) => ({ d, v: openOn(T, d) }));
  const now = pts[pts.length - 1].v, wk = pts[pts.length - 8].v, delta = now - wk;
  const since7 = addDays(today(), -7);
  const filed7 = T.filter((t) => (t.filed || "") >= since7).length, done7 = T.filter((t) => t.state === "done" && closedOn(t) >= since7).length;
  const rings = milestones().filter((m) => T.some((t) => t.milestone === m.key)).slice(0, 4).map((m) => { const mine = T.filter((t) => t.milestone === m.key); const d = mine.filter((t) => t.state === "done").length, o = mine.filter(isOpen).length; return ring(d + o ? Math.round((100 * d) / (d + o)) : 0, m.key, `${o} open`); }).join("");
  const dept = Object.entries(DEPTS).map(([k, n]) => [n, T.filter((t) => isOpen(t) && t.dept === k).length, DEPT_COLORS[k]]);
  return `<div class="graphs">
    <div class="gcard"><h3>Open and live tickets, last 30 days</h3><div style="display:flex;align-items:baseline;gap:10px"><span class="big">${now}</span>
      <span class="delta" style="color:${delta > 0 ? "var(--p2)" : "var(--open)"}">${delta > 0 ? "+" : ""}${delta} this week</span><span class="by">${filed7} filed · ${done7} done in 7 days</span></div>${areaChart(pts)}</div>
    <div class="gcard"><h3>Milestones done</h3><div class="rings">${rings}</div></div>
    <div class="gcard"><h3>Open by department</h3>${donut(dept)}</div></div>`;
}

/* ---- pages ---- */
function pageBranches() {
  const B = S.branches;
  const cur = base();
  const pipe = `<div class="pipe">${PIPELINE.map((b, i) => `${i ? `<span class="arrow">→</span>` : ""}<span class="stage ${b === cur ? "now" : ""}">${esc(b)}</span>`).join("")}</div>`;
  const intro = `Every session starts from <b class="mono">${esc(cur)}</b> (${esc(phase())}). Work moves down the release plan: bleeding-edge, then development, master and release. A ticket taken on a branch closes when that branch merges into ${esc(cur)}.`;
  if (!B) return headHtml("Branches", "", intro) + pipe + `<div class="cards"><div class="empty"><b>No branch report yet</b>The next sync lists the branches with a commit in the last three weeks.</div></div>`;
  const q = S.q.trim().toLowerCase();
  const rows = B.branches.filter((b) => !q || b.name.toLowerCase().includes(q));
  const T = all();
  return headHtml("Branches", rows.length, intro + ` Checked ${esc(fmtDay(B.checked))}; branches with a commit in the last ${B.days} days.`) + pipe +
    `<div class="cards"><div class="list">${rows.map((b) => {
      const live = (b.live || []).map((id) => T.find((t) => t.id === id)).filter(Boolean);
      return `<div class="brow"><span class="name">${esc(b.name)}</span><span class="side-n">${b.ahead ? `${b.ahead} ahead of ${esc(B.base)}` : `merged into ${esc(B.base)}`}</span>
        <span class="meta"><span>last commit ${esc(fmtDay(b.last))}</span><span>${esc(b.subject)}</span>
        ${live.map((t) => `<button class="label live" data-open="${esc(t.id)}" style="border:0;cursor:pointer">${esc(t.id)} · ${esc(t.takenBy)}</button>`).join("")}
        ${b.filed ? `<button class="label" data-list="from:${esc(b.name)}" style="border:0;cursor:pointer">${b.filed} open ticket${b.filed === 1 ? "" : "s"} filed here</button>` : ""}</span></div>`;
    }).join("") || `<div class="empty">No branch matches.</div>`}</div></div>`;
}

function pageMilestones() {
  const T = all();
  const M = milestones();
  const editing = S.msEdit;
  const card = (m) => {
    const mine = T.filter((t) => t.milestone === m.key); const done = mine.filter((t) => t.state === "done").length; const open = mine.filter(isOpen).length;
    const pct = done + open ? Math.round((100 * done) / (done + open)) : 0;
    if (editing && editing.key === m.key) return formMilestone(editing);
    return `<div class="card ms"><div class="ms-top"><span class="key">${esc(m.key)}</span><b>${esc(m.name)}</b><span class="due">${m.due ? "Due " + esc(fmtDay(m.due)) : "No date set"}</span></div>
      <div class="gate">${m.gate ? "Gate: " + esc(m.gate) : "No gate after this one"}</div><p class="sub" style="margin:0">${esc(m.scope || "")}</p>
      <div class="prog"><div class="track"><i style="width:${pct}%"></i></div><span>${done} done · ${open} open</span></div>
      <div class="actions"><button class="btn small" data-list="ms:${esc(m.key)}">Open tickets</button>${S.canEdit ? `<button class="btn small ghost" data-act="ms-edit" data-key="${esc(m.key)}">Edit</button>` : ""}</div></div>`;
  };
  const settings = S.canEdit ? `<div class="card ms"><b>Where sessions start</b><p class="hint">The base branch every new session starts from and every ticket's branch merges into. Move it when the plan moves to the next phase.</p>
      <div class="two"><div class="field"><label for="setBase">Base branch</label><select id="setBase">${PIPELINE.map((b) => `<option ${b === base() ? "selected" : ""}>${esc(b)}</option>`).join("")}</select></div>
      <div class="field"><label for="setPhase">Phase</label><input id="setPhase" value="${esc(phase())}"></div></div>
      <div class="actions"><button class="btn small" data-act="save-settings">Save</button></div></div>` : "";
  return headHtml("Milestones", M.length, `From the release plan. Each milestone's gate is its exit criterion. ${S.canEdit ? "You can edit them; GitHub follows on the next sync." : "Approvers (the core four and Iggy) edit them."}`) +
    `<div class="cards">${M.map(card).join("")}${editing && editing.isNew ? formMilestone(editing) : ""}
     ${S.canEdit && !editing ? `<div><button class="btn" data-act="ms-add">Add a milestone</button></div>` : ""}${settings}</div>`;
}
function formMilestone(m) {
  return `<div class="card ms"><b>${m.isNew ? "New milestone" : "Edit " + esc(m.key)}</b><div class="fields">
    <div class="two"><div class="field"><label for="msName">Name</label><input id="msName" value="${esc(m.name || "")}"></div>
    <div class="field"><label for="msDue">Due</label><input id="msDue" type="date" value="${esc(m.due || "")}"></div></div>
    <div class="field"><label for="msGate">Gate (the exit criterion)</label><input id="msGate" value="${esc(m.gate || "")}"></div>
    <div class="field"><label for="msScope">Scope</label><textarea id="msScope" rows="3">${esc(m.scope || "")}</textarea></div></div>
    <div class="actions"><button class="btn primary small" data-act="ms-save">Save ${esc(m.key)}</button><button class="btn ghost small" data-act="ms-cancel">Cancel</button></div></div>`;

function bars(rows, max) {
  return `<div class="bars">${rows.map(([n, v]) => `<div class="bar"><span class="n" title="${esc(n)}">${esc(n)}</span><span class="t"><i style="width:${max ? (100 * v) / max : 0}%"></i></span><span class="v">${v}</span></div>`).join("")}</div>`;
}
function pageInsights() {
  const T = all();
  const open = T.filter((t) => t.state === "open"), live = T.filter((t) => t.state === "live");
  const since7 = addDays(today(), -7);
  const done7 = T.filter((t) => t.state === "done" && closedOn(t) >= since7).length;
  const filed7 = T.filter((t) => (t.filed || "") >= since7).length;
  const soon = open.filter((t) => t.daysLeft !== null && t.daysLeft <= 4).length;
  const stats = [["Open", open.length], ["Live", live.length], ["Filed, 7 days", filed7], ["Done, 7 days", done7], ["Archive within 4 days", soon]];
  // filed vs closed per day, last 21 days
  const D = [...Array(21)].map((_, i) => addDays(today(), i - 20));
  const filed = D.map((d) => T.filter((t) => (t.filed || "").slice(0, 10) === d).length);
  const closed = D.map((d) => T.filter((t) => (t.state === "done" || t.state === "archived") && closedOn(t) === d).length);
  const top = Math.max(1, ...filed, ...closed);
  const W = 640, H = 170, padL = 28, padB = 22, bw = (W - padL) / D.length;
  const y = (v) => H - padB - ((H - padB - 8) * v) / top;
  const ticks = [0, Math.ceil(top / 2), top];
  const chart = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tickets filed and closed per day, last 21 days">
    ${ticks.map((v) => `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`).join("")}
    ${D.map((d, i) => `<rect x="${padL + i * bw + 2}" y="${y(filed[i])}" width="${bw / 2 - 2}" height="${H - padB - y(filed[i])}" fill="var(--accent)" rx="1.5"><title>${fmtDay(d)}: ${filed[i]} filed</title></rect>
      <rect x="${padL + i * bw + bw / 2}" y="${y(closed[i])}" width="${bw / 2 - 2}" height="${H - padB - y(closed[i])}" fill="var(--done)" rx="1.5"><title>${fmtDay(d)}: ${closed[i]} closed</title></rect>
      ${i % 5 === 0 || i === D.length - 1 ? `<text x="${padL + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmtDay(d)}</text>` : ""}`).join("")}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>Filed</span><span><i style="background:var(--done)"></i>Done or archived</span></div>`;
  const count = (arr, f) => { const m = {}; for (const t of arr) { const k = f(t); m[k] = (m[k] || 0) + 1; } return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const openLive = T.filter(isOpen);
  const byArea = count(openLive, (t) => t.area).slice(0, 12);
  const byDept = count(openLive, (t) => DEPTS[t.dept] || t.dept);
  const byBranch = count(openLive, (t) => t.filedOn || "no branch").slice(0, 10);
  const byPrio = ["P1", "P2", "P3"].map((p) => [p, openLive.filter((t) => t.priority === p).length]);
  const ms = milestones().map((m) => { const mine = T.filter((t) => t.milestone === m.key); return [`${m.key} · ${m.name}`, mine.filter((t) => t.state === "done").length, mine.filter(isOpen).length]; });
  const merged = (S.activity && S.activity.merged) || [];
  return headHtml("Insights", "", "How the hand-offs move. Tickets and branches only: nothing here compares people.") +
    `<div class="stats">${stats.map(([k, v]) => `<div class="stat"><div class="v">${v}</div><div class="k">${esc(k)}</div></div>`).join("")}</div>
    <div class="card chart" style="margin-top:12px"><h3>Filed and closed, last 21 days</h3>${chart}</div>
    <div class="grid2">
      <div class="card chart"><h3>Open by priority</h3>${bars(byPrio, Math.max(1, ...byPrio.map((r) => r[1])))}<h3 style="margin-top:14px">Open by department</h3>${bars(byDept, Math.max(1, ...byDept.map((r) => r[1])))}</div>
      <div class="card chart"><h3>Open by area (top 12)</h3>${bars(byArea, Math.max(1, ...byArea.map((r) => r[1])))}</div>
      <div class="card chart"><h3>Milestones (done of open and done)</h3><div class="bars">${ms.map(([n, d, o]) => `<div class="bar"><span class="n" title="${esc(n)}">${esc(n)}</span><span class="t"><i style="width:${d + o ? (100 * d) / (d + o) : 0}%"></i></span><span class="v">${d}/${d + o}</span></div>`).join("")}</div></div>
      <div class="card chart"><h3>Open tickets by the branch they came from</h3>${bars(byBranch, Math.max(1, ...byBranch.map((r) => r[1])))}</div>
    </div>
    <div class="card" style="margin-top:12px"><h3>Merged into ${esc(base())}, last ${S.activity ? S.activity.days : 7} days</h3>
      ${merged.length ? `<ul class="merged">${merged.slice(0, 30).map((m) => `<li><span class="d">${esc(fmtDay(m.date))}</span><span><a href="${REPO_URL}/pull/${m.pr}" target="_blank" rel="noopener">#${m.pr}</a> ${esc(m.title || m.branch)} <span class="by mono">${esc(m.branch)}</span></span></li>`).join("")}</ul>` : `<p class="hint">The next sync lists what merged.</p>`}</div>`;
}

  if (a === "draft-drop") { S.chatDraft = null; S.chatRepaint = true; renderChat(); return; }
  if (a === "fb-send") { const txt = String(S.fbDraft || "").trim(); if (!txt) { toast("Write your feedback first."); return; } if (await write("feedback/" + shortId(), { text: txt.slice(0, 4000) }, "Thanks. Your feedback is saved.")) { S.fbDraft = ""; renderMain(); } return; }
  if (a === "sug-approve" || a === "sug-dismiss") { const id = el.dataset.id; if (await write("suggestions/" + id, { status: a === "sug-approve" ? "approved" : "dismissed", approvedBy: S.meName || "" }, a === "sug-approve" ? "Approved. It is filed on the next sync." : "Dismissed.", true)) renderMain(); return; }
  if (a === "fresh-withdraw") { try { await db.doc("new/" + el.dataset.id).delete(); toast("Withdrawn."); } catch { toast("Not withdrawn. Try again."); } return; }
  if (a === "ms-edit") { const m = milestones().find((x) => x.key === el.dataset.key); S.msEdit = { ...m }; renderMain(); return; }
  if (a === "ms-add") { const n = Math.max(0, ...milestones().map((m) => Number(m.key.slice(1)))) + 1; S.msEdit = { key: "M" + n, name: "", gate: "", scope: "", due: "", isNew: true }; renderMain(); return; }
  if (a === "ms-cancel") { S.msEdit = null; renderMain(); return; }
  if (a === "ms-save") { const m = S.msEdit; if (!String(m.name || "").trim()) { toast("Give the milestone a name."); return; }
    if (await write("milestones/" + m.key, { key: m.key, name: m.name.trim(), gate: (m.gate || "").trim(), scope: (m.scope || "").trim(), due: m.due || "" }, `${m.key} saved. GitHub follows on the next sync.`)) { S.msEdit = null; renderMain(); } return; }
  if (a === "save-settings") { const b = document.getElementById("setBase").value, p = document.getElementById("setPhase").value.trim(); if (await write("meta/settings", { base: b, phase: p || phase() }, `Sessions now start from ${b}.`)) render(); return; }
  if (!t) return;
  if (a === "copy") { const link = location.href.split("#")[0] + "#" + t.id; try { await navigator.clipboard.writeText(link); toast("Link copied"); } catch { toast(link); } }
  else if (a === "take-form") { S.form = { id: t.id, kind: "take", branch: "" }; renderSheet(); }
  else if (a === "done-form") { S.form = { id: t.id, kind: "done", note: "" }; renderSheet(); }
  else if (a === "session-form") { S.form = { id: t.id, kind: "session", env: load("env", "") }; loadEnvs(); renderSheet(); }
  else if (a === "session-start") startSession(t);
  else if (a === "cancel") { S.form = null; renderSheet(); }
  else if (a === "take") { const br = (S.form && S.form.branch || "").trim(); if (!br || /\s/.test(br)) { toast("Name the branch you do it on, without spaces."); return; } act(t.id, "take", { branch: br }, `Taken on ${br}. It closes when the branch merges.`); }
  else if (a === "done") { const note = (S.form && S.form.note || "").trim(); if (!note) { toast("Say what proved it before marking it done."); return; } act(t.id, "done", { note }, "Marked done."); }
  else if (a === "release") act(t.id, "release", {}, "Released. It is open again, nobody's.");
  else if (a === "archive") act(t.id, "archive", {}, "Archived. Bring it back from Archive.");
  else if (a === "revive") act(t.id, "revive", {}, "Back in Open, with 14 days before it is archived again.");
  else if (a === "ai") askClaude(t);
  else if (a === "ai-clear") { S.ai = null; renderSheet(); }
  else if (a === "ai-use" && S.ai && S.ai.result) { const r = S.ai.result; await override(t.id, { priority: r.priority, dept: r.dept, milestone: r.milestone && r.milestone !== "none" ? r.milestone : "none" }, "suggested by Claude: " + r.why); S.ai = null; renderSheet(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (S.open || S.sheetMode) closeTicket(); else if (S.chatOpen) { S.chatOpen = false; renderChat(); } else document.getElementById("side").dataset.open = "false"; } });
function openTicket(id) { S.open = id; S.sheetMode = null; S.form = null; try { history.replaceState(null, "", "#" + id); } catch {} render(); }
function closeTicket() { S.open = null; S.sheetMode = null; S.form = null; try { history.replaceState(null, "", location.pathname + location.search); } catch {} render(); }

async function resolveNames() {
  if (!user || !user.profiles) return;
  const docs = [...S.takes.values(), ...S.overrides.values(), ...S.fresh.values(), ...S.feedback.values()];
  const ids = [...new Set(docs.map((d) => d.byId).filter((id) => id && !(id in S.names)))];
  if (!ids.length) return;
  try { const ps = await user.profiles(ids); for (const id of ids) S.names[id] = (ps[id] && ps[id].name) || "Someone"; render(); } catch {}
}

/* ---- boot ---- */
if (/^#T-\d{8}-[0-9a-f]{4}$/.test(location.hash)) S.open = location.hash.slice(1);
render();
(async () => {
  const use = (n) => (window.claude && window.claude.use ? window.claude.use(n) : Promise.resolve(null));
  [db, user, sample, mcp] = await Promise.all([use("db"), use("user"), use("sample"), use("mcp")]);
  S.ready = true;
  if (user) {
    try { const me = await user.me(); S.meId = me.id; S.meName = me.name || ""; } catch {}
    try { const w = await user.can("data.write"); if (w === false) S.canWrite = false; } catch {}
    try { S.canEdit = !!(await user.canEdit()); } catch {}
  }
  if (!db) { render(); return; }
  const fail = (e) => { S.error = "The store refused the read (" + ((e && e.code) || "unknown") + "). Reload the page."; render(); };
  const sub = (name, key, after) => db.collection(name).limit(1000).onSnapshot((snap) => {
    S[key] = new Map(snap.docs.map((d) => [d.id, { ...d.data(), id: d.id }])); if (after) after(); resolveNames(); render();
  }, fail);
  sub("tasks", "tasks", () => { S.loaded = true; });
  sub("takes", "takes"); sub("overrides", "overrides"); sub("new", "fresh"); sub("suggestions", "suggestions"); sub("milestones", "milestoneDocs"); sub("feedback", "feedback");
  for (const [path, key] of [["meta/sync", "meta"], ["meta/branches", "branches"], ["meta/activity", "activity"], ["meta/settings", "settings"]])
    db.doc(path).onSnapshot((d) => { S[key] = d.exists ? d.data() : null; render(); }, () => {});
})();
</script>
