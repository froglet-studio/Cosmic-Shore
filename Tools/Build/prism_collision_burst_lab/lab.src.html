    if (v === 'lineup') v = 'destruction';
    view = v; lsSet('view', v); cam.focus = -1; cam.dist = 0; saveCam(); clock = loopStart();
    for (const [id, name] of [['viewDestruction', 'destruction'], ['viewStealing', 'stealing'], ['viewCollision', 'collision'], ['viewNeighbours', 'neighbours']]) $(id).setAttribute('aria-pressed', String(v === name));
    $('scrub').min = loopStart(); $('scrub').max = loopEnd();
    labelsEl.replaceChildren();
  }
  $('viewDestruction').onclick = () => setView('destruction');
  $('viewStealing').onclick = () => setView('stealing');
  $('viewCollision').onclick = () => setView('collision');
  $('viewNeighbours').onclick = () => setView('neighbours');
  function applyCarry() { const b = $('carry'); if (b) { b.setAttribute('aria-pressed', String(carry)); b.classList.toggle('primary', carry); } labelsEl.replaceChildren(); }
  $('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; };
  $('replay').onclick = () => { labSeed++; clock = loopStart(); playing = true; $('play').textContent = 'Pause'; labelsEl.replaceChildren(); };
  $('scrub').oninput = (e) => { clock = parseFloat(e.target.value); playing = false; $('play').textContent = 'Play'; };
  $('rate').onchange = (e) => { rate = parseFloat(e.target.value); };
  $('resetAll').onclick = () => { Object.assign(P, SHIPPED); lsSet('P', {}); for (const k in outputs) outputs[k].inp.value = P[k]; refreshDiff(); };

  // camera: drag to orbit, wheel / pinch to zoom
  function saveCam() { lsSet('cam', { yaw: cam.yaw, pitch: cam.pitch, dist: cam.dist, focus: cam.focus }); }
  const pts = new Map(); let pinch0 = 0;
  canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); canvas.style.cursor = 'grabbing'; });
  canvas.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch0) { cam.dist = camDistance() * pinch0 / d; } pinch0 = d; return; }
    cam.yaw -= (e.clientX - prev[0]) * 0.006; cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch + (e.clientY - prev[1]) * 0.006));
  });
  const up = (e) => { pts.delete(e.pointerId); pinch0 = 0; canvas.style.cursor = 'grab'; saveCam(); };
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.dist = camDistance() * Math.exp(e.deltaY * 0.0012); saveCam(); }, { passive: false });

  addEventListener('resize', resize);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (!manualClock) { resize(); if (playing) simStep(dt); render(); }
    requestAnimationFrame(frame);
  }
  setView(view); applyCarry(); resize(); refreshDiff(); render(); requestAnimationFrame(frame);

  // ================= the test surface =================
  window.__lab = {
    LAB, SHIPPED, SPEC, P, PLATFORM, DATA, KINDS,
    set manualClock(v) { manualClock = !!v; }, get manualClock() { return manualClock; },
    tick(dt, n) { n = n || 1; for (let i = 0; i < n; i++) simStep(dt); resize(); render(); },
    reset(seed) { labSeed = seed >>> 0 || 0; clock = loopStart(); labelsEl.replaceChildren(); },
    setView, setParam, record, score, runBatch,
    setCarry(v) { carry = !!v; applyCarry(); },
    setClock(t) { clock = t; render(); },
    // Frame one line-up cell (-1: all), from (yaw, pitch) radians — for screenshots and a later Claude.
    setCamera(focus, yaw, pitch) { cam.focus = focus; cam.dist = 0; if (yaw != null) cam.yaw = yaw; if (pitch != null) cam.pitch = pitch; labelsEl.replaceChildren(); render(); },
    state: () => ({ t: elapsed, clock, view, seed: labSeed, playing, glError }),
    probeBurstCase, probeExplosionCase, probeFragmentCase,
    sierpinskiMesh: (d) => { const m = buildSierpinski(d); return { pos: Array.from(m.pos), uv: Array.from(m.uv) }; },
    silverTriangles, nextLevel, pickShed, pickDestruction, screenFraction, shedLife, skinScale, resolveFlight,
    levels: liveLevels, sierpinskiTriangles, crowdSteps,
    // parity.py: the glitter meshes cover the whole surface (area 6 for the unit cube) and no shed-mesh
    // triangle straddles either face diagonal (the union-jack cut).
    meshChecks() {
      const out = {};
      for (const name of Array.from({ length: DEPTHS }, (_, i) => ['sier' + (i + 1), 'silver' + (i + 1)]).flat()) {
        const g = MESHES[name].mesh, P3 = g.pos; let area = 0;
        for (let t = 0; t < g.count; t += 3) {
          const a = [P3[t * 3], P3[t * 3 + 1], P3[t * 3 + 2]], b = [P3[t * 3 + 3], P3[t * 3 + 4], P3[t * 3 + 5]], c = [P3[t * 3 + 6], P3[t * 3 + 7], P3[t * 3 + 8]];
          const cr = v3.cross(v3.sub(b, a), v3.sub(c, a)); area += 0.5 * Math.hypot(cr[0], cr[1], cr[2]);
        }
        out[name] = { triangles: g.count / 3, area: +area.toFixed(5) };
      }
      for (const l of [1, 2, 3]) {
        const g = MESHES['shed' + l].mesh, uv = g.uv; let straddles = 0;
        for (let t = 0; t < g.count; t += 3) {
          let lo1 = false, hi1 = false, lo2 = false, hi2 = false;
          for (let k = 0; k < 3; k++) { const u = uv[(t + k) * 2], v = uv[(t + k) * 2 + 1], d1 = u - v, d2 = u + v - 1; lo1 = lo1 || d1 < -1e-5; hi1 = hi1 || d1 > 1e-5; lo2 = lo2 || d2 < -1e-5; hi2 = hi2 || d2 > 1e-5; }
          if ((lo1 && hi1) || (lo2 && hi2)) straddles++;
        }
        out['shed' + l] = { subdivision: SHED_SUB[l], triangles: g.count / 3, straddles };
      }
      return out;
    },
  };
})();
</script>
