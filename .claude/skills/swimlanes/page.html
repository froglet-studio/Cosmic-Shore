<title>Froglet Swim Lanes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=Saira:wght@400;500;600&display=swap">
<script src="theme.js"></script>
<link rel="stylesheet" href="themes.css">
<style>
/* Froglet Swim Lanes (/swimlanes section 6; source .claude/skills/swimlanes/page.html, data from page_data.py).
   Layout: one sticky bar (brand, five views, search, who you are, colour set), then the view. The board is the lanes in
   their tiers, one hairline row per lane, most urgent tier first; a row opens in place for every detail and its actions.
   Look: the Fleet Codex's and the analytics console's (Docs/UI_STYLE_GUIDE.md): the game's colour sets as themes
   (themes.css / theme.js from Tools/Analytics/console/make_themes.py), Saira Condensed for display, Saira for text,
   Lime (--fs-cta) only for the one call to action, Jade (--fs-selection) for a choice you can take back, Ruby
   (--fs-danger) for no way back. Motion: transform and opacity on one curve; reduced motion holds still. */
:root{
  --ease:cubic-bezier(.45,0,.2,1);
  --ink:var(--fs-text); --soft:var(--fs-text-soft); --off:var(--fs-text-off); --line:var(--fs-line);
  --hair:color-mix(in srgb,var(--fs-line) 60%,transparent); --panel:var(--fs-surface); --deep:var(--fs-ground-deep);
  --sel:var(--fs-selection); --cta:var(--fs-cta-fill); --warn:var(--fs-danger); --gold:var(--fs-gold);
  --disp:"Saira Condensed","Arial Narrow",sans-serif; --body:"Saira",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--fs-ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--fs-ground)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.disp{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.lab{font-size:12px;letter-spacing:.2em;color:var(--soft);text-transform:uppercase}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.soft{color:var(--soft)} .off{color:var(--off)}
.sea{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 70% 55% at 50% 18%,color-mix(in srgb,var(--sea-glow) 12%,transparent),transparent 70%),
    linear-gradient(180deg,var(--sea-wash) 0%,color-mix(in srgb,var(--sea-wash) 40%,var(--fs-ground)) 50%,var(--fs-ground) 100%)}
.sea-lines{position:absolute;inset:0;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 14%,#000 86%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 14%,#000 86%,transparent 100%)}
.sea-layer{position:absolute;inset:0;background:linear-gradient(90deg,var(--sea-1),var(--sea-2) 50%,var(--sea-3));-webkit-mask-repeat:repeat-x;mask-repeat:repeat-x;animation:sea-slide 90s linear infinite}
@keyframes sea-slide{from{-webkit-mask-position:0 0;mask-position:0 0}to{-webkit-mask-position:-480px 0;mask-position:-480px 0}}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--fs-ground) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 1px 0 var(--hair)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:68px;flex-wrap:wrap;padding-block:8px}
.brand{font-family:var(--disp);font-weight:700;font-size:25px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand svg{width:26px;height:26px;color:var(--sel)}
nav.views{display:flex;gap:2px;flex-wrap:wrap}
nav.views a{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--soft);transition:color .2s var(--ease)}
nav.views a:hover{color:var(--ink)}
nav.views a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--sel)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;font-size:12px;font-weight:600;letter-spacing:0;background:var(--sel);color:var(--fs-on-fill)}
.badge.hot{background:var(--cta)}
.tools{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:40px;width:220px;padding:0 12px;color:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.search input{all:unset;font-size:13px;width:100%;color:var(--ink)}
.tbtn,.who select{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:0;cursor:pointer;background:transparent;box-shadow:inset 0 0 0 1px var(--line);font-size:13px}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--soft);letter-spacing:.12em;text-transform:uppercase}
.who select{background:var(--fs-ground);color:var(--ink);letter-spacing:0;text-transform:none}
.sw{display:inline-flex;gap:2px}.sw i{display:block;width:7px;height:14px}
.themes{position:relative}
.tmenu{position:absolute;right:0;top:48px;width:320px;max-height:70vh;overflow:auto;padding:8px;z-index:30;background:var(--fs-ground);box-shadow:inset 0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.5)}
.titem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;cursor:pointer;background:none;padding:10px}
.titem:hover,.titem[aria-checked="true"]{background:var(--panel)}
.titem[aria-checked="true"]{box-shadow:inset 2px 0 0 var(--sel)}
.titem .sw i{width:10px;height:22px}
.titem b{display:block;font-family:var(--disp);font-size:19px;text-transform:uppercase}
.titem span.d{display:block;font-size:12px;color:var(--soft);line-height:1.4}

/* ---------- page head ---------- */
.head{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-block:34px 18px}
.head h1{font-size:72px;margin:0}
.head p{margin:8px 0 0;max-width:62ch;color:var(--soft)}
.sync{margin-left:auto;text-align:right;font-size:13px;color:var(--soft);min-width:0}
.sync b{color:var(--ink);font-weight:600}
.pend{color:var(--gold)}

/* ---------- tier strip ---------- */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:10px}
.strip a{display:flex;flex-direction:column;gap:4px;padding:12px 14px;text-decoration:none;background:color-mix(in srgb,var(--deep) 70%,transparent);box-shadow:inset 0 0 0 1px var(--hair);transition:background .2s var(--ease)}
.strip a:hover{background:var(--panel)}
.strip .n{font-family:var(--disp);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.strip .t{font-size:11px;letter-spacing:.16em;color:var(--soft);text-transform:uppercase}
.strip a.t-handed .n,.strip a.t-testing .n{color:var(--sel)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:0;cursor:pointer;background:transparent;box-shadow:inset 0 0 0 1px var(--line);font-size:13px;color:var(--soft)}
.chip[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 0 0 1px var(--sel),inset 0 -2px 0 var(--sel)}

/* ---------- tiers and rows ---------- */
.tier{margin-top:34px}
.tier>header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:10px;box-shadow:0 1px 0 var(--line)}
.tier h2{font-size:34px;margin:0}
.tier h2 small{font-family:var(--body);font-weight:500;font-size:15px;color:var(--soft);letter-spacing:0;margin-left:8px}
.tier>header p{margin:0;color:var(--soft);font-size:14px;flex:1 1 320px;min-width:0}
.row{border-bottom:1px solid var(--hair)}
.rhead{display:grid;grid-template-columns:30px minmax(150px,240px) minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:12px 4px;border:0;background:none;cursor:pointer;text-align:left}
.rhead:hover{background:color-mix(in srgb,var(--panel) 55%,transparent)}
.kind{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--soft)}
.kind svg{width:20px;height:20px}
.name{display:flex;flex-direction:column;min-width:0}
.name b{font-family:var(--disp);font-size:22px;font-weight:700;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.name small{font-size:11px;letter-spacing:.14em;color:var(--soft);text-transform:uppercase}
.line{min-width:0;font-size:14px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line strong{color:var(--ink);font-weight:600}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;box-shadow:inset 0 0 0 1px var(--line);color:var(--soft);white-space:nowrap}
.pill.new{background:var(--cta);color:var(--fs-on-fill);box-shadow:none;font-weight:600}
.pill.sel{box-shadow:inset 0 0 0 1px var(--sel);color:var(--sel)}
.pill.wait{box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold)}
.pill.no{box-shadow:inset 0 0 0 1px var(--warn);color:var(--warn)}
.prog{font-variant-numeric:tabular-nums;font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:12px;color:var(--ink);letter-spacing:.04em}
.caret{transition:transform .25s var(--ease);color:var(--soft)}
.row.open .caret{transform:rotate(180deg)}
.detail{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;padding:6px 4px 22px 48px}
.detail h4{margin:14px 0 6px;font-size:11px;letter-spacing:.18em;color:var(--soft);text-transform:uppercase;font-weight:500}
.detail ul{margin:0;padding:0 0 0 18px}
.detail li{margin:3px 0;font-size:14px;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border:0;cursor:pointer;background:transparent;box-shadow:inset 0 0 0 1px var(--line);font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;transition:background .2s var(--ease),box-shadow .2s var(--ease)}
.btn:hover{background:var(--panel)}
.btn.cta{background:var(--cta);color:var(--fs-on-fill);box-shadow:none}
.btn.cta:hover{filter:brightness(1.08)}
.btn.sel{box-shadow:inset 0 0 0 1px var(--sel);color:var(--sel)}
.btn.no{box-shadow:inset 0 0 0 1px var(--warn);color:var(--warn)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.more{display:block;margin:10px auto 0;}
.empty{color:var(--soft);padding:18px 4px}
code{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:.9em;color:var(--ink);background:color-mix(in srgb,var(--panel) 70%,transparent);padding:1px 5px;overflow-wrap:anywhere}

/* ---------- cards (for you, test, approvals) ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;margin-top:14px}
.card{padding:18px;background:color-mix(in srgb,var(--deep) 75%,transparent);box-shadow:inset 0 0 0 1px var(--hair);display:flex;flex-direction:column;gap:8px;min-width:0}
.card.new{box-shadow:inset 0 0 0 1px var(--cta),inset 3px 0 0 var(--cta)}
.card h3{margin:0;font-family:var(--disp);font-size:24px;text-transform:uppercase;line-height:1.05}
.card .meta{font-size:12px;color:var(--soft);letter-spacing:.06em}
.card p{margin:0;font-size:14px;overflow-wrap:anywhere}
.card textarea{width:100%;min-height:70px;padding:10px;background:var(--fs-ground);border:0;box-shadow:inset 0 0 0 1px var(--line);resize:vertical}
.sec{margin-top:36px}
.sec>h2{font-size:30px;margin:0 0 4px}
.sec>p{margin:0;color:var(--soft);max-width:70ch}
.qhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.qhead select{height:40px;padding:0 12px;background:var(--fs-ground);border:0;box-shadow:inset 0 0 0 1px var(--line)}
.impact{color:var(--gold);font-size:12px;letter-spacing:.12em;text-transform:uppercase}

/* ---------- how it works ---------- */
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;margin-top:20px}
.how h3{font-family:var(--disp);font-size:24px;text-transform:uppercase;margin:0 0 6px}
.how p,.how li{font-size:15px;color:var(--ink)}
.how p{margin:0 0 10px;max-width:62ch}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
.flow span{padding:6px 10px;box-shadow:inset 0 0 0 1px var(--line);font-size:13px}
.flow i{color:var(--soft);font-style:normal}

/* ---------- dialog ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--fs-ground-deep) 72%,transparent);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{width:min(560px,100%);max-height:100%;overflow:auto;padding:24px;background:var(--fs-ground);box-shadow:inset 0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.6)}
.dlg h3{margin:0;font-size:34px}
.dlg .opts{display:grid;gap:6px;margin:16px 0}
.opt{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:12px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--hair)}
.opt:has(input:checked){box-shadow:inset 0 0 0 1px var(--sel),inset 3px 0 0 var(--sel)}
.opt input{accent-color:var(--sel);margin-top:4px}
.opt b{display:block;font-family:var(--disp);font-size:19px;text-transform:uppercase}
.opt span{font-size:13px;color:var(--soft)}
.dlg label.f{display:block;margin-top:12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.dlg select,.dlg textarea{display:block;width:100%;margin-top:6px;padding:10px;background:var(--deep);border:0;box-shadow:inset 0 0 0 1px var(--line)}
.dlg textarea{min-height:90px;resize:vertical}
.dlg .acts{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;padding:12px 18px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--sel);font-size:14px;max-width:calc(100% - 32px)}

@media (max-width:980px){
  .strip{grid-template-columns:repeat(4,minmax(0,1fr))}
  .rhead{grid-template-columns:26px minmax(0,1fr) auto}
  .rhead .line{grid-column:2/4;white-space:normal}
  .detail{grid-template-columns:1fr;padding-left:4px}
  .head h1{font-size:52px}
  .search{width:auto;flex:1}
  .tools{width:100%;margin-left:0}
  .top{position:static}
  .sync{margin-left:0;text-align:left}
}
@media (max-width:520px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:1fr}.brand{font-size:21px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="sea" aria-hidden="true"><div class="sea-lines"><div class="sea-layer"></div><div class="sea-layer"></div><div class="sea-layer"></div></div></div>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#board"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 7c3-3 6 3 9 0s6 3 9 0 4-1 4-1M2 13c3-3 6 3 9 0s6 3 9 0 4-1 4-1M2 19c3-3 6 3 9 0s6 3 9 0 4-1 4-1"/></svg>Swim Lanes</a>
    <nav class="views" aria-label="Views">
      <a href="#board" data-v="board">Board</a>
      <a href="#mine" data-v="mine">For you <span class="badge hot" id="bMine" hidden></span></a>
      <a href="#test" data-v="test">For test <span class="badge" id="bTest" hidden></span></a>
      <a href="#approvals" data-v="approvals">Approvals <span class="badge" id="bAppr" hidden></span></a>
      <a href="#how" data-v="how">How it works</a>
    </nav>
    <div class="tools">
      <label class="search"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" aria-label="Search lanes" placeholder="Search lanes, people, branches"></label>
      <label class="who" for="me">You are <select id="me"><option value="">Pick your name</option></select></label>
      <div class="themes">
        <button class="tbtn" id="tbtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="tmenu"><span class="sw" id="tsw"></span><span id="tname">Theme</span></button>
        <div class="tmenu" id="tmenu" role="menu" aria-label="Colour set" hidden></div>
      </div>
    </div>
  </div>
</header>
<main class="wrap" id="app"><p class="empty">Reading the lanes&hellip;</p></main>
<div id="layer"></div>

<script>
(function(){
  "use strict";
  var TH = window.FA_THEMES || {themes:[], current:function(){return "";}, pick:function(){}};
  var D = null, actions = [], db = null, viewerId = null, view = "board", query = "", kindF = "all", openRows = {}, showAll = {};
  var app = document.getElementById("app"), meSel = document.getElementById("me");
  var TIERS = {
    loop:{t:"The elemental loop", short:"Loop", d:"Every vessel nobody holds is its own lane through Garrett's elemental vessel loop, the top priority (2026-11-12). Take one and advance it one step with /elemental-loop."},
    handed:{t:"Handed off", short:"Handed", d:"Passed to a person with /handoff-to-<name>. NEW until they read it; theirs from then on."},
    testing:{t:"For test", short:"For test", d:"Sent to the tester with /handoff-for-test. Back on the board when the tester answers: good to go, or back to open."},
    work:{t:"Open, work waiting", short:"Open", d:"Nobody is in it and there is obvious work: tickets, editor hand tests nobody ran, console errors, a hand-off note."},
    occupied:{t:"Occupied", short:"Occupied", d:"Someone pushed unmerged work here in the last week, or claimed it. Build elsewhere or talk to them first."},
    polish:{t:"Needs polish", short:"Polish", d:"No obvious work, but measured gaps: undesigned level-5 upgrades, no tests, a worst screen, or a person said rough."},
    polished:{t:"Polished", short:"Polished", d:"Nothing measured and nothing waiting. Lowest priority."}
  };
  var KIND_SVG = {
    vessel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12l7-6 13 6-13 6z"/><path d="M9 6v12"/></svg>',
    game:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/></svg>',
    shell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16"/><path d="M3 9h18"/></svg>',
    system:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/></svg>'
  };
  var CARET = '<svg class="caret" width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg>';

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function md(s){ return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
  function day(s){ return (s || "").slice(0, 10); }
  function ls(k, v){ try { if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
  function me(){ return meSel.value || ""; }
  function toast(msg){ var t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 3800); }

  /* ---------- themes and sea (the analytics console's, like the Fleet Codex) ---------- */
  function swatch(t){ return (t.swatch || []).map(function(p){ return '<i style="background:' + p[0] + '"></i>'; }).join(""); }
  function applyTheme(id){
    if(id) TH.pick(id);
    var cur = TH.current(), t = TH.themes.filter(function(x){ return x.id === cur; })[0] || TH.themes[0];
    if(!t) return;
    document.getElementById("tname").textContent = t.name;
    document.getElementById("tsw").innerHTML = swatch(t);
    var m = document.getElementById("tmenu");
    m.innerHTML = '<p class="lab" style="margin:6px 10px 8px">A colour set changes how you see the HyperSea</p>' + TH.themes.map(function(x){
      return '<button class="titem" type="button" role="menuitemradio" aria-checked="' + (x.id === t.id) + '" data-t="' + x.id + '"><span class="sw">' + swatch(x) + '</span><span><b>' + esc(x.name) + '</b><span class="d">' + esc(x.line) + '</span></span></button>'; }).join("");
    Array.prototype.forEach.call(m.querySelectorAll(".titem"), function(b){ b.addEventListener("click", function(){ applyTheme(b.dataset.t); openTheme(false); }); });
  }
  function openTheme(open){ var m = document.getElementById("tmenu"); m.hidden = !open; document.getElementById("tbtn").setAttribute("aria-expanded", String(open)); }
  document.getElementById("tbtn").addEventListener("click", function(e){ e.stopPropagation(); openTheme(document.getElementById("tmenu").hidden); });
  document.addEventListener("click", function(e){ if(!e.target.closest(".themes")) openTheme(false); });
  applyTheme(null);
  (function sea(){
    var layers = document.querySelectorAll(".sea-layer");

      '<div><h3>A lane</h3><p>A lane is a vessel, a game, an app screen or a system: anything that takes more than a couple of prompts and one pull request. It is never a task. Vessels and games are lanes by themselves; screens and systems are listed in <code>lanes.json</code>.</p><p>A lane is <b>occupied</b> while someone has unmerged work in it from the last 7 days, or has claimed it. That is the only thing that says not now, and the only thing that stops a commit (<code>approvals.py check</code>). It opens again when the work merges into bleeding-edge.</p></div>' +
      '<div><h3>The tiers</h3>' + D.order.map(function(t){ return '<p><b>' + esc(TIERS[t].t) + '.</b> ' + esc(TIERS[t].d) + '</p>'; }).join("") + '</div>' +
      '<div><h3>Hand-offs</h3><p>When your work in a lane is done for now, hand it on, from a session or here:</p><div class="flow"><span>/handoff-to-&lt;name&gt;</span><i>&rarr;</i><span>NEW on their board</span><i>&rarr;</i><span>theirs</span></div><div class="flow"><span>/handoff-open</span><i>&rarr;</i><span>open, with your note on top</span></div><div class="flow"><span>/handoff-for-test</span><i>&rarr;</i><span>' + esc(D.testers[0]) + '</span><i>&rarr;</i><span>/handoff-feedback good</span><i>or</i><span>back to open</span></div><p>/ship asks whether to hand off when a ship reaches a GO, and learns from what you choose.</p></div>' +
      '<div><h3>This page and the repo</h3><p>The board is a snapshot of git, read by <code>swimlanes.py</code>. A claim, hand-off, test answer or approval made here is saved at once and shown to everyone with a "waiting for sync" mark. A /swimlanes sync turns them into files in <code>Docs/Handoffs</code> and <code>Docs/Approvals</code>, commits them and republishes this page.</p><p>Pick your name in the bar so every change says who made it.</p></div></div>';
  }

  /* ---------- the hand-off dialog ---------- */
  function dialog(key){
    var l = lanesNow().filter(function(x){ return x.key === key; })[0]; if(!l) return;
    var others = D.people.filter(function(n){ return n !== me(); });
    var layer = document.getElementById("layer");
    layer.innerHTML = '<div class="scrim" id="scrim"><form class="dlg" id="hform" role="dialog" aria-modal="true" aria-labelledby="hTitle"><p class="lab">Hand off</p><h3 class="disp" id="hTitle">' + esc(l.name) + '</h3>' +
      '<div class="opts">' +
      '<label class="opt"><input type="radio" name="hk" value="to" checked><span><b>To a person</b><span>It shows on their board as NEW and becomes their lane.</span></span></label>' +
      '<label class="opt"><input type="radio" name="hk" value="open"><span><b>Back to open</b><span>Anyone can pick it up; your note goes on top of its work.</span></span></label>' +
      '<label class="opt"><input type="radio" name="hk" value="test"><span><b>For test</b><span>' + esc(D.testers[0]) + ' tests it and answers: good to go, or back to open.</span></span></label></div>' +
      '<label class="f" for="hTo">To</label><select id="hTo">' + others.map(function(n){ return '<option>' + esc(n) + '</option>'; }).join("") + '</select>' +
      '<label class="f" for="hWhat" hidden id="hWhatL">What to test (the tester\'s whole brief)</label><textarea id="hWhat" hidden placeholder="The steps, the branch or build, what good looks like"></textarea>' +
      '<label class="f" for="hNote">Where it stands</label><textarea id="hNote" placeholder="What is done, what is next, what is untested"></textarea>' +
      '<div class="acts"><button class="btn" type="button" id="hCancel">Cancel</button><button class="btn cta" type="submit">Hand off</button></div></form></div>';
    var form = document.getElementById("hform");
    function sync(){ var k = form.querySelector("input[name=hk]:checked").value; document.getElementById("hTo").hidden = document.querySelector("label[for=hTo]").hidden = k !== "to"; document.getElementById("hWhat").hidden = document.getElementById("hWhatL").hidden = k !== "test"; }
    Array.prototype.forEach.call(form.querySelectorAll("input[name=hk]"), function(r){ r.addEventListener("change", sync); });
    sync();
    function close(){ layer.innerHTML = ""; }
    document.getElementById("hCancel").addEventListener("click", close);
    document.getElementById("scrim").addEventListener("click", function(e){ if(e.target.id === "scrim") close(); });
    form.addEventListener("keydown", function(e){ if(e.key === "Escape") close(); });
    form.addEventListener("submit", function(e){
      e.preventDefault();
      var k = form.querySelector("input[name=hk]:checked").value, what = document.getElementById("hWhat").value.trim();
      if(k === "test" && !what){ toast("Write what to test: it is the tester's whole brief."); return; }
      act({type:k, lane:l.key, laneName:l.name, to:k === "to" ? document.getElementById("hTo").value : null, what:what, note:document.getElementById("hNote").value.trim()}).then(function(ok){ if(ok){ close(); } });
    });
    form.querySelector("input[name=hk]").focus();
  }

  /* ---------- routing and events ---------- */
  function badges(){
    if(!D) return;
    var lanes = lanesNow(), m = me();
    var n = m ? lanes.filter(function(l){ return l.handoff && l.handoff.to === m && l.handoff.status === "new"; }).length : 0;
    var t = lanes.filter(function(l){ return l.tier === "testing"; }).length;
    var a = m ? approvalsNow().filter(function(e){ return e.to === m && (e.status === "pending" || e.status === "discuss"); }).length : 0;
    [["bMine", n], ["bTest", t], ["bAppr", a]].forEach(function(x){ var el = document.getElementById(x[0]); el.hidden = !x[1]; el.textContent = x[1]; });
  }
  function render(){
    if(!D) return;
    var y = window.scrollY;
    app.innerHTML = view === "mine" ? mine() : view === "test" ? tests() : view === "approvals" ? approvals() : view === "how" ? how() : board();
    Array.prototype.forEach.call(document.querySelectorAll("nav.views a"), function(a){ if(a.dataset.v === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    badges();
    window.scrollTo(0, y);
  }
  function route(){ var h = (location.hash || "#board").slice(1); view = ["board", "mine", "test", "approvals", "how"].indexOf(h) >= 0 ? h : "board"; render(); }
  window.addEventListener("hashchange", function(){ route(); window.scrollTo(0, 0); });
  app.addEventListener("click", function(e){
    var r = e.target.closest("[data-row]"); if(r){ openRows[r.dataset.row] = !openRows[r.dataset.row]; render(); return; }
    var j = e.target.closest("[data-jump]"); if(j){ e.preventDefault(); var s = document.getElementById("tier-" + j.dataset.jump); if(s) s.scrollIntoView({behavior:"smooth"}); return; }
    var k = e.target.closest("[data-kind]"); if(k){ kindF = k.dataset.kind; render(); return; }
    var m = e.target.closest("[data-all]"); if(m){ showAll[m.dataset.all] = true; render(); return; }
    var o = e.target.closest("[data-open]"); if(o){ openRows[o.dataset.open] = true; setTimeout(function(){ var el = document.getElementById("lane-" + o.dataset.open); if(el) el.scrollIntoView(); }, 30); return; }
    var ap = e.target.closest("[data-ap]");
    if(ap){ var note = (document.getElementById("an-" + ap.dataset.id) || {}).value || ""; if(ap.dataset.ap === "discuss" && !note.trim()){ toast("Say what you want to talk about: it goes to the person who made the change."); return; }
      act({type:ap.dataset.ap, entry:ap.dataset.id, note:note.trim()}); return; }
    var b = e.target.closest("[data-do]"); if(!b) return;
    var l = lanesNow().filter(function(x){ return x.key === b.dataset.lane; })[0]; if(!l) return;
    if(b.dataset.do === "handoff"){ if(!me()){ toast("Pick your name in the bar first."); meSel.focus(); return; } dialog(l.key); }
    else if(b.dataset.do === "claim") act({type:"claim", lane:l.key, laneName:l.name});
    else if(b.dataset.do === "seen") act({type:"seen", lane:l.key, handoff:l.handoff && l.handoff.id});
    else if(b.dataset.do === "good" || b.dataset.do === "back"){
      var ta = document.getElementById("fb-" + l.key), note2 = ta ? ta.value.trim() : "";
      if(b.dataset.do === "back" && !note2){ if(!ta){ location.hash = "#test"; } toast("Say what failed and how to see it: it is the next person's brief."); return; }
      act({type:"feedback", lane:l.key, handoff:l.handoff && l.handoff.id, verdict:b.dataset.do, note:note2});
    }
  });
  app.addEventListener("change", function(e){ if(e.target.id === "apprWho"){ apprPerson = e.target.value; render(); } });
  document.getElementById("q").addEventListener("input", function(e){ query = e.target.value.trim().toLowerCase(); if(view !== "board"){ location.hash = "#board"; } else render(); });
  meSel.addEventListener("change", function(){ ls("swimlanesMe", me()); render(); });

  /* ---------- boot: the snapshot, then the live clicks ---------- */
  fetch("data.json").then(function(r){ return r.json(); }).then(function(d){
    D = d;
    meSel.innerHTML = '<option value="">Pick your name</option>' + d.people.map(function(n){ return '<option>' + esc(n) + '</option>'; }).join("");
    var saved = ls("swimlanesMe"); if(saved && d.people.indexOf(saved) >= 0) meSel.value = saved;
    route();
    if(!window.claude || !window.claude.use) return;
    window.claude.use("user").then(function(u){
      if(!u) return;
      u.id().then(function(id){ viewerId = id; }, function(){});
      if(!me()) u.me().then(function(v){ var first = (v && v.name || "").split(/\s+/)[0].toLowerCase(); var hit = d.people.filter(function(n){ return n.toLowerCase() === first; })[0]; if(hit && !me()){ meSel.value = hit; ls("swimlanesMe", hit); render(); } }, function(){});
    });
    window.claude.use("db").then(function(x){
      db = x; if(!db) return;
      var timer = setTimeout(function(){ toast("Live changes from this page are not loading. The board still shows the last sync."); }, 10000);
      db.collection("actions").orderBy("at", "desc").limit(500).onSnapshot(function(snap){
        clearTimeout(timer);
        actions = snap.docs.map(function(s){ return Object.assign({_id:s.id}, s.data()); });
        render();
      }, function(){ clearTimeout(timer); });
    });
  }, function(){ app.innerHTML = '<p class="empty">The board data did not load. Republish the page with /swimlanes (section 6).</p>'; });
})();
</script>
