/* Froglet Swim Lanes (/swimlanes section 6). Source .claude/skills/swimlanes/page.html; data page_data.py.
   Layout (Shombith picked mockups B and D, 2026-11-13): the analytics console's shell (console.css, its rail, panels,
   tiles, segments, cut corners and Aldrich / Chakra Petch type, Docs/UI_STYLE_GUIDE.md) with six pages: Board (the
   lanes in five status columns, each scrolling on its own; a card opens a drawer with every detail and the actions),
   People (a card per person: what they hold and what was handed to them), For you (a hand-off's brief with private
   ticks, the lanes you hold, your approvals), For test, Approvals, How it works. Colours: the theme only; a person's

.av{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none;font-family:var(--fs-font-label);font-weight:700;font-size:12px;color:var(--fs-ground);background:var(--pc)}

.bs:hover{background:color-mix(in srgb,var(--fs-surface) 70%,transparent)}

.bcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}

.rd > span:first-child{min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lock{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--fs-text-soft)}
.pnote{width:100%;min-height:70px;margin-top:8px;padding:10px;background:var(--fs-ground-deep);color:var(--fs-text);border:0;box-shadow:inset 0 0 0 1px var(--fs-line);font:inherit;font-size:14px;resize:vertical}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;padding:12px 18px;background:var(--fs-surface);box-shadow:inset 0 0 0 1px var(--fs-selection);font-size:14px;max-width:calc(100% - 32px)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.how .card p{margin:0;font-size:14px;line-height:1.55}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flow span{padding:5px 9px;box-shadow:inset 0 0 0 1px var(--fs-line);font-size:12px}

  .col-b{max-height:420px}

}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
(function(){
  "use strict";
  var TH = window.FA_THEMES || {themes:[], current:function(){ return ""; }, pick:function(){}};
  var D = null, actions = [], db = null, user = null, viewerId = null, view = "board", query = "", kindF = "all", personF = "", privateDocs = {};
  var app = document.getElementById("app"), meSel = document.getElementById("me");
  var CORE = {Garrett:"p1", Caleb:"p2", Shombith:"p3", Yash:"p4"};
  var COLS = [
    {k:"loop", t:"Loop", d:"Free vessels in the elemental loop, the top priority. Take one, advance it one step."},
    {k:"work", t:"Open", d:"Nobody is in it and work is waiting: tickets, hand tests, errors, a hand-off note."},
    {k:"occupied", t:"Held", d:"Someone pushed unmerged work in the last week, or claimed it. Talk to them first."},
    {k:"handed", t:"Handed / test", d:"Passed to a person (NEW until they take it), or with the tester.", also:["testing"]},
    {k:"polish", t:"Polish", d:"No obvious work, measured gaps. Polished lanes at the bottom.", also:["polished"]}
  ];
  var ICON = {
    vessel:'<svg class="k" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12l7-6 13 6-13 6z"/><path d="M9 6v12"/></svg>',
    game:'<svg class="k" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/></svg>',
    shell:'<svg class="k" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16"/><path d="M3 9h18"/></svg>',
    system:'<svg class="k" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>'
  };
  var LOCK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function md(s){ return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
  function day(s){ return (s || "").slice(0, 10); }
  function ls(k, v){ try { if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
  function me(){ return meSel.value || ""; }
  function av(n, cls){ return n ? '<span class="av ' + (CORE[n] || "p0") + ' ' + (cls || "") + '" title="' + esc(n) + '">' + esc(n.charAt(0).toUpperCase()) + '</span>' : '<span class="av ghost ' + (cls || "") + '" title="a Claude session with no person on record">?</span>'; }
  function toast(msg){ var t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 4000); }
  function head(eyebrow, title, right){ return '<div class="top"><div class="title"><span class="lab">' + eyebrow + '</span><h1 class="h1">' + title + '</h1></div><span class="small updated">' + (right || "") + '</span></div>'; }

  /* ---------- themes and sea ---------- */
  function themes(){
    var cur = TH.current(), t = TH.themes.filter(function(x){ return x.id === cur; })[0] || TH.themes[0];
    if(!t) return;
    document.getElementById("tname").textContent = t.name;
    document.getElementById("sets").innerHTML = TH.themes.map(function(x){ return '<button type="button" aria-pressed="' + (x.id === t.id) + '" title="' + esc(x.name) + '" aria-label="' + esc(x.name) + '" data-t="' + x.id + '">' + (x.swatch || []).map(function(p){ return '<i style="background:' + p[0] + '"></i>'; }).join("") + '</button>'; }).join("");
  }
  document.getElementById("sets").addEventListener("click", function(e){ var b = e.target.closest("[data-t]"); if(b){ TH.pick(b.dataset.t); themes(); } });
  themes();
  (function sea(){
    var layers = document.querySelectorAll(".sea-layer");
    if(!TH.sea || layers.length !== 3) return;
    var sp = TH.sea.spacing, loop = TH.sea.loop, amp = TH.sea.amplitude, tall = 2400, k1 = 2 * Math.PI / loop, k2 = 3 * k1;
    function mod3(x){ return x - 3 * Math.floor(x / 3); }
    TH.sea.layers.forEach(function(layer, n){
      var lines = "";
      for(var i = 0; i * sp <= tall + sp; i++){
        if(mod3(i) !== n) continue;
        var a1 = amp * (1 + 0.45 * mod3(i * 7)), a2 = amp * (0.45 + 0.22 * mod3(i * 5)), pts = [];
        for(var x = 0; x <= loop; x += 6) pts.push(x + "," + (i * sp + a1 * Math.sin(k1 * x + i * 0.9) + a2 * Math.sin(k2 * x + i * 1.7)).toFixed(1));
        lines += "<polyline points='" + pts.join(" ") + "' fill='none' stroke='#fff' stroke-opacity='" + layer.alpha + "' stroke-width='" + layer.width + "'/>";
      }
      var url = 'url("data:image/svg+xml,' + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='" + loop + "' height='" + tall + "'>" + lines + "</svg>") + '")';
      var el = layers[n];
      el.style.webkitMaskImage = url; el.style.maskImage = url;
      el.style.webkitMaskSize = loop + "px " + tall + "px"; el.style.maskSize = loop + "px " + tall + "px";
      el.style.animationDuration = layer.seconds + "s";
    });
  })();

  /* ---------- the page's clicks, laid over the last sync ---------- */
  function pending(){ return actions.filter(function(a){ return !a.synced && !a.refused; }).sort(function(a, b){ return (a.at || "") < (b.at || "") ? -1 : 1; }); }
  function lanesNow(){
    var by = {}, out = D.lanes.map(function(l){ var c = JSON.parse(JSON.stringify(l)); by[c.key] = c; return c; });
    pending().forEach(function(a){
      var l = by[a.lane]; if(!l) return;
      var stamp = {by:a.by, on:a.at, note:a.note || "", pendingSync:true};
      if(a.type === "claim"){ l.tier = "occupied"; l.occupants = [{people:[a.by], branch:"claimed on this page", last:day(a.at), commits:0, subjects:["claimed on this page"], pendingSync:true}].concat(l.occupants || []); }
      else if(a.type === "to"){ l.tier = "handed"; l.handoff = Object.assign({kind:"to", status:"new", to:a.to}, stamp); l.occupants = []; }

    if(tests.length) h += '<section class="card panel sl"><div class="card-head"><span class="lab">For you to test</span><span class="small">' + tests.length + '</span></div>' + tests.map(function(l){ return '<div class="rd"><span>' + esc(l.name) + ' <span class="small">from ' + esc(l.handoff.by) + '</span></span><a class="bs cta" href="#test" style="display:inline-flex;align-items:center;text-decoration:none">Test it</a></div>'; }).join("") + '</section>';
    h += '<div class="grid2"><section class="card panel sl"><div class="card-head"><span class="lab">Lanes you hold</span><span class="small">' + held.length + '</span></div>' +
      (held.length ? held.map(function(l){ var o = holders(l).filter(function(x){ return x.who === m; })[0]; return '<div class="rd"><span style="display:flex;gap:8px;align-items:center;min-width:0">' + ICON[l.kind] + '<span class="ell">' + esc(l.name) + '<span class="small" style="display:block">' + esc(o.br) + (o.pr ? ' #' + o.pr : '') + ' &middot; ' + esc(o.last) + '</span></span></span><button class="bs" data-handoff="' + esc(l.key) + '">Hand off</button></div>'; }).join("") : '<p class="small">You hold no lane right now.</p>') + '</section>' +
      '<section class="card panel sl"><div class="card-head"><span class="lab">Your approvals</span><span class="small">' + q.length + ' waiting &middot; loop impact first</span></div>' +
      (q.length ? q.slice(0, 5).map(function(e){ return '<div class="rd"><span style="display:flex;gap:8px;align-items:center;min-width:0">' + av(e.by) + '<span class="ell">' + esc(e.summary) + '</span></span>' + (e.loopImpact ? '<span class="pill warn">Loop ' + e.loopImpact + '</span>' : '<span class="small" style="white-space:nowrap">' + day(e.date) + '</span>') + '</div>'; }).join("") + '<div class="acts"><a class="bs cta" href="#approvals" style="display:inline-flex;align-items:center;text-decoration:none">Answer them</a></div>' : '<p class="small">Your queue is empty.</p>') + '</section></div>';
    return h;
  }

  /* ---------- For test ---------- */
  function tests(){
    var ls = lanesNow(), t = ls.filter(function(l){ return l.tier === "testing"; }), isTester = D.testers.indexOf(me()) >= 0;
    var done = D.handoffs.filter(function(x){ return x.kind === "test" && (x.events || []).some(function(e){ return e.event === "feedback"; }); }).slice(0, 12);
    var h = head("With " + esc(D.testers.join(", ")), "For test", isTester ? "Run each brief, then answer" : "The tester answers each one");
    h += t.length ? '<div class="cards">' + t.map(function(l){ var x = l.handoff; return '<section class="card panel sl"><div class="card-head"><span class="lab">' + esc(l.name) + '</span><span class="small">from ' + esc(x.by) + ', ' + day(x.on) + '</span></div>' + (x.what ? '<p class="body"><b>Test:</b> ' + md(x.what) + '</p>' : '') + (x.note ? '<p class="small">' + md(x.note) + '</p>' : '') +
      (isTester ? '<label class="lab" for="fb-' + esc(l.key) + '">What you ran, or what failed</label><textarea id="fb-' + esc(l.key) + '"></textarea><div class="acts"><button class="bs cta" data-fb="good" data-lane-fb="' + esc(l.key) + '">Good to go</button><button class="bs no" data-fb="back" data-lane-fb="' + esc(l.key) + '">Send back to open</button></div>' : '') + '</section>'; }).join("") + '</div>' : '<section class="card panel sl"><p class="small">Nothing waits for test. A lane arrives here with /handoff-for-test, or Hand off &rarr; For test on the board.</p></section>';
    if(done.length) h += '<section class="card panel sl"><div class="card-head"><span class="lab">Answered</span></div>' + done.map(function(x){ var f = x.events.filter(function(e){ return e.event === "feedback"; }).pop(); return '<div class="rd"><span>' + esc(x.laneName) + ' <span class="small">' + day(f.on) + (f.note ? ' &middot; ' + esc(f.note) : '') + '</span></span>' + (f.verdict === "good" ? '<span class="pill sel">Good to go</span>' : '<span class="pill no">Sent back</span>') + '</div>'; }).join("") + '</section>';
    return h;
  }

  /* ---------- Approvals ---------- */
  var apprPerson = null;
  function approvals(){
    var all = approvalsNow(), counts = {};
    all.forEach(function(e){ counts[e.to] = (counts[e.to] || 0) + ((e.status === "pending" || e.status === "discuss") ? 1 : 0); });
    var p = apprPerson || (counts[me()] !== undefined ? me() : Object.keys(counts)[0]) || "";
    var rows = all.filter(function(e){ return e.to === p; });
    var h = head("Approve after the fact", "Approvals", "Changes go through unless they collide with a held lane");
    h += '<div class="filters"><div class="seg" role="group" aria-label="Queue of">' + Object.keys(counts).sort().map(function(n){ return '<button type="button" aria-pressed="' + (n === p) + '" data-q="' + esc(n) + '">' + esc(n) + ' ' + counts[n] + '</button>'; }).join("") + '</div>' + (p !== me() ? '<span class="small">Only ' + esc(p) + ' answers these.</span>' : '') + '</div>';
    h += rows.length ? '<div class="cards">' + rows.map(function(e){ var own = e.to === me() && !e.pendingSync; return '<section class="card panel sl"><div class="card-head"><span style="display:flex;gap:8px;align-items:center">' + av(e.by) + '<span class="lab">' + esc(e.by) + ', ' + day(e.date) + '</span></span><span style="display:flex;gap:6px">' + (e.loopImpact ? '<span class="pill warn">Loop ' + e.loopImpact + '</span>' : '') + '<span class="pill' + (e.status === "discuss" ? ' warn' : e.status === "approved" ? ' sel' : '') + '">' + esc(e.status) + '</span>' + (e.pendingSync ? '<span class="pill warn">Sync</span>' : '') + '</span></div>' +
      '<p class="body" style="font-size:14px">' + md(e.summary) + '</p>' + (e.area ? '<p class="small"><b>Your area:</b> ' + md(e.area) + '</p>' : '') + (e.loopRework && e.loopRework.length ? '<p class="small">A no here sends back: ' + esc(e.loopRework.join("; ")) + '</p>' : '') + '<p class="small">' + esc(e.where === "landed" ? "on bleeding-edge" : "on " + (e.where || "")) + '</p>' +
      (own ? '<label class="lab" for="an-' + esc(e.id) + '">Note (needed to discuss)</label><textarea id="an-' + esc(e.id) + '"></textarea><div class="acts"><button class="bs cta" data-ap="approve" data-id="' + esc(e.id) + '">Approve</button><button class="bs sel" data-ap="discuss" data-id="' + esc(e.id) + '">Discuss</button></div>' : '') + '</section>'; }).join("") + '</div>' : '<section class="card panel sl"><p class="small">Nothing waits for ' + esc(p) + '.</p></section>';
    return h;
  }

  /* ---------- How it works ---------- */
  function how(){
    return head("The rules, in one page", "How it works") + '<div class="how">' +
      '<section class="card panel sl"><span class="lab">A lane</span><p>A vessel, a game, an app screen or a system: anything bigger than a couple of prompts and one pull request. Never a task. A lane is <b>held</b> while someone has unmerged work in it from the last 7 days, claimed it, or was handed it. Held is the only thing that says not now, and the only thing that stops a commit (<code>approvals.py check</code>).</p></section>' +
      '<section class="card panel sl"><span class="lab">The board</span>' + COLS.map(function(c){ return '<p><b>' + c.t + '.</b> ' + esc(c.d) + '</p>'; }).join("") + '</section>' +
      '<section class="card panel sl"><span class="lab">Hand-offs</span><div class="flow"><span>/handoff-to-&lt;name&gt;</span><span>NEW on their board</span><span>theirs</span></div><div class="flow"><span>/handoff-open</span><span>open, your note on top</span></div><div class="flow"><span>/handoff-for-test</span><span>' + esc(D.testers[0]) + '</span><span>good to go, or back to open</span></div><p>A hand-off can carry a brief (decisions, next steps, what to read); it shows on the recipient\'s For you page, where their ticks and notes are private to them. /ship offers a hand-off when a ship reaches a GO.</p></section>' +
      '<section class="card panel sl"><span class="lab">This page and the repo</span><p>The board is a snapshot of git (<code>swimlanes.py</code>). A claim, hand-off, test answer or approval made here is saved at once and shown to everyone with a Sync mark; <code>/swimlanes sync</code> writes it into <code>Docs/Handoffs</code> or <code>Docs/Approvals</code>, commits it and republishes the page.</p></section></div>';
  }

  /* ---------- routing and events ---------- */
  function badges(){
    var ls = lanesNow(), m = me();
    var n = m ? ls.filter(function(l){ return l.handoff && l.handoff.to === m && l.handoff.status === "new"; }).length : 0;
    var t = ls.filter(function(l){ return l.tier === "testing"; }).length;
    var a = m ? approvalsNow().filter(function(e){ return e.to === m && (e.status === "pending" || e.status === "discuss"); }).length : 0;
    [["bMine", n], ["bTest", t], ["bAppr", a]].forEach(function(x){ var el = document.getElementById(x[0]); el.hidden = !x[1]; el.textContent = x[1]; });
  }
  function render(){
    if(!D) return;
    var y = window.scrollY, focus = document.activeElement && document.activeElement.id;
    var scrolls = Array.prototype.map.call(document.querySelectorAll(".col-b"), function(c){ return c.scrollTop; });
    app.innerHTML = ({people:people, mine:mine, test:tests, approvals:approvals, how:how}[view] || board)();
    document.querySelectorAll(".col-b").forEach(function(c, i){ c.scrollTop = scrolls[i] || 0; });
    document.querySelectorAll(".rail .nav").forEach(function(a){ if(a.dataset.v === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    badges();
    window.scrollTo(0, y);
    if(focus === "q"){ var q = document.getElementById("q"); if(q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
  }
  function route(){ var h = (location.hash || "#board").slice(1); view = ["board", "people", "mine", "test", "approvals", "how"].indexOf(h) >= 0 ? h : "board"; document.getElementById("layer").innerHTML = ""; render(); }
  window.addEventListener("hashchange", function(){ route(); window.scrollTo(0, 0); });
  app.addEventListener("click", function(e){
    var t;
    if((t = e.target.closest("[data-kind]"))){ kindF = t.dataset.kind; render(); return; }
    if((t = e.target.closest("[data-person]"))){ personF = t.dataset.person; render(); return; }
    if((t = e.target.closest("[data-q]"))){ apprPerson = t.dataset.q; render(); return; }
    if((t = e.target.closest("[data-take]"))){ var l = lanesNow().filter(function(x){ return x.key === t.dataset.take; })[0]; act({type:"seen", lane:l.key, handoff:l.handoff && l.handoff.id}); return; }
    if((t = e.target.closest("[data-handoff]"))){ if(!me()){ toast("Pick your name under You are first."); meSel.focus(); return; } drawer(t.dataset.handoff, "handoff"); return; }
    if((t = e.target.closest("[data-lane]"))){ drawer(t.dataset.lane); return; }
    if((t = e.target.closest("[data-ap]"))){ var note = (document.getElementById("an-" + t.dataset.id) || {}).value || ""; if(t.dataset.ap === "discuss" && !note.trim()){ toast("Say what you want to talk about: it goes to the person who made the change."); return; } act({type:t.dataset.ap, entry:t.dataset.id, note:note.trim()}); return; }
    if((t = e.target.closest("[data-fb]"))){
      var key = t.dataset.laneFb, ln = lanesNow().filter(function(x){ return x.key === key; })[0], ta = document.getElementById("fb-" + key), n2 = ta ? ta.value.trim() : "";
      if(t.dataset.fb === "back" && !n2){ toast("Say what failed and how to see it: it is the next person's brief."); return; }
      act({type:"feedback", lane:key, handoff:ln.handoff && ln.handoff.id, verdict:t.dataset.fb, note:n2});
    }
  });
  app.addEventListener("input", function(e){ if(e.target.id === "q"){ query = e.target.value.trim().toLowerCase(); render(); } });
  /* private ticks and notes: data/users/<you>/<hand-off id>, readable by nobody else (the db's per-user space) */
  function savePrivate(hid, patch){
    if(!db || !viewerId){ toast("Ticks and notes save when you are signed in to claude.ai on this page."); return; }
    var cur = Object.assign({ticks:[], note:""}, privateDocs[hid] || {}, patch);
    privateDocs[hid] = cur;
    db.collection("data/users/" + viewerId).doc(hid).set(cur).catch(function(){ toast("Your tick did not save. Try again."); });
  }
  var noteTimer = null;
  app.addEventListener("change", function(e){
    var t = e.target;
    if(t.dataset && t.dataset.tick){ var cur = ((privateDocs[t.dataset.tick] || {}).ticks || []).slice(); cur[+t.dataset.i] = t.checked; savePrivate(t.dataset.tick, {ticks:cur}); render(); }
  });
  app.addEventListener("input", function(e){
    var t = e.target;
    if(t.dataset && t.dataset.pnote){ clearTimeout(noteTimer); noteTimer = setTimeout(function(){ savePrivate(t.dataset.pnote, {note:t.value}); }, 800); }
  });
  meSel.addEventListener("change", function(){ ls("swimlanesMe", me()); render(); });

  /* ---------- boot: the snapshot, then the live clicks and your private ticks ---------- */
  fetch("data.json").then(function(r){ return r.json(); }).then(function(d){
    D = d;
    document.getElementById("synced").textContent = d.base + ", " + d.generated.slice(0, 16).replace("T", " ") + " UTC";
    meSel.innerHTML = '<option value="">Pick your name</option>' + d.people.map(function(n){ return '<option>' + esc(n) + '</option>'; }).join("");
    var saved = ls("swimlanesMe"); if(saved && d.people.indexOf(saved) >= 0) meSel.value = saved;
    route();
    if(!window.claude || !window.claude.use) return;
    window.claude.use("user").then(function(u){
      user = u; if(!u) return;
      u.id().then(function(id){
        viewerId = id;
        if(db && id) loadPrivate();
      }, function(){});
      if(!me()) u.me().then(function(v){ var first = ((v && v.name) || "").split(/\s+/)[0].toLowerCase(); var hit = d.people.filter(function(n){ return n.toLowerCase() === first; })[0]; if(hit && !me()){ meSel.value = hit; ls("swimlanesMe", hit); render(); } }, function(){});
    });
    window.claude.use("db").then(function(x){
      db = x; if(!db) return;
      var timer = setTimeout(function(){ toast("Live changes from this page are not loading. The board still shows the last sync."); }, 10000);
      db.collection("actions").orderBy("at", "desc").limit(500).onSnapshot(function(snap){
        clearTimeout(timer);
        actions = snap.docs.map(function(s){ return Object.assign({_id:s.id}, s.data()); });
        render();
      }, function(){ clearTimeout(timer); });
      if(viewerId) loadPrivate();
    });
    var loaded = false;
    function loadPrivate(){
      if(loaded) return; loaded = true;
      db.collection("data/users/" + viewerId).onSnapshot(function(snap){
        snap.docs.forEach(function(s){ privateDocs[s.id] = s.data(); });
        if(view === "mine" && !(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.pnote)) render();
      }, function(){});
    }
  }, function(){ app.innerHTML = '<p class="empty">The board data did not load. Republish the page with /swimlanes (section 6).</p>'; });
})();
</script>
