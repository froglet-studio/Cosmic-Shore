# Prisma's launcher (Prisma.exe) as a GitHub release, so Prisma's UPDATE button can download it:
# no zip, no .NET SDK, no build on the tester's PC. It runs on every change to the launcher's own
# source on bleeding-edge (and on the Prisma working branch), builds the Windows single-file .exe
# on Linux, and publishes it as release prisma-launcher-<short sha>. The release body starts with
# a comment holding the metadata the updater reads (LauncherUpdater.ParseReleases).
# Port-only: it reads Port/ and nothing Unity uses (Port/tools/check_unity_isolation.py).
name: Prisma launcher release

on:
  push:
    branches: [bleeding-edge, cece/focused-planck-cj46y3]
    paths:
      - 'Port/src/CosmicShore.Launcher/**'
      - 'Port/src/Shared/**'
      - 'Port/Directory.Build.props'
      - '.github/workflows/prisma-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prisma-launcher-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      # Full history (for the version stamp and the change list) but only the launcher's files.
      - name: Checkout the launcher's source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          lfs: false
          sparse-checkout: |
            Port/src/CosmicShore.Launcher
            Port/src/Shared

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: v
        run: |
          paths="Port/src/CosmicShore.Launcher Port/src/Shared"
          commit=$(git log -1 --format=%H -- $paths)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "short=${commit:0:7}" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cs "$commit")" >> "$GITHUB_OUTPUT"
          if gh release view "prisma-launcher-${commit:0:7}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build Prisma.exe (win-x64, single file)
        if: steps.v.outputs.exists == 'false'
        run: |
          dotnet publish Port/src/CosmicShore.Launcher -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true \
            -o "$RUNNER_TEMP/out"
          test -f "$RUNNER_TEMP/out/Prisma.exe"
          ls -la "$RUNNER_TEMP/out"

      - name: Publish the release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.v.outputs.commit }}
          SHORT: ${{ steps.v.outputs.short }}
          DATE: ${{ steps.v.outputs.date }}
          BRANCH: ${{ github.ref_name }}
        run: |
          exe="$RUNNER_TEMP/out/Prisma.exe"
          export SHA=$(sha256sum "$exe" | cut -d' ' -f1)
          # What changed since the previous launcher release of this branch.
          prev=$(gh release list --limit 100 --json tagName,createdAt --jq '.[].tagName' | { grep '^prisma-launcher-' || true; } | while read -r t; do
                   b=$(gh release view "$t" --json body --jq .body | sed -n 's/.*"branch":"\([^"]*\)".*/\1/p' | head -1)
                   c=$(gh release view "$t" --json body --jq .body | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p' | head -1)
                   if [ "$b" = "$BRANCH" ] && [ -n "$c" ] && [ "$c" != "$COMMIT" ]; then echo "$c"; break; fi
                 done)
          paths="Port/src/CosmicShore.Launcher Port/src/Shared"
          if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null; then range="$prev..$COMMIT"; else range="-n 8 $COMMIT"; fi
          git log --format=%s $range -- $paths | head -20 > "$RUNNER_TEMP/changes.txt"
          python3 - "$RUNNER_TEMP/changes.txt" > "$RUNNER_TEMP/notes.md" <<'PY'
          import json, os, sys
          changes = [l.strip() for l in open(sys.argv[1], encoding="utf-8") if l.strip()]
          meta = {"commit": os.environ["COMMIT"], "date": os.environ["DATE"], "branch": os.environ["BRANCH"], "sha256": os.environ["SHA"], "changes": changes}
          print("<!-- prisma-launcher " + json.dumps(meta, separators=(",", ":")) + " -->")
          print(f"Prisma launcher `{os.environ['SHORT']}` ({os.environ['DATE']}) from `{os.environ['BRANCH']}`.\n")
          print("Download **Prisma.exe** and run it; after that, Prisma's UPDATE button installs new versions by itself.\n")
          print("What changed:")
          for c in changes: print(f"- {c}")
          PY
          gh release create "prisma-launcher-$SHORT" "$exe" --target "$COMMIT" \
            --title "Prisma $SHORT ($BRANCH)" --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false
        shell: bash

      - name: Keep the last 8 launcher releases per branch
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          n=0
          for t in $(gh release list --limit 200 --json tagName --jq '.[].tagName' | { grep '^prisma-launcher-' || true; }); do
            b=$(gh release view "$t" --json body --jq .body | sed -n 's/.*"branch":"\([^"]*\)".*/\1/p' | head -1)
            [ "$b" = "$BRANCH" ] || continue
            n=$((n+1))
            if [ $n -gt 8 ]; then gh release delete "$t" --yes --cleanup-tag; fi
          done
