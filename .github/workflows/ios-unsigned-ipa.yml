# iOS unsigned .ipa - compiles an Xcode project that Unity exported on WINDOWS, on a free
# GitHub-hosted Mac, and hands back an UNSIGNED .ipa to sign and install with Sideloadly.
#
# Why this exists: Unity on Windows can export the Xcode project but cannot compile it, and every
# rented Mac carries a minimum (Apple's macOS licence forces a 24-hour lease; MacinCloud's
# pay-as-you-go is a 10-day prepay). This repository is PUBLIC, and standard GitHub-hosted runners
# are free and unlimited on public repositories - so the one step that needs macOS costs nothing.
# It is a stopgap until the paid Apple team exists and Unity Build Automation takes over
# (Docs/IOS_BUILD.md section 2, Path B).
#
# It does NOT run Unity. Importing this project on a 3-core runner would take longer than the job
# is worth and needs a Unity licence; the Windows machine that already has the Library does that.
#
# HOW TO RUN (full steps: Docs/IOS_BUILD.md section 2, Path A):
#   1. On Windows: Switch Platform to iOS, tick Development Build, Build to an empty folder.
#   2. Zip (or RAR / 7z) that folder and upload it to Dropbox (most reliable) or Google Drive.
#      Share it as "anyone with the link".
#   3. Repository Settings -> Secrets and variables -> Actions -> New repository secret:
#      name IOS_XCODE_EXPORT_URL, value = that share link. A SECRET, not a variable: the repo
#      is public, so anything not a secret is readable by everyone, including run logs.
#   4. Edit Tools/iOS/ipa-build-request.txt (any change) and push it to a FEATURE branch. That
#      push starts this job. On bleeding-edge / development / main / build/** the request file is
#      ignored; use the Actions tab's "Run workflow" button there (once this file is on the
#      default branch).
#   5. When the run is green, download the "CosmicShore-dev-ipa" artifact from the run page.
#
# PRIVACY: artifacts on a public repository are downloadable by any signed-in GitHub user who
# finds the run. The .ipa is unsigned (it runs on no phone until somebody signs it), and it is kept
# for 3 days only.

name: iOS unsigned ipa

on:
  push:
    paths:
      - 'Tools/iOS/ipa-build-request.txt'
    # Feature branches only. The first push that carries this file into a shared branch - the
    # merge into bleeding-edge, the promotion into development, the force-moved build/* snapshots
    # - would otherwise "change" it and start a 20-minute Mac build nobody asked for. Use the
    # Actions tab's "Run workflow" button (workflow_dispatch) on those branches instead.
    branches-ignore:
      - 'bleeding-edge'
      - 'development'
      - 'main'
      - 'build/**'
      # Agent branches merge bleeding-edge in constantly, which "changes" the request file
      # whenever bleeding-edge did - a Mac build nobody asked for. claude/** never fires CI on
      # its own push; dispatch this workflow from the Actions tab for one.
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    # Apple silicon, 3 vCPU / 7 GB RAM. Free and unlimited on a public repo.
    runs-on: macos-15
    timeout-minutes: 150
    env:
      EXPORT_URL: ${{ secrets.IOS_XCODE_EXPORT_URL }}
      WORK: ${{ github.workspace }}/ios-work
    steps:
      - name: Check the export link is configured
        id: gate
        run: |
          if [ -z "$EXPORT_URL" ]; then
            echo "::notice::IOS_XCODE_EXPORT_URL is not set, so there is nothing to build. Add it under Settings -> Secrets and variables -> Actions, then push a change to Tools/iOS/ipa-build-request.txt."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode 16
        if: steps.gate.outputs.ready == 'true'
        run: |
          # Unity 6000.3 targets Xcode 16; pick the newest 16.x the image carries.
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 16.x on this runner image. Installed:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          # Resolve symlinks: the image carries aliases like Xcode_16.4.app -> Xcode_16.4.0.app.
          XCODE=$(cd "$XCODE" && pwd -P)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          # Pin it for every later step too, so nothing can fall back to the Command Line Tools.
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          # No disk cleanup: deleting the "other" Xcodes once took out the selected one through
          # a symlink alias (run 37072167182), and the image has ~80 GB free anyway.
          df -h /

      - name: Download the Xcode project
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p "$WORK"
          cd "$WORK"
          case "$EXPORT_URL" in
            *drive.google.com*|*docs.google.com*)
              python3 -m pip install --quiet --break-system-packages gdown
              python3 -m gdown --fuzzy "$EXPORT_URL" -O export.zip
              ;;
            *dropbox.com*)
              # A Dropbox share link serves an HTML page unless dl=1.
              case "$EXPORT_URL" in
                *dl=0*) URL=$(printf '%s' "$EXPORT_URL" | sed -e 's/dl=0/dl=1/') ;;
                *dl=1*) URL="$EXPORT_URL" ;;
                *\?*)   URL="$EXPORT_URL&dl=1" ;;
                *)      URL="$EXPORT_URL?dl=1" ;;
              esac
              curl -fL --retry 3 -o export.zip "$URL"
              ;;
            *)
              curl -fL --retry 3 -o export.zip "$EXPORT_URL"
              ;;
          esac
          ls -lh export.zip
          # Accept zip, RAR and 7z - Windows users reach for whichever archiver they have. A share
          # PAGE saved as export.zip is the usual failure, and the extractors' errors for it are cryptic.
          KIND=$(file -b export.zip)
          case "$KIND" in
            # 7-zip first: "7-zip archive data" also contains "zip archive".
            *RAR\ archive*)   echo "ARCHIVE_KIND=rar" >> "$GITHUB_ENV" ;;
            *7-zip\ archive*) echo "ARCHIVE_KIND=7z" >> "$GITHUB_ENV" ;;
            *[Zz]ip\ archive*) echo "ARCHIVE_KIND=zip" >> "$GITHUB_ENV" ;;
            *)
              echo "::error::The link did not return an archive ($KIND). Use a direct-download or share link to the .zip / .rar / .7z itself."
              exit 1 ;;
          esac

      - name: Unzip and restore executable bits
        if: steps.gate.outputs.ready == 'true'
        run: |
          cd "$WORK"
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          case "$ARCHIVE_KIND" in
            zip)
              # ditto copes with large (zip64) archives that Info-ZIP unzip sometimes rejects.
              ditto -x -k export.zip src || unzip -q export.zip -d src ;;
            rar)
              # NOT 7-Zip: Homebrew's sevenzip is built without the RAR codec and answers
              # "Unsupported Method" for every file in a RAR5 archive (measured on run 37071065804).
              # unar (The Unarchiver) reads RAR5.
              mv export.zip export.rar
              brew install --quiet unar
              unar -q -o src export.rar
              rm -f export.rar ;;
            7z)
              brew install --quiet sevenzip
              7zz x -y -bso0 -bsp0 -osrc export.zip ;;
          esac
          rm -f export.zip
          PROJ_FILE=$(find src -maxdepth 4 -name 'Unity-iPhone.xcodeproj' -type d | head -1)
          if [ -z "$PROJ_FILE" ]; then
            echo "::error::No Unity-iPhone.xcodeproj in the zip. Zip the folder Unity built into."
            exit 1
          fi
          # ABSOLUTE: every later step starts a fresh shell in the workspace, not in $WORK.
          PROJ=$(cd "$(dirname "$PROJ_FILE")" && pwd)
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          # A zip made on Windows carries no Unix permission bits, so every script and tool the
          # Xcode build phases call would fail with "Permission denied" (MapFileParser.sh is the
          # well-known one; Unity's il2cpp build tools are the rest).
          find "$PROJ" -type f \( -name '*.sh' -o -name 'MapFileParser' -o -name 'usymtool*' \) -exec chmod +x {} +
          if [ -d "$PROJ/Il2CppOutputProject/IL2CPP" ]; then
            chmod -R u+x "$PROJ/Il2CppOutputProject/IL2CPP"
          fi
          # And any other extensionless Mach-O executable or script the build phases may call.
          find "$PROJ" -type f ! -name '*.*' ! -path '*/Data/*' -print0 \
            | xargs -0 file -N --mime-type 2>/dev/null \
            | awk -F': ' '$2 ~ /x-mach-binary|x-shellscript|x-executable/ {print $1}' \
            | while IFS= read -r f; do chmod +x "$f"; done
          du -sh "$PROJ"
          df -h /

      - name: Build (unsigned)
        if: steps.gate.outputs.ready == 'true'
        run: |
          cd "$PROJ"
          set -o pipefail
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$WORK/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$WORK/xcodebuild.log" | grep -E '(error|warning: .*il2cpp|\*\* BUILD)' || true
          # tee+grep hides the exit status above; read it from the log instead.
          if ! grep -q '\*\* BUILD SUCCEEDED \*\*' "$WORK/xcodebuild.log"; then
            echo "::error::xcodebuild failed. Last 80 lines:"
            tail -80 "$WORK/xcodebuild.log"
            exit 1
          fi

      - name: Package the .ipa
        if: steps.gate.outputs.ready == 'true'
        run: |
          APP=$(find "$WORK/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d | head -1)
          [ -n "$APP" ] || { echo "::error::No .app produced"; exit 1; }
          mkdir -p "$WORK/stage/Payload" "$WORK/out"
          cp -R "$APP" "$WORK/stage/Payload/"
          # An .ipa is a zip with Payload/ at its root. -y keeps framework symlinks as symlinks.
          (cd "$WORK/stage" && zip -qry "$WORK/out/CosmicShore-dev.ipa" Payload)
          ls -lh "$WORK/out/CosmicShore-dev.ipa"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"

      - name: Upload the .ipa
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CosmicShore-dev-ipa
          path: ios-work/out/CosmicShore-dev.ipa
          retention-days: 3
          if-no-files-found: error

      - name: Keep the build log on failure
        if: failure() && steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios-work/xcodebuild.log
          retention-days: 3
          if-no-files-found: ignore
