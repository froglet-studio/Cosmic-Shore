name: Publish browser Toybox

# The Web Toybox pipeline (Docs/WEBGL_TOYBOX.md section 5.3): stage -> promote -> rollback.
#
#   stage     a `web-v*` tag push, or Run workflow with action=stage. Takes the Unity Build Automation WebGL
#             Toybox build OF ONE COMMIT (the tag's, or the `commit` input; UBA is asked to build it when it has
#             not), uploads it to the STAGING root (toybox-staging/ in the bucket) with its manifest, and points
#             toybox-staging/latest.json at it. Nothing here touches /play. Environment: `toybox`.
#   promote   Run workflow with action=promote and the staged `version`. Copies that build into the production
#             root and points toybox/latest.json (what www.froglet.games/play loads) at it, recording the version
#             it replaces. Environment: `toybox-production`, which has required reviewers: the run waits for one.
#   rollback  Run workflow with action=rollback (and optionally `version`). Points toybox/latest.json back at the
#             previous (or named) version after checking every file of it is on R2. Environment: `toybox-production`.
#
# Every run ends by publishing launch-status records (Docs/LAUNCH/STATUS_CONTRACT.md): build-web and web-staging
# for a stage, web-production (with rollback_to) for a promote or rollback. A `web-v*-launchtest*` tag validates
# its records without pushing them.
#
# Secrets (names only; values live in the GitHub Environments):
#   toybox             UBA_API_KEY, UBA_ORG_ID, UBA_PROJECT_ID, UBA_TOYBOX_TARGET,
#                      R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#   toybox-production  R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET   (+ required reviewers)
# Optional environment VARIABLES (public URLs, not secrets): TOYBOX_STAGING_ROOT on `toybox` and
# TOYBOX_PRODUCTION_ROOT on `toybox-production`, e.g. https://play.froglet.games/toybox-staging; when set, the run
# reads the root back the way the page will (`publish_toybox.py check`).
#
# The work is Tools/Build/publish_toybox.py, which also runs by hand; its offline self-test runs in
# Launch tools check. Nothing in this file prints a secret or a response body.

on:
  push:
    tags: ["web-v*"]
  workflow_dispatch:
    inputs:
      action:
        description: "stage (to the staging root), promote (staging -> /play), rollback (/play to previous)"
        type: choice
        options: [stage, promote, rollback]
        default: stage
      commit:
        description: "stage: the commit whose UBA build to stage (default: the commit this run is on)"
        type: string
        default: ""
      version:
        description: "promote: the staged version (required). rollback: the version to return to (default: previous)"
        type: string
        default: ""
      start_uba_build:
        description: "stage: ask UBA to build the commit when it has no successful build of it yet"
        type: boolean
        default: true
      dry_run:
        description: "stage: list every object and its headers, upload nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: toybox-publish
  cancel-in-progress: false

env:
  # The whole dependency closure, exact. Nothing else is installed.
  PY_DEPS: >-
    boto3==1.43.100 botocore==1.43.100 s3transfer==0.19.3 jmespath==1.1.0
    python-dateutil==2.9.0.post0 six==1.17.0 urllib3==2.8.0

jobs:
  stage:
    if: github.event_name == 'push' || inputs.action == 'stage'
    runs-on: ubuntu-latest
    environment: toybox
    timeout-minutes: 150
    outputs:
      version: ${{ steps.unpack.outputs.version }}
      commit: ${{ steps.unpack.outputs.commit }}
      uba_build: ${{ steps.unpack.outputs.uba_build }}
      fetched: ${{ steps.fetch.outcome }}
      staged: ${{ steps.upload.outcome }}
      previous: ${{ steps.upload.outputs.previous }}
    steps:
      # Only the script: this is a ~2.7 GB Unity project and nothing else here is needed.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          sparse-checkout: Tools/Build/publish_toybox.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check the toybox environment's secrets
        env:
          UBA_API_KEY: ${{ secrets.UBA_API_KEY }}
          UBA_ORG_ID: ${{ secrets.UBA_ORG_ID }}
          UBA_PROJECT_ID: ${{ secrets.UBA_PROJECT_ID }}
          UBA_TOYBOX_TARGET: ${{ secrets.UBA_TOYBOX_TARGET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=()
          for name in UBA_API_KEY UBA_ORG_ID UBA_PROJECT_ID UBA_TOYBOX_TARGET \
                      R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing secrets in the toybox environment: ${missing[*]} (Docs/WEBGL_TOYBOX.md section 5.2 D)"
            exit 1
          fi
          echo "All eight toybox secrets are set."

      - name: Install the R2 client
        run: python3 -m pip install --quiet --no-deps $PY_DEPS

      - name: Fetch the UBA build of this commit
        id: fetch
        env:
          UBA_API_KEY: ${{ secrets.UBA_API_KEY }}
          UBA_ORG_ID: ${{ secrets.UBA_ORG_ID }}
          UBA_PROJECT_ID: ${{ secrets.UBA_PROJECT_ID }}
          UBA_TOYBOX_TARGET: ${{ secrets.UBA_TOYBOX_TARGET }}
          INPUT_COMMIT: ${{ inputs.commit }}
          START: ${{ github.event_name == 'push' || inputs.start_uba_build }}
        run: |
          commit="${INPUT_COMMIT:-$GITHUB_SHA}"
          args=(fetch-uba --commit "$commit" --out toybox.zip --meta-out uba.json)
          if [ "$START" = "true" ]; then args+=(--start-if-missing); fi
          python3 Tools/Build/publish_toybox.py "${args[@]}"

      - name: Unpack
        id: unpack
        run: |
          mkdir build
          unzip -q toybox.zip -d build
          build_folder=$(find build -type d -name Build -print -quit)
          if [ -z "$build_folder" ]; then echo "::error::the UBA zip holds no Build/ folder"; exit 1; fi
          echo "BUILD_DIR=$(dirname "$build_folder")" >> "$GITHUB_ENV"
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, re
          m = json.load(open("uba.json"))
          build, commit = str(m["build"]), m["commit"]
          assert re.fullmatch(r"[0-9]{1,9}", build) and re.fullmatch(r"[0-9a-f]{40}", commit), "bad UBA metadata"
          print(f"version={build}-{commit[:7]}")
          print(f"commit={commit}")
          print(f"uba_build={build}")
          print(f"finished={m.get('finished') or ''}")
          EOF

      - name: Upload to the staging root
        id: upload
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ steps.unpack.outputs.version }}
          COMMIT: ${{ steps.unpack.outputs.commit }}
          UBA_BUILD: ${{ steps.unpack.outputs.uba_build }}
          FINISHED: ${{ steps.unpack.outputs.finished }}
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          args=(upload --root staging --build-dir "$BUILD_DIR" --version "$VERSION" --commit "$COMMIT"
                --uba-build "$UBA_BUILD" --result-out staged.json)
          if [ -n "$FINISHED" ]; then args+=(--built-at "$FINISHED"); fi
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 Tools/Build/publish_toybox.py "${args[@]}"
          if [ -f staged.json ]; then
            python3 -c 'import json; print("previous=" + (json.load(open("staged.json")).get("previous") or ""))' >> "$GITHUB_OUTPUT"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "### Dry run: Toybox $VERSION (commit \`$COMMIT\`) was listed, nothing uploaded" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Toybox $VERSION on the staging root"
              echo "Commit \`$COMMIT\`, UBA build #$UBA_BUILD. To put it on /play: Run workflow, action **promote**, version **$VERSION**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Read the staging root back
        if: vars.TOYBOX_STAGING_ROOT != '' && inputs.dry_run != true
        env:
          ROOT: ${{ vars.TOYBOX_STAGING_ROOT }}
          VERSION: ${{ steps.unpack.outputs.version }}
        run: python3 Tools/Build/publish_toybox.py check --root "$ROOT" --expect-version "$VERSION"

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote'
    runs-on: ubuntu-latest
    environment: toybox-production
    timeout-minutes: 30
    outputs:
      version: ${{ steps.go.outputs.version }}
      commit: ${{ steps.go.outputs.commit }}
      previous: ${{ steps.go.outputs.previous }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          sparse-checkout: Tools/Build/publish_toybox.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the R2 client
        run: python3 -m pip install --quiet --no-deps $PY_DEPS
      - name: Promote the staged build to /play
        id: go
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then echo "::error::promote needs the staged version (input: version)"; exit 1; fi
          python3 Tools/Build/publish_toybox.py promote --from-staging "$VERSION" --result-out result.json
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          r = json.load(open("result.json"))
          for k in ("version", "commit", "previous"):
              print(f"{k}={r.get(k) or ''}")
          EOF
      - name: Read /play's root back
        if: vars.TOYBOX_PRODUCTION_ROOT != ''
        env:
          ROOT: ${{ vars.TOYBOX_PRODUCTION_ROOT }}
          VERSION: ${{ inputs.version }}
        run: python3 Tools/Build/publish_toybox.py check --root "$ROOT" --expect-version "$VERSION"

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    environment: toybox-production
    timeout-minutes: 30
    outputs:
      version: ${{ steps.go.outputs.version }}
      commit: ${{ steps.go.outputs.commit }}
      previous: ${{ steps.go.outputs.previous }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          sparse-checkout: Tools/Build/publish_toybox.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the R2 client
        run: python3 -m pip install --quiet --no-deps $PY_DEPS
      - name: Roll /play back
        id: go
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ inputs.version }}
        run: |
          args=(rollback --result-out result.json)
          if [ -n "$VERSION" ]; then args+=(--to "$VERSION"); fi
          python3 Tools/Build/publish_toybox.py "${args[@]}"
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          r = json.load(open("result.json"))
          for k in ("version", "commit", "previous"):
              print(f"{k}={r.get(k) or ''}")
          EOF
      - name: Read /play's root back
        if: vars.TOYBOX_PRODUCTION_ROOT != ''
        env:
          ROOT: ${{ vars.TOYBOX_PRODUCTION_ROOT }}
          VERSION: ${{ steps.go.outputs.version }}
        run: python3 Tools/Build/publish_toybox.py check --root "$ROOT" --expect-version "$VERSION"

  # The launch-status records, from a job that holds no R2 or UBA secret: only the repo token, to push the
  # launch-status branch.
  status:
    needs: [stage, promote, rollback]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          sparse-checkout: Tools/Launch
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Publish launch status
        env:
          STAGE_RESULT: ${{ needs.stage.result }}
          FETCHED: ${{ needs.stage.outputs.fetched }}
          STAGED: ${{ needs.stage.outputs.staged }}
          S_VERSION: ${{ needs.stage.outputs.version }}
          S_COMMIT: ${{ needs.stage.outputs.commit }}
          S_BUILD: ${{ needs.stage.outputs.uba_build }}
          S_PREVIOUS: ${{ needs.stage.outputs.previous }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
          ROLLBACK_RESULT: ${{ needs.rollback.result }}
          P_VERSION: ${{ needs.promote.outputs.version || needs.rollback.outputs.version }}
          P_COMMIT: ${{ needs.promote.outputs.commit || needs.rollback.outputs.commit }}
          P_PREVIOUS: ${{ needs.promote.outputs.previous || needs.rollback.outputs.previous }}
          INPUT_VERSION: ${{ inputs.version }}
          DRY: ${{ inputs.dry_run == true || contains(github.ref_name, 'launchtest') }}
        run: |
          set -eo pipefail   # not -u: a job that did not run leaves its outputs unset
          # Publish from a scratch repo whose only commit is empty, so the status worktree never checks out the
          # game's tree (this checkout is sparse); the push goes only to the launch-status branch.
          repo="$RUNNER_TEMP/status-repo"
          git init -q "$repo"
          git -C "$repo" -c user.name=launch-status -c user.email=launch-status@users.noreply.github.com \
            commit -q --allow-empty -m base
          git -C "$repo" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          header_key="http.$GITHUB_SERVER_URL/.extraheader"
          git -C "$repo" config "$header_key" "$(git config --get "$header_key")"

          flags=(--repo "$repo" --platform web)
          if [ "$DRY" = "true" ]; then flags+=(--dry-run); fi
          as_result() { case "$1" in success) echo success;; cancelled) echo cancelled;; skipped|"") echo skipped;; *) echo failure;; esac; }
          optional() { if [ -n "$2" ]; then printf '%s\n%s\n' "$1" "$2"; fi; }

          if [ "$STAGE_RESULT" != "skipped" ]; then
            build_result=$(as_result "$FETCHED")
            stage_result=$(as_result "$STAGE_RESULT")
            mapfile -t v < <(optional --version "$S_VERSION")
            mapfile -t b < <(optional --build "$S_BUILD")
            mapfile -t c < <(optional --commit "$S_COMMIT")
            python3 Tools/Launch/launch_status.py publish "${flags[@]}" --id build-web --kind build \
              --result "$build_result" "${v[@]}" "${b[@]}" "${c[@]}" \
              --summary "UBA WebGL Toybox build ${S_BUILD:-not fetched} for ${S_COMMIT:-$GITHUB_SHA}"
            mapfile -t r < <(optional --rollback-to "$S_PREVIOUS")
            python3 Tools/Launch/launch_status.py publish "${flags[@]}" --id web-staging --kind channel \
              --channel staging --result "$stage_result" "${v[@]}" "${b[@]}" "${c[@]}" "${r[@]}" \
              --summary "Toybox ${S_VERSION:-not staged} on the staging root (upload step: ${STAGED:-not run})" \
              --detail root=toybox-staging
          fi

          if [ "$PROMOTE_RESULT" != "skipped" ] || [ "$ROLLBACK_RESULT" != "skipped" ]; then
            if [ "$PROMOTE_RESULT" != "skipped" ]; then action=promote; res=$PROMOTE_RESULT; else action=rollback; res=$ROLLBACK_RESULT; fi
            mapfile -t v < <(optional --version "${P_VERSION:-$INPUT_VERSION}")
            mapfile -t c < <(optional --commit "$P_COMMIT")
            mapfile -t r < <(optional --rollback-to "$P_PREVIOUS")
            python3 Tools/Launch/launch_status.py publish "${flags[@]}" --id web-production --kind channel \
              --channel production --result "$(as_result "$res")" "${v[@]}" "${c[@]}" "${r[@]}" \
              --summary "Toybox $action to ${P_VERSION:-${INPUT_VERSION:-previous}} on /play: $res" \
              --detail action="$action" --detail root=toybox
          fi
