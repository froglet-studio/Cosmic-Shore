name: Promote test build

# Moves the test-build source into the Unity Build Automation branches, every
# three weeks on Wednesday at 06:00 Pacific.
#
# Where this sits in the release model (full picture in
# Docs/BRANCHING_AND_RELEASE.md):
#
#   bleeding-edge   internal build, weekly on Friday. UGS watches the branch
#                   directly, so no promotion happens here. See
#                   tag-internal-build.yml, which only tags it for traceability.
#   development     TEST build, every three weeks on Wednesday. THIS workflow.
#                   Promotes into build/android and build/windows.
#   master          release builds only. Manual today, no automation.
#
# The refs are moved through the GitHub API rather than by checking the repo
# out. Cosmic Shore is a ~2.7 GB Unity project and a full-history clone would
# dominate the runtime for what is ultimately a two-pointer update.

on:
  schedule:
    # Fires every Wednesday. Two entries because GitHub's scheduler runs on UTC
    # and never observes daylight saving: 13:00 UTC is 06:00 PDT and 14:00 UTC
    # is 06:00 PST. The guard below drops whichever one is an hour off today,
    # and also drops the two Wednesdays out of three that are not on cycle,
    # since cron cannot express "every three weeks" on its own.
    - cron: '0 13,14 * * 3'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or SHA to promote. Blank uses the configured source branch.
        default: ''
        required: false
      targets:
        description: Which build branches to move.
        type: choice
        options:
          - both
          - android
          - windows
        default: both

permissions:
  contents: write   # move refs and tags
  issues: write     # write the run report

concurrency:
  group: promote-test-build
  cancel-in-progress: false

env:
  ANDROID_BRANCH: build/android
  WINDOWS_BRANCH: build/windows
  # The three-week cycle is counted in whole days from this Wednesday.
  CYCLE_ANCHOR: '2026-08-12'
  CYCLE_DAYS: '21'
  REPORT_LABEL: build-promotion
  REPORT_TITLE: Test build promotion

jobs:
  promote:
    name: Promote to build branches
    runs-on: ubuntu-latest
    steps:
      - name: Is this run due?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Triggered manually; running regardless of day, hour and cycle."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          today=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          dow=$(TZ=America/Los_Angeles date +%u)                  # 3 = Wednesday
          hour=$((10#$(TZ=America/Los_Angeles date +%H)))         # 10# so "08" is not read as octal

          skip () { echo "$1 Skipping."; echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # Idempotency first, because it is what makes everything below safe to
          # relax. The dated tag is the record that today's promotion already
          # happened, so the daylight-saving twin, a retry, and any duplicate
          # firing all land here and stop.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/testbuild/$today" >/dev/null 2>&1; then
            skip "Already promoted on $today (tag testbuild/$today exists)."
          fi

          [ "$dow" = "3" ] || skip "$today is not a Wednesday in America/Los_Angeles."

          # >= 06, deliberately not == 06. GitHub's scheduler runs late under
          # load, routinely by more than an hour: the first scheduled run of this
          # workflow fired at 15:52 UTC against a 13:00 cron. An exact-hour test
          # silently dropped it, and would drop a real promotion the same way.
          # The tag check above is what stops the wider window running twice.
          [ "$hour" -ge 6 ] || skip "It is ${hour}:00 in America/Los_Angeles; the 06:00 slot has not opened."

          days=$(( ( $(date -u -d "$today" +%s) - $(date -u -d "$CYCLE_ANCHOR" +%s) ) / 86400 ))
          [ "$days" -ge 0 ] || skip "$today is before the cycle anchor $CYCLE_ANCHOR."
          if [ $(( days % CYCLE_DAYS )) -ne 0 ]; then
            skip "$today is day $days of the cycle; next promotion in $(( CYCLE_DAYS - (days % CYCLE_DAYS) )) day(s)."
          fi

          echo "$today is on cycle (day $days) and the 06:00 slot has opened. Proceeding."
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Resolve source commit
        id: source
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ github.event.inputs.source_ref }}
          # Repository variable wins over the default, so the test-build source
          # can be repointed without editing this file.
          CONFIGURED: ${{ vars.BUILD_SOURCE_BRANCH }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-}"
          [ -z "$ref" ] && ref="${CONFIGURED:-development}"

          if ! sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha); then
            echo "::error::Could not resolve '$ref' to a commit in $GITHUB_REPOSITORY."
            exit 1
          fi
          subject=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.commit.message' | head -1)

          echo "Promoting $ref -> ${sha:0:8} ($subject)"
          {
            echo "ref=$ref"
            echo "sha=$sha"
            echo "subject=$subject"
          } >> "$GITHUB_OUTPUT"

      # Static validation, first line of defence. No Unity and no runner, so it
      # can block a promotion in seconds. Only the code trees are checked out:
      # Assets/_Scripts is 22 MB against 1.4 GB for all of Assets, and the
      # blocking check only ever reads .cs files.
      - name: Check out code for validation
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1
          sparse-checkout: |
            Assets/_Scripts
            Tools/CI
          sparse-checkout-cone-mode: false

      - name: Validate project
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          # meta needs the whole Assets tree, which is deliberately not checked
          # out here. build-branch-ci.yml runs the full set after promotion.
          python3 Tools/CI/validate_project.py --github --skip meta

      - name: Require a green source commit
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.sha }}
          REQUIRE_GREEN: ${{ vars.BUILD_PROMOTION_REQUIRES_GREEN }}
        run: |
          set -euo pipefail
          conclusions=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
            --jq '[.check_runs[] | select(.status == "completed") | .conclusion] | join(" ")' \
            2>/dev/null || true)

          failed=""
          for c in $conclusions; do
            case "$c" in
              failure|timed_out|cancelled|action_required) failed="yes" ;;
            esac
          done

          if [ -n "$conclusions" ]; then
            echo "Check runs on ${SHA:0:8}: $conclusions"
          else
            echo "No completed check runs on ${SHA:0:8}."
          fi

          # Inert until someone opts in, exactly like UNITY_RUNNER_LABEL in
          # unity-ci.yml. Turning this on before Unity CI actually runs would
          # block every promotion on evidence that does not exist yet.
          if [ "${REQUIRE_GREEN:-false}" != "true" ]; then
            echo "BUILD_PROMOTION_REQUIRES_GREEN is not 'true'; promoting without a CI gate."
            exit 0
          fi

          if [ -n "$failed" ]; then
            echo "::error::Refusing to promote ${SHA:0:8} into the build branches: CI is red."
            exit 1
          fi
          if [ -z "$conclusions" ]; then
            echo "::error::Refusing to promote ${SHA:0:8}: no completed check runs to trust."
            exit 1
          fi
          echo "Source commit is green."

      - name: Promote build branches
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.sha }}
          SUBJECT: ${{ steps.source.outputs.subject }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
          TARGETS: ${{ github.event.inputs.targets || 'both' }}
        run: |
          set -euo pipefail

          # Built once here, then reused for both the job summary and the
          # tracking issue comment so the two can never disagree.
          {
            echo "Source \`$SOURCE_REF\` at \`${SHA:0:8}\` — $SUBJECT"
            echo
            echo "| Branch | Was | Now |"
            echo "| --- | --- | --- |"
          } > "$RUNNER_TEMP/report.md"

          promote () {
            branch="$1"
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha 2>/dev/null || true)

            if [ -z "$current" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=refs/heads/$branch" -f "sha=$SHA" >/dev/null
              echo "Created $branch at ${SHA:0:8}"
              echo "| \`$branch\` | did not exist | \`${SHA:0:8}\` |" >> "$RUNNER_TEMP/report.md"
            elif [ "$current" = "$SHA" ]; then
              echo "$branch is already at ${SHA:0:8}; nothing to do."
              echo "| \`$branch\` | \`${current:0:8}\` | \`${SHA:0:8}\` (unchanged) |" >> "$RUNNER_TEMP/report.md"
            else
              # force, because build branches are disposable snapshots of the
              # source ref and are never committed to directly.
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" \
                -f "sha=$SHA" -F force=true >/dev/null
              echo "Moved $branch from ${current:0:8} to ${SHA:0:8}"
              echo "| \`$branch\` | \`${current:0:8}\` | \`${SHA:0:8}\` |" >> "$RUNNER_TEMP/report.md"
            fi
          }

          case "$TARGETS" in
            both)    promote "$ANDROID_BRANCH"; promote "$WINDOWS_BRANCH" ;;
            android) promote "$ANDROID_BRANCH" ;;
            windows) promote "$WINDOWS_BRANCH" ;;
            *)       echo "::error::Unknown target '$TARGETS'."; exit 1 ;;
          esac

      - name: Tag the build
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          # A dated tag per test build, so a QA report naming a build date still
          # resolves to an exact commit months later.
          tag="testbuild/$(TZ=America/Los_Angeles date +%Y-%m-%d)"

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f "sha=$SHA" -F force=true >/dev/null
            echo "Re-pointed existing tag $tag at ${SHA:0:8}"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$SHA" >/dev/null
            echo "Tagged ${SHA:0:8} as $tag"
          fi

          echo "" >> "$RUNNER_TEMP/report.md"
          echo "Tagged \`$tag\`." >> "$RUNNER_TEMP/report.md"

      - name: Report
        if: always() && steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          body="$RUNNER_TEMP/body.md"
          if [ "$STATUS" = "success" ]; then
            echo "### Test build promoted" > "$body"
          else
            echo "### Test build promotion FAILED" > "$body"
          fi
          echo "" >> "$body"

          if [ -s "$RUNNER_TEMP/report.md" ]; then
            cat "$RUNNER_TEMP/report.md" >> "$body"
          else
            echo "The run failed before it moved any refs." >> "$body"
          fi

          {
            echo ""
            if [ "$STATUS" != "success" ]; then
              echo "**The test build will be stale or missing until this is fixed.**"
              echo ""
            fi
            echo "[Full log]($RUN_URL) · $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"
          } >> "$body"

          cat "$body" >> "$GITHUB_STEP_SUMMARY"

          # The label is how the tracking issue is found again next cycle; the
          # title is only cosmetic. Creating it is idempotent.
          gh api -X POST "repos/$GITHUB_REPOSITORY/labels" \
            -f name="$REPORT_LABEL" -f color="1d76db" \
            -f description="Test build promotion reports" >/dev/null 2>&1 || true

          num=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&labels=$REPORT_LABEL&per_page=1" \
            --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -z "$num" ]; then
            num=$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues" \
              -f title="$REPORT_TITLE" -f body="$(cat "$body")" \
              -f "labels[]=$REPORT_LABEL" --jq .number)
            echo "Opened tracking issue #$num"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$num/comments" \
              -f body="$(cat "$body")" >/dev/null
            echo "Commented on tracking issue #$num"
          fi

          # Issue state IS the health signal: closed means the last run was
          # good, open means the pipeline needs attention. Comments notify
          # subscribers either way, so a healthy cycle is never silent.
          if [ "$STATUS" = "success" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$num" -f state=closed >/dev/null
            echo "Pipeline healthy; issue #$num closed."
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$num" -f state=open >/dev/null
            echo "::warning::Promotion failed. Tracking issue #$num is open."
          fi

      - name: Report skipped run
        if: steps.gate.outputs.proceed != 'true'
        run: |
          echo "Not this Wednesday: either the daylight-saving twin, or an off-cycle week." \
            >> "$GITHUB_STEP_SUMMARY"
