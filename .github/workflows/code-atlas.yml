# Code Atlas: the whole repository as the graph the Loop Atlas map zooms into (Docs/LoopAtlas/CODE.md).
# Proves the extractor (self-test with negative controls), builds it strictly (a hand link in Docs/LoopAtlas/code/links.yaml
# that matches nothing fails), and keeps the output as a workflow artifact for the session that republishes the map.
# Nightly on bleeding-edge, and on changes to the tool, the links or the page. No secrets, read-only token not kept on disk.
name: Code Atlas

on:
  pull_request:
    paths:
      - "Tools/Build/code_atlas.py"
      - "Docs/LoopAtlas/code/**"
      - "Docs/LoopAtlas/page/**"
      - ".github/workflows/code-atlas.yml"
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'schedule' && 'bleeding-edge' || '' }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            Assets
            Docs
            Tools/Build
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PyYAML and Pillow
        run: python -m pip install --quiet "pyyaml==6.0.2" "pillow==11.0.0" "jsonschema==4.23.0"
      - name: Negative controls
        run: python Tools/Build/code_atlas.py self-test
      - name: Build (strict links)
        run: python Tools/Build/code_atlas.py build --strict --out code-out
      - name: Page builds with the model
        run: python Tools/Build/loop_atlas.py build --html code-out/LoopAtlas.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-atlas
          path: code-out
          retention-days: 7
