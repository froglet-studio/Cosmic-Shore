# Launch tools check: every tool under Tools/Launch/ proves itself on each change.
#
# Each Tools/Launch/*.py that has a `self-test` subcommand runs it, and so does the one launch tool that lives
# elsewhere (Tools/Build/publish_toybox.py, the Web Toybox pipeline). A self-test includes its negative control
# (records or inputs the tool must refuse), so a tool that stops refusing fails here. launch_status.py's self-test
# also publishes end to end against a throwaway local remote (never GitHub).
# Then every launch workflow (launch-*.y*ml, release*.y*ml, and toybox-publish.yml) must pin its third-party actions
# to a commit sha (Tools/Launch/check_action_pins.py).
# No secrets, read-only token not kept on disk, GitHub-hosted runner. Fork pull requests are safe to run.
name: Launch tools check

on:
  pull_request:
    paths:
      - "Tools/Launch/**"
      - "Tools/Build/publish_toybox.py"
      - ".github/workflows/toybox-publish.yml"
      - ".github/workflows/launch-*.yml"
      - ".github/workflows/launch-*.yaml"
      - ".github/workflows/release*.yml"
      - ".github/workflows/release*.yaml"
  push:
    branches: [bleeding-edge]
    paths:
      - "Tools/Launch/**"
      - "Tools/Build/publish_toybox.py"
      - ".github/workflows/toybox-publish.yml"
      - ".github/workflows/launch-*.yml"
      - ".github/workflows/launch-*.yaml"
      - ".github/workflows/release*.yml"
      - ".github/workflows/release*.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-tools-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Sparse + depth 1: only Tools/Launch, .github and the root files are checked out, and with a sparse checkout
      # this action fetches with --filter=blob:none, so the Unity project's blobs are never downloaded.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            Tools/Launch
            Tools/Build/publish_toybox.py
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run every launch tool's self-test
        run: |
          set -euo pipefail
          status=0
          ran=0
          for tool in Tools/Launch/*.py Tools/Build/publish_toybox.py; do
            [ -f "$tool" ] || continue
            if grep -q '"self-test"' "$tool"; then
              ran=$((ran + 1))
              echo "::group::$tool"
              if python3 "$tool" self-test; then echo "PASS $tool"; else echo "::error file=$tool::self-test failed"; status=1; fi
              echo "::endgroup::"
            fi
          done
          if [ "$ran" -eq 0 ]; then echo "::error::no launch tool self-test ran (is Tools/Launch checked out?)"; exit 1; fi
          exit $status
      - name: Every launch workflow pins third-party actions to a commit
        # Runs even when a self-test failed, so one red check never hides the other.
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          status=0
          python3 Tools/Launch/check_action_pins.py check || status=1
          # The Web Toybox pipeline is a launch workflow outside the launch-*/release* names.
          python3 Tools/Launch/check_action_pins.py check .github/workflows/toybox-publish.yml || status=1
          exit $status
