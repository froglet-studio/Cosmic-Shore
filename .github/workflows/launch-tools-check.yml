# Launch tools check: every tool under Tools/Launch/ proves itself on each change.
#
# Each Tools/Launch/*.py that has a `self-test` subcommand runs it, and so does the one launch tool that lives
# elsewhere (Tools/Build/publish_toybox.py, the Web Toybox pipeline). A self-test includes its negative control
# (a record or input the tool must refuse), so a tool that stops refusing fails here.
# No secrets, read-only token, GitHub-hosted runner. Fork pull requests are safe to run.
name: Launch tools check

on:
  pull_request:
    paths:
      - "Tools/Launch/**"
      - "Tools/Build/publish_toybox.py"
      - ".github/workflows/toybox-publish.yml"
      - ".github/workflows/launch-*.yml"
      - ".github/workflows/release*.yml"
  push:
    branches: [bleeding-edge]
    paths:
      - "Tools/Launch/**"
      - "Tools/Build/publish_toybox.py"
      - ".github/workflows/toybox-publish.yml"
      - ".github/workflows/launch-*.yml"
      - ".github/workflows/release*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-tools-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          sparse-checkout: |
            Tools/Launch
            Tools/Build/publish_toybox.py
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run every launch tool's self-test
        run: |
          set -euo pipefail
          status=0
          for tool in Tools/Launch/*.py Tools/Build/publish_toybox.py; do
            if grep -q '"self-test"' "$tool"; then
              echo "::group::$tool"
              if python3 "$tool" self-test; then echo "PASS $tool"; else echo "::error file=$tool::self-test failed"; status=1; fi
              echo "::endgroup::"
            fi
          done
          exit $status
      - name: Every launch workflow pins third-party actions to a commit
        run: |
          set -euo pipefail
          # A `uses:` that names a tag or branch instead of a 40-character sha fails this check (local actions excepted).
          bad=$(grep -HnE '^\s*-?\s*uses:\s*[^ ./][^@]*@' .github/workflows/launch-*.yml .github/workflows/release*.yml \
                  .github/workflows/toybox-publish.yml 2>/dev/null \
                | grep -vE '@[0-9a-f]{40}(\s|$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Unpinned actions in launch workflows:"; echo "$bad"; exit 1
          fi
          echo "All launch workflow actions are pinned to a commit."
