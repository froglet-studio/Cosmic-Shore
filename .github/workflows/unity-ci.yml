# Unity CI - tiered build verification.
#
# Tiers (chosen deliberately for cost-to-coverage):
#   compile  - edit-mode tests, which force a full script compile. Runs on every PR. ~5-15 min.
#   mono     - Mono standalone player build. Nightly. Proves scenes, assets, and build settings
#              actually produce a player. ~20-40 min.
#   il2cpp   - Full IL2CPP release build. Weekly. The only tier that catches AOT/generic failures
#              and native link errors, i.e. the ones that only appear in a shipping build.
#
# RUNNER IS NOT DECIDED YET. The `unity` job is SKIPPED until the repository variable
# UNITY_RUNNER_LABEL is set, and then targets whatever label it names. Skipping (rather than
# defaulting to a label that may not exist) matters: a job queued for a non-existent runner shows as
# a permanently pending check on every PR and is only reaped by GitHub after ~24h - `timeout-minutes`
# does not apply to queue time. Set the variable the day a runner is registered; no other edit is
# needed. See Docs/BUILD_AND_DELIVERY.md section 10 for what each hosting option requires (a
# GitHub-hosted runner additionally needs Unity license secrets and almost certainly more disk than
# the standard image provides).
#
# The runner is expected to have Unity 6000.3.17f1 installed and activated, with UNITY_PATH set
# as an environment variable or repository variable pointing at the editor executable.

name: Unity CI

on:
  pull_request:
    branches: [bleeding-edge]
  schedule:
    - cron: '0 7 * * *'    # 07:00 UTC daily   -> mono player build   (bleeding-edge)
    - cron: '0 8 * * 0'    # 08:00 UTC Sunday  -> il2cpp release build (bleeding-edge)
    # 13:00 UTC Tuesday -> il2cpp PRE-FLIGHT against development, the day before
    # a promotion Wednesday. One cron, not the DST twin pair the promotion
    # workflows use: 13:00 UTC is 06:00 PDT / 05:00 PST, and an hour of seasonal
    # drift is immaterial for a check whose whole purpose is to leave a full day
    # of slack. The twin machinery exists there to hit an exact business hour.
    - cron: '0 13 * * 2'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Tier to run'
        type: choice
        options: [compile, mono, il2cpp]
        default: compile

# Read-only by default. Nothing here writes to the repo.
permissions:
  contents: read

# Supersede in-flight PR runs; never cancel a scheduled build midway.
concurrency:
  group: unity-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ──────────────────────────────────────────────
  #  Decide which tier this invocation is
  # ──────────────────────────────────────────────
  resolve:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      ref: ${{ steps.pick.outputs.ref }}
      proceed: ${{ steps.pick.outputs.proceed }}
    env:
      # Must match sync-build-branches.yml. The pre-flight is only meaningful on
      # the Tuesday before a promotion, so it counts the same cycle.
      CYCLE_ANCHOR: '2026-08-12'
      CYCLE_DAYS: '21'
    steps:
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          SCHEDULE="${{ github.event.schedule }}"
          PROCEED=true

          if   [[ "$EVENT" == "workflow_dispatch" ]]; then MODE="${{ inputs.mode }}"; REF=""
          elif [[ "$EVENT" == "pull_request"      ]]; then MODE="compile";            REF=""

          # ── Tuesday pre-flight, against development ──
          # development is what the Wednesday promotion moves into build/* for UGS
          # to build. Nothing else ever player-builds it: the nightly and weekly
          # tiers are pinned to bleeding-edge, and the branch guard only compiles.
          # Without this, UGS produces the FIRST player build anyone has made of
          # that code - which is the "find out at build time" failure this whole
          # pipeline exists to prevent. IL2CPP, because that is the backend a
          # shipping build uses; a Mono pass cannot see AOT or native link errors.
          elif [[ "$SCHEDULE" == "0 13 * * 2" ]]; then
            MODE="il2cpp"; REF="development"

            # Only the Tuesday before an ON-CYCLE Wednesday. Promotion runs every
            # three weeks, so firing every Tuesday would spend two IL2CPP builds
            # in three on a commit nothing is about to ship.
            tomorrow="$(date -u -d 'tomorrow' +%F)"
            days=$(( ( $(date -u -d "$tomorrow" +%s) - $(date -u -d "$CYCLE_ANCHOR" +%s) ) / 86400 ))
            if [[ "$days" -lt 0 ]]; then
              PROCEED=false
              echo "Tomorrow ($tomorrow) is before the cycle anchor $CYCLE_ANCHOR; no pre-flight."
            elif [[ $(( days % CYCLE_DAYS )) -ne 0 ]]; then
              PROCEED=false
              echo "Tomorrow ($tomorrow) is day $days of the cycle, not a promotion Wednesday; no pre-flight."
            else
              echo "Tomorrow ($tomorrow) is a promotion Wednesday. Pre-flighting development."
            fi

          elif [[ "$SCHEDULE" == "0 8 * * 0" ]]; then MODE="il2cpp"; REF="bleeding-edge"
          else                                        MODE="mono";   REF="bleeding-edge"
          fi

          # Scheduled workflows always run the DEFAULT branch's copy of this file and check out the
          # default branch, so every scheduled tier names its ref explicitly above rather than
          # inheriting whatever the default branch happens to be.

          echo "mode=$MODE"       >> "$GITHUB_OUTPUT"
          echo "ref=$REF"         >> "$GITHUB_OUTPUT"
          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"
          echo "Tier: $MODE   ref: ${REF:-<event default>}   proceed: $PROCEED"

  # ──────────────────────────────────────────────
  #  Release-build static checks (no Unity, no license)
  #
  #  Deliberately on ubuntu-latest, NOT the Unity runner: this must actually run
  #  on every PR, including while the Unity tiers sit queued waiting for a
  #  self-hosted runner to exist. It reproduces the Release preprocessor in
  #  Python and catches the guard mistakes that are invisible in the Editor and
  #  only ever surface as a red automated build.
  #
  #  See Docs/CONDITIONAL_COMPILATION.md.
  # ──────────────────────────────────────────────
  conditional-compilation:
    needs: resolve      # only for outputs.ref, so scheduled runs pin to bleeding-edge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          lfs: false          # source-only check; binary assets are not needed
          fetch-depth: 1

      # The checker has no-opped before while still reporting "OK". Prove it can
      # still detect its own fixtures BEFORE trusting a clean scan.
      - name: Verify the checker still detects
        run: python3 Tools/Build/check_conditional_compilation.py --self-test

      - name: Check conditional compilation
        run: python3 Tools/Build/check_conditional_compilation.py --root Assets

  # ──────────────────────────────────────────────
  #  Run it
  # ──────────────────────────────────────────────
  unity:
    needs: resolve
    # No runner configured yet -> skip cleanly instead of queueing forever against a label that
    # does not exist. Set UNITY_RUNNER_LABEL (repo Settings > Variables) to switch this on.
    # `proceed` is false only for a Tuesday pre-flight landing on an off-cycle
    # week; every other path leaves it true.
    if: vars.UNITY_RUNNER_LABEL != '' && needs.resolve.outputs.proceed == 'true'
    runs-on: ${{ vars.UNITY_RUNNER_LABEL }}
    timeout-minutes: 240

    env:
      MODE: ${{ needs.resolve.outputs.mode }}
      BUILD_OUTPUT: Builds/Windows64
      TEST_RESULTS: Artifacts/editmode-results.xml

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          lfs: true          # the project stores binary assets in Git LFS
          fetch-depth: 1
          # Do NOT clean. The default runs `git clean -ffdx`, which deletes
          # Library/ on every run and forces a full asset reimport - 18 minutes
          # of the last compile run, and far worse for an IL2CPP build. A warm
          # Library is the entire reason this tier runs on an owned machine.
          # Tracked files are still force-reset by the checkout itself, so the
          # working tree is faithful to the commit regardless.
          clean: false

      - name: Resolve Unity
        shell: bash
        run: |
          set -euo pipefail
          # UNITY_PATH may come from the runner environment or a repository variable.
          UNITY="${UNITY_PATH:-${{ vars.UNITY_PATH }}}"
          if [[ -z "$UNITY" ]]; then
            echo "::error::UNITY_PATH is not set. Point it at the Unity 6000.3.17f1 executable on the runner."
            exit 1
          fi
          if [[ ! -x "$UNITY" ]]; then
            echo "::error::UNITY_PATH is not executable: $UNITY"
            exit 1
          fi

          EXPECTED="$(grep '^m_EditorVersion:' ProjectSettings/ProjectVersion.txt | awk '{print $2}')"
          echo "Project expects Unity $EXPECTED"
          echo "UNITY=$UNITY" >> "$GITHUB_ENV"

      # ── compile tier ────────────────────────────
      # Edit-mode tests force a full compile of runtime, editor, and test assemblies, so a broken
      # push fails here. Note: -runTests must NOT be combined with -quit.
      - name: Edit-mode tests
        if: env.MODE == 'compile'
        id: tests
        continue-on-error: ${{ vars.UNITY_TESTS_BLOCKING == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Artifacts
          "$UNITY" -batchmode -nographics \
                   -projectPath "$PWD" \
                   -runTests -testPlatform EditMode \
                   -testResults "$PWD/$TEST_RESULTS" \
                   -logFile -

      # ── mono / il2cpp tiers ─────────────────────
      - name: Player build
        if: env.MODE != 'compile'
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(-quit -batchmode -nographics
                -projectPath "$PWD"
                -executeMethod CosmicShore.Editor.CosmicShoreBuildPipeline.BuildWindowsRelease
                -buildOutput "$BUILD_OUTPUT"
                # github.sha, not `git rev-parse HEAD`: actions/checkout writes its
                # safe.directory exception into a TEMPORARY gitconfig and removes it
                # afterwards, so a later step shelling out to git hits "detected
                # dubious ownership" and exits 128 whenever the workspace is owned by
                # a different principal than the runner user. The SHA is already in
                # the context; asking git for it was a dependency with no upside.
                -buildCommit "${{ github.sha }}"
                -logFile -)

          # The nightly tier uses Mono: it proves the project still produces a player in a third of
          # the time. The weekly tier leaves IL2CPP on, which is what a shipping build uses.
          if [[ "$MODE" == "mono" ]]; then ARGS+=(-useMono); fi

          "$UNITY" "${ARGS[@]}"

      - name: Verify build output
        if: env.MODE != 'compile'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$BUILD_OUTPUT/CosmicShore.exe" ]]; then
            echo "::error::Build reported success but $BUILD_OUTPUT/CosmicShore.exe is missing."
            exit 1
          fi
          echo "### Build manifest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$BUILD_OUTPUT/build_manifest.txt" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ── artifacts ───────────────────────────────
      # Test results and the manifest only. The player itself is multiple GB and is not worth
      # pushing through artifact storage nightly; SteamPipe uploads come from the build machine.
      - name: Upload test results
        if: always() && env.MODE == 'compile'
        uses: actions/upload-artifact@v4
        with:
          name: editmode-results
          path: Artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build manifest
        if: always() && env.MODE != 'compile'
        uses: actions/upload-artifact@v4
        with:
          name: build-manifest-${{ env.MODE }}
          path: ${{ env.BUILD_OUTPUT }}/build_manifest.txt
          if-no-files-found: ignore
          retention-days: 30

      # Self-hosted runners keep the workspace between jobs. Library/ must persist (it is what makes
      # incremental builds fast), but the player output should not accumulate build over build.
      - name: Clean player output
        if: always() && env.MODE != 'compile'
        shell: bash
        run: rm -rf "$BUILD_OUTPUT" || true

      - name: Fail if tests were non-blocking but red
        if: env.MODE == 'compile' && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Edit-mode tests failed but UNITY_TESTS_BLOCKING is set to false, so this run is not being failed."
