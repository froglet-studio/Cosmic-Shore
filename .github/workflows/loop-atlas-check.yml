# Loop Atlas check: the loop model (Docs/LoopAtlas/model/*.yaml) is whole, matches its schema, and model.json was
# rebuilt from it. Runs Tools/Build/loop_atlas.py's negative controls first, so a check that stops refusing fails here.
# No secrets, read-only token not kept on disk, GitHub-hosted runner, sparse checkout (no Unity blobs).
name: Loop Atlas check

on:
  pull_request:
    paths:
      - "Docs/LoopAtlas/**"
      - "Tools/Build/loop_atlas.py"
      - "Tools/Build/loop_timescale_sim.py"
      - "Tools/Build/loop_journeys.py"
      - ".github/workflows/loop-atlas-check.yml"
  push:
    branches: [bleeding-edge]
    paths:
      - "Docs/LoopAtlas/**"
      - "Tools/Build/loop_atlas.py"
      - "Tools/Build/loop_timescale_sim.py"
      - "Tools/Build/loop_journeys.py"
      - ".github/workflows/loop-atlas-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loop-atlas-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            Docs/LoopAtlas
            Tools/Build/loop_atlas.py
            Tools/Build/loop_timescale_sim.py
            Tools/Build/loop_journeys.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PyYAML and jsonschema
        run: python -m pip install --quiet "pyyaml==6.0.2" "jsonschema==4.23.0"
      - name: Negative controls
        run: python Tools/Build/loop_atlas.py self-test
      - name: Model valid and model.json up to date
        run: python Tools/Build/loop_atlas.py --check
      - name: Timescale simulation negative controls
        run: python Tools/Build/loop_timescale_sim.py self-test
      - name: Timescale simulation outputs up to date
        run: python Tools/Build/loop_timescale_sim.py --check
      - name: Player journeys refuse bad input
        run: python Tools/Build/loop_journeys.py self-test
      - name: Player journeys valid and journeys.json up to date
        run: python Tools/Build/loop_journeys.py --check
      - name: Drift report (informational)
        run: python Tools/Build/loop_atlas.py report
