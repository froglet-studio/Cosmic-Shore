# Loop Atlas check: the loop model (Docs/LoopAtlas/model/*.yaml) is whole, matches its schema, and model.json was
# rebuilt from it. Runs Tools/Build/loop_atlas.py's negative controls first, so a check that stops refusing fails here.
# No secrets, read-only token not kept on disk, GitHub-hosted runner, sparse checkout (no Unity blobs).
name: Loop Atlas check

on:
  pull_request:
    paths:
      - "Docs/LoopAtlas/**"
      - "Tools/Build/loop_atlas.py"
      - ".github/workflows/loop-atlas-check.yml"
  push:
    branches: [bleeding-edge]
    paths:
      - "Docs/LoopAtlas/**"
      - "Tools/Build/loop_atlas.py"
      - ".github/workflows/loop-atlas-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loop-atlas-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            Docs/LoopAtlas
            Tools/Build/loop_atlas.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PyYAML and jsonschema
        run: python -m pip install --quiet "pyyaml==6.0.2" "jsonschema==4.23.0"
      - name: Negative controls
        run: python Tools/Build/loop_atlas.py self-test
      - name: Model valid and model.json up to date
        run: python Tools/Build/loop_atlas.py --check
      - name: Drift report (informational)
        run: python Tools/Build/loop_atlas.py report
