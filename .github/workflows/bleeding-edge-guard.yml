name: Bleeding-edge guard

# Verifies every commit that LANDS on an integration branch, and attempts a
# repair when one breaks. This is the workflow that exists so nobody has to
# discover a broken trunk by hand at build time.
#
# Guards TWO branches, for different reasons:
#   bleeding-edge  all work lands here, so a break is cheapest to fix while it
#                  is still one push old rather than fifty commits deep.
#   development    the source the Wednesday promotion reads. BUILD_PROMOTION_
#                  REQUIRES_GREEN gates on check-runs against that commit, so
#                  without CI here that gate can never be switched on.
#
# Why a push trigger and not just the PR gate in unity-ci.yml:
#   Most work reaches these branches as a direct merge push
#   ("Merge remote-tracking branch 'origin/claude/...' into bleeding-edge"),
#   which fires no pull_request event at all. unity-ci.yml therefore never sees
#   those commits. This does.
#
# Defence in depth, cheapest first:
#   1. validate  - static checks, ubuntu, seconds, no Unity and no license. Also
#                  decides whether stage 2 is warranted at all (see the scope
#                  step): a docs-only push cannot break a Unity build.
#   2. unity     - a real compile (edit-mode tests force one), on a GitHub-hosted
#                  ubuntu runner in GameCI's Unity image, licensed from the
#                  `unity-ci` GitHub Environment. The only stage that can see the
#                  failures Python cannot: package-level compile errors, editor
#                  assemblies, asset import breakage. While that environment holds
#                  no Unity licence it runs the reference compile
#                  (Tools/Build/unity_refcompile) instead and says so: that catches
#                  `error CS` in project code but is not a Unity compile.
#   3. report    - one self-closing tracking issue PER BRANCH saying whether
#                  that branch is broken right now (bleeding-edge and development
#                  only; a dispatch on any other branch reports in the run alone).
#   4. autofix   - Claude repairs the mechanical classes of failure and opens a
#                  PR. It NEVER pushes to the guarded branch directly; a bad
#                  autofix landing unreviewed on trunk is worse than the break.
#                  Guarded branches only.
#
# History: until 2026-10-13 stage 2 ran on a self-hosted runner (label
# cosmic-build-win) on a developer's everyday PC. It was removed because this
# repository is public, and nothing compiled the game on push until this job
# moved to GitHub-hosted runners (2026-11-01). Docs/BUILD_AND_DELIVERY.md 10.1.
#
# SECURITY: this repository is public. No self-hosted runner is used here. The
# Unity licence is in the `unity-ci` Environment, whose deployment branches must
# be limited to bleeding-edge and development, so a workflow on any other branch
# (or a fork pull request, which never receives secrets anyway) cannot read it.
# Every third-party action is pinned to a commit SHA and the Unity image to a
# digest. Docs/BUILD_AND_DELIVERY.md section 10.1 (Secrets).

on:
  push:
    # bleeding-edge is where all work lands, so a break there is cheapest to fix
    # while it is still one push old. development is the source the Wednesday
    # promotion reads, and BUILD_PROMOTION_REQUIRES_GREEN gates on check-runs
    # against THAT commit - without CI here that gate can never be switched on.
    branches: [bleeding-edge, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed by ref, NOT a fixed string. A shared group would make a push to
  # development cancel an in-flight bleeding-edge run and vice versa, silently
  # leaving one of the two branches unverified. Within a single branch a newer
  # push still supersedes: there is no value in verifying a commit that is
  # already not the tip.
  group: branch-guard-${{ github.ref }}
  cancel-in-progress: true

env:
  # Per-branch, so a broken development never reads as a broken bleeding-edge.
  # The label is how the tracking issue is found again on the next run, the same
  # convention sync-build-branches.yml uses for its promotion report.
  REPORT_LABEL: ci-${{ github.ref_name }}
  REPORT_TITLE: '${{ github.ref_name }} is broken'

jobs:
  # ──────────────────────────────────────────────
  #  1. Static validation - always runs, no Unity
  # ──────────────────────────────────────────────
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # Whether this push touched anything a Unity compile could possibly care
      # about. Read by the unity job to skip the expensive stage on pushes that
      # cannot affect a build.
      unity_relevant: ${{ steps.scope.outputs.unity_relevant }}
      # Every generator whose --check failed (basenames, space-separated); empty when all match.
      # Read by the report job so the tracking issue names each one.
      red_generators: ${{ steps.generators.outputs.red }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false        # source-only checks; binary assets are not needed
          fetch-depth: 1

      # A docs-only push cannot break a Unity build, and proving that costs tens
      # of minutes of a hosted runner and a Unity licence activation. Compare the pushed range through the API
      # rather than deepening the checkout: this is a ~2.8 GB repository and
      # fetch-depth 0 would cost more than the compile being avoided.
      #
      # Fail SAFE in every direction. A first push to a branch, a force-push, a
      # manual dispatch, an API hiccup, or a range so large the compare endpoint
      # truncates its file list - all resolve to "run the compile". Skipping is
      # only ever chosen from positive evidence that nothing relevant changed.
      - name: Decide whether a Unity compile is warranted
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          run_it() { echo "unity_relevant=true"  >> "$GITHUB_OUTPUT"; echo "Unity compile: RUN ($1)"; exit 0; }
          skip_it(){ echo "unity_relevant=false" >> "$GITHUB_OUTPUT"; echo "Unity compile: SKIP ($1)"; exit 0; }

          [ "$EVENT" = "push" ] || run_it "not a push event"
          case "$BEFORE" in
            ''|0000000000000000000000000000000000000000) run_it "no usable before-SHA (new branch or force-push)" ;;
          esac

          resp=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" 2>/dev/null) \
            || run_it "compare API unavailable"

          # The compare endpoint caps its file list at 300. A truncated list
          # cannot prove absence, so treat it as relevant.
          total=$(echo "$resp" | jq -r '.files | length')
          [ "$total" -ge 300 ] && run_it "$total files (compare list truncated)"

          files=$(echo "$resp" | jq -r '.files[].filename')
          echo "Changed files ($total):"; echo "$files" | sed 's/^/  /'

          if echo "$files" | grep -qE '^(Assets/|Packages/|ProjectSettings/|Tools/CI/|Tools/Build/|\.github/workflows/)'; then
            run_it "touched code, assets, project settings, CI tooling or a workflow"
          fi
          skip_it "nothing a Unity build reads was changed"

      # These checkers have no-opped while still reporting OK. Prove they can
      # detect their own fixtures BEFORE trusting a clean scan. The roster gate
      # earns its place here: it finds its work by matching a script guid, so a
      # moved file degrades it to "scanned nothing, OK" - and its first draft
      # shipped a parser that read every roster as empty and passed.
      - name: Self-test the validators
        run: |
          set -euo pipefail
          python3 Tools/CI/test_validate_project.py
          python3 Tools/Build/check_conditional_compilation.py --self-test
          python3 Tools/Build/check_gamelist_scenes.py --self-test
          python3 Tools/Build/check_hud_onscreen.py --self-test
          python3 Tools/Build/check_junie_skills.py --self-test

      - name: Validate project
        run: python3 Tools/CI/validate_project.py --github

      - name: Check conditional compilation
        run: python3 Tools/Build/check_conditional_compilation.py --root Assets

      # Info-level logging must go through CSDebug (a raw Debug.Log bypasses the runtime log
      # level and the release strip) and never carry rich text; the 2026-09 sweep took the
      # console from 999+ lines at boot to near-silent and this is what keeps it there.
      - name: Check console logging
        run: |
          set -euo pipefail
          python3 Tools/Build/check_console_logging.py --self-test
          python3 Tools/Build/check_console_logging.py

      # Fair play never locks paid content (Threat Board R14, Docs/AntiCheat/README.md 4.6): fair-play code may not
      # name the episode-token / store layer, and that layer may not name a fair-play type or record.
      - name: Check fair play never touches paid content
        run: |
          set -euo pipefail
          python3 Tools/Build/check_fairplay_paid_content.py --self-test
          python3 Tools/Build/check_fairplay_paid_content.py

      # Fair play reads no more from the device than it needs (Threat Board R16, Docs/AntiCheat/README.md 5): no
      # fingerprints, processes, installed apps, registry or outside files in fair-play code; no QUERY_ALL_PACKAGES
      # and no kernel driver anywhere in the project.
      - name: Check fair play reads nothing extra from the device
        run: |
          set -euo pipefail
          python3 Tools/Build/check_fairplay_device_reads.py --self-test
          python3 Tools/Build/check_fairplay_device_reads.py

      # The server sells vessels and Hangar levels at the prices authored in Unity (economy.js CATALOG, written by
      # author_economy_catalog.py). A price changed in an asset without re-running it would be charged the old price.
      - name: Check the server's shop prices match the shipped assets
        run: |
          set -euo pipefail
          python3 Tools/Build/author_economy_catalog.py --self-test
          python3 Tools/Build/author_economy_catalog.py --check

      # Every arcade card in every SO_GameList must name a scene that exists AND
      # is enabled in the build settings. A card that fails this renders normally
      # and dies at the moment a player commits to it, and nothing in the Editor
      # reports it - the SceneName field is still a valid string.
      - name: Check arcade roster scenes
        run: python3 Tools/Build/check_gamelist_scenes.py

      # Every active element of the shared in-game HUD must resolve onto the
      # canvas in every scene that instances it. Joust shipped its toast feed at
      # x -1416 against 2272-2304 everywhere else - drawn every match, seen by
      # nobody, and invisible to every check the project had.
      - name: Check HUD elements resolve on-screen
        run: python3 Tools/Build/check_hud_onscreen.py

      # The offline twin of FrogletTools > Vessels > Audit Vessel Skimmers (DT-002). The
      # self-test gates (negative controls on a synthetic hull); the fleet report is printed so
      # a hull that starts failing is visible in the log. It does not --check yet: six hulls are
      # standing exceptions until DT-002 is resolved, and a per-hull allow list would hide a
      # new fault on a listed hull.
      - name: Audit vessel skimmers (offline)
        run: |
          set -euo pipefail
          python3 Tools/Build/audit_vessel_skimmers.py --self-test
          python3 Tools/Build/audit_vessel_skimmers.py
          # Same shape for Validate Lifeform Crystals (DT-002's 34): self-test gates, report prints.
          python3 Tools/Build/audit_lifeform_crystals.py --self-test
          python3 Tools/Build/audit_lifeform_crystals.py

      # The input-only contract for every AI pilot and the parity replay (LOCKED: a pilot or a
      # replay that writes pose, course, speed, crystal or score records a result the vessel never
      # flew). check_ai_no_state_writes.py --self-test gates; --check scans the four trees.
      - name: Check the AI and replay trees never write vessel state
        run: |
          set -euo pipefail
          python3 Tools/Build/check_ai_no_state_writes.py --self-test
          python3 Tools/Build/check_ai_no_state_writes.py --check

      # Every asset generator must still match what it authored. CLAUDE.md records the failure
      # class this closes: a generator that owns an asset's content is a second place every schema
      # change has to land, and it fails months later on somebody else's branch; on 2026-09-09 six
      # of eight mode generators were red and nobody was reading them. The whole family runs in
      # about a minute. A generator that cannot --check is a bug in the generator.
      # Tools/CI/check_generators.sh runs EVERY generator and names every red one (log, annotations,
      # step summary, the `red` output); it no longer stops at the first, which hid three of the four
      # red generators on 2026-11-01 (Docs/Reports/CI.md).
      - name: Check every asset generator against disk
        id: generators
        run: bash Tools/CI/check_generators.sh

      # The call-to-action badge surface is retired (F7). This fails if any of it comes
      # back - the components, the indicator objects, or the two prefabs.
      - name: Check the call-to-action surface stays retired
        # Runs even after an earlier check failed, so one run reports every failure.
        if: ${{ !cancelled() }}
        run: python3 Tools/Build/retire_call_to_action.py --check

      # JetBrains Junie reads skills only from .junie/skills, which is a symlink to
      # .claude/skills. A real directory there is a second hand-maintained copy, and
      # the last one drifted 3,920 diff lines before anybody noticed. See AGENTS.md.
      - name: Check .junie/skills is a link, not a copy
        # Runs even after an earlier check failed, so one run reports every failure.
        if: ${{ !cancelled() }}
        run: python3 Tools/Build/check_junie_skills.py

      # Authoritative --check gates for shader families the C# clock validator
      # does not name (back-face fade, destruction sight, opaque+clip, corridor)
      # plus the families it does (shield morph, flight, explosion erosion, jiggle, live suction,
      # spindle death fade).
      # No Unity licence; seconds. A graph revert that the edit-mode suite would
      # also catch still fails here on a machine with no Editor.
      - name: Check prism shader wiring
        # Runs even after an earlier check failed, so one run reports every failure.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 Tools/Shaders/wire_prism_backface_fade.py --check
          python3 Tools/Shaders/wire_prism_destruction_sight.py --check
          python3 Tools/Shaders/enable_prism_alpha_clip.py --check
          python3 Tools/Shaders/wire_prism_occlusion_corridor.py --check
          python3 Tools/Shaders/wire_prism_shield_morph.py --check
          python3 Tools/Shaders/wire_prism_flight_clock.py --check
          python3 Tools/Shaders/wire_prism_explosion_erosion.py --check
          python3 Tools/Shaders/wire_prism_jiggle_clock.py --check
          python3 Tools/Shaders/wire_prism_suction_clock.py --check
          python3 Tools/Shaders/wire_prism_spindle_death_clock.py --check

  # ──────────────────────────────────────────────
  #  2. Unity compile - the only stage that sees a real build break
  #
  #  GitHub-hosted ubuntu, in GameCI's Unity image (pinned by digest in UNITY_IMAGE),
  #  licensed from the `unity-ci` GitHub Environment. No self-hosted runner, so nothing
  #  persistent for a public repository's jobs to reach: every run gets a fresh VM that
  #  is discarded afterwards. Docs/BUILD_AND_DELIVERY.md section 10.1.
  #
  #  Two compilers, chosen per run by which secrets the environment holds:
  #    unity       the real editor: licence activated, edit-mode suite run (forces a
  #                full compile of runtime, editor and test assemblies), licence returned.
  #    refcompile  Tools/Build/unity_refcompile, used ONLY while no Unity licence is in
  #                the environment. Compiles the player config against real Unity
  #                reference assemblies with Roslyn. It catches `error CS` in project
  #                code but is NOT a Unity compile (no asset import, no editor
  #                assemblies, no tests); the run says so in a warning and the report.
  # ──────────────────────────────────────────────
  unity:
    name: Unity compile
    needs: validate
    # Nothing a build reads was touched -> skip. A docs-only push cannot break a build.
    if: needs.validate.outputs.unity_relevant == 'true'
    runs-on: ubuntu-latest
    # A cold Library (first run, or a packages-lock change) imports the whole project.
    timeout-minutes: 180
    # The licence lives here, never in repository secrets or this file. Restrict the
    # environment's deployment branches to bleeding-edge and development so no other
    # branch's copy of a workflow can read the licence (section 10.1, Secrets).
    environment: unity-ci
    env:
      # GameCI's editor image for the project's exact version, pinned by digest so a
      # retag upstream cannot change what runs here. The version check below fails the
      # job when ProjectSettings/ProjectVersion.txt moves on, so an upgrade re-pins this.
      UNITY_VERSION: 6000.3.17f1
      UNITY_IMAGE: unityci/editor:ubuntu-6000.3.17f1-base-3.2.2@sha256:05833b20f5b696c30a9ff2cbcf87dce201f5bf4be46b8fe8409a3085aacd6407
    outputs:
      # 'compile' | 'tests' | 'infra' | 'ok' - read by the report and autofix jobs;
      # autofix only acts on 'compile'.
      failure_kind: ${{ steps.classify.outputs.failure_kind }}
      # 'unity' | 'refcompile' - which compiler ran; the report names it.
      compile_mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Choose the compiler
        id: mode
        env:
          # Through env, never interpolated into the script.
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && { [ -n "$UNITY_SERIAL" ] || [ -n "$UNITY_LICENSE" ]; }; then
            echo "mode=unity" >> "$GITHUB_OUTPUT"
            echo "Compiler: Unity $UNITY_VERSION (licence found in the unity-ci environment)."
          else
            echo "mode=refcompile" >> "$GITHUB_OUTPUT"
            echo "::warning title=Not a Unity compile::No Unity licence in the unity-ci environment (UNITY_EMAIL + UNITY_PASSWORD + UNITY_SERIAL or UNITY_LICENSE), so this run uses the reference compile (Tools/Build/unity_refcompile). It catches C# errors in project code; it does not import assets, compile editor assemblies or run tests. Docs/BUILD_AND_DELIVERY.md section 10.1."
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true         # 25 native plugin binaries; the editor loads the Linux ones
          fetch-depth: 1

      - name: Check the pinned editor matches the project
        run: |
          set -euo pipefail
          EXPECTED="$(grep '^m_EditorVersion:' ProjectSettings/ProjectVersion.txt | awk '{print $2}')"
          echo "Project expects Unity $EXPECTED; this job pins $UNITY_VERSION."
          case "$UNITY_IMAGE" in
            *"ubuntu-$EXPECTED-"*) ;;
            *) echo "::error::UNITY_IMAGE does not match ProjectSettings/ProjectVersion.txt ($EXPECTED). Re-pin UNITY_VERSION and UNITY_IMAGE (tag and digest from hub.docker.com/r/unityci/editor) in bleeding-edge-guard.yml."
               exit 1 ;;
          esac
          [ "$EXPECTED" = "$UNITY_VERSION" ] || { echo "::error::UNITY_VERSION ($UNITY_VERSION) does not match the project ($EXPECTED)."; exit 1; }

      # ── unity mode ──────────────────────────────
      # The image is ~5 GB compressed and Library/ for this project is large. The
      # runner's preinstalled SDKs this job never uses are deleted to make room.
      - name: Free disk space
        if: steps.mode.outputs.mode == 'unity'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost || true
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      # One Library per day per packages-lock: saved by the first run of the day,
      # restored (newest first) by every later one. A day key, not a commit key, so a
      # branch that sees dozens of pushes a day does not churn the repository's 10 GB
      # cache budget with near-identical multi-GB entries.
      - name: Name the Library cache
        if: steps.mode.outputs.mode == 'unity'
        id: libkey
        run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Library
        if: steps.mode.outputs.mode == 'unity'
        id: lib
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Library
          key: unity-library-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json') }}-${{ steps.libkey.outputs.day }}
          restore-keys: |
            unity-library-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json') }}-
            unity-library-${{ env.UNITY_VERSION }}-

      - name: Read the serial from a Personal licence file
        if: steps.mode.outputs.mode == 'unity'
        id: serial
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          # A Pro/Plus seat gives UNITY_SERIAL directly. A Personal licence is the
          # Unity_lic.ulf file's contents in UNITY_LICENSE; its serial is the base64
          # DeveloperData value minus a 4-byte prefix (GameCI's own conversion).
          # Written to a file under RUNNER_TEMP, masked, never echoed.
          set -euo pipefail
          umask 077
          if [ -n "$UNITY_SERIAL" ]; then
            printf '%s' "$UNITY_SERIAL" > "$RUNNER_TEMP/unity-serial"
          else
            python3 -I -c 'import base64,os,re,sys
          m = re.search(r"<DeveloperData Value=\"([^\"]+)\"", os.environ["UNITY_LICENSE"])
          if not m: sys.exit("UNITY_LICENSE does not look like a Unity_lic.ulf (no DeveloperData)")
          sys.stdout.write(base64.b64decode(m.group(1)).decode("latin-1")[4:])' > "$RUNNER_TEMP/unity-serial"
          fi
          echo "::add-mask::$(cat "$RUNNER_TEMP/unity-serial")"

      - name: Compile with Unity
        if: steps.mode.outputs.mode == 'unity'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -uo pipefail
          # The serial reaches the container through the environment, never argv.
          UNITY_SERIAL="$(cat "$RUNNER_TEMP/unity-serial")"; export UNITY_SERIAL
          rm -f "$RUNNER_TEMP/unity-serial"
          docker run --rm \
            --workdir /github/workspace \
            --env UNITY_EMAIL --env UNITY_PASSWORD --env UNITY_SERIAL \
            --env GITHUB_WORKSPACE=/github/workspace \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            "$UNITY_IMAGE" \
            bash /github/workspace/Tools/CI/unity_compile_in_container.sh
          echo "Container exited with $?."
          # The container ran as root; hand its output back to the runner user so the
          # cache save and artifact upload can read it.
          sudo chown -R "$(id -u):$(id -g)" Library editmode-results.xml unity-editmode.log unity-exit-code.txt 2>/dev/null || true

      # Saved even when the compile or the tests failed: the imported assets are
      # still good, and a cold import is the expensive part. Not on an exact hit.
      - name: Save Library
        if: always() && steps.mode.outputs.mode == 'unity' && steps.lib.outputs.cache-hit != 'true' && hashFiles('Library/ArtifactDB') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Library
          key: unity-library-${{ env.UNITY_VERSION }}-${{ hashFiles('Packages/packages-lock.json') }}-${{ steps.libkey.outputs.day }}

      # ── refcompile mode ─────────────────────────
      - name: Restore the reference-compile cache
        if: steps.mode.outputs.mode == 'refcompile'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: refcache
        with:
          path: ~/.cache/unity_refcompile
          key: unity-refcompile-${{ hashFiles('Packages/packages-lock.json', 'Tools/Build/unity_refcompile/fetch.py', 'Tools/Build/unity_refcompile/source_patches.json') }}
          restore-keys: unity-refcompile-

      - name: Reference compile (no Unity licence)
        if: steps.mode.outputs.mode == 'refcompile'
        run: |
          set +e
          set -uo pipefail
          export UNITY_REFCOMPILE_CACHE="$HOME/.cache/unity_refcompile"
          export DOTNET_ROOT=/usr/share/dotnet
          bash Tools/Build/unity_refcompile/run.sh --quiet-buckets 2>&1 | tee unity-editmode.log
          echo "${PIPESTATUS[0]}" > unity-exit-code.txt
          echo "Reference compile exited with $(cat unity-exit-code.txt)."

      - name: Save the reference-compile cache
        if: always() && steps.mode.outputs.mode == 'refcompile' && steps.refcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/unity_refcompile
          key: unity-refcompile-${{ hashFiles('Packages/packages-lock.json', 'Tools/Build/unity_refcompile/fetch.py', 'Tools/Build/unity_refcompile/source_patches.json') }}

      # ── both modes ──────────────────────────────
      - name: Classify the result
        id: classify
        if: always()
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          TESTS_BLOCKING: ${{ vars.UNITY_TESTS_BLOCKING }}
        run: |
          # `set +e` is REQUIRED and must be explicit: GitHub runs bash with -e as a
          # flag, and here exit codes are the signal, not an abort.
          set +e
          set -uo pipefail
          LOG=unity-editmode.log
          CODE="$(cat unity-exit-code.txt 2>/dev/null)"
          [ -n "$CODE" ] || CODE=none
          echo "Compiler: $MODE, exit code: $CODE"

          # Any `error CS` is a compile break, whatever the exit code says.
          # (refcompile lists only project-code errors; its unverifiable buckets are counted, not listed.)
          if [ -f "$LOG" ] && grep -qE '\berror CS[0-9]+' "$LOG"; then
            echo "failure_kind=compile" >> "$GITHUB_OUTPUT"
            echo "::error::The project did not compile ($MODE). This is what breaks the Windows build."
            grep -E '\berror CS[0-9]+' "$LOG" | sort -u | head -40
            {
              echo "### The project did not compile ($MODE)"; echo; echo '```'
              grep -E '\berror CS[0-9]+' "$LOG" | sort -u | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$CODE" = "0" ]; then
            echo "failure_kind=ok" >> "$GITHUB_OUTPUT"
            if [ "$MODE" = unity ]; then echo "Compile clean, edit-mode tests green."
            else echo "Reference compile clean (not a Unity compile)."; fi
            echo "Compile clean ($MODE)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$MODE" = refcompile ]; then
            # Exit 2 = offline with no cache; anything else without an `error CS`
            # line is the tool failing, not the project.
            echo "failure_kind=infra" >> "$GITHUB_OUTPUT"
            echo "::error::The reference compile could not run (exit $CODE). This is the tool or the network, not the project. Read the log above."
            exit 1
          fi

          # unity mode, no `error CS`: no results XML means the editor never reached
          # the test phase (activation, import or a crash) - not a classified break.
          if [ ! -f editmode-results.xml ]; then
            echo "failure_kind=infra" >> "$GITHUB_OUTPUT"
            echo "::error::Unity did not reach the test phase (exit $CODE) and printed no compiler error: licence activation, asset import or an editor crash. Read the editor log artifact."
            exit 1
          fi

          echo "failure_kind=tests" >> "$GITHUB_OUTPUT"
          # Tests, not compilation. Blocking is a repo-variable decision, matching
          # the UNITY_TESTS_BLOCKING convention already used by unity-ci.yml.
          if [ "$TESTS_BLOCKING" = "false" ]; then
            echo "::warning::Edit-mode tests failed, but UNITY_TESTS_BLOCKING is 'false', so this run is not being failed. The project DID compile."
            exit 0
          fi
          echo "::error::Edit-mode tests failed. The project compiled, so this is not a build break. Set UNITY_TESTS_BLOCKING=false to downgrade this to a warning while the suite is greened up."
          exit 1

      # Every run, green or red: the log is what the autofix reads on a break, and on
      # a green run it is where a new warning is found. A few MB; kept 14 days.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: editmode-results-${{ github.run_id }}
          path: |
            editmode-results.xml
            unity-editmode.log
          if-no-files-found: ignore
          retention-days: 14

  # ──────────────────────────────────────────────
  #  3. Report - one tracking issue that says whether trunk is broken right now
  #
  #  GitHub's built-in email only reaches the person whose push failed, which is
  #  the wrong audience: a broken trunk is everyone's problem and the person who
  #  pushed may already be offline. A single labelled issue is opened when trunk
  #  breaks, commented on if it breaks again, and CLOSED when trunk goes green,
  #  so "is bleeding-edge healthy?" is answerable at a glance and everyone
  #  watching the repository is notified. Same convention as the promotion
  #  report in sync-build-branches.yml.
  # ──────────────────────────────────────────────
  report:
    name: Report status
    needs: [validate, unity]
    # Guarded branches only: a dispatch on a scratch branch must not open a
    # "<branch> is broken" issue that notifies everyone watching the repository.
    if: always() && (github.ref == 'refs/heads/bleeding-edge' || github.ref == 'refs/heads/development')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE: ${{ needs.validate.result }}
          UNITY: ${{ needs.unity.result }}
          KIND: ${{ needs.unity.outputs.failure_kind }}
          MODE: ${{ needs.unity.outputs.compile_mode }}
          RED_GENERATORS: ${{ needs.validate.outputs.red_generators }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          # Through env, not pasted into the script: a dispatch can name any branch.
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Classify. A skipped unity job means nothing a build reads changed, so
          # it must not raise an alarm.
          broken=false
          summary=""
          if [ "$VALIDATE" = "failure" ]; then
            broken=true
            summary="Static validation failed."
            if [ -n "$RED_GENERATORS" ]; then
              summary="$summary Generators whose \`--check\` is red: $(printf '`%s` ' $RED_GENERATORS)"
            fi
          elif [ "$UNITY" = "failure" ]; then
            broken=true
            case "$MODE" in
              unity)      compiler="Unity" ;;
              refcompile) compiler="the reference compile (no Unity licence in the unity-ci environment)" ;;
              *)          compiler="the compile job" ;;
            esac
            case "$KIND" in
              compile) summary="**The project did not compile** ($compiler). This is what breaks the Windows build." ;;
              tests)   summary="Edit-mode tests failed. The project DID compile, so this is not a build break." ;;
              infra)   summary="The compile job could not run ($compiler): licence activation, the network, an asset import or an editor crash. Not classified as a code break." ;;
              *)       summary="The Unity job failed before it could classify the failure." ;;
            esac
          fi

          # The label must exist before it can be filtered on. Creating it is
          # idempotent; a 422 just means it is already there.
          gh api -X POST "repos/$GITHUB_REPOSITORY/labels" \
            -f name="$REPORT_LABEL" -f color="b60205" \
            -f description="Bleeding-edge verification status" >/dev/null 2>&1 || true

          num=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=$REPORT_LABEL&per_page=1" \
                  --jq '.[0].number // empty')

          if [ "$broken" = false ]; then
            # Only speak on the transition back to green. Commenting on every
            # healthy push would make the notification worthless.
            if [ -n "$num" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$num/comments" \
                -f body="Recovered. \`$SHA\` verified clean. [Run]($RUN_URL)" >/dev/null
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$num" -f state=closed >/dev/null
              echo "Trunk recovered; closed issue #$num."
            else
              echo "Trunk is green and no issue was open. Nothing to report."
            fi
            exit 0
          fi

          # Heredoc, not printf: the table rows must be separated by SINGLE
          # newlines or GitHub does not render them as a table at all.
          # Every line stays at the script's indentation: this is inside a YAML
          # block scalar, and a line at column 1 ends the block. YAML strips the
          # common indent, so the heredoc still reaches bash flush-left.
          body=$(cat <<EOF
          $summary

          | | |
          |---|---|
          | Commit | \`$SHA\` |
          | Pushed by | @$ACTOR |
          | Run | $RUN_URL |
          | Static validation | $VALIDATE |
          | Unity compile | $UNITY${KIND:+ ($KIND)}${MODE:+, compiler: $MODE} |

          Open the run above for the failing output. A compile break prints its
          \`error CS\` lines inline and attaches the full editor log as an artifact.

          This issue closes itself automatically when $REF_NAME next verifies clean.
          EOF
          )

          if [ -z "$num" ]; then
            num=$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues" \
                    -f title="$REPORT_TITLE" -f body="$body" \
                    -f "labels[]=$REPORT_LABEL" --jq .number)
            echo "Opened issue #$num."
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$num/comments" \
              -f body="$body" >/dev/null
            echo "Trunk still broken; commented on issue #$num."
          fi

  # ──────────────────────────────────────────────
  #  4. Autofix - repair and open a PR, never push to trunk
  # ──────────────────────────────────────────────
  autofix:
    name: Attempt autofix
    needs: [validate, unity]
    # Fires on a static-validation failure or a COMPILE failure only. A red
    # edit-mode test means the project compiled fine, so it is not a build break
    # and must not send Claude editing gameplay code to make a test pass.
    # `always()` is required because a needs-failure would otherwise skip this
    # job outright. A skipped `unity` job yields an empty output, so the second
    # clause is false on a docs-only push.
    # Guarded branches only, like the report: a scratch-branch dispatch (the
    # negative control in section 10.1) must not spend a Claude run or open a PR.
    if: >-
      always() &&
      (github.ref == 'refs/heads/bleeding-edge' || github.ref == 'refs/heads/development') && (
        needs.validate.result == 'failure' ||
        needs.unity.outputs.failure_kind == 'compile'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    # Serialised and never cancelled: two overlapping failures must not race to
    # open duplicate pull requests.
    concurrency:
      group: branch-guard-autofix-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Either credential works and they bill differently, so the choice is the
      # repo owner's rather than this file's:
      #   ANTHROPIC_API_KEY       - console.anthropic.com key, billed to the
      #                             Anthropic org that owns it (API credits).
      #   CLAUDE_CODE_OAUTH_TOKEN - Claude Code token, drawn against that
      #                             account's Pro/Max subscription instead.
      # Set whichever one you want to pay from; the key wins if both are set.
      - name: Check for a credential
        id: key
        env:
          # Through env rather than inline interpolation, so neither value is
          # ever pasted into the generated shell script.
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$KEY" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "Authenticating with ANTHROPIC_API_KEY (billed to that Anthropic organization)."
          elif [ -n "$OAUTH" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "Authenticating with CLAUDE_CODE_OAUTH_TOKEN (drawn against that Claude Code subscription)."
          else
            echo "::warning::Neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set, so no autofix was attempted. Verification still failed; it simply was not repaired automatically."
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.key.outputs.have == 'true'
        with:
          lfs: false
          fetch-depth: 0

      - name: Fix and open a PR against the guarded branch
        if: steps.key.outputs.have == 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1 — pinned to a commit; re-pin deliberately
        with:
          # Both are passed; the action ignores whichever is empty. See the
          # credential check above for which one bills where.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Commit ${{ github.sha }} broke verification on ${{ github.ref_name }}.

            Reproduce first. Run, in this order, and read the output (the same
            steps as the "Static validation" job; keep the two lists in step):
              python3 Tools/CI/test_validate_project.py
              python3 Tools/Build/check_conditional_compilation.py --self-test
              python3 Tools/Build/check_gamelist_scenes.py --self-test
              python3 Tools/Build/check_hud_onscreen.py --self-test
              python3 Tools/Build/check_junie_skills.py --self-test
              python3 Tools/CI/validate_project.py
              python3 Tools/Build/check_conditional_compilation.py --root Assets
              python3 Tools/Build/check_console_logging.py --self-test
              python3 Tools/Build/check_console_logging.py
              python3 Tools/Build/check_fairplay_paid_content.py --self-test
              python3 Tools/Build/check_fairplay_paid_content.py
              python3 Tools/Build/check_fairplay_device_reads.py --self-test
              python3 Tools/Build/check_fairplay_device_reads.py
              python3 Tools/Build/author_economy_catalog.py --check
              python3 Tools/Build/check_gamelist_scenes.py
              python3 Tools/Build/check_hud_onscreen.py
              python3 Tools/Build/audit_vessel_skimmers.py --self-test
              python3 Tools/Build/audit_lifeform_crystals.py --self-test
              python3 Tools/Build/check_ai_no_state_writes.py --self-test
              python3 Tools/Build/check_ai_no_state_writes.py --check
              bash Tools/CI/check_generators.sh
              python3 Tools/Build/retire_call_to_action.py --check
              python3 Tools/Build/check_junie_skills.py
              python3 Tools/Shaders/wire_prism_backface_fade.py --check
              python3 Tools/Shaders/wire_prism_destruction_sight.py --check
              python3 Tools/Shaders/enable_prism_alpha_clip.py --check
              python3 Tools/Shaders/wire_prism_occlusion_corridor.py --check
              python3 Tools/Shaders/wire_prism_shield_morph.py --check
              python3 Tools/Shaders/wire_prism_flight_clock.py --check
              python3 Tools/Shaders/wire_prism_explosion_erosion.py --check
              python3 Tools/Shaders/wire_prism_jiggle_clock.py --check
              python3 Tools/Shaders/wire_prism_suction_clock.py --check
              python3 Tools/Shaders/wire_prism_spindle_death_clock.py --check
            A generator that reports DRIFT, or a self-test that reports FAILED, is
            not one of the mechanical classes below: an asset generator owns its
            assets, so drift means a hand edit or a schema change the generator
            has not taken yet, and re-running the generator would erase the
            first. Name the generator or the failing control and stop.
            If those pass, the failure came from the Unity compile stage instead.
            Read the "Unity compile" job's log in this workflow run; its
            "Classify the result" step prints the first 40 `error CS...` lines
            (and says whether Unity or the reference compile produced them), and
            the full log is
            attached to this run as the `editmode-results-${{ github.run_id }}`
            artifact.

            You are only ever invoked for a COMPILE break or a static-validation
            break. A failing edit-mode TEST does not reach you, so never change
            gameplay code to make an assertion pass.

            Read CLAUDE.md and the skills in .claude/skills/ before changing
            anything. They carry this project's conventions and the traps
            specific to it, including Docs/CONDITIONAL_COMPILATION.md, which
            covers the guard mistakes that are invisible in the Editor and only
            ever surface as a red automated build.

            Fix ONLY what the verification reports. The recurring cases are:
              - editor-only API reaching player code, fixed by moving the file
                under an Editor/ folder or wrapping it in #if UNITY_EDITOR
              - a using directive guarded by #if UNITY_EDITOR above a class
                declaration that is NOT guarded, so the Release player build
                cannot resolve MonoBehaviour
              - namespace and using-directive errors, including base classes
                that need qualifying, such as UnityEditor.Editor
              - a MonoBehaviour whose class name does not match its file name
              - a scene listed in ProjectSettings/EditorBuildSettings.asset that
                no longer exists on disk
              - an SO_GameList card naming a scene that is missing from the
                build settings. The repair is almost always to ADD the scene to
                ProjectSettings/EditorBuildSettings.asset, not to delete the
                card: a new mode whose scene was never registered looks
                identical here to a retired mode whose scene was deleted, and
                only the second one wants the card removed. If you cannot tell
                which it is from the diff, stop and say so.

            Do not refactor, do not reformat untouched code, and do not change
            gameplay behaviour. If the failure is not one of these mechanical
            classes, stop and explain in the pull request body rather than
            guessing. A wrong autofix on trunk costs more than a red check.

            Re-run both validators until they pass, then open a pull request
            against ${{ github.ref_name }}.

            NEVER push directly to ${{ github.ref_name }}. It is an integration trunk
            and an unreviewed autofix landing on it is worse than the break it
            was meant to repair.

            Before opening anything, check whether an open pull request from a
            previous autofix attempt already exists (look for the head branch
            prefix `autofix/${{ github.ref_name }}`). If one does, push to that branch and
            update its description instead of opening a second pull request.
